con le Armi","cat":"armi","group":"","src":"B p.57-58, 90","aliases":["abilità con le armi","abilità con l'arma","etichetta dell'abilità"],"html":"<p>Tecniche di combattimento specifiche apprese dal vagabondo. Per usarne una devi:</p><ol><li>averla <strong>segnata sul playbook</strong>;</li><li>impugnare un'arma con <strong>l'etichetta di quella abilità</strong> (salvo le abilità \"senza etichetta\" come <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a>, <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a>, <a class=\"xl\" href=\"#scagliare\" data-id=\"scagliare\">Scagliare (Hurl)</a>, <a class=\"xl\" href=\"#zampe-martello\" data-id=\"zampe-martello\">Zampe di Martello (Hammerpaws)</a>, <a class=\"xl\" href=\"#svolazzo-terrificante\" data-id=\"svolazzo-terrificante\">Svolazzo Terrificante (Frightful Flourish)</a>);</li><li>soddisfare le condizioni narrative dell'innesco.</li></ol><p>Alla creazione ne scegli una tra le quattro in grassetto del playbook; poi si ottengono con l'<a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a> (max 7) o tramite mosse (segnate con una barra, non contano nel limite).</p>","text":"Tecniche di combattimento specifiche apprese dal vagabondo. Per usarne una devi: 1. averla segnata sul playbook; 2. impugnare un'arma con l'etichetta di quella abilità (salvo le abilità \"senza etichetta\" come Confondere i Sensi, Improvvisare un'Arma, Scagliare (Hurl), Zampe di Martello (Hammerpaws), Svolazzo Terrificante (Frightful Flourish)); 3. soddisfare le condizioni narrative dell'innesco. Alla creazione ne scegli una tra le quattro in grassetto del playbook; poi si ottengono con l'Avanzamento (max 7) o tramite mosse (segnate con una barra, non contano nel limite).","back":["creazione","avanzamento","mosse-armi-indice"]},{"id":"distanze","title":"Distanze","cat":"armi","group":"","src":"B p.91","aliases":["distanza","distanze","a contatto","ravvicinata","distanza lunga"],"html":"<p>Tre distanze narrative:</p><ul><li><strong>A contatto</strong>: puoi sentire il suo respiro; per lottare, toccare, abbracciare.</li><li><strong>Ravvicinata</strong>: abbastanza vicino da sentirlo parlare e raggiungerlo con un balzo; per spade, pugni, lanci.</li><li><strong>Lunga</strong>: devi alzare la voce per farti sentire; per archi, osservare da lontano.</li></ul><p>Oltre la distanza lunga non si combatte (salvo <a class=\"xl\" href=\"#tiro-lungo\" data-id=\"tiro-lungo\">Tiro Lungo (Long Shot)</a>). Senza un'arma per quella distanza non puoi infliggere danni né usare mosse a quella distanza. Ogni arma ha almeno una distanza; distanze extra aumentano il <a class=\"xl\" href=\"#valore\" data-id=\"valore\">Valore</a>.</p>","text":"Tre distanze narrative: - A contatto: puoi sentire il suo respiro; per lottare, toccare, abbracciare. - Ravvicinata: abbastanza vicino da sentirlo parlare e raggiungerlo con un balzo; per spade, pugni, lanci. - Lunga: devi alzare la voce per farti sentire; per archi, osservare da lontano. Oltre la distanza lunga non si combatte (salvo Tiro Lungo (Long Shot)). Senza un'arma per quella distanza non puoi infliggere danni né usare mosse a quella distanza. Ogni arma ha almeno una distanza; distanze extra aumentano il Valore.","back":["mosse-armi-indice","equipaggiamento"]},{"id":"attaccare-mischia","title":"Attaccare in Mischia","cat":"armi","group":"","src":"B p.92-94","aliases":["attaccare in mischia","attacchi in mischia","scambiatevi i danni","scambiare i danni"],"html":"<div class=\"move\"><p><strong>Quando attacchi in mischia a distanza ravvicinata o a contatto, tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: <strong>vi scambiate i danni</strong> e scegli 3 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: <strong>vi scambiate i danni</strong> e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica (di solito subisci il colpo senza infliggerlo).</li></ul><p>Opzioni:</p><ul><li>infliggi un danno grave (+1);</li><li>subisci un danno leggero (-1);</li><li>modifichi la distanza di uno step;</li><li>impressioni, sgomenti o intimorisci l'avversario.</li></ul></div><ul><li>Serve uno scambio di colpi: se il nemico non può reagire lo colpisci e basta. Include le scazzottate a distanza (se lo afferri è <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a>).</li><li>Di base un'arma infligge 1-ferita, i pugni 1-fatica. L'avversario può anche essere un piccolo gruppo (vedi Gruppi di PNG, <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>).</li><li>\"Impressioni\" spesso significa un danno al <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a>.</li></ul>","text":"Quando attacchi in mischia a distanza ravvicinata o a contatto, tira su Vigore. - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica (di solito subisci il colpo senza infliggerlo). Opzioni: - infliggi un danno grave (+1); - subisci un danno leggero (-1); - modifichi la distanza di uno step; - impressioni, sgomenti o intimorisci l'avversario. - Serve uno scambio di colpi: se il nemico non può reagire lo colpisci e basta. Include le scazzottate a distanza (se lo afferri è Lottare con un Nemico). - Di base un'arma infligge 1-ferita, i pugni 1-fatica. L'avversario può anche essere un piccolo gruppo (vedi Gruppi di PNG, Assaltare un Gruppo). - \"Impressioni\" spesso significa un danno al Morale.","back":["vigore","mosse-armi-indice","tag-acciaio-conigli","tag-acciaio-topi","tag-rapida","pb-avventuriero-sottomettere","pb-esule-grande","pb-pirata-spadaccino","pb-cacciatore-trappole","tag-avvolgente","tag-concavo","tag-ferro-ratti","tag-maldestro","tag-sbilanciato"]},{"id":"lottare","title":"Lottare con un Nemico","cat":"armi","group":"","src":"B p.94-95","aliases":["lottare con un nemico","lottare","lotti"],"html":"<div class=\"move\"><p><strong>Quando lotti corpo a corpo con un nemico, tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli tu la prima opzione; poi tu e l'avversario scegliete <strong>contemporaneamente</strong>, finché uno dei due non si ritira, sviene o muore.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: fin dal primo scambio tu e l'avversario scegliete <strong>contemporaneamente</strong> un'opzione, e continuate così finché uno dei due non si ritira, sviene o muore.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica (di solito l'avversario ha la meglio).</li></ul><p>Opzioni:</p><ul><li><strong>sferri un colpo rapido</strong>: infliggi ferite;</li><li><strong>lo sfinisci</strong>: il nemico segna fatica;</li><li><strong>sfrutti una sua debolezza</strong>: segna fatica per infliggere 2-ferite;</li><li><strong>ti ritiri</strong>: ti disimpegni a distanza ravvicinata.</li></ul></div><p>Si lotta senza armi e contro un solo nemico alla volta. Scrivete le scelte e rivelatele insieme; gli effetti sono simultanei.</p>","text":"Quando lotti corpo a corpo con un nemico, tira su Vigore. - 10+ (successo pieno): scegli tu la prima opzione; poi tu e l'avversario scegliete contemporaneamente, finché uno dei due non si ritira, sviene o muore. - 7-9 (successo parziale): fin dal primo scambio tu e l'avversario scegliete contemporaneamente un'opzione, e continuate così finché uno dei due non si ritira, sviene o muore. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica (di solito l'avversario ha la meglio). Opzioni: - sferri un colpo rapido: infliggi ferite; - lo sfinisci: il nemico segna fatica; - sfrutti una sua debolezza: segna fatica per infliggere 2-ferite; - ti ritiri: ti disimpegni a distanza ravvicinata. Si lotta senza armi e contro un solo nemico alla volta. Scrivete le scelte e rivelatele insieme; gli effetti sono simultanei.","back":["vigore","mosse-armi-indice","attaccare-mischia","tag-flessibile","pb-ladro-zampine","pb-campione-abilita","pb-cercatore-terreno","tag-uncinata","tag-distraente","tag-brutale","tag-difficile-impugnare"]},{"id":"prendere-mira","title":"Prendere la Mira","cat":"armi","group":"","src":"B p.96-97","aliases":["prendere la mira","prendi la mira"],"html":"<div class=\"move\"><p><strong>Quando prendi la mira a distanza lunga su un nemico vulnerabile, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi ferite e scegli 1:<ul><li>un secondo colpo prima che corra al riparo (infliggi ancora ferite);</li><li>mantieni nascosta la tua posizione.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi ferite.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: manchi il bersaglio; il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>\"Vulnerabile\" significa che può davvero essere colpito (non coperto da un'armatura completa o dai merli). Usare un arco a distanza ravvicinata senza abilità o etichette offre al GM un'opportunità d'oro.</p>","text":"Quando prendi la mira a distanza lunga su un nemico vulnerabile, tira su Destrezza. - 10+ (successo pieno): infliggi ferite e scegli 1: - un secondo colpo prima che corra al riparo (infliggi ancora ferite); - mantieni nascosta la tua posizione. - 7-9 (successo parziale): infliggi ferite. - 6- (fallimento): manchi il bersaglio; il GM ti dice cosa succede e la situazione si complica. \"Vulnerabile\" significa che può davvero essere colpito (non coperto da un'armatura completa o dai merli). Usare un arco a distanza ravvicinata senza abilità o etichette offre al GM un'opportunità d'oro.","back":["destrezza","mosse-armi-indice","incalzare-gruppo","tag-alto-libraggio","pb-giudice-tiro","pb-cacciatore-trappole","tag-vistosa"]},{"id":"assaltare-gruppo","title":"Assaltare un Gruppo","cat":"armi","group":"","src":"B p.97-98","aliases":["assaltare un gruppo","Storm a Group"],"html":"<div class=\"move\"><p><strong>Quando assalti un gruppo di nemici in mischia, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il gruppo ha la meglio; il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: ottieni tutte e quattro le opzioni, e una ha effetto doppio.</li></ul><p>Opzioni:</p><ul><li><strong>gliela fai vedere</strong>: infliggi 2 danni al morale;</li><li><strong>li cogli alla sprovvista</strong>: infliggi 2-fatica;</li><li><strong>schivi al meglio</strong>: subisci un danno leggero (-1);</li><li><strong>li metti l'uno contro l'altro</strong>: segna un'altra fatica e si infliggono danni da soli.</li></ul></div><p>Distanza ravvicinata o a contatto; armi veloci e lunghe o ad ampio raggio. Ricorda che i gruppi infliggono più danni.</p>","text":"Quando assalti un gruppo di nemici in mischia, segna fatica e tira su Vigore. - 10+ (successo pieno): vi scambiate i danni e scegli 2 opzioni. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il gruppo ha la meglio; il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): ottieni tutte e quattro le opzioni, e una ha effetto doppio. Opzioni: - gliela fai vedere: infliggi 2 danni al morale; - li cogli alla sprovvista: infliggi 2-fatica; - schivi al meglio: subisci un danno leggero (-1); - li metti l'uno contro l'altro: segna un'altra fatica e si infliggono danni da soli. Distanza ravvicinata o a contatto; armi veloci e lunghe o ad ampio raggio. Ricorda che i gruppi infliggono più danni.","back":["vigore","morale","mosse-armi-indice","attaccare-mischia","maestria-armi","tag-impressionante"]},{"id":"colpo-crudele","title":"Colpo Crudele","cat":"armi","group":"","src":"B p.99","aliases":["colpo crudele","Vicious Strike"],"html":"<div class=\"move\"><p><strong>Quando sei a distanza ravvicinata o a contatto e colpisci brutalmente il punto debole di un avversario, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi un danno grave (+1) che il nemico <strong>non può assorbire segnando usura sull'armatura</strong>, e lo colpisci senza essere colpito.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi il danno grave non assorbibile, ma anche lui ti colpisce (o ti afferra).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: lo menomi finché non riceve cure. Scegli 1:<ul><li>non può muoversi;</li><li>non può impugnare armi;</li><li>non può comunicare.</li></ul></li></ul></div><p>Devi conoscere o creare un punto debole. Armi piccole e letali (pugnali).</p>","text":"Quando sei a distanza ravvicinata o a contatto e colpisci brutalmente il punto debole di un avversario, segna fatica e tira su Vigore. - 10+ (successo pieno): infliggi un danno grave (+1) che il nemico non può assorbire segnando usura sull'armatura, e lo colpisci senza essere colpito. - 7-9 (successo parziale): infliggi il danno grave non assorbibile, ma anche lui ti colpisce (o ti afferra). - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): lo menomi finché non riceve cure. Scegli 1: - non può muoversi; - non può impugnare armi; - non può comunicare. Devi conoscere o creare un punto debole. Armi piccole e letali (pugnali).","back":["mosse-armi-indice","armatura","maestria-armi","pb-buongustaio-filetto"]},{"id":"confondere-sensi","title":"Confondere i Sensi","cat":"armi","group":"","src":"B p.100-101","aliases":["confondere i sensi","Confuse Senses"],"html":"<div class=\"move\"><p><strong>Quando sei a contatto o a distanza ravvicinata e lanci qualcosa per confondere i sensi dell'avversario, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: perde l'equilibrio, è accecato o confuso e ottieni un'<strong>opportunità</strong> (di solito elimina l'incertezza: fuggi o colpisci senza altre mosse); gli serve tempo per riprendersi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma hai solo qualche secondo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: scegli 1:<ul><li>confondi un intero gruppo;</li><li>metti fuori gioco un singolo nemico come vuoi.</li></ul></li></ul></div><p><strong>Non richiede etichetta</strong>: basta qualcosa da lanciare. Con un fumogeno puoi colpire un gruppo.</p>","text":"Quando sei a contatto o a distanza ravvicinata e lanci qualcosa per confondere i sensi dell'avversario, tira su Destrezza. - 10+ (successo pieno): perde l'equilibrio, è accecato o confuso e ottieni un'opportunità (di solito elimina l'incertezza: fuggi o colpisci senza altre mosse); gli serve tempo per riprendersi. - 7-9 (successo parziale): come sopra, ma hai solo qualche secondo. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): scegli 1: - confondi un intero gruppo; - metti fuori gioco un singolo nemico come vuoi. Non richiede etichetta: basta qualcosa da lanciare. Con un fumogeno puoi colpire un gruppo.","back":["mosse-armi-indice","abilita-armi","maestria-armi","pb-ciarlatano-sabbia"]},{"id":"disarmare","title":"Disarmare","cat":"armi","group":"","src":"B p.101-102","aliases":["disarmare","disarmi","Disarm"],"html":"<div class=\"move\"><p><strong>Quando sei a distanza ravvicinata e punti a colpire l'arma del nemico, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il nemico sceglie 1:<ul><li>segna 3-fatica;</li><li>perde la presa sull'arma, che finisce fuori portata.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il nemico sceglie 1:<ul><li>segna 2-fatica;</li><li>perde la presa sull'arma, che finisce fuori portata.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: segna 3-fatica <strong>e</strong> perde l'arma.</li></ul></div><p>Se non ha fatica e sceglie di tenere l'arma, sviene o è fuori combattimento. Armi lunghe con guardia (stocchi).</p>","text":"Quando sei a distanza ravvicinata e punti a colpire l'arma del nemico, tira su Destrezza. - 10+ (successo pieno): il nemico sceglie 1: - segna 3-fatica; - perde la presa sull'arma, che finisce fuori portata. - 7-9 (successo parziale): il nemico sceglie 1: - segna 2-fatica; - perde la presa sull'arma, che finisce fuori portata. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): segna 3-fatica e perde l'arma. Se non ha fatica e sceglie di tenere l'arma, sviene o è fuori combattimento. Armi lunghe con guardia (stocchi).","back":["mosse-armi-indice","maestria-armi","pb-nomade-prendo"]},{"id":"fracassare","title":"Fracassare","cat":"armi","group":"","src":"B p.102","aliases":["fracassare","Cleave"],"html":"<div class=\"move\"><p><strong>Quando fracassi le armature dei nemici a distanza ravvicinata, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: sfondi le difese: infliggi <strong>3-usura</strong>.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi 3-usura, ma scegli 1:<ul><li>danneggi la tua arma: segna usura;</li><li>ti esponi e finisci in una brutta posizione.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: infliggi 6-usura; l'eccesso diventa ferite o fatica.</li></ul></div><p>Non puoi usarla con la fatica piena. Se infliggi più usura delle caselle disponibili, l'armatura è distrutta. Armi grosse e pesanti.</p>","text":"Quando fracassi le armature dei nemici a distanza ravvicinata, segna fatica e tira su Vigore. - 10+ (successo pieno): sfondi le difese: infliggi 3-usura. - 7-9 (successo parziale): infliggi 3-usura, ma scegli 1: - danneggi la tua arma: segna usura; - ti esponi e finisci in una brutta posizione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): infliggi 6-usura; l'eccesso diventa ferite o fatica. Non puoi usarla con la fatica piena. Se infliggi più usura delle caselle disponibili, l'armatura è distrutta. Armi grosse e pesanti.","back":["vigore","mosse-armi-indice","maestria-armi"]},{"id":"improvvisare-arma","title":"Improvvisare un'Arma","cat":"armi","group":"","src":"B p.103-104","aliases":["improvvisare un'arma","improvvisi un'arma","arma improvvisata","Improvise","Improvvisare"],"html":"<div class=\"move\"><p><strong>Quando improvvisi un'arma con i materiali che ti circondano, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la costruisci: il GM ne indica la distanza e almeno un'etichetta positiva.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la costruisci, ma oltre all'etichetta positiva ha anche un'etichetta negativa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: scegli tu la distanza e due etichette positive.</li></ul></div><p>Etichette tipiche:</p><ul><li>positive: <a class=\"xl\" href=\"#tag-affilata\" data-id=\"tag-affilata\">Affilata</a>, <a class=\"xl\" href=\"#tag-flessibile\" data-id=\"tag-flessibile\">Flessibile</a>, <a class=\"xl\" href=\"#tag-rapida\" data-id=\"tag-rapida\">Rapida</a>, <a class=\"xl\" href=\"#tag-smussata\" data-id=\"tag-smussata\">Smussata</a>, <a class=\"xl\" href=\"#tag-veloce\" data-id=\"tag-veloce\">Veloce</a>;</li><li>negative: <a class=\"xl\" href=\"#tag-fragile\" data-id=\"tag-fragile\">Fragile</a>, <a class=\"xl\" href=\"#tag-lenta\" data-id=\"tag-lenta\">Lenta</a>, <a class=\"xl\" href=\"#tag-poco-maneggevole\" data-id=\"tag-poco-maneggevole\">Poco maneggevole</a>.</li></ul><p>Un'arma improvvisata <strong>non ha caselle di usura</strong>: se devi segnare usura, si rompe. Non richiede etichetta.</p>","text":"Quando improvvisi un'arma con i materiali che ti circondano, tira su Astuzia. - 10+ (successo pieno): la costruisci: il GM ne indica la distanza e almeno un'etichetta positiva. - 7-9 (successo parziale): la costruisci, ma oltre all'etichetta positiva ha anche un'etichetta negativa. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): scegli tu la distanza e due etichette positive. Etichette tipiche: - positive: Affilata, Flessibile, Rapida, Smussata, Veloce; - negative: Fragile, Lenta, Poco maneggevole. Un'arma improvvisata non ha caselle di usura: se devi segnare usura, si rompe. Non richiede etichetta.","back":["astuzia","mosse-armi-indice","abilita-armi","maestria-armi","pb-ronin-disarmato","tag-di-fortuna"]},{"id":"incalzare-gruppo","title":"Incalzare un Gruppo","cat":"armi","group":"","src":"B p.104-105","aliases":["incalzare un gruppo","incalzare","Harry a Group","Harry"],"html":"<div class=\"move\"><p><strong>Quando incalzi un gruppo di nemici a distanza lunga, segna usura e tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni entrambe le opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: entrambe le opzioni, più 2-ferite o 2-morale aggiuntivi.</li></ul><p>Opzioni:</p><ul><li>infliggi 2 danni al morale;</li><li>li ostacoli o li immobilizzi.</li></ul></div><p>È il fuoco di copertura: solo contro gruppi (per un singolo, <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a>). Archi corti e potenti.</p>","text":"Quando incalzi un gruppo di nemici a distanza lunga, segna usura e tira su Astuzia. - 10+ (successo pieno): ottieni entrambe le opzioni. - 7-9 (successo parziale): scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): entrambe le opzioni, più 2-ferite o 2-morale aggiuntivi. Opzioni: - infliggi 2 danni al morale; - li ostacoli o li immobilizzi. È il fuoco di copertura: solo contro gruppi (per un singolo, Prendere la Mira). Archi corti e potenti.","back":["astuzia","morale","mosse-armi-indice","maestria-armi"]},{"id":"parare","title":"Parare","cat":"armi","group":"","src":"B p.106-107","aliases":["parare","pari","Parry"],"html":"<div class=\"move\"><p><strong>Quando pari gli attacchi di un nemico a distanza ravvicinata, segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il nemico si concentra su di te; ottieni tutte e 3 le opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il nemico si concentra su di te; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: riposta immediata. Scegli 1:<ul><li>2-ferite non assorbibili;</li><li>2-morale;</li><li>2-fatica.</li></ul></li></ul><p>Opzioni:</p><ul><li>infliggi fatica o danni al morale (decide il GM);</li><li>lo disarmi: perde l'arma, che resta a portata di mano;</li><li>non subisci alcun danno.</li></ul></div><p>Non infligge ferite: serve a tenere occupato un nemico. Se non scegli \"nessun danno\", subisci il suo danno base. Armi leggere con protezioni per le mani.</p>","text":"Quando pari gli attacchi di un nemico a distanza ravvicinata, segna fatica e tira su Destrezza. - 10+ (successo pieno): il nemico si concentra su di te; ottieni tutte e 3 le opzioni. - 7-9 (successo parziale): il nemico si concentra su di te; scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): riposta immediata. Scegli 1: - 2-ferite non assorbibili; - 2-morale; - 2-fatica. Opzioni: - infliggi fatica o danni al morale (decide il GM); - lo disarmi: perde l'arma, che resta a portata di mano; - non subisci alcun danno. Non infligge ferite: serve a tenere occupato un nemico. Se non scegli \"nessun danno\", subisci il suo danno base. Armi leggere con protezioni per le mani.","back":["mosse-armi-indice","maestria-armi","legame-veterano","tag-impugnatura-lucertole"]},{"id":"tiro-maestro","title":"Tiro da Maestro","cat":"armi","group":"","src":"B p.107-108","aliases":["tiro da maestro","Trick Shot"],"html":"<div class=\"move\"><p><strong>Quando, a qualsiasi distanza, effettui un tiro studiato per sfruttare l'ambiente, segna usura e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 3 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 2 opzioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: tutte e quattro le opzioni, e colpisci anche un terzo bersaglio.</li></ul><p>Opzioni:</p><ul><li>colpisci il bersaglio scelto entro il raggio, anche se nascosto o al riparo;</li><li>colpisci un secondo bersaglio a tua scelta;</li><li>tagli, rompi o rovesci qualcosa a tua scelta;</li><li>distrai un avversario e ottieni un'occasione.</li></ul></div><p>Solo alle distanze indicate dall'arma. Senza l'abilità questi colpi richiedono <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a>.</p>","text":"Quando, a qualsiasi distanza, effettui un tiro studiato per sfruttare l'ambiente, segna usura e tira su Destrezza. - 10+ (successo pieno): scegli 3 opzioni. - 7-9 (successo parziale): scegli 2 opzioni. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): tutte e quattro le opzioni, e colpisci anche un terzo bersaglio. Opzioni: - colpisci il bersaglio scelto entro il raggio, anche se nascosto o al riparo; - colpisci un secondo bersaglio a tua scelta; - tagli, rompi o rovesci qualcosa a tua scelta; - distrai un avversario e ottieni un'occasione. Solo alle distanze indicate dall'arma. Senza l'abilità questi colpi richiedono Affidarsi al Fato.","back":["mosse-armi-indice","maestria-armi"]},{"id":"tiro-rapido","title":"Tiro Rapido","cat":"armi","group":"","src":"B p.108-109","aliases":["tiro rapido","Quick Shot"],"html":"<div class=\"move\"><p><strong>Quando scagli un tiro rapido su un nemico a distanza ravvicinata, tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi ferite e scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi ferite e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li><li class=\"o-top\"><strong class=\"olab\"><span class=\"res\">12+</span> (trionfo, con la maestria)</strong>: tutte e quattro le opzioni, e infliggi 2-ferite.</li></ul><p>Opzioni:</p><ul><li>non segni usura;</li><li>non segni fatica;</li><li>ti sposti e cambi posizione (e, se vuoi, distanza);</li><li>il nemico non può muoversi perché lo tieni a bada.</li></ul></div><p>Se non scegli le prime due opzioni paghi usura e/o fatica. L'arma deve avere la distanza ravvicinata.</p>","text":"Quando scagli un tiro rapido su un nemico a distanza ravvicinata, tira su Fortuna. - 10+ (successo pieno): infliggi ferite e scegli 2 opzioni. - 7-9 (successo parziale): infliggi ferite e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. - 12+ (trionfo, con la maestria): tutte e quattro le opzioni, e infliggi 2-ferite. Opzioni: - non segni usura; - non segni fatica; - ti sposti e cambi posizione (e, se vuoi, distanza); - il nemico non può muoversi perché lo tieni a bada. Se non scegli le prime due opzioni paghi usura e/o fatica. L'arma deve avere la distanza ravvicinata.","back":["fortuna","mosse-armi-indice","maestria-armi","tag-corda-ingrassata","tag-flettenti-corti"]},{"id":"furia-battaglia","title":"Furia di Battaglia (Battle Fury)","cat":"armi","group":"","src":"VF p.24","aliases":["furia di battaglia","Battle Fury"],"html":"<div class=\"move\"><p><strong>Quando ti lanci in un attacco furioso con arma, denti e artigli a contatto, segna usura sull'arma e tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: <strong>riempi il tracciato della fatica</strong>: per ogni casella segnata così infliggi 2-ferite al bersaglio.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma anche il bersaglio ti infligge il suo danno.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>Vanno bene anche armi a distanza ravvicinata. <em>(trad. non ufficiale)</em></p>","text":"Quando ti lanci in un attacco furioso con arma, denti e artigli a contatto, segna usura sull'arma e tira su Fortuna. - 10+ (successo pieno): riempi il tracciato della fatica: per ogni casella segnata così infliggi 2-ferite al bersaglio. - 7-9 (successo parziale): come sopra, ma anche il bersaglio ti infligge il suo danno. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Vanno bene anche armi a distanza ravvicinata. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"carica","title":"Carica (Charge)","cat":"armi","group":"","src":"VF p.24","aliases":["carica","Charge"],"html":"<div class=\"move\"><p><strong>Quando carichi un avversario a distanza lunga, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: gli infliggi danno al morale e lui sceglie 1:<ul><li>segna 2-fatica;</li><li>si lascia spingere: tu dici dove finisce e a che distanza vi trovate.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lui sceglie 1 tra le due opzioni sopra, senza danno al morale.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando carichi un avversario a distanza lunga, segna fatica e tira su Vigore. - 10+ (successo pieno): gli infliggi danno al morale e lui sceglie 1: - segna 2-fatica; - si lascia spingere: tu dici dove finisce e a che distanza vi trovate. - 7-9 (successo parziale): lui sceglie 1 tra le due opzioni sopra, senza danno al morale. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"scagliare","title":"Scagliare (Hurl)","cat":"armi","group":"","src":"VF p.25","aliases":["scagliare","Hurl"],"html":"<p><strong>Senza etichetta.</strong></p><div class=\"move\"><p><strong>Quando scagli a distanza lunga un'arma o un oggetto pericoloso non fatto per essere lanciato, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: colpisci: segna usura sull'oggetto e infliggi 1-ferita e 1-fatica; scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: colpisci come sopra; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Opzioni:</p><ul><li>segna un'altra usura per infliggere +1-ferita;</li><li>l'oggetto rimbalza in un punto raggiungibile;</li><li>il bersaglio viene atterrato.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando scagli a distanza lunga un'arma o un oggetto pericoloso non fatto per essere lanciato, segna fatica e tira su Vigore. - 10+ (successo pieno): colpisci: segna usura sull'oggetto e infliggi 1-ferita e 1-fatica; scegli 2 opzioni. - 7-9 (successo parziale): colpisci come sopra; scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Opzioni: - segna un'altra usura per infliggere +1-ferita; - l'oggetto rimbalza in un punto raggiungibile; - il bersaglio viene atterrato. (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"affondo","title":"Affondo (Lunge)","cat":"armi","group":"","src":"VF p.25","aliases":["affondo","Lunge"],"html":"<div class=\"move\"><p><strong>Quando sferri un affondo a distanza ravvicinata, scegli da 1 a 3 ferite e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi quel danno <strong>ignorando l'armatura</strong>. Se il bersaglio sopravvive (o ci sono altri nemici) può infliggerti la stessa quantità, approfittando della tua esposizione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma il contraccolpo che puoi subire è di una ferita in più.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando sferri un affondo a distanza ravvicinata, scegli da 1 a 3 ferite e tira su Destrezza. - 10+ (successo pieno): infliggi quel danno ignorando l'armatura. Se il bersaglio sopravvive (o ci sono altri nemici) può infliggerti la stessa quantità, approfittando della tua esposizione. - 7-9 (successo parziale): come sopra, ma il contraccolpo che puoi subire è di una ferita in più. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice","armatura"]},{"id":"combattere-coppia","title":"Combattere in Coppia (Paired Fighting)","cat":"armi","group":"","src":"VF p.26","aliases":["combattere in coppia","Paired Fighting"],"html":"<div class=\"move\"><p><strong>Quando tu e un altro vagabondo combattete schiena contro schiena a distanza ravvicinata, segnate entrambi fatica e uno di voi tira (max +3) con:</strong></p><ul><li>+1 se avete un legame;</li><li>+1 se siete in inferiorità numerica;</li><li>+1 ogni 2 fatica extra segnate insieme.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggete 1-ferita a ogni nemico entro distanza ravvicinata (o 3-ferite a un gruppo) e subite 1-ferita a testa; scegliete 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma scegliete 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM vi dice cosa succede e la situazione si complica.</li></ul><p>Opzioni:</p><ul><li>subite un danno leggero (-1);</li><li>+2-ferite a un bersaglio;</li><li>2-morale;</li><li>vi aprite una via per ritirarvi o avanzare.</li></ul></div><p><strong>Entrambi</strong> devono avere l'abilità e un'arma con l'etichetta. <em>(trad. non ufficiale)</em></p>","text":"Quando tu e un altro vagabondo combattete schiena contro schiena a distanza ravvicinata, segnate entrambi fatica e uno di voi tira (max +3) con: - +1 se avete un legame; - +1 se siete in inferiorità numerica; - +1 ogni 2 fatica extra segnate insieme. Risultati: - 10+ (successo pieno): infliggete 1-ferita a ogni nemico entro distanza ravvicinata (o 3-ferite a un gruppo) e subite 1-ferita a testa; scegliete 2 opzioni. - 7-9 (successo parziale): come sopra, ma scegliete 1 opzione. - 6- (fallimento): il GM vi dice cosa succede e la situazione si complica. Opzioni: - subite un danno leggero (-1); - +2-ferite a un bersaglio; - 2-morale; - vi aprite una via per ritirarvi o avanzare. Entrambi devono avere l'abilità e un'arma con l'etichetta. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"zampe-martello","title":"Zampe di Martello (Hammerpaws)","cat":"armi","group":"","src":"VF p.27","aliases":["zampe di martello","Hammerpaws"],"html":"<p><strong>Senza etichetta.</strong></p><div class=\"move\"><p><strong>Quando combatti disarmato contro un avversario armato a distanza ravvicinata o a contatto, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ti infligge il suo danno; scegli 3 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ti infligge il suo danno; scegli 2 opzioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Opzioni:</p><ul><li>gli infliggi 2-fatica;</li><li>cambi distanza di uno step;</li><li>devii i colpi (danno leggero, -1);</li><li>infliggi usura al suo equipaggiamento;</li><li>gli prendi un oggetto (deve segnare fatica per impedirlo).</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando combatti disarmato contro un avversario armato a distanza ravvicinata o a contatto, tira su Destrezza. - 10+ (successo pieno): ti infligge il suo danno; scegli 3 opzioni. - 7-9 (successo parziale): ti infligge il suo danno; scegli 2 opzioni. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Opzioni: - gli infliggi 2-fatica; - cambi distanza di uno step; - devii i colpi (danno leggero, -1); - infliggi usura al suo equipaggiamento; - gli prendi un oggetto (deve segnare fatica per impedirlo). (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"tiro-preciso","title":"Tiro di Precisione (Pinpoint Shot)","cat":"armi","group":"","src":"VF p.28","aliases":["tiro di precisione","Pinpoint Shot"],"html":"<div class=\"move\"><p><strong>Quando ti prendi il tempo per un tiro di precisione a distanza lunga, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: colpisci esattamente dove vuoi:<ul><li>punto debole di un PNG: 3-ferite non assorbibili;</li><li>punto debole di un oggetto: 2-usura;</li><li>elemento dell'ambiente: lo colpisci, tagli o rompi.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma devi prima spostarti in una posizione migliore: segna fatica.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando ti prendi il tempo per un tiro di precisione a distanza lunga, tira su Astuzia. - 10+ (successo pieno): colpisci esattamente dove vuoi: - punto debole di un PNG: 3-ferite non assorbibili; - punto debole di un oggetto: 2-usura; - elemento dell'ambiente: lo colpisci, tagli o rompi. - 7-9 (successo parziale): come sopra, ma devi prima spostarti in una posizione migliore: segna fatica. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice","armatura"]},{"id":"tiro-lungo","title":"Tiro Lungo (Long Shot)","cat":"armi","group":"","src":"VF p.29","aliases":["tiro lungo","Long Shot"],"html":"<p>Quando tendi l'arco oltre la distanza lunga, segna usura e fatica per effettuare qualsiasi mossa con le armi a distanza lunga tirando su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>, pagando anche gli altri costi della mossa. <strong>I risultati (<span class=\"res\">10+</span>, <span class=\"res\">7-9</span>, <span class=\"res\">6-</span>) sono quelli della mossa che usi.</strong></p><p>L'arma deve avere distanza lunga, questa etichetta e quella della mossa usata. <em>(trad. non ufficiale)</em></p>","text":"Quando tendi l'arco oltre la distanza lunga, segna usura e fatica per effettuare qualsiasi mossa con le armi a distanza lunga tirando su Vigore, pagando anche gli altri costi della mossa. I risultati (10+, 7-9, 6-) sono quelli della mossa che usi. L'arma deve avere distanza lunga, questa etichetta e quella della mossa usata. (trad. non ufficiale)","back":["mosse-armi-indice","distanze","tag-intagliato-gru"]},{"id":"tiro-bruciapelo","title":"Tiro a Bruciapelo (Point-Blank Shot)","cat":"armi","group":"","src":"VF p.29","aliases":["tiro a bruciapelo","Point-Blank Shot"],"html":"<div class=\"move\"><p><strong>Quando tiri a bruciapelo (a contatto), segna fino a 2-usura e fino a 2-fatica e tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi tante ferite quanta usura e fatica hai segnato, e puoi arretrare a distanza ravvicinata prima che reagisca.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi tante ferite quanta usura e fatica hai segnato.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>L'arma non deve avere la distanza a contatto. <em>(trad. non ufficiale)</em></p>","text":"Quando tiri a bruciapelo (a contatto), segna fino a 2-usura e fino a 2-fatica e tira su Fortuna. - 10+ (successo pieno): infliggi tante ferite quanta usura e fatica hai segnato, e puoi arretrare a distanza ravvicinata prima che reagisca. - 7-9 (successo parziale): infliggi tante ferite quanta usura e fatica hai segnato. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. L'arma non deve avere la distanza a contatto. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"cambiare-mano","title":"Cambiare Mano (Switch Hands)","cat":"armi","group":"","src":"VF p.30","aliases":["cambiare mano","Switch Hands"],"html":"<div class=\"move\"><p><strong>Quando cambi la mano dominante nel mezzo di uno scontro prolungato, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Opzioni:</p><ul><li>la nuova mano è fresca: svuota 2-fatica;</li><li>l'avversario è spiazzato: segna morale;</li><li>ottieni un'opportunità: segna fatica per infliggere 2-ferite.</li></ul></div><p>Una volta per scontro. <em>(trad. non ufficiale)</em></p>","text":"Quando cambi la mano dominante nel mezzo di uno scontro prolungato, tira su Destrezza. - 10+ (successo pieno): scegli 2 opzioni. - 7-9 (successo parziale): scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Opzioni: - la nuova mano è fresca: svuota 2-fatica; - l'avversario è spiazzato: segna morale; - ottieni un'opportunità: segna fatica per infliggere 2-ferite. Una volta per scontro. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"spazzata","title":"Spazzata d'Arco (Sweep)","cat":"armi","group":"","src":"RS p.30","aliases":["spazzata","Sweep"],"html":"<div class=\"move\"><p><strong>Quando fai roteare l'arco contro uno o più nemici a distanza ravvicinata (anche se l'arma non ha quella distanza), segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: si disperdono e arretrano di una distanza, creando un'opportunità; in più:<ul><li>inciampano (hai più tempo);</li><li>si scontrano tra loro (1-ferita);</li><li>si spaventano (1-morale).</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: si disperdono e arretrano di una distanza, creando un'opportunità.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando fai roteare l'arco contro uno o più nemici a distanza ravvicinata (anche se l'arma non ha quella distanza), segna fatica e tira su Destrezza. - 10+ (successo pieno): si disperdono e arretrano di una distanza, creando un'opportunità; in più: - inciampano (hai più tempo); - si scontrano tra loro (1-ferita); - si spaventano (1-morale). - 7-9 (successo parziale): si disperdono e arretrano di una distanza, creando un'opportunità. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"colpo-pomo","title":"Colpo di Pomo (Pommel Strike)","cat":"armi","group":"","src":"RS p.30","aliases":["colpo di pomo","Pommel Strike"],"html":"<div class=\"move\"><p><strong>Quando colpisci un nemico a contatto con il pomo della tua arma (anche se l'arma non ha quella distanza), tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il nemico segna 2-fatica e scegli 1:<ul><li>conquisti una posizione vantaggiosa;</li><li>infliggi 1-morale;</li><li>il suo prossimo colpo fa -1 danno.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il nemico segna 2-fatica.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando colpisci un nemico a contatto con il pomo della tua arma (anche se l'arma non ha quella distanza), tira su Fortuna. - 10+ (successo pieno): il nemico segna 2-fatica e scegli 1: - conquisti una posizione vantaggiosa; - infliggi 1-morale; - il suo prossimo colpo fa -1 danno. - 7-9 (successo parziale): il nemico segna 2-fatica. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"svolazzo-terrificante","title":"Svolazzo Terrificante (Frightful Flourish)","cat":"armi","group":"","src":"RS p.31","aliases":["svolazzo terrificante","Frightful Flourish"],"html":"<p><strong>Senza etichetta.</strong></p><div class=\"move\"><p><strong>Quando fai roteare l'arma in modo spettacolare e terrificante ingaggiando un nuovo nemico, tira su <a class=\"xl\" href=\"#carisma\" data-id=\"carisma\">Carisma</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il nemico subisce 2-morale.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il nemico subisce 2-morale, ma segni fatica per lo sforzo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando fai roteare l'arma in modo spettacolare e terrificante ingaggiando un nuovo nemico, tira su Carisma. - 10+ (successo pieno): il nemico subisce 2-morale. - 7-9 (successo parziale): il nemico subisce 2-morale, ma segni fatica per lo sforzo. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"stoccata-sorpresa","title":"Stoccata a Sorpresa (Surprise Jab)","cat":"armi","group":"","src":"RS p.31","aliases":["stoccata a sorpresa","Surprise Jab"],"html":"<div class=\"move\"><p><strong>Quando colpisci con un'arma nascosta a contatto, segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi il danno dell'arma e scegli 3 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi il danno dell'arma e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Opzioni (puoi scegliere più volte la prima):</p><ul><li>danno grave (+1);</li><li>deve segnare 2-fatica o lasciar cadere ciò che tiene;</li><li>gli sottrai qualcosa di vulnerabile (un oggetto, la posizione).</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando colpisci con un'arma nascosta a contatto, segna fatica e tira su Destrezza. - 10+ (successo pieno): infliggi il danno dell'arma e scegli 3 opzioni. - 7-9 (successo parziale): infliggi il danno dell'arma e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Opzioni (puoi scegliere più volte la prima): - danno grave (+1); - deve segnare 2-fatica o lasciar cadere ciò che tiene; - gli sottrai qualcosa di vulnerabile (un oggetto, la posizione). (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"armatura","title":"Armatura e Scudi","cat":"armi","group":"","src":"B p.93, 125","aliases":["armatura","armature","scudo","assorbire"],"html":"<p>Chi indossa armatura o scudo può <strong>segnare usura per ridurre il danno di 1 per ogni usura segnata</strong> (prima di segnare ferite). Alcune mosse impediscono l'assorbimento (<a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a>, <a class=\"xl\" href=\"#affondo\" data-id=\"affondo\">Affondo (Lunge)</a>, <a class=\"xl\" href=\"#tiro-preciso\" data-id=\"tiro-preciso\">Tiro di Precisione (Pinpoint Shot)</a>, etichetta <a class=\"xl\" href=\"#tag-possente\" data-id=\"tag-possente\">Possente</a>). I PNG hanno un unico tracciato di usura. Vedi <a class=\"xl\" href=\"#equipaggiamento-pregenerato\" data-id=\"equipaggiamento-pregenerato\">Equipaggiamento Pregenerato</a>.</p>","text":"Chi indossa armatura o scudo può segnare usura per ridurre il danno di 1 per ogni usura segnata (prima di segnare ferite). Alcune mosse impediscono l'assorbimento (Colpo Crudele, Affondo (Lunge), Tiro di Precisione (Pinpoint Shot), etichetta Possente). I PNG hanno un unico tracciato di usura. Vedi Equipaggiamento Pregenerato.","back":["danno","usura","mosse-armi-indice","tag-precisa"]},{"id":"conflitto-pg","title":"Conflitti tra PG","cat":"regole","group":"","src":"B p.221","aliases":["conflitto tra PG"],"html":"<p>Il gioco non è pensato per scontri tra PG. Se accadono: usate <a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">aiutare o intralciare</a>, <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a>, ricordate i legami e spostate il riflettore alternando, senza favorire nessuno.</p>","text":"Il gioco non è pensato per scontri tra PG. Se accadono: usate aiutare o intralciare, Supplicare un PG, ricordate i legami e spostate il riflettore alternando, senza favorire nessuno.","back":["banda"]},{"id":"maestrie","title":"Maestrie","cat":"avanzamento","group":"","src":"VF p.69-76","aliases":["maestria","maestrie","trionfo","triumph"],"html":"<p>Opzione di <a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a> di <em>Viandanti e Forestieri</em>: <strong>padroneggia una mossa base o fino a due abilità con le armi che già possiedi</strong> (max 2 mosse base e 4 abilità). Una mossa padroneggiata ha un quarto livello di risultato, il <strong>trionfo (<span class=\"res\">12+</span>)</strong>. Non esistono maestrie per le mosse base con le armi.</p><p>Vedi <a class=\"xl\" href=\"#maestria-base\" data-id=\"maestria-base\">Maestrie delle Mosse Base</a> e <a class=\"xl\" href=\"#maestria-armi\" data-id=\"maestria-armi\">Maestrie delle Abilità con le Armi</a>.</p>","text":"Opzione di Avanzamento di Viandanti e Forestieri: padroneggia una mossa base o fino a due abilità con le armi che già possiedi (max 2 mosse base e 4 abilità). Una mossa padroneggiata ha un quarto livello di risultato, il trionfo (12+). Non esistono maestrie per le mosse base con le armi. Vedi Maestrie delle Mosse Base e Maestrie delle Abilità con le Armi.","back":["tiro","mosse-base-indice","avanzamento","mosse-armi-indice"]},{"id":"maestria-base","title":"Maestrie delle Mosse Base","cat":"avanzamento","group":"","src":"VF p.70-72","aliases":["maestrie delle mosse base"],"html":"<p>Con <strong><span class=\"res\">12+</span></strong> sulle mosse base in cui hai la maestria, oltre agli effetti del <span class=\"res\">10+</span> (salvo diversa indicazione):</p><ul><li><strong><a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'impresa</a></strong>: scegli 1:<ul><li>compi subito una seconda impresa adatta (anche se non la possiedi) come con <span class=\"res\">10+</span>;</li><li>svuota 2-fatica.</li></ul></li><li><strong><a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le intenzioni</a></strong>: annota il suo nome: da ora sai sempre se ti mente; se è già annotato, +1 continuo agendo sulle risposte.</li><li><strong><a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere</a></strong>: puoi segnare fatica per trattarla come un <span class=\"res\">12+</span> su <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a>, ignorando la Reputazione.</li><li><strong><a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare</a></strong>: chiedi anche \"Come potrei ___?\"; seguendo la risposta prendi <span class=\"res\">12+</span> sulla prima mossa.</li><li><strong><a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare</a></strong>: ci crede totalmente; puoi ripetere lo stesso inganno con <span class=\"res\">10+</span> senza tirare.</li><li><strong><a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al fato</a></strong>: riesci senza costi e ottieni un'immediata fortuna.</li><li><strong><a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere</a></strong>: scegli 1:<ul><li>2-ferite ai nemici vicini;</li><li>distruggi qualcosa di molto più grande;</li><li>svuota 2-consumo.</li></ul></li></ul>","text":"Con 12+ sulle mosse base in cui hai la maestria, oltre agli effetti del 10+ (salvo diversa indicazione): - Tentare un'impresa: scegli 1: - compi subito una seconda impresa adatta (anche se non la possiedi) come con 10+; - svuota 2-fatica. - Capire le intenzioni: annota il suo nome: da ora sai sempre se ti mente; se è già annotato, +1 continuo agendo sulle risposte. - Convincere: puoi segnare fatica per trattarla come un 12+ su Influenzare un PNG, ignorando la Reputazione. - Valutare: chiedi anche \"Come potrei ___?\"; seguendo la risposta prendi 12+ sulla prima mossa. - Ingannare: ci crede totalmente; puoi ripetere lo stesso inganno con 10+ senza tirare. - Affidarsi al fato: riesci senza costi e ottieni un'immediata fortuna. - Distruggere: scegli 1: - 2-ferite ai nemici vicini; - distruggi qualcosa di molto più grande; - svuota 2-consumo.","back":["affidarsi-fato","maestrie","tag-ammaliante"]},{"id":"maestria-armi","title":"Maestrie delle Abilità con le Armi","cat":"avanzamento","group":"","src":"VF p.73-76","aliases":["maestrie delle abilità con le armi"],"html":"<p>Con <span class=\"res\">12+</span>:</p><ul><li><strong><a class=\"xl\" href=\"#fracassare\" data-id=\"fracassare\">Fracassare</a></strong>: 6-usura; l'eccesso diventa ferite o fatica.</li><li><strong><a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i sensi</a></strong>: confondi un intero gruppo, o metti fuori gioco un nemico come vuoi.</li><li><strong><a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a></strong>: segna 3-fatica <em>e</em> perde l'arma.</li><li><strong><a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare</a></strong>: +2-ferite o +2-morale.</li><li><strong><a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare</a></strong>: scegli distanza e due etichette positive.</li><li><strong><a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a></strong>: riposta: 2-ferite non assorbibili, 2-morale o 2-fatica.</li><li><strong><a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro rapido</a></strong>: tutte e quattro le opzioni e 2-ferite.</li><li><strong><a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare</a></strong>: tutte e quattro, una con effetto doppio.</li><li><strong><a class=\"xl\" href=\"#tiro-maestro\" data-id=\"tiro-maestro\">Tiro da maestro</a></strong>: tutte e quattro e un terzo bersaglio.</li><li><strong><a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo crudele</a></strong>: lo menomi (non si muove, non impugna armi o non comunica) finché non è curato.</li></ul>","text":"Con 12+: - Fracassare: 6-usura; l'eccesso diventa ferite o fatica. - Confondere i sensi: confondi un intero gruppo, o metti fuori gioco un nemico come vuoi. - Disarmare: segna 3-fatica e perde l'arma. - Incalzare: +2-ferite o +2-morale. - Improvvisare: scegli distanza e due etichette positive. - Parare: riposta: 2-ferite non assorbibili, 2-morale o 2-fatica. - Tiro rapido: tutte e quattro le opzioni e 2-ferite. - Assaltare: tutte e quattro, una con effetto doppio. - Tiro da maestro: tutte e quattro e un terzo bersaglio. - Colpo crudele: lo menomi (non si muove, non impugna armi o non comunica) finché non è curato.","back":["maestrie"]},{"id":"equipaggiamento","title":"Equipaggiamento","cat":"equipaggiamento","group":"","src":"B p.58-60, 181-185","aliases":["equipaggiamento","equipaggiamenti","oggetto"],"html":"<p>L'<strong>equipaggiamento</strong> sono gli oggetti importanti, grandi, specifici e non sostituibili (arma, armatura, scudo). In termini di regole è qualcosa con <strong><a class=\"xl\" href=\"#etichette\" data-id=\"etichette\">Etichette dell'Equipaggiamento</a></strong> e un tracciato di <strong><a class=\"xl\" href=\"#usura\" data-id=\"usura\">Usura</a></strong>. Gli oggetti minori rientrano nel <a class=\"xl\" href=\"#consumo\" data-id=\"consumo\">Consumo</a>. Ogni arma ha almeno una <a class=\"xl\" href=\"#distanze\" data-id=\"distanze\">distanza</a>.</p><p>Vedi <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>, <a class=\"xl\" href=\"#valore\" data-id=\"valore\">Valore</a>, <a class=\"xl\" href=\"#comprare-vendere\" data-id=\"comprare-vendere\">Comprare, Vendere e Costruire</a>, <a class=\"xl\" href=\"#equipaggiamento-pregenerato\" data-id=\"equipaggiamento-pregenerato\">Equipaggiamento Pregenerato</a>.</p>","text":"L'equipaggiamento sono gli oggetti importanti, grandi, specifici e non sostituibili (arma, armatura, scudo). In termini di regole è qualcosa con Etichette dell'Equipaggiamento e un tracciato di Usura. Gli oggetti minori rientrano nel Consumo. Ogni arma ha almeno una distanza. Vedi Ingombro, Valore, Comprare, Vendere e Costruire, Equipaggiamento Pregenerato.","back":["creazione","usura"]},{"id":"ingombro","title":"Ingombro","cat":"equipaggiamento","group":"","src":"B p.59-60, 183","aliases":["Ingombro","appesantito"],"html":"<p>Di base puoi portare <strong>4-Ingombro</strong> (5 con Vigore +1, 3 con Vigore -1). Oggetti piccoli e leggeri: 0; grandi e pesanti: 1; voluminosi (spadone) possono costare 2. È ciò che gli altri vedono addosso a te. Oltre il limite sei <strong>appesantito</strong> (il GM agisce di conseguenza); mai oltre il doppio. Nelle rovine conta per <a class=\"xl\" href=\"#ritirata\" data-id=\"ritirata\">ritirarsi in superficie</a>.</p>","text":"Di base puoi portare 4-Ingombro (5 con Vigore +1, 3 con Vigore -1). Oggetti piccoli e leggeri: 0; grandi e pesanti: 1; voluminosi (spadone) possono costare 2. È ciò che gli altri vedono addosso a te. Oltre il limite sei appesantito (il GM agisce di conseguenza); mai oltre il doppio. Nelle rovine conta per ritirarsi in superficie.","back":["vigore","creazione","equipaggiamento","ritirata","tag-leggero","tag-cinghie-lontre"]},{"id":"valore","title":"Valore","cat":"equipaggiamento","group":"","src":"B p.60, 183-184","aliases":["Valore"],"html":"<p>Il <strong>Valore</strong> rappresenta astrattamente il denaro (ogni fazione ha la sua moneta; diffuso il baratto). <strong>1 casella di consumo ≈ 1-Valore.</strong></p><div class=\"tw\"><table><thead><tr><th>Valore</th><th>Esempi</th></tr></thead><tbody><tr><td>1</td><td>Cibo per un giorno, impacco d'erbe, sacchetto di monete, notte in locanda</td></tr><tr><td>2</td><td>Semplice pugnale, attrezzi da contadino, mantello da viaggio</td></tr><tr><td>3-4</td><td>Semplice spada o arco, armatura di pelle, scudo, carriola, settimana in locanda</td></tr><tr><td>5-6</td><td>Buona spada o bell'arco, cotta di maglia, carretto, due settimane in locanda</td></tr><tr><td>7-10</td><td>Arma eccellente, armatura di piastre di qualità, forziere d'oro, piccola barca</td></tr></tbody></table></div><p><strong>Valore di un equipaggiamento</strong> = caselle di usura + distanze extra + etichette speciali + etichette delle mosse con le armi − etichette negative.</p>","text":"Il Valore rappresenta astrattamente il denaro (ogni fazione ha la sua moneta; diffuso il baratto). 1 casella di consumo ≈ 1-Valore. Valore Esempi ------ 1 Cibo per un giorno, impacco d'erbe, sacchetto di monete, notte in locanda 2 Semplice pugnale, attrezzi da contadino, mantello da viaggio 3-4 Semplice spada o arco, armatura di pelle, scudo, carriola, settimana in locanda 5-6 Buona spada o bell'arco, cotta di maglia, carretto, due settimane in locanda 7-10 Arma eccellente, armatura di piastre di qualità, forziere d'oro, piccola barca Valore di un equipaggiamento = caselle di usura + distanze extra + etichette speciali + etichette delle mosse con le armi − etichette negative.","back":["distanze","equipaggiamento"]},{"id":"comprare-vendere","title":"Comprare, Vendere e Costruire","cat":"equipaggiamento","group":"","src":"B p.184-185","aliases":["comprare","vendere","costruire equipaggiamento"],"html":"<ul><li>Gli oggetti comuni si comprano nelle radure con un mercato pagando il Valore, senza mosse se il GM è d'accordo; vendere un oggetto semplice svuota consumo o dà monete.</li><li>Prezzi variabili di ±1-2 Valore; oltre, il PNG ti adora o ti sta truffando. Puoi usare <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>, <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>, <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a>.</li><li>Oggetti particolari o in grandi quantità sollevano sospetti.</li><li>Solo il <a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Mastro</a> costruisce (con <a class=\"xl\" href=\"#pb-mastro-cassetta\" data-id=\"pb-mastro-cassetta\">Cassetta degli Attrezzi</a>); costo minimo = Valore dell'oggetto. Migliorare un oggetto richiede un maestro artigiano.</li><li>Le etichette devono essere coerenti con l'oggetto.</li></ul>","text":"- Gli oggetti comuni si comprano nelle radure con un mercato pagando il Valore, senza mosse se il GM è d'accordo; vendere un oggetto semplice svuota consumo o dà monete. - Prezzi variabili di ±1-2 Valore; oltre, il PNG ti adora o ti sta truffando. Puoi usare Convincere un PNG, Ingannare un PNG, Chiedere un Favore. - Oggetti particolari o in grandi quantità sollevano sospetti. - Solo il Mastro costruisce (con Cassetta degli Attrezzi); costo minimo = Valore dell'oggetto. Migliorare un oggetto richiede un maestro artigiano. - Le etichette devono essere coerenti con l'oggetto.","back":["equipaggiamento"]},{"id":"etichette","title":"Etichette dell'Equipaggiamento","cat":"equipaggiamento","group":"","src":"B p.186-189; VF p.81-84; RS p.53-57","aliases":["etichette","etichetta"],"html":"<p>Ogni etichetta positiva +1-Valore, ogni negativa −1. Puoi inventarne di nuove: più sono potenti, più dovrebbero avere un costo d'uso (fatica, usura, consumo).</p><p><strong>Positive</strong>: <a class=\"xl\" href=\"#tag-prova-freccia\" data-id=\"tag-prova-freccia\">A prova di freccia</a>, <a class=\"xl\" href=\"#tag-acciaio-conigli\" data-id=\"tag-acciaio-conigli\">Acciaio dei Conigli</a>, <a class=\"xl\" href=\"#tag-acciaio-gatti\" data-id=\"tag-acciaio-gatti\">Acciaio dei Gatti</a>, <a class=\"xl\" href=\"#tag-acciaio-topi\" data-id=\"tag-acciaio-topi\">Acciaio dei Topi</a>, <a class=\"xl\" href=\"#tag-acciaio-volpi\" data-id=\"tag-acciaio-volpi\">Acciaio delle Volpi</a>, <a class=\"xl\" href=\"#tag-affilata\" data-id=\"tag-affilata\">Affilata</a>, <a class=\"xl\" href=\"#tag-allungo\" data-id=\"tag-allungo\">Allungo</a>, <a class=\"xl\" href=\"#tag-alto-libraggio\" data-id=\"tag-alto-libraggio\">Alto Libraggio</a>, <a class=\"xl\" href=\"#tag-amichevole\" data-id=\"tag-amichevole\">Amichevole</a>, <a class=\"xl\" href=\"#tag-buona-fattura\" data-id=\"tag-buona-fattura\">Buona Fattura</a>, <a class=\"xl\" href=\"#tag-cerimoniale\" data-id=\"tag-cerimoniale\">Cerimoniale</a>, <a class=\"xl\" href=\"#tag-comodo\" data-id=\"tag-comodo\">Comodo</a>, <a class=\"xl\" href=\"#tag-corda-ingrassata\" data-id=\"tag-corda-ingrassata\">Corda Ingrassata</a>, <a class=\"xl\" href=\"#tag-da-lancio\" data-id=\"tag-da-lancio\">Da Lancio</a>, <a class=\"xl\" href=\"#tag-dardo-ferro\" data-id=\"tag-dardo-ferro\">Dardo di Ferro</a>, <a class=\"xl\" href=\"#tag-durevole\" data-id=\"tag-durevole\">Durevole</a>, <a class=\"xl\" href=\"#tag-firma\" data-id=\"tag-firma\">Firma</a>, <a class=\"xl\" href=\"#tag-flessibile\" data-id=\"tag-flessibile\">Flessibile</a>, <a class=\"xl\" href=\"#tag-flettenti-corti\" data-id=\"tag-flettenti-corti\">Flettenti Corti</a>, <a class=\"xl\" href=\"#tag-forgiato-aquile\" data-id=\"tag-forgiato-aquile\">Forgiato dalle Aquile</a>, <a class=\"xl\" href=\"#tag-grande\" data-id=\"tag-grande\">Grande</a>, <a class=\"xl\" href=\"#tag-grilletto\" data-id=\"tag-grilletto\">Grilletto Facile</a>, <a class=\"xl\" href=\"#tag-ingannevole\" data-id=\"tag-ingannevole\">Ingannevole</a>, <a class=\"xl\" href=\"#tag-kit-guaritore\" data-id=\"tag-kit-guaritore\">Kit del Guaritore</a>, <a class=\"xl\" href=\"#tag-kit-ladro\" data-id=\"tag-kit-ladro\">Kit del Ladro</a>, <a class=\"xl\" href=\"#tag-lussuoso\" data-id=\"tag-lussuoso\">Lussuoso</a>, <a class=\"xl\" href=\"#tag-modesto\" data-id=\"tag-modesto\">Modesto</a>, <a class=\"xl\" href=\"#tag-possente\" data-id=\"tag-possente\">Possente</a>, <a class=\"xl\" href=\"#tag-potente\" data-id=\"tag-potente\">Potente</a>, <a class=\"xl\" href=\"#tag-rapida\" data-id=\"tag-rapida\">Rapida</a>, <a class=\"xl\" href=\"#tag-smussata\" data-id=\"tag-smussata\">Smussata</a>, <a class=\"xl\" href=\"#tag-spesso\" data-id=\"tag-spesso\">Spesso</a>, <a class=\"xl\" href=\"#tag-tonificante\" data-id=\"tag-tonificante\">Tonificante</a>, <a class=\"xl\" href=\"#tag-veloce\" data-id=\"tag-veloce\">Veloce</a>, <a class=\"xl\" href=\"#tag-versatile\" data-id=\"tag-versatile\">Versatile</a>.</p><p><strong>Negative</strong>: <a class=\"xl\" href=\"#tag-brutto\" data-id=\"tag-brutto\">Brutto</a>, <a class=\"xl\" href=\"#tag-fragile\" data-id=\"tag-fragile\">Fragile</a>, <a class=\"xl\" href=\"#tag-ingombrante\" data-id=\"tag-ingombrante\">Ingombrante</a>, <a class=\"xl\" href=\"#tag-lenta\" data-id=\"tag-lenta\">Lenta</a>, <a class=\"xl\" href=\"#tag-empio\" data-id=\"tag-empio\">Empio</a>, <a class=\"xl\" href=\"#tag-odiato\" data-id=\"tag-odiato\">Odiato</a>, <a class=\"xl\" href=\"#tag-pesante\" data-id=\"tag-pesante\">Pesante</a>, <a class=\"xl\" href=\"#tag-scadente\" data-id=\"tag-scadente\">Scadente</a>, <a class=\"xl\" href=\"#tag-scomoda\" data-id=\"tag-scomoda\">Scomoda</a>, <a class=\"xl\" href=\"#tag-poco-maneggevole\" data-id=\"tag-poco-maneggevole\">Poco Maneggevole</a>.</p><p><strong>Viandanti e Forestieri</strong> (VF p.81-84, trad. non ufficiale)</p><ul><li>Positive: <a class=\"xl\" href=\"#tag-accurata\" data-id=\"tag-accurata\">Accurata</a>, <a class=\"xl\" href=\"#tag-uncinata\" data-id=\"tag-uncinata\">Uncinata</a>, <a class=\"xl\" href=\"#tag-mimetica\" data-id=\"tag-mimetica\">Mimetica</a>, <a class=\"xl\" href=\"#tag-catartico\" data-id=\"tag-catartico\">Catartico</a>, <a class=\"xl\" href=\"#tag-comune\" data-id=\"tag-comune\">Comune</a>, <a class=\"xl\" href=\"#tag-disarmante\" data-id=\"tag-disarmante\">Disarmante</a>, <a class=\"xl\" href=\"#tag-distraente\" data-id=\"tag-distraente\">Distraente</a>, <a class=\"xl\" href=\"#tag-camuffata\" data-id=\"tag-camuffata\">Camuffata</a>, <a class=\"xl\" href=\"#tag-nascosta\" data-id=\"tag-nascosta\">Nascosta</a>, <a class=\"xl\" href=\"#tag-impressionante\" data-id=\"tag-impressionante\">Impressionante</a>, <a class=\"xl\" href=\"#tag-incendiario\" data-id=\"tag-incendiario\">Incendiario</a>, <a class=\"xl\" href=\"#tag-intimidatoria\" data-id=\"tag-intimidatoria\">Intimidatoria</a>, <a class=\"xl\" href=\"#tag-ispirante\" data-id=\"tag-ispirante\">Ispirante</a>, <a class=\"xl\" href=\"#tag-corroborante\" data-id=\"tag-corroborante\">Corroborante</a>, <a class=\"xl\" href=\"#tag-leggendario\" data-id=\"tag-leggendario\">Leggendario</a>, <a class=\"xl\" href=\"#tag-leggero\" data-id=\"tag-leggero\">Leggero</a>, <a class=\"xl\" href=\"#tag-brutale\" data-id=\"tag-brutale\">Brutale</a>, <a class=\"xl\" href=\"#tag-avvelenata\" data-id=\"tag-avvelenata\">Avvelenata</a>, <a class=\"xl\" href=\"#tag-precisa\" data-id=\"tag-precisa\">Precisa</a>, <a class=\"xl\" href=\"#tag-rinforzata\" data-id=\"tag-rinforzata\">Rinforzata</a>, <a class=\"xl\" href=\"#tag-robusto\" data-id=\"tag-robusto\">Robusto</a>.</li><li>Negative: <a class=\"xl\" href=\"#tag-vistosa\" data-id=\"tag-vistosa\">Vistosa</a>, <a class=\"xl\" href=\"#tag-maledetto\" data-id=\"tag-maledetto\">Maledetto</a>, <a class=\"xl\" href=\"#tag-pericolosa\" data-id=\"tag-pericolosa\">Pericolosa</a>, <a class=\"xl\" href=\"#tag-difficile-impugnare\" data-id=\"tag-difficile-impugnare\">Difficile da Impugnare</a>, <a class=\"xl\" href=\"#tag-riconoscibile\" data-id=\"tag-riconoscibile\">Riconoscibile</a>, <a class=\"xl\" href=\"#tag-immorale\" data-id=\"tag-immorale\">Immorale</a>, <a class=\"xl\" href=\"#tag-compromettente\" data-id=\"tag-compromettente\">Compromettente</a>, <a class=\"xl\" href=\"#tag-di-fortuna\" data-id=\"tag-di-fortuna\">Di Fortuna</a>, <a class=\"xl\" href=\"#tag-rumoroso\" data-id=\"tag-rumoroso\">Rumoroso</a>, <a class=\"xl\" href=\"#tag-ricambi-rari\" data-id=\"tag-ricambi-rari\">Ricambi Rari</a>.</li></ul><p><strong>Rovine e Spedizioni</strong> (RS p.53-57, trad. non ufficiale)</p><ul><li>Positive: <a class=\"xl\" href=\"#tag-elsa-tassi\" data-id=\"tag-elsa-tassi\">Elsa dei Tassi</a>, <a class=\"xl\" href=\"#tag-ammaliante\" data-id=\"tag-ammaliante\">Ammaliante</a>, <a class=\"xl\" href=\"#tag-avvolgente\" data-id=\"tag-avvolgente\">Avvolgente</a>, <a class=\"xl\" href=\"#tag-concav ive: Vistosa, Maledetto, Pericolosa, Difficile da Impugnare, Riconoscibile, Immorale, Compromettente, Di Fortuna, Rumoroso, Ricambi Rari. Rovine e Spedizioni (RS p.53-57, trad. non ufficiale) - Positive: Elsa dei Tassi, Ammaliante, Avvolgente, Concavo, Stoffa dei Corvidi, Intagliato dalle Gru, Deviante, Col Sigillo, Affascinante, Impugnatura delle Lucertole, Minaccioso, Cinghie delle Lontre, Vessillo di Raduno, Ferro dei Ratti, Squarciante, Ben Stagionato, Specializzato, Silenzioso, Simbolico, Affusolato, Spinoso, Ben Tenuto. - Negative: In Prestito, Friabile, Gravoso, Maldestro, Di Contrabbando, Ambito, Su Misura, Inquietante, Sgargiante, Maglia Larga, Logoro, Legno Tenero, Sospetto, Sbilanciato, Insignificante.","back":["equipaggiamento"]},{"id":"tag-prova-freccia","title":"A Prova di Freccia","cat":"etichette","group":"","src":"B p.186","aliases":["A Prova di Freccia"],"html":"<p>+ Ignora il primo colpo di frecce che ti infligge ferite in una scena. (Armatura)</p>","text":"+ Ignora il primo colpo di frecce che ti infligge ferite in una scena. (Armatura)","back":["etichette"]},{"id":"tag-acciaio-conigli","title":"Acciaio dei Conigli","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Conigli"],"html":"<p>+ Segna usura per <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su Destrezza invece di Vigore. (Armi)</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 3 opzioni di <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"+ Segna usura per attaccare in mischia tirando su Destrezza invece di Vigore. (Armi) - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni di Attaccare in Mischia. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["etichette"]},{"id":"tag-acciaio-gatti","title":"Acciaio dei Gatti","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Gatti"],"html":"<p>+ Segna usura quando attacchi in mischia per cambiare distanza di uno step, anche con un fallimento. (Armature, armi)</p>","text":"+ Segna usura quando attacchi in mischia per cambiare distanza di uno step, anche con un fallimento. (Armature, armi)","back":["etichette"]},{"id":"tag-acciaio-topi","title":"Acciaio dei Topi","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Topi"],"html":"<p>+ Segna usura per <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su Astuzia invece di Vigore. (Armi)</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 3 opzioni di <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"+ Segna usura per attaccare in mischia tirando su Astuzia invece di Vigore. (Armi) - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni di Attaccare in Mischia. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si co
