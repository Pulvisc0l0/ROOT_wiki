 non sostituisce <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>. Rischi: attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Dare ordini e prendere decisioni tattiche, posizionare alleati e PNG esattamente dove servono (anche in Flashback). Funziona solo con chi già ti ascolta: non sostituisce Convincere un PNG. Rischi: attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"piazzare-trappola","title":"Piazzare Trappole (Set Trap)","cat":"imprese","group":"","src":"VF p.43","aliases":["Piazzare Trappole","Set Trap"],"html":"<p>Preparare imboscate o trappole semplici. Una trappola contro un singolo bersaglio può sostituire <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a>; per sfruttare un'imboscata contro un gruppo serve poi attaccare alle spalle. Rischi: venire scoperto, consumare risorse, lasciare prove. <em>(traduzione non ufficiale)</em></p>","text":"Preparare imboscate o trappole semplici. Una trappola contro un singolo bersaglio può sostituire Attaccare alle Spalle; per sfruttare un'imboscata contro un gruppo serve poi attaccare alle spalle. Rischi: venire scoperto, consumare risorse, lasciare prove. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"seguire-tracce","title":"Seguire le Tracce (Tracking)","cat":"imprese","group":"","src":"VF p.43","aliases":["Seguire le Tracce","Tracking"],"html":"<p>Inseguire qualcuno, leggere orme, seguire una pista di indizi. Non serve a restare nascosti (per quello <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a>/<a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>). Rischi: venire scoperto, cacciarsi nel pericolo, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Inseguire qualcuno, leggere orme, seguire una pista di indizi. Non serve a restare nascosti (per quello Nascondersi/Sgattaiolare). Rischi: venire scoperto, cacciarsi nel pericolo, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"usare-congegno","title":"Usare un Congegno (Use Device)","cat":"imprese","group":"","src":"VF p.43-44","aliases":["Usare un Congegno","Use Device"],"html":"<p>Azionare macchinari, armi antiche o <a class=\"xl\" href=\"#reliquie\" data-id=\"reliquie\">Reliquie degli Antichi</a>, manovre acrobatiche con veicoli (deltaplani, carri meccanici). Rischi: rompere qualcosa, cacciarsi nel pericolo, risultato debole. <em>(traduzione non ufficiale)</em></p>","text":"Azionare macchinari, armi antiche o Reliquie degli Antichi, manovre acrobatiche con veicoli (deltaplani, carri meccanici). Rischi: rompere qualcosa, cacciarsi nel pericolo, risultato debole. (traduzione non ufficiale)","back":["imprese-indice","rovine-indice"]},{"id":"reputazione-indice","title":"Mosse di Reputazione","cat":"indici","group":"","src":"B p.111-120; VF p.31-41; RS p.33-37","aliases":["mosse di reputazione"],"html":"<p>Si tira sulla <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con la fazione coinvolta.</p><p><strong>Manuale base</strong></p><ul><li><a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a> — qualsiasi Reputazione</li><li><a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a> — qualsiasi Reputazione</li><li><a class=\"xl\" href=\"#attirare-attenzione\" data-id=\"attirare-attenzione\">Attirare l'Attenzione</a> — richiede -2 o meno</li><li><a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> — richiede +2 o più</li><li><a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> — richiede -3</li><li><a class=\"xl\" href=\"#pretendere-risorse\" data-id=\"pretendere-risorse\">Pretendere Risorse</a> — richiede +3</li></ul><p><strong>Viandanti e Forestieri</strong></p><ul><li><a class=\"xl\" href=\"#appoggiare-leader\" data-id=\"appoggiare-leader\">Appoggiare un Nuovo Leader</a> (+1), <a class=\"xl\" href=\"#screditare-leader\" data-id=\"screditare-leader\">Screditare un Leader</a> (+1), <a class=\"xl\" href=\"#guidare-truppe\" data-id=\"guidare-truppe\">Guidare le Truppe in Battaglia</a> (+3), <a class=\"xl\" href=\"#intimidire-truppe\" data-id=\"intimidire-truppe\">Intimidire le Truppe Nemiche</a> (-2)</li><li>Di fazione (+2): <a class=\"xl\" href=\"#nuovo-progetto\" data-id=\"nuovo-progetto\">Pianificare un Nuovo Progetto (Marchesato)</a> (Marchesato), <a class=\"xl\" href=\"#burocrazia\" data-id=\"burocrazia\">Manovrare la Burocrazia (Aquile)</a> (Aquile), <a class=\"xl\" href=\"#rivolta-mossa\" data-id=\"rivolta-mossa\">Incitare alla Rivolta (Alleanza)</a> (Alleanza), <a class=\"xl\" href=\"#predicare\" data-id=\"predicare\">Predicare ai Fedeli (Lucertole)</a> (Lucertole), <a class=\"xl\" href=\"#commercio-sancito\" data-id=\"commercio-sancito\">Commercio Sancito (Compagnia del Fiume)</a> (Fiume), <a class=\"xl\" href=\"#reti-criminali\" data-id=\"reti-criminali\">Sfruttare le Reti Criminali (Corvidi)</a> (Corvidi), <a class=\"xl\" href=\"#permessi\" data-id=\"permessi\">Richiedere Permessi (Granducato)</a> (Granducato)</li></ul><p><strong>Rovine e Spedizioni</strong></p><ul><li><a class=\"xl\" href=\"#forgiare-resistenza\" data-id=\"forgiare-resistenza\">Forgiare la Resistenza</a> (+2), <a class=\"xl\" href=\"#nemici-dei-nemici\" data-id=\"nemici-dei-nemici\">Chiamare i Nemici dei Tuoi Nemici</a> (-3), <a class=\"xl\" href=\"#impressionare-pubblico\" data-id=\"impressionare-pubblico\">Impressionare il Pubblico</a> (+2 Abitanti)</li><li>Di fazione (+2): <a class=\"xl\" href=\"#aizzare-folla\" data-id=\"aizzare-folla\">Aizzare la Folla (Orda)</a> (Orda), <a class=\"xl\" href=\"#custodire-reliquia\" data-id=\"custodire-reliquia\">Custodire una Reliquia (Custodi di Ferro)</a> (Custodi di Ferro)</li></ul>","text":"Si tira sulla Reputazione con la fazione coinvolta. Manuale base - Chiedere un Favore — qualsiasi Reputazione - Incontrare Qualcuno di Importante — qualsiasi Reputazione - Attirare l'Attenzione — richiede -2 o meno - Influenzare un PNG — richiede +2 o più - Fare una Minaccia Diretta — richiede -3 - Pretendere Risorse — richiede +3 Viandanti e Forestieri - Appoggiare un Nuovo Leader (+1), Screditare un Leader (+1), Guidare le Truppe in Battaglia (+3), Intimidire le Truppe Nemiche (-2) - Di fazione (+2): Pianificare un Nuovo Progetto (Marchesato) (Marchesato), Manovrare la Burocrazia (Aquile) (Aquile), Incitare alla Rivolta (Alleanza) (Alleanza), Predicare ai Fedeli (Lucertole) (Lucertole), Commercio Sancito (Compagnia del Fiume) (Fiume), Sfruttare le Reti Criminali (Corvidi) (Corvidi), Richiedere Permessi (Granducato) (Granducato) Rovine e Spedizioni - Forgiare la Resistenza (+2), Chiamare i Nemici dei Tuoi Nemici (-3), Impressionare il Pubblico (+2 Abitanti) - Di fazione (+2): Aizzare la Folla (Orda) (Orda), Custodire una Reliquia (Custodi di Ferro) (Custodi di Ferro)","back":["mosse","reputazione","fazioni-indice"]},{"id":"chiedere-favore","title":"Chiedere un Favore","cat":"reputazione","group":"","src":"B p.112","aliases":["chiedere un favore","chiedi un favore"],"html":"<div class=\"move\"><p><strong>Quando chiedi un favore sensato sulla base della tua reputazione, tira sulla Reputazione con la fazione.</strong> Con un successo vieni accontentato. Con <span class=\"res\">7-9</span> ti costa: svuota il tracciato di prestigio oppure segna nomea. Con un fallimento non vieni accontentato e sarai visto con sospetto: segna nomea.</p></div><div class=\"tw\"><table><thead><tr><th>Reputazione</th><th>Favori sensati</th></tr></thead><tbody><tr><td>+2, +3</td><td>Piccolo supporto militare, 5-6 Valore in denaro o risorse</td></tr><tr><td>+1</td><td>Riparazione gratuita, ripristino di tutto il consumo, un posto comodo dove stare</td></tr><tr><td>0</td><td>Informazioni, 1-2 caselle di consumo, un luogo spoglio</td></tr><tr><td>-1</td><td>Qualche istante per ascoltarti</td></tr><tr><td>-2, -3</td><td>Un vantaggio</td></tr></tbody></table></div>","text":"Quando chiedi un favore sensato sulla base della tua reputazione, tira sulla Reputazione con la fazione. Con un successo vieni accontentato. Con 7-9 ti costa: svuota il tracciato di prestigio oppure segna nomea. Con un fallimento non vieni accontentato e sarai visto con sospetto: segna nomea. Reputazione Favori sensati ------ +2, +3 Piccolo supporto militare, 5-6 Valore in denaro o risorse +1 Riparazione gratuita, ripristino di tutto il consumo, un posto comodo dove stare 0 Informazioni, 1-2 caselle di consumo, un luogo spoglio -1 Qualche istante per ascoltarti -2, -3 Un vantaggio","back":["reputazione-indice","comprare-vendere","pb-emissario-diplomatico","pb-esule-porto","pb-buongustaio-servizio"]},{"id":"incontrare-importante","title":"Incontrare Qualcuno di Importante","cat":"reputazione","group":"","src":"B p.113-114","aliases":["incontrare qualcuno di importante","incontri qualcuno di importante"],"html":"<div class=\"move\"><p><strong>Quando incontri un personaggio importante per la prima volta, tira sulla Reputazione con la sua fazione.</strong> Con un successo, entrambi conoscete la rispettiva reputazione. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> entrambe:</p><ul><li><strong>Hai sentito delle storie</strong>: fai una domanda e il GM ti racconta una storia (vera o no) o i suoi interessi.</li><li><strong>Ha sentito qualcosa di positivo su di te</strong>: +1 al prossimo tiro quando fai leva sui vostri legami.</li></ul></div><p>Con un fallimento conosci solo l'essenziale, mentre lui conosce le tue storie (vere o false): guai in vista. \"Importante\" lo stabiliscono insieme GM e giocatori.</p>","text":"Quando incontri un personaggio importante per la prima volta, tira sulla Reputazione con la sua fazione. Con un successo, entrambi conoscete la rispettiva reputazione. Con 7-9 scegli 1, con 10+ entrambe: - Hai sentito delle storie: fai una domanda e il GM ti racconta una storia (vera o no) o i suoi interessi. - Ha sentito qualcosa di positivo su di te: +1 al prossimo tiro quando fai leva sui vostri legami. Con un fallimento conosci solo l'essenziale, mentre lui conosce le tue storie (vere o false): guai in vista. \"Importante\" lo stabiliscono insieme GM e giocatori.","back":["reputazione-indice","tag-amichevole","tag-brutto","pb-emissario-diplomatico","pb-esule-conosciuto","pb-principe-eredita","pb-cacciatore-sguardo"]},{"id":"attirare-attenzione","title":"Attirare l'Attenzione","cat":"reputazione","group":"","src":"B p.115-116","aliases":["attirare l'attenzione"],"html":"<p><strong>Richiede Reputazione -2 o inferiore.</strong> &gt; <strong>Quando attiri apertamente l'attenzione ponendoti come nemico di una fazione, tira sulla Reputazione trattandola come positiva (+2/+3).</strong> Con un successo la fazione mette in campo le sue risorse contro di te. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due:</p><ul><li>Sguinzaglia le truppe per darti la caccia.</li><li>Ti manda contro un PNG abile e fidato (a tua scelta).</li><li>Ti teme come minaccia: segna 2-nomea.</li></ul><p>Con un fallimento i nemici agiscono già dietro le quinte e ti colgono di sorpresa. Utile come diversivo su larga scala.</p>","text":"Richiede Reputazione -2 o inferiore. Quando attiri apertamente l'attenzione ponendoti come nemico di una fazione, tira sulla Reputazione trattandola come positiva (+2/+3). Con un successo la fazione mette in campo le sue risorse contro di te. Con 7-9 scegli 1, con 10+ due: - Sguinzaglia le truppe per darti la caccia. - Ti manda contro un PNG abile e fidato (a tua scelta). - Ti teme come minaccia: segna 2-nomea. Con un fallimento i nemici agiscono già dietro le quinte e ti colgono di sorpresa. Utile come diversivo su larga scala.","back":["reputazione-indice","pb-razziatore-aspetto"]},{"id":"influenzare","title":"Influenzare un PNG","cat":"reputazione","group":"","src":"B p.117","aliases":["influenzare un PNG","influenzare"],"html":"<p><strong>Richiede Reputazione +2 o superiore.</strong> &gt; <strong>Quando cerchi di influenzare un PNG disponibile o vulnerabile facendo appello alla tua reputazione, tira sulla Reputazione con la sua fazione.</strong> Con un successo cambi il suo modo di vedere le cose: il GM ne riscrive la motivazione secondo ciò che dici. Con <span class=\"res\">7-9</span> svuota 3 caselle di prestigio (le mancanti diventano nomea). Con un fallimento fraintende e il GM ne cambia la motivazione in modo inatteso.</p><p>Non si può ripetere all'infinito sullo stesso PNG; chi hai tradito non ti ascolta.</p>","text":"Richiede Reputazione +2 o superiore. Quando cerchi di influenzare un PNG disponibile o vulnerabile facendo appello alla tua reputazione, tira sulla Reputazione con la sua fazione. Con un successo cambi il suo modo di vedere le cose: il GM ne riscrive la motivazione secondo ciò che dici. Con 7-9 svuota 3 caselle di prestigio (le mancanti diventano nomea). Con un fallimento fraintende e il GM ne cambia la motivazione in modo inatteso. Non si può ripetere all'infinito sullo stesso PNG; chi hai tradito non ti ascolta.","back":["convincere","reputazione-indice","maestria-base","pb-esule-porto","pb-nomade-verita"]},{"id":"minaccia-diretta","title":"Fare una Minaccia Diretta","cat":"reputazione","group":"","src":"B p.118","aliases":["minaccia diretta","fare una minaccia diretta"],"html":"<p><strong>Richiede Reputazione -3.</strong> &gt; <strong>Quando fai appello alla tua reputazione per minacciare direttamente un PNG, tira sulla Reputazione con la sua fazione come se fosse +3.</strong> Con <span class=\"res\">10+</span> lo intimorisci: il GM ti dice se si arrende, si ritira o ti attacca (in modo scomposto). Con <span class=\"res\">7-9</span> devi dare una prova concreta e sconvolgente delle tue cattive intenzioni. Con un fallimento era preparato ad affrontare i tipi come te.</p>","text":"Richiede Reputazione -3. Quando fai appello alla tua reputazione per minacciare direttamente un PNG, tira sulla Reputazione con la sua fazione come se fosse +3. Con 10+ lo intimorisci: il GM ti dice se si arrende, si ritira o ti attacca (in modo scomposto). Con 7-9 devi dare una prova concreta e sconvolgente delle tue cattive intenzioni. Con un fallimento era preparato ad affrontare i tipi come te.","back":["reputazione-indice","pb-razziatore-aspetto","pb-cacciatore-bestie"]},{"id":"pretendere-risorse","title":"Pretendere Risorse","cat":"reputazione","group":"","src":"B p.119-120","aliases":["pretendere risorse"],"html":"<p><strong>Richiede Reputazione +3.</strong> &gt; <strong>Quando pretendi risorse importanti e preziose da un PNG, tira sulla Reputazione con la sua fazione.</strong> Con <span class=\"res\">10+</span> te le dà appena possibile. Con <span class=\"res\">7-9</span> ti impone una condizione d'uso o ti dice cosa vuole in cambio (se non rispetti, segna nomea). Con un fallimento non le ha, ma ti dice come ottenerle (a caro prezzo).</p><p>Vale per risorse non ottenibili altrimenti (un'arma d'assedio, uno squadrone), con chiunque della fazione, anche il capo supremo.</p>","text":"Richiede Reputazione +3. Quando pretendi risorse importanti e preziose da un PNG, tira sulla Reputazione con la sua fazione. Con 10+ te le dà appena possibile. Con 7-9 ti impone una condizione d'uso o ti dice cosa vuole in cambio (se non rispetti, segna nomea). Con un fallimento non le ha, ma ti dice come ottenerle (a caro prezzo). Vale per risorse non ottenibili altrimenti (un'arma d'assedio, uno squadrone), con chiunque della fazione, anche il capo supremo.","back":["reputazione-indice"]},{"id":"appoggiare-leader","title":"Appoggiare un Nuovo Leader","cat":"reputazione","group":"","src":"VF p.31","aliases":["appoggiare un nuovo leader"],"html":"<p><strong>Richiede Reputazione +1.</strong> Quando appoggi apertamente qualcuno come nuovo capo di una fazione in una radura, tira sulla Reputazione. Con un successo la fazione reagisce; il GM sceglie 2 (con <span class=\"res\">7-9</span>) o 1 (con <span class=\"res\">10+</span>): la leadership attuale si oppone e va gestita; gli abitanti non sono d'accordo e vanno convinti; i nemici della fazione vogliono approfittarne (complotti). Con un fallimento emerge qualcosa di nuovo e pericoloso sul leader o sul tuo candidato. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +1. Quando appoggi apertamente qualcuno come nuovo capo di una fazione in una radura, tira sulla Reputazione. Con un successo la fazione reagisce; il GM sceglie 2 (con 7-9) o 1 (con 10+): la leadership attuale si oppone e va gestita; gli abitanti non sono d'accordo e vanno convinti; i nemici della fazione vogliono approfittarne (complotti). Con un fallimento emerge qualcosa di nuovo e pericoloso sul leader o sul tuo candidato. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"screditare-leader","title":"Screditare un Leader","cat":"reputazione","group":"","src":"VF p.32","aliases":["screditare un leader"],"html":"<p><strong>Richiede Reputazione +1.</strong> Quando screditi apertamente un capo di una fazione in una radura, tira sulla Reputazione. Con un successo ne avvii la caduta: sarà rimosso quando <a class=\"xl\" href=\"#tempo-passa\" data-id=\"tempo-passa\">il tempo passa</a>, salvo contromosse. Il GM sceglie 2 (<span class=\"res\">7-9</span>) o 1 (<span class=\"res\">10+</span>): la protesta degenera in violenza; il leader e i suoi diventano più radicali e rispondono con la forza; vieni preso di mira per rappresaglia. Con un fallimento rafforzi il sostegno al leader. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +1. Quando screditi apertamente un capo di una fazione in una radura, tira sulla Reputazione. Con un successo ne avvii la caduta: sarà rimosso quando il tempo passa, salvo contromosse. Il GM sceglie 2 (7-9) o 1 (10+): la protesta degenera in violenza; il leader e i suoi diventano più radicali e rispondono con la forza; vieni preso di mira per rappresaglia. Con un fallimento rafforzi il sostegno al leader. (trad. non ufficiale)","back":["reputazione-indice","tempo-passa"]},{"id":"guidare-truppe","title":"Guidare le Truppe in Battaglia","cat":"reputazione","group":"","src":"VF p.33","aliases":["guidare le truppe in battaglia"],"html":"<p><strong>Richiede Reputazione +3.</strong> Quando guidi in battaglia le truppe di una fazione, tira sulla Reputazione. Con un successo ti accettano come comandante: <span class=\"res\">7-9</span> tieni 2 prese, <span class=\"res\">10+</span> tieni 3. Spendile durante lo scontro per impegnarle a: prendere e tenere una posizione; mettere in rotta un'importante forza nemica; catturare un capo nemico; distruggere una fortificazione o risorsa; difendere un gruppo o un luogo. Con un fallimento combattono nel caos e stanno perdendo. Devi guidarle di persona. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +3. Quando guidi in battaglia le truppe di una fazione, tira sulla Reputazione. Con un successo ti accettano come comandante: 7-9 tieni 2 prese, 10+ tieni 3. Spendile durante lo scontro per impegnarle a: prendere e tenere una posizione; mettere in rotta un'importante forza nemica; catturare un capo nemico; distruggere una fortificazione o risorsa; difendere un gruppo o un luogo. Con un fallimento combattono nel caos e stanno perdendo. Devi guidarle di persona. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"intimidire-truppe","title":"Intimidire le Truppe Nemiche","cat":"reputazione","group":"","src":"VF p.34","aliases":["intimidire le truppe nemiche"],"html":"<p><strong>Richiede Reputazione -2.</strong> Quando minacci truppe nemiche con una dimostrazione intimidatoria della tua reputazione, tira sulla Reputazione come positiva (+2/+3). Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due: non agiscono finché il loro capo non le rincuora (esponendosi); prendono di mira te sopra ogni altra cosa; sono scosse (2-morale al gruppo). Con un fallimento la rabbia le galvanizza e attaccano subito in forze. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione -2. Quando minacci truppe nemiche con una dimostrazione intimidatoria della tua reputazione, tira sulla Reputazione come positiva (+2/+3). Con 7-9 scegli 1, con 10+ due: non agiscono finché il loro capo non le rincuora (esponendosi); prendono di mira te sopra ogni altra cosa; sono scosse (2-morale al gruppo). Con un fallimento la rabbia le galvanizza e attaccano subito in forze. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"nuovo-progetto","title":"Pianificare un Nuovo Progetto (Marchesato)","cat":"reputazione","group":"","src":"VF p.35","aliases":["pianificare un nuovo progetto"],"html":"<p><strong>Richiede Reputazione +2 con il Marchesato.</strong> Quando convinci ufficiali del Marchesato ad avviare un progetto importante, tira sulla Reputazione. Con un successo lo avviano; il GM sceglie 3 (<span class=\"res\">7-9</span>) o 2 (<span class=\"res\">10+</span>): servirà tempo (dopo che il tempo passa); servono risorse speciali; serve prima eliminare una minaccia; non sarà proprio ciò che chiedi. Con un fallimento le risorse (e tu) servono altrove. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con il Marchesato. Quando convinci ufficiali del Marchesato ad avviare un progetto importante, tira sulla Reputazione. Con un successo lo avviano; il GM sceglie 3 (7-9) o 2 (10+): servirà tempo (dopo che il tempo passa); servono risorse speciali; serve prima eliminare una minaccia; non sarà proprio ciò che chiedi. Con un fallimento le risorse (e tu) servono altrove. (trad. non ufficiale)","back":["reputazione-indice","fazione-marchesato"]},{"id":"burocrazia","title":"Manovrare la Burocrazia (Aquile)","cat":"reputazione","group":"","src":"VF p.36","aliases":["manovrare la burocrazia"],"html":"<p><strong>Richiede Reputazione +2 con le Aquile.</strong> Quando usi la burocrazia della Dinastia mentre il tempo passa, tira sulla Reputazione. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due: tre domande al GM dal punto di vista delle Aquile; dirottare una risorsa verso una radura; aggiungere una clausola a un prossimo attacco delle Aquile; fissare un'udienza con qualunque membro della Dinastia; far aggiungere o abrogare una legge in una radura delle Aquile. Con un fallimento ti affidano un dovere: compilo prima che il tempo passi o segna 3-nomea. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con le Aquile. Quando usi la burocrazia della Dinastia mentre il tempo passa, tira sulla Reputazione. Con 7-9 scegli 1, con 10+ due: tre domande al GM dal punto di vista delle Aquile; dirottare una risorsa verso una radura; aggiungere una clausola a un prossimo attacco delle Aquile; fissare un'udienza con qualunque membro della Dinastia; far aggiungere o abrogare una legge in una radura delle Aquile. Con un fallimento ti affidano un dovere: compilo prima che il tempo passi o segna 3-nomea. (trad. non ufficiale)","back":["reputazione-indice","fazione-aquile"]},{"id":"rivolta-mossa","title":"Incitare alla Rivolta (Alleanza)","cat":"reputazione","group":"","src":"VF p.37","aliases":["incitare alla rivolta"],"html":"<p><strong>Richiede Reputazione +2 con l'Alleanza dei Boschi.</strong> Quando inciti i simpatizzanti locali a ribellarsi, tira sulla Reputazione. Con un successo la rivolta avverrà quando il tempo passa; il GM sceglie 2 (<span class=\"res\">7-9</span>) o 1 (<span class=\"res\">10+</span>) condizioni senza le quali fallirà: convincere un simpatizzante a procurare risorse; indebolire una specifica forza nemica; rubare armi; fare un favore a un gruppo locale. Con un fallimento scoppia subito, impreparata. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con l'Alleanza dei Boschi. Quando inciti i simpatizzanti locali a ribellarsi, tira sulla Reputazione. Con un successo la rivolta avverrà quando il tempo passa; il GM sceglie 2 (7-9) o 1 (10+) condizioni senza le quali fallirà: convincere un simpatizzante a procurare risorse; indebolire una specifica forza nemica; rubare armi; fare un favore a un gruppo locale. Con un fallimento scoppia subito, impreparata. (trad. non ufficiale)","back":["reputazione-indice","fazione-alleanza"]},{"id":"predicare","title":"Predicare ai Fedeli (Lucertole)","cat":"reputazione","group":"","src":"VF p.38","aliases":["predicare ai fedeli"],"html":"<p><strong>Richiede Reputazione +2 con la Setta delle Lucertole.</strong> Quando predichi un sermone a una folla di cultisti, tira sulla Reputazione: <span class=\"res\">10+</span> tieni 3, <span class=\"res\">7-9</span> tieni 1. Spendile per far sì che la folla: ti consegni qualcuno; porti offerte (almeno 6-Valore); combatta per te contro un bersaglio; ripari o difenda qualcosa; torni tranquillamente alle sue vite. Con un fallimento fraintende il messaggio e agisce di conseguenza. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con la Setta delle Lucertole. Quando predichi un sermone a una folla di cultisti, tira sulla Reputazione: 10+ tieni 3, 7-9 tieni 1. Spendile per far sì che la folla: ti consegni qualcuno; porti offerte (almeno 6-Valore); combatta per te contro un bersaglio; ripari o difenda qualcosa; torni tranquillamente alle sue vite. Con un fallimento fraintende il messaggio e agisce di conseguenza. (trad. non ufficiale)","back":["reputazione-indice","fazione-lucertole"]},{"id":"commercio-sancito","title":"Commercio Sancito (Compagnia del Fiume)","cat":"reputazione","group":"","src":"VF p.38","aliases":["commercio sancito"],"html":"<p><strong>Richiede Reputazione +2 con la Compagnia del Fiume.</strong> Quando redigi uno scambio tra parti e lo firmi a nome della Compagnia, tira sulla Reputazione. Con un successo è un accordo che la Compagnia farà rispettare, anche con la forza. Con <span class=\"res\">7-9</span> ogni intervento richiede una mazzetta di 1-Valore. Con <span class=\"res\">10+</span> è a prova di bomba: con una copia in mano gli agenti lo fanno rispettare in pieno. Con un fallimento c'è una scappatoia che qualcuno sfrutterà. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con la Compagnia del Fiume. Quando redigi uno scambio tra parti e lo firmi a nome della Compagnia, tira sulla Reputazione. Con un successo è un accordo che la Compagnia farà rispettare, anche con la forza. Con 7-9 ogni intervento richiede una mazzetta di 1-Valore. Con 10+ è a prova di bomba: con una copia in mano gli agenti lo fanno rispettare in pieno. Con un fallimento c'è una scappatoia che qualcuno sfrutterà. (trad. non ufficiale)","back":["reputazione-indice","fazione-fiume"]},{"id":"reti-criminali","title":"Sfruttare le Reti Criminali (Corvidi)","cat":"reputazione","group":"","src":"VF p.39","aliases":["sfruttare le reti criminali"],"html":"<p><strong>Richiede Reputazione +2 con la Congiura dei Corvidi.</strong> Scegli un favore e tira sulla Reputazione: merci illecite in un nascondiglio; un assassinio silenzioso; un sabotaggio; materiale per un ricatto; informazioni segrete. Con <span class=\"res\">7-9</span> la Congiura esegue ma ti chiede un favore in cambio; con <span class=\"res\">10+</span> lascia solo un promemoria che un giorno chiederà qualcosa. Con un fallimento la richiesta finisce nelle mani sbagliate. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con la Congiura dei Corvidi. Scegli un favore e tira sulla Reputazione: merci illecite in un nascondiglio; un assassinio silenzioso; un sabotaggio; materiale per un ricatto; informazioni segrete. Con 7-9 la Congiura esegue ma ti chiede un favore in cambio; con 10+ lascia solo un promemoria che un giorno chiederà qualcosa. Con un fallimento la richiesta finisce nelle mani sbagliate. (trad. non ufficiale)","back":["reputazione-indice","fazione-corvidi"]},{"id":"permessi","title":"Richiedere Permessi (Granducato)","cat":"reputazione","group":"","src":"VF p.40","aliases":["richiedere permessi"],"html":"<p><strong>Richiede Reputazione +2 con il Granducato Sotterraneo.</strong> Tira sulla Reputazione: con un successo ottieni un permesso valido fino al prossimo passare del tempo, con 2 (<span class=\"res\">7-9</span>) o 3 (<span class=\"res\">10+</span>) diritti: viaggiare nei tunnel con una guida tra radure collegate senza tirare; prendere fino a 4-Valore dalle scorte del Granducato; accesso ai membri del Parlamento; passare liberamente anche con armi o contrabbando; agire contro chi non è protetto dal Granducato (o contro chi è protetto, se ne provi la colpa). Con un fallimento un funzionario viene a interrogarti. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con il Granducato Sotterraneo. Tira sulla Reputazione: con un successo ottieni un permesso valido fino al prossimo passare del tempo, con 2 (7-9) o 3 (10+) diritti: viaggiare nei tunnel con una guida tra radure collegate senza tirare; prendere fino a 4-Valore dalle scorte del Granducato; accesso ai membri del Parlamento; passare liberamente anche con armi o contrabbando; agire contro chi non è protetto dal Granducato (o contro chi è protetto, se ne provi la colpa). Con un fallimento un funzionario viene a interrogarti. (trad. non ufficiale)","back":["reputazione-indice","fazione-granducato"]},{"id":"forgiare-resistenza","title":"Forgiare la Resistenza","cat":"reputazione","group":"","src":"RS p.33","aliases":["forgiare la resistenza"],"html":"<p><strong>Richiede Reputazione +2.</strong> Quando prometti di guidare un gruppo di oppressi di fronte a una situazione disperata, tira sulla Reputazione con la loro fazione. Con un successo si riuniscono in un gruppo che ti segue. Con <span class=\"res\">10+</span> emerge anche un capo capace, che ti dice cosa devi fare per ispirarlo a guidarli da solo. Con un fallimento attiri i loro nemici: segna 2-nomea con chi volevi guidare. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2. Quando prometti di guidare un gruppo di oppressi di fronte a una situazione disperata, tira sulla Reputazione con la loro fazione. Con un successo si riuniscono in un gruppo che ti segue. Con 10+ emerge anche un capo capace, che ti dice cosa devi fare per ispirarlo a guidarli da solo. Con un fallimento attiri i loro nemici: segna 2-nomea con chi volevi guidare. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"nemici-dei-nemici","title":"Chiamare i Nemici dei Tuoi Nemici","cat":"reputazione","group":"","src":"RS p.34","aliases":["chiamare i nemici dei tuoi nemici"],"html":"<p><strong>Richiede Reputazione -3.</strong> Quando spargi la voce che cerchi alleati contro un nemico potente, tira sulla Reputazione con la sua fazione come se fosse +3. Con un successo trovi alleati potenti, ma divisi da liti interne. Con <span class=\"res\">7-9</span> c'è anche un traditore tra loro: muoverli prima di scoprirlo li esporrebbe a gravi conseguenze. Con un fallimento finisci in una trappola. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione -3. Quando spargi la voce che cerchi alleati contro un nemico potente, tira sulla Reputazione con la sua fazione come se fosse +3. Con un successo trovi alleati potenti, ma divisi da liti interne. Con 7-9 c'è anche un traditore tra loro: muoverli prima di scoprirlo li esporrebbe a gravi conseguenze. Con un fallimento finisci in una trappola. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"impressionare-pubblico","title":"Impressionare il Pubblico","cat":"reputazione","group":"","src":"RS p.35","aliases":["impressionare il pubblico"],"html":"<p><strong>Richiede Reputazione +2 con gli Abitanti.</strong> Quando racconti le tue gesta eroiche a un gruppo di abitanti, tira sulla Reputazione. Con un successo tieni 1: spendila perché un abitante coraggioso si faccia avanti ad aiutarti quando ne hai bisogno (con <span class=\"res\">10+</span> è importante o particolarmente abile). Con un fallimento tieni 1, ma ti chiedono aiuto per un problema urgente: accetta o segna 2-nomea e perdi la presa. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con gli Abitanti. Quando racconti le tue gesta eroiche a un gruppo di abitanti, tira sulla Reputazione. Con un successo tieni 1: spendila perché un abitante coraggioso si faccia avanti ad aiutarti quando ne hai bisogno (con 10+ è importante o particolarmente abile). Con un fallimento tieni 1, ma ti chiedono aiuto per un problema urgente: accetta o segna 2-nomea e perdi la presa. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"aizzare-folla","title":"Aizzare la Folla (Orda)","cat":"reputazione","group":"","src":"RS p.36","aliases":["aizzare la folla"],"html":"<p><strong>Richiede Reputazione +2 con l'Orda.</strong> Quando chiami una folla dell'Orda a radere al suolo un edificio o saccheggiare qualcosa, tira sulla Reputazione. Con un successo un gruppo piccolo si unisce e fa la sua parte finché c'è da saccheggiare; con <span class=\"res\">10+</span> è medio o particolarmente devoto (+2 morale). Con un fallimento è indisciplinato e incontrollabile. Devi almeno fingere di partecipare alla sommossa. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con l'Orda. Quando chiami una folla dell'Orda a radere al suolo un edificio o saccheggiare qualcosa, tira sulla Reputazione. Con un successo un gruppo piccolo si unisce e fa la sua parte finché c'è da saccheggiare; con 10+ è medio o particolarmente devoto (+2 morale). Con un fallimento è indisciplinato e incontrollabile. Devi almeno fingere di partecipare alla sommossa. (trad. non ufficiale)","back":["reputazione-indice","fazione-cento"]},{"id":"custodire-reliquia","title":"Custodire una Reliquia (Custodi di Ferro)","cat":"reputazione","group":"","src":"RS p.37","aliases":["custodire una reliquia"],"html":"<p><strong>Richiede Reputazione +2 con i Custodi di Ferro.</strong> Quando chiedi ai Custodi una <a class=\"xl\" href=\"#reliquie\" data-id=\"reliquie\">reliquia</a> per la tua causa, tira sulla Reputazione. Con un successo te ne affidano una (il GM dice cosa fa e quando va restituita); scegli 1 (<span class=\"res\">7-9</span>) o 3 (<span class=\"res\">10+</span>): sfrutta una debolezza del nemico o di un ostacolo; rafforza la tua posizione con un PNG potente; rinforza gli alleati che lavorano con te; ha proprietà insolitamente utili. Con un fallimento scegli 1 ma devi anche scortare un oggetto o una persona per loro. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con i Custodi di Ferro. Quando chiedi ai Custodi una reliquia per la tua causa, tira sulla Reputazione. Con un successo te ne affidano una (il GM dice cosa fa e quando va restituita); scegli 1 (7-9) o 3 (10+): sfrutta una debolezza del nemico o di un ostacolo; rafforza la tua posizione con un PNG potente; rinforza gli alleati che lavorano con te; ha proprietà insolitamente utili. Con un fallimento scegli 1 ma devi anche scortare un oggetto o una persona per loro. (trad. non ufficiale)","back":["reputazione-indice","fazione-custodi"]},{"id":"viaggio-indice","title":"Mosse di Viaggio","cat":"indici","group":"","src":"B p.121-124; RS p.102-103","aliases":["mosse di viaggio","viaggio"],"html":"<p>Quando la banda si sposta, decide come procedere e <strong>uno solo tira per il gruppo</strong>. In caso di disaccordo si può <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a>; poi decide la maggioranza.</p><ul><li><a class=\"xl\" href=\"#viaggio-foresta\" data-id=\"viaggio-foresta\">Viaggiare Attraverso la Foresta</a> — attraverso la foresta (scorciatoia pericolosa)</li><li><a class=\"xl\" href=\"#viaggio-sentiero\" data-id=\"viaggio-sentiero\">Viaggiare Lungo il Sentiero</a> — lungo il sentiero (più sicuro)</li><li><a class=\"xl\" href=\"#cercare-rovine\" data-id=\"cercare-rovine\">Cercare Rovine</a> — cercare rovine nella foresta (RS)</li><li><a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a> — tornare da una rovina nella foresta (RS)</li><li><em>(Pirata)</em> <a class=\"xl\" href=\"#pb-pirata-salpare\" data-id=\"pb-pirata-salpare\">Solcare le Acque</a> — viaggio in nave</li></ul>","text":"Quando la banda si sposta, decide come procedere e uno solo tira per il gruppo. In caso di disaccordo si può Supplicare un PG; poi decide la maggioranza. - Viaggiare Attraverso la Foresta — attraverso la foresta (scorciatoia pericolosa) - Viaggiare Lungo il Sentiero — lungo il sentiero (più sicuro) - Cercare Rovine — cercare rovine nella foresta (RS) - Tornare da una Rovina nella Foresta — tornare da una rovina nella foresta (RS) - (Pirata) Solcare le Acque — viaggio in nave","back":["mosse"]},{"id":"viaggio-foresta","title":"Viaggiare Attraverso la Foresta","cat":"viaggio","group":"","src":"B p.121-122","aliases":["viaggiare attraverso la foresta","attraversare la foresta"],"html":"<div class=\"move\"><p><strong>Quando attraversate la foresta per passare da una radura all'altra, la banda sceglie come procedere e uno tira per tutti:</strong></p><ul><li><strong>Lentamente, cercando cibo</strong>: tutti svuotano 2-consumo; la banda segna in totale 1-fatica per membro; <strong>-1</strong>.</li><li><strong>Con cautela, evitando guai</strong>: la banda segna in totale 1-consumo o 1-fatica per membro; <strong>+1</strong>.</li><li><strong>Il più velocemente possibile</strong>: tutti segnano 1-fatica e 1-consumo; <strong>+2</strong>.</li></ul></div><p>Con un successo raggiungete qualsiasi radura dall'altra parte della foresta e uno di voi individua un <strong>luogo interessante</strong> (lasciate segni per ritrovarlo). Con <span class=\"res\">10+</span> viaggiate in sicurezza. Con <span class=\"res\">7-9</span> <strong>qualcosa vi segue</strong>: ignoratelo oppure ognuno segna fatica per seminarlo. Con un fallimento incappate in un pericolo della foresta da risolvere prima di arrivare.</p><p>Mosse collegate: <a class=\"xl\" href=\"#pb-ranger-raccoglitore\" data-id=\"pb-ranger-raccoglitore\">Raccoglitore</a>, <a class=\"xl\" href=\"#pb-predone-viaggiatore\" data-id=\"pb-predone-viaggiatore\">Viaggiatore Straordinario</a>.</p>","text":"Quando attraversate la foresta per passare da una radura all'altra, la banda sceglie come procedere e uno tira per tutti: - Lentamente, cercando cibo: tutti svuotano 2-consumo; la banda segna in totale 1-fatica per membro; -1. - Con cautela, evitando guai: la banda segna in totale 1-consumo o 1-fatica per membro; +1. - Il più velocemente possibile: tutti segnano 1-fatica e 1-consumo; +2. Con un successo raggiungete qualsiasi radura dall'altra parte della foresta e uno di voi individua un luogo interessante (lasciate segni per ritrovarlo). Con 10+ viaggiate in sicurezza. Con 7-9 qualcosa vi segue: ignoratelo oppure ognuno segna fatica per seminarlo. Con un fallimento incappate in un pericolo della foresta da risolvere prima di arrivare. Mosse collegate: Raccoglitore, Viaggiatore Straordinario.","back":["viaggio-indice","pb-predone-viaggiatore"]},{"id":"viaggio-sentiero","title":"Viaggiare Lungo il Sentiero","cat":"viaggio","group":"","src":"B p.123-124","aliases":["viaggiare lungo il sentiero","viaggio lungo il sentiero"],"html":"<div class=\"move\"><p><strong>Quando viaggiate da una radura all'altra restando sul sentiero, la banda sceglie come procedere e uno tira per tutti:</strong></p><ul><li><strong>A passo tranquillo</strong>: tutti svuotano 3-fatica; la banda segna 2-consumo in totale; <strong>-1</strong>.</li><li><strong>A passo normale</strong>: tutti svuotano 2-fatica; la banda segna 1-consumo; <strong>+0</strong>.</li><li><strong>Con cautela, veloci e inosservati</strong>: la banda segna 1-consumo; <strong>+1</strong>.</li><li><strong>A passo spedito</strong>: tutti segnano fatica; <strong>+2</strong>.</li></ul></div><p>Con un successo arrivate in tempo utile. Con <span class=\"res\">10+</span> il viaggio è rapido e senza intoppi. Con <span class=\"res\">7-9</span> vi imbattete in qualcosa di interessante (carovana, campo di battaglia...), che potete anche ignorare. Con un fallimento vi cacciate nei guai prima di arrivare.</p>","text":"Quando viaggiate da una radura all'altra restando sul sentiero, la banda sceglie come procedere e uno tira per tutti: - A passo tranquillo: tutti svuotano 3-fatica; la banda segna 2-consumo in totale; -1. - A passo normale: tutti svuotano 2-fatica; la banda segna 1-consumo; +0. - Con cautela, veloci e inosservati: la banda segna 1-consumo; +1. - A passo spedito: tutti segnano fatica; +2. Con un successo arrivate in tempo utile. Con 10+ il viaggio è rapido e senza intoppi. Con 7-9 vi imbattete in qualcosa di interessante (carovana, campo di battaglia...), che potete anche ignorare. Con un fallimento vi cacciate nei guai prima di arrivare.","back":["viaggio-indice","pb-predone-viaggiatore"]},{"id":"danno","title":"Danno e Tracciati dei Danni","cat":"danno","group":"","src":"B p.125-129","aliases":["danno","tracciati dei danni","tracciato dei danni","infliggi","subisci danno"],"html":"<p>\"Danno\" è il termine generico per tutti i tracciati. I PG ne hanno tre (4 caselle ciascuno all'inizio, max 6 con l'avanzamento): <a class=\"xl\" href=\"#consumo\" data-id=\"consumo\">Consumo</a>, <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a>, <a class=\"xl\" href=\"#ferite\" data-id=\"ferite\">Ferite</a>. Gli oggetti hanno l'<a class=\"xl\" href=\"#usura\" data-id=\"usura\">Usura</a>; i PNG hanno anche il <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a>.</p><p>Linguaggio:</p><ul><li><strong>Segna [danno] / segna 2-[danno]</strong>: segna 1 o 2 caselle sul tuo tracciato.</li><li><strong>Infliggi [danno]</strong>: è il bersaglio a segnare.</li><li><strong>Svuota [danno]</strong>: cancella caselle segnate; \"svuota tutto il...\" le cancella tutte.</li><li><strong>Danno aggiuntivo / in meno</strong>: +1 / -1 se non specificato.</li></ul><p>Vedi <a class=\"xl\" href=\"#danno-oltre-limite\" data-id=\"danno-oltre-limite\">Danno Oltre il Limite del Tracciato</a> e <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">Svuotare i Tracciati dei Danni</a>. In combattimento armi e armature modificano il danno (<a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>).</p>","text":"\"Danno\" è il termine generico per tutti i tracciati. I PG ne hanno tre (4 caselle ciascuno all'inizio, max 6 con l'avanzamento): Consumo, Fatica, Ferite. Gli oggetti hanno l'Usura; i PNG hanno anche il Morale. Linguaggio: - Segna [danno] / segna 2-[danno]: segna 1 o 2 caselle sul tuo tracciato. - Infliggi [danno]: è il bersaglio a segnare. - Svuota [danno]: cancella caselle segnate; \"svuota tutto il...\" le cancella tutte. - Danno aggiuntivo / in meno: +1 / -1 se non specificato. Vedi Danno Oltre il Limite del Tracciato e Svuotare i Tracciati dei Danni. In combattimento armi e armature modificano il danno (Armatura e Scudi).","back":["mosse-armi-indice"]},{"id":"consumo","title":"Consumo","cat":"danno","group":"","src":"B p.55, 125-126","aliases":["consumo","segna consumo"],"html":"<p>Rappresenta scorte, provviste e piccoli oggetti nelle tue sacche. Una casella segnata = tasche più vuote; <strong>1 casella ≈ 1-Valore</strong>.</p><p>Puoi segnare consumo per tirare fuori al momento giusto un oggetto semplice: monete (1-Valore), fiaccola o lanterna, 10 m di corda, rampino, guanti da scalata, provviste per un giorno, kit per il fuoco, grimaldelli semplici, materiale per riparazioni o cure, coltellino, piccola bomba fumogena, specchio, penna e pergamena, mappa base, boccetta d'olio o alcol, sacco a pelo, cuscinetti a sfera.</p><p>Se il tracciato è pieno sei al verde: non puoi segnarne altro e altro danno da consumo viene ignorato.</p>","text":"Rappresenta scorte, provviste e piccoli oggetti nelle tue sacche. Una casella segnata = tasche più vuote; 1 casella ≈ 1-Valore. Puoi segnare consumo per tirare fuori al momento giusto un oggetto semplice: monete (1-Valore), fiaccola o lanterna, 10 m di corda, rampino, guanti da scalata, provviste per un giorno, kit per il fuoco, grimaldelli semplici, materiale per riparazioni o cure, coltellino, piccola bomba fumogena, specchio, penna e pergamena, mappa base, boccetta d'olio o alcol, sacco a pelo, cuscinetti a sfera. Se il tracciato è pieno sei al verde: non puoi segnarne altro e altro danno da consumo viene ignorato.","back":["creazione","danno","equipaggiamento"]},{"id":"fatica","title":"Fatica","cat":"danno","group":"","src":"B p.55, 125-127","aliases":["fatica","segna fatica"],"html":"<p>Rappresenta energia e capacità di continuare. <strong>Non puoi segnarla a piacere</strong>: solo quando una mossa, un effetto o il GM lo dicono (molte mosse la chiedono come costo). Si svuota del tutto soddisfacendo la tua <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a> o riposando (vedi <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">Svuotare i Tracciati dei Danni</a>).</p><p>Tracciato pieno: sei sfinito, non puoi più spendere fatica. Se devi segnarne ancora <strong>crolli o svieni</strong> (sceglie il GM).</p>","text":"Rappresenta energia e capacità di continuare. Non puoi segnarla a piacere: solo quando una mossa, un effetto o il GM lo dicono (molte mosse la chiedono come costo). Si svuota del tutto soddisfacendo la tua Natura o riposando (vedi Svuotare i Tracciati dei Danni). Tracciato pieno: sei sfinito, non puoi più spendere fatica. Se devi segnarne ancora crolli o svieni (sceglie il GM).","back":["natura","creazione","tentare-impresa","aiutare","supplicare","danno"]},{"id":"ferite","title":"Ferite","cat":"danno","group":"","src":"B p.56, 125-128","aliases":["ferite","ferita","segna ferite"],"html":"<p>Rappresenta il danno fisico. Tracciato pieno: sei in fin di vita, non puoi correre né combattere senza gravi conseguenze e hai bisogno di cure immediate. <strong>Se devi segnare un'altra ferita, muori</strong> (di solito con un'ultima azione o ultime parole). Le armi infliggono di base 1-ferita.</p>","text":"Rappresenta il danno fisico. Tracciato pieno: sei in fin di vita, non puoi correre né combattere senza gravi conseguenze e hai bisogno di cure immediate. Se devi segnare un'altra ferita, muori (di solito con un'ultima azione o ultime parole). Le armi infliggono di base 1-ferita.","back":["creazione","danno"]},{"id":"usura","title":"Usura","cat":"danno","group":"","src":"B p.58, 125-128","aliases":["usura","segna usura"],"html":"<p>Tracciato di resistenza di un pezzo di <a class=\"xl\" href=\"#equipaggiamento\" data-id=\"equipaggiamento\">Equipaggiamento</a> (sui PNG un unico tracciato per tutto l'equipaggiamento). Tracciato pieno: l'oggetto è gravemente danneggiato. Se devi segnare altra usura, si <strong>distrugge</strong> irreparabilmente. Armature e scudi assorbono il danno: <strong>1 usura segnata = 1 danno in meno</strong> (vedi <a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>).</p>","text":"Tracciato di resistenza di un pezzo di Equipaggiamento (sui PNG un unico tracciato per tutto l'equipaggiamento). Tracciato pieno: l'oggetto è gravemente danneggiato. Se devi segnare altra usura, si distrugge irreparabilmente. Armature e scudi assorbono il danno: 1 usura segnata = 1 danno in meno (vedi Armatura e Scudi).","back":["danno","equipaggiamento"]},{"id":"morale","title":"Morale","cat":"danno","group":"","src":"B p.125-128, 213-214","aliases":["morale","danno al morale","danni al morale"],"html":"<p>Tracciato solo dei PNG: la loro volontà di opporsi ai vagabondi. Tracciato pieno: sono sul punto di cedere. Se devono segnarne ancora, <strong>si arrendono o fuggono</strong> subito. Molte mosse infliggono danni al morale (es. <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> con \"esita\", <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>, <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare un Gruppo</a>).</p>","text":"Tracciato solo dei PNG: la loro volontà di opporsi ai vagabondi. Tracciato pieno: sono sul punto di cedere. Se devono segnarne ancora, si arrendono o fuggono subito. Molte mosse infliggono danni al morale (es. Ingannare un PNG con \"esita\", Assaltare un Gruppo, Incalzare un Gruppo).","back":["ingannare","danno","attaccare-mischia"]},{"id":"danno-oltre-limite","title":"Danno Oltre il Limite del Tracciato","cat":"danno","group":"","src":"B p.127-128","aliases":["oltre il limite","tracciato pieno"],"html":"<p>Quando un tracciato è pieno sei in gravi condizioni; le vere conseguenze arrivano se devi segnare ancora:</p><ul><li><strong>Consumo</strong>: non puoi segnarne altro; ignoralo.</li><li><strong>Fatica</strong>: crolli o svieni (sceglie il GM), alla mercé dei nemici.</li><li><strong>Ferite</strong>: muori.</li><li><strong>Usura</strong>: l'oggetto è distrutto.</li><li><strong>Morale</strong> (PNG): si arrende o fugge.</li></ul><p>A volte puoi scegliere di andare oltre il limite (forzare l'equipaggiamento, o fatica se il GM lo consente).</p>","text":"Quando un tracciato è pieno sei in gravi condizioni; le vere conseguenze arrivano se devi segnare ancora: - Consumo: non puoi segnarne altro; ignoralo. - Fatica: crolli o svieni (sceglie il GM), alla mercé dei nemici. - Ferite: muori. - Usura: l'oggetto è distrutto. - Morale (PNG): si arrende o fugge. A volte puoi scegliere di andare oltre il limite (forzare l'equipaggiamento, o fatica se il GM lo consente).","back":["danno"]},{"id":"svuotare-tracciati","title":"Svuotare i Tracciati dei Danni","cat":"danno","group":"","src":"B p.128-129","aliases":["svuotare","recupero","guarigione","riposo"],"html":"<p><strong>Consumo</strong> (nuove risorse):</p><ul><li>1: piccola ricompensa, dispensa di un abitante, qualche ora di raccolta nella foresta</li><li>2: ricompensa dignitosa, casa di un abitante, 1-2 giorni di raccolta</li><li>3: ricompensa da un abitante facoltoso, bottega facoltosa, un paio di giorni di raccolta</li><li>4: grossa ricompensa da un abitante influente, casa facoltosa, una settimana di raccolta</li></ul><p><strong>Fatica</strong> (natura o riposo):</p><ul><li>1: notte in un accampamento sicuro, in una soffitta, un buon pasto</li><li>2: settimana in accampamento sicuro, notte in casa di un abitante, pasto eccezionale</li><li>3: settimana in un letto in casa, 1-2 notti in un comodo letto, un banchetto</li><li>4: settimana al sicuro in un comodo letto, acqua e cibo per una settimana</li></ul><p><strong>Ferite</strong> (cure):</p><ul><li>1: un vagabondo ti cura (segna consumo), guaritore per un'ora (1-Valore), una settimana a letto</li><li>2: guaritore per un giorno (2-Valore), due settimane a letto</li><li>3: guaritore per una settimana (3-Valore), un mese a letto</li><li>4: guaritore per due settimane o più (4-Valore)</li></ul><p><strong>Usura</strong> (riparazioni):</p><ul><li>1: un vagabondo per qualche ora (1-consumo), un esperto per un'ora (1-Valore)</li><li>2: un vagabondo per un paio di giorni (2-consumo), un esperto per qualche ora (2-Valore)</li><li>3: un esperto per un paio di giorni (3-Valore)</li><li>4: un esperto per una settimana o più (4-Valore)</li></ul><p>Quando <a class=\"xl\" href=\"#tempo-passa\" data-id=\"tempo-passa\">il tempo passa</a> i tracciati si svuotano in buona parte grazie ad azioni fuori scena.</p>","text":"Consumo (nuove risorse): - 1: piccola ricompensa, dispensa di un abitante, qualche ora di raccolta nella foresta - 2: ricompensa dignitosa, casa di un abitante, 1-2 giorni di raccolta - 3: ricompensa da un abitante facoltoso, bottega facoltosa, un paio di giorni di raccolta - 4: grossa ricompensa da un abitante influente, casa facoltosa, una settimana di raccolta Fatica (natura o riposo): - 1: notte in un accampamento sicuro, in una soffitta, un buon pasto - 2: settimana in accampamento sicuro, notte in casa di un abitante, pasto eccezionale - 3: settimana in un letto in casa, 1-2 notti in un comodo letto, un banchetto - 4: settimana al sicuro in un comodo letto, acqua e cibo per una settimana Ferite (cure): - 1: un vagabondo ti cura (segna consumo), guaritore per un'ora (1-Valore), una settimana a letto - 2: guaritore per un giorno (2-Valore), due settimane a letto - 3: guaritore per una settimana (3-Valore), un mese a letto - 4: guaritore per due settimane o più (4-Valore) Usura (riparazioni): - 1: un vagabondo per qualche ora (1-consumo), un esperto per un'ora (1-Valore) - 2: un vagabondo per un paio di giorni (2-consumo), un esperto per qualche ora (2-Valore) - 3: un esperto per un paio di giorni (3-Valore) - 4: un esperto per una settimana o più (4-Valore) Quando il tempo passa i tracciati si svuotano in buona parte grazie ad azioni fuori scena.","back":["danno","fatica","pescare"]},{"id":"fine-sessione","title":"Mosse di Fine Sessione","cat":"regole","group":"","src":"B p.130","aliases":["mosse di fine sessione","fine sessione","mossa di fine sessione"],"html":"<p>Alla fine di ogni sessione:</p><ol><li><strong>Motivazioni</strong>: ogni giocatore legge le sue <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">motivazioni</a>; il tavolo valuta se le ha soddisfatte. Se sì e non ha già avanzato per quella motivazione in sessione, <strong>avanza</strong>.</li><li><strong>Cambiamento</strong>: ogni giocatore può (se vuole) cambiare un elemento: sostituire una motivazione con una di un altro playbook, oppure la natura con una di un altro playbook, oppure un legame (tipo e soggetto) con uno di un altro playbook.</li></ol>","text":"Alla fine di ogni sessione: 1. Motivazioni: ogni giocatore legge le sue motivazioni; il tavolo valuta se le ha soddisfatte. Se sì e non ha già avanzato per quella motivazione in sessione, avanza. 2. Cambiamento: ogni giocatore può (se vuole) cambiare un elemento: sostituire una motivazione con una di un altro playbook, oppure la natura con una di un altro playbook, oppure un legame (tipo e soggetto) con uno di un altro playbook.","back":["mosse","natura"]},{"id":"avanzamento","title":"Avanzamento","cat":"avanzamento","group":"","src":"B p.170-176","aliases":["avanzamento","avanzamenti","avanzi","avanzare"],"html":"<p>Guadagni un avanzamento quando soddisfi una <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Motivazioni</a> (max uno per motivazione a sessione). Scegli subito dalla lista:</p><ul><li>+1 a una <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">caratteristica</a> (max +2).</li><li>Una nuova mossa del tuo playbook (max 5 mosse dal tuo playbook).</li><li>Una nuova mossa da un altro playbook (max 2).</li><li>Fino a due nuove <a class=\"xl\" href=\"#abilita-armi\" data-id=\"abilita-armi\">abilità con le armi</a> (max 7 in totale).</li><li>Fino a due nuove <a class=\"xl\" href=\"#imprese-indice\" data-id=\"imprese-indice\">imprese da furfante</a> (max 6 in totale).</li><li>Una casella in più su un tracciato dei danni (max 6 ciascuno).</li><li>Fino a due nuovi <a class=\"xl\" href=\"#legame\" data-id=\"legame\">legami</a> (solo l'effetto; max 6).</li><li><em>(VF)</em> Padroneggiare una mossa base o fino a due abilità con le armi: vedi <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">Maestrie</a>.</li></ul><p>Abilità, imprese e caselle ottenute tramite mosse dei playbook <strong>non contano</strong> nei limiti.</p>","text":"Guadagni un avanzamento quando soddisfi una Motivazioni (max uno per motivazione a sessione). Scegli subito dalla lista: - +1 a una caratteristica (max +2). - Una nuova mossa del tuo playbook (max 5 mosse dal tuo playbook). - Una nuova mossa da un altro playbook (max 2). - Fino a due nuove abilità con le armi (max 7 in totale). - Fino a due nuove imprese da furfante (max 6 in totale). - Una casella in più su un tracciato dei danni (max 6 ciascuno). - Fino a due nuovi legami (solo l'effetto; max 6). - (VF) Padroneggiare una mossa base o fino a due abilità con le armi: vedi Maestrie. Abilità, imprese e caselle ottenute tramite mosse dei playbook non contano nei limiti.","back":["caratteristiche","motivazione","abilita-armi","maestrie"]},{"id":"cambiare-playbook","title":"Cambiare Playbook","cat":"avanzamento","group":"","src":"B p.177-179","aliases":["cambiare playbook"],"html":"<p>Se il vagabondo non rispecchia più il suo playbook e il tavolo è d'accordo (a fine sessione o con un salto temporale):</p><ul><li>Dettagli nuovi dal nuovo playbook; il passato resta.</li><li>Caratteristiche: puoi ridurre di 1 la più bassa del nuovo playbook e aumentare di 1 la più alta (tra -2 e +2).</li><li>Natura e entrambe le motivazioni dal nuovo playbook; due legami dal nuovo playbook.</li><li>Reputazione, equipaggiamento e tracciati restano uguali.</li><li>Mosse: scambiale una per una con quelle del nuovo playbook (max 2 esterne).</li><li>Puoi scambiare un'impresa da furfante e un'abilità con le armi.</li></ul>","text":"Se il vagabondo non rispecchia più il suo playbook e il tavolo è d'accordo (a fine sessione o con un salto temporale): - Dettagli nuovi dal nuovo playbook; il passato resta. - Caratteristiche: puoi ridurre di 1 la più bassa del nuovo playbook e aumentare di 1 la più alta (tra -2 e +2). - Natura e entrambe le motivazioni dal nuovo playbook; due legami dal nuovo playbook. - Reputazione, equipaggiamento e tracciati restano uguali. - Mosse: scambiale una per una con quelle del nuovo playbook (max 2 esterne). - Puoi scambiare un'impresa da furfante e un'abilità con le armi.","back":[]},{"id":"nuovo-personaggio","title":"Creare un Nuovo Personaggio","cat":"avanzamento","group":"","src":"B p.179-181","aliases":["nuovo personaggio"],"html":"<p>Il vecchio PG, se vivo, diventa un PNG (o esce del tutto dalla storia, se il giocatore lo chiede). Il nuovo PG si crea normalmente, spiegando perché si unisce alla banda; i legami verso il vecchio PG possono passare al nuovo. Se gli altri sono molto avanzati, il GM può concedere 1-2 avanzamenti gratuiti e 4-Valore extra.</p>","text":"Il vecchio PG, se vivo, diventa un PNG (o esce del tutto dalla storia, se il giocatore lo chiede). Il nuovo PG si crea normalmente, spiegando perché si unisce alla banda; i legami verso il vecchio PG possono passare al nuovo. Se gli altri sono molto avanzati, il GM può concedere 1-2 avanzamenti gratuiti e 4-Valore extra.","back":[]},{"id":"tempo-passa","title":"Il Tempo che Passa","cat":"regole","group":"","src":"B p.240-241","aliases":["il tempo passa","quando il tempo passa","tempo passa"],"html":"<p>Il tempo passa quando la storia salta in avanti di un paio di settimane (lunghi viaggi, riposo). È una sorta di azzeramento: i vagabondi svuotano i tracciati grazie ad azioni fuori scena e nei Boschi avvengono grandi cambiamenti. Il GM fa un <a class=\"xl\" href=\"#tiro-fazione\" data-id=\"tiro-fazione\">Tiro Fazione</a> per ogni fazione. Molte mosse si riferiscono a questo momento (es. <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Protezione</a>, <a class=\"xl\" href=\"#screditare-leader\" data-id=\"screditare-leader\">Screditare un Leader</a>).</p>","text":"Il tempo passa quando la storia salta in avanti di un paio di settimane (lunghi viaggi, riposo). È una sorta di azzeramento: i vagabondi svuotano i tracciati grazie ad azioni fuori scena e nei Boschi avvengono grandi cambiamenti. Il GM fa un Tiro Fazione per ogni fazione. Molte mosse si riferiscono a questo momento (es. Protezione, Screditare un Leader).","back":["screditare-leader","svuotare-tracciati","tiro-fazione"]},{"id":"mosse-armi-indice","title":"Mosse con le Armi","cat":"indici","group":"","src":"B p.89-109; VF p.24-30; RS p.30-32","aliases":["mosse con le armi","combattimento"],"html":"<p>Il combattimento non è un sottosistema separato: resta una conversazione in cui le mosse scattano quando la narrazione lo richiede (vedi <a class=\"xl\" href=\"#scene-combattimento\" data-id=\"scene-combattimento\">Gestire le Scene di Combattimento</a>). Le mosse base restano utili (es. <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a> per +1, <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a> alla resa).</p><p><strong>Mosse base con le armi</strong> (tutti): <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>, <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a>, <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a>.</p><p><strong>Abilità con le armi</strong> (vedi <a class=\"xl\" href=\"#abilita-armi\" data-id=\"abilita-armi\">Abilità con le Armi</a>):</p><ul><li><em>Manuale base</em>: <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>, <a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a>, <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a>, <a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a>, <a class=\"xl\" href=\"#fracassare\" data-id=\"fracassare\">Fracassare</a>, <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a>, <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare un Gruppo</a>, <a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a>, <a class=\"xl\" href=\"#tiro-maestro\" data-id=\"tiro-maestro\">Tiro da Maestro</a>, <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a>.</li><li><em>Viandanti e Forestieri</em>: <a class=\"xl\" href=\"#furia-battaglia\" data-id=\"furia-battaglia\">Furia di Battaglia (Battle Fury)</a>, <a class=\"xl\" href=\"#carica\" data-id=\"carica\">Carica (Charge)</a>, <a class=\"xl\" href=\"#scagliare\" data-id=\"scagliare\">Scagliare (Hurl)</a>, <a class=\"xl\" href=\"#affondo\" data-id=\"affondo\">Affondo (Lunge)</a>, <a class=\"xl\" href=\"#combattere-coppia\" data-id=\"combattere-coppia\">Combattere in Coppia (Paired Fighting)</a>, <a class=\"xl\" href=\"#zampe-martello\" data-id=\"zampe-martello\">Zampe di Martello (Hammerpaws)</a>, <a class=\"xl\" href=\"#tiro-preciso\" data-id=\"tiro-preciso\">Tiro di Precisione (Pinpoint Shot)</a>, <a class=\"xl\" href=\"#tiro-lungo\" data-id=\"tiro-lungo\">Tiro Lungo (Long Shot)</a>, <a class=\"xl\" href=\"#tiro-bruciapelo\" data-id=\"tiro-bruciapelo\">Tiro a Bruciapelo (Point-Blank Shot)</a>, <a class=\"xl\" href=\"#cambiare-mano\" data-id=\"cambiare-mano\">Cambiare Mano (Switch Hands)</a>.</li><li><em>Rovine e Spedizioni</em>: <a class=\"xl\" href=\"#spazzata\" data-id=\"spazzata\">Spazzata d'Arco (Sweep)</a>, <a class=\"xl\" href=\"#colpo-pomo\" data-id=\"colpo-pomo\">Colpo di Pomo (Pommel Strike)</a>, <a class=\"xl\" href=\"#svolazzo-terrificante\" data-id=\"svolazzo-terrificante\">Svolazzo Terrificante (Frightful Flourish)</a>, <a class=\"xl\" href=\"#stoccata-sorpresa\" data-id=\"stoccata-sorpresa\">Stoccata a Sorpresa (Surprise Jab)</a>.</li></ul><p>Regole collegate: <a class=\"xl\" href=\"#distanze\" data-id=\"distanze\">Distanze</a>, <a class=\"xl\" href=\"#danno\" data-id=\"danno\">Danno e Tracciati dei Danni</a>, <a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>, <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">Gruppi di PNG</a>, <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">Maestrie</a>.</p>","text":"Il combattimento non è un sottosistema separato: resta una conversazione in cui le mosse scattano quando la narrazione lo richiede (vedi Gestire le Scene di Combattimento). Le mosse base restano utili (es. Valutare una Situazione Tesa per +1, Convincere un PNG alla resa). Mosse base con le armi (tutti): Attaccare in Mischia, Lottare con un Nemico, Prendere la Mira. Abilità con le armi (vedi Abilità con le Armi): - Manuale base: Assaltare un Gruppo, Colpo Crudele, Confondere i Sensi, Disarmare, Fracassare, Improvvisare un'Arma, Incalzare un Gruppo, Parare, Tiro da Maestro, Tiro Rapido. - Viandanti e Forestieri: Furia di Battaglia (Battle Fury), Carica (Charge), Scagliare (Hurl), Affondo (Lunge), Combattere in Coppia (Paired Fighting), Zampe di Martello (Hammerpaws), Tiro di Precisione (Pinpoint Shot), Tiro Lungo (Long Shot), Tiro a Bruciapelo (Point-Blank Shot), Cambiare Mano (Switch Hands). - Rovine e Spedizioni: Spazzata d'Arco (Sweep), Colpo di Pomo (Pommel Strike), Svolazzo Terrificante (Frightful Flourish), Stoccata a Sorpresa (Surprise Jab). Regole collegate: Distanze, Danno e Tracciati dei Danni, Armatura e Scudi, Gruppi di PNG, Maestrie.","back":["mosse"]},{"id":"abilita-armi","title":"Abilità con le Armi","cat":"armi","group":"","src":"B p.57-58, 90","aliases":["abilità con le armi","abilità con l'arma","etichetta dell'abilità"],"html":"<p>Tecniche di combattimento specifiche apprese dal vagabondo. Per usarne una devi:</p><ol><li>averla <strong>segnata sul playbook</strong>;</li><li>impugnare un'arma con <strong>l'etichetta di quella abilità</strong> (salvo le abilità \"senza etichetta\" come <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a>, <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a>, <a class=\"xl\" href=\"#scagliare\" data-id=\"scagliare\">Scagliare (Hurl)</a>, <a class=\"xl\" href=\"#zampe-martello\" data-id=\"zampe-martello\">Zampe di Martello (Hammerpaws)</a>, <a class=\"xl\" href=\"#svolazzo-terrificante\" data-id=\"svolazzo-terrificante\">Svolazzo Terrificante (Frightful Flourish)</a>);</li><li>soddisfare le condizioni narrative dell'innesco.</li></ol><p>Alla creazione ne scegli una tra le quattro in grassetto del playbook; poi si ottengono con l'<a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a> (max 7) o tramite mosse (segnate con una barra, non contano nel limite).</p>","text":"Tecniche di combattimento specifiche apprese dal vagabondo. Per usarne una devi: 1. averla segnata sul playbook; 2. impugnare un'arma con l'etichetta di quella abilità (salvo le abilità \"senza etichetta\" come Confondere i Sensi, Improvvisare un'Arma, Scagliare (Hurl), Zampe di Martello (Hammerpaws), Svolazzo Terrificante (Frightful Flourish)); 3. soddisfare le condizioni narrative dell'innesco. Alla creazione ne scegli una tra le quattro in grassetto del playbook; poi si ottengono con l'Avanzamento (max 7) o tramite mosse (segnate con una barra, non contano nel limite).","back":["creazione","avanzamento","mosse-armi-indice"]},{"id":"distanze","title":"Distanze","cat":"armi","group":"","src":"B p.91","aliases":["distanza","distanze","a contatto","ravvicinata","distanza lunga"],"html":"<p>Tre distanze narrative:</p><ul><li><strong>A contatto</strong>: puoi sentire il suo respiro; per lottare, toccare, abbracciare.</li><li><strong>Ravvicinata</strong>: abbastanza vicino da sentirlo parlare e raggiungerlo con un balzo; per spade, pugni, lanci.</li><li><strong>Lunga</strong>: devi alzare la voce per farti sentire; per archi, osservare da lontano.</li></ul><p>Oltre la distanza lunga non si combatte (salvo <a class=\"xl\" href=\"#tiro-lungo\" data-id=\"tiro-lungo\">Tiro Lungo (Long Shot)</a>). Senza un'arma per quella distanza non puoi infliggere danni né usare mosse a quella distanza. Ogni arma ha almeno una distanza; distanze extra aumentano il <a class=\"xl\" href=\"#valore\" data-id=\"valore\">Valore</a>.</p>","text":"Tre distanze narrative: - A contatto: puoi sentire il suo respiro; per lottare, toccare, abbracciare. - Ravvicinata: abbastanza vicino da sentirlo parlare e raggiungerlo con un balzo; per spade, pugni, lanci. - Lunga: devi alzare la voce per farti sentire; per archi, osservare da lontano. Oltre la distanza lunga non si combatte (salvo Tiro Lungo (Long Shot)). Senza un'arma per quella distanza non puoi infliggere danni né usare mosse a quella distanza. Ogni arma ha almeno una distanza; distanze extra aumentano il Valore.","back":["mosse-armi-indice","equipaggiamento"]},{"id":"attaccare-mischia","title":"Attaccare in Mischia","cat":"armi","group":"","src":"B p.92-94","aliases":["attaccare in mischia","attacchi in mischia","scambiatevi i danni","scambiare i danni"],"html":"<div class=\"move\"><p><strong>Quando attacchi in mischia a distanza ravvicinata o a contatto, tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo <strong>vi scambiate i danni</strong>. Con <span class=\"res\">10+</span> scegli 3 opzioni, con <span class=\"res\">7-9</span> una:</p><ul><li>Infliggi un danno grave (+1).</li><li>Subisci un danno leggero (-1).</li><li>Modifichi la distanza di uno step.</li><li>Impressioni, sgomenti o intimorisci l'avversario.</li></ul></div><ul><li>Serve uno scambio di colpi: se il nemico non può reagire lo colpisci e basta. Include le scazzottate a distanza (se lo afferri è <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a>).</li><li>Di base un'arma infligge 1-ferita, i pugni 1-fatica. L'avversario può anche essere un piccolo gruppo (vedi <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">Gruppi di PNG</a>, <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>).</li><li>\"Impressioni\" spesso significa un danno al <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a>.</li></ul>","text":"Quando attacchi in mischia a distanza ravvicinata o a contatto, tira su Vigore. Con un successo vi scambiate i danni. Con 10+ scegli 3 opzioni, con 7-9 una: - Infliggi un danno grave (+1). - Subisci un danno leggero (-1). - Modifichi la distanza di uno step. - Impressioni, sgomenti o intimorisci l'avversario. - Serve uno scambio di colpi: se il nemico non può reagire lo colpisci e basta. Include le scazzottate a distanza (se lo afferri è Lottare con un Nemico). - Di base un'arma infligge 1-ferita, i pugni 1-fatica. L'avversario può anche essere un piccolo gruppo (vedi Gruppi di PNG, Assaltare un Gruppo). - \"Impressioni\" spesso significa un danno al Morale.","back":["vigore","mosse-armi-indice","tag-acciaio-conigli","pb-avventuriero-sottomettere","pb-esule-grande"]},{"id":"lottare","title":"Lottare con un Nemico","cat":"armi","group":"","src":"B p.94-95","aliases":["lottare con un nemico","lottare","lotti"],"html":"<div class=\"move\"><p><strong>Quando lotti corpo a corpo con un nemico, tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo tu e l'avversario scegliete <strong>contemporaneamente</strong> un'opzione, e continuate così finché uno dei due non si ritira, sviene o muore. Con <span class=\"res\">10+</span> scegli prima tu, poi si procede contemporaneamente:</p><ul><li>Sferri un colpo rapido: infliggi ferite.</li><li>Lo sfinisci: il nemico segna fatica.</li><li>Sfrutti una sua debolezza: segna fatica per infliggere 2-ferite.</li><li>Ti ritiri: disimpegnati a distanza ravvicinata.</li></ul></div><p>Si lotta senza armi e contro un solo nemico alla volta. Scrivete le scelte e rivelatele insieme; gli effetti sono simultanei.</p>","text":"Quando lotti corpo a corpo con un nemico, tira su Vigore. Con un successo tu e l'avversario scegliete contemporaneamente un'opzione, e continuate così finché uno dei due non si ritira, sviene o muore. Con 10+ scegli prima tu, poi si procede contemporaneamente: - Sferri un colpo rapido: infliggi ferite. - Lo sfinisci: il nemico segna fatica. - Sfrutti una sua debolezza: segna fatica per infliggere 2-ferite. - Ti ritiri: disimpegnati a distanza ravvicinata. Si lotta senza armi e contro un solo nemico alla volta. Scrivete le scelte e rivelatele insieme; gli effetti sono simultanei.","back":["vigore","mosse-armi-indice","attaccare-mischia","tag-flessibile","pb-ladro-zampine","pb-campione-abilita","pb-cercatore-terreno"]},{"id":"prendere-mira","title":"Prendere la Mira","cat":"armi","group":"","src":"B p.96-97","aliases":["prendere la mira","prendi la mira"],"html":"<div class=\"move\"><p><strong>Quando prendi la mira a distanza lunga su un nemico vulnerabile, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con un successo infliggi ferite. Con <span class=\"res\">10+</span> scegli: un secondo colpo prima che corra al riparo (infliggi ancora ferite) oppure mantieni nascosta la tua posizione.</p></div><p>\"Vulnerabile\" significa che può davvero essere colpito (non coperto da un'armatura completa o dai merli). Usare un arco a distanza ravvicinata senza abilità/etichette offre al GM un'opportunità d'oro.</p>","text":"Quando prendi la mira a distanza lunga su un nemico vulnerabile, tira su Destrezza. Con un successo infliggi ferite. Con 10+ scegli: un secondo colpo prima che corra al riparo (infliggi ancora ferite) oppure mantieni nascosta la tua posizione. \"Vulnerabile\" significa che può davvero essere colpito (non coperto da un'armatura completa o dai merli). Usare un arco a distanza ravvicinata senza abilità/etichette offre al GM un'opportunità d'oro.","back":["destrezza","mosse-armi-indice","incalzare-gruppo","tag-alto-libraggio","pb-giudice-tiro"]},{"id":"assaltare-gruppo","title":"Assaltare un Gruppo","cat":"armi","group":"","src":"B p.97-98","aliases":["assaltare un gruppo","Storm a Group"],"html":"<div class=\"move\"><p><strong>Quando assalti un gruppo di nemici in mischia, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo vi scambiate i danni. Con <span class=\"res\">10+</span> scegli 2, con <span class=\"res\">7-9</span> una:</p><ul><li>Gliela fai vedere: infliggi 2 danni al morale.</li><li>Li cogli alla sprovvista: infliggi 2-fatica.</li><li>Schivi al meglio: subisci un danno leggero (-1).</li><li>Li metti l'uno contro l'altro: segna un'altra fatica e si infliggono danni da soli.</li></ul></div><p>Distanza ravvicinata o a contatto; armi veloci e lunghe o ad ampio raggio. Ricorda che i <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">gruppi</a> infliggono più danni. Maestria (<span class=\"res\">12+</span>): tutte e quattro le opzioni, una con effetto doppio.</p>","text":"Quando assalti un gruppo di nemici in mischia, segna fatica e tira su Vigore. Con un successo vi scambiate i danni. Con 10+ scegli 2, con 7-9 una: - Gliela fai vedere: infliggi 2 danni al morale. - Li cogli alla sprovvista: infliggi 2-fatica. - Schivi al meglio: subisci un danno leggero (-1). - Li metti l'uno contro l'altro: segna un'altra fatica e si infliggono danni da soli. Distanza ravvicinata o a contatto; armi veloci e lunghe o ad ampio raggio. Ricorda che i gruppi infliggono più danni. Maestria (12+): tutte e quattro le opzioni, una con effetto doppio.","back":["vigore","morale","mosse-armi-indice","attaccare-mischia","png-gruppi","maestria-armi"]},{"id":"colpo-crudele","title":"Colpo Crudele","cat":"armi","group":"","src":"B p.99","aliases":["colpo crudele","Vicious Strike"],"html":"<div class=\"move\"><p><strong>Quando sei a distanza ravvicinata o a contatto e colpisci brutalmente il punto debole di un avversario, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo infliggi un danno grave (+1) e il nemico <strong>non può segnare usura sull'armatura</strong> per assorbirlo. Con <span class=\"res\">10+</span> colpisci senza essere colpito; con <span class=\"res\">7-9</span> anche lui ti colpisce (o ti afferra).</p></div><p>Devi conoscere o creare un punto debole. Armi piccole e letali (pugnali). Maestria (<span class=\"res\">12+</span>): lo menomi finché non riceve cure (non può muoversi, o impugnare armi, o comunicare).</p>","text":"Quando sei a distanza ravvicinata o a contatto e colpisci brutalmente il punto debole di un avversario, segna fatica e tira su Vigore. Con un successo infliggi un danno grave (+1) e il nemico non può segnare usura sull'armatura per assorbirlo. Con 10+ colpisci senza essere colpito; con 7-9 anche lui ti colpisce (o ti afferra). Devi conoscere o creare un punto debole. Armi piccole e letali (pugnali). Maestria (12+): lo menomi finché non riceve cure (non può muoversi, o impugnare armi, o comunicare).","back":["mosse-armi-indice","armatura","maestria-armi","pb-buongustaio-filetto"]},{"id":"confondere-sensi","title":"Confondere i Sensi","cat":"armi","group":"","src":"B p.100-101","aliases":["confondere i sensi","Confuse Senses"],"html":"<div class=\"move\"><p><strong>Quando sei a contatto o a distanza ravvicinata e lanci qualcosa per confondere i sensi dell'avversario, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con un successo perde l'equilibrio, è accecato o confuso e ottieni un'<strong>opportunità</strong> (di solito elimina l'incertezza: fuggi o colpisci senza altre mosse). Con <span class=\"res\">10+</span> gli serve tempo per riprendersi; con <span class=\"res\">7-9</span> hai solo qualche secondo.</p></div><p><strong>Non richiede etichetta</strong>: basta qualcosa da lanciare. Con un fumogeno puoi colpire un gruppo. Maestria (<span class=\"res\">12+</span>): confondi tutto il gruppo, oppure puoi mettere fuori gioco un singolo nemico come vuoi.</p>","text":"Quando sei a contatto o a distanza ravvicinata e lanci qualcosa per confondere i sensi dell'avversario, tira su Destrezza. Con un successo perde l'equilibrio, è accecato o confuso e ottieni un'opportunità (di solito elimina l'incertezza: fuggi o colpisci senza altre mosse). Con 10+ gli serve tempo per riprendersi; con 7-9 hai solo qualche secondo. Non richiede etichetta: basta qualcosa da lanciare. Con un fumogeno puoi colpire un gruppo. Maestria (12+): confondi tutto il gruppo, oppure puoi mettere fuori gioco un singolo nemico come vuoi.","back":["mosse-armi-indice","abilita-armi","maestria-armi","pb-ciarlatano-sabbia"]},{"id":"disarmare","title":"Disarmare","cat":"armi","group":"","src":"B p.101-102","aliases":["disarmare","disarmi","Disarm"],"html":"<div class=\"move\"><p><strong>Quando sei a distanza ravvicinata e punti a colpire l'arma del nemico, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con un successo il nemico deve segnare 2-fatica o perdere la presa sull'arma (finisce fuori portata). Con <span class=\"res\">10+</span> deve segnare 3-fatica invece di 2.</p></div><p>Se non ha fatica e sceglie di tenere l'arma, sviene o è fuori combattimento. Armi lunghe con guardia (stocchi). Maestria (<span class=\"res\">12+</span>): segna 3-fatica <strong>e</strong> perde l'arma.</p>","text":"Quando sei a distanza ravvicinata e punti a colpire l'arma del nemico, tira su Destrezza. Con un successo il nemico deve segnare 2-fatica o perdere la presa sull'arma (finisce fuori portata). Con 10+ deve segnare 3-fatica invece di 2. Se non ha fatica e sceglie di tenere l'arma, sviene o è fuori combattimento. Armi lunghe con guardia (stocchi). Maestria (12+): segna 3-fatica e perde l'arma.","back":["mosse-armi-indice","maestria-armi","pb-nomade-prendo"]},{"id":"fracassare","title":"Fracassare","cat":"armi","group":"","src":"B p.102","aliases":["fracassare","Cleave"],"html":"<div class=\"move\"><p><strong>Quando fracassi le armature dei nemici a distanza ravvicinata, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo sfondi le difese: infliggi <strong>3-usura</strong>. Con <span class=\"res\">7-9</span> danneggi la tua arma o ti esponi: segna usura oppure finisci in una brutta posizione.</p></div><p>Non puoi usarla con la fatica piena. Se infliggi più usura delle caselle disponibili, l'armatura è distrutta. Armi grosse e pesanti. Maestria (<span class=\"res\">12+</span>): infliggi 6-usura; l'eccesso diventa ferite o fatica.</p>","text":"Quando fracassi le armature dei nemici
