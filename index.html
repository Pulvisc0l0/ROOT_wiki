 a mani nude: <strong>Vigore</strong>.</li></ul><p>Modificatori facoltativi:</p><ul><li>+1 kit da pesca adatto;</li><li>+1 se un abitante ti indica il punto giusto;</li><li>-1 acque povere (siccità, gelo);</li><li>-1 zona pattugliata o contesa.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni tutto il Pescato potenziale e 1 Bonus.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1:<ul><li>tutto il Pescato potenziale, ma 1 Guaio;</li><li>Pescato potenziale -1 (minimo 0) e 1 Bonus.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: Pescato potenziale -2 (minimo 0); il GM introduce un Guaio forte (o 2 Guai) e segni anche 1-fatica (o 1-usura sull'attrezzo).</li></ul></div><p><strong>Bonus</strong> (tira 1d6):</p><ol><li>taglia grossa: +1 Pescato;</li><li>pescato pregiato: vale 2-Valore;</li><li>un indizio nel fango verso un luogo interessante;</li><li>un abitante ti deve un favore;</li><li>silenzio e calma: svuota 1-fatica extra;</li><li>scorta utile: +1 a Pescare la prossima volta in questa radura.</li></ol><p><strong>Guai</strong> (tira 1d6):</p><ol><li>pattuglia o bracconieri (pressione o nomea);</li><li>attrezzo danneggiato: 1-usura;</li><li>bestia o corrente: 1-fatica o un pericolo;</li><li>il pescato attira un PNG affamato che ne pretende una parte;</li><li>acqua cattiva: 1-fatica, o -1 finché non riposi;</li><li>ti sei esposto: qualcuno ora sa dove siete.</li></ol>","text":"Regola della casa del vostro gruppo, costruita sul consumo (1 Pescato = svuota 1-consumo oppure circa 1-Valore in cibo o merce). Durata → Pescato potenziale (come la raccolta di consumo): - poche ore: 1; - 1-2 giorni: 2; - un paio di giorni: 3; - una settimana: 4. Quando dedichi tempo a pescare in una radura o lungo un corso d'acqua, dichiara durata e metodo, poi tira 2d6 + la caratteristica del metodo: - canna, lenza ed esche: Destrezza; - nasse, trappole o reti: Astuzia; - arpione o a mani nude: Vigore. Modificatori facoltativi: - +1 kit da pesca adatto; - +1 se un abitante ti indica il punto giusto; - -1 acque povere (siccità, gelo); - -1 zona pattugliata o contesa. Risultati: - 10+ (successo pieno): ottieni tutto il Pescato potenziale e 1 Bonus. - 7-9 (successo parziale): scegli 1: - tutto il Pescato potenziale, ma 1 Guaio; - Pescato potenziale -1 (minimo 0) e 1 Bonus. - 6- (fallimento): Pescato potenziale -2 (minimo 0); il GM introduce un Guaio forte (o 2 Guai) e segni anche 1-fatica (o 1-usura sull'attrezzo). Bonus (tira 1d6): 1. taglia grossa: +1 Pescato; 2. pescato pregiato: vale 2-Valore; 3. un indizio nel fango verso un luogo interessante; 4. un abitante ti deve un favore; 5. silenzio e calma: svuota 1-fatica extra; 6. scorta utile: +1 a Pescare la prossima volta in questa radura. Guai (tira 1d6): 1. pattuglia o bracconieri (pressione o nomea); 2. attrezzo danneggiato: 1-usura; 3. bestia o corrente: 1-fatica o un pericolo; 4. il pescato attira un PNG affamato che ne pretende una parte; 5. acqua cattiva: 1-fatica, o -1 finché non riposi; 6. ti sei esposto: qualcuno ora sa dove siete.","back":[]},{"id":"tag-accurata","title":"Accurata (Accurate)","cat":"etichette","group":"","src":"VF p.82","aliases":["Accurate"],"html":"<p>+ Quando infliggi ferite con quest'arma, segna fatica per colpire una parte specifica del corpo del bersaglio e menomarla finché non ha tempo di guarire. (Archi, coltelli) <em>(trad. non ufficiale)</em></p>","text":"+ Quando infliggi ferite con quest'arma, segna fatica per colpire una parte specifica del corpo del bersaglio e menomarla finché non ha tempo di guarire. (Archi, coltelli) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-uncinata","title":"Uncinata (Barbed)","cat":"etichette","group":"","src":"VF p.82","aliases":["Barbed"],"html":"<p>+ Quando agganci qualcuno con la punta di quest'arma, segna fatica per portarti a contatto e <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lottare</a> con lui come se avessi ottenuto <span class=\"res\">10+</span>. (Lance, asce, catene) <em>(trad. non ufficiale)</em></p>","text":"+ Quando agganci qualcuno con la punta di quest'arma, segna fatica per portarti a contatto e lottare con lui come se avessi ottenuto 10+. (Lance, asce, catene) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-mimetica","title":"Mimetica (Blend)","cat":"etichette","group":"","src":"VF p.82","aliases":["Blend"],"html":"<p>+ Quando usi quest'oggetto per confonderti nell'ambiente adatto, segna usura per tentare <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a> o <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a> come se possedessi quelle imprese. Se le possiedi già, nella stessa situazione segna usura per avere invece +1 continuo per la scena. (Mimetizzazioni, abiti locali) <em>(trad. non ufficiale)</em></p>","text":"+ Quando usi quest'oggetto per confonderti nell'ambiente adatto, segna usura per tentare Sgattaiolare o Nascondersi come se possedessi quelle imprese. Se le possiedi già, nella stessa situazione segna usura per avere invece +1 continuo per la scena. (Mimetizzazioni, abiti locali) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-catartico","title":"Catartico (Cathartic)","cat":"etichette","group":"","src":"VF p.82","aliases":["Cathartic"],"html":"<p>+ Quando usi quest'oggetto per un'attività ricreativa con un altro vagabondo, segna 2-usura: entrambi svuotate 2-fatica. (Materiale artistico, arco e frecce) <em>(trad. non ufficiale)</em></p>","text":"+ Quando usi quest'oggetto per un'attività ricreativa con un altro vagabondo, segna 2-usura: entrambi svuotate 2-fatica. (Materiale artistico, arco e frecce) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-comune","title":"Comune (Common)","cat":"etichette","group":"","src":"VF p.82","aliases":["Common"],"html":"<p>+ Quando ripari quest'oggetto, ripari il doppio dell'usura allo stesso Valore. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando ripari quest'oggetto, ripari il doppio dell'usura allo stesso Valore. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-disarmante","title":"Disarmante (Disarming)","cat":"etichette","group":"","src":"VF p.82","aliases":["Disarming"],"html":"<p>+ Chi ti vede con quest'oggetto addosso ti sottovaluta. Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni un PNG</a> sembrando debole o innocuo, segna fatica per trasformare un fallimento in <span class=\"res\">7-9</span> o un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Abiti logori, tonache di sacco) <em>(trad. non ufficiale)</em></p>","text":"+ Chi ti vede con quest'oggetto addosso ti sottovaluta. Quando inganni un PNG sembrando debole o innocuo, segna fatica per trasformare un fallimento in 7-9 o un 7-9 in 10+. (Abiti logori, tonache di sacco) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-distraente","title":"Distraente (Distracting)","cat":"etichette","group":"","src":"VF p.82","aliases":["Distracting"],"html":"<p>+ Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> con un nemico impugnando o mostrando quest'oggetto, segna fatica per trasformare un fallimento in <span class=\"res\">7-9</span> o un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Qualsiasi cosa che distragga il nemico alla vista o all'udito) <em>(trad. non ufficiale)</em></p>","text":"+ Quando lotti con un nemico impugnando o mostrando quest'oggetto, segna fatica per trasformare un fallimento in 7-9 o un 7-9 in 10+. (Qualsiasi cosa che distragga il nemico alla vista o all'udito) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-camuffata","title":"Camuffata (Disguised)","cat":"etichette","group":"","src":"VF p.82","aliases":["Disguised"],"html":"<p>+ Finché non si rivela un'arma, viene trattata come se non lo fosse. Quando tenti <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> con quest'arma ancora non rivelata, segna usura per trasformare un fallimento in <span class=\"res\">7-9</span> o un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Armi camuffate da oggetti comuni) <em>(trad. non ufficiale)</em></p>","text":"+ Finché non si rivela un'arma, viene trattata come se non lo fosse. Quando tenti Attaccare alle Spalle con quest'arma ancora non rivelata, segna usura per trasformare un fallimento in 7-9 o un 7-9 in 10+. (Armi camuffate da oggetti comuni) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-nascosta","title":"Nascosta (Hidden)","cat":"etichette","group":"","src":"VF p.82","aliases":["Hidden"],"html":"<p>+ Quando vieni perquisito o esaminato, segna fatica perché l'oggetto passi inosservato. Segna usura per tentare <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> se non possiedi l'impresa, o per prendere <span class=\"res\">10+</span> senza tirare se la possiedi. (Stiletti, manganelli) <em>(trad. non ufficiale)</em></p>","text":"+ Quando vieni perquisito o esaminato, segna fatica perché l'oggetto passi inosservato. Segna usura per tentare Attaccare alle Spalle se non possiedi l'impresa, o per prendere 10+ senza tirare se la possiedi. (Stiletti, manganelli) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-impressionante","title":"Impressionante (Impressive)","cat":"etichette","group":"","src":"VF p.82","aliases":["Impressive"],"html":"<p>+ Quando <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">assalti un gruppo</a> impugnando quest'oggetto, segna usura per infliggergli 2 danni al morale, oltre alle conseguenze del tiro. (Martello a forma di teschio, spada nera) <em>(trad. non ufficiale)</em></p>","text":"+ Quando assalti un gruppo impugnando quest'oggetto, segna usura per infliggergli 2 danni al morale, oltre alle conseguenze del tiro. (Martello a forma di teschio, spada nera) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-incendiario","title":"Incendiario (Incendiary)","cat":"etichette","group":"","src":"VF p.82","aliases":["Incendiary"],"html":"<p>+ L'oggetto ispira i membri di una fazione e fa infuriare quelli di un'altra. Quando lo dai apertamente a chi è interessato per diffonderne il messaggio, segna prestigio pari al suo Valore con la fazione favorevole e nomea pari al suo Valore con quella contraria. (Opuscoli, libelli, testi diffamatori) <em>(trad. non ufficiale)</em></p>","text":"+ L'oggetto ispira i membri di una fazione e fa infuriare quelli di un'altra. Quando lo dai apertamente a chi è interessato per diffonderne il messaggio, segna prestigio pari al suo Valore con la fazione favorevole e nomea pari al suo Valore con quella contraria. (Opuscoli, libelli, testi diffamatori) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-intimidatoria","title":"Intimidatoria (Intimidating)","cat":"etichette","group":"","src":"VF p.82","aliases":["Intimidating"],"html":"<p>+ Quando ostenti quest'oggetto per <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convincere un PNG</a> con le minacce, puoi segnare 2-nomea con la sua fazione per trasformare un fallimento in <span class=\"res\">7-9</span> o un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Qualsiasi arma) <em>(trad. non ufficiale)</em></p>","text":"+ Quando ostenti quest'oggetto per convincere un PNG con le minacce, puoi segnare 2-nomea con la sua fazione per trasformare un fallimento in 7-9 o un 7-9 in 10+. (Qualsiasi arma) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-ispirante","title":"Ispirante (Inspiring)","cat":"etichette","group":"","src":"VF p.82","aliases":["Inspiring"],"html":"<p>+ Quando usi quest'oggetto per <a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">aiutare</a> un altro vagabondo, puoi segnare usura invece di fatica. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando usi quest'oggetto per aiutare un altro vagabondo, puoi segnare usura invece di fatica. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-corroborante","title":"Corroborante (Invigorating)","cat":"etichette","group":"","src":"VF p.82","aliases":["Invigorating"],"html":"<p>+ Quando consumi quest'oggetto, segna 2-ferite per svuotare tutta la fatica e aggiungere 2 caselle al tracciato della fatica per il resto della scena (a fine scena spariscono, segnate o no, senza altri effetti). (Stimolanti) <em>(trad. non ufficiale)</em></p>","text":"+ Quando consumi quest'oggetto, segna 2-ferite per svuotare tutta la fatica e aggiungere 2 caselle al tracciato della fatica per il resto della scena (a fine scena spariscono, segnate o no, senza altri effetti). (Stimolanti) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-leggendario","title":"Leggendario (Legendary)","cat":"etichette","group":"","src":"VF p.83","aliases":["Legendary"],"html":"<p>+ L'oggetto ha un suo tracciato di reputazione, la <strong>Leggenda</strong> (equivalente a 15 caselle di prestigio): parte da Leggenda +1 senza caselle segnate; per salire a +2 servono 10 caselle (poi si svuota il tracciato), per +3 ne servono 15. Ha una fazione <strong>prediletta</strong> e una <strong>odiata</strong>.</p><ul><li>Quando lo impugni apertamente non segni prestigio né nomea: segni invece Leggenda sull'oggetto quando aiuti la fazione prediletta o danneggi quella odiata.</li><li>Nelle <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a> tiri con la Leggenda dell'oggetto invece che con la tua Reputazione.</li><li>Ogni sessione in cui non segni Leggenda, svuota 1 casella; se non ne hai, la Leggenda scende di 1.</li></ul><p>(Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ L'oggetto ha un suo tracciato di reputazione, la Leggenda (equivalente a 15 caselle di prestigio): parte da Leggenda +1 senza caselle segnate; per salire a +2 servono 10 caselle (poi si svuota il tracciato), per +3 ne servono 15. Ha una fazione prediletta e una odiata. - Quando lo impugni apertamente non segni prestigio né nomea: segni invece Leggenda sull'oggetto quando aiuti la fazione prediletta o danneggi quella odiata. - Nelle mosse di reputazione tiri con la Leggenda dell'oggetto invece che con la tua Reputazione. - Ogni sessione in cui non segni Leggenda, svuota 1 casella; se non ne hai, la Leggenda scende di 1. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-leggero","title":"Leggero (Light)","cat":"etichette","group":"","src":"VF p.83","aliases":["Light"],"html":"<p>+ Non conta per il tuo <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>. (Qualsiasi oggetto fatto di materiali più leggeri del solito) <em>(trad. non ufficiale)</em></p>","text":"+ Non conta per il tuo Ingombro. (Qualsiasi oggetto fatto di materiali più leggeri del solito) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-brutale","title":"Brutale (Nasty)","cat":"etichette","group":"","src":"VF p.83","aliases":["Nasty"],"html":"<p>+ Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> con un nemico, la prima scelta tua e quella del nemico hanno effetto doppio. (Guanti pesanti o altre armi pesanti) <em>(trad. non ufficiale)</em></p>","text":"+ Quando lotti con un nemico, la prima scelta tua e quella del nemico hanno effetto doppio. (Guanti pesanti o altre armi pesanti) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-avvelenata","title":"Avvelenata (Poison)","cat":"etichette","group":"","src":"VF p.83","aliases":["Poison"],"html":"<p>+ Quando colpisci un nemico vulnerabile, infliggi fatica invece di ferite e il bersaglio resta avvelenato finché non viene curato:</p><ul><li>ogni volta che compie un'azione significativa o faticosa, gli infliggi fatica;</li><li>se perde i sensi, gli infliggi una ferita ogni 6 ore finché non riceve l'antidoto o muore.</li></ul><p>(Qualsiasi cosa avvelenata) <em>(trad. non ufficiale)</em></p>","text":"+ Quando colpisci un nemico vulnerabile, infliggi fatica invece di ferite e il bersaglio resta avvelenato finché non viene curato: - ogni volta che compie un'azione significativa o faticosa, gli infliggi fatica; - se perde i sensi, gli infliggi una ferita ogni 6 ore finché non riceve l'antidoto o muore. (Qualsiasi cosa avvelenata) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-precisa","title":"Precisa (Precise)","cat":"etichette","group":"","src":"VF p.83","aliases":["Precise"],"html":"<p>+ Segna usura per ignorare l'<a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a> del nemico quando infliggi danno. (Armi sottili) <em>(trad. non ufficiale)</em></p>","text":"+ Segna usura per ignorare l'Armatura e Scudi del nemico quando infliggi danno. (Armi sottili) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-rinforzata","title":"Rinforzata (Reinforced)","cat":"etichette","group":"","src":"VF p.83","aliases":["Reinforced"],"html":"<p>+ Indossando quest'armatura puoi assorbire le ferite come fatica, una per una, invece che come usura. (Armature) <em>(trad. non ufficiale)</em></p>","text":"+ Indossando quest'armatura puoi assorbire le ferite come fatica, una per una, invece che come usura. (Armature) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-robusto","title":"Robusto (Sturdy)","cat":"etichette","group":"","src":"VF p.83","aliases":["Sturdy"],"html":"<p>+ Quando dovresti segnare usura su quest'oggetto, puoi segnare invece fatica. Non puoi segnare fatica per assorbire ferite con questa etichetta. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando dovresti segnare usura su quest'oggetto, puoi segnare invece fatica. Non puoi segnare fatica per assorbire ferite con questa etichetta. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-vistosa","title":"Vistosa (Conspicuous)","cat":"etichette","group":"","src":"VF p.84","aliases":["Conspicuous"],"html":"<p>− Quando <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">prendi la mira</a> su un nemico vulnerabile a distanza lunga, non puoi mantenere nascosta la tua posizione, nemmeno con <span class=\"res\">10+</span>. Segna usura per ignorare questo effetto. (Armi a distanza lunga particolarmente rumorose o visibili) <em>(trad. non ufficiale)</em></p>","text":"− Quando prendi la mira su un nemico vulnerabile a distanza lunga, non puoi mantenere nascosta la tua posizione, nemmeno con 10+. Segna usura per ignorare questo effetto. (Armi a distanza lunga particolarmente rumorose o visibili) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-maledetto","title":"Maledetto (Cursed)","cat":"etichette","group":"","src":"VF p.84","aliases":["Cursed"],"html":"<p>− I PNG alleati subiscono danni al <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a> quando ti vedono con quest'oggetto. (Qualsiasi cosa circondata da un mito odioso) <em>(trad. non ufficiale)</em></p>","text":"− I PNG alleati subiscono danni al Morale quando ti vedono con quest'oggetto. (Qualsiasi cosa circondata da un mito odioso) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-pericolosa","title":"Pericolosa (Dangerous)","cat":"etichette","group":"","src":"VF p.84","aliases":["Dangerous"],"html":"<p>− Quando fai una mossa con le armi con quest'oggetto e ottieni <span class=\"res\">7-9</span>, segna una ferita oltre alle altre conseguenze. (Alcuni esplosivi, armi difficili) <em>(trad. non ufficiale)</em></p>","text":"− Quando fai una mossa con le armi con quest'oggetto e ottieni 7-9, segna una ferita oltre alle altre conseguenze. (Alcuni esplosivi, armi difficili) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-difficile-impugnare","title":"Difficile da Impugnare (Hard to Hold)","cat":"etichette","group":"","src":"VF p.84","aliases":["Hard to Hold"],"html":"<p>− Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> con un nemico e ottieni <span class=\"res\">7-9</span>, perdi la presa su quest'oggetto oltre alle altre conseguenze del tiro. Segna fatica per ignorare questo effetto. (Qualsiasi cosa con una cattiva presa) <em>(trad. non ufficiale)</em></p>","text":"− Quando lotti con un nemico e ottieni 7-9, perdi la presa su quest'oggetto oltre alle altre conseguenze del tiro. Segna fatica per ignorare questo effetto. (Qualsiasi cosa con una cattiva presa) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-riconoscibile","title":"Riconoscibile (Identifiable)","cat":"etichette","group":"","src":"VF p.84","aliases":["Identifiable"],"html":"<p>− L'oggetto è noto per essere legato a una certa persona: chiunque lo veda lo riconosce subito e ti associa a lei. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"− L'oggetto è noto per essere legato a una certa persona: chiunque lo veda lo riconosce subito e ti associa a lei. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-immorale","title":"Immorale (Immoral)","cat":"etichette","group":"","src":"VF p.84","aliases":["Immoral"],"html":"<p>− Finché l'oggetto è in vista, non puoi convincere né <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">chiedere favori</a> agli abitanti più direttamente offesi dalla sua natura immorale, e prendi -1 a chiedere favori a tutti gli altri abitanti. (Tirapugni di artigli di gatto, collane di becchi d'uccello) <em>(trad. non ufficiale)</em></p>","text":"− Finché l'oggetto è in vista, non puoi convincere né chiedere favori agli abitanti più direttamente offesi dalla sua natura immorale, e prendi -1 a chiedere favori a tutti gli altri abitanti. (Tirapugni di artigli di gatto, collane di becchi d'uccello) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-compromettente","title":"Compromettente (Incriminating)","cat":"etichette","group":"","src":"VF p.84","aliases":["Incriminating"],"html":"<p>− La prima volta che un membro importante della fazione offesa da quest'oggetto ti vede con esso, segna nomea con quella fazione. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"− La prima volta che un membro importante della fazione offesa da quest'oggetto ti vede con esso, segna nomea con quella fazione. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-di-fortuna","title":"Di Fortuna (Makeshift)","cat":"etichette","group":"","src":"VF p.84","aliases":["Makeshift"],"html":"<p>− L'oggetto non può essere riparato. Questa etichetta toglie 2-Valore invece di 1. (Oggetti creati con <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a>) <em>(trad. non ufficiale)</em></p>","text":"− L'oggetto non può essere riparato. Questa etichetta toglie 2-Valore invece di 1. (Oggetti creati con Improvvisare un'Arma) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-rumoroso","title":"Rumoroso (Noisy)","cat":"etichette","group":"","src":"VF p.84","aliases":["Noisy"],"html":"<p>− Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi qualcosa</a> con quest'oggetto attiri sempre l'attenzione, qualunque sia il risultato. (Esplosivi) <em>(trad. non ufficiale)</em></p>","text":"− Quando distruggi qualcosa con quest'oggetto attiri sempre l'attenzione, qualunque sia il risultato. (Esplosivi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-ricambi-rari","title":"Ricambi Rari (Scarce)","cat":"etichette","group":"","src":"VF p.84","aliases":["Scarce"],"html":"<p>− Gli attrezzi per ripararlo non sono comuni: le riparazioni normali possono svuotare l'usura solo fino a una casella in meno del massimo (un oggetto con 3 caselle si ripara al massimo fino a 2-usura segnata). Le riparazioni complete richiedono specialisti con attrezzature rare. (Oggetti antichi o rari) <em>(trad. non ufficiale)</em></p>","text":"− Gli attrezzi per ripararlo non sono comuni: le riparazioni normali possono svuotare l'usura solo fino a una casella in meno del massimo (un oggetto con 3 caselle si ripara al massimo fino a 2-usura segnata). Le riparazioni complete richiedono specialisti con attrezzature rare. (Oggetti antichi o rari) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-elsa-tassi","title":"Elsa dei Tassi (Badgerfolk Hilt)","cat":"etichette","group":"","src":"RS p.53","aliases":["Badgerfolk Hilt"],"html":"<p>+ Impugnando quest'arma puoi segnare usura per evitare di essere disarmato. (Armi con elsa) <em>(trad. non ufficiale)</em></p>","text":"+ Impugnando quest'arma puoi segnare usura per evitare di essere disarmato. (Armi con elsa) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-ammaliante","title":"Ammaliante (Beguiling)","cat":"etichette","group":"","src":"RS p.53","aliases":["Beguiling"],"html":"<p>+ Quando cerchi di <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> o <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a> un PNG impugnando o mostrando quest'oggetto e ottieni <span class=\"res\">12+</span>, segna fatica per aggiungere le opzioni della <a class=\"xl\" href=\"#maestria-base\" data-id=\"maestria-base\">maestria</a>. (Armature, abiti, ninnoli) <em>(trad. non ufficiale)</em></p>","text":"+ Quando cerchi di Ingannare un PNG o Convincere un PNG un PNG impugnando o mostrando quest'oggetto e ottieni 12+, segna fatica per aggiungere le opzioni della maestria. (Armature, abiti, ninnoli) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-avvolgente","title":"Avvolgente (Binding)","cat":"etichette","group":"","src":"RS p.53","aliases":["Binding"],"html":"<p>+ Quando <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attacchi in mischia</a> a distanza ravvicinata, aggiungi questa opzione all'elenco: segna usura per avvolgere l'arma dell'avversario, poi segna fino a 2-fatica. L'avversario sceglie:</p><ul><li>segna la stessa quantità di fatica;</li><li>oppure gli strappi l'arma di mano.</li></ul><p>(Catene, fruste) <em>(trad. non ufficiale)</em></p>","text":"+ Quando attacchi in mischia a distanza ravvicinata, aggiungi questa opzione all'elenco: segna usura per avvolgere l'arma dell'avversario, poi segna fino a 2-fatica. L'avversario sceglie: - segna la stessa quantità di fatica; - oppure gli strappi l'arma di mano. (Catene, fruste) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-concavo","title":"Concavo (Concave)","cat":"etichette","group":"","src":"RS p.54","aliases":["Concave"],"html":"<p>+ Quando <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attacchi in mischia</a> reggendo questo scudo e ottieni un successo (7+), segna fatica per sbilanciare l'avversario: crei un'opportunità per te o per i tuoi alleati. (Scudi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando attacchi in mischia reggendo questo scudo e ottieni un successo (7+), segna fatica per sbilanciare l'avversario: crei un'opportunità per te o per i tuoi alleati. (Scudi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-stoffa-corvidi","title":"Stoffa dei Corvidi (Corvidfolk Cloth)","cat":"etichette","group":"","src":"RS p.54","aliases":["Corvidfolk Cloth"],"html":"<p>+ Quando usi quest'oggetto per avvicinarti a un bersaglio ignaro, segna usura per tentare <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> o <a class=\"xl\" href=\"#borseggiare\" data-id=\"borseggiare\">Borseggiare</a> come se possedessi quelle imprese. Se le possiedi già, nella stessa situazione segna usura per avere invece +1 continuo per la scena. (Mantelli, cappucci) <em>(trad. non ufficiale)</em></p>","text":"+ Quando usi quest'oggetto per avvicinarti a un bersaglio ignaro, segna usura per tentare Attaccare alle Spalle o Borseggiare come se possedessi quelle imprese. Se le possiedi già, nella stessa situazione segna usura per avere invece +1 continuo per la scena. (Mantelli, cappucci) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-intagliato-gru","title":"Intagliato dalle Gru (Cranecarved)","cat":"etichette","group":"","src":"RS p.54","aliases":["Cranecarved"],"html":"<p>+ Quando usi l'abilità <a class=\"xl\" href=\"#tiro-lungo\" data-id=\"tiro-lungo\">Tiro Lungo</a> con quest'arco, non segni fatica. (Archi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando usi l'abilità Tiro Lungo con quest'arco, non segni fatica. (Archi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-deviante","title":"Deviante (Deflecting)","cat":"etichette","group":"","src":"RS p.54","aliases":["Deflecting"],"html":"<p>+ Puoi segnare usura su quest'arma come se fosse uno scudo o un'armatura; per ogni altro effetto non conta come scudo o armatura. (Protezioni per le mani, spade speciali) <em>(trad. non ufficiale)</em></p>","text":"+ Puoi segnare usura su quest'arma come se fosse uno scudo o un'armatura; per ogni altro effetto non conta come scudo o armatura. (Protezioni per le mani, spade speciali) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-col-sigillo","title":"Col Sigillo (Ensigiled)","cat":"etichette","group":"","src":"RS p.54","aliases":["Ensigiled"],"html":"<p>+ L'oggetto porta il sigillo di una fazione. Impugnandolo o mostrandolo puoi fare la <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mossa di reputazione specifica</a> di quella fazione come se la tua Reputazione fosse di un livello più alta (max +4). <em>(trad. non ufficiale)</em></p>","text":"+ L'oggetto porta il sigillo di una fazione. Impugnandolo o mostrandolo puoi fare la mossa di reputazione specifica di quella fazione come se la tua Reputazione fosse di un livello più alta (max +4). (trad. non ufficiale)","back":["etichette"]},{"id":"tag-affascinante","title":"Affascinante (Fascinating)","cat":"etichette","group":"","src":"RS p.54","aliases":["Fascinating"],"html":"<p>+ Dopo aver <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontrato qualcuno di importante</a>, segna fatica e scegli 1: gli racconti come hai usato quest'oggetto per...</p><ul><li><strong>difendere</strong> una fazione, una persona o una radura: ti dice le ultime notizie su quella cosa;</li><li><strong>combattere</strong> una fazione, una persona o un'idea: ti rivela la sua vera alleanza nel conflitto che hai descritto;</li><li><strong>servire</strong> una fazione, una persona o una causa: ti indica altri che condividono la tua lealtà.</li></ul><p>Puoi segnare fatica per fare una domanda in più: deve rispondere sinceramente, ma può restare vago sui dettagli. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Dopo aver incontrato qualcuno di importante, segna fatica e scegli 1: gli racconti come hai usato quest'oggetto per... - difendere una fazione, una persona o una radura: ti dice le ultime notizie su quella cosa; - combattere una fazione, una persona o un'idea: ti rivela la sua vera alleanza nel conflitto che hai descritto; - servire una fazione, una persona o una causa: ti indica altri che condividono la tua lealtà. Puoi segnare fatica per fare una domanda in più: deve rispondere sinceramente, ma può restare vago sui dettagli. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-impugnatura-lucertole","title":"Impugnatura delle Lucertole (Lizardhewn Grip)","cat":"etichette","group":"","src":"RS p.54","aliases":["Lizardhewn Grip"],"html":"<p>+ La prima volta in uno scontro che <a class=\"xl\" href=\"#parare\" data-id=\"parare\">pari</a> gli attacchi di un nemico con quest'arma, non segni fatica. (Armi leggere) <em>(trad. non ufficiale)</em></p>","text":"+ La prima volta in uno scontro che pari gli attacchi di un nemico con quest'arma, non segni fatica. (Armi leggere) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-minaccioso","title":"Minaccioso (Menacing)","cat":"etichette","group":"","src":"RS p.54","aliases":["Menacing"],"html":"<p>+ Impugnando o mostrando quest'oggetto puoi <a class=\"xl\" href=\"#intimidire-truppe\" data-id=\"intimidire-truppe\">intimidire le truppe nemiche</a> con Reputazione -1 (invece di -2 o meno), e infliggi sempre un danno al morale in più al gruppo, anche con un fallimento. (Armature, armi) <em>(trad. non ufficiale)</em></p>","text":"+ Impugnando o mostrando quest'oggetto puoi intimidire le truppe nemiche con Reputazione -1 (invece di -2 o meno), e infliggi sempre un danno al morale in più al gruppo, anche con un fallimento. (Armature, armi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-cinghie-lontre","title":"Cinghie delle Lontre (Otterfolk Webbing)","cat":"etichette","group":"","src":"RS p.54","aliases":["Otterfolk Webbing"],"html":"<p>+ Aumenta di 2 il tuo <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a> massimo. (Armature, abiti, zaini) <em>(trad. non ufficiale)</em></p>","text":"+ Aumenta di 2 il tuo Ingombro massimo. (Armature, abiti, zaini) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-raduno","title":"Vessillo di Raduno (Rallying)","cat":"etichette","group":"","src":"RS p.55","aliases":["Rallying"],"html":"<p>+ Impugnando o mostrando quest'oggetto puoi <a class=\"xl\" href=\"#guidare-truppe\" data-id=\"guidare-truppe\">guidare le truppe</a> di una fazione in battaglia con Reputazione +2 (invece di +3); ottieni sempre 1 presa in più, anche con un fallimento. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Impugnando o mostrando quest'oggetto puoi guidare le truppe di una fazione in battaglia con Reputazione +2 (invece di +3); ottieni sempre 1 presa in più, anche con un fallimento. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-ferro-ratti","title":"Ferro dei Ratti (Ratfolk Iron)","cat":"etichette","group":"","src":"RS p.55","aliases":["Ratfolk Iron"],"html":"<p>+ Quando <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attacchi in mischia</a>, segna fatica per scegliere un'opzione in più. (Armi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando attacchi in mischia, segna fatica per scegliere un'opzione in più. (Armi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-squarciante","title":"Squarciante (Ripper)","cat":"etichette","group":"","src":"RS p.55","aliases":["Ripper"],"html":"<p>+ Quando infliggi ferite a un avversario con quest'arma, puoi segnare usura. Se lo fai, l'avversario sceglie:</p><ul><li>segna 2-fatica;</li><li>oppure perde per sempre 1 casella di ferite.</li></ul><p>Questa etichetta costa 2-Valore invece di 1. (Armi da taglio) <em>(trad. non ufficiale)</em></p>","text":"+ Quando infliggi ferite a un avversario con quest'arma, puoi segnare usura. Se lo fai, l'avversario sceglie: - segna 2-fatica; - oppure perde per sempre 1 casella di ferite. Questa etichetta costa 2-Valore invece di 1. (Armi da taglio) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-stagionato","title":"Ben Stagionato (Seasoned)","cat":"etichette","group":"","src":"RS p.55","aliases":["Seasoned"],"html":"<p>+ Quando aggiungi ingredienti a quest'oggetto per cucinare, il pasto conta come un oggetto con l'etichetta <a class=\"xl\" href=\"#tag-tonificante\" data-id=\"tag-tonificante\">Tonificante</a> e usura pari al consumo o al Valore speso per gli ingredienti. (Pentolame) <em>(trad. non ufficiale)</em></p>","text":"+ Quando aggiungi ingredienti a quest'oggetto per cucinare, il pasto conta come un oggetto con l'etichetta Tonificante e usura pari al consumo o al Valore speso per gli ingredienti. (Pentolame) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-specializzato","title":"Specializzato (Specialized)","cat":"etichette","group":"","src":"RS p.55","aliases":["Specialized"],"html":"<p>+ Quando crei quest'oggetto, scegli una mossa del tuo playbook che non hai sbloccato. Finché lo impugni o lo indossi, puoi segnare usura e fatica per usare quella mossa per la scena. Questa etichetta costa 2-Valore invece di 1. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Quando crei quest'oggetto, scegli una mossa del tuo playbook che non hai sbloccato. Finché lo impugni o lo indossi, puoi segnare usura e fatica per usare quella mossa per la scena. Questa etichetta costa 2-Valore invece di 1. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-silenzioso","title":"Silenzioso (Silenced)","cat":"etichette","group":"","src":"RS p.55","aliases":["Silenced"],"html":"<p>+ Segna usura per tentare <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> se non possiedi l'impresa; se la possiedi, segna usura per non attirare attenzioni indesiderate, anche con un fallimento. (Balestre, archi) <em>(trad. non ufficiale)</em></p>","text":"+ Segna usura per tentare Attaccare alle Spalle se non possiedi l'impresa; se la possiedi, segna usura per non attirare attenzioni indesiderate, anche con un fallimento. (Balestre, archi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-simbolico","title":"Simbolico (Symbolic)","cat":"etichette","group":"","src":"RS p.55","aliases":["Symbolic"],"html":"<p>+ Scegli una fazione: quando <a class=\"xl\" href=\"#appoggiare-leader\" data-id=\"appoggiare-leader\">appoggi</a> o <a class=\"xl\" href=\"#screditare-leader\" data-id=\"screditare-leader\">screditi</a> un suo leader, togli un'opzione dall'elenco prima che il GM scelga. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"+ Scegli una fazione: quando appoggi o screditi un suo leader, togli un'opzione dall'elenco prima che il GM scelga. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-affusolato","title":"Affusolato (Tapered)","cat":"etichette","group":"","src":"RS p.55","aliases":["Tapered"],"html":"<p>+ Quando tenti <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a>, segna usura per infliggere 2 danni in più. (Pugnali) <em>(trad. non ufficiale)</em></p>","text":"+ Quando tenti Attaccare alle Spalle, segna usura per infliggere 2 danni in più. (Pugnali) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-spinoso","title":"Spinoso (Thornback)","cat":"etichette","group":"","src":"RS p.55","aliases":["Thornback"],"html":"<p>+ Quando un avversario ti afferra mentre indossi quest'oggetto, segna fatica per infliggergli 1-ferita; finché non ti lascia andare, subisce 1-ferita ogni volta che agisce contro di te. (Armature) <em>(trad. non ufficiale)</em></p>","text":"+ Quando un avversario ti afferra mentre indossi quest'oggetto, segna fatica per infliggergli 1-ferita; finché non ti lascia andare, subisce 1-ferita ogni volta che agisce contro di te. (Armature) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-ben-tenuto","title":"Ben Tenuto (Well-Kept)","cat":"etichette","group":"","src":"RS p.55","aliases":["Well-Kept"],"html":"<p>+ L'armatura è stata curata e riparata così bene negli anni che è difficilissima da distruggere: non si distrugge quando ha tutta l'usura segnata. Si può distruggere solo riempiendo ogni casella di usura e poi agendo direttamente e intenzionalmente con attrezzi specifici o in un ambiente particolarmente distruttivo. (Armature vecchie ma solide) <em>(trad. non ufficiale)</em></p>","text":"+ L'armatura è stata curata e riparata così bene negli anni che è difficilissima da distruggere: non si distrugge quando ha tutta l'usura segnata. Si può distruggere solo riempiendo ogni casella di usura e poi agendo direttamente e intenzionalmente con attrezzi specifici o in un ambiente particolarmente distruttivo. (Armature vecchie ma solide) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-in-prestito","title":"In Prestito (Borrowed)","cat":"etichette","group":"","src":"RS p.56","aliases":["Borrowed"],"html":"<p>− L'oggetto ti è stato prestato da un benefattore di alto rango e prima o poi va restituito. Quando lo crei, nomina la fazione; il GM nomina il benefattore, che sa sempre dove trovarti e ha molti emissari.</p><div class=\"move\"><p><strong>Quando il tempo passa, un emissario viene a riscuotere: tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: l'emissario ti chiede un favore (fallo e puoi tenere l'oggetto) e ti offre anche la possibilità di comprarlo; il GM ti dice il prezzo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: l'emissario ti chiede un favore; fallo e puoi tenere l'oggetto.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: devi restituire l'oggetto o affrontare gravi conseguenze.</li></ul></div><p>Questa etichetta toglie 6-Valore invece di 1. (Qualsiasi) <em>(trad. non ufficiale)</em></p>","text":"− L'oggetto ti è stato prestato da un benefattore di alto rango e prima o poi va restituito. Quando lo crei, nomina la fazione; il GM nomina il benefattore, che sa sempre dove trovarti e ha molti emissari. Quando il tempo passa, un emissario viene a riscuotere: tira su Fortuna. - 10+ (successo pieno): l'emissario ti chiede un favore (fallo e puoi tenere l'oggetto) e ti offre anche la possibilità di comprarlo; il GM ti dice il prezzo. - 7-9 (successo parziale): l'emissario ti chiede un favore; fallo e puoi tenere l'oggetto. - 6- (fallimento): devi restituire l'oggetto o affrontare gravi conseguenze. Questa etichetta toglie 6-Valore invece di 1. (Qualsiasi) (trad. non ufficiale)","back":["etichette"]},{"id":"tag-friabile","title":"Friabile (Brittle)","cat":"etichette","group":"","src":"RS p.56","aliases":["Brittle"],"html":"<p>− La prima volta in una sessione che segni usura su quest'oggetto, segnane una casella in più. Ogni volta che un nemico gli infligge usura, ne infligge 1 in più. (Armature, attrezzi, armi) <em>(trad. non ufficiale)</em></p>","text":"− La prima volta in una sessione che segni usura su quest'oggetto, segnane una casella in più. Ogni volta che un nemico gli infligge usura, ne infligge 1 in più. (Armature, attrezzi, armi) (trad. non ufficiale)","back":["etichette"]},{ const terms=[];
DATA.forEach(e=>{
  const names=[e.title.replace(/\s*\(.*\)$/,'')].concat(e.aliases||[]);
  names.forEach(n=>{n=n.trim();if(n.length<4||STOP.has(n))return;terms.push({n,id:e.id,cs:/^[A-ZÀ-Ý]/.test(n)})});
});
terms.sort((a,b)=>b.n.length-a.n.length);
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const csRe=new RegExp('(?<![\\p{L}\\p{N}])('+terms.filter(t=>t.cs).map(t=>esc(t.n)).join('|')+')(?![\\p{L}\\p{N}])','gu');
const ciRe=new RegExp('(?<![\\p{L}\\p{N}])('+terms.filter(t=>!t.cs).map(t=>esc(t.n)).join('|')+')(?![\\p{L}\\p{N}])','giu');
const csMap={},ciMap={};terms.forEach(t=>{if(t.cs){if(!(t.n in csMap))csMap[t.n]=t.id}else{const k=t.n.toLowerCase();if(!(k in ciMap))ciMap[k]=t.id}});
function autolink(root,selfId){
  const used=new Set([selfId]);
  root.querySelectorAll('a.xl').forEach(a=>used.add(a.dataset.id));
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,h1,h2,th,button,.crumbs,.olab')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const text=node.nodeValue;const hits=[];
    for(const [re,map,low] of [[csRe,csMap,false],[ciRe,ciMap,true]]){re.lastIndex=0;let m;while((m=re.exec(text))){const id=map[low?m[1].toLowerCase():m[1]];if(id)hits.push({s:m.index,e:m.index+m[1].length,id})}}
    if(!hits.length)return;
    hits.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
    const frag=document.createDocumentFragment();let pos=0,changed=false;
    for(const h of hits){
      if(h.s<pos||used.has(h.id))continue;
      used.add(h.id);changed=true;
      frag.append(text.slice(pos,h.s));
      const a=document.createElement('a');a.className='wl';a.href='#'+h.id;a.dataset.id=h.id;a.textContent=text.slice(h.s,h.e);frag.append(a);pos=h.e;
    }
    if(!changed)return;frag.append(text.slice(pos));node.replaceWith(frag);
  });
}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function showSearch(q){
  const nq=norm(q.trim());if(!nq)return route();
  const words=nq.split(/\s+/);
  const res=DATA.map(e=>{const t=norm(e.title),al=norm((e.aliases||[]).join(' ')),tx=norm(e.text);let sc=0;
    for(const w of words){if(t.includes(w))sc+=10;else if(al.includes(w))sc+=7;else if(tx.includes(w))sc+=1;else return null}
    if(t.startsWith(nq))sc+=8;return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,60);
  art.className='';
  art.innerHTML=`<div class="crumbs"><a class="chip" href="#">Home</a><span class="chip">Ricerca</span></div><h1>“${q.replace(/</g,'&lt;')}”</h1>
  <div class="results">${res.length?res.map(({e})=>{const i=norm(e.text).indexOf(words[0]);const st=Math.max(0,i-60);let sn=e.text.slice(st,st+180);return `<div class="r"><a href="#${e.id}" data-id="${e.id}">${e.title}</a> <span class="chip">${(secOf(e)||{}).t||''}</span><div>${st>0?'…':''}${sn.replace(/</g,'&lt;')}…</div></div>`}).join(''):'<p>Nessuna voce trovata. Prova con un altro termine (es. "fatica", "Ladro", "ragno").</p>'}</div>`;
  mainEl.scrollTop=0;
}

    <div class="tw"><table class="rep"><thead><tr><th>Fazione</th><th>Reputazione</th><th>Prestigio</th><th>Nomea</th><th></th></tr></thead><tbody>
    ${Object.entries(p.rep).filter(([f])=>BY[f]).map(([f,r])=>{const nu=repNeed(r.v,true),nd=repNeed(r.v,false);return `<tr><td>${wl(f,BY[f]?BY[f].title.replace(/^(Il|La|Gli|I|L')\s*/,''):f)}</td>
      <td><select class="t" data-rep="${f}" data-f="v">${[3,2,1,0,-1,-2,-3].map(v=>`<option value="${v}" ${r.v===v?'selected':''}>${v>0?'+':''}${v}</option>`).join('')}</select></td>
      <td><span class="cnt"><button data-rep="${f}" data-f="p" data-d="-1" aria-label="meno prestigio">−</button>${r.p}/${r.v>=3?'—':nu}<button data-rep="${f}" data-f="p" data-d="1" aria-label="più prestigio">+</button></span>${r.v<3&&r.p>=nu?' <span class="rdy">sale!</span>':''}</td>
      <td><span class="cnt"><button data-rep="${f}" data-f="n" data-d="-1" aria-label="meno nomea">−</button>${r.n}/${r.v<=-3?'—':nd}<button data-rep="${f}" data-f="n" data-d="1" aria-label="più nomea">+</button></span>${r.v>-3&&r.n>=nd?' <span class="rdy" style="color:var(--rust)">scende!</span>':''}</td>
      <td><button class="sm" data-unrep="${f}" aria-label="togli fazione">×</button></td></tr>`}).join('')}</tbody></table></div>
    <select class="t" data-addrep><option value="">Aggiungi una fazione…</option>${FACT.filter(f=>!p.rep[f]&&BY[f]).map(f=>`<option value="${f}">${hx(BY[f].title)}</option>`).join('')}</select>
    <p class="hint">Il contatore mostra caselle segnate / caselle necessarie per cambiare livello. Quando sale o scende, cambia la Reputazione e svuota il contatore.</p></section>
  <section class="box wide"><h2>Mosse <small>${hx(pb.mvx)}</small></h2>
    <div class="chk">${pb.mv.map(m=>`<label><input type="checkbox" data-arr="mosse" value="${m}" ${p.mosse.includes(m)?'checked':''}>${wl(m)}</label>`).join('')}</div>
    <div class="added">${extraMoves.map(m=>`<span class="chip">${wl(m)}<button data-rm="mosse" data-v="${m}" aria-label="togli">×</button></span>`).join('')}</div>
    <select class="t" data-add="mosse"><option value="">Aggiungi una mossa di un altro playbook…</option>${[...new Set(ALLMOVES.map(e=>e.group))].map(g=>`<optgroup label="${hx(g)}">${ALLMOVES.filter(e=>e.group===g&&!pb.mv.includes(e.id)&&!p.mosse.includes(e.id)).map(e=>`<option value="${e.id}">${hx(e.title)}</option>`).join('')}</optgroup>`).join('')}</select></section>
  <section class="box"><h2>Imprese da furfante</h2><p class="hint">Dal playbook: ${hx(pb.ftx||'—')}</p>
    <div class="chk">${FEATS.map(f=>`<label><input type="checkbox" data-arr="imprese" value="${f}" ${p.imprese.includes(f)?'checked':''}>${wl(f,BY[f].title.replace(/\s*\(.*\)$/,''))}</label>`).join('')}</div></section>
  <section class="box"><h2>Abilità con le armi</h2><p class="hint">In grassetto le opzioni iniziali del playbook (se ne sceglie una).</p>
    <div class="chk">${SKILLS.map(s=>`<label class="${pb.sk.includes(s)?'start':''}"><input type="checkbox" data-arr="abil" value="${s}" ${p.abil.includes(s)?'checked':''}>${wl(s,BY[s].title.replace(/\s*\(.*\)$/,''))}</label>`).join('')}</div></section>
  <section class="box wide"><h2>${wl('equipaggiamento','Equipaggiamento')} <small>${wl('valore','Valore')} in tasca: <span class="cnt"><button data-val="-1" aria-label="meno valore">−</button> <b>${p.valore}</b> <button data-val="1" aria-label="più valore">+</button></span></small></h2>
    <div class="tw"><table class="eq"><thead><tr><th>Oggetto</th><th>${wl('ingombro','Ingombro')}</th><th>${wl('usura','Usura')}</th><th>Note ed etichette</th><th>Valore</th><th></th></tr></thead><tbody>
    ${p.equip.map((e,i)=>`<tr><td><input class="t" data-eq="${i}" data-f="n" value="${hx(e.n)}" aria-label="oggetto"></td><td><input class="t n" type="number" min="0" max="3" data-eq="${i}" data-f="ing" value="${+e.ing||0}" aria-label="ingombro"></td>
      <td><span style="display:flex;gap:6px;align-items:center">${e.usMax?boxes(e.usMax,e.us,'','eq'+i):''}<span class="mx"><button data-eqmx="${i}" data-d="-1" aria-label="meno caselle usura">−</button>${e.usMax||0}<button data-eqmx="${i}" data-d="1" aria-label="più caselle usura">+</button></span></span></td>
      <td><input class="t" data-eq="${i}" data-f="note" value="${hx(e.note)}" aria-label="note"></td><td><input class="t n" type="number" min="0" data-eq="${i}" data-f="val" value="${e.val==null?'':e.val}" aria-label="valore"></td><td><button class="sm" data-eqdel="${i}" aria-label="togli oggetto">×</button></td></tr>`).join('')}
    </tbody></table></div><p><button class="sm" data-eqadd>+ Aggiungi oggetto</button> <a class="sm" href="#gen/tesori">Tira un tesoro →</a></p>
    <p class="eq-tot">Ingombro portato: <b class="${ing>cap?'over':''}">${ing} / ${cap}</b> (4 + Vigore)${ing>cap?' — sei appesantito':''}</p></section>
  <section class="box"><h2>${wl('avanzamento','Avanzamento')}</h2><div class="form-row"><label>Avanzamenti presi<input class="t" type="number" min="0" data-k="avanz" value="${p.avanz}" style="width:6em"></label></div>
    <textarea class="t" data-k="avanzNote" placeholder="Cosa hai preso a ogni avanzamento">${hx(p.avanzNote)}</textarea>
    <h2 style="margin-top:12px">${wl('maestrie','Maestrie')}</h2><textarea class="t" data-k="maestrie">${hx(p.maestrie)}</textarea></section>
  <section class="box"><h2>Note</h2><textarea class="t" data-k="note" style="min-height:180px" placeholder="Passato, debiti, segreti, obiettivi…">${hx(p.note)}</textarea></section>
  </div>`;
  art.querySelectorAll('.ad').forEach(n=>autolink(n,''));
  document.title=(p.nome||'Personaggio')+' · Wiki delle Regole di Root';
}
function rerender(){const y=mainEl.scrollTop;pgSave(pgCur);showPg(pgCur.id);mainEl.scrollTop=y}
art.addEventListener('input',ev=>{
  if(!pgCur||!CUR.startsWith('#pg/'))return;const t=ev.target,p=pgCur;
  if(t.dataset.k&&t.tagName!=='SELECT'){p[t.dataset.k]=t.type==='number'?(+t.value||0):t.value;if(t.dataset.k==='nome')art.querySelector('h1').textContent=t.value||'Senza nome';pgPut()}
  if(t.dataset.eq!=null){const e=p.equip[+t.dataset.eq];const f=t.dataset.f;e[f]=t.type==='number'?(t.value===''?null:+t.value):t.value;pgPut();if(f==='ing'){const cap=4+(p.st.Vigore||0),ing=p.equip.reduce((s,e)=>s+(+e.ing||0),0);const b=art.querySelector('.eq-tot');b.innerHTML=`Ingombro portato: <b class="${ing>cap?'over':''}">${ing} / ${cap}</b> (4 + Vigore)${ing>cap?' — sei appesantito':''}`}}
});
art.addEventListener('change',ev=>{
  if(!pgCur||!CUR.startsWith('#pg/'))return;const t=ev.target,p=pgCur;
  if(t.dataset.k==='pb'){const old=PB[p.pb],nw=PB[t.value];p.pb=t.value;if(nw){const same=old&&STATS.every(([s])=>p.st[s]===(old.st[s]||0));if(same)STATS.forEach(([s])=>p.st[s]=nw.st[s]||0);p.mosse=p.mosse.filter(m=>!(old&&old.mv.includes(m)));p.natura=''}return rerender()}
  if(t.name==='nat'){p.natura=t.value;return pgPut()}
  if(t.dataset.arr){const a=p[t.dataset.arr];const i=a.indexOf(t.value);t.checked?(i<0&&a.push(t.value)):(i>=0&&a.splice(i,1));return pgPut()}
  if(t.dataset.add!=null&&t.value){p[t.dataset.add].push(t.value);return rerender()}
  if(t.dataset.addrep!=null&&t.value){p.rep[t.value]={v:0,p:0,n:0};return rerender()}
  if(t.dataset.rep&&t.dataset.f==='v'){const r=p.rep[t.dataset.rep];const nv=+t.value;if(nv>r.v)r.p=0;if(nv<r.v)r.n=0;r.v=nv;return rerender()}
});
art.addEventListener('click',ev=>{
  if(!pgCur||!CUR.startsWith('#pg/'))return;const t=ev.target.closest('button');if(!t)return;const p=pgCur;
  if(t.dataset.st){p.st[t.dataset.st]=Math.max(-3,Math.min(3,p.st[t.dataset.st]+ +t.dataset.d));return rerender()}
  if(t.dataset.roll){const s=t.dataset.roll,m=p.st[s],a=d6(),b=d6(),tot=a+b+m;const cls=tot>=10?'r-hit':tot>=7?'r-mid':'r-miss';const lab=tot>=10?'successo pieno':tot>=7?'successo parziale':'fallimento';
    lastRoll=`<b>${hx(p.nome||'')}</b> · <b>${s}</b>: ${a} + ${b} ${m>=0?'+':'−'} ${Math.abs(m)} = <b class="${cls}">${tot}</b> <span class="${cls}">${lab}</span>`;document.getElementById('pgRoll').innerHTML=lastRoll;return}
  if(t.dataset.box){const k=t.dataset.box,i=+t.dataset.i;const tr=k.startsWith('eq')?p.equip[+k.slice(2)]:p.tr[k];const key=k.startsWith('eq')?'us':'v';tr[key]=tr[key]===i+1?i:i+1;return rerender()}
  if(t.dataset.mx){const tr=p.tr[t.dataset.mx];tr.max=Math.max(4,Math.min(6,tr.max+ +t.dataset.d));tr.v=Math.min(tr.v,tr.max);return rerender()}
  if(t.dataset.rep&&t.dataset.f){const r=p.rep[t.dataset.rep];r[t.dataset.f]=Math.max(0,r[t.dataset.f]+ +t.dataset.d);return rerender()}
  if(t.dataset.unrep){delete p.rep[t.dataset.unrep];return rerender()}
  if(t.dataset.rm){p[t.dataset.rm]=p[t.dataset.rm].filter(x=>x!==t.dataset.v);return rerender()}
  if(t.dataset.val){p.valore=Math.max(0,p.valore+ +t.dataset.val);return rerender()}
  if(t.dataset.eqadd!=null){p.equip.push({n:'',ing:0,usMax:0,us:0,val:null,note:''});rerender();const ins=art.querySelectorAll('.eq input[data-f="n"]');if(ins.length)ins[ins.length-1].focus();return}
  if(t.dataset.eqdel!=null){p.equip.splice(+t.dataset.eqdel,1);return rerender()}
  if(t.dataset.eqmx!=null){const e=p.equip[+t.dataset.eqmx];e.usMax=Math.max(0,Math.min(6,(e.usMax||0)+ +t.dataset.d));e.us=Math.min(e.us||0,e.usMax);return rerender()}
  if(t.dataset.x==='export')return download((p.nome||'personaggio').replace(/[^\wÀ-ÿ-]+/g,'_')+'.json',p);
  if(t.dataset.x==='dup'){const c=JSON.parse(JSON.stringify(p));c.id='pg'+Date.now().toString(36);c.nome=(p.nome||'Senza nome')+' (copia)';pgSave(c);go('pg/'+c.id);return}
  if(t.dataset.x==='del'){if(t.dataset.sure){pgDel(p.id);pgCur=null;go('pg');return}t.dataset.sure='1';t.textContent='Conferma: elimina per sempre';setTimeout(()=>{if(t.isConnected){delete t.dataset.sure;t.textContent='Elimina'}},5000);return}
});
// ---------- instradamento ----------
function campRoute(h){
  if(h.startsWith('gen/')&&!HAS_GEN){go('');return true}
  if(h.startsWith('gen/')){showGen(h.slice(4));markCamp('#'+h);mainEl.scrollTop=0;return true}
  if(h==='pg'){showPgList();markCamp('#pg');return true}
  if(h.startsWith('pg/')){showPg(h.slice(3));markCamp('#'+h);mainEl.scrollTop=0;return true}
  return false;
}
function markCamp(href){nav.querySelectorAll('a.on').forEach(a=>a.classList.remove('on'));nav.querySelectorAll(`a[href="${href}"]`).forEach(a=>{a.classList.add('on');const d=a.closest('details');if(d&&!d.open)d.open=true})}
function campNav(){
  const pgs=pgAll();
  return `<details data-k="camp" ${openSet.has('camp')||!openSet.size?'open':''}><summary>${HAS_GEN?'⚑ Campagna':'⚑ La tua banda'} <span class="n">${(HAS_GEN?5:0)+pgs.length}</span></summary><ul>
  ${HAS_GEN?`<li class="grp">Generatori</li><li><a href="#gen/bosco">Incontri nel Bosco</a></li><li><a href="#gen/bosco-minacce">Minacce nel Bosco</a></li><li><a href="#gen/sentiero">Incontri sul Sentiero</a></li><li><a href="#gen/sentiero-minacce">Minacce sul Sentiero</a></li><li><a href="#gen/tesori">Tesori</a></li>`:''}
  <li class="grp">Personaggi</li>${pgs.map(p=>`<li><a href="#pg/${p.id}">${hx(p.nome||'Senza nome')}</a></li>`).join('')}<li><a href="#pg" style="font-weight:700">${pgs.length?'Tutti i personaggi':'+ Nuovo personaggio'}</a></li></ul></details>`;
}

buildNav();route();
</script>
