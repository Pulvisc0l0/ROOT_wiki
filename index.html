vista</td><td>Consumare risorse, lasciare prove, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#scassinare\" data-id=\"scassinare\">Scassinare</a></td><td>Aprire serrature</td><td>Rompere qualcosa, venire scoperto, finire nei guai</td></tr><tr><td><a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a></td><td>Entrare/uscire senza farsi notare</td><td>Rompere qualcosa, attenzioni indesiderate, finire nei guai</td></tr></tbody></table></div><p><strong>Viandanti e Forestieri</strong></p><div class=\"tw\"><table><thead><tr><th>Impresa</th><th>Descrizione</th><th>Rischi</th></tr></thead><tbody><tr><td><a class=\"xl\" href=\"#insabbiare\" data-id=\"insabbiare\">Insabbiare (Cover Up)</a></td><td>Eliminare prove, mascherare una scena</td><td>Venire scoperto, consumare risorse, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#mente-criminale\" data-id=\"mente-criminale\">Mente Criminale (Mastermind)</a></td><td>Dare ordini a PNG, dirigere operazioni</td><td>Attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#piazzare-trappola\" data-id=\"piazzare-trappola\">Piazzare Trappole (Set Trap)</a></td><td>Imboscate e trappole semplici</td><td>Venire scoperto, consumare risorse, lasciare prove</td></tr><tr><td><a class=\"xl\" href=\"#seguire-tracce\" data-id=\"seguire-tracce\">Seguire le Tracce (Tracking)</a></td><td>Inseguire, riconoscere tracce</td><td>Venire scoperto, cacciarsi nel pericolo, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#usare-congegno\" data-id=\"usare-congegno\">Usare un Congegno (Use Device)</a></td><td>Azionare macchinari e reliquie, acrobazie con veicoli</td><td>Rompere qualcosa, cacciarsi nel pericolo, risultato debole</td></tr></tbody></table></div><p>Vedi <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">Rischi delle Imprese da Furfante</a>.</p>","text":"Le imprese da furfante sono abilità criminali. Se l'impresa è segnata sul tuo playbook la tenti con Destrezza; altrimenti ti affidi al fato. Massimo 6 imprese con l'avanzamento (quelle ottenute da mosse non contano). Manuale base Impresa Descrizione Rischi --------- Acrobazie Arrampicarsi, scavalcare, saltare Rompere qualcosa, venire scoperto, finire nei guai Attaccare alle Spalle Colpire a sorpresa Attenzioni indesiderate, lasciare prove, finire nei guai Borseggiare Rubare da una tasca Lasciare prove, risultato non sperato, metterci troppo Disattivare un Congegno Disinnescare trappole e meccanismi Rompere qualcosa, attenzioni indesiderate, consumare risorse Falsificare Copiare, contraffare Lasciare prove, risultato non sperato, metterci troppo Gioco di Prestigio Nascondere, scambiare, sottrarre Attenzioni indesiderate, lasciare prove, risultato non sperato Nascondersi Sparire alla vista Consumare risorse, lasciare prove, metterci troppo Scassinare Aprire serrature Rompere qualcosa, venire scoperto, finire nei guai Sgattaiolare Entrare/uscire senza farsi notare Rompere qualcosa, attenzioni indesiderate, finire nei guai Viandanti e Forestieri Impresa Descrizione Rischi --------- Insabbiare (Cover Up) Eliminare prove, mascherare una scena Venire scoperto, consumare risorse, metterci troppo Mente Criminale (Mastermind) Dare ordini a PNG, dirigere operazioni Attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo Piazzare Trappole (Set Trap) Imboscate e trappole semplici Venire scoperto, consumare risorse, lasciare prove Seguire le Tracce (Tracking) Inseguire, riconoscere tracce Venire scoperto, cacciarsi nel pericolo, metterci troppo Usare un Congegno (Use Device) Azionare macchinari e reliquie, acrobazie con veicoli Rompere qualcosa, cacciarsi nel pericolo, risultato debole Vedi Rischi delle Imprese da Furfante.","back":["creazione","affidarsi-fato","tentare-impresa","avanzamento"]},{"id":"rischi-imprese","title":"Rischi delle Imprese da Furfante","cat":"imprese","group":"","src":"B p.82-83","aliases":["rischi","rischio"],"html":"<p>Con <span class=\"res\">7-9</span> su <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'Impresa da Furfante</a>, se non segni fatica il GM sceglie un rischio adatto:</p><ul><li><strong>Attirare attenzioni indesiderate</strong>: chi era indifferente diventa ostile, o vieni notato ma non scoperto; il rischio nella zona aumenta.</li><li><strong>Consumare risorse</strong>: il GM ti dice se segnare consumo, usura o fatica.</li><li><strong>Finire nei guai</strong>: riesci, ma finisci dritto in una brutta situazione.</li><li><strong>Lasciare delle prove</strong>: tracce che portano a te o ai tuoi alleati.</li><li><strong>Metterci troppo</strong>: la situazione cambia in modo significativo.</li><li><strong>Non ottenere il risultato sperato</strong>: devi fare una scelta difficile.</li><li><strong>Rompere qualcosa</strong>: tuo o nell'ambiente; forse segni usura.</li><li><strong>Venire scoperto</strong>: qualcuno ti nota, con conseguenze.</li><li><em>(VF)</em> <strong>Cacciarsi nel pericolo</strong> e <strong>risultato debole</strong>.</li></ul>","text":"Con 7-9 su Tentare un'Impresa da Furfante, se non segni fatica il GM sceglie un rischio adatto: - Attirare attenzioni indesiderate: chi era indifferente diventa ostile, o vieni notato ma non scoperto; il rischio nella zona aumenta. - Consumare risorse: il GM ti dice se segnare consumo, usura o fatica. - Finire nei guai: riesci, ma finisci dritto in una brutta situazione. - Lasciare delle prove: tracce che portano a te o ai tuoi alleati. - Metterci troppo: la situazione cambia in modo significativo. - Non ottenere il risultato sperato: devi fare una scelta difficile. - Rompere qualcosa: tuo o nell'ambiente; forse segni usura. - Venire scoperto: qualcuno ti nota, con conseguenze. - (VF) Cacciarsi nel pericolo e risultato debole.","back":["tentare-impresa","imprese-indice","pb-canaglia-diversivo","pb-emissario-voltagabbana","pb-pirata-gambe","pb-trafficante-bilance","pb-orfano-trascurato","pb-flagello-notte","tag-sgargiante"]},{"id":"acrobazie","title":"Acrobazie","cat":"imprese","group":"","src":"B p.80","aliases":["Acrobazie"],"html":"<p>Movimenti complessi e notevoli: arrampicarsi, saltare un burrone, lanciarsi su una liana, una fuga spettacolare. Correre su una strada dritta non è acrobazia. Rischi: rompere qualcosa, venire scoperto, finire nei guai.</p>","text":"Movimenti complessi e notevoli: arrampicarsi, saltare un burrone, lanciarsi su una liana, una fuga spettacolare. Correre su una strada dritta non è acrobazia. Rischi: rompere qualcosa, venire scoperto, finire nei guai.","back":["imprese-indice","pb-pirata-gambe"]},{"id":"attaccare-spalle","title":"Attaccare alle Spalle","cat":"imprese","group":"","src":"B p.80-81","aliases":["Attaccare alle Spalle"],"html":"<p>Colpire a sorpresa e mettere fuori gioco un avversario (temporaneamente o per sempre). Devi essere nascosto o il nemico distratto, e l'attacco deve essere plausibile (un pugnale non basta contro un'armatura completa). Rischi: attenzioni indesiderate, lasciare prove, finire nei guai.</p>","text":"Colpire a sorpresa e mettere fuori gioco un avversario (temporaneamente o per sempre). Devi essere nascosto o il nemico distratto, e l'attacco deve essere plausibile (un pugnale non basta contro un'armatura completa). Rischi: attenzioni indesiderate, lasciare prove, finire nei guai.","back":["imprese-indice","piazzare-trappola","pb-canaglia-diversivo","pb-emissario-voltagabbana","pb-pirata-gambe","tag-camuffata","tag-nascosta","tag-stoffa-corvidi","tag-silenzioso","tag-affusolato"]},{"id":"borseggiare","title":"Borseggiare","cat":"imprese","group":"","src":"B p.81","aliases":["Borseggiare"],"html":"<p>Rubare qualcosa di soppiatto da un altro personaggio (borse, tasche). Se non coinvolge una persona è <a class=\"xl\" href=\"#gioco-prestigio\" data-id=\"gioco-prestigio\">Gioco di Prestigio</a>. Rischi: lasciare prove, risultato non sperato, metterci troppo.</p>","text":"Rubare qualcosa di soppiatto da un altro personaggio (borse, tasche). Se non coinvolge una persona è Gioco di Prestigio. Rischi: lasciare prove, risultato non sperato, metterci troppo.","back":["imprese-indice","pb-cantastorie-occhi","pb-trafficante-bilance","tag-stoffa-corvidi"]},{"id":"disattivare","title":"Disattivare un Congegno","cat":"imprese","group":"","src":"B p.81","aliases":["Disattivare un Congegno"],"html":"<p>Disinnescare trappole, manomettere macchinari o armi d'assedio con conoscenza e destrezza (con la forza è <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a>). Rischi: rompere qualcosa, attenzioni indesiderate, consumare risorse.</p>","text":"Disinnescare trappole, manomettere macchinari o armi d'assedio con conoscenza e destrezza (con la forza è Distruggere Qualcosa). Rischi: rompere qualcosa, attenzioni indesiderate, consumare risorse.","back":["distruggere","imprese-indice","rovine-indice"]},{"id":"falsificare","title":"Falsificare","cat":"imprese","group":"","src":"B p.82","aliases":["Falsificare"],"html":"<p>Scrivere documenti falsi, imitare sigilli e calligrafie. Di norma hai già gli strumenti (niente consumo di base, salvo materiali rari). Ottimo in <a class=\"xl\" href=\"#flashback\" data-id=\"flashback\">Flashback</a>. Rischi: lasciare prove, risultato non sperato, metterci troppo.</p>","text":"Scrivere documenti falsi, imitare sigilli e calligrafie. Di norma hai già gli strumenti (niente consumo di base, salvo materiali rari). Ottimo in Flashback. Rischi: lasciare prove, risultato non sperato, metterci troppo.","back":["flashback","imprese-indice","pb-predone-ambasciatore","pb-emissario-voltagabbana","pb-esule-carta"]},{"id":"gioco-prestigio","title":"Gioco di Prestigio","cat":"imprese","group":"","src":"B p.82","aliases":["Gioco di Prestigio"],"html":"<p>Far sparire o sottrarre con destrezza oggetti che non sono addosso a qualcuno (una chiave, un documento sul tavolo). Rischi: attenzioni indesiderate, lasciare prove, risultato non sperato.</p>","text":"Far sparire o sottrarre con destrezza oggetti che non sono addosso a qualcuno (una chiave, un documento sul tavolo). Rischi: attenzioni indesiderate, lasciare prove, risultato non sperato.","back":["imprese-indice","borseggiare","pb-trafficante-bilance"]},{"id":"nascondersi","title":"Nascondersi","cat":"imprese","group":"","src":"B p.82","aliases":["Nascondersi"],"html":"<p>Restare immobili e passare inosservati finché il pericolo non passa. È reattiva; per spostarsi di nascosto vedi <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>. Rischi: consumare risorse, lasciare prove, metterci troppo.</p>","text":"Restare immobili e passare inosservati finché il pericolo non passa. È reattiva; per spostarsi di nascosto vedi Sgattaiolare. Rischi: consumare risorse, lasciare prove, metterci troppo.","back":["tentare-impresa","imprese-indice","sgattaiolare","seguire-tracce","pb-ranger-passo","pb-pirata-gambe","pb-cantastorie-occhi","pb-orfano-trascurato","pb-flagello-notte","tag-mimetica","tag-sgargiante"]},{"id":"scassinare","title":"Scassinare","cat":"imprese","group":"","src":"B p.82","aliases":["Scassinare"],"html":"<p>Aprire una serratura con destrezza e precisione (alternativa: <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a> la porta). Rischi: rompere qualcosa, venire scoperto, finire nei guai.</p>","text":"Aprire una serratura con destrezza e precisione (alternativa: Distruggere Qualcosa la porta). Rischi: rompere qualcosa, venire scoperto, finire nei guai.","back":["imprese-indice","pb-principe-prigione"]},{"id":"sgattaiolare","title":"Sgattaiolare","cat":"imprese","group":"","src":"B p.82","aliases":["Sgattaiolare"],"html":"<p>Spostarsi di soppiatto da un luogo all'altro senza farsi notare. Per restare nascosto in un punto vedi <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a>. Rischi: rompere qualcosa, attenzioni indesiderate, finire nei guai.</p>","text":"Spostarsi di soppiatto da un luogo all'altro senza farsi notare. Per restare nascosto in un punto vedi Nascondersi. Rischi: rompere qualcosa, attenzioni indesiderate, finire nei guai.","back":["tentare-impresa","imprese-indice","nascondersi","seguire-tracce","pb-ranger-passo","pb-pirata-gambe","pb-cantastorie-occhi","pb-orfano-trascurato","pb-flagello-notte","tag-mimetica","tag-sgargiante"]},{"id":"insabbiare","title":"Insabbiare (Cover Up)","cat":"imprese","group":"","src":"VF p.42","aliases":["Insabbiare","Cover Up"],"html":"<p>Eliminare prove di attività furfantesche o far sembrare una scena qualcos'altro (guardie svenute nei cespugli, un omicidio camuffato da incidente). Diversamente da <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>, richiede tempo e preparazione. Rischi: venire scoperto, consumare risorse, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Eliminare prove di attività furfantesche o far sembrare una scena qualcos'altro (guardie svenute nei cespugli, un omicidio camuffato da incidente). Diversamente da Ingannare un PNG, richiede tempo e preparazione. Rischi: venire scoperto, consumare risorse, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"mente-criminale","title":"Mente Criminale (Mastermind)","cat":"imprese","group":"","src":"VF p.42","aliases":["Mente Criminale","Mastermind"],"html":"<p>Dare ordini e prendere decisioni tattiche, posizionare alleati e PNG esattamente dove servono (anche in <a class=\"xl\" href=\"#flashback\" data-id=\"flashback\">Flashback</a>). Funziona solo con chi già ti ascolta: non sostituisce <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>. Rischi: attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Dare ordini e prendere decisioni tattiche, posizionare alleati e PNG esattamente dove servono (anche in Flashback). Funziona solo con chi già ti ascolta: non sostituisce Convincere un PNG. Rischi: attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"piazzare-trappola","title":"Piazzare Trappole (Set Trap)","cat":"imprese","group":"","src":"VF p.43","aliases":["Piazzare Trappole","Set Trap"],"html":"<p>Preparare imboscate o trappole semplici. Una trappola contro un singolo bersaglio può sostituire <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a>; per sfruttare un'imboscata contro un gruppo serve poi attaccare alle spalle. Rischi: venire scoperto, consumare risorse, lasciare prove. <em>(traduzione non ufficiale)</em></p>","text":"Preparare imboscate o trappole semplici. Una trappola contro un singolo bersaglio può sostituire Attaccare alle Spalle; per sfruttare un'imboscata contro un gruppo serve poi attaccare alle spalle. Rischi: venire scoperto, consumare risorse, lasciare prove. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"seguire-tracce","title":"Seguire le Tracce (Tracking)","cat":"imprese","group":"","src":"VF p.43","aliases":["Seguire le Tracce","Tracking"],"html":"<p>Inseguire qualcuno, leggere orme, seguire una pista di indizi. Non serve a restare nascosti (per quello <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a>/<a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>). Rischi: venire scoperto, cacciarsi nel pericolo, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Inseguire qualcuno, leggere orme, seguire una pista di indizi. Non serve a restare nascosti (per quello Nascondersi/Sgattaiolare). Rischi: venire scoperto, cacciarsi nel pericolo, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"usare-congegno","title":"Usare un Congegno (Use Device)","cat":"imprese","group":"","src":"VF p.43-44","aliases":["Usare un Congegno","Use Device"],"html":"<p>Azionare macchinari, armi antiche o Reliquie degli Antichi, manovre acrobatiche con veicoli (deltaplani, carri meccanici). Rischi: rompere qualcosa, cacciarsi nel pericolo, risultato debole. <em>(traduzione non ufficiale)</em></p>","text":"Azionare macchinari, armi antiche o Reliquie degli Antichi, manovre acrobatiche con veicoli (deltaplani, carri meccanici). Rischi: rompere qualcosa, cacciarsi nel pericolo, risultato debole. (traduzione non ufficiale)","back":["imprese-indice","rovine-indice"]},{"id":"reputazione-indice","title":"Mosse di Reputazione","cat":"indici","group":"","src":"B p.111-120; VF p.31-41; RS p.33-37","aliases":["mosse di reputazione"],"html":"<p>Si tira sulla <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con la fazione coinvolta.</p><p><strong>Manuale base</strong></p><ul><li><a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a> — qualsiasi Reputazione</li><li><a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a> — qualsiasi Reputazione</li><li><a class=\"xl\" href=\"#attirare-attenzione\" data-id=\"attirare-attenzione\">Attirare l'Attenzione</a> — richiede -2 o meno</li><li><a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> — richiede +2 o più</li><li><a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> — richiede -3</li><li><a class=\"xl\" href=\"#pretendere-risorse\" data-id=\"pretendere-risorse\">Pretendere Risorse</a> — richiede +3</li></ul><p><strong>Viandanti e Forestieri</strong></p><ul><li><a class=\"xl\" href=\"#appoggiare-leader\" data-id=\"appoggiare-leader\">Appoggiare un Nuovo Leader</a> (+1), <a class=\"xl\" href=\"#screditare-leader\" data-id=\"screditare-leader\">Screditare un Leader</a> (+1), <a class=\"xl\" href=\"#guidare-truppe\" data-id=\"guidare-truppe\">Guidare le Truppe in Battaglia</a> (+3), <a class=\"xl\" href=\"#intimidire-truppe\" data-id=\"intimidire-truppe\">Intimidire le Truppe Nemiche</a> (-2)</li><li>Di fazione (+2): <a class=\"xl\" href=\"#nuovo-progetto\" data-id=\"nuovo-progetto\">Pianificare un Nuovo Progetto (Marchesato)</a> (Marchesato), <a class=\"xl\" href=\"#burocrazia\" data-id=\"burocrazia\">Manovrare la Burocrazia (Aquile)</a> (Aquile), <a class=\"xl\" href=\"#rivolta-mossa\" data-id=\"rivolta-mossa\">Incitare alla Rivolta (Alleanza)</a> (Alleanza), <a class=\"xl\" href=\"#predicare\" data-id=\"predicare\">Predicare ai Fedeli (Lucertole)</a> (Setta delle Lucertole)</li></ul><p><strong>Rovine e Spedizioni</strong></p><ul><li><a class=\"xl\" href=\"#forgiare-resistenza\" data-id=\"forgiare-resistenza\">Forgiare la Resistenza</a> (+2), <a class=\"xl\" href=\"#nemici-dei-nemici\" data-id=\"nemici-dei-nemici\">Chiamare i Nemici dei Tuoi Nemici</a> (-3), <a class=\"xl\" href=\"#impressionare-pubblico\" data-id=\"impressionare-pubblico\">Impressionare il Pubblico</a> (+2 Abitanti)</li></ul>","text":"Si tira sulla Reputazione con la fazione coinvolta. Manuale base - Chiedere un Favore — qualsiasi Reputazione - Incontrare Qualcuno di Importante — qualsiasi Reputazione - Attirare l'Attenzione — richiede -2 o meno - Influenzare un PNG — richiede +2 o più - Fare una Minaccia Diretta — richiede -3 - Pretendere Risorse — richiede +3 Viandanti e Forestieri - Appoggiare un Nuovo Leader (+1), Screditare un Leader (+1), Guidare le Truppe in Battaglia (+3), Intimidire le Truppe Nemiche (-2) - Di fazione (+2): Pianificare un Nuovo Progetto (Marchesato) (Marchesato), Manovrare la Burocrazia (Aquile) (Aquile), Incitare alla Rivolta (Alleanza) (Alleanza), Predicare ai Fedeli (Lucertole) (Setta delle Lucertole) Rovine e Spedizioni - Forgiare la Resistenza (+2), Chiamare i Nemici dei Tuoi Nemici (-3), Impressionare il Pubblico (+2 Abitanti)","back":["mosse","reputazione","fazioni-indice","fazione-marchesato","fazione-aquile","fazione-alleanza","fazione-abitanti","fazione-lucertole","tag-leggendario","tag-col-sigillo"]},{"id":"chiedere-favore","title":"Chiedere un Favore","cat":"reputazione","group":"","src":"B p.112","aliases":["chiedere un favore","chiedi un favore"],"html":"<div class=\"move\"><p><strong>Quando chiedi un favore sensato sulla base della tua reputazione, tira sulla Reputazione con la fazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vieni accontentato.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vieni accontentato, ma ti costa. Scegli 1:<ul><li>svuoti il tracciato di prestigio;</li><li>segni nomea.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non vieni accontentato e sarai visto con sospetto: segna nomea.</li></ul></div><div class=\"tw\"><table><thead><tr><th>Reputazione</th><th>Favori sensati</th></tr></thead><tbody><tr><td>+2, +3</td><td>Piccolo supporto militare, 5-6 Valore in denaro o risorse</td></tr><tr><td>+1</td><td>Riparazione gratuita, ripristino di tutto il consumo, un posto comodo dove stare</td></tr><tr><td>0</td><td>Informazioni, 1-2 caselle di consumo, un luogo spoglio</td></tr><tr><td>-1</td><td>Qualche istante per ascoltarti</td></tr><tr><td>-2, -3</td><td>Un vantaggio</td></tr></tbody></table></div>","text":"Quando chiedi un favore sensato sulla base della tua reputazione, tira sulla Reputazione con la fazione. - 10+ (successo pieno): vieni accontentato. - 7-9 (successo parziale): vieni accontentato, ma ti costa. Scegli 1: - svuoti il tracciato di prestigio; - segni nomea. - 6- (fallimento): non vieni accontentato e sarai visto con sospetto: segna nomea. Reputazione Favori sensati ------ +2, +3 Piccolo supporto militare, 5-6 Valore in denaro o risorse +1 Riparazione gratuita, ripristino di tutto il consumo, un posto comodo dove stare 0 Informazioni, 1-2 caselle di consumo, un luogo spoglio -1 Qualche istante per ascoltarti -2, -3 Un vantaggio","back":["reputazione-indice","comprare-vendere","pb-emissario-diplomatico","pb-esule-porto","pb-buongustaio-servizio","tag-immorale"]},{"id":"incontrare-importante","title":"Incontrare Qualcuno di Importante","cat":"reputazione","group":"","src":"B p.113-114","aliases":["incontrare qualcuno di importante","incontri qualcuno di importante"],"html":"<div class=\"move\"><p><strong>Quando incontri un personaggio importante per la prima volta, tira sulla Reputazione con la sua fazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: entrambi conoscete la rispettiva reputazione e ottieni entrambe le opzioni qui sotto.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: entrambi conoscete la rispettiva reputazione; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: conosci solo l'essenziale, mentre lui conosce le tue storie (vere o false): guai in vista.</li></ul><p>Opzioni:</p><ul><li><strong>Hai sentito delle storie</strong>: fai una domanda e il GM ti racconta una storia (vera o no) o i suoi interessi.</li><li><strong>Ha sentito qualcosa di positivo su di te</strong>: +1 al prossimo tiro quando fai leva sui vostri legami.</li></ul></div><p>\"Importante\" lo stabiliscono insieme GM e giocatori.</p>","text":"Quando incontri un personaggio importante per la prima volta, tira sulla Reputazione con la sua fazione. - 10+ (successo pieno): entrambi conoscete la rispettiva reputazione e ottieni entrambe le opzioni qui sotto. - 7-9 (successo parziale): entrambi conoscete la rispettiva reputazione; scegli 1 opzione. - 6- (fallimento): conosci solo l'essenziale, mentre lui conosce le tue storie (vere o false): guai in vista. Opzioni: - Hai sentito delle storie: fai una domanda e il GM ti racconta una storia (vera o no) o i suoi interessi. - Ha sentito qualcosa di positivo su di te: +1 al prossimo tiro quando fai leva sui vostri legami. \"Importante\" lo stabiliscono insieme GM e giocatori.","back":["reputazione-indice","tag-amichevole","tag-brutto","pb-emissario-diplomatico","pb-esule-conosciuto","pb-principe-eredita","pb-cacciatore-sguardo","tag-affascinante","tag-insignificante"]},{"id":"attirare-attenzione","title":"Attirare l'Attenzione","cat":"reputazione","group":"","src":"B p.115-116","aliases":["attirare l'attenzione"],"html":"<p><strong>Richiede Reputazione -2 o inferiore.</strong></p><div class=\"move\"><p><strong>Quando attiri apertamente l'attenzione ponendoti come nemico di una fazione, tira sulla Reputazione trattandola come positiva (+2/+3).</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la fazione mette in campo le sue risorse contro di te; scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la fazione mette in campo le sue risorse contro di te; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: i nemici agiscono già dietro le quinte e ti colgono di sorpresa.</li></ul><p>Opzioni:</p><ul><li>sguinzaglia le truppe per darti la caccia;</li><li>ti manda contro un PNG abile e fidato (a tua scelta);</li><li>ti teme come minaccia: segna 2-nomea.</li></ul></div><p>Utile come diversivo su larga scala.</p>","text":"Richiede Reputazione -2 o inferiore. Quando attiri apertamente l'attenzione ponendoti come nemico di una fazione, tira sulla Reputazione trattandola come positiva (+2/+3). - 10+ (successo pieno): la fazione mette in campo le sue risorse contro di te; scegli 2 opzioni. - 7-9 (successo parziale): la fazione mette in campo le sue risorse contro di te; scegli 1 opzione. - 6- (fallimento): i nemici agiscono già dietro le quinte e ti colgono di sorpresa. Opzioni: - sguinzaglia le truppe per darti la caccia; - ti manda contro un PNG abile e fidato (a tua scelta); - ti teme come minaccia: segna 2-nomea. Utile come diversivo su larga scala.","back":["reputazione-indice","pb-razziatore-aspetto"]},{"id":"influenzare","title":"Influenzare un PNG","cat":"reputazione","group":"","src":"B p.117","aliases":["influenzare un PNG","influenzare"],"html":"<p><strong>Richiede Reputazione +2 o superiore.</strong></p><div class=\"move\"><p><strong>Quando cerchi di influenzare un PNG disponibile o vulnerabile facendo appello alla tua reputazione, tira sulla Reputazione con la sua fazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: cambi il suo modo di vedere le cose: il GM ne riscrive la motivazione secondo ciò che dici.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma svuoti 3 caselle di prestigio (quelle che mancano diventano nomea).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: fraintende ciò che dici e il GM ne cambia la motivazione in modo inatteso.</li></ul></div><p>Non si può ripetere all'infinito sullo stesso PNG; chi hai tradito non ti ascolta.</p>","text":"Richiede Reputazione +2 o superiore. Quando cerchi di influenzare un PNG disponibile o vulnerabile facendo appello alla tua reputazione, tira sulla Reputazione con la sua fazione. - 10+ (successo pieno): cambi il suo modo di vedere le cose: il GM ne riscrive la motivazione secondo ciò che dici. - 7-9 (successo parziale): come sopra, ma svuoti 3 caselle di prestigio (quelle che mancano diventano nomea). - 6- (fallimento): fraintende ciò che dici e il GM ne cambia la motivazione in modo inatteso. Non si può ripetere all'infinito sullo stesso PNG; chi hai tradito non ti ascolta.","back":["convincere","reputazione-indice","maestria-base","pb-esule-porto","pb-nomade-verita"]},{"id":"minaccia-diretta","title":"Fare una Minaccia Diretta","cat":"reputazione","group":"","src":"B p.118","aliases":["minaccia diretta","fare una minaccia diretta"],"html":"<p><strong>Richiede Reputazione -3.</strong></p><div class=\"move\"><p><strong>Quando fai appello alla tua reputazione per minacciare direttamente un PNG, tira sulla Reputazione con la sua fazione come se fosse +3.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo intimorisci. Il GM ti dice cosa fa tra:<ul><li>si arrende;</li><li>si ritira;</li><li>ti attacca, ma in modo scomposto.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: prima devi dare una prova concreta e sconvolgente delle tue cattive intenzioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: la tua reputazione ti precede: era preparato ad affrontare i tipi come te.</li></ul></div>","text":"Richiede Reputazione -3. Quando fai appello alla tua reputazione per minacciare direttamente un PNG, tira sulla Reputazione con la sua fazione come se fosse +3. - 10+ (successo pieno): lo intimorisci. Il GM ti dice cosa fa tra: - si arrende; - si ritira; - ti attacca, ma in modo scomposto. - 7-9 (successo parziale): prima devi dare una prova concreta e sconvolgente delle tue cattive intenzioni. - 6- (fallimento): la tua reputazione ti precede: era preparato ad affrontare i tipi come te.","back":["reputazione-indice","pb-razziatore-aspetto","pb-cacciatore-bestie"]},{"id":"pretendere-risorse","title":"Pretendere Risorse","cat":"reputazione","group":"","src":"B p.119-120","aliases":["pretendere risorse"],"html":"<p><strong>Richiede Reputazione +3.</strong></p><div class=\"move\"><p><strong>Quando pretendi risorse importanti e preziose da un PNG, tira sulla Reputazione con la sua fazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: te le dà appena possibile.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: te le dà, ma il GM sceglie 1 (se poi non rispetti i patti, segna nomea):<ul><li>ti impone una condizione d'uso;</li><li>ti dice cosa vuole in cambio.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non le ha, ma ti dice come ottenerle (a caro prezzo).</li></ul></div><p>Vale per risorse non ottenibili altrimenti (un'arma d'assedio, uno squadrone), con chiunque della fazione, anche il capo supremo.</p>","text":"Richiede Reputazione +3. Quando pretendi risorse importanti e preziose da un PNG, tira sulla Reputazione con la sua fazione. - 10+ (successo pieno): te le dà appena possibile. - 7-9 (successo parziale): te le dà, ma il GM sceglie 1 (se poi non rispetti i patti, segna nomea): - ti impone una condizione d'uso; - ti dice cosa vuole in cambio. - 6- (fallimento): non le ha, ma ti dice come ottenerle (a caro prezzo). Vale per risorse non ottenibili altrimenti (un'arma d'assedio, uno squadrone), con chiunque della fazione, anche il capo supremo.","back":["reputazione-indice"]},{"id":"appoggiare-leader","title":"Appoggiare un Nuovo Leader","cat":"reputazione","group":"","src":"VF p.31","aliases":["appoggiare un nuovo leader"],"html":"<p><strong>Richiede Reputazione +1.</strong></p><div class=\"move\"><p><strong>Quando appoggi apertamente qualcuno come nuovo capo di una fazione in una radura, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la fazione reagisce; il GM sceglie 1 complicazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la fazione reagisce; il GM sceglie 2 complicazioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: emerge qualcosa di nuovo e pericoloso sul leader o sul tuo candidato.</li></ul><p>Complicazioni:</p><ul><li>la leadership attuale si oppone e va gestita;</li><li>gli abitanti non sono d'accordo e vanno convinti;</li><li>i nemici della fazione vogliono approfittarne (complotti).</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +1. Quando appoggi apertamente qualcuno come nuovo capo di una fazione in una radura, tira sulla Reputazione. - 10+ (successo pieno): la fazione reagisce; il GM sceglie 1 complicazione. - 7-9 (successo parziale): la fazione reagisce; il GM sceglie 2 complicazioni. - 6- (fallimento): emerge qualcosa di nuovo e pericoloso sul leader o sul tuo candidato. Complicazioni: - la leadership attuale si oppone e va gestita; - gli abitanti non sono d'accordo e vanno convinti; - i nemici della fazione vogliono approfittarne (complotti). (trad. non ufficiale)","back":["reputazione-indice","tag-simbolico"]},{"id":"screditare-leader","title":"Screditare un Leader","cat":"reputazione","group":"","src":"VF p.32","aliases":["screditare un leader"],"html":"<p><strong>Richiede Reputazione +1.</strong></p><div class=\"move\"><p><strong>Quando screditi apertamente un capo di una fazione in una radura, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ne avvii la caduta: sarà rimosso quando <a class=\"xl\" href=\"#tempo-passa\" data-id=\"tempo-passa\">il tempo passa</a>, salvo contromosse. Il GM sceglie 1 complicazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma il GM sceglie 2 complicazioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: rafforzi il sostegno al leader.</li></ul><p>Complicazioni:</p><ul><li>la protesta degenera in violenza;</li><li>il leader e i suoi diventano più radicali e rispondono con la forza;</li><li>vieni preso di mira per rappresaglia.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +1. Quando screditi apertamente un capo di una fazione in una radura, tira sulla Reputazione. - 10+ (successo pieno): ne avvii la caduta: sarà rimosso quando il tempo passa, salvo contromosse. Il GM sceglie 1 complicazione. - 7-9 (successo parziale): come sopra, ma il GM sceglie 2 complicazioni. - 6- (fallimento): rafforzi il sostegno al leader. Complicazioni: - la protesta degenera in violenza; - il leader e i suoi diventano più radicali e rispondono con la forza; - vieni preso di mira per rappresaglia. (trad. non ufficiale)","back":["reputazione-indice","tempo-passa","tag-simbolico"]},{"id":"guidare-truppe","title":"Guidare le Truppe in Battaglia","cat":"reputazione","group":"","src":"VF p.33","aliases":["guidare le truppe in battaglia"],"html":"<p><strong>Richiede Reputazione +3.</strong></p><div class=\"move\"><p><strong>Quando guidi in battaglia le truppe di una fazione, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ti accettano come comandante; tieni 3 prese.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ti accettano come comandante; tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: combattono nel caos e stanno perdendo.</li></ul><p>Durante lo scontro spendi una presa per impegnarle a:</p><ul><li>prendere e tenere una posizione;</li><li>mettere in rotta un'importante forza nemica;</li><li>catturare un capo nemico;</li><li>distruggere una fortificazione o una risorsa;</li><li>difendere un gruppo o un luogo.</li></ul></div><p>Devi guidarle di persona. <em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +3. Quando guidi in battaglia le truppe di una fazione, tira sulla Reputazione. - 10+ (successo pieno): ti accettano come comandante; tieni 3 prese. - 7-9 (successo parziale): ti accettano come comandante; tieni 2 prese. - 6- (fallimento): combattono nel caos e stanno perdendo. Durante lo scontro spendi una presa per impegnarle a: - prendere e tenere una posizione; - mettere in rotta un'importante forza nemica; - catturare un capo nemico; - distruggere una fortificazione o una risorsa; - difendere un gruppo o un luogo. Devi guidarle di persona. (trad. non ufficiale)","back":["reputazione-indice","tag-raduno"]},{"id":"intimidire-truppe","title":"Intimidire le Truppe Nemiche","cat":"reputazione","group":"","src":"VF p.34","aliases":["intimidire le truppe nemiche"],"html":"<p><strong>Richiede Reputazione -2.</strong></p><div class=\"move\"><p><strong>Quando minacci truppe nemiche con una dimostrazione intimidatoria della tua reputazione, tira sulla Reputazione come se fosse positiva (+2/+3).</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: la rabbia le galvanizza e attaccano subito in forze.</li></ul><p>Opzioni:</p><ul><li>non agiscono finché il loro capo non le rincuora (esponendosi);</li><li>prendono di mira te sopra ogni altra cosa;</li><li>sono scosse: infliggi 2-morale al gruppo.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione -2. Quando minacci truppe nemiche con una dimostrazione intimidatoria della tua reputazione, tira sulla Reputazione come se fosse positiva (+2/+3). - 10+ (successo pieno): scegli 2 opzioni. - 7-9 (successo parziale): scegli 1 opzione. - 6- (fallimento): la rabbia le galvanizza e attaccano subito in forze. Opzioni: - non agiscono finché il loro capo non le rincuora (esponendosi); - prendono di mira te sopra ogni altra cosa; - sono scosse: infliggi 2-morale al gruppo. (trad. non ufficiale)","back":["reputazione-indice","tag-minaccioso"]},{"id":"nuovo-progetto","title":"Pianificare un Nuovo Progetto (Marchesato)","cat":"reputazione","group":"","src":"VF p.35","aliases":["pianificare un nuovo progetto"],"html":"<p><strong>Richiede Reputazione +2 con il Marchesato.</strong></p><div class=\"move\"><p><strong>Quando convinci ufficiali del Marchesato ad avviare un progetto importante, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo avviano; il GM sceglie 2 condizioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo avviano; il GM sceglie 3 condizioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: le risorse (e tu) servono altrove.</li></ul><p>Condizioni:</p><ul><li>servirà tempo (sarà pronto dopo che il tempo passa);</li><li>servono risorse speciali;</li><li>serve prima eliminare una minaccia;</li><li>non sarà proprio ciò che chiedi.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con il Marchesato. Quando convinci ufficiali del Marchesato ad avviare un progetto importante, tira sulla Reputazione. - 10+ (successo pieno): lo avviano; il GM sceglie 2 condizioni. - 7-9 (successo parziale): lo avviano; il GM sceglie 3 condizioni. - 6- (fallimento): le risorse (e tu) servono altrove. Condizioni: - servirà tempo (sarà pronto dopo che il tempo passa); - servono risorse speciali; - serve prima eliminare una minaccia; - non sarà proprio ciò che chiedi. (trad. non ufficiale)","back":["reputazione-indice","fazione-marchesato"]},{"id":"burocrazia","title":"Manovrare la Burocrazia (Aquile)","cat":"reputazione","group":"","src":"VF p.36","aliases":["manovrare la burocrazia"],"html":"<p><strong>Richiede Reputazione +2 con le Aquile.</strong></p><div class=\"move\"><p><strong>Quando usi la burocrazia della Dinastia mentre il tempo passa, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: ti affidano un dovere: compilalo prima che il tempo passi o segna 3-nomea.</li></ul><p>Opzioni:</p><ul><li>fai tre domande al GM dal punto di vista delle Aquile;</li><li>dirotti una risorsa verso una radura;</li><li>aggiungi una clausola a un prossimo attacco delle Aquile;</li><li>fissi un'udienza con qualunque membro della Dinastia;</li><li>fai aggiungere o abrogare una legge in una radura delle Aquile.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con le Aquile. Quando usi la burocrazia della Dinastia mentre il tempo passa, tira sulla Reputazione. - 10+ (successo pieno): scegli 2 opzioni. - 7-9 (successo parziale): scegli 1 opzione. - 6- (fallimento): ti affidano un dovere: compilalo prima che il tempo passi o segna 3-nomea. Opzioni: - fai tre domande al GM dal punto di vista delle Aquile; - dirotti una risorsa verso una radura; - aggiungi una clausola a un prossimo attacco delle Aquile; - fissi un'udienza con qualunque membro della Dinastia; - fai aggiungere o abrogare una legge in una radura delle Aquile. (trad. non ufficiale)","back":["reputazione-indice","fazione-aquile"]},{"id":"rivolta-mossa","title":"Incitare alla Rivolta (Alleanza)","cat":"reputazione","group":"","src":"VF p.37","aliases":["incitare alla rivolta"],"html":"<p><strong>Richiede Reputazione +2 con l'Alleanza dei Boschi.</strong></p><div class=\"move\"><p><strong>Quando inciti i simpatizzanti locali a ribellarsi, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la rivolta avverrà quando il tempo passa; il GM sceglie 1 condizione senza la quale fallirà.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma il GM sceglie 2 condizioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: la rivolta scoppia subito, impreparata.</li></ul><p>Condizioni:</p><ul><li>convincere un simpatizzante a procurare risorse;</li><li>indebolire una specifica forza nemica;</li><li>rubare armi;</li><li>fare un favore a un gruppo locale.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con l'Alleanza dei Boschi. Quando inciti i simpatizzanti locali a ribellarsi, tira sulla Reputazione. - 10+ (successo pieno): la rivolta avverrà quando il tempo passa; il GM sceglie 1 condizione senza la quale fallirà. - 7-9 (successo parziale): come sopra, ma il GM sceglie 2 condizioni. - 6- (fallimento): la rivolta scoppia subito, impreparata. Condizioni: - convincere un simpatizzante a procurare risorse; - indebolire una specifica forza nemica; - rubare armi; - fare un favore a un gruppo locale. (trad. non ufficiale)","back":["reputazione-indice","fazione-alleanza"]},{"id":"predicare","title":"Predicare ai Fedeli (Lucertole)","cat":"reputazione","group":"","src":"VF p.38","aliases":["predicare ai fedeli"],"html":"<p><strong>Richiede Reputazione +2 con la Setta delle Lucertole.</strong></p><div class=\"move\"><p><strong>Quando predichi un sermone a una folla di cultisti, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 1 presa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: la folla fraintende il messaggio e agisce di conseguenza.</li></ul><p>Spendi una presa perché la folla:</p><ul><li>ti consegni qualcuno;</li><li>porti offerte (almeno 6-Valore);</li><li>combatta per te contro un bersaglio;</li><li>ripari o difenda qualcosa;</li><li>torni tranquillamente alle sue vite.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con la Setta delle Lucertole. Quando predichi un sermone a una folla di cultisti, tira sulla Reputazione. - 10+ (successo pieno): tieni 3 prese. - 7-9 (successo parziale): tieni 1 presa. - 6- (fallimento): la folla fraintende il messaggio e agisce di conseguenza. Spendi una presa perché la folla: - ti consegni qualcuno; - porti offerte (almeno 6-Valore); - combatta per te contro un bersaglio; - ripari o difenda qualcosa; - torni tranquillamente alle sue vite. (trad. non ufficiale)","back":["reputazione-indice","fazione-lucertole"]},{"id":"forgiare-resistenza","title":"Forgiare la Resistenza","cat":"reputazione","group":"","src":"RS p.33","aliases":["forgiare la resistenza"],"html":"<p><strong>Richiede Reputazione +2.</strong></p><div class=\"move\"><p><strong>Quando prometti di guidare un gruppo di oppressi di fronte a una situazione disperata, tira sulla Reputazione con la loro fazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: si riuniscono in un gruppo che ti segue; emerge anche un capo capace, che ti dice cosa devi fare per ispirarlo a guidarli da solo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: si riuniscono in un gruppo che ti segue.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: attiri i loro nemici: segna 2-nomea con chi volevi guidare.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2. Quando prometti di guidare un gruppo di oppressi di fronte a una situazione disperata, tira sulla Reputazione con la loro fazione. - 10+ (successo pieno): si riuniscono in un gruppo che ti segue; emerge anche un capo capace, che ti dice cosa devi fare per ispirarlo a guidarli da solo. - 7-9 (successo parziale): si riuniscono in un gruppo che ti segue. - 6- (fallimento): attiri i loro nemici: segna 2-nomea con chi volevi guidare. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"nemici-dei-nemici","title":"Chiamare i Nemici dei Tuoi Nemici","cat":"reputazione","group":"","src":"RS p.34","aliases":["chiamare i nemici dei tuoi nemici"],"html":"<p><strong>Richiede Reputazione -3.</strong></p><div class=\"move\"><p><strong>Quando spargi la voce che cerchi alleati contro un nemico potente, tira sulla Reputazione con la sua fazione come se fosse +3.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: trovi alleati potenti, ma divisi da liti interne.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma c'è anche un traditore tra loro: muoverli prima di scoprirlo li esporrebbe a gravi conseguenze.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: finisci in una trappola.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione -3. Quando spargi la voce che cerchi alleati contro un nemico potente, tira sulla Reputazione con la sua fazione come se fosse +3. - 10+ (successo pieno): trovi alleati potenti, ma divisi da liti interne. - 7-9 (successo parziale): come sopra, ma c'è anche un traditore tra loro: muoverli prima di scoprirlo li esporrebbe a gravi conseguenze. - 6- (fallimento): finisci in una trappola. (trad. non ufficiale)","back":["reputazione-indice"]},{"id":"impressionare-pubblico","title":"Impressionare il Pubblico","cat":"reputazione","group":"","src":"RS p.35","aliases":["impressionare il pubblico"],"html":"<p><strong>Richiede Reputazione +2 con gli Abitanti.</strong></p><div class=\"move\"><p><strong>Quando racconti le tue gesta eroiche a un gruppo di abitanti, tira sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 1 presa; quando la spendi si fa avanti ad aiutarti un abitante importante o particolarmente abile.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 1 presa; quando la spendi si fa avanti ad aiutarti un abitante coraggioso.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: tieni 1 presa, ma ti chiedono aiuto per un problema urgente. Scegli:<ul><li>accetti di aiutarli;</li><li>rifiuti: segni 2-nomea e perdi la presa.</li></ul></li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Richiede Reputazione +2 con gli Abitanti. Quando racconti le tue gesta eroiche a un gruppo di abitanti, tira sulla Reputazione. - 10+ (successo pieno): tieni 1 presa; quando la spendi si fa avanti ad aiutarti un abitante importante o particolarmente abile. - 7-9 (successo parziale): tieni 1 presa; quando la spendi si fa avanti ad aiutarti un abitante coraggioso. - 6- (fallimento): tieni 1 presa, ma ti chiedono aiuto per un problema urgente. Scegli: - accetti di aiutarli; - rifiuti: segni 2-nomea e perdi la presa. (trad. non ufficiale)","back":["reputazione-indice","fazione-abitanti"]},{"id":"viaggio-indice","title":"Mosse di Viaggio","cat":"indici","group":"","src":"B p.121-124; RS p.102-103","aliases":["mosse di viaggio","viaggio"],"html":"<p>Quando la banda si sposta, decide come procedere e <strong>uno solo tira per il gruppo</strong>. In caso di disaccordo si può <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a>; poi decide la maggioranza.</p><ul><li><a class=\"xl\" href=\"#viaggio-foresta\" data-id=\"viaggio-foresta\">Viaggiare Attraverso la Foresta</a> — attraverso la foresta (scorciatoia pericolosa)</li><li><a class=\"xl\" href=\"#viaggio-sentiero\" data-id=\"viaggio-sentiero\">Viaggiare Lungo il Sentiero</a> — lungo il sentiero (più sicuro)</li><li><a class=\"xl\" href=\"#cercare-rovine\" data-id=\"cercare-rovine\">Cercare Rovine</a> — cercare rovine nella foresta (RS)</li><li><a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a> — tornare da una rovina nella foresta (RS)</li><li><em>(Pirata)</em> <a class=\"xl\" href=\"#pb-pirata-salpare\" data-id=\"pb-pirata-salpare\">Solcare le Acque</a> — viaggio in nave</li></ul>","text":"Quando la banda si sposta, decide come procedere e uno solo tira per il gruppo. In caso di disaccordo si può Supplicare un PG; poi decide la maggioranza. - Viaggiare Attraverso la Foresta — attraverso la foresta (scorciatoia pericolosa) - Viaggiare Lungo il Sentiero — lungo il sentiero (più sicuro) - Cercare Rovine — cercare rovine nella foresta (RS) - Tornare da una Rovina nella Foresta — tornare da una rovina nella foresta (RS) - (Pirata) Solcare le Acque — viaggio in nave","back":["mosse"]},{"id":"viaggio-foresta","title":"Viaggiare Attraverso la Foresta","cat":"viaggio","group":"","src":"B p.121-122","aliases":["viaggiare attraverso la foresta","attraversare la foresta"],"html":"<div class=\"move\"><p><strong>Quando attraversate la foresta per passare da una radura all'altra, la banda sceglie come procedere e uno tira per tutti.</strong> Scegliete 1 modo:</p><ul><li><strong>lentamente, cercando cibo</strong>: tutti svuotano 2-consumo; la banda segna in totale 1-fatica per membro; tiro a <strong>-1</strong>;</li><li><strong>con cautela, evitando guai</strong>: la banda segna in totale 1-consumo o 1-fatica per membro; tiro a <strong>+1</strong>;</li><li><strong>il più velocemente possibile</strong>: tutti segnano 1-fatica e 1-consumo; tiro a <strong>+2</strong>.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungete qualsiasi radura dall'altra parte della foresta, viaggiate in sicurezza e uno di voi individua un <strong>luogo interessante</strong> (lasciate segni per ritrovarlo).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: arrivate e trovate il luogo interessante, ma <strong>qualcosa vi segue</strong>. Scegliete:<ul><li>lo ignorate;</li><li>ognuno segna fatica per seminarlo.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: incappate in un pericolo della foresta da risolvere prima di arrivare.</li></ul></div><p>Mosse collegate: <a class=\"xl\" href=\"#pb-ranger-raccoglitore\" data-id=\"pb-ranger-raccoglitore\">Raccoglitore</a>, <a class=\"xl\" href=\"#pb-predone-viaggiatore\" data-id=\"pb-predone-viaggiatore\">Viaggiatore Straordinario</a>.</p>","text":"Quando attraversate la foresta per passare da una radura all'altra, la banda sceglie come procedere e uno tira per tutti. Scegliete 1 modo: - lentamente, cercando cibo: tutti svuotano 2-consumo; la banda segna in totale 1-fatica per membro; tiro a -1; - con cautela, evitando guai: la banda segna in totale 1-consumo o 1-fatica per membro; tiro a +1; - il più velocemente possibile: tutti segnano 1-fatica e 1-consumo; tiro a +2. Risultati: - 10+ (successo pieno): raggiungete qualsiasi radura dall'altra parte della foresta, viaggiate in sicurezza e uno di voi individua un luogo interessante (lasciate segni per ritrovarlo). - 7-9 (successo parziale): arrivate e trovate il luogo interessante, ma qualcosa vi segue. Scegliete: - lo ignorate; - ognuno segna fatica per seminarlo. - 6- (fallimento): incappate in un pericolo della foresta da risolvere prima di arrivare. Mosse collegate: Raccoglitore, Viaggiatore Straordinario.","back":["viaggio-indice","pb-predone-viaggiatore"]},{"id":"viaggio-sentiero","title":"Viaggiare Lungo il Sentiero","cat":"viaggio","group":"","src":"B p.123-124","aliases":["viaggiare lungo il sentiero","viaggio lungo il sentiero"],"html":"<div class=\"move\"><p><strong>Quando viaggiate da una radura all'altra restando sul sentiero, la banda sceglie come procedere e uno tira per tutti.</strong> Scegliete 1 modo:</p><ul><li><strong>a passo tranquillo</strong>: tutti svuotano 3-fatica; la banda segna 2-consumo in totale; tiro a <strong>-1</strong>;</li><li><strong>a passo normale</strong>: tutti svuotano 2-fatica; la banda segna 1-consumo; tiro a <strong>+0</strong>;</li><li><strong>con cautela, veloci e inosservati</strong>: la banda segna 1-consumo; tiro a <strong>+1</strong>;</li><li><strong>a passo spedito</strong>: tutti segnano fatica; tiro a <strong>+2</strong>.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: arrivate in tempo utile; il viaggio è rapido e senza intoppi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: arrivate in tempo utile, ma vi imbattete in qualcosa di interessante (carovana, campo di battaglia...), che potete anche ignorare.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: vi cacciate nei guai prima di arrivare.</li></ul></div>","text":"Quando viaggiate da una radura all'altra restando sul sentiero, la banda sceglie come procedere e uno tira per tutti. Scegliete 1 modo: - a passo tranquillo: tutti svuotano 3-fatica; la banda segna 2-consumo in totale; tiro a -1; - a passo normale: tutti svuotano 2-fatica; la banda segna 1-consumo; tiro a +0; - con cautela, veloci e inosservati: la banda segna 1-consumo; tiro a +1; - a passo spedito: tutti segnano fatica; tiro a +2. Risultati: - 10+ (successo pieno): arrivate in tempo utile; il viaggio è rapido e senza intoppi. - 7-9 (successo parziale): arrivate in tempo utile, ma vi imbattete in qualcosa di interessante (carovana, campo di battaglia...), che potete anche ignorare. - 6- (fallimento): vi cacciate nei guai prima di arrivare.","back":["viaggio-indice","pb-predone-viaggiatore","pb-campione-popolo","tag-gravoso"]},{"id":"danno","title":"Danno e Tracciati dei Danni","cat":"danno","group":"","src":"B p.125-129","aliases":["danno","tracciati dei danni","tracciato dei danni","infliggi","subisci danno"],"html":"<p>\"Danno\" è il termine generico per tutti i tracciati. I PG ne hanno tre (4 caselle ciascuno all'inizio, max 6 con l'avanzamento): <a class=\"xl\" href=\"#consumo\" data-id=\"consumo\">Consumo</a>, <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a>, <a class=\"xl\" href=\"#ferite\" data-id=\"ferite\">Ferite</a>. Gli oggetti hanno l'<a class=\"xl\" href=\"#usura\" data-id=\"usura\">Usura</a>; i PNG hanno anche il <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a>.</p><p>Linguaggio:</p><ul><li><strong>Segna [danno] / segna 2-[danno]</strong>: segna 1 o 2 caselle sul tuo tracciato.</li><li><strong>Infliggi [danno]</strong>: è il bersaglio a segnare.</li><li><strong>Svuota [danno]</strong>: cancella caselle segnate; \"svuota tutto il...\" le cancella tutte.</li><li><strong>Danno aggiuntivo / in meno</strong>: +1 / -1 se non specificato.</li></ul><p>Vedi <a class=\"xl\" href=\"#danno-oltre-limite\" data-id=\"danno-oltre-limite\">Danno Oltre il Limite del Tracciato</a> e <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">Svuotare i Tracciati dei Danni</a>. In combattimento armi e armature modificano il danno (<a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>).</p>","text":"\"Danno\" è il termine generico per tutti i tracciati. I PG ne hanno tre (4 caselle ciascuno all'inizio, max 6 con l'avanzamento): Consumo, Fatica, Ferite. Gli oggetti hanno l'Usura; i PNG hanno anche il Morale. Linguaggio: - Segna [danno] / segna 2-[danno]: segna 1 o 2 caselle sul tuo tracciato. - Infliggi [danno]: è il bersaglio a segnare. - Svuota [danno]: cancella caselle segnate; \"svuota tutto il...\" le cancella tutte. - Danno aggiuntivo / in meno: +1 / -1 se non specificato. Vedi Danno Oltre il Limite del Tracciato e Svuotare i Tracciati dei Danni. In combattimento armi e armature modificano il danno (Armatura e Scudi).","back":["mosse-armi-indice"]},{"id":"consumo","title":"Consumo","cat":"danno","group":"","src":"B p.55, 125-126","aliases":["consumo","segna consumo"],"html":"<p>Rappresenta scorte, provviste e piccoli oggetti nelle tue sacche. Una casella segnata = tasche più vuote; <strong>1 casella ≈ 1-Valore</strong>.</p><p>Puoi segnare consumo per tirare fuori al momento giusto un oggetto semplice: monete (1-Valore), fiaccola o lanterna, 10 m di corda, rampino, guanti da scalata, provviste per un giorno, kit per il fuoco, grimaldelli semplici, materiale per riparazioni o cure, coltellino, piccola bomba fumogena, specchio, penna e pergamena, mappa base, boccetta d'olio o alcol, sacco a pelo, cuscinetti a sfera.</p><p>Se il tracciato è pieno sei al verde: non puoi segnarne altro e altro danno da consumo viene ignorato.</p>","text":"Rappresenta scorte, provviste e piccoli oggetti nelle tue sacche. Una casella segnata = tasche più vuote; 1 casella ≈ 1-Valore. Puoi segnare consumo per tirare fuori al momento giusto un oggetto semplice: monete (1-Valore), fiaccola o lanterna, 10 m di corda, rampino, guanti da scalata, provviste per un giorno, kit per il fuoco, grimaldelli semplici, materiale per riparazioni o cure, coltellino, piccola bomba fumogena, specchio, penna e pergamena, mappa base, boccetta d'olio o alcol, sacco a pelo, cuscinetti a sfera. Se il tracciato è pieno sei al verde: non puoi segnarne altro e altro danno da consumo viene ignorato.","back":["creazione","danno","equipaggiamento"]},{"id":"fatica","title":"Fatica","cat":"danno","group":"","src":"B p.55, 125-127","aliases":["fatica","segna fatica"],"html":"<p>Rappresenta energia e capacità di continuare. <strong>Non puoi segnarla a piacere</strong>: solo quando una mossa, un effetto o il GM lo dicono (molte mosse la chiedono come costo). Si svuota del tutto soddisfacendo la tua <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a> o riposando (vedi <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">Svuotare i Tracciati dei Danni</a>).</p><p>Tracciato pieno: sei sfinito, non puoi più spendere fatica. Se devi segnarne ancora <strong>crolli o svieni</strong> (sceglie il GM).</p>","text":"Rappresenta energia e capacità di continuare. Non puoi segnarla a piacere: solo quando una mossa, un effetto o il GM lo dicono (molte mosse la chiedono come costo). Si svuota del tutto soddisfacendo la tua Natura o riposando (vedi Svuotare i Tracciati dei Danni). Tracciato pieno: sei sfinito, non puoi più spendere fatica. Se devi segnarne ancora crolli o svieni (sceglie il GM).","back":["natura","creazione","tentare-impresa","aiutare","supplicare","danno"]},{"id":"ferite","title":"Ferite","cat":"danno","group":"","src":"B p.56, 125-128","aliases":["ferite","ferita","segna ferite"],"html":"<p>Rappresenta il danno fisico. Tracciato pieno: sei in fin di vita, non puoi correre né combattere senza gravi conseguenze e hai bisogno di cure immediate. <strong>Se devi segnare un'altra ferita, muori</strong> (di solito con un'ultima azione o ultime parole). Le armi infliggono di base 1-ferita.</p>","text":"Rappresenta il danno fisico. Tracciato pieno: sei in fin di vita, non puoi correre né combattere senza gravi conseguenze e hai bisogno di cure immediate. Se devi segnare un'altra ferita, muori (di solito con un'ultima azione o ultime parole). Le armi infliggono di base 1-ferita.","back":["creazione","danno"]},{"id":"usura","title":"Usura","cat":"danno","group":"","src":"B p.58, 125-128","aliases":["usura","segna usura"],"html":"<p>Tracciato di resistenza di un pezzo di <a class=\"xl\" href=\"#equipaggiamento\" data-id=\"equipaggiamento\">Equipaggiamento</a> (sui PNG un unico tracciato per tutto l'equipaggiamento). Tracciato pieno: l'oggetto è gravemente danneggiato. Se devi segnare altra usura, si <strong>distrugge</strong> irreparabilmente. Armature e scudi assorbono il danno: <strong>1 usura segnata = 1 danno in meno</strong> (vedi <a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>).</p>","text":"Tracciato di resistenza di un pezzo di Equipaggiamento (sui PNG un unico tracciato per tutto l'equipaggiamento). Tracciato pieno: l'oggetto è gravemente danneggiato. Se devi segnare altra usura, si distrugge irreparabilmente. Armature e scudi assorbono il danno: 1 usura segnata = 1 danno in meno (vedi Armatura e Scudi).","back":["danno","equipaggiamento"]},{"id":"morale","title":"Morale","cat":"danno","group":"","src":"B p.125-128, 213-214","aliases":["morale","danno al morale","danni al morale"],"html":"<p>Tracciato solo dei PNG: la loro volontà di opporsi ai vagabondi. Tracciato pieno: sono sul punto di cedere. Se devono segnarne ancora, <strong>si arrendono o fuggono</strong> subito. Molte mosse infliggono danni al morale (es. <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> con \"esita\", <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>, <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare un Gruppo</a>).</p>","text":"Tracciato solo dei PNG: la loro volontà di opporsi ai vagabondi. Tracciato pieno: sono sul punto di cedere. Se devono segnarne ancora, si arrendono o fuggono subito. Molte mosse infliggono danni al morale (es. Ingannare un PNG con \"esita\", Assaltare un Gruppo, Incalzare un Gruppo).","back":["ingannare","danno","attaccare-mischia","tag-maledetto"]},{"id":"danno-oltre-limite","title":"Danno Oltre il Limite del Tracciato","cat":"danno","group":"","src":"B p.127-128","aliases":["oltre il limite","tracciato pieno"],"html":"<p>Quando un tracciato è pieno sei in gravi condizioni; le vere conseguenze arrivano se devi segnare ancora:</p><ul><li><strong>Consumo</strong>: non puoi segnarne altro; ignoralo.</li><li><strong>Fatica</strong>: crolli o svieni (sceglie il GM), alla mercé dei nemici.</li><li><strong>Ferite</strong>: muori.</li><li><strong>Usura</strong>: l'oggetto è distrutto.</li><li><strong>Morale</strong> (PNG): si arrende o fugge.</li></ul><p>A volte puoi scegliere di andare oltre il limite (forzare l'equipaggiamento, o fatica se il GM lo consente).</p>","text":"Quando un tracciato è pieno sei in gravi condizioni; le vere conseguenze arrivano se devi segnare ancora: - Consumo: non puoi segnarne altro; ignoralo. - Fatica: crolli o svieni (sceglie il GM), alla mercé dei nemici. - Ferite: muori. - Usura: l'oggetto è distrutto. - Morale (PNG): si arrende o fugge. A volte puoi scegliere di andare oltre il limite (forzare l'equipaggiamento, o fatica se il GM lo consente).","back":["danno"]},{"id":"svuotare-tracciati","title":"Svuotare i Tracciati dei Danni","cat":"danno","group":"","src":"B p.128-129","aliases":["svuotare","recupero","guarigione","riposo"],"html":"<p><strong>Consumo</strong> (nuove risorse):</p><ul><li>1: piccola ricompensa, dispensa di un abitante, qualche ora di raccolta nella foresta</li><li>2: ricompensa dignitosa, casa di un abitante, 1-2 giorni di raccolta</li><li>3: ricompensa da un abitante facoltoso, bottega facoltosa, un paio di giorni di raccolta</li><li>4: grossa ricompensa da un abitante influente, casa facoltosa, una settimana di raccolta</li></ul><p><strong>Fatica</strong> (natura o riposo):</p><ul><li>1: notte in un accampamento sicuro, in una soffitta, un buon pasto</li><li>2: settimana in accampamento sicuro, notte in casa di un abitante, pasto eccezionale</li><li>3: settimana in un letto in casa, 1-2 notti in un comodo letto, un banchetto</li><li>4: settimana al sicuro in un comodo letto, acqua e cibo per una settimana</li></ul><p><strong>Ferite</strong> (cure):</p><ul><li>1: un vagabondo ti cura (segna consumo), guaritore per un'ora (1-Valore), una settimana a letto</li><li>2: guaritore per un giorno (2-Valore), due settimane a letto</li><li>3: guaritore per una settimana (3-Valore), un mese a letto</li><li>4: guaritore per due settimane o più (4-Valore)</li></ul><p><strong>Usura</strong> (riparazioni):</p><ul><li>1: un vagabondo per qualche ora (1-consumo), un esperto per un'ora (1-Valore)</li><li>2: un vagabondo per un paio di giorni (2-consumo), un esperto per qualche ora (2-Valore)</li><li>3: un esperto per un paio di giorni (3-Valore)</li><li>4: un esperto per una settimana o più (4-Valore)</li></ul><p>Quando <a class=\"xl\" href=\"#tempo-passa\" data-id=\"tempo-passa\">il tempo passa</a> i tracciati si svuotano in buona parte grazie ad azioni fuori scena.</p>","text":"Consumo (nuove risorse): - 1: piccola ricompensa, dispensa di un abitante, qualche ora di raccolta nella foresta - 2: ricompensa dignitosa, casa di un abitante, 1-2 giorni di raccolta - 3: ricompensa da un abitante facoltoso, bottega facoltosa, un paio di giorni di raccolta - 4: grossa ricompensa da un abitante influente, casa facoltosa, una settimana di raccolta Fatica (natura o riposo): - 1: notte in un accampamento sicuro, in una soffitta, un buon pasto - 2: settimana in accampamento sicuro, notte in casa di un abitante, pasto eccezionale - 3: settimana in un letto in casa, 1-2 notti in un comodo letto, un banchetto - 4: settimana al sicuro in un comodo letto, acqua e cibo per una settimana Ferite (cure): - 1: un vagabondo ti cura (segna consumo), guaritore per un'ora (1-Valore), una settimana a letto - 2: guaritore per un giorno (2-Valore), due settimane a letto - 3: guaritore per una settimana (3-Valore), un mese a letto - 4: guaritore per due settimane o più (4-Valore) Usura (riparazioni): - 1: un vagabondo per qualche ora (1-consumo), un esperto per un'ora (1-Valore) - 2: un vagabondo per un paio di giorni (2-consumo), un esperto per qualche ora (2-Valore) - 3: un esperto per un paio di giorni (3-Valore) - 4: un esperto per una settimana o più (4-Valore) Quando il tempo passa i tracciati si svuotano in buona parte grazie ad azioni fuori scena.","back":["danno","fatica","pescare"]},{"id":"fine-sessione","title":"Mosse di Fine Sessione","cat":"regole","group":"","src":"B p.130","aliases":["mosse di fine sessione","fine sessione","mossa di fine sessione"],"html":"<p>Alla fine di ogni sessione:</p><ol><li><strong>Motivazioni</strong>: ogni giocatore legge le sue <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">motivazioni</a>; il tavolo valuta se le ha soddisfatte. Se sì e non ha già avanzato per quella motivazione in sessione, <strong>avanza</strong>.</li><li><strong>Cambiamento</strong>: ogni giocatore può (se vuole) cambiare un elemento: sostituire una motivazione con una di un altro playbook, oppure la natura con una di un altro playbook, oppure un legame (tipo e soggetto) con uno di un altro playbook.</li></ol>","text":"Alla fine di ogni sessione: 1. Motivazioni: ogni giocatore legge le sue motivazioni; il tavolo valuta se le ha soddisfatte. Se sì e non ha già avanzato per quella motivazione in sessione, avanza. 2. Cambiamento: ogni giocatore può (se vuole) cambiare un elemento: sostituire una motivazione con una di un altro playbook, oppure la natura con una di un altro playbook, oppure un legame (tipo e soggetto) con uno di un altro playbook.","back":["mosse","natura"]},{"id":"avanzamento","title":"Avanzamento","cat":"avanzamento","group":"","src":"B p.170-176","aliases":["avanzamento","avanzamenti","avanzi","avanzare"],"html":"<p>Guadagni un avanzamento quando soddisfi una <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Motivazioni</a> (max uno per motivazione a sessione). Scegli subito dalla lista:</p><ul><li>+1 a una <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">caratteristica</a> (max +2).</li><li>Una nuova mossa del tuo playbook (max 5 mosse dal tuo playbook).</li><li>Una nuova mossa da un altro playbook (max 2).</li><li>Fino a due nuove <a class=\"xl\" href=\"#abilita-armi\" data-id=\"abilita-armi\">abilità con le armi</a> (max 7 in totale).</li><li>Fino a due nuove <a class=\"xl\" href=\"#imprese-indice\" data-id=\"imprese-indice\">imprese da furfante</a> (max 6 in totale).</li><li>Una casella in più su un tracciato dei danni (max 6 ciascuno).</li><li>Fino a due nuovi <a class=\"xl\" href=\"#legame\" data-id=\"legame\">legami</a> (solo l'effetto; max 6).</li><li><em>(VF)</em> Padroneggiare una mossa base o fino a due abilità con le armi: vedi <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">Maestrie</a>.</li></ul><p>Abilità, imprese e caselle ottenute tramite mosse dei playbook <strong>non contano</strong> nei limiti.</p>","text":"Guadagni un avanzamento quando soddisfi una Motivazioni (max uno per motivazione a sessione). Scegli subito dalla lista: - +1 a una caratteristica (max +2). - Una nuova mossa del tuo playbook (max 5 mosse dal tuo playbook). - Una nuova mossa da un altro playbook (max 2). - Fino a due nuove abilità con le armi (max 7 in totale). - Fino a due nuove imprese da furfante (max 6 in totale). - Una casella in più su un tracciato dei danni (max 6 ciascuno). - Fino a due nuovi legami (solo l'effetto; max 6). - (VF) Padroneggiare una mossa base o fino a due abilità con le armi: vedi Maestrie. Abilità, imprese e caselle ottenute tramite mosse dei playbook non contano nei limiti.","back":["caratteristiche","motivazione","abilita-armi","maestrie"]},{"id":"cambiare-playbook","title":"Cambiare Playbook","cat":"avanzamento","group":"","src":"B p.177-179","aliases":["cambiare playbook"],"html":"<p>Se il vagabondo non rispecchia più il suo playbook e il tavolo è d'accordo (a fine sessione o con un salto temporale):</p><ul><li>Dettagli nuovi dal nuovo playbook; il passato resta.</li><li>Caratteristiche: puoi ridurre di 1 la più bassa del nuovo playbook e aumentare di 1 la più alta (tra -2 e +2).</li><li>Natura e entrambe le motivazioni dal nuovo playbook; due legami dal nuovo playbook.</li><li>Reputazione, equipaggiamento e tracciati restano uguali.</li><li>Mosse: scambiale una per una con quelle del nuovo playbook (max 2 esterne).</li><li>Puoi scambiare un'impresa da furfante e un'abilità con le armi.</li></ul>","text":"Se il vagabondo non rispecchia più il suo playbook e il tavolo è d'accordo (a fine sessione o con un salto temporale): - Dettagli nuovi dal nuovo playbook; il passato resta. - Caratteristiche: puoi ridurre di 1 la più bassa del nuovo playbook e aumentare di 1 la più alta (tra -2 e +2). - Natura e entrambe le motivazioni dal nuovo playbook; due legami dal nuovo playbook. - Reputazione, equipaggiamento e tracciati restano uguali. - Mosse: scambiale una per una con quelle del nuovo playbook (max 2 esterne). - Puoi scambiare un'impresa da furfante e un'abilità con le armi.","back":[]},{"id":"nuovo-personaggio","title":"Creare un Nuovo Personaggio","cat":"avanzamento","group":"","src":"B p.179-181","aliases":["nuovo personaggio"],"html":"<p>Il vecchio PG, se vivo, diventa un PNG (o esce del tutto dalla storia, se il giocatore lo chiede). Il nuovo PG si crea normalmente, spiegando perché si unisce alla banda; i legami verso il vecchio PG possono passare al nuovo. Se gli altri sono molto avanzati, il GM può concedere 1-2 avanzamenti gratuiti e 4-Valore extra.</p>","text":"Il vecchio PG, se vivo, diventa un PNG (o esce del tutto dalla storia, se il giocatore lo chiede). Il nuovo PG si crea normalmente, spiegando perché si unisce alla banda; i legami verso il vecchio PG possono passare al nuovo. Se gli altri sono molto avanzati, il GM può concedere 1-2 avanzamenti gratuiti e 4-Valore extra.","back":[]},{"id":"tempo-passa","title":"Il Tempo che Passa","cat":"regole","group":"","src":"B p.240-241","aliases":["il tempo passa","quando il tempo passa","tempo passa"],"html":"<p>Il tempo passa quando la storia salta in avanti di un paio di settimane (lunghi viaggi, riposo). È una sorta di azzeramento: i vagabondi svuotano i tracciati grazie ad azioni fuori scena e nei Boschi avvengono grandi cambiamenti. Il GM fa un Tiro Fazione per ogni fazione. Molte mosse si riferiscono a questo momento (es. <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Protezione</a>, <a class=\"xl\" href=\"#screditare-leader\" data-id=\"screditare-leader\">Screditare un Leader</a>).</p>","text":"Il tempo passa quando la storia salta in avanti di un paio di settimane (lunghi viaggi, riposo). È una sorta di azzeramento: i vagabondi svuotano i tracciati grazie ad azioni fuori scena e nei Boschi avvengono grandi cambiamenti. Il GM fa un Tiro Fazione per ogni fazione. Molte mosse si riferiscono a questo momento (es. Protezione, Screditare un Leader).","back":["screditare-leader","svuotare-tracciati"]},{"id":"mosse-armi-indice","title":"Mosse con le Armi","cat":"indici","group":"","src":"B p.89-109; VF p.24-30; RS p.30-32","aliases":["mosse con le armi","combattimento"],"html":"<p>Il combattimento non è un sottosistema separato: resta una conversazione in cui le mosse scattano quando la narrazione lo richiede (vedi Gestire le Scene di Combattimento). Le mosse base restano utili (es. <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a> per +1, <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a> alla resa).</p><p><strong>Mosse base con le armi</strong> (tutti): <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>, <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a>, <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a>.</p><p><strong>Abilità con le armi</strong> (vedi <a class=\"xl\" href=\"#abilita-armi\" data-id=\"abilita-armi\">Abilità con le Armi</a>):</p><ul><li><em>Manuale base</em>: <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>, <a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a>, <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a>, <a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a>, <a class=\"xl\" href=\"#fracassare\" data-id=\"fracassare\">Fracassare</a>, <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a>, <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare un Gruppo</a>, <a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a>, <a class=\"xl\" href=\"#tiro-maestro\" data-id=\"tiro-maestro\">Tiro da Maestro</a>, <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a>.</li><li><em>Viandanti e Forestieri</em>: <a class=\"xl\" href=\"#furia-battaglia\" data-id=\"furia-battaglia\">Furia di Battaglia (Battle Fury)</a>, <a class=\"xl\" href=\"#carica\" data-id=\"carica\">Carica (Charge)</a>, <a class=\"xl\" href=\"#scagliare\" data-id=\"scagliare\">Scagliare (Hurl)</a>, <a class=\"xl\" href=\"#affondo\" data-id=\"affondo\">Affondo (Lunge)</a>, <a class=\"xl\" href=\"#combattere-coppia\" data-id=\"combattere-coppia\">Combattere in Coppia (Paired Fighting)</a>, <a class=\"xl\" href=\"#zampe-martello\" data-id=\"zampe-martello\">Zampe di Martello (Hammerpaws)</a>, <a class=\"xl\" href=\"#tiro-preciso\" data-id=\"tiro-preciso\">Tiro di Precisione (Pinpoint Shot)</a>, <a class=\"xl\" href=\"#tiro-lungo\" data-id=\"tiro-lungo\">Tiro Lungo (Long Shot)</a>, <a class=\"xl\" href=\"#tiro-bruciapelo\" data-id=\"tiro-bruciapelo\">Tiro a Bruciapelo (Point-Blank Shot)</a>, <a class=\"xl\" href=\"#cambiare-mano\" data-id=\"cambiare-mano\">Cambiare Mano (Switch Hands)</a>.</li><li><em>Rovine e Spedizioni</em>: <a class=\"xl\" href=\"#spazzata\" data-id=\"spazzata\">Spazzata d'Arco (Sweep)</a>, <a class=\"xl\" href=\"#colpo-pomo\" data-id=\"colpo-pomo\">Colpo di Pomo (Pommel Strike)</a>, <a class=\"xl\" href=\"#svolazzo-terrificante\" data-id=\"svolazzo-terrificante\">Svolazzo Terrificante (Frightful Flourish)</a>, <a class=\"xl\" href=\"#stoccata-sorpresa\" data-id=\"stoccata-sorpresa\">Stoccata a Sorpresa (Surprise Jab)</a>.</li></ul><p>Regole collegate: <a class=\"xl\" href=\"#distanze\" data-id=\"distanze\">Distanze</a>, <a class=\"xl\" href=\"#danno\" data-id=\"danno\">Danno e Tracciati dei Danni</a>, <a class=\"xl\" href=\"#armatura\" data-id=\"armatura\">Armatura e Scudi</a>, Gruppi di PNG, <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">Maestrie</a>.</p>","text":"Il combattimento non è un sottosistema separato: resta una conversazione in cui le mosse scattano quando la narrazione lo richiede (vedi Gestire le Scene di Combattimento). Le mosse base restano utili (es. Valutare una Situazione Tesa per +1, Convincere un PNG alla resa). Mosse base con le armi (tutti): Attaccare in Mischia, Lottare con un Nemico, Prendere la Mira. Abilità con le armi (vedi Abilità con le Armi): - Manuale base: Assaltare un Gruppo, Colpo Crudele, Confondere i Sensi, Disarmare, Fracassare, Improvvisare un'Arma, Incalzare un Gruppo, Parare, Tiro da Maestro, Tiro Rapido. - Viandanti e Forestieri: Furia di Battaglia (Battle Fury), Carica (Charge), Scagliare (Hurl), Affondo (Lunge), Combattere in Coppia (Paired Fighting), Zampe di Martello (Hammerpaws), Tiro di Precisione (Pinpoint Shot), Tiro Lungo (Long Shot), Tiro a Bruciapelo (Point-Blank Shot), Cambiare Mano (Switch Hands). - Rovine e Spedizioni: Spazzata d'Arco (Sweep), Colpo di Pomo (Pommel Strike), Svolazzo Terrificante (Frightful Flourish), Stoccata a Sorpresa (Surprise Jab). Regole collegate: Distanze, Danno e Tracciati dei Danni, Armatura e Scudi, Gruppi di PNG, Maestrie.","back":["mosse"]},{"id":"abilita-armi","title":"Abilità
