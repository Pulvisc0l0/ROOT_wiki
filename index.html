oresta: - +1 al tiro; - oppure svuota 2-consumo. Prima di arrivare puoi fare al GM due domande sulla radura, in base all'ultima volta che ci sei stato.","back":["viaggio-foresta","pb-predone"]},{"id":"pb-predone-sentiero","title":"Il Sentiero del Contrabbandiere","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Il Sentiero del Contrabbandiere"],"html":"<div class=\"move\"><p><strong>Quando cerchi un passaggio segreto per entrare o uscire da un luogo, segna fatica e tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: trovi un passaggio nascosto (il GM dice dove porta) e lungo la via trovi anche qualcosa di valore.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: trovi un passaggio nascosto; il GM dice dove porta.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: lo trovi, ma qualcun altro lo sta usando e non ne è felice.</li></ul></div>","text":"Quando cerchi un passaggio segreto per entrare o uscire da un luogo, segna fatica e tira su Fortuna. - 10+ (successo pieno): trovi un passaggio nascosto (il GM dice dove porta) e lungo la via trovi anche qualcosa di valore. - 7-9 (successo parziale): trovi un passaggio nascosto; il GM dice dove porta. - 6- (fallimento): lo trovi, ma qualcun altro lo sta usando e non ne è felice.","back":["pb-predone"]},{"id":"pb-ranger","title":"Il Ranger","cat":"playbook","group":"Manuale Base","src":"B p.161-164","aliases":["Ranger"],"html":"<p><em>Un vagabondo furtivo e solitario, più creatura della foresta che delle radure.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Incalzare, Colpo Crudele</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lupo</li></ul><p><strong>Natura</strong></p><ul><li><em>Solitario</em>: svuota la fatica quando ti cacci da solo in una situazione pericolosa.</li><li><em>Cinico</em>: svuota la fatica quando fai apertamente domande pericolose su una presunta \"verità\".</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Sentinella (ti ha ingannato, eppure ci lavori ancora), Protettore (ti ha coperto evitandoti l'inimicizia di una fazione).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ranger-passo\" data-id=\"pb-ranger-passo\">Passo Felpato</a>, <a class=\"xl\" href=\"#pb-ranger-sfuggire\" data-id=\"pb-ranger-sfuggire\">Sfuggire</a>, <a class=\"xl\" href=\"#pb-ranger-veleni\" data-id=\"pb-ranger-veleni\">Veleni e Antidoti</a>, <a class=\"xl\" href=\"#pb-ranger-raccoglitore\" data-id=\"pb-ranger-raccoglitore\">Raccoglitore</a>, <a class=\"xl\" href=\"#pb-ranger-minaccioso\" data-id=\"pb-ranger-minaccioso\">Aspetto Minaccioso</a>, <a class=\"xl\" href=\"#pb-ranger-sporco\" data-id=\"pb-ranger-sporco\">Giocare Sporco</a>.</p>","text":"Un vagabondo furtivo e solitario, più creatura della foresta che delle radure. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore +1 - Abilità iniziale: Fracassare, Disarmare, Incalzare, Colpo Crudele - Imprese: Nascondersi, Sgattaiolare - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, lupo Natura - Solitario: svuota la fatica quando ti cacci da solo in una situazione pericolosa. - Cinico: svuota la fatica quando fai apertamente domande pericolose su una presunta \"verità\". Motivazioni: Scoperta, Libertà, Vendetta, Protezione. Legami: Sentinella (ti ha ingannato, eppure ci lavori ancora), Protettore (ti ha coperto evitandoti l'inimicizia di una fazione). Mosse (tre): Passo Felpato, Sfuggire, Veleni e Antidoti, Raccoglitore, Aspetto Minaccioso, Giocare Sporco.","back":["playbook-indice","nature-indice"]},{"id":"pb-ranger-passo","title":"Passo Felpato","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Passo Felpato"],"html":"<p>Quando tenti di <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a> o <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">nasconderti</a>, puoi segnare 2-fatica per trasformare un fallimento in <span class=\"res\">7-9</span>.</p>","text":"Quando tenti di Sgattaiolare o nasconderti, puoi segnare 2-fatica per trasformare un fallimento in 7-9.","back":["pb-ranger"]},{"id":"pb-ranger-sfuggire","title":"Sfuggire","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Sfuggire"],"html":"<div class=\"move\"><p><strong>Quando cogli un'occasione per sfuggire a una situazione pericolosa, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scappi; il GM sceglie 1 conseguenza.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scappi; il GM sceglie 2 conseguenze.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: scappi, ma segni fatica o ferite e lasci tracce che i nemici possono seguire.</li></ul><p>Conseguenze:</p><ul><li>subisci ferite o fatica (sceglie il GM);</li><li>finisci in un'altra brutta situazione;</li><li>ti lasci dietro qualcosa di importante.</li></ul></div>","text":"Quando cogli un'occasione per sfuggire a una situazione pericolosa, tira su Destrezza. - 10+ (successo pieno): scappi; il GM sceglie 1 conseguenza. - 7-9 (successo parziale): scappi; il GM sceglie 2 conseguenze. - 6- (fallimento): scappi, ma segni fatica o ferite e lasci tracce che i nemici possono seguire. Conseguenze: - subisci ferite o fatica (sceglie il GM); - finisci in un'altra brutta situazione; - ti lasci dietro qualcosa di importante.","back":["pb-ranger"]},{"id":"pb-ranger-veleni","title":"Veleni e Antidoti","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Veleni e Antidoti"],"html":"<p>Quando crei un veleno, segna consumo e descrivine l'effetto (addormentare, indebolire, confondere, uccidere); va iniettato o ingerito. Quando studi un veleno per farne l'antidoto, il GM ti dice gli ingredienti: trovali e segna 1-consumo. Gli effetti richiedono tempo (un veleno letale 1-2 giorni).</p>","text":"Quando crei un veleno, segna consumo e descrivine l'effetto (addormentare, indebolire, confondere, uccidere); va iniettato o ingerito. Quando studi un veleno per farne l'antidoto, il GM ti dice gli ingredienti: trovali e segna 1-consumo. Gli effetti richiedono tempo (un veleno letale 1-2 giorni).","back":["pb-ranger"]},{"id":"pb-ranger-raccoglitore","title":"Raccoglitore","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Raccoglitore"],"html":"<p>Quando viaggi attraverso una foresta, prima di qualsiasi mossa di viaggio puoi svuotare fino a 3-consumo, oppure fino a 2-fatica, oppure fino a 2-ferite.</p>","text":"Quando viaggi attraverso una foresta, prima di qualsiasi mossa di viaggio puoi svuotare fino a 3-consumo, oppure fino a 2-fatica, oppure fino a 2-ferite.","back":["viaggio-foresta","pb-ranger"]},{"id":"pb-ranger-minaccioso","title":"Aspetto Minaccioso","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Aspetto Minaccioso"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convinci un PNG</a> con una minaccia credibile, tira su Vigore invece di Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: non del tutto: il GM ti dice cosa devi fare subito per persuaderlo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non lo convinci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando convinci un PNG con una minaccia credibile, tira su Vigore invece di Carisma. - 10+ (successo pieno): lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. - 7-9 (successo parziale): non del tutto: il GM ti dice cosa devi fare subito per persuaderlo. - 6- (fallimento): non lo convinci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-ranger"]},{"id":"pb-ranger-sporco","title":"Giocare Sporco","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Giocare Sporco"],"html":"<p>Prendi due abilità tra Tiro da Maestro, Confondere i Sensi, Improvvisare un'Arma, Disarmare, Colpo Crudele (fuori limite).</p>","text":"Prendi due abilità tra Tiro da Maestro, Confondere i Sensi, Improvvisare un'Arma, Disarmare, Colpo Crudele (fuori limite).","back":["pb-ranger"]},{"id":"pb-ronin","title":"Il Ronin","cat":"playbook","group":"Manuale Base","src":"B p.165-168","aliases":["Ronin"],"html":"<p><em>Un guerriero addestrato giunto da una terra lontana dopo aver perso il suo signore.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia +1, Destrezza 0, Fortuna -1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Incalzare, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Attaccare alle Spalle</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, procione</li><li>Domanda speciale: cos'è successo al tuo ultimo signore?</li></ul><p><strong>Natura</strong></p><ul><li><em>Sopravvissuto</em>: svuota la fatica quando fuggi o copri la fuga dei tuoi alleati da una situazione pericolosa.</li><li><em>Pellegrino</em>: svuota la fatica quando incontri un esperto in un'abilità che non possiedi.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Compagno (ti ha aiutato nella tua prima impresa nei Boschi), Sentinella (ti ricorda il tuo vecchio maestro).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ronin-disarmato\" data-id=\"pb-ronin-disarmato\">Mai Disarmato</a>, <a class=\"xl\" href=\"#pb-ronin-padrone\" data-id=\"pb-ronin-padrone\">Quello che il Padrone Desidera</a>, <a class=\"xl\" href=\"#pb-ronin-etichetta\" data-id=\"pb-ronin-etichetta\">Etichetta</a>, <a class=\"xl\" href=\"#pb-ronin-dovere\" data-id=\"pb-ronin-dovere\">Dovere e Lealtà</a>, <a class=\"xl\" href=\"#pb-ronin-regole\" data-id=\"pb-ronin-regole\">Regole di Guerra</a>, <a class=\"xl\" href=\"#pb-ronin-allerta\" data-id=\"pb-ronin-allerta\">Sempre Allerta</a>.</p>","text":"Un guerriero addestrato giunto da una terra lontana dopo aver perso il suo signore. - Caratteristiche: Carisma 0, Astuzia +1, Destrezza 0, Fortuna -1, Vigore +2 - Abilità iniziale: Fracassare, Incalzare, Assaltare un Gruppo, Colpo Crudele - Imprese: Attaccare alle Spalle - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, procione - Domanda speciale: cos'è successo al tuo ultimo signore? Natura - Sopravvissuto: svuota la fatica quando fuggi o copri la fuga dei tuoi alleati da una situazione pericolosa. - Pellegrino: svuota la fatica quando incontri un esperto in un'abilità che non possiedi. Motivazioni: Princìpi, Vendetta, Brivido, Voglia di Viaggiare. Legami: Compagno (ti ha aiutato nella tua prima impresa nei Boschi), Sentinella (ti ricorda il tuo vecchio maestro). Mosse (tre): Mai Disarmato, Quello che il Padrone Desidera, Etichetta, Dovere e Lealtà, Regole di Guerra, Sempre Allerta.","back":["playbook-indice","nature-indice"]},{"id":"pb-ronin-disarmato","title":"Mai Disarmato","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Mai Disarmato"],"html":"<p>Ottieni <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a> (fuori limite). Con un'arma improvvisata infliggi +1 danno.</p>","text":"Ottieni Improvvisare un'Arma (fuori limite). Con un'arma improvvisata infliggi +1 danno.","back":["pb-ronin"]},{"id":"pb-ronin-padrone","title":"Quello che il Padrone Desidera","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Quello che il Padrone Desidera"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">cerchi di capire le intenzioni</a> di qualcuno di importante o potente, tira su Vigore invece di Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni 3 prese (domande di <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a>).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ottieni 1 presa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: nessuna presa; il GM ti dice cosa succede e la situazione si complica.</li></ul></div><div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni</a> qualcuno di importante fingendoti un subalterno, tira su Vigore invece di Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: abbocca e fa ciò che vuoi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: abbocca, oppure il GM sceglie 1 reazione:<ul><li>esita (spesso danno al morale);</li><li>commette un passo falso: ti si presenta un'opportunità;</li><li>reagisce in modo esagerato: +1 al prossimo tiro contro di lui.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci casca; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando cerchi di capire le intenzioni di qualcuno di importante o potente, tira su Vigore invece di Carisma. - 10+ (successo pieno): ottieni 3 prese (domande di Capire le Intenzioni). - 7-9 (successo parziale): ottieni 1 presa. - 6- (fallimento): nessuna presa; il GM ti dice cosa succede e la situazione si complica. Quando inganni qualcuno di importante fingendoti un subalterno, tira su Vigore invece di Astuzia. - 10+ (successo pieno): abbocca e fa ciò che vuoi. - 7-9 (successo parziale): abbocca, oppure il GM sceglie 1 reazione: - esita (spesso danno al morale); - commette un passo falso: ti si presenta un'opportunità; - reagisce in modo esagerato: +1 al prossimo tiro contro di lui. - 6- (fallimento): non ci casca; il GM ti dice cosa succede e la situazione si complica.","back":["pb-ronin"]},{"id":"pb-ronin-etichetta","title":"Etichetta","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Etichetta"],"html":"<div class=\"move\"><p><strong>Quando sei in un contesto sociale retto dall'etichetta, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese (le perdi andandotene).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: commetti una grave scortesia: segna fatica.</li></ul><p>Spendi una presa per:</p><ul><li>nascondere un errore tuo o di un alleato (svuota 1-fatica);</li><li>far notare l'errore di un altro (1-morale);</li><li>affascinare qualcuno (+1 continuo a parlargli finché hai prese);</li><li>dimostrare il tuo valore (segna prestigio con la fazione di un potente).</li></ul></div>","text":"Quando sei in un contesto sociale retto dall'etichetta, tira su Astuzia. - 10+ (successo pieno): tieni 3 prese (le perdi andandotene). - 7-9 (successo parziale): tieni 2 prese. - 6- (fallimento): commetti una grave scortesia: segna fatica. Spendi una presa per: - nascondere un errore tuo o di un alleato (svuota 1-fatica); - far notare l'errore di un altro (1-morale); - affascinare qualcuno (+1 continuo a parlargli finché hai prese); - dimostrare il tuo valore (segna prestigio con la fazione di un potente).","back":["pb-ronin"]},{"id":"pb-ronin-dovere","title":"Dovere e Lealtà","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Dovere e Lealtà"],"html":"<p>Quando ti dedichi alla causa di qualcuno che ritieni degno, giuragli fedeltà e dichiara una missione ben definita. Segna fatica per <strong>ritirare</strong> una mossa che ti aiuta a compierla. Non puoi dedicarti ad altro finché non la completi o rompi il giuramento. Rompere: riempi la fatica e segna 4-nomea con la fazione; rispettare: 4-prestigio.</p>","text":"Quando ti dedichi alla causa di qualcuno che ritieni degno, giuragli fedeltà e dichiara una missione ben definita. Segna fatica per ritirare una mossa che ti aiuta a compierla. Non puoi dedicarti ad altro finché non la completi o rompi il giuramento. Rompere: riempi la fatica e segna 4-nomea con la fazione; rispettare: 4-prestigio.","back":["pb-ronin"]},{"id":"pb-ronin-regole","title":"Regole di Guerra","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Regole di Guerra"],"html":"<div class=\"move\"><p><strong>Quando chiedi a un nemico disposto a ragionare di rispettare una regola di guerra, tira su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: si sente obbligato a rispettare 1 regola, che scegli tu.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: si sente obbligato a rispettare 1 regola scelta da te, ma anche lui ne sceglie una che devi rispettare tu (se la violi, il suo obbligo cessa).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non si sente obbligato e ti mostra le sue regole.</li></ul><p>Regole:</p><ul><li>clemenza con chi si arrende e con i prigionieri;</li><li>niente tattiche subdole;</li><li>faccia a faccia, senza aiuti né rinforzi;</li><li>non coinvolgere innocenti o disarmati;</li><li>combattere per la resa, non la ritirata.</li></ul></div>","text":"Quando chiedi a un nemico disposto a ragionare di rispettare una regola di guerra, tira su Vigore. - 10+ (successo pieno): si sente obbligato a rispettare 1 regola, che scegli tu. - 7-9 (successo parziale): si sente obbligato a rispettare 1 regola scelta da te, ma anche lui ne sceglie una che devi rispettare tu (se la violi, il suo obbligo cessa). - 6- (fallimento): non si sente obbligato e ti mostra le sue regole. Regole: - clemenza con chi si arrende e con i prigionieri; - niente tattiche subdole; - faccia a faccia, senza aiuti né rinforzi; - non coinvolgere innocenti o disarmati; - combattere per la resa, non la ritirata.","back":["pb-ronin"]},{"id":"pb-ronin-allerta","title":"Sempre Allerta","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Sempre Allerta"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-ronin"]},{"id":"pb-campione","title":"Il Campione","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.93-96","aliases":["Campione","Champion"],"html":"<p><em>Aspirante eroe e leggenda, difensore degli innocenti e portabandiera di cause perse.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza -1, Fortuna +1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Tiro da Maestro</li><li><strong>Imprese</strong>: Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, cane</li></ul><p><strong>Natura</strong> <em>(la scheda ufficiale MS riporta per errore le nature dell'Ambasciatore: questi nomi sono una traduzione non ufficiale)</em></p><ul><li><em>Paladino dei deboli (Advocate)</em>: svuota la fatica quando affronti un PNG potente per come tratta i deboli.</li><li><em>Esemplare (Exemplar)</em>: svuota la fatica quando ti assumi pubblicamente un compito difficile per conto dei Giusti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>.</p><p><strong>Legami</strong>: Protettore (è un vero eroe), Familiare (siete quasi fratelli).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-campione-chiamata\" data-id=\"pb-campione-chiamata\">Vocazione</a> + una tra <a class=\"xl\" href=\"#pb-campione-popolo\" data-id=\"pb-campione-popolo\">Amico del Popolo</a>, <a class=\"xl\" href=\"#pb-campione-abilita\" data-id=\"pb-campione-abilita\">Muso a Muso</a>, <a class=\"xl\" href=\"#pb-campione-causa\" data-id=\"pb-campione-causa\">Per una Giusta Causa</a>, <a class=\"xl\" href=\"#pb-campione-forza\" data-id=\"pb-campione-forza\">Forza Bruta</a>.</p>","text":"Aspirante eroe e leggenda, difensore degli innocenti e portabandiera di cause perse. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza -1, Fortuna +1, Vigore +2 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Tiro da Maestro - Imprese: Gioco di Prestigio - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, cane Natura (la scheda ufficiale MS riporta per errore le nature dell'Ambasciatore: questi nomi sono una traduzione non ufficiale) - Paladino dei deboli (Advocate): svuota la fatica quando affronti un PNG potente per come tratta i deboli. - Esemplare (Exemplar): svuota la fatica quando ti assumi pubblicamente un compito difficile per conto dei Giusti. Motivazioni: Giustizia, Princìpi, Lealtà, Ambizione. Legami: Protettore (è un vero eroe), Familiare (siete quasi fratelli). Mosse: inizi con Vocazione + una tra Amico del Popolo, Muso a Muso, Per una Giusta Causa, Forza Bruta.","back":["playbook-indice"]},{"id":"pb-campione-chiamata","title":"Vocazione","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Vocazione","I Giusti","il Nemico"],"html":"<p>Nomina due fazioni non-abitanti: una è la speranza dei Boschi (<strong>i Giusti</strong>), l'altra tiranni malvagi (<strong>il Nemico</strong>). +1 continuo per proteggere membri dei Giusti o danneggiare agenti del Nemico. A fine sessione puoi cambiarle svuotando tutto il prestigio con la fazione che non ti ispira più.</p><p>Scegli un ruolo:</p><ul><li><em>Autorità</em>: quando convinci un PNG a combattere per i Giusti o resistere al Nemico, tira su Vigore invece di Carisma.</li><li><em>Paladino</em>: +1 danno al Nemico; -1 danno subito proteggendo i Giusti.</li><li><em>Emissario</em>: prestigio extra con i Giusti, nomea extra con il Nemico.</li></ul><p>Risultati del tiro dell'<em>Autorità</em> (come <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>):</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: non del tutto: il GM ti dice cosa devi fare subito per persuaderlo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non lo convinci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Nomina due fazioni non-abitanti: una è la speranza dei Boschi (i Giusti), l'altra tiranni malvagi (il Nemico). +1 continuo per proteggere membri dei Giusti o danneggiare agenti del Nemico. A fine sessione puoi cambiarle svuotando tutto il prestigio con la fazione che non ti ispira più. Scegli un ruolo: - Autorità: quando convinci un PNG a combattere per i Giusti o resistere al Nemico, tira su Vigore invece di Carisma. - Paladino: +1 danno al Nemico; -1 danno subito proteggendo i Giusti. - Emissario: prestigio extra con i Giusti, nomea extra con il Nemico. Risultati del tiro dell'Autorità (come Convincere un PNG): - 10+ (successo pieno): lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. - 7-9 (successo parziale): non del tutto: il GM ti dice cosa devi fare subito per persuaderlo. - 6- (fallimento): non lo convinci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-campione"]},{"id":"pb-campione-popolo","title":"Amico del Popolo","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Amico del Popolo"],"html":"<div class=\"move\"><p><strong>Quando la banda <a class=\"xl\" href=\"#viaggio-sentiero\" data-id=\"viaggio-sentiero\">viaggia sul sentiero</a> a passo tranquillo, tirate con +1 invece di -1.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: incontrate volti amici che offrono cibo: dimezzate il consumo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: dimezzate il consumo, ma chi incontrate è nei guai e si aspetta aiuto.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: un nemico deciso a porre fine alla tua \"rettitudine\" vi coglie impreparati.</li></ul></div>","text":"Quando la banda viaggia sul sentiero a passo tranquillo, tirate con +1 invece di -1. - 10+ (successo pieno): incontrate volti amici che offrono cibo: dimezzate il consumo. - 7-9 (successo parziale): dimezzate il consumo, ma chi incontrate è nei guai e si aspetta aiuto. - 6- (fallimento): un nemico deciso a porre fine alla tua \"rettitudine\" vi coglie impreparati.","back":["pb-campione"]},{"id":"pb-campione-abilita","title":"Muso a Muso","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Muso a Muso"],"html":"<p>Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> e ottieni <span class=\"res\">12+</span>, puoi incassare i suoi colpi per metterlo fuori gioco: subisci il suo danno pieno e riempi il suo tracciato di fatica o di ferite.</p>","text":"Quando lotti e ottieni 12+, puoi incassare i suoi colpi per metterlo fuori gioco: subisci il suo danno pieno e riempi il suo tracciato di fatica o di ferite.","back":["pb-campione"]},{"id":"pb-campione-causa","title":"Per una Giusta Causa","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Per una Giusta Causa"],"html":"<div class=\"move\"><p><strong>Quando minacci un'autorità in nome degli oppressi, segna nomea con la sua fazione e tira su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente; se attacca, tu e i tuoi alleati avete +1 continuo contro di loro.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: scopri che la tua causa non è così giusta.</li></ul></div>","text":"Quando minacci un'autorità in nome degli oppressi, segna nomea con la sua fazione e tira su Vigore. - 10+ (successo pieno): la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente; se attacca, tu e i tuoi alleati avete +1 continuo contro di loro. - 7-9 (successo parziale): la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente. - 6- (fallimento): scopri che la tua causa non è così giusta.","back":["pb-campione"]},{"id":"pb-campione-forza","title":"Forza Bruta","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Forza Bruta"],"html":"<p>Prendi Disarmare o Parare (fuori limite). Usandole puoi segnare fatica per tirare su <strong>Vigore</strong>.</p>","text":"Prendi Disarmare o Parare (fuori limite). Usandole puoi segnare fatica per tirare su Vigore.","back":["pb-campione"]},{"id":"pb-cronista","title":"Il Cronista","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.97-100","aliases":["Cronista","Chronicler"],"html":"<p><em>Un saggio custode di storia e testi proibiti, verità che i potenti vorrebbero dimenticate.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: Falsificare, Disattivare un Congegno, Borseggiare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lontra</li></ul><p><strong>Natura</strong></p><ul><li><em>Osservatore</em>: svuota la fatica quando entri in una situazione pericolosa per assistere a un evento segreto o incontrare qualcuno di importante.</li><li><em>Attivista</em>: svuota la fatica quando affronti pubblicamente i capi di una radura su cambiamenti che ritieni vitali.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Compagno (avete svelato un segreto di una fazione), Professionista (vede la verità del mondo).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cronista-libro\" data-id=\"pb-cronista-libro\">Il Valore di un Libro</a> + due tra <a class=\"xl\" href=\"#pb-cronista-occhio\" data-id=\"pb-cronista-occhio\">Occhio per le Storie</a>, <a class=\"xl\" href=\"#pb-cronista-archivi\" data-id=\"pb-cronista-archivi\">Spulciare i Registri</a>, <a class=\"xl\" href=\"#pb-cronista-sapiente\" data-id=\"pb-cronista-sapiente\">Sapiente</a>, <a class=\"xl\" href=\"#pb-cronista-consiglio\" data-id=\"pb-cronista-consiglio\">Un Buon Consiglio</a>, <a class=\"xl\" href=\"#pb-cronista-studioso\" data-id=\"pb-cronista-studioso\">Studioso</a>.</p>","text":"Un saggio custode di storia e testi proibiti, verità che i potenti vorrebbero dimenticate. - Caratteristiche: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro - Imprese: Falsificare, Disattivare un Congegno, Borseggiare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, lontra Natura - Osservatore: svuota la fatica quando entri in una situazione pericolosa per assistere a un evento segreto o incontrare qualcuno di importante. - Attivista: svuota la fatica quando affronti pubblicamente i capi di una radura su cambiamenti che ritieni vitali. Motivazioni: Giustizia, Scoperta, Ambizione, Zampe Pulite. Legami: Compagno (avete svelato un segreto di una fazione), Professionista (vede la verità del mondo). Mosse: inizi con Il Valore di un Libro + due tra Occhio per le Storie, Spulciare i Registri, Sapiente, Un Buon Consiglio, Studioso.","back":["playbook-indice"]},{"id":"pb-cronista-libro","title":"Il Valore di un Libro","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Il Valore di un Libro"],"html":"<p>Quando studi i tuoi tomi per trovare antiche tecniche contro un problema irrisolvibile (curare una malattia, porre fine a una siccità, deporre legalmente un capo), dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, informazioni, mentori o traduttori, strutture, limiti). Soddisfatte, ottieni la conoscenza cercata: sta a te usarla.</p>","text":"Quando studi i tuoi tomi per trovare antiche tecniche contro un problema irrisolvibile (curare una malattia, porre fine a una siccità, deporre legalmente un capo), dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, informazioni, mentori o traduttori, strutture, limiti). Soddisfatte, ottieni la conoscenza cercata: sta a te usarla.","back":["pb-cronista"]},{"id":"pb-cronista-occhio","title":"Occhio per le Storie","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Occhio per le Storie"],"html":"<p>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a>, segna fatica (anche con un fallimento) per individuare chi sa più di quanto dice: +1 continuo a convincerlo a confidarsi in privato.</p>","text":"Quando valuti una situazione tesa, segna fatica (anche con un fallimento) per individuare chi sa più di quanto dice: +1 continuo a convincerlo a confidarsi in privato.","back":["pb-cronista"]},{"id":"pb-cronista-archivi","title":"Spulciare i Registri","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Spulciare i Registri"],"html":"<div class=\"move\"><p><strong>Quando esamini documenti o appunti di un PNG importante, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle; la prossima volta che <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">cerchi di capirlo</a> prendi <span class=\"res\">12+</span> senza tirare.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: scopri che qualcuno agisce contro di te dove non te lo aspetti.</li></ul></div>","text":"Quando esamini documenti o appunti di un PNG importante, tira su Astuzia. - 10+ (successo pieno): scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle; la prossima volta che cerchi di capirlo prendi 12+ senza tirare. - 7-9 (successo parziale): scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle. - 6- (fallimento): scopri che qualcuno agisce contro di te dove non te lo aspetti.","back":["pb-cronista"]},{"id":"pb-cronista-sapiente","title":"Sapiente","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Sapiente"],"html":"<div class=\"move\"><p><strong>Quando consulti il tuo sapere per comprendere un conflitto politico, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il GM ti dice cosa ricordi che completa il quadro, e puoi fare una domanda in più.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il GM ti dice cosa ricordi che completa il quadro.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: qualcosa non torna con la storia: il GM ti dice cosa è cambiato radicalmente.</li></ul></div>","text":"Quando consulti il tuo sapere per comprendere un conflitto politico, tira su Astuzia. - 10+ (successo pieno): il GM ti dice cosa ricordi che completa il quadro, e puoi fare una domanda in più. - 7-9 (successo parziale): il GM ti dice cosa ricordi che completa il quadro. - 6- (fallimento): qualcosa non torna con la storia: il GM ti dice cosa è cambiato radicalmente.","back":["pb-cronista"]},{"id":"pb-cronista-consiglio","title":"Un Buon Consiglio","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Un Buon Consiglio"],"html":"<div class=\"move\"><p><strong>Quando offri a un PNG il miglior consiglio su una situazione spinosa, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ne vede la saggezza. Il PNG sceglie 1:<ul><li>segna fatica;</li><li>include il consiglio nei suoi piani.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma ti lasci sfuggire qualcosa dei tuoi piani o delle tue alleanze.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: lo offendi violando un'usanza locale.</li></ul></div>","text":"Quando offri a un PNG il miglior consiglio su una situazione spinosa, tira su Astuzia. - 10+ (successo pieno): ne vede la saggezza. Il PNG sceglie 1: - segna fatica; - include il consiglio nei suoi piani. - 7-9 (successo parziale): come sopra, ma ti lasci sfuggire qualcosa dei tuoi piani o delle tue alleanze. - 6- (fallimento): lo offendi violando un'usanza locale.","back":["pb-cronista"]},{"id":"pb-cronista-studioso","title":"Studioso","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Studioso"],"html":"<p>Una casella extra di fatica. Quando acquisisci un nuovo tomo o rotolo sulla storia dei Boschi, svuota tutta la fatica.</p>","text":"Una casella extra di fatica. Quando acquisisci un nuovo tomo o rotolo sulla storia dei Boschi, svuota tutta la fatica.","back":["pb-cronista"]},{"id":"pb-emissario","title":"L'Ambasciatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.105-108","aliases":["Ambasciatore","Envoy"],"html":"<p><em>Un rappresentante professionista: parla per altri poteri mantenendo una plausibile estraneità.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia +1, Destrezza 0, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro Rapido</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, pipistrello</li></ul><p><strong>Natura</strong></p><ul><li><em>Agente</em>: svuota la fatica quando convinci qualcuno di influente a permetterti di rappresentare i suoi interessi.</li><li><em>Fidato</em>: svuota la fatica quando ti impegni pubblicamente a risolvere un conflitto pericoloso nell'interesse di qualcuno di vulnerabile.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Sentinella (somiglia a un potente politico), Professionista (avete negoziato una tregua).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-emissario-diplomatico\" data-id=\"pb-emissario-diplomatico\">Diplomatico</a> + due tra <a class=\"xl\" href=\"#pb-emissario-incontro\" data-id=\"pb-emissario-incontro\">Che Sorpresa Incontrarti Qui</a>, <a class=\"xl\" href=\"#pb-emissario-voltagabbana\" data-id=\"pb-emissario-voltagabbana\">Voltagabbana</a>, <a class=\"xl\" href=\"#pb-emissario-trame\" data-id=\"pb-emissario-trame\">Piani e Complotti</a>, <a class=\"xl\" href=\"#pb-emissario-fiducia\" data-id=\"pb-emissario-fiducia\">Fidati di Me</a>, <a class=\"xl\" href=\"#pb-emissario-anello\" data-id=\"pb-emissario-anello\">Il Bacio dell'Anello</a>.</p>","text":"Un rappresentante professionista: parla per altri poteri mantenendo una plausibile estraneità. - Caratteristiche: Carisma 0, Astuzia +1, Destrezza 0, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro Rapido - Imprese: Nascondersi, Sgattaiolare, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, pipistrello Natura - Agente: svuota la fatica quando convinci qualcuno di influente a permetterti di rappresentare i suoi interessi. - Fidato: svuota la fatica quando ti impegni pubblicamente a risolvere un conflitto pericoloso nell'interesse di qualcuno di vulnerabile. Motivazioni: Lealtà, Avidità, Ambizione, Zampe Pulite. Legami: Sentinella (somiglia a un potente politico), Professionista (avete negoziato una tregua). Mosse: inizi con Diplomatico + due tra Che Sorpresa Incontrarti Qui, Voltagabbana, Piani e Complotti, Fidati di Me, Il Bacio dell'Anello.","back":["playbook-indice"]},{"id":"pb-emissario-diplomatico","title":"Diplomatico","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Diplomatico"],"html":"<p>Hai un tracciato <strong>Diplomatico</strong> (parte da +1, tra 0 e +3): sale quando la tua Reputazione con una fazione sale e scende quando scende.</p><ul><li>Segna fatica per usare Diplomatico quando <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">chiedi un favore</a> o <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a>, con qualunque fazione.</li><li>Quando convinci o cerchi di capire un PNG importante agendo per conto di altri (non tuo né della banda), tira su Diplomatico invece di Carisma.</li></ul><p>Risultati quando tiri su Diplomatico:</p><ul><li><strong>Chiedere un favore</strong>:<ul><li><strong><span class=\"res\">10+</span></strong>: vieni accontentato;</li><li><strong><span class=\"res\">7-9</span></strong>: vieni accontentato, ma svuoti il prestigio oppure segni nomea;</li><li><strong><span class=\"res\">6-</span></strong>: non vieni accontentato e sei visto con sospetto (segna nomea).</li></ul></li><li><strong>Incontrare qualcuno di importante</strong>:<ul><li><strong><span class=\"res\">10+</span></strong>: conoscete le rispettive reputazioni ed entrambe le opzioni;</li><li><strong><span class=\"res\">7-9</span></strong>: conoscete le reputazioni, 1 opzione;</li><li><strong><span class=\"res\">6-</span></strong>: conosci solo l'essenziale, lui conosce le tue storie.</li></ul></li><li><strong>Convincere</strong>:<ul><li><strong><span class=\"res\">10+</span></strong>: lo convinci con una valida ragione o una mazzetta;</li><li><strong><span class=\"res\">7-9</span></strong>: il GM ti dice cosa devi fare subito per persuaderlo;</li><li><strong><span class=\"res\">6-</span></strong>: non lo convinci, la situazione si complica.</li></ul></li><li><strong>Capire le intenzioni</strong>:<ul><li><strong><span class=\"res\">10+</span></strong>: 3 prese;</li><li><strong><span class=\"res\">7-9</span></strong>: 1 presa;</li><li><strong><span class=\"res\">6-</span></strong>: nessuna presa, la situazione si complica.</li></ul></li></ul>","text":"Hai un tracciato Diplomatico (parte da +1, tra 0 e +3): sale quando la tua Reputazione con una fazione sale e scende quando scende. - Segna fatica per usare Diplomatico quando chiedi un favore o incontri qualcuno di importante, con qualunque fazione. - Quando convinci o cerchi di capire un PNG importante agendo per conto di altri (non tuo né della banda), tira su Diplomatico invece di Carisma. Risultati quando tiri su Diplomatico: - Chiedere un favore: - 10+: vieni accontentato; - 7-9: vieni accontentato, ma svuoti il prestigio oppure segni nomea; - 6-: non vieni accontentato e sei visto con sospetto (segna nomea). - Incontrare qualcuno di importante: - 10+: conoscete le rispettive reputazioni ed entrambe le opzioni; - 7-9: conoscete le reputazioni, 1 opzione; - 6-: conosci solo l'essenziale, lui conosce le tue storie. - Convincere: - 10+: lo convinci con una valida ragione o una mazzetta; - 7-9: il GM ti dice cosa devi fare subito per persuaderlo; - 6-: non lo convinci, la situazione si complica. - Capire le intenzioni: - 10+: 3 prese; - 7-9: 1 presa; - 6-: nessuna presa, la situazione si complica.","back":["pb-emissario"]},{"id":"pb-emissario-incontro","title":"Che Sorpresa Incontrarti Qui","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Che Sorpresa Incontrarti Qui"],"html":"<div class=\"move\"><p><strong>Quando fai baldoria in un locale frequentato, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: incontri un tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete). Scegli 1:<ul><li>si lascia sfuggire un segreto sui piani della fazione;</li><li>si offre di presentarti ai capi.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: incontri il tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: ti trova prima chi ti cerca.</li></ul></div>","text":"Quando fai baldoria in un locale frequentato, tira su Fortuna. - 10+ (successo pieno): incontri un tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete). Scegli 1: - si lascia sfuggire un segreto sui piani della fazione; - si offre di presentarti ai capi. - 7-9 (successo parziale): incontri il tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete). - 6- (fallimento): ti trova prima chi ti cerca.","back":["pb-emissario"]},{"id":"pb-emissario-voltagabbana","title":"Voltagabbana","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Voltagabbana"],"html":"<p>Ottieni <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> e <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando attacchi alle spalle chi si fida di te, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Attaccare alle Spalle e Falsificare (fuori limite). Quando attacchi alle spalle chi si fida di te, tira su Astuzia. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-emissario"]},{"id":"pb-emissario-trame","title":"Piani e Complotti","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Piani e Complotti"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-emissario"]},{"id":"pb-emissario-fiducia","title":"Fidati di Me","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Fidati di Me"],"html":"<div class=\"move\"><p><strong>Quando calmi un PNG furioso, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: placa la sua rabbia; scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: placa la sua rabbia; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: puoi calmarlo solo dirottando la sua frustrazione su qualcos'altro.</li></ul><p>Opzioni:</p><ul><li>rivela una vulnerabilità inattesa;</li><li>esita e crei un'opportunità;</li><li>ti concede più fiducia.</li></ul></div>","text":"Quando calmi un PNG furioso, tira su Astuzia. - 10+ (successo pieno): placa la sua rabbia; scegli 2 opzioni. - 7-9 (successo parziale): placa la sua rabbia; scegli 1 opzione. - 6- (fallimento): puoi calmarlo solo dirottando la sua frustrazione su qualcos'altro. Opzioni: - rivela una vulnerabilità inattesa; - esita e crei un'opportunità; - ti concede più fiducia.","back":["pb-emissario"]},{"id":"pb-emissario-anello","title":"Il Bacio dell'Anello","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Il Bacio dell'Anello"],"html":"<div class=\"move\"><p><strong>Uscendo da un incontro con qualcuno di ricco o potente, dichiara di avergli preso qualcosa e tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il GM ti dice cosa hai preso.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il GM ti dice cosa hai preso, ma se ne accorgeranno dopo: segna nomea.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: se ne accorgono subito: segna 2-nomea. Scegli:<ul><li>scappi;</li><li>trovi una scusa.</li></ul></li></ul></div>","text":"Uscendo da un incontro con qualcuno di ricco o potente, dichiara di avergli preso qualcosa e tira su Astuzia. - 10+ (successo pieno): il GM ti dice cosa hai preso. - 7-9 (successo parziale): il GM ti dice cosa hai preso, ma se ne accorgeranno dopo: segna nomea. - 6- (fallimento): se ne accorgono subito: segna 2-nomea. Scegli: - scappi; - trovi una scusa.","back":["pb-emissario"]},{"id":"pb-esule","title":"L'Esule","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.101-104","aliases":["Esule","Exile"],"html":"<p><em>Un tempo membro di spicco di una fazione potente, ora ne sei esiliato.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Sgattaiolare</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lucertola</li><li><strong>Passato</strong>: la fazione che ti ha esiliato parte da Reputazione -2; quella che ora vuole la tua lealtà parte da +1</li></ul><p><strong>Natura</strong></p><ul><li><em>Cospiratore</em>: svuota la fatica quando prometti risorse preziose a una figura pericolosa per ottenerne l'aiuto.</li><li><em>Vendicatore</em>: svuota la fatica quando attacchi apertamente chi ha fatto un torto a te o ai tuoi protetti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Protettore (vedi grandezza in lui), Familiare (ti ha accolto nei primi giorni d'esilio).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-esule-conosciuto\" data-id=\"pb-esule-conosciuto\">Conosciuto da Tutti</a> + due tra <a class=\"xl\" href=\"#pb-esule-sopra\" data-id=\"pb-esule-sopra\">Superiore</a>, <a class=\"xl\" href=\"#pb-esule-porto\" data-id=\"pb-esule-porto\">Ecco a Voi...</a>, <a class=\"xl\" href=\"#pb-esule-grande\" data-id=\"pb-esule-grande\">Il Migliore</a>, <a class=\"xl\" href=\"#pb-esule-re\" data-id=\"pb-esule-re\">Nato per Regnare</a>, <a class=\"xl\" href=\"#pb-esule-carta\" data-id=\"pb-esule-carta\">Documenti Falsi</a>.</p>","text":"Un tempo membro di spicco di una fazione potente, ora ne sei esiliato. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +1, Vigore +1 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele - Imprese: Sgattaiolare - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, lucertola - Passato: la fazione che ti ha esiliato parte da Reputazione -2; quella che ora vuole la tua lealtà parte da +1 Natura - Cospiratore: svuota la fatica quando prometti risorse preziose a una figura pericolosa per ottenerne l'aiuto. - Vendicatore: svuota la fatica quando attacchi apertamente chi ha fatto un torto a te o ai tuoi protetti. Motivazioni: Lealtà, Vendetta, Caos, Infamia. Legami: Protettore (vedi grandezza in lui), Familiare (ti ha accolto nei primi giorni d'esilio). Mosse: inizi con Conosciuto da Tutti + due tra Superiore, Ecco a Voi..., Il Migliore, Nato per Regnare, Documenti Falsi.","back":["playbook-indice"]},{"id":"pb-esule-conosciuto","title":"Conosciuto da Tutti","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Conosciuto da Tutti"],"html":"<div class=\"move\"><p><strong>Quando incontri per la prima volta un PNG importante della tua ex fazione, puoi dichiararlo un vecchio alleato: segna un'opzione libera e tira (invece di <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a>) con il bonus della relazione:</strong></p><ul><li>reti politiche condivise: +1;</li><li>avete lavorato insieme per anni: +2;</li><li>amico leale o servitore: +3.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: è ancora leale e ti aiuta rischiando.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: può aiutarti solo fingendo di essere costretto: segna tanta nomea quanto il bonus.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: mostri la tua disperazione: segna nomea pari al bonus, e i tuoi cacciatori arriveranno presto.</li></ul></div><p>Quando hai segnato tutte e tre le opzioni, svuotale: ti si presenta un'occasione di riscatto.</p>","text":"Quando incontri per la prima volta un PNG importante della tua ex fazione, puoi dichiararlo un vecchio alleato: segna un'opzione libera e tira (invece di Incontrare Qualcuno di Importante) con il bonus della relazione: - reti politiche condivise: +1; - avete lavorato insieme per anni: +2; - amico leale o servitore: +3. Risultati: - 10+ (successo pieno): è ancora leale e ti aiuta rischiando. - 7-9 (successo parziale): può aiutarti solo fingendo di essere costretto: segna tanta nomea quanto il bonus. - 6- (fallimento): mostri la tua disperazione: segna nomea pari al bonus, e i tuoi cacciatori arriveranno presto. Quando hai segnato tutte e tre le opzioni, svuotale: ti si presenta un'occasione di riscatto.","back":["pb-esule"]},{"id":"pb-esule-sopra","title":"Superiore","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Superiore"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni un PNG</a> fingendoti un alto ufficiale di una fazione per ottenere accesso o informazioni, tira su Carisma invece di Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: abbocca e fa ciò che vuoi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: abbocca, oppure il GM sceglie 1 reazione:<ul><li>esita (spesso danno al morale);</li><li>commette un passo falso: ti si presenta un'opportunità;</li><li>reagisce in modo esagerato: +1 al prossimo tiro contro di lui.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci casca; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando inganni un PNG fingendoti un alto ufficiale di una fazione per ottenere accesso o informazioni, tira su Carisma invece di Astuzia. - 10+ (successo pieno): abbocca e fa ciò che vuoi. - 7-9 (successo parziale): abbocca, oppure il GM sceglie 1 reazione: - esita (spesso danno al morale); - commette un passo falso: ti si presenta un'opportunità; - reagisce in modo esagerato: +1 al prossimo tiro contro di lui. - 6- (fallimento): non ci casca; il GM ti dice cosa succede e la situazione si complica.","back":["pb-esule"]},{"id":"pb-esule-porto","title":"Ecco a Voi...","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Ecco a Voi"],"html":"<p>Parlando con gli abitanti di una radura, segna fatica per scoprire quale risorsa vitale o fuggitivo cercano i potenti. Quando consegni una risorsa vitale o un prigioniero a una fazione, oltre al prestigio puoi <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">chiedere un favore</a> come con <span class=\"res\">12+</span>; con Reputazione +2 o più puoi invece <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> il PNG che ne ha beneficiato come con <span class=\"res\">12+</span>.</p>","text":"Parlando con gli abitanti di una radura, segna fatica per scoprire quale risorsa vitale o fuggitivo cercano i potenti. Quando consegni una risorsa vitale o un prigioniero a una fazione, oltre al prestigio puoi chiedere un favore come con 12+; con Reputazione +2 o più puoi invece Influenzare un PNG il PNG che ne ha beneficiato come con 12+.","back":["pb-esule"]},{"id":"pb-esule-grande","title":"Il Migliore","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Il Migliore"],"html":"<p>Quando <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attacchi in mischia</a> e ottieni <span class=\"res\">12+</span>, prendi tutte e quattro le opzioni e una con effetto doppio.</p>","text":"Quando attacchi in mischia e ottieni 12+, prendi tutte e quattro le opzioni e una con effetto doppio.","back":["pb-esule"]},{"id":"pb-esule-re","title":"Nato per Regnare","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Nato per Regnare"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-esule"]},{"id":"pb-esule-carta","title":"Documenti Falsi","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Documenti Falsi"],"html":"<p>Ottieni <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite). Quando falsifichi documenti sfruttando la conoscenza delle procedure della tua ex fazione, segna nomea con essa per ottenere <span class=\"res\">12+</span> senza tirare.</p>","text":"Ottieni Falsificare (fuori limite). Quando falsifichi documenti sfruttando la conoscenza delle procedure della tua ex fazione, segna nomea con essa per ottenere 12+ senza tirare.","back":["pb-esule"]},{"id":"pb-eretico","title":"L'Eretico","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.109-112","aliases":["Eretico","Heretic"],"html":"<p><em>Un fervente sostenitore di una causa che i più trovano inaccettabile.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia 0, Destrezza -1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Tiro Rapido, Assaltare un Gruppo</li><li><strong>Imprese</strong>: Falsificare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Passato</strong>: scegli 2 dogmi della tua causa; la fazione che odia la tua causa parte da Reputazione -1, quella che le dà rifugio da +1</li></ul><p><strong>Natura</strong></p><ul><li><em>Credente</em>: svuota la fatica quando denunci pubblicamente un simbolo o un'autorità di credenze opposte alle tue.</li><li><em>Paciere</em>: svuota la fatica quando cerchi di avviare un dialogo tra due nemici di fazioni diverse.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>.</p><p><strong>Legami</strong>: Protettore (condivide le tue idee), Sentinella (è stato ferito da qualcuno della tua causa).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-eretico-amici\" data-id=\"pb-eretico-amici\">Amici per Davvero</a> e <a class=\"xl\" href=\"#pb-eretico-ascoltami\" data-id=\"pb-eretico-ascoltami\">Udite!</a> + una tra <a class=\"xl\" href=\"#pb-eretico-bellezza\" data-id=\"pb-eretico-bellezza\">Iconoclasta</a>, <a class=\"xl\" href=\"#pb-eretico-fascino\" data-id=\"pb-eretico-fascino\">Fascino Diabolico</a>, <a class=\"xl\" href=\"#pb-eretico-universo\" data-id=\"pb-eretico-universo\">Il Centro dell'Universo</a>, <a class=\"xl\" href=\"#pb-eretico-passare\" data-id=\"pb-eretico-passare\">Tu Non Puoi Passare</a>.</p>","text":"Un fervente sostenitore di una causa che i più trovano inaccettabile. - Caratteristiche: Carisma +2, Astuzia 0, Destrezza -1, Fortuna +1, Vigore 0 - Abilità iniziale: Fracassare, Disarmare, Tiro Rapido, Assaltare un Gruppo - Imprese: Falsificare, Gioco di Prestigio - Valore iniziale: 9 - Passato: scegli 2 dogmi della tua causa; la fazione che odia la tua causa parte da Reputazione -1, quella che le dà rifugio da +1 Natura - Credente: svuota la fatica quando denunci pubblicamente un simbolo o un'autorità di credenze opposte alle tue. - Paciere: svuota la fatica quando cerchi di avviare un dialogo tra due nemici di fazioni diverse. Motivazioni: Princìpi, Protezione, Libertà, Caos. Legami: Protettore (condivide le tue idee), Sentinella (è stato ferito da qualcuno della tua causa). Mosse: inizi con Amici per Davvero e Udite! + una tra Iconoclasta, Fascino Diabolico, Il Centro dell'Universo, Tu Non Puoi Passare.","back":["playbook-indice"]},{"id":"pb-eretico-amici","title":"Amici per Davvero","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Amici per Davvero"],"html":"<div class=\"move\"><p><strong>Quando, arrivato in una radura, cerchi chi condivide la tua causa, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ne trovi uno o due che offrono ciò che possono.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: li trovi, ma ti parlano anche di una minaccia alla vostra ideologia nella radura.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: ti scopre qualcuno che disprezza quelli come te.</li></ul></div>","text":"Quando, arrivato in una radura, cerchi chi condivide la tua causa, tira su Carisma. - 10+ (successo pieno): ne trovi uno o due che offrono ciò che possono. - 7-9 (successo parziale): li trovi, ma ti parlano anche di una minaccia alla vostra ideologia nella radura. - 6- (fallimento): ti scopre qualcuno che disprezza quelli come te.","back":["pb-eretico"]},{"id":"pb-eretico-ascoltami","title":"Udite!","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Udite"],"html":"<div class=\"move\"><p><strong>Quando tieni un discorso infiammato a una folla convincibile per la tua causa, segna fatica e tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: la smuovi; scegli 2 azioni che compie.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la smuovi e scegli 2 azioni, ma devi metterti alla loro mercé e guidarli di persona.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: agiscono ignorandoti, con conseguenze terribili.</li></ul><p>Azioni:</p><ul><li>abbattono un simbolo avversario;</li><li>rovesciano un tiranno vulnerabile;</li><li>distruggono le vestigia della tradizione;</li><li>innalzano qualcuno di trascurato;</li><li>fanno giustizia dei malvagi.</li></ul></div>","text":"Quando tieni un discorso infiammato a una folla convincibile per la tua causa, segna fatica e tira su Carisma. - 10+ (successo pieno): la smuovi; scegli 2 azioni che compie. - 7-9 (successo parziale): la smuovi e scegli 2 azioni, ma devi metterti alla loro mercé e guidarli di persona. - 6- (fallimento): agiscono ignorandoti, con conseguenze terribili. Azioni: - abbattono un simbolo avversario; - rovesciano un tiranno vulnerabile; - distruggono le vestigia della tradizione; - innalzano qualcuno di trascurato; - fanno giustizia dei malvagi.","back":["pb-eretico"]},{"id":"pb-eretico-bellezza","title":"Iconoclasta","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Iconoclasta"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi</a> un falso idolo o un simbolo d'oppressione insieme ai tuoi alleati, tira su Carisma invece di Vigore; tu e i tuoi alleati svuotate 1-fatica, anche con un fallimento.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo danneggi, ma il GM sceglie 1:<ul><li>causi un danno collaterale;</li><li>attiri l'attenzione;</li><li>ti cacci in una brutta situazione.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando distruggi un falso idolo o un simbolo d'oppressione insieme ai tuoi alleati, tira su Carisma invece di Vigore; tu e i tuoi alleati svuotate 1-fatica, anche con un fallimento. - 10+ (successo pieno): danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato. - 7-9 (successo parziale): lo danneggi, ma il GM sceglie 1: - causi un danno collaterale; - attiri l'attenzione; - ti cacci in una brutta situazione. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-eretico"]},{"id":"pb-eretico-fascino","title":"Fascino Diabolico","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Fascino Diabolico"],"html":"<p>Quando inganni un PNG che hai già aiutato o impressionato, segna fatica per ottenere <span class=\"res\">12+</span> senza tirare.</p>","text":"Quando inganni un PNG che hai già aiutato o impressionato, segna fatica per ottenere 12+ senza tirare.","back":["pb-eretico"]},{"id":"pb-eretico-universo","title":"Il Centro dell'Universo","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Il Centro dell'Universo"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-eretico"]},{"id":"pb-eretico-passare","title":"Tu Non Puoi Passare","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Tu Non Puoi Passare"],"html":"<div class=\"move\"><p><strong>Quando ti pianti sulla strada dei nemici, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: non possono superarti finché non ti abbattono; scegli 1 conseguenza.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: non possono superarti finché non ti abbattono; scegli 2 conseguenze.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: trovano un'altra via che peggiora molto la situazione.</li></ul><p>Conseguenze:</p><ul><li>subisci +1 danno da ogni attacco;</li><li>un nemico (scelto dal GM) ti supera;</li><li>non puoi ritirarti.</li></ul></div>","text":"Quando ti pianti sulla strada dei nemici, tira su Carisma. - 10+ (successo pieno): non possono superarti finché non ti abbattono; scegli 1 conseguenza. - 7-9 (successo parziale): non possono superarti finché non ti abbattono; scegli 2 conseguenze. - 6- (fallimento): trovano un'altra via che peggiora molto la situazione. Conseguenze: - subisci +1 danno da ogni attacco; - un nemico (scelto dal GM) ti supera; - non puoi ritirarti.","back":["pb-eretico"]},{"id":"pb-pirata","title":"Il Pirata","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.113-116","aliases":["Pirata","Pirate"],"html":"<p><em>Un capitano canaglia a casa sui fiumi e sui laghi, libero dalla vita di terra.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia 0, Destrezza 0, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Parare, Assaltare un Gruppo, Tiro da Maestro, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Attaccare alle Spalle, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, ratto</li></ul><p><strong>Natura</strong></p><ul><li><em>Furfante</em>: svuota la fatica quando tenti di tradire (doppiogioco, triplo gioco) un PNG potente o pericoloso.</li><li><em>Mercante</em>: svuota la fatica quando porti merci o tesori preziosi oltre un pericolo o un blocco.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Compagno (avete rubato un carico a una fazione), Familiare (era amico del tuo vecchio capitano).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-pirata-nave\" data-id=\"pb-pirata-nave\">Nave Pirata</a> e <a class=\"xl\" href=\"#pb-pirata-salpare\" data-id=\"pb-pirata-salpare\">Solcare le Acque</a> + una tra <a class=\"xl\" href=\"#pb-pirata-spadaccino\" data-id=\"pb-pirata-spadaccino\">Spadaccino</a>, <a class=\"xl\" href=\"#pb-pirata-tesoro\" data-id=\"pb-pirata-tesoro\">In Cerca di Bottino</a>, <a class=\"xl\" href=\"#pb-pirata-rum\" data-id=\"pb-pirata-rum\">Un Bicchiere di Rum?</a>, <a class=\"xl\" href=\"#pb-pirata-gambe\" data-id=\"pb-pirata-gambe\">Zampe da Marinaio</a>.</p>","text":"Un capitano canaglia a casa sui fiumi e sui laghi, libero dalla vita di terra. - Caratteristiche: Carisma +1, Astuzia 0, Destrezza 0, Fortuna +1, Vigore 0 - Abilità iniziale: Parare, Assaltare un Gruppo, Tiro da Maestro, Colpo Crudele - Imprese: Acrobazie, Attaccare alle Spalle, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, ratto Natura - Furfante: svuota la fatica quando tenti di tradire (doppiogioco, triplo gioco) un PNG potente o pericoloso. - Mercante: svuota la fatica quando porti merci o tesori preziosi oltre un pericolo o un blocco. Motivazioni: Libertà, Vendetta, Crimine, Infamia. Legami: Compagno (avete rubato un carico a una fazione), Familiare (era amico del tuo vecchio capitano). Mosse: inizi con Nave Pirata e Solcare le Acque + una tra Spadaccino, In Cerca di Bottino, Un Bicchiere di Rum?, Zampe da Marinaio.","back":["playbook-indice"]},{"id":"pb-pirata-nave","title":"Nave Pirata","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Nave Pirata"],"html":"<p>La tua nave (dalle un nome) ha 4 caselle di usura (segnale con danni seri o quando una mossa lo chiede). Piena: è ferma e va riparata in porto; se devi segnarne ancora, la perdi (il GM può offrirti l'occasione di averne un'altra).</p><p><strong>Pregi</strong> (scegline 2):</p><ul><li><em>Fornita</em>: tracciato consumo di 2 caselle per il carico;</li><li><em>Agile</em>: +1 continuo a ingannare sfruttando la velocità;</li><li><em>Famosa</em>: +1 Reputazione con una fazione finché sei a bordo;</li><li><em>Manovrabile</em>: una volta per sessione, segna usura per seminare qualsiasi inseguitore in acqua.</li></ul><p><strong>Difetti</strong> (scegline 2):</p><ul><li><em>Famigerata</em>: -1 Reputazione con una fazione finché sei a bordo;</li><li><em>Sgangherata</em>: 1 usura in meno;</li><li><em>Goffa</em>: -1 ad affidarti al fato pilotando con cautela;</li><li><em>Rubata</em>: qualcuno di pericoloso la rivuole.</li></ul>","text":"La tua nave (dalle un nome) ha 4 caselle di usura (segnale con danni seri o quando una mossa lo chiede). Piena: è ferma e va riparata in porto; se devi segnarne ancora, la perdi (il GM può offrirti l'occasione di averne un'altra). Pregi (scegline 2): - Fornita: tracciato consumo di 2 caselle per il carico; - Agile: +1 continuo a ingannare sfruttando la velocità; - Famosa: +1 Reputazione con una fazione finché sei a bordo; - Manovrabile: una volta per sessione, segna usura per seminare qualsiasi inseguitore in acqua. Difetti (scegline 2): - Famigerata: -1 Reputazione con una fazione finché sei a bordo; - Sgangherata: 1 usura in meno; - Goffa: -1 ad affidarti al fato pilotando con cautela; - Rubata: qualcuno di pericoloso la rivuole.","back":["pb-pirata"]},{"id":"pb-pirata-salpare","title":"Solcare le Acque","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Solcare le Acque"],"html":"<div class=\"move\"><p><strong>Quando viaggi da una radura all'altra in nave, segna usura sulla nave e tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi il porto e il GM ti indica un abitante (quasi) amico che conosci lì.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi il porto, ma l'abitante che conosci ti porta rancore. Scegli:<ul><li>risolvi la questione;</li><li>gli offri almeno 2-Valore.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: finisci in una situazione pericolosa lungo la rotta.</li></ul></div>","text":"Quando viaggi da una radura all'altra in nave, segna usura sulla nave e tira su Fortuna. - 10+ (successo pieno): raggiungi il porto e il GM ti indica un abitante (quasi) amico che conosci lì. - 7-9 (successo parziale): raggiungi il porto, ma l'abitante che conosci ti porta rancore. Scegli: - risolvi la questione; - gli offri almeno 2-Valore. - 6- (fallimento): finisci in una situazione pericolosa lungo la rotta.","back":["viaggio-indice","pb-pirata"]},{"id":"pb-pirata-spadaccino","title":"Spadaccino","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Spadaccino"],"html":"<div class=\"move\"><p><strong>Quando ti getti per la prima volta in battaglia oscillando, tuffandoti o saltando per ingaggiare un nemico in mischia a distanza ravvicinata, tira su Fortuna invece di Vigore</strong> (per <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>).</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 3 opzioni di <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando ti getti per la prima volta in battaglia oscillando, tuffandoti o saltando per ingaggiare un nemico in mischia a distanza ravvicinata, tira su Fortuna invece di Vigore (per Attaccare in Mischia). - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni di Attaccare in Mischia. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["pb-pirata"]},{"id":"pb-pirata-tesoro","title":"In Cerca di Bottino","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["In Cerca di Bottino"],"html":"<div class=\"move\"><p><strong>Quando chiedi in giro per un porto di commerci preziosi, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scopri un carico vicino che vale la pena, e sai esattamente dov'è o come intercettarlo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scopri un carico vicino che vale la pena.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: senti solo di carichi ben sorvegliati, e le tue domande attirano attenzione.</li></ul></div>","text":"Quando chiedi in giro per un porto di commerci preziosi, tira su Fortuna. - 10+ (successo pieno): scopri un carico vicino che vale la pena, e sai esattamente dov'è o come intercettarlo. - 7-9 (successo parziale): scopri un carico vicino che vale la pena. - 6- (fallimento): senti solo di carichi ben sorvegliati, e le tue domande attirano attenzione.","back":["pb-pirata"]},{"id":"pb-pirata-rum","title":"Un Bicchiere di Rum?","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Un Bicchiere di Rum"],"html":"<p>Una volta per sessione puoi <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a> un vagabondo una seconda volta condividendo il tuo rum (segna consumo).</p>","text":"Una volta per sessione puoi Supplicare un PG un vagabondo una seconda volta condividendo il tuo rum (segna consumo).","back":["pb-pirata"]},{"id":"pb-pirata-gambe","title":"Zampe da Marinaio","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Zampe da Marinaio"],"html":"<div class=\"move\"><p><strong>A bordo di una nave, quando tenti di <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">attaccare alle spalle</a>, <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>, <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">nasconderti</a> o fare <a class=\"xl\" href=\"#acrobazie\" data-id=\"acrobazie\">Acrobazie</a>, tira su Fortuna invece di Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"A bordo di una nave, quando tenti di attaccare alle spalle, Sgattaiolare, nasconderti o fare Acrobazie, tira su Fortuna invece di Destrezza. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-pirata"]},{"id":"pb-principe","title":"L'Erede","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.117-120","aliases":["Erede","Prince"],"html":"<p><em>Un vagabondo di seconda generazione, erede delle abilità dei genitori vagabondi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Incalzare, Parare</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare + due a scelta</li><li><strong>Valore iniziale</strong>: 7</li></ul><ul><li><strong>Passato</strong>: perché i tuoi genitori ti hanno cresciuto come vagabondo e cosa è capitato loro</li></ul><p><stro
