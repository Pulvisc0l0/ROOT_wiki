aos, Infamia. Legami: Protettore (vedi grandezza in lui), Familiare (ti ha accolto nei primi giorni d'esilio). Mosse: inizi con Conosciuto da Tutti + due tra Superiore, Ecco a Voi..., Il Migliore, Nato per Regnare, Documenti Falsi.","back":["playbook-indice"]},{"id":"pb-esule-conosciuto","title":"Conosciuto da Tutti","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Conosciuto da Tutti"],"html":"<p>Quando incontri per la prima volta un PNG importante della tua ex fazione, puoi dichiararlo un vecchio alleato: segna un'opzione libera invece di <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a> e tira con: reti politiche condivise (+1), avete lavorato insieme per anni (+2), amico leale o servitore (+3). Con un successo è ancora leale e ti aiuta rischiando. Con <span class=\"res\">7-9</span> può aiutarti solo fingendo di essere costretto: segna tanta nomea quanto il bonus. Con un fallimento mostri la tua disperazione: segna nomea pari al bonus, e i tuoi cacciatori arriveranno presto. Segnate tutte e tre, svuotale: ti si presenta un'occasione di riscatto.</p>","text":"Quando incontri per la prima volta un PNG importante della tua ex fazione, puoi dichiararlo un vecchio alleato: segna un'opzione libera invece di Incontrare Qualcuno di Importante e tira con: reti politiche condivise (+1), avete lavorato insieme per anni (+2), amico leale o servitore (+3). Con un successo è ancora leale e ti aiuta rischiando. Con 7-9 può aiutarti solo fingendo di essere costretto: segna tanta nomea quanto il bonus. Con un fallimento mostri la tua disperazione: segna nomea pari al bonus, e i tuoi cacciatori arriveranno presto. Segnate tutte e tre, svuotale: ti si presenta un'occasione di riscatto.","back":["pb-esule"]},{"id":"pb-esule-sopra","title":"Superiore","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Superiore"],"html":"<p>Quando inganni un PNG fingendoti un alto ufficiale di una fazione per ottenere accesso o informazioni, tira su <strong>Carisma</strong> invece di Astuzia.</p>","text":"Quando inganni un PNG fingendoti un alto ufficiale di una fazione per ottenere accesso o informazioni, tira su Carisma invece di Astuzia.","back":["pb-esule"]},{"id":"pb-esule-porto","title":"Ecco a Voi...","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Ecco a Voi"],"html":"<p>Parlando con gli abitanti di una radura, segna fatica per scoprire quale risorsa vitale o fuggitivo cercano i potenti. Quando consegni una risorsa vitale o un prigioniero a una fazione, oltre al prestigio puoi <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">chiedere un favore</a> come con <span class=\"res\">12+</span>; con Reputazione +2 o più puoi invece <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> il PNG che ne ha beneficiato come con <span class=\"res\">12+</span>.</p>","text":"Parlando con gli abitanti di una radura, segna fatica per scoprire quale risorsa vitale o fuggitivo cercano i potenti. Quando consegni una risorsa vitale o un prigioniero a una fazione, oltre al prestigio puoi chiedere un favore come con 12+; con Reputazione +2 o più puoi invece Influenzare un PNG il PNG che ne ha beneficiato come con 12+.","back":["pb-esule"]},{"id":"pb-esule-grande","title":"Il Migliore","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Il Migliore"],"html":"<p>Quando <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attacchi in mischia</a> e ottieni <span class=\"res\">12+</span>, prendi tutte e quattro le opzioni e una con effetto doppio.</p>","text":"Quando attacchi in mischia e ottieni 12+, prendi tutte e quattro le opzioni e una con effetto doppio.","back":["pb-esule"]},{"id":"pb-esule-re","title":"Nato per Regnare","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Nato per Regnare"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-esule"]},{"id":"pb-esule-carta","title":"Documenti Falsi","cat":"mosse","group":"Esule","src":"VF p.102","aliases":["Documenti Falsi"],"html":"<p>Ottieni <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite). Quando falsifichi documenti sfruttando la conoscenza delle procedure della tua ex fazione, segna nomea con essa per ottenere <span class=\"res\">12+</span> senza tirare.</p>","text":"Ottieni Falsificare (fuori limite). Quando falsifichi documenti sfruttando la conoscenza delle procedure della tua ex fazione, segna nomea con essa per ottenere 12+ senza tirare.","back":["pb-esule"]},{"id":"pb-eretico","title":"L'Eretico","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.109-112","aliases":["Eretico","Heretic"],"html":"<p><em>Un fervente sostenitore di una causa che i più trovano inaccettabile.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia 0, Destrezza -1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Tiro Rapido, Assaltare un Gruppo</li><li><strong>Imprese</strong>: Falsificare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Passato</strong>: scegli 2 dogmi della tua causa; la fazione che odia la tua causa parte da Reputazione -1, quella che le dà rifugio da +1</li></ul><p><strong>Natura</strong></p><ul><li><em>Credente</em>: svuota la fatica quando denunci pubblicamente un simbolo o un'autorità di credenze opposte alle tue.</li><li><em>Paciere</em>: svuota la fatica quando cerchi di avviare un dialogo tra due nemici di fazioni diverse.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>.</p><p><strong>Legami</strong>: Protettore (condivide le tue idee), Sentinella (è stato ferito da qualcuno della tua causa).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-eretico-amici\" data-id=\"pb-eretico-amici\">Amici per Davvero</a> e <a class=\"xl\" href=\"#pb-eretico-ascoltami\" data-id=\"pb-eretico-ascoltami\">Udite!</a> + una tra <a class=\"xl\" href=\"#pb-eretico-bellezza\" data-id=\"pb-eretico-bellezza\">Iconoclasta</a>, <a class=\"xl\" href=\"#pb-eretico-fascino\" data-id=\"pb-eretico-fascino\">Fascino Diabolico</a>, <a class=\"xl\" href=\"#pb-eretico-universo\" data-id=\"pb-eretico-universo\">Il Centro dell'Universo</a>, <a class=\"xl\" href=\"#pb-eretico-passare\" data-id=\"pb-eretico-passare\">Tu Non Puoi Passare</a>.</p>","text":"Un fervente sostenitore di una causa che i più trovano inaccettabile. - Caratteristiche: Carisma +2, Astuzia 0, Destrezza -1, Fortuna +1, Vigore 0 - Abilità iniziale: Fracassare, Disarmare, Tiro Rapido, Assaltare un Gruppo - Imprese: Falsificare, Gioco di Prestigio - Valore iniziale: 9 - Passato: scegli 2 dogmi della tua causa; la fazione che odia la tua causa parte da Reputazione -1, quella che le dà rifugio da +1 Natura - Credente: svuota la fatica quando denunci pubblicamente un simbolo o un'autorità di credenze opposte alle tue. - Paciere: svuota la fatica quando cerchi di avviare un dialogo tra due nemici di fazioni diverse. Motivazioni: Princìpi, Protezione, Libertà, Caos. Legami: Protettore (condivide le tue idee), Sentinella (è stato ferito da qualcuno della tua causa). Mosse: inizi con Amici per Davvero e Udite! + una tra Iconoclasta, Fascino Diabolico, Il Centro dell'Universo, Tu Non Puoi Passare.","back":["playbook-indice"]},{"id":"pb-eretico-amici","title":"Amici per Davvero","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Amici per Davvero"],"html":"<p>Quando, arrivato in una radura, cerchi chi condivide la tua causa, tira su <strong>Carisma</strong>. Con un successo ne trovi uno o due che offrono ciò che possono. Con <span class=\"res\">7-9</span> ti parlano anche di una minaccia alla vostra ideologia nella radura. Con un fallimento ti scopre qualcuno che disprezza quelli come te.</p>","text":"Quando, arrivato in una radura, cerchi chi condivide la tua causa, tira su Carisma. Con un successo ne trovi uno o due che offrono ciò che possono. Con 7-9 ti parlano anche di una minaccia alla vostra ideologia nella radura. Con un fallimento ti scopre qualcuno che disprezza quelli come te.","back":["pb-eretico"]},{"id":"pb-eretico-ascoltami","title":"Udite!","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Udite"],"html":"<p>Quando tieni un discorso infiammato a una folla convincibile per la tua causa, segna fatica e tira su <strong>Carisma</strong>. Con un successo la smuovi; scegli 2: abbattono un simbolo avversario; rovesciano un tiranno vulnerabile; distruggono le vestigia della tradizione; innalzano qualcuno di trascurato; fanno giustizia dei malvagi. Con <span class=\"res\">7-9</span> devi metterti alla loro mercé e guidarli di persona. Con un fallimento agiscono ignorandoti, con conseguenze terribili.</p>","text":"Quando tieni un discorso infiammato a una folla convincibile per la tua causa, segna fatica e tira su Carisma. Con un successo la smuovi; scegli 2: abbattono un simbolo avversario; rovesciano un tiranno vulnerabile; distruggono le vestigia della tradizione; innalzano qualcuno di trascurato; fanno giustizia dei malvagi. Con 7-9 devi metterti alla loro mercé e guidarli di persona. Con un fallimento agiscono ignorandoti, con conseguenze terribili.","back":["pb-eretico"]},{"id":"pb-eretico-bellezza","title":"Iconoclasta","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Iconoclasta"],"html":"<p>Quando distruggi un falso idolo o un simbolo d'oppressione insieme ai tuoi alleati, tira su <strong>Carisma</strong> invece di Vigore; tu e i tuoi alleati svuotate 1-fatica, anche con un fallimento.</p>","text":"Quando distruggi un falso idolo o un simbolo d'oppressione insieme ai tuoi alleati, tira su Carisma invece di Vigore; tu e i tuoi alleati svuotate 1-fatica, anche con un fallimento.","back":["pb-eretico"]},{"id":"pb-eretico-fascino","title":"Fascino Diabolico","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Fascino Diabolico"],"html":"<p>Quando inganni un PNG che hai già aiutato o impressionato, segna fatica per ottenere <span class=\"res\">12+</span> senza tirare.</p>","text":"Quando inganni un PNG che hai già aiutato o impressionato, segna fatica per ottenere 12+ senza tirare.","back":["pb-eretico"]},{"id":"pb-eretico-universo","title":"Il Centro dell'Universo","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Il Centro dell'Universo"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-eretico"]},{"id":"pb-eretico-passare","title":"Tu Non Puoi Passare","cat":"mosse","group":"Eretico","src":"VF p.110","aliases":["Tu Non Puoi Passare"],"html":"<p>Quando ti pianti sulla strada dei nemici, tira su <strong>Carisma</strong>. Con un successo non possono superarti finché non ti abbattono. Scegli 1 (<span class=\"res\">10+</span>) o 2 (<span class=\"res\">7-9</span>): subisci +1 danno da ogni attacco; un nemico (scelto dal GM) ti supera; non puoi ritirarti. Con un fallimento trovano un'altra via che peggiora molto la situazione.</p>","text":"Quando ti pianti sulla strada dei nemici, tira su Carisma. Con un successo non possono superarti finché non ti abbattono. Scegli 1 (10+) o 2 (7-9): subisci +1 danno da ogni attacco; un nemico (scelto dal GM) ti supera; non puoi ritirarti. Con un fallimento trovano un'altra via che peggiora molto la situazione.","back":["pb-eretico"]},{"id":"pb-pirata","title":"Il Pirata","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.113-116","aliases":["Pirata","Pirate"],"html":"<p><em>Un capitano canaglia a casa sui fiumi e sui laghi, libero dalla vita di terra.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia 0, Destrezza 0, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Parare, Assaltare un Gruppo, Tiro da Maestro, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Attaccare alle Spalle, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, ratto</li></ul><p><strong>Natura</strong></p><ul><li><em>Furfante</em>: svuota la fatica quando tenti di tradire (doppiogioco, triplo gioco) un PNG potente o pericoloso.</li><li><em>Mercante</em>: svuota la fatica quando porti merci o tesori preziosi oltre un pericolo o un blocco.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Compagno (avete rubato un carico a una fazione), Familiare (era amico del tuo vecchio capitano).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-pirata-nave\" data-id=\"pb-pirata-nave\">Nave Pirata</a> e <a class=\"xl\" href=\"#pb-pirata-salpare\" data-id=\"pb-pirata-salpare\">Solcare le Acque</a> + una tra <a class=\"xl\" href=\"#pb-pirata-spadaccino\" data-id=\"pb-pirata-spadaccino\">Spadaccino</a>, <a class=\"xl\" href=\"#pb-pirata-tesoro\" data-id=\"pb-pirata-tesoro\">In Cerca di Bottino</a>, <a class=\"xl\" href=\"#pb-pirata-rum\" data-id=\"pb-pirata-rum\">Un Bicchiere di Rum?</a>, <a class=\"xl\" href=\"#pb-pirata-gambe\" data-id=\"pb-pirata-gambe\">Zampe da Marinaio</a>.</p>","text":"Un capitano canaglia a casa sui fiumi e sui laghi, libero dalla vita di terra. - Caratteristiche: Carisma +1, Astuzia 0, Destrezza 0, Fortuna +1, Vigore 0 - Abilità iniziale: Parare, Assaltare un Gruppo, Tiro da Maestro, Colpo Crudele - Imprese: Acrobazie, Attaccare alle Spalle, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, ratto Natura - Furfante: svuota la fatica quando tenti di tradire (doppiogioco, triplo gioco) un PNG potente o pericoloso. - Mercante: svuota la fatica quando porti merci o tesori preziosi oltre un pericolo o un blocco. Motivazioni: Libertà, Vendetta, Crimine, Infamia. Legami: Compagno (avete rubato un carico a una fazione), Familiare (era amico del tuo vecchio capitano). Mosse: inizi con Nave Pirata e Solcare le Acque + una tra Spadaccino, In Cerca di Bottino, Un Bicchiere di Rum?, Zampe da Marinaio.","back":["playbook-indice"]},{"id":"pb-pirata-nave","title":"Nave Pirata","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Nave Pirata"],"html":"<p>La tua nave (dalle un nome) ha 4 caselle di usura (segnale con danni seri o quando una mossa lo chiede). Piena: è ferma e va riparata in porto; se devi segnarne ancora, la perdi (il GM può offrirti l'occasione di averne un'altra).</p><p><strong>Pregi</strong> (2): <em>Fornita</em> (tracciato consumo di 2 caselle per carico); <em>Agile</em> (+1 continuo a ingannare sfruttando la velocità); <em>Famosa</em> (+1 Reputazione con una fazione a bordo); <em>Manovrabile</em> (una volta per sessione, segna usura per seminare qualsiasi inseguitore in acqua).</p><p><strong>Difetti</strong> (2): <em>Famigerata</em> (-1 Reputazione con una fazione a bordo); <em>Sgangherata</em> (1 usura in meno); <em>Goffa</em> (-1 ad affidarti al fato pilotando con cautela); <em>Rubata</em> (qualcuno di pericoloso la rivuole).</p>","text":"La tua nave (dalle un nome) ha 4 caselle di usura (segnale con danni seri o quando una mossa lo chiede). Piena: è ferma e va riparata in porto; se devi segnarne ancora, la perdi (il GM può offrirti l'occasione di averne un'altra). Pregi (2): Fornita (tracciato consumo di 2 caselle per carico); Agile (+1 continuo a ingannare sfruttando la velocità); Famosa (+1 Reputazione con una fazione a bordo); Manovrabile (una volta per sessione, segna usura per seminare qualsiasi inseguitore in acqua). Difetti (2): Famigerata (-1 Reputazione con una fazione a bordo); Sgangherata (1 usura in meno); Goffa (-1 ad affidarti al fato pilotando con cautela); Rubata (qualcuno di pericoloso la rivuole).","back":["pb-pirata"]},{"id":"pb-pirata-salpare","title":"Solcare le Acque","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Solcare le Acque"],"html":"<p>Quando viaggi da una radura all'altra in nave, segna usura sulla nave e tira su <strong>Fortuna</strong>. Con un successo raggiungi il porto e il GM ti indica un abitante (quasi) amico che conosci lì. Con <span class=\"res\">7-9</span> porta rancore: risolvi o offrigli almeno 2-Valore. Con un fallimento finisci in una situazione pericolosa lungo la rotta.</p>","text":"Quando viaggi da una radura all'altra in nave, segna usura sulla nave e tira su Fortuna. Con un successo raggiungi il porto e il GM ti indica un abitante (quasi) amico che conosci lì. Con 7-9 porta rancore: risolvi o offrigli almeno 2-Valore. Con un fallimento finisci in una situazione pericolosa lungo la rotta.","back":["viaggio-indice","pb-pirata"]},{"id":"pb-pirata-spadaccino","title":"Spadaccino","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Spadaccino"],"html":"<p>Quando ti getti per la prima volta in battaglia oscillando, tuffandoti o saltando per ingaggiare un nemico in mischia a distanza ravvicinata, tira su <strong>Fortuna</strong> invece di Vigore.</p>","text":"Quando ti getti per la prima volta in battaglia oscillando, tuffandoti o saltando per ingaggiare un nemico in mischia a distanza ravvicinata, tira su Fortuna invece di Vigore.","back":["pb-pirata"]},{"id":"pb-pirata-tesoro","title":"In Cerca di Bottino","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["In Cerca di Bottino"],"html":"<p>Quando chiedi in giro per un porto di commerci preziosi, tira su <strong>Fortuna</strong>. Con un successo scopri un carico vicino che vale la pena; con <span class=\"res\">10+</span> sai esattamente dov'è o come intercettarlo. Con un fallimento senti solo di carichi ben sorvegliati, e le tue domande attirano attenzione.</p>","text":"Quando chiedi in giro per un porto di commerci preziosi, tira su Fortuna. Con un successo scopri un carico vicino che vale la pena; con 10+ sai esattamente dov'è o come intercettarlo. Con un fallimento senti solo di carichi ben sorvegliati, e le tue domande attirano attenzione.","back":["pb-pirata"]},{"id":"pb-pirata-rum","title":"Un Bicchiere di Rum?","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Un Bicchiere di Rum"],"html":"<p>Una volta per sessione puoi <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a> un vagabondo una seconda volta condividendo il tuo rum (segna consumo).</p>","text":"Una volta per sessione puoi Supplicare un PG un vagabondo una seconda volta condividendo il tuo rum (segna consumo).","back":["pb-pirata"]},{"id":"pb-pirata-gambe","title":"Zampe da Marinaio","cat":"mosse","group":"Pirata","src":"VF p.114","aliases":["Zampe da Marinaio"],"html":"<p>A bordo di una nave, quando tenti di attaccare alle spalle, sgattaiolare, nasconderti o fare acrobazie, tira su <strong>Fortuna</strong> invece di Destrezza.</p>","text":"A bordo di una nave, quando tenti di attaccare alle spalle, sgattaiolare, nasconderti o fare acrobazie, tira su Fortuna invece di Destrezza.","back":["pb-pirata"]},{"id":"pb-principe","title":"L'Erede","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.117-120","aliases":["Erede","Prince"],"html":"<p><em>Un vagabondo di seconda generazione, erede delle abilità dei genitori vagabondi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Incalzare, Parare</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare + due a scelta</li><li><strong>Valore iniziale</strong>: 7</li></ul><ul><li><strong>Passato</strong>: perché i tuoi genitori ti hanno cresciuto come vagabondo e cosa è capitato loro</li></ul><p><strong>Natura</strong></p><ul><li><em>Discendente</em>: svuota la fatica quando affronti il pericolo per attaccare i nemici o difendere gli alleati dei tuoi genitori.</li><li><em>Pioniere</em>: svuota la fatica quando intraprendi con altri una nuova linea d'azione folle e rischiosa.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Professionista (lavorava con un tuo genitore), Familiare (è stato allievo di un tuo genitore).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-principe-arma\" data-id=\"pb-principe-arma\">Arma di Famiglia</a> e <a class=\"xl\" href=\"#pb-principe-eredita\" data-id=\"pb-principe-eredita\">Retaggio</a> + una tra <a class=\"xl\" href=\"#pb-principe-noi\" data-id=\"pb-principe-noi\">Uno di Noi</a>, <a class=\"xl\" href=\"#pb-principe-storie\" data-id=\"pb-principe-storie\">Frottole</a>, <a class=\"xl\" href=\"#pb-principe-prigione\" data-id=\"pb-principe-prigione\">Fuori di Prigione</a>, <a class=\"xl\" href=\"#pb-principe-favorito\" data-id=\"pb-principe-favorito\">Prediletto</a>.</p>","text":"Un vagabondo di seconda generazione, erede delle abilità dei genitori vagabondi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Disarmare, Incalzare, Parare - Imprese: Nascondersi, Sgattaiolare + due a scelta - Valore iniziale: 7 - Passato: perché i tuoi genitori ti hanno cresciuto come vagabondo e cosa è capitato loro Natura - Discendente: svuota la fatica quando affronti il pericolo per attaccare i nemici o difendere gli alleati dei tuoi genitori. - Pioniere: svuota la fatica quando intraprendi con altri una nuova linea d'azione folle e rischiosa. Motivazioni: Protezione, Libertà, Crimine, Voglia di Viaggiare. Legami: Professionista (lavorava con un tuo genitore), Familiare (è stato allievo di un tuo genitore). Mosse: inizi con Arma di Famiglia e Retaggio + una tra Uno di Noi, Frottole, Fuori di Prigione, Prediletto.","back":["playbook-indice"]},{"id":"pb-principe-arma","title":"Arma di Famiglia","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Arma di Famiglia"],"html":"<p>Un cimelio di famiglia con 4 caselle di usura, per te inestimabile (se distrutto, il GM ti dice cosa fare per restaurarlo). Scegli tipo (pugnale, ascia, martello, spada, lancia, balestra, arco), una distanza e due caratteristiche:</p><ul><li><em>Affidabile</em>: +2 usura e una distanza extra.</li><li><em>Temuta</em>: chi la riconosce subisce danno al morale all'inizio dello scontro.</li><li><em>Mortale</em>: +1 danno.</li><li><em>Doppia-Testa</em>: un'estremità infligge ferite, l'altra fatica (dichiara all'inizio).</li><li><em>Versatile</em>: due etichette di abilità con le armi.</li><li><em>Unica</em>: una volta per sessione segna fatica per ignorare il danno di un attacco.</li><li><em>Travolgente</em>: dopo aver ferito un nemico pericoloso, segna usura: ogni alleato che ti ha visto svuota fatica.</li></ul>","text":"Un cimelio di famiglia con 4 caselle di usura, per te inestimabile (se distrutto, il GM ti dice cosa fare per restaurarlo). Scegli tipo (pugnale, ascia, martello, spada, lancia, balestra, arco), una distanza e due caratteristiche: - Affidabile: +2 usura e una distanza extra. - Temuta: chi la riconosce subisce danno al morale all'inizio dello scontro. - Mortale: +1 danno. - Doppia-Testa: un'estremità infligge ferite, l'altra fatica (dichiara all'inizio). - Versatile: due etichette di abilità con le armi. - Unica: una volta per sessione segna fatica per ignorare il danno di un attacco. - Travolgente: dopo aver ferito un nemico pericoloso, segna usura: ogni alleato che ti ha visto svuota fatica.","back":["pb-principe"]},{"id":"pb-principe-eredita","title":"Retaggio","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Retaggio"],"html":"<p>Quando <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a>, segna il tracciato di retaggio per prendere <span class=\"res\">10+</span> senza tirare. Quando è pieno, svuotalo e tira con +1 per ogni sì: sei in una radura? qualcuno ti cerca? hai +2 o -2 con almeno una fazione? Con un successo ti trova qualcuno con conti in sospeso con i tuoi genitori (con <span class=\"res\">10+</span> senza preavviso). Con un fallimento un abitante ti avverte e segni il tracciato.</p>","text":"Quando incontri qualcuno di importante, segna il tracciato di retaggio per prendere 10+ senza tirare. Quando è pieno, svuotalo e tira con +1 per ogni sì: sei in una radura? qualcuno ti cerca? hai +2 o -2 con almeno una fazione? Con un successo ti trova qualcuno con conti in sospeso con i tuoi genitori (con 10+ senza preavviso). Con un fallimento un abitante ti avverte e segni il tracciato.","back":["pb-principe"]},{"id":"pb-principe-noi","title":"Uno di Noi","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Uno di Noi"],"html":"<p>Quando cerchi di capire o convincere vagabondi, banditi, rivoluzionari o emarginati, tira su <strong>Fortuna</strong> invece di Carisma.</p>","text":"Quando cerchi di capire o convincere vagabondi, banditi, rivoluzionari o emarginati, tira su Fortuna invece di Carisma.","back":["pb-principe"]},{"id":"pb-principe-storie","title":"Frottole","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Frottole"],"html":"<p>Quando impressioni una folla con una storia incredibile, tira su <strong>Fortuna</strong>. Con un successo tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia; con <span class=\"res\">10+</span> qualche sprovveduto ti offre anche un lavoro redditizio. Con un fallimento attiri qualcuno disperato che non puoi aiutare.</p>","text":"Quando impressioni una folla con una storia incredibile, tira su Fortuna. Con un successo tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia; con 10+ qualche sprovveduto ti offre anche un lavoro redditizio. Con un fallimento attiri qualcuno disperato che non puoi aiutare.","back":["pb-principe"]},{"id":"pb-principe-prigione","title":"Fuori di Prigione","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Fuori di Prigione"],"html":"<p>Ottieni <a class=\"xl\" href=\"#scassinare\" data-id=\"scassinare\">Scassinare</a> (fuori limite). Quando tenti di evadere, segna fatica per trasformare un fallimento in <span class=\"res\">7-9</span>.</p>","text":"Ottieni Scassinare (fuori limite). Quando tenti di evadere, segna fatica per trasformare un fallimento in 7-9.","back":["pb-principe"]},{"id":"pb-principe-favorito","title":"Prediletto","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Prediletto"],"html":"<p>+1 Fortuna (max +3).</p>","text":"+1 Fortuna (max +3).","back":["pb-principe"]},{"id":"pb-cantastorie","title":"Il Cantastorie","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.121-124","aliases":["Cantastorie","Raconteur"],"html":"<p><em>Un narratore che guadagna monete e fiducia insegnando agli abitanti cosa credere dei fatti dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza +1, Fortuna -1, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Improvvisare, Colpo Crudele</li><li><strong>Imprese</strong>: Falsificare, Borseggiare, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, donnola</li></ul><p><strong>Natura</strong></p><ul><li><em>Leggenda</em>: svuota la fatica quando ti esibisci davanti a un pubblico numeroso e attento.</li><li><em>Compagno</em>: svuota la fatica quando lodi un amico davanti a una persona o un gruppo potente.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Amico (vi hanno cacciato da una radura), Familiare (insieme in mille imprese, che hai reso famose).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cantastorie-strumenti\" data-id=\"pb-cantastorie-strumenti\">Attrezzi del Mestiere</a> + due tra <a class=\"xl\" href=\"#pb-cantastorie-fan\" data-id=\"pb-cantastorie-fan\">Fan Adoranti</a>, <a class=\"xl\" href=\"#pb-cantastorie-occhi\" data-id=\"pb-cantastorie-occhi\">Tutti gli Sguardi su di Me</a>, <a class=\"xl\" href=\"#pb-cantastorie-dita\" data-id=\"pb-cantastorie-dita\">Occhio sul Pubblico</a>, <a class=\"xl\" href=\"#pb-cantastorie-lingua\" data-id=\"pb-cantastorie-lingua\">Parlantina</a>, <a class=\"xl\" href=\"#pb-cantastorie-miele\" data-id=\"pb-cantastorie-miele\">Dolce come Miele</a>.</p>","text":"Un narratore che guadagna monete e fiducia insegnando agli abitanti cosa credere dei fatti dei Boschi. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza +1, Fortuna -1, Vigore -1 - Abilità iniziale: Confondere i Sensi, Disarmare, Improvvisare, Colpo Crudele - Imprese: Falsificare, Borseggiare, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, donnola Natura - Leggenda: svuota la fatica quando ti esibisci davanti a un pubblico numeroso e attento. - Compagno: svuota la fatica quando lodi un amico davanti a una persona o un gruppo potente. Motivazioni: Scoperta, Brivido, Infamia, Zampe Pulite. Legami: Amico (vi hanno cacciato da una radura), Familiare (insieme in mille imprese, che hai reso famose). Mosse: inizi con Attrezzi del Mestiere + due tra Fan Adoranti, Tutti gli Sguardi su di Me, Occhio sul Pubblico, Parlantina, Dolce come Miele.","back":["playbook-indice"]},{"id":"pb-cantastorie-strumenti","title":"Attrezzi del Mestiere","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Attrezzi del Mestiere"],"html":"<p>Un simbolo del tuo talento (3 usura, inestimabile): strumento musicale, libro di poesie, costume o oggetto di scena. Tre caratteristiche tra: <em>Solido</em> (+2 usura; dopo un'esibizione pubblica svuota 1 usura); <em>Ammaliante</em> (segna usura invece di fatica per dare +2 quando aiuti distraendo); <em>Versatile</em> (due etichette); <em>Rivelatore</em> (esibendoti, segna usura per chiedere a uno spettatore cosa lo motiva davvero, +1 agendo sulla risposta); <em>Piacevole</em> (esibendoti per la banda sul sentiero, segna usura: ognuno svuota fino a 2-fatica extra).</p><p>La prima volta che ti esibisci sinceramente in pubblico in una radura, tira su <strong>Carisma</strong>: con un successo, nomina una fazione che lusinghi; un suo membro importante ti offre lavoro (<span class=\"res\">10+</span>: segna anche prestigio). Con un fallimento attiri l'attenzione peggiore.</p>","text":"Un simbolo del tuo talento (3 usura, inestimabile): strumento musicale, libro di poesie, costume o oggetto di scena. Tre caratteristiche tra: Solido (+2 usura; dopo un'esibizione pubblica svuota 1 usura); Ammaliante (segna usura invece di fatica per dare +2 quando aiuti distraendo); Versatile (due etichette); Rivelatore (esibendoti, segna usura per chiedere a uno spettatore cosa lo motiva davvero, +1 agendo sulla risposta); Piacevole (esibendoti per la banda sul sentiero, segna usura: ognuno svuota fino a 2-fatica extra). La prima volta che ti esibisci sinceramente in pubblico in una radura, tira su Carisma: con un successo, nomina una fazione che lusinghi; un suo membro importante ti offre lavoro (10+: segna anche prestigio). Con un fallimento attiri l'attenzione peggiore.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-fan","title":"Fan Adoranti","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Fan Adoranti"],"html":"<p>Quando entri per la prima volta in una radura, tira su <strong>Carisma</strong>. Con un successo un fan ti riconosce: pettegolezzi, ospitalità, una guida; con <span class=\"res\">10+</span> farà ancora di più. Con un fallimento un fan ben intenzionato peggiora molto la situazione.</p>","text":"Quando entri per la prima volta in una radura, tira su Carisma. Con un successo un fan ti riconosce: pettegolezzi, ospitalità, una guida; con 10+ farà ancora di più. Con un fallimento un fan ben intenzionato peggiora molto la situazione.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-occhi","title":"Tutti gli Sguardi su di Me","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Tutti gli Sguardi su di Me"],"html":"<p>Quando crei un diversivo con un'esibizione stravagante, segna fatica e tira su <strong>Carisma</strong>. Con un successo nessuno distoglie lo sguardo: gli alleati hanno +1 continuo a sgattaiolare, nascondersi, borseggiare o affidarsi al fato finché reciti; con <span class=\"res\">10+</span> tieni anche 1 presa per dare +3 a uno di quei tiri. Con un fallimento il pubblico si offende e ti fa sapere la sua opinione.</p>","text":"Quando crei un diversivo con un'esibizione stravagante, segna fatica e tira su Carisma. Con un successo nessuno distoglie lo sguardo: gli alleati hanno +1 continuo a sgattaiolare, nascondersi, borseggiare o affidarsi al fato finché reciti; con 10+ tieni anche 1 presa per dare +3 a uno di quei tiri. Con un fallimento il pubblico si offende e ti fa sapere la sua opinione.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-dita","title":"Occhio sul Pubblico","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Occhio sul Pubblico"],"html":"<p>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> mentre ti esibisci, puoi sempre fare una domanda, anche con un fallimento.</p>","text":"Quando valuti una situazione tesa mentre ti esibisci, puoi sempre fare una domanda, anche con un fallimento.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-lingua","title":"Parlantina","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Parlantina"],"html":"<p>Quando <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convinci un PNG</a> con un aneddoto colorito, con un successo segna fatica per fargli rivelare qualcosa di importante sulla situazione.</p>","text":"Quando convinci un PNG con un aneddoto colorito, con un successo segna fatica per fargli rivelare qualcosa di importante sulla situazione.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-miele","title":"Dolce come Miele","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Dolce come Miele"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-cantastorie"]},{"id":"pb-razziatore","title":"Il Razziatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.125-128","aliases":["Razziatore","Raider"],"html":"<p><em>Un bandito che ruba con la forza, pericoloso ma forse capace di usare l'ascia a fin di bene (se pagato).</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia -1, Destrezza +1, Fortuna 0, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Attaccare alle Spalle</li><li><strong>Valore iniziale</strong>: 9</li></ul><p><strong>Natura</strong></p><ul><li><em>Bandito</em>: svuota la fatica quando usi la minaccia della forza per strappare oggetti di valore a un'opposizione temibile.</li><li><em>Eroe</em>: svuota la fatica quando attacchi apertamente un PNG pericoloso, oppressivo o malvagio.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>.</p><p><strong>Legami</strong>: Protettore (l'hai protetto dalla tua stessa banda), Sentinella (ti ha battuto quando hai esagerato).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-razziatore-occhio\" data-id=\"pb-razziatore-occhio\">In Battaglia</a>, <a class=\"xl\" href=\"#pb-razziatore-pelle\" data-id=\"pb-razziatore-pelle\">Pelle di Ferro</a>, <a class=\"xl\" href=\"#pb-razziatore-saccheggio\" data-id=\"pb-razziatore-saccheggio\">Saccheggiare e Depredare</a>, <a class=\"xl\" href=\"#pb-razziatore-misericordia\" data-id=\"pb-razziatore-misericordia\">Misericordia</a>, <a class=\"xl\" href=\"#pb-razziatore-piano\" data-id=\"pb-razziatore-piano\">Piano d'Attacco</a>, <a class=\"xl\" href=\"#pb-razziatore-aspetto\" data-id=\"pb-razziatore-aspetto\">Volto Minaccioso</a>.</p>","text":"Un bandito che ruba con la forza, pericoloso ma forse capace di usare l'ascia a fin di bene (se pagato). - Caratteristiche: Carisma 0, Astuzia -1, Destrezza +1, Fortuna 0, Vigore +2 - Abilità iniziale: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele - Imprese: Acrobazie, Attaccare alle Spalle - Valore iniziale: 9 Natura - Bandito: svuota la fatica quando usi la minaccia della forza per strappare oggetti di valore a un'opposizione temibile. - Eroe: svuota la fatica quando attacchi apertamente un PNG pericoloso, oppressivo o malvagio. Motivazioni: Lealtà, Caos, Crimine, Avidità. Legami: Protettore (l'hai protetto dalla tua stessa banda), Sentinella (ti ha battuto quando hai esagerato). Mosse (tre): In Battaglia, Pelle di Ferro, Saccheggiare e Depredare, Misericordia, Piano d'Attacco, Volto Minaccioso.","back":["playbook-indice"]},{"id":"pb-razziatore-occhio","title":"In Battaglia","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["In Battaglia"],"html":"<p>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> proprio mentre scoppia la violenza, tira su <strong>Vigore</strong> invece di Astuzia.</p>","text":"Quando valuti una situazione tesa proprio mentre scoppia la violenza, tira su Vigore invece di Astuzia.","back":["pb-razziatore"]},{"id":"pb-razziatore-pelle","title":"Pelle di Ferro","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Pelle di Ferro"],"html":"<p>Quando un <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">gruppo</a> ti infligge danno, subisci 2 danni in meno per attacco (minimo 1); quando infliggi danno a un gruppo, +1 danno.</p>","text":"Quando un gruppo ti infligge danno, subisci 2 danni in meno per attacco (minimo 1); quando infliggi danno a un gruppo, +1 danno.","back":["pb-razziatore"]},{"id":"pb-razziatore-saccheggio","title":"Saccheggiare e Depredare","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Saccheggiare e Depredare"],"html":"<p>Quando saccheggi un'area ricca, tira su <strong>Destrezza</strong>. Con un successo qualcosa di insolito attira il tuo sguardo ed è tuo; con <span class=\"res\">10+</span> tutte e tre, con <span class=\"res\">7-9</span> una: vale molto (+2-Valore); ha un valore speciale per una fazione (+4 prestigio se ceduto); è resistentissimo (+1 usura). Con un fallimento lo prendi, ma è cercato da abitanti pronti a uccidere.</p>","text":"Quando saccheggi un'area ricca, tira su Destrezza. Con un successo qualcosa di insolito attira il tuo sguardo ed è tuo; con 10+ tutte e tre, con 7-9 una: vale molto (+2-Valore); ha un valore speciale per una fazione (+4 prestigio se ceduto); è resistentissimo (+1 usura). Con un fallimento lo prendi, ma è cercato da abitanti pronti a uccidere.","back":["pb-razziatore"]},{"id":"pb-razziatore-misericordia","title":"Misericordia","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Misericordia"],"html":"<p>Quando cerchi di fare amicizia con un PNG che hai salvato dall'ira di un altro, aiutalo ancora (segna fatica) o offrigli da bere (segna consumo): ti rivelerà un segreto prezioso o ti farà un grande favore.</p>","text":"Quando cerchi di fare amicizia con un PNG che hai salvato dall'ira di un altro, aiutalo ancora (segna fatica) o offrigli da bere (segna consumo): ti rivelerà un segreto prezioso o ti farà un grande favore.","back":["pb-razziatore"]},{"id":"pb-razziatore-piano","title":"Piano d'Attacco","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Piano d'Attacco"],"html":"<p>Quando elabori un piano d'attacco con qualcuno, tira su <strong>Vigore</strong>: <span class=\"res\">10+</span> tieni 3, <span class=\"res\">7-9</span> tieni 2. Durante il piano, a qualsiasi distanza, spendile per: +1 al tiro di qualcuno (dopo il tiro); ridurre di 1 il danno di un attacco; evitare a qualcuno di segnare consumo o usura. Con un fallimento tieni 1, ma il piano incontra subito un'opposizione disastrosa.</p>","text":"Quando elabori un piano d'attacco con qualcuno, tira su Vigore: 10+ tieni 3, 7-9 tieni 2. Durante il piano, a qualsiasi distanza, spendile per: +1 al tiro di qualcuno (dopo il tiro); ridurre di 1 il danno di un attacco; evitare a qualcuno di segnare consumo o usura. Con un fallimento tieni 1, ma il piano incontra subito un'opposizione disastrosa.","back":["pb-razziatore"]},{"id":"pb-razziatore-aspetto","title":"Volto Minaccioso","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Volto Minaccioso"],"html":"<p>Puoi usare <a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> e <a class=\"xl\" href=\"#attirare-attenzione\" data-id=\"attirare-attenzione\">Attirare l'Attenzione</a> con Reputazione 0 o inferiore (trattando il negativo come positivo: -1 diventa +1, 0 resta 0).</p>","text":"Puoi usare Fare una Minaccia Diretta e Attirare l'Attenzione con Reputazione 0 o inferiore (trattando il negativo come positivo: -1 diventa +1, 0 resta 0).","back":["pb-razziatore"]},{"id":"pb-cercatore","title":"Il Cercatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.129-132","aliases":["Cercatore","Seeker"],"html":"<p><em>Un esploratore nato, attratto dalle rovine e dai segreti antichi dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Disattivare un Congegno, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, talpa</li></ul><p><strong>Natura</strong></p><ul><li><em>Esploratore</em>: svuota la fatica quando entri in una rovina o in un'area pericolosa della foresta.</li><li><em>Storico</em>: svuota la fatica quando impedisci a qualcuno di nascondere o offuscare la verità.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Compagno (avete visto insieme le meraviglie dei Boschi), Professionista (famoso per una sua scoperta).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cercatore-voci\" data-id=\"pb-cercatore-voci\">Gira Voce Che...</a> + due tra <a class=\"xl\" href=\"#pb-cercatore-perso\" data-id=\"pb-cercatore-perso\">Sempre all'Erta</a>, <a class=\"xl\" href=\"#pb-cercatore-tesori\" data-id=\"pb-cercatore-tesori\">Cacciatore di Tesori</a>, <a class=\"xl\" href=\"#pb-cercatore-contratto\" data-id=\"pb-cercatore-contratto\">Mecenate</a>, <a class=\"xl\" href=\"#pb-cercatore-segni\" data-id=\"pb-cercatore-segni\">Attento ai Segni</a>, <a class=\"xl\" href=\"#pb-cercatore-terreno\" data-id=\"pb-cercatore-terreno\">Terreno Instabile</a>.</p>","text":"Un esploratore nato, attratto dalle rovine e dai segreti antichi dei Boschi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Disarmare, Parare, Tiro da Maestro - Imprese: Acrobazie, Disattivare un Congegno, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, talpa Natura - Esploratore: svuota la fatica quando entri in una rovina o in un'area pericolosa della foresta. - Storico: svuota la fatica quando impedisci a qualcuno di nascondere o offuscare la verità. Motivazioni: Giustizia, Scoperta, Avidità, Voglia di Viaggiare. Legami: Compagno (avete visto insieme le meraviglie dei Boschi), Professionista (famoso per una sua scoperta). Mosse: inizi con Gira Voce Che... + due tra Sempre all'Erta, Cacciatore di Tesori, Mecenate, Attento ai Segni, Terreno Instabile.","back":["playbook-indice"]},{"id":"pb-cercatore-voci","title":"Gira Voce Che...","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Gira Voce Che"],"html":"<p>Quando passi del tempo a parlare con la gente di una radura, tira su <strong>Destrezza</strong>. Con un successo senti di una meraviglia o rovina inesplorata vicina e qualcuno si offre di portartici per 1-Valore. Con <span class=\"res\">7-9</span> i pericoli alzano il prezzo di 1-Valore. Con un fallimento il luogo è minacciato: presto sarà saccheggiato, distrutto o reclamato.</p>","text":"Quando passi del tempo a parlare con la gente di una radura, tira su Destrezza. Con un successo senti di una meraviglia o rovina inesplorata vicina e qualcuno si offre di portartici per 1-Valore. Con 7-9 i pericoli alzano il prezzo di 1-Valore. Con un fallimento il luogo è minacciato: presto sarà saccheggiato, distrutto o reclamato.","back":["pb-cercatore"]},{"id":"pb-cercatore-perso","title":"Sempre all'Erta","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Sempre all'Erta"],"html":"<p>Due caselle extra di ferite e di consumo usabili quando affronti pericoli in una rovina, e +1 continuo ad affidarti al fato e alle imprese da furfante mentre esplori luoghi antichi.</p>","text":"Due caselle extra di ferite e di consumo usabili quando affronti pericoli in una rovina, e +1 continuo ad affidarti al fato e alle imprese da furfante mentre esplori luoghi antichi.","back":["pb-cercatore"]},{"id":"pb-cercatore-tesori","title":"Cacciatore di Tesori","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Cacciatore di Tesori"],"html":"<p>Quando vendi al mercato i tesori trovati in una rovina, tira su <strong>Astuzia</strong>. Con un successo trovi compratori; scegli 1 (<span class=\"res\">7-9</span>) o entrambe (<span class=\"res\">10+</span>): ottieni il doppio del valore; segni 2-prestigio con la fazione dominante. Con un fallimento vendi a prezzo equo ma offendi qualcuno di potente.</p>","text":"Quando vendi al mercato i tesori trovati in una rovina, tira su Astuzia. Con un successo trovi compratori; scegli 1 (7-9) o entrambe (10+): ottieni il doppio del valore; segni 2-prestigio con la fazione dominante. Con un fallimento vendi a prezzo equo ma offendi qualcuno di potente.","back":["pb-cercatore"]},{"id":"pb-cercatore-contratto","title":"Mecenate","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Mecenate"],"html":"<p>Quando cerchi di convincere un PNG potente a finanziare una spedizione, tira su <strong>Astuzia</strong>. Con un successo ti dà 8-Valore in risorse e consumo, ma devi soddisfare una richiesta: generica con <span class=\"res\">10+</span> (ricchezze, informazioni, un trofeo), specifica con <span class=\"res\">7-9</span> (un tesoro preciso, un sapere segreto). Con un fallimento organizza una spedizione rivale con ciò che gli hai detto.</p>","text":"Quando cerchi di convincere un PNG potente a finanziare una spedizione, tira su Astuzia. Con un successo ti dà 8-Valore in risorse e consumo, ma devi soddisfare una richiesta: generica con 10+ (ricchezze, informazioni, un trofeo), specifica con 7-9 (un tesoro preciso, un sapere segreto). Con un fallimento organizza una spedizione rivale con ciò che gli hai detto.","back":["pb-cercatore"]},{"id":"pb-cercatore-segni","title":"Attento ai Segni","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Attento ai Segni"],"html":"<p>Quando ti sintonizzi per la prima volta con una rovina studiandone segni e struttura, tira su <strong>Astuzia</strong>: <span class=\"res\">10+</span> tieni 3, <span class=\"res\">7-9</span> tieni 2, fallimento: segna fatica per tenerne 1. Nella rovina spendile per: individuare la via più rapida verso il tesoro o sapere più vicino; disinnescare una trappola o superare un pericolo naturale senza costi; subire tu il danno destinato a un personaggio vicino; raggiungere istantaneamente un personaggio nella rovina; metterti al riparo ignorando il danno di un attacco o di una catastrofe.</p>","text":"Quando ti sintonizzi per la prima volta con una rovina studiandone segni e struttura, tira su Astuzia: 10+ tieni 3, 7-9 tieni 2, fallimento: segna fatica per tenerne 1. Nella rovina spendile per: individuare la via più rapida verso il tesoro o sapere più vicino; disinnescare una trappola o superare un pericolo naturale senza costi; subire tu il danno destinato a un personaggio vicino; raggiungere istantaneamente un personaggio nella rovina; metterti al riparo ignorando il danno di un attacco o di una catastrofe.","back":["pb-cercatore","rovine-indice"]},{"id":"pb-cercatore-terreno","title":"Terreno Instabile","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Terreno Instabile"],"html":"<p>Quando sfrutti un ambiente caotico (rocce scivolose, mercato affollato) per avere vantaggio in combattimento, puoi <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a> con <strong>Destrezza</strong> invece di Vigore.</p>","text":"Quando sfrutti un ambiente caotico (rocce scivolose, mercato affollato) per avere vantaggio in combattimento, puoi Lottare con un Nemico con Destrezza invece di Vigore.","back":["pb-cercatore"]},{"id":"pb-trafficante","title":"Il Trafficante","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.67-72","aliases":["Trafficante","Dealer"],"html":"<p><em>Commerci oggetti importanti (reliquie, manufatti) e hai un impero da costruire.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia +2, Destrezza -1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Incalzare, Improvvisare, Tiro Rapido, Assaltare un Gruppo</li><li><strong>Imprese</strong>: Falsificare</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, corvo</li></ul><p><strong>Natura</strong></p><ul><li><em>Boss</em>: svuota la fatica quando dai un esempio pubblico punendo chi minaccia i tuoi affari.</li><li><em>Intermediario</em>: svuota la fatica quando convinci qualcuno di influente a entrare in un'alleanza vantaggiosa per entrambi.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Amico (ti ha tirato fuori da un affare finito male), Compagno (avete consegnato un tesoro a una fazione nonostante un sabotaggio).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-trafficante-rete\" data-id=\"pb-trafficante-rete\">Rete Segreta</a> e <a class=\"xl\" href=\"#pb-trafficante-investimenti\" data-id=\"pb-trafficante-investimenti\">Investimenti!</a> + una tra <a class=\"xl\" href=\"#pb-trafficante-ricerca\" data-id=\"pb-trafficante-ricerca\">Ricerca di Mercato</a>, <a class=\"xl\" href=\"#pb-trafficante-bilance\" data-id=\"pb-trafficante-bilance\">Bilancia Truccata</a>, <a class=\"xl\" href=\"#pb-trafficante-valore\" data-id=\"pb-trafficante-valore\">La Parte Migliore del Valore</a>, <a class=\"xl\" href=\"#pb-trafficante-gracchiare\" data-id=\"pb-trafficante-gracchiare\">Fare il Galletto</a>.</p>","text":"Commerci oggetti importanti (reliquie, manufatti) e hai un impero da costruire. - Caratteristiche: Carisma +1, Astuzia +2, Destrezza -1, Fortuna 0, Vigore 0 - Abilità iniziale: Incalzare, Improvvisare, Tiro Rapido, Assaltare un Gruppo - Imprese: Falsificare - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, corvo Natura - Boss: svuota la fatica quando dai un esempio pubblico punendo chi minaccia i tuoi affari. - Intermediario: svuota la fatica quando convinci qualcuno di influente a entrare in un'alleanza vantaggiosa per entrambi. Motivazioni: Crimine, Avidità, Lealtà, Zampe Pulite. Legami: Amico (ti ha tirato fuori da un affare finito male), Compagno (avete consegnato un tesoro a una fazione nonostante un sabotaggio). Mosse: inizi con Rete Segreta e Investimenti! + una tra Ricerca di Mercato, Bilancia Truccata, La Parte Migliore del Valore, Fare il Galletto.","back":["playbook-indice"]},{"id":"pb-trafficante-rete","title":"Rete Segreta","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Rete Segreta"],"html":"<p>All'inizio del gioco o quando il tempo passa, nomina una fazione attiva e tira su <strong>Astuzia</strong>. Con un successo la tua rete ti segnala un tesoro desiderato da un suo membro di alto rango, che pagherà equamente (circa 6-Valore per membro della banda) e garantirà la vostra sicurezza alla consegna; il GM sceglie fino a due complicazioni (luogo difficile da raggiungere; custodito da un'altra fazione o vagabondo; luogo particolarmente pericoloso). Con <span class=\"res\">10+</span> è così prezioso che un'altra fazione pagherebbe per tenerlo lontano (asta possibile). Con un fallimento un emissario ti chiede di recuperare un oggetto che avevi venduto a un'altra fazione: accetta o segna 3-nomea e fatti un nemico.</p>","text":"All'inizio del gioco o quando il tempo passa, nomina una fazione attiva e tira su Astuzia. Con un successo la tua rete ti segnala un tesoro desiderato da un suo membro di alto rango, che pagherà equamente (circa 6-Valore per membro della banda) e garantirà la vostra sicurezza alla consegna; il GM sceglie fino a due complicazioni (luogo difficile da raggiungere; custodito da un'altra fazione o vagabondo; luogo particolarmente pericoloso). Con 10+ è così prezioso che un'altra fazione pagherebbe per tenerlo lontano (asta possibile). Con un fallimento un emissario ti chiede di recuperare un oggetto che avevi venduto a un'altra fazione: accetta o segna 3-nomea e fatti un nemico.","back":["pb-trafficante"]},{"id":"pb-trafficante-investimenti","title":"Investimenti!","cat":"mosse","group":"Trafficante","src":"RS p.68-70","aliases":["Investimenti"],"html":"<p>Inizi con 10-Valore destinati agli Investimenti. Investendo almeno 5-Valore in una radura scegli un Investimento (uno per livello alla volta; poi aspetta che il tempo passi). Alcuni sono potenziamenti.</p><p><strong>5-Valore</strong>: <em>Picchiatori locali</em> (segna 2-consumo: piccolo gruppo per una scena); <em>Appoggio</em> (+1 continuo alle mosse di reputazione con la fazione di un notabile locale); <em>Occhi e orecchie</em> (+1 a Rete di Sussurri qui e nelle radure adiacenti); <em>Svendita</em> (un oggetto da 8-Valore a 5); <em>Prestito rischioso</em> (quando il tempo passa tira su Fortuna: rimborso di 10-Valore, oppure attenzioni di un capo fazione, oppure il debitore fugge).</p><p><strong>10-Valore</strong>: <em>Esattori robusti</em> (gruppo medio); <em>Amici altolocati</em> (segna fatica: un burocrate fa sparire prove o attenzioni); <em>Conoscere il territorio</em> (consulti uno storico su un tesoro: domande e +1 continuo); <em>Negozio</em> (+1 a imprese, capire, convincere, valutare e ingannare nel tuo locale); <em>Casa di prestiti</em> (riscuoti prestiti a ogni visita).</p><p><strong>15-Valore</strong>: <em>Apprendista</em> (crei un secondo PG); <em>Uno di noi</em> (un cambiamento importante nella radura; la tua Reputazione con i suoi abitanti conta +3); <em>Festa per i corvi</em> (la banda svuota la nomea con la fazione dominante e porta la Reputazione a 0 o segna 10-prestigio); <em>Salone espositivo</em> (ogni tesoro esposto: 5-prestigio con ogni fazione e svuoti la fatica).</p>","text":"Inizi con 10-Valore destinati agli Investimenti. Investendo almeno 5-Valore in una radura scegli un Investimento (uno per livello alla volta; poi aspetta che il tempo passi). Alcuni sono potenziamenti. 5-Valore: Picchiatori locali (segna 2-consumo: piccolo gruppo per una scena); Appoggio (+1 continuo alle mosse di reputazione con la fazione di un notabile locale); Occhi e orecchie (+1 a Rete di Sussurri qui e nelle radure adiacenti); Svendita (un oggetto da 8-Valore a 5); Prestito rischioso (quando il tempo passa tira su Fortuna: rimborso di 10-Valore, oppure attenzioni di un capo fazione, oppure il debitore fugge). 10-Valore: Esattori robusti (gruppo medio); Amici altolocati (segna fatica: un burocrate fa sparire prove o attenzioni); Conoscere il territorio (consulti uno storico su un tesoro: domande e +1 continuo); Negozio (+1 a imprese, capire, convincere, valutare e ingannare nel tuo locale); Casa di prestiti (riscuoti prestiti a ogni visita). 15-Valore: Apprendista (crei un secondo PG); Uno di noi (un cambiamento importante nella radura; la tua Reputazione con i suoi abitanti conta +3); Festa per i corvi (la banda svuota la nomea con la fazione dominante e porta la Reputazione a 0 o segna 10-prestigio); Salone espositivo (ogni tesoro esposto: 5-prestigio con ogni fazione e svuoti la fatica).","back":["pb-trafficante"]},{"id":"pb-trafficante-ricerca","title":"Ricerca di Mercato","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Ricerca di Mercato"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le intenzioni</a> di qualcuno puoi sempre chiedere (anche con un fallimento) \"Di cosa ha disperatamente bisogno?\", con +1 agendo sulla risposta.</p>","text":"Quando capisci le intenzioni di qualcuno puoi sempre chiedere (anche con un fallimento) \"Di cosa ha disperatamente bisogno?\", con +1 agendo sulla risposta.","back":["pb-trafficante"]},{"id":"pb-trafficante-bilance","title":"Bilancia Truccata","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Bilancia Truccata"],"html":"<p>Ottieni Borseggiare e Gioco di Prestigio (fuori limite). Quando tenti un'impresa per frodare qualcuno di un bene, tira su <strong>Astuzia</strong>.</p>","text":"Ottieni Borseggiare e Gioco di Prestigio (fuori limite). Quando tenti un'impresa per frodare qualcuno di un bene, tira su Astuzia.","back":["pb-trafficante"]},{"id":"pb-trafficante-valore","title":"La Parte Migliore del Valore","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["La Parte Migliore del Valore"],"html":"<p>Quando fingi teatralmente la tua morte durante uno scontro mettendoti fuori portata (cadere da un dirupo, gettarti nel fiume), tira su <strong>Astuzia</strong>. Con un successo ci cascano e vivi per combattere un altro giorno; con <span class=\"res\">7-9</span> perdi anche qualcosa di prezioso. Con un fallimento subisci 2-ferite e i nemici ti sono ancora addosso.</p>","text":"Quando fingi teatralmente la tua morte durante uno scontro mettendoti fuori portata (cadere da un dirupo, gettarti nel fiume), tira su Astuzia. Con un successo ci cascano e vivi per combattere un altro giorno; con 7-9 perdi anche qualcosa di prezioso. Con un fallimento subisci 2-ferite e i nemici ti sono ancora addosso.","back":["pb-trafficante"]},{"id":"pb-trafficante-gracchiare","title":"Fare il Galletto","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Fare il Galletto"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-trafficante"]},{"id":"pb-buongustaio","title":"Lo Chef","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.73-76","aliases":["Chef","Gourmand"],"html":"<p><em>Un maestro nel trasformare ingredienti in arte; i migliori si trovano nei Boschi selvaggi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: due a scelta</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, puzzola</li></ul><p><strong>Natura</strong></p><ul><li><em>Perfezionista</em>: svuota la fatica quando rifiuti con sdegno qualcosa perché pretendi (irragionevolmente) di meglio.</li><li><em>Fornitore</em>: svuota la fatica quando dai conforto o sostentamento a chi ne è privo, a tue spese.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>.</p><p><strong>Legami</strong>: Familiare (ti prendevi cura di lui), Amico (ti portava ingredienti in cambio di un pasto).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-buongustaio-erbe\" data-id=\"pb-buongustaio-erbe\">Erbe e Spezie</a>, <a class=\"xl\" href=\"#pb-buongustaio-ricetta\" data-id=\"pb-buongustaio-ricetta\">La Ricetta per il Successo</a> e <a class=\"xl\" href=\"#pb-buongustaio-servizio\" data-id=\"pb-buongustaio-servizio\">Servizio Eccellente</a> (+ altre con l'avanzamento: <a class=\"xl\" href=\"#pb-buongustaio-filetto\" data-id=\"pb-buongustaio-filetto\">Il Filetto Perfetto</a>, <a class=\"xl\" href=\"#pb-buongustaio-campo\" data-id=\"pb-buongustaio-campo\">Fuoco da Campo</a>, <a class=\"xl\" href=\"#pb-buongustaio-maestro\" data-id=\"pb-buongustaio-maestro\">Chef Rinomato</a>).</p>","text":"Un maestro nel trasformare ingredienti in arte; i migliori si trovano nei Boschi selvaggi. - Caratteristiche: Carisma +1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore -1 - Abilità iniziale: Confondere i Sensi, Improvvisare, Tiro Rapido, Tiro da Maestro - Imprese: due a scelta - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, puzzola Natura - Perfezionista: svuota la fatica quando rifiuti con sdegno qualcosa perché pretendi (irragionevolmente) di meglio. - Fornitore: svuota la fatica quando dai conforto o sostentamento a chi ne è privo, a tue spese. Motivazioni: Ambizione, Zampe Pulite, Scoperta, Lealtà. Legami: Familiare (ti prendevi cura di lui), Amico (ti portava ingredienti in cambio di un pasto). Mosse: inizi con Erbe e Spezie, La Ricetta per il Successo e Servizio Eccellente (+ altre con l'avanzamento: Il Filetto Perfetto, Fuoco da Campo, Chef Rinomato).","back":["playbook-indice"]},{"id":"pb-buongustaio-erbe","title":"Erbe e Spezie","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Erbe e Spezie"],"html":"<p>Quando cerchi ingredienti in un ambiente adatto, tira su <strong>Astuzia</strong>. Con un successo il GM ti indica un ingrediente utile (1+ Valore) e come raccoglierlo in sicurezza; con <span class=\"res\">10+</span> vale almeno 3-Valore. Con un fallimento non trovi nulla di accettabile: segna 2-fatica.</p>","text":"Quando cerchi ingredienti in un ambiente adatto, tira su Astuzia. Con un successo il GM ti indica un ingrediente utile (1+ Valore) e come raccoglierlo in sicurezza; con 10+ vale almeno 3-Valore. Con un fallimento non trovi nulla di accettabile: segna 2-fatica.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-ricetta","title":"La Ricetta per il Successo","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["La Ricetta per il Successo"],"html":"<p>Quando cucini un pasto impressionante, tira su <strong>Destrezza</strong>. Con un successo scegli benefici pari al Valore degli ingredienti e 1 costo; con <span class=\"res\">10+</span> è eccezionale: 2 benefici in più. Con un fallimento è un disastro: segna 3-fatica e finisci il pasto, oppure non puoi più svuotare fatica finché non ne cucini uno riuscito.</p><ul><li><em>Benefici</em>: svuota 2-fatica (una sola volta); svuota 1-ferita (anche due volte); chiarezza (il GM ti illumina sui problemi); cuore leggero (PNG svuotano il morale, PG +1 continuo a un obiettivo della sessione).</li><li><em>Costi</em>: molto tempo; 2-consumo; 2-fatica; 1-ferita.</li></ul>","text":"Quando cucini un pasto impressionante, tira su Destrezza. Con un successo scegli benefici pari al Valore degli ingredienti e 1 costo; con 10+ è eccezionale: 2 benefici in più. Con un fallimento è un disastro: segna 3-fatica e finisci il pasto, oppure non puoi più svuotare fatica finché non ne cucini uno riuscito. - Benefici: svuota 2-fatica (una sola volta); svuota 1-ferita (anche due volte); chiarezza (il GM ti illumina sui problemi); cuore leggero (PNG svuotano il morale, PG +1 continuo a un obiettivo della sessione). - Costi: molto tempo; 2-consumo; 2-fatica; 1-ferita.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-servizio","title":"Servizio Eccellente","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Servizio Eccellente"],"html":"<p>Quando servi un pasto impressionante a un PNG importante, tira su <strong>Carisma</strong>. Scegli 1 (<span class=\"res\">7-9</span>) o 2 (<span class=\"res\">10+</span>), +1 se il pasto era eccezionale (ognuna sceglibile due volte): risponde sinceramente a una domanda; diffonde la tua fama (3-prestigio); smentisce i tuoi misfatti (cancella 3-nomea); ti fa un dono da 2-Valore; ti aiuta come con <span class=\"res\">10+</span> su <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a>.</p>","text":"Quando servi un pasto impressionante a un PNG importante, tira su Carisma. Scegli 1 (7-9) o 2 (10+), +1 se il pasto era eccezionale (ognuna sceglibile due volte): risponde sinceramente a una domanda; diffonde la tua fama (3-prestigio); smentisce i tuoi misfatti (cancella 3-nomea); ti fa un dono da 2-Valore; ti aiuta come con 10+ su Chiedere un Favore.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-filetto","title":"Il Filetto Perfetto","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Il Filetto Perfetto"],"html":"<p>Ottieni <a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a> (fuori limite). Con un utensile da cucina tiri su <strong>Destrezza</strong>.</p>","text":"Ottieni Colpo Crudele (fuori limite). Con un utensile da cucina tiri su Destrezza.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-campo","title":"Fuoco da Campo","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Fuoco da Campo"],"html":"<p>Quando cucini per vagabondi che dormono all'aperto, segna 1-fatica o 1-consumo: ognuno svuota 2-fatica extra.</p>","text":"Quando cucini per vagabondi che dormono all'aperto, segna 1-fatica o 1-consumo: ognuno svuota 2-fatica extra.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-maestro","title":"Chef Rinomato","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Chef Rinomato"],"html":"<p>Quando convinci un PNG promettendogli un pasto impressionante, aggiungi anche la tua Reputazione con la sua fazione al Carisma (max +4).</p>","text":"Quando convinci un PNG promettendogli un pasto impressionante, aggiungi anche la tua Reputazione con la sua fazione al Carisma (max +4).","back":["pb-buongustaio"]},{"id":"pb-cacciatore","title":"Il Cacciatore","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.77-80","aliases":["Cacciatore","cacciatore di mostri","Hunter"],"html":"<p><em>Un nemico rapido e intelligente dei grandi mostri dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +2, Fortuna -1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Attaccare alle Spalle, Disattivare un Congegno, Nascondersi</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, cardellino</li></ul><p><strong>Natura</strong></p><ul><li><em>Scettico</em>: svuota la fatica quando metti in dubbio apertamente e pericolosamente le intenzioni di un potente.</li><li><em>Romantico</em>: svuota la fatica quando ti rendi vulnerabile con qualcuno di cui speri di fidarti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>.</p><p><strong>Legami</strong>: Sentinella (ha danneggiato degli abitanti), Professionista (avete affrontato insieme un mostro).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cacciatore-trappole\" data-id=\"pb-cacciatore-trappole\">Lacci e Trappole</a> + due tra <a class=\"xl\" href=\"#pb-cacciatore-pista\" data-id=\"pb-cacciatore-pista\">Seguire Tracce</a>, <a class=\"xl\" href=\"#pb-cacciatore-bestie\" data-id=\"pb-cacciatore-bestie\">Ammazzabestie</a>, <a class=\"xl\" href=\"#pb-cacciatore-sprechi\" data-id=\"pb-cacciatore-sprechi\">Nessuno Spreco</a>, <a class=\"xl\" href=\"#pb-cacciatore-pozioni\" data-id=\"pb-cacciatore-pozioni\">Impiastri, Unguenti e Infusi</a>, <a class=\"xl\" href=\"#pb-cacciatore-sguardo\" data-id=\"pb-cacciatore-sguardo\">La Fama del Cacciatore</a>.</p>","text":"Un nemico rapido e intelligente dei grandi mostri dei Boschi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +2, Fortuna -1, Vigore +1 - Abilità iniziale: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele - Imprese: Attaccare alle Spalle, Disattivare un Congegno, Nascondersi - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, cardellino Natura - Scettico: svuota la fatica quando metti in dubbio apertamente e pericolosamente le intenzioni di un potente. - Romantico: svuota la fatica quando ti rendi vulnerabile con qualcuno di cui speri di fidarti. Motivazioni: Giustizia, Protezione, Libertà, Avidità. Legami: Sentinella (ha danneggiato degli abitanti), Professionista (avete affrontato insieme un mostro). Mosse: inizi con Lacci e Trappole + due tra Seguire Tracce, Ammazzabestie, Nessuno Spreco, Impiastri, Unguenti e Infusi, La Fama del Cacciatore.","back":["playbook-indice","mostri-indice"]},{"id":"pb-cacciatore-trappole","title":"Lacci e Trappole","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Lacci e Trappole"],"html":"<p>Quando prepari trappole in un'area, tira su <strong>Destrezza</strong>. Con un successo segna consumo (min 1) per creare un oggetto <em>Trappole</em> con usura pari al doppio; con <span class=\"res\">10+</span> +4 usura. Segna usura sulle Trappole per far scattare una trappola a qualsiasi distanza contro un nemico nell'area (attaccare in mischia o prendere la mira, o segna un'altra usura per un'abilità), tirando sempre con +0; se la mossa ti dice di subire danno, segna invece usura sulle Trappole; se una trappola infligge danno, segna usura per +1 danno. Con un fallimento scopri un problema serio da risolvere prima.</p>","text":"Quando prepari trappole in un'area, tira su Destrezza. Con un successo segna consumo (min 1) per creare un oggetto Trappole con usura pari al doppio; con 10+ +4 usura. Segna usura sulle Trappole per far scattare una trappola a qualsiasi distanza contro un nemico nell'area (attaccare in mischia o prendere la mira, o segna un'altra usura per un'abilità), tirando sempre con +0; se la mossa ti dice di subire danno, segna invece usura sulle Trappole; se una trappola infligge danno, segna usura per +1 danno. Con un fallimento scopri un problema serio da risolvere prima.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-pista","title":"Seguire Tracce","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Seguire Tracce"],"html":"<p>Quando segui qualcuno o qualcosa, tira su <strong>Astuzia</strong>. Con <span class=\"res\">10+</span> sai dove sta andando. Con <span class=\"res\">7-9</span> la pista è labile: se non la segui subito, non troverai la meta. Con un fallimento il GM ti dice quale nuovo pericolo ti coglie.</p>","text":"Quando segui qualcuno o qualcosa, tira su Astuzia. Con 10+ sai dove sta andando. Con 7-9 la pista è labile: se non la segui subito, non troverai la meta. Con un fallimento il GM ti dice quale nuovo pericolo ti coglie.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-bestie","title":"Ammazzabestie","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Ammazzabestie"],"html":"<p>Segna fatica e 2-nomea con la fazione del bersaglio per fare una <a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> tirando su <strong>Vigore</strong> invece della Reputazione.</p>","text":"Segna fatica e 2-nomea con la fazione del bersaglio per fare una Fare una Minaccia Diretta tirando su Vigore invece della Reputazione.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-sprechi","title":"Nessuno Spreco","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Nessuno Spreco"],"html":"<p>Quando frughi tra i resti di una battaglia recente, segna 2-nomea con la fazione dei presenti legati ai resti e tira su <strong>Destrezza</strong>. Scegli 1 (<span class=\"res\">7-9</span>) o entrambe (<span class=\"res\">10+</span>): oggetti di valore (3-6 Valore); un oggetto subito utile. Con un fallimento trovi poco (1-2 Valore) e ciò che hai visto ti perseguita: segna 2-fatica.</p>","text":"Quando frughi tra i resti di una battaglia recente, segna 2-nomea con la fazione dei presenti legati ai resti e tira su Destrezza. Scegli 1 (7-9) o entrambe (10+): oggetti di valore (3-6 Valore); un oggetto subito utile. Con un fallimento trovi poco (1-2 Valore) e ciò che hai visto ti perseguita: segna 2-fatica.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-pozioni","title":"Impiastri, Unguenti e Infusi","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Impiastri Unguenti e Infusi"],"html":"<p>Con tempo a disposizione, spendi consumo 1 a 1 per preparare intrugli a effetto singolo: <em>Guarigione</em> (segna fatica, svuota 1-ferita); <em>Consapevolezza</em> (segna fatica, una domanda di valutare); <em>Energia</em> (svuota tutta la fatica, a fine scena segna 2-ferite); <em>Rapidità</em> (segna fatica, cambi distanza velocemente); <em>Frenesia</em> (segna fatica, +1-ferita al prossimo danno della scena).</p>","text":"Con tempo a disposizione, spendi consumo 1 a 1 per preparare intrugli a effetto singolo: Guarigione (segna fatica, svuota 1-ferita); Consapevolezza (segna fatica, una domanda di valutare); Energia (svuota tutta la fatica, a fine scena segna 2-ferite); Rapidità (segna fatica, cambi distanza velocemente); Frenesia (segna fatica, +1-ferita al prossimo danno della scena).","back":["pb-cacciatore"]},{"id":"pb-cacciatore-sguardo","title":"La Fama del Cacciatore","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["La Fama del Cacciatore"],"html":"<p>Quando <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a> presentandoti come cacciatore, puoi segnare nomea con la sua fazione per tirare con +1 invece della Reputazione.</p>","text":"Quando incontri qualcuno di importante presentandoti come cacciatore, puoi segnare nomea con la sua fazione per tirare con +1 invece della Reputazione.","back":["pb-cacciatore"]},{"id":"pb-nomade","title":"Il Nomade","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.81-84","aliases":["Nomade","Nomad"],"html":"<p><em>Non sei dei Boschi: hai viaggiato a lungo e vuoi vedere tutto di questa terra in guerra.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Parare, Assaltare un Gruppo, Tiro da Maestro</li><li><strong>Imprese</strong>: tre a scelta</li><li><strong>Valore iniziale</strong>: 7</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lemure</li></ul><p><strong>Natura</strong></p><ul><li><em>Stolto</em>: svuota la fatica quando metti in imbarazzo un'autorità dicendo pubblicamente una verità che nessuno osa dirle.</li><li><em>Saggio</em>: svuota la fatica quando convinci un abitante ad abbandonare un'usanza o un ruolo che non gli serve più.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Sentinella (l'hai visto fare qualcosa di coraggioso e sciocco), Protettore (è ancora inesperto).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-nomade-piedi\" data-id=\"pb-nomade-piedi\">Smania di Partire</a> e <a class=\"xl\" href=\"#pb-nomade-straniero\" data-id=\"pb-nomade-straniero\">Straniero in Terra Straniera</a> + una tra <a class=\"xl\" href=\"#pb-nomade-verita\" data-id=\"pb-nomade-verita\">La Verità al Potere</a>, <a class=\"xl\" href=\"#pb-nomade-stella\" data-id=\"pb-nomade-stella\">Nato Sotto una Stella Cometa</a>, <a class=\"xl\" href=\"#pb-nomade-visto\" data-id=\"pb-nomade-visto\">Non è la Prima Volta</a>, <a class=\"xl\" href=\"#pb-nomade-prendo\" data-id=\"pb-nomade-prendo\">Questa la Prendo Io</a>.</p>","text":"Non sei dei Boschi: hai viaggiato a lungo e vuoi vedere tutto di questa terra in guerra. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +1, Vigore +1 - Abilità iniziale: Fracassare, Parare, Assaltare un Gruppo, Tiro da Maestro - Imprese: tre a scelta - Valore iniziale: 7 - Specie: volpe, topo, coniglio, uccello, lemure Natura - Stolto: svuota la fatica quando metti in imbarazzo un'autorità dicendo pubblicamente una verità che nessuno osa dirle. - Saggio: svuota la fatica quando convinci un abitante ad abbandonare un'usanza o un ruolo che non gli serve più. Motivazioni: Princìpi, Libertà, Brivido, Voglia di Viaggiare. Legami: Sentinella (l'hai visto fare qualcosa di coraggioso e sciocco), Protettore (è ancora inesperto). Mosse: inizi con Smania di Partire e Straniero in Terra Straniera + una tra La Verità al Potere, Nato Sotto una Stella Cometa, Non è la Prima Volta, Questa la Prendo Io.","back":["playbook-indice"]},{"id":"pb-nomade-piedi","title":"Smania di Partire","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Smania di Partire"],"html":"<p>Quando metti a frutto le esperienze di viaggio per risolvere un problema, segna una condizione per prendere <span class=\"res\">10+</span> senza tirare su qualsiasi mossa:</p><ul><li><em>Annoiato</em>: barra una casella di fatica (non svuotabile); impara un'abilità o tradizione locale per guarire.</li><li><em>Irritabile</em>: -2 a convincere; guarisci provando un'usanza locale rilassante.</li><li><em>Apatico</em>: -2 a ingannare; guarisci con un divertimento locale eccitante.</li><li><em>Distratto</em>: -2 alle imprese da furfante; guarisci aiutando un abitante in un lavoro faticoso.</li></ul><p>Lasciando una radura per la strada aperta, guarisci una condizione e la banda ha +1 alla mossa di viaggio.</p>","text":"Quando metti a frutto le esperienze di viaggio per risolvere un problema, segna una condizione per prendere 10+ senza tirare su qualsiasi mossa: - Annoiato: barra una casella di fatica (non svuotabile); impara un'abilità o tradizione locale per guarire. - Irritabile: -2 a convincere; guarisci provando un'usanza locale rilassante. - Apatico: -2 a inga
