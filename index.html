provazione ha conseguenze.","back":["pb-avventuriero"]},{"id":"pb-canaglia","title":"La Canaglia","cat":"playbook","group":"Manuale Base","src":"B p.137-140","aliases":["Canaglia"],"html":"<p><em>Un vagabondo fortunato e pericoloso, piromane e piantagrane teatrale.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +2, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Tiro Rapido, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Sgattaiolare, Nascondersi</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, gatto</li></ul><p><strong>Natura</strong></p><ul><li><em>Incendiario</em>: svuota la fatica quando usi metodi inutilmente distruttivi per risolvere un problema.</li><li><em>Agguerrito</em>: svuota la fatica quando cerchi di combattere un nemico più forte di te.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Amico (un'impresa folle e impossibile insieme), Compagno (avete distrutto le risorse di una fazione per conto di un'altra).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-canaglia-esplosiva\" data-id=\"pb-canaglia-esplosiva\">Personalità Esplosiva</a>, <a class=\"xl\" href=\"#pb-canaglia-creare\" data-id=\"pb-canaglia-creare\">Creare per Distruggere</a>, <a class=\"xl\" href=\"#pb-canaglia-diversivo\" data-id=\"pb-canaglia-diversivo\">È un Diversivo!</a>, <a class=\"xl\" href=\"#pb-canaglia-temerario\" data-id=\"pb-canaglia-temerario\">Temerario</a>, <a class=\"xl\" href=\"#pb-canaglia-mascherato\" data-id=\"pb-canaglia-mascherato\">Vagabondo Mascherato</a>, <a class=\"xl\" href=\"#pb-canaglia-fortunato\" data-id=\"pb-canaglia-fortunato\">Meglio Fortunato che Bravo</a>.</p>","text":"Un vagabondo fortunato e pericoloso, piromane e piantagrane teatrale. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +2, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Tiro Rapido, Colpo Crudele - Imprese: Acrobazie, Sgattaiolare, Nascondersi - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, gatto Natura - Incendiario: svuota la fatica quando usi metodi inutilmente distruttivi per risolvere un problema. - Agguerrito: svuota la fatica quando cerchi di combattere un nemico più forte di te. Motivazioni: Caos, Brivido, Crimine, Infamia. Legami: Amico (un'impresa folle e impossibile insieme), Compagno (avete distrutto le risorse di una fazione per conto di un'altra). Mosse (tre): Personalità Esplosiva, Creare per Distruggere, È un Diversivo!, Temerario, Vagabondo Mascherato, Meglio Fortunato che Bravo.","back":["playbook-indice","nature-indice"]},{"id":"pb-canaglia-esplosiva","title":"Personalità Esplosiva","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Personalità Esplosiva"],"html":"<p>Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi qualcosa</a> con strumenti molto pericolosi (esplosivi, incendi incontrollati), tira su <strong>Fortuna</strong> invece di Vigore.</p>","text":"Quando distruggi qualcosa con strumenti molto pericolosi (esplosivi, incendi incontrollati), tira su Fortuna invece di Vigore.","back":["pb-canaglia"]},{"id":"pb-canaglia-creare","title":"Creare per Distruggere","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Creare per Distruggere"],"html":"<p>Quando usi i materiali disponibili per assemblare un congegno pericoloso, tira su <strong>Destrezza</strong>. Con un successo crei qualcosa che funziona una volta sola. Con <span class=\"res\">10+</span> scegli 1, con <span class=\"res\">7-9</span> due: è più pericoloso / più grande e scomodo / più fragile di quanto pensassi. Puoi segnare consumo per i materiali mancanti.</p>","text":"Quando usi i materiali disponibili per assemblare un congegno pericoloso, tira su Destrezza. Con un successo crei qualcosa che funziona una volta sola. Con 10+ scegli 1, con 7-9 due: è più pericoloso / più grande e scomodo / più fragile di quanto pensassi. Puoi segnare consumo per i materiali mancanti.","back":["pb-canaglia"]},{"id":"pb-canaglia-diversivo","title":"È un Diversivo!","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["È un Diversivo"],"html":"<p>Ottieni l'impresa <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> (fuori limite). Quando la tenti contro qualcuno distratto da una minaccia ambientale (incendio, inondazione), tira su <strong>Fortuna</strong>.</p>","text":"Ottieni l'impresa Attaccare alle Spalle (fuori limite). Quando la tenti contro qualcuno distratto da una minaccia ambientale (incendio, inondazione), tira su Fortuna.","back":["pb-canaglia"]},{"id":"pb-canaglia-temerario","title":"Temerario","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Temerario"],"html":"<p>Quando ti lanci nel pericolo senza pensarci né pianificare, sei \"protetto dalla fortuna\": come un'armatura con 1 casella di usura, che svanisce passato il pericolo e torna disponibile la volta successiva.</p>","text":"Quando ti lanci nel pericolo senza pensarci né pianificare, sei \"protetto dalla fortuna\": come un'armatura con 1 casella di usura, che svanisce passato il pericolo e torna disponibile la volta successiva.","back":["pb-canaglia"]},{"id":"pb-canaglia-mascherato","title":"Vagabondo Mascherato","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Vagabondo Mascherato"],"html":"<p>Hai una maschera o un costume (equipaggiamento, 2 usura), biglietto da visita più che travestimento. Mentre la indossi la <strong>nomea è raddoppiata</strong> e il prestigio dimezzato, e hai <strong>+1</strong> ad <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a> e alle mosse della Canaglia. Se te la rubano segna fatica; se viene distrutta segna 4-fatica (potrai farne un'altra).</p>","text":"Hai una maschera o un costume (equipaggiamento, 2 usura), biglietto da visita più che travestimento. Mentre la indossi la nomea è raddoppiata e il prestigio dimezzato, e hai +1 ad Affidarsi al Fato e alle mosse della Canaglia. Se te la rubano segna fatica; se viene distrutta segna 4-fatica (potrai farne un'altra).","back":["pb-canaglia"]},{"id":"pb-canaglia-fortunato","title":"Meglio Fortunato che Bravo","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Meglio Fortunato che Bravo"],"html":"<p>Quando usi una mossa con le armi (base o speciale), segna fatica per tirare su <strong>Fortuna</strong> invece della caratteristica indicata.</p>","text":"Quando usi una mossa con le armi (base o speciale), segna fatica per tirare su Fortuna invece della caratteristica indicata.","back":["pb-canaglia"]},{"id":"pb-ciarlatano","title":"Il Ciarlatano","cat":"playbook","group":"Manuale Base","src":"B p.141-144","aliases":["Ciarlatano"],"html":"<p><em>Un truffatore affascinante che la scampa sempre e mette i nemici l'uno contro l'altro.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza -1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Incalzare, Improvvisare, Tiro Rapido, Colpo Crudele</li><li><strong>Imprese</strong>: Scassinare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, opossum</li></ul><p><strong>Natura</strong></p><ul><li><em>Ingordo</em>: svuota la fatica quando ti abbandoni a vizi (bere, cibo, gioco d'azzardo).</li><li><em>Imbroglione</em>: svuota la fatica quando cerchi di truffare qualcuno di potente o pericoloso.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Familiare (ti ha salvato dopo un grande furto finito male), Sentinella (ha capito che lo imbrogliavi e ti ha truffato a sua volta).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ciarlatano-istigatore\" data-id=\"pb-ciarlatano-istigatore\">Istigatore</a>, <a class=\"xl\" href=\"#pb-ciarlatano-leccazampe\" data-id=\"pb-ciarlatano-leccazampe\">Leccazampe</a>, <a class=\"xl\" href=\"#pb-ciarlatano-sorriso\" data-id=\"pb-ciarlatano-sorriso\">Sorriso Disperato</a>, <a class=\"xl\" href=\"#pb-ciarlatano-provocatore\" data-id=\"pb-ciarlatano-provocatore\">Provocatore</a>, <a class=\"xl\" href=\"#pb-ciarlatano-gioco\" data-id=\"pb-ciarlatano-gioco\">Facciamo un Gioco</a>, <a class=\"xl\" href=\"#pb-ciarlatano-sabbia\" data-id=\"pb-ciarlatano-sabbia\">Sabbia nelle Tasche</a>.</p>","text":"Un truffatore affascinante che la scampa sempre e mette i nemici l'uno contro l'altro. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza -1, Fortuna 0, Vigore 0 - Abilità iniziale: Incalzare, Improvvisare, Tiro Rapido, Colpo Crudele - Imprese: Scassinare, Gioco di Prestigio - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, opossum Natura - Ingordo: svuota la fatica quando ti abbandoni a vizi (bere, cibo, gioco d'azzardo). - Imbroglione: svuota la fatica quando cerchi di truffare qualcuno di potente o pericoloso. Motivazioni: Caos, Brivido, Zampe Pulite, Voglia di Viaggiare. Legami: Familiare (ti ha salvato dopo un grande furto finito male), Sentinella (ha capito che lo imbrogliavi e ti ha truffato a sua volta). Mosse (tre): Istigatore, Leccazampe, Sorriso Disperato, Provocatore, Facciamo un Gioco, Sabbia nelle Tasche.","back":["playbook-indice","nature-indice"]},{"id":"pb-ciarlatano-istigatore","title":"Istigatore","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Istigatore"],"html":"<p>Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni un PNG</a> per metterlo contro un altro PNG, scarta un'opzione dall'elenco del <span class=\"res\">7-9</span>: il PNG non può sceglierla.</p>","text":"Quando inganni un PNG per metterlo contro un altro PNG, scarta un'opzione dall'elenco del 7-9: il PNG non può sceglierla.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-leccazampe","title":"Leccazampe","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Leccazampe"],"html":"<p>Quando fai il ruffiano con un PNG ignaro, tira su <strong>Carisma</strong>: <span class=\"res\">10+</span> tieni 3 prese, <span class=\"res\">7-9</span> tieni 2. Ogni presa devia sospetti o ostilità su qualcun altro o qualcos'altro. Con un fallimento si insospettisce e ti tiene d'occhio.</p>","text":"Quando fai il ruffiano con un PNG ignaro, tira su Carisma: 10+ tieni 3 prese, 7-9 tieni 2. Ogni presa devia sospetti o ostilità su qualcun altro o qualcos'altro. Con un fallimento si insospettisce e ti tiene d'occhio.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-sorriso","title":"Sorriso Disperato","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Sorriso Disperato"],"html":"<p>Quando ti <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">affidi al fato</a> implorando o umiliandoti, tira su <strong>Carisma</strong> invece di Fortuna.</p>","text":"Quando ti affidi al fato implorando o umiliandoti, tira su Carisma invece di Fortuna.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-provocatore","title":"Provocatore","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Provocatore"],"html":"<p>Quando giochi sulle insicurezze o paure di un nemico per distrarlo in combattimento, tira su <strong>Destrezza</strong>. Con un successo ti crei un'occasione: usa una mossa con le armi con +1, oppure colpisci rapidamente infliggendo danno. Con <span class=\"res\">7-9</span> lo innervosisci: non ti ascolterà più finché la situazione non cambia. Con un fallimento si arrabbia e ti coglie alla sprovvista. Spesso preceduta da <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a>.</p>","text":"Quando giochi sulle insicurezze o paure di un nemico per distrarlo in combattimento, tira su Destrezza. Con un successo ti crei un'occasione: usa una mossa con le armi con +1, oppure colpisci rapidamente infliggendo danno. Con 7-9 lo innervosisci: non ti ascolterà più finché la situazione non cambia. Con un fallimento si arrabbia e ti coglie alla sprovvista. Spesso preceduta da Capire le Intenzioni.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-gioco","title":"Facciamo un Gioco","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Facciamo un Gioco"],"html":"<p>Quando sfidi qualcuno a un gioco di abilità e ingegno per farlo parlare, tira su <strong>Carisma</strong>. Con un successo si lascia sfuggire qualcosa di utile. Con <span class=\"res\">7-9</span> devi perdere per farlo parlare: segna consumo. Con un fallimento è più bravo di te: segna consumo e limita le perdite, oppure segna 3-consumo per farlo parlare.</p>","text":"Quando sfidi qualcuno a un gioco di abilità e ingegno per farlo parlare, tira su Carisma. Con un successo si lascia sfuggire qualcosa di utile. Con 7-9 devi perdere per farlo parlare: segna consumo. Con un fallimento è più bravo di te: segna consumo e limita le perdite, oppure segna 3-consumo per farlo parlare.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-sabbia","title":"Sabbia nelle Tasche","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Sabbia nelle Tasche"],"html":"<p>Ottieni <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a> (fuori limite). Quando lanci qualcosa per confondere un avversario a distanza ravvicinata o a contatto, tira su <strong>Astuzia</strong> invece di Destrezza.</p>","text":"Ottieni Confondere i Sensi (fuori limite). Quando lanci qualcosa per confondere un avversario a distanza ravvicinata o a contatto, tira su Astuzia invece di Destrezza.","back":["pb-ciarlatano"]},{"id":"pb-giudice","title":"Il Giudice","cat":"playbook","group":"Manuale Base","src":"B p.145-148","aliases":["Giudice"],"html":"<p><em>Un guerriero ostinato e potente, a metà tra mercenario e protettore, che si schiera troppo facilmente.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia 0, Destrezza 0, Fortuna -1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Parare, Assaltare un Gruppo</li><li><strong>Imprese</strong>: una a scelta</li><li><strong>Valore iniziale</strong>: 10</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, tasso</li></ul><p><strong>Natura</strong></p><ul><li><em>Difensore</em>: svuota la fatica quando ti esponi al pericolo per difendere qualcuno da un'ingiustizia o una minaccia.</li><li><em>Punitore</em>: svuota la fatica quando prometti faccia a faccia a un nemico potente che lo punirai.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Protettore (l'hai salvato da un colpo mortale), Compagno (avete aiutato una fazione a prendere una radura).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-giudice-bruto\" data-id=\"pb-giudice-bruto\">Bruto</a>, <a class=\"xl\" href=\"#pb-giudice-bastone\" data-id=\"pb-giudice-bastone\">La Politica del Bastone</a>, <a class=\"xl\" href=\"#pb-giudice-rompi\" data-id=\"pb-giudice-rompi\">Rompi e Spacca</a>, <a class=\"xl\" href=\"#pb-giudice-resistente\" data-id=\"pb-giudice-resistente\">Resistente</a>, <a class=\"xl\" href=\"#pb-giudice-tiro\" data-id=\"pb-giudice-tiro\">Tiro Potente</a>, <a class=\"xl\" href=\"#pb-giudice-guardiano\" data-id=\"pb-giudice-guardiano\">Guardiano</a>.</p>","text":"Un guerriero ostinato e potente, a metà tra mercenario e protettore, che si schiera troppo facilmente. - Caratteristiche: Carisma +1, Astuzia 0, Destrezza 0, Fortuna -1, Vigore +2 - Abilità iniziale: Fracassare, Disarmare, Parare, Assaltare un Gruppo - Imprese: una a scelta - Valore iniziale: 10 - Specie: volpe, topo, coniglio, uccello, tasso Natura - Difensore: svuota la fatica quando ti esponi al pericolo per difendere qualcuno da un'ingiustizia o una minaccia. - Punitore: svuota la fatica quando prometti faccia a faccia a un nemico potente che lo punirai. Motivazioni: Giustizia, Princìpi, Lealtà, Protezione. Legami: Protettore (l'hai salvato da un colpo mortale), Compagno (avete aiutato una fazione a prendere una radura). Mosse (tre): Bruto, La Politica del Bastone, Rompi e Spacca, Resistente, Tiro Potente, Guardiano.","back":["playbook-indice","nature-indice"]},{"id":"pb-giudice-bruto","title":"Bruto","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Bruto"],"html":"<p>+1 Vigore (max +3).</p>","text":"+1 Vigore (max +3).","back":["pb-giudice"]},{"id":"pb-giudice-bastone","title":"La Politica del Bastone","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["La Politica del Bastone"],"html":"<p>Quando usi le parole per porre fine a una disputa o a uno scontro violento, tira su <strong>Carisma</strong>. Con un successo ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena). Con <span class=\"res\">10+</span> hai anche +1 continuo per trattare pacificamente con loro. Con un fallimento i PNG si rivoltano contro di te e i PG hanno +1 continuo contro di te per la scena.</p>","text":"Quando usi le parole per porre fine a una disputa o a uno scontro violento, tira su Carisma. Con un successo ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena). Con 10+ hai anche +1 continuo per trattare pacificamente con loro. Con un fallimento i PNG si rivoltano contro di te e i PG hanno +1 continuo contro di te per la scena.","back":["pb-giudice"]},{"id":"pb-giudice-rompi","title":"Rompi e Spacca","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Rompi e Spacca"],"html":"<p>Quando ti apri la strada a forza verso qualcosa o qualcuno, tira su <strong>Vigore</strong>. Con un successo lo raggiungi; scegli 1 (<span class=\"res\">10+</span>) o 2 (<span class=\"res\">7-9</span>): ti fai male (1-ferita); rompi qualcosa di significativo nell'ambiente; danneggi o perdi un pezzo di equipaggiamento (sceglie il GM, almeno 1 usura). Con un fallimento arrivi ma sei vulnerabile.</p>","text":"Quando ti apri la strada a forza verso qualcosa o qualcuno, tira su Vigore. Con un successo lo raggiungi; scegli 1 (10+) o 2 (7-9): ti fai male (1-ferita); rompi qualcosa di significativo nell'ambiente; danneggi o perdi un pezzo di equipaggiamento (sceglie il GM, almeno 1 usura). Con un fallimento arrivi ma sei vulnerabile.","back":["pb-giudice"]},{"id":"pb-giudice-resistente","title":"Resistente","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Resistente"],"html":"<p>Una casella extra di ferite. Quando il tempo passa o raggiungi una nuova radura, svuoti automaticamente 2-ferite.</p>","text":"Una casella extra di ferite. Quando il tempo passa o raggiungi una nuova radura, svuoti automaticamente 2-ferite.","back":["pb-giudice"]},{"id":"pb-giudice-tiro","title":"Tiro Potente","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Tiro Potente"],"html":"<p>Quando <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">prendi la mira</a> con un arco, segna usura sull'arco per tirare su <strong>Vigore</strong>. Con un successo segna fatica per +1-ferita; segna un'altra fatica perché il nemico non possa assorbire con l'armatura.</p>","text":"Quando prendi la mira con un arco, segna usura sull'arco per tirare su Vigore. Con un successo segna fatica per +1-ferita; segna un'altra fatica perché il nemico non possa assorbire con l'armatura.","back":["pb-giudice"]},{"id":"pb-giudice-guardiano","title":"Guardiano","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Guardiano"],"html":"<p>Quando difendi qualcuno o qualcosa da un PNG o da un pericolo ambientale, tira su <strong>Vigore</strong>. Con un successo lo proteggi e scegli 1; con <span class=\"res\">7-9</span> c'è un prezzo (ti esponi o la situazione peggiora):</p><ul><li>La minaccia si concentra su di te.</li><li>La metti in posizione vulnerabile: +1 al prossimo tiro per contrattaccare.</li><li>La respingi: tu e il protetto avete spazio per agire o fuggire.</li></ul><p>Con un fallimento subisci in pieno il colpo e fai il gioco della minaccia.</p>","text":"Quando difendi qualcuno o qualcosa da un PNG o da un pericolo ambientale, tira su Vigore. Con un successo lo proteggi e scegli 1; con 7-9 c'è un prezzo (ti esponi o la situazione peggiora): - La minaccia si concentra su di te. - La metti in posizione vulnerabile: +1 al prossimo tiro per contrattaccare. - La respingi: tu e il protetto avete spazio per agire o fuggire. Con un fallimento subisci in pieno il colpo e fai il gioco della minaccia.","back":["pb-giudice"]},{"id":"pb-ladro","title":"Il Ladro","cat":"playbook","group":"Manuale Base","src":"B p.149-152","aliases":["Ladro"],"html":"<p><em>Un criminale astuto capace di sgraffignare il tesoro più sorvegliato.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza +2, Fortuna +1, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: 4 a scelta</li><li><strong>Valore iniziale</strong>: 6</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, procione</li></ul><p><strong>Natura</strong></p><ul><li><em>Cleptomane</em>: svuota la fatica quando cerchi di rubare qualcosa di valore o importante per tenerlo per te.</li><li><em>Ribelle</em>: svuota la fatica quando insulti pesantemente, sfidi o fai arrabbiare qualcuno di importante.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>.</p><p><strong>Legami</strong>: Professionista (hai rubato qualcosa per lui), Amico (ti ha liberato di prigione: sei in debito).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ladro-scasso\" data-id=\"pb-ladro-scasso\">Furto con Scasso</a>, <a class=\"xl\" href=\"#pb-ladro-oscurita\" data-id=\"pb-ladro-oscurita\">Svanire nell'Oscurità</a>, <a class=\"xl\" href=\"#pb-ladro-sfiancare\" data-id=\"pb-ladro-sfiancare\">Sfiancare il Nemico</a>, <a class=\"xl\" href=\"#pb-ladro-zampine\" data-id=\"pb-ladro-zampine\">Zampine</a>, <a class=\"xl\" href=\"#pb-ladro-arciladro\" data-id=\"pb-ladro-arciladro\">Arciladro</a>, <a class=\"xl\" href=\"#pb-ladro-fiuto\" data-id=\"pb-ladro-fiuto\">Fiuto per l'Oro</a>.</p>","text":"Un criminale astuto capace di sgraffignare il tesoro più sorvegliato. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza +2, Fortuna +1, Vigore -1 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro - Imprese: 4 a scelta - Valore iniziale: 6 - Specie: volpe, topo, coniglio, uccello, procione Natura - Cleptomane: svuota la fatica quando cerchi di rubare qualcosa di valore o importante per tenerlo per te. - Ribelle: svuota la fatica quando insulti pesantemente, sfidi o fai arrabbiare qualcuno di importante. Motivazioni: Libertà, Avidità, Ambizione, Brivido. Legami: Professionista (hai rubato qualcosa per lui), Amico (ti ha liberato di prigione: sei in debito). Mosse (tre): Furto con Scasso, Svanire nell'Oscurità, Sfiancare il Nemico, Zampine, Arciladro, Fiuto per l'Oro.","back":["playbook-indice","nature-indice"]},{"id":"pb-ladro-scasso","title":"Furto con Scasso","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Furto con Scasso"],"html":"<p>Quando <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">tenti un'impresa</a> per entrare o uscire da un luogo in cui sei già stato, puoi segnare fatica per ottenere <span class=\"res\">10+</span> senza tirare. Pensala come un sopralluogo.</p>","text":"Quando tenti un'impresa per entrare o uscire da un luogo in cui sei già stato, puoi segnare fatica per ottenere 10+ senza tirare. Pensala come un sopralluogo.","back":["pb-ladro"]},{"id":"pb-ladro-oscurita","title":"Svanire nell'Oscurità","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Svanire nell'Oscurità"],"html":"<p>Quando sparisci nel buio mentre nessuno ti guarda, segna fatica e tieni 1 presa: finché resti silenzioso e lento rimani nascosto (se esci allo scoperto per errore perdi la presa). Spendila per sbucare all'improvviso: se attacchi subito dopo hai un bonus al tiro (max +4).</p>","text":"Quando sparisci nel buio mentre nessuno ti guarda, segna fatica e tieni 1 presa: finché resti silenzioso e lento rimani nascosto (se esci allo scoperto per errore perdi la presa). Spendila per sbucare all'improvviso: se attacchi subito dopo hai un bonus al tiro (max +4).","back":["pb-ladro"]},{"id":"pb-ladro-sfiancare","title":"Sfiancare il Nemico","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Sfiancare il Nemico"],"html":"<p>Quando schivi ed eludi un nemico per stancarlo, tira su <strong>Destrezza</strong>. Con un successo puoi segnare fatica per fargli segnare 2-fatica; con <span class=\"res\">10+</span> per fargliene segnare 3. Con un fallimento vieni colpito e sei alla sua mercé.</p>","text":"Quando schivi ed eludi un nemico per stancarlo, tira su Destrezza. Con un successo puoi segnare fatica per fargli segnare 2-fatica; con 10+ per fargliene segnare 3. Con un fallimento vieni colpito e sei alla sua mercé.","back":["pb-ladro"]},{"id":"pb-ladro-zampine","title":"Zampine","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Zampine"],"html":"<p>Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> con un nemico molto più grosso di te, tira su <strong>Destrezza</strong> invece di Vigore. Con un fallimento vieni sopraffatto.</p>","text":"Quando lotti con un nemico molto più grosso di te, tira su Destrezza invece di Vigore. Con un fallimento vieni sopraffatto.","back":["pb-ladro"]},{"id":"pb-ladro-arciladro","title":"Arciladro","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Arciladro"],"html":"<p>+1 Destrezza (max +3).</p>","text":"+1 Destrezza (max +3).","back":["pb-ladro"]},{"id":"pb-ladro-fiuto","title":"Fiuto per l'Oro","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Fiuto per l'Oro"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le intenzioni</a> puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa che porta con sé?\". Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa qui?\".</p>","text":"Quando capisci le intenzioni puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa che porta con sé?\". Quando valuti una situazione tesa puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa qui?\".","back":["pb-ladro"]},{"id":"pb-mastro","title":"Il Mastro","cat":"playbook","group":"Manuale Base","src":"B p.153-156","aliases":["Mastro"],"html":"<p><em>Un esperto di congegni e artigianato, con idee che lo rendono diverso.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Fracassare, Incalzare, Improvvisare, Tiro da Maestro</li><li><strong>Imprese</strong>: Falsificare, Disattivare un Congegno, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, castoro</li></ul><p><strong>Natura</strong></p><ul><li><em>Perfezionista</em>: svuota la fatica quando sostituisci uno strumento o una risorsa di qualcuno con qualcosa di eccezionale.</li><li><em>Estremista</em>: svuota la fatica quando sostieni idee pericolose davanti al pubblico sbagliato.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Professionista (vi leggete nel pensiero), Familiare (siete fuggiti insieme da una radura).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-mastro-cassetta\" data-id=\"pb-mastro-cassetta\">Cassetta degli Attrezzi</a> e <a class=\"xl\" href=\"#pb-mastro-riparare\" data-id=\"pb-mastro-riparare\">Riparare</a> + una tra <a class=\"xl\" href=\"#pb-mastro-tasche\" data-id=\"pb-mastro-tasche\">Tasche Capienti</a>, <a class=\"xl\" href=\"#pb-mastro-inventore\" data-id=\"pb-mastro-inventore\">Inventore</a>, <a class=\"xl\" href=\"#pb-mastro-mente\" data-id=\"pb-mastro-mente\">Mente Svelta</a>, <a class=\"xl\" href=\"#pb-mastro-smantellare\" data-id=\"pb-mastro-smantellare\">Smantellare</a>.</p>","text":"Un esperto di congegni e artigianato, con idee che lo rendono diverso. - Caratteristiche: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0 - Abilità iniziale: Fracassare, Incalzare, Improvvisare, Tiro da Maestro - Imprese: Falsificare, Disattivare un Congegno, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, castoro Natura - Perfezionista: svuota la fatica quando sostituisci uno strumento o una risorsa di qualcuno con qualcosa di eccezionale. - Estremista: svuota la fatica quando sostieni idee pericolose davanti al pubblico sbagliato. Motivazioni: Avidità, Ambizione, Vendetta, Protezione. Legami: Professionista (vi leggete nel pensiero), Familiare (siete fuggiti insieme da una radura). Mosse: inizi con Cassetta degli Attrezzi e Riparare + una tra Tasche Capienti, Inventore, Mente Svelta, Smantellare.","back":["comprare-vendere","playbook-indice","nature-indice"]},{"id":"pb-mastro-cassetta","title":"Cassetta degli Attrezzi","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Cassetta degli Attrezzi"],"html":"<p>Hai un kit per progetti a lungo termine. Scegli due strumenti: legni assortiti, viti e ingranaggi, strani utensili, manuali, medicine, kit da alchimista, kit da cucito, pentole, piccoli esplosivi. Scegli un difetto: pesante (2-Ingombro), voluminoso e appariscente, rubato, fragile.</p><p>Quando la apri per <strong>creare qualcosa o capire come risolvere un problema</strong>, dichiara l'obiettivo: il GM ti dà <strong>da 1 a 4 condizioni</strong> (tempo, materiali, aiuto, strumenti, limiti del progetto). Soddisfatte le condizioni, raggiungi l'obiettivo.</p>","text":"Hai un kit per progetti a lungo termine. Scegli due strumenti: legni assortiti, viti e ingranaggi, strani utensili, manuali, medicine, kit da alchimista, kit da cucito, pentole, piccoli esplosivi. Scegli un difetto: pesante (2-Ingombro), voluminoso e appariscente, rubato, fragile. Quando la apri per creare qualcosa o capire come risolvere un problema, dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, materiali, aiuto, strumenti, limiti del progetto). Soddisfatte le condizioni, raggiungi l'obiettivo.","back":["comprare-vendere","pb-mastro"]},{"id":"pb-mastro-riparare","title":"Riparare","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Riparare"],"html":"<p>Per riparare un tuo equipaggiamento <strong>distrutto</strong> con la cassetta, il GM impone una condizione: soddisfala per svuotare tutta la sua usura. Per uno <strong>danneggiato</strong>, ogni consumo o Valore speso svuota 1 usura.</p>","text":"Per riparare un tuo equipaggiamento distrutto con la cassetta, il GM impone una condizione: soddisfala per svuotare tutta la sua usura. Per uno danneggiato, ogni consumo o Valore speso svuota 1 usura.","back":["pb-mastro"]},{"id":"pb-mastro-tasche","title":"Tasche Capienti","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Tasche Capienti"],"html":"<p>Due caselle di consumo extra (fuori dal limite di 6).</p>","text":"Due caselle di consumo extra (fuori dal limite di 6).","back":["pb-mastro"]},{"id":"pb-mastro-inventore","title":"Inventore","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Inventore"],"html":"<p>Quando improvvisi un dispositivo sul momento, tira su <strong>Astuzia</strong>. Con un successo funziona una volta prima di rompersi; con <span class=\"res\">10+</span> scegli: funziona benissimo, oppure un uso extra. Con un fallimento funziona ma con un effetto collaterale che il GM rivela all'uso. Non crea vere armi.</p>","text":"Quando improvvisi un dispositivo sul momento, tira su Astuzia. Con un successo funziona una volta prima di rompersi; con 10+ scegli: funziona benissimo, oppure un uso extra. Con un fallimento funziona ma con un effetto collaterale che il GM rivela all'uso. Non crea vere armi.","back":["pb-mastro"]},{"id":"pb-mastro-mente","title":"Mente Svelta","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Mente Svelta"],"html":"<p>Quando tenti un'impresa che coinvolge meccanismi o serrature, segna consumo per tirare su <strong>Astuzia</strong> invece di Destrezza.</p>","text":"Quando tenti un'impresa che coinvolge meccanismi o serrature, segna consumo per tirare su Astuzia invece di Destrezza.","back":["pb-mastro"]},{"id":"pb-mastro-smantellare","title":"Smantellare","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Smantellare"],"html":"<p>Quando smonti equipaggiamento o macchinari rotti, svuota 2-consumo (richiede tempo).</p>","text":"Quando smonti equipaggiamento o macchinari rotti, svuota 2-consumo (richiede tempo).","back":["pb-mastro"]},{"id":"pb-predone","title":"Il Predone","cat":"playbook","group":"Manuale Base","src":"B p.157-160","aliases":["Predone"],"html":"<p><em>Un contrabbandiere svelto e intraprendente, che scopre sentieri e luoghi nascosti.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia -1, Destrezza +2, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Sgattaiolare</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, scoiattolo</li></ul><p><strong>Natura</strong></p><ul><li><em>Diligente</em>: svuota la fatica quando svolgi un compito pericoloso o difficile per conto di qualcun altro.</li><li><em>Competitivo</em>: svuota la fatica quando corri rischi inutili per metterti in mostra.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Professionista (avete tentato di tracciare un nuovo sentiero), Amico (avete esplorato una rovina insieme).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-predone-maratoneta\" data-id=\"pb-predone-maratoneta\">Maratoneta</a>, <a class=\"xl\" href=\"#pb-predone-zampe\" data-id=\"pb-predone-zampe\">Zampe Veloci</a>, <a class=\"xl\" href=\"#pb-predone-ambasciatore\" data-id=\"pb-predone-ambasciatore\">Ambasciator Non Porta Pena</a>, <a class=\"xl\" href=\"#pb-predone-parkour\" data-id=\"pb-predone-parkour\">Parkour</a>, <a class=\"xl\" href=\"#pb-predone-viaggiatore\" data-id=\"pb-predone-viaggiatore\">Viaggiatore Straordinario</a>, <a class=\"xl\" href=\"#pb-predone-sentiero\" data-id=\"pb-predone-sentiero\">Il Sentiero del Contrabbandiere</a>.</p>","text":"Un contrabbandiere svelto e intraprendente, che scopre sentieri e luoghi nascosti. - Caratteristiche: Carisma 0, Astuzia -1, Destrezza +2, Fortuna +1, Vigore 0 - Abilità iniziale: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro - Imprese: Acrobazie, Sgattaiolare - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, scoiattolo Natura - Diligente: svuota la fatica quando svolgi un compito pericoloso o difficile per conto di qualcun altro. - Competitivo: svuota la fatica quando corri rischi inutili per metterti in mostra. Motivazioni: Crimine, Scoperta, Infamia, Voglia di Viaggiare. Legami: Professionista (avete tentato di tracciare un nuovo sentiero), Amico (avete esplorato una rovina insieme). Mosse (tre): Maratoneta, Zampe Veloci, Ambasciator Non Porta Pena, Parkour, Viaggiatore Straordinario, Il Sentiero del Contrabbandiere.","back":["playbook-indice","nature-indice"]},{"id":"pb-predone-maratoneta","title":"Maratoneta","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Maratoneta"],"html":"<p>Una casella extra di fatica. Quando la fatica è piena e devi segnarne ancora, puoi segnare l'equivalente in ferite (non assorbibili dall'armatura) per non svenire.</p>","text":"Una casella extra di fatica. Quando la fatica è piena e devi segnarne ancora, puoi segnare l'equivalente in ferite (non assorbibili dall'armatura) per non svenire.","back":["pb-predone"]},{"id":"pb-predone-zampe","title":"Zampe Veloci","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Zampe Veloci"],"html":"<p>+1 Destrezza (max +3).</p>","text":"+1 Destrezza (max +3).","back":["pb-predone"]},{"id":"pb-predone-ambasciatore","title":"Ambasciator Non Porta Pena","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Ambasciator Non Porta Pena"],"html":"<p>Ottieni <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite). Quando fingi di essere un innocente messaggero per ingannare qualcuno, tira su <strong>Fortuna</strong> invece di Astuzia.</p>","text":"Ottieni Falsificare (fuori limite). Quando fingi di essere un innocente messaggero per ingannare qualcuno, tira su Fortuna invece di Astuzia.","back":["pb-predone"]},{"id":"pb-predone-parkour","title":"Parkour","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Parkour"],"html":"<p>Quando ti fai strada nel caos o in un combattimento, tira su <strong>Destrezza</strong>: <span class=\"res\">10+</span> tieni 3, <span class=\"res\">7-9</span> tieni 2 (valide per la scena). Spendile per raggiungere senza ostacoli qualcosa di visibile e raggiungibile, fuggire da qualcosa vicino o allontanarti da un nemico nell'istante in cui ti attacca. Con un fallimento inciampi e resti bloccato.</p>","text":"Quando ti fai strada nel caos o in un combattimento, tira su Destrezza: 10+ tieni 3, 7-9 tieni 2 (valide per la scena). Spendile per raggiungere senza ostacoli qualcosa di visibile e raggiungibile, fuggire da qualcosa vicino o allontanarti da un nemico nell'istante in cui ti attacca. Con un fallimento inciampi e resti bloccato.","back":["pb-predone"]},{"id":"pb-predone-viaggiatore","title":"Viaggiatore Straordinario","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Viaggiatore Straordinario"],"html":"<p>Sul <a class=\"xl\" href=\"#viaggio-sentiero\" data-id=\"viaggio-sentiero\">sentiero</a> scegli +1 al tiro oppure svuota 2-fatica; attraverso la <a class=\"xl\" href=\"#viaggio-foresta\" data-id=\"viaggio-foresta\">foresta</a> +1 oppure svuota 2-consumo. Prima di arrivare puoi fare al GM due domande sulla radura in base all'ultima volta che ci sei stato.</p>","text":"Sul sentiero scegli +1 al tiro oppure svuota 2-fatica; attraverso la foresta +1 oppure svuota 2-consumo. Prima di arrivare puoi fare al GM due domande sulla radura in base all'ultima volta che ci sei stato.","back":["viaggio-foresta","pb-predone"]},{"id":"pb-predone-sentiero","title":"Il Sentiero del Contrabbandiere","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Il Sentiero del Contrabbandiere"],"html":"<p>Quando cerchi un passaggio segreto per entrare o uscire da un luogo, segna fatica e tira su <strong>Fortuna</strong>. Con un successo trovi un passaggio nascosto (il GM dice dove porta); con <span class=\"res\">10+</span> lungo la via trovi anche qualcosa di valore. Con un fallimento lo trovi, ma qualcun altro lo sta usando e non ne è felice.</p>","text":"Quando cerchi un passaggio segreto per entrare o uscire da un luogo, segna fatica e tira su Fortuna. Con un successo trovi un passaggio nascosto (il GM dice dove porta); con 10+ lungo la via trovi anche qualcosa di valore. Con un fallimento lo trovi, ma qualcun altro lo sta usando e non ne è felice.","back":["pb-predone"]},{"id":"pb-ranger","title":"Il Ranger","cat":"playbook","group":"Manuale Base","src":"B p.161-164","aliases":["Ranger"],"html":"<p><em>Un vagabondo furtivo e solitario, più creatura della foresta che delle radure.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Incalzare, Colpo Crudele</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lupo</li></ul><p><strong>Natura</strong></p><ul><li><em>Solitario</em>: svuota la fatica quando ti cacci da solo in una situazione pericolosa.</li><li><em>Cinico</em>: svuota la fatica quando fai apertamente domande pericolose su una presunta \"verità\".</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Sentinella (ti ha ingannato, eppure ci lavori ancora), Protettore (ti ha coperto evitandoti l'inimicizia di una fazione).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ranger-passo\" data-id=\"pb-ranger-passo\">Passo Felpato</a>, <a class=\"xl\" href=\"#pb-ranger-sfuggire\" data-id=\"pb-ranger-sfuggire\">Sfuggire</a>, <a class=\"xl\" href=\"#pb-ranger-veleni\" data-id=\"pb-ranger-veleni\">Veleni e Antidoti</a>, <a class=\"xl\" href=\"#pb-ranger-raccoglitore\" data-id=\"pb-ranger-raccoglitore\">Raccoglitore</a>, <a class=\"xl\" href=\"#pb-ranger-minaccioso\" data-id=\"pb-ranger-minaccioso\">Aspetto Minaccioso</a>, <a class=\"xl\" href=\"#pb-ranger-sporco\" data-id=\"pb-ranger-sporco\">Giocare Sporco</a>.</p>","text":"Un vagabondo furtivo e solitario, più creatura della foresta che delle radure. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore +1 - Abilità iniziale: Fracassare, Disarmare, Incalzare, Colpo Crudele - Imprese: Nascondersi, Sgattaiolare - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, lupo Natura - Solitario: svuota la fatica quando ti cacci da solo in una situazione pericolosa. - Cinico: svuota la fatica quando fai apertamente domande pericolose su una presunta \"verità\". Motivazioni: Scoperta, Libertà, Vendetta, Protezione. Legami: Sentinella (ti ha ingannato, eppure ci lavori ancora), Protettore (ti ha coperto evitandoti l'inimicizia di una fazione). Mosse (tre): Passo Felpato, Sfuggire, Veleni e Antidoti, Raccoglitore, Aspetto Minaccioso, Giocare Sporco.","back":["playbook-indice","nature-indice"]},{"id":"pb-ranger-passo","title":"Passo Felpato","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Passo Felpato"],"html":"<p>Quando tenti di <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a> o <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">nasconderti</a>, puoi segnare 2-fatica per trasformare un fallimento in <span class=\"res\">7-9</span>.</p>","text":"Quando tenti di Sgattaiolare o nasconderti, puoi segnare 2-fatica per trasformare un fallimento in 7-9.","back":["pb-ranger"]},{"id":"pb-ranger-sfuggire","title":"Sfuggire","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Sfuggire"],"html":"<p>Quando cogli un'occasione per sfuggire a una situazione pericolosa, tira su <strong>Destrezza</strong>. Con un successo scappi; scegli 1 (<span class=\"res\">10+</span>) o 2 (<span class=\"res\">7-9</span>): subisci ferite o fatica (sceglie il GM); finisci in un'altra brutta situazione; ti lasci dietro qualcosa di importante. Con un fallimento scappi ma segni fatica o ferite e lasci tracce che i nemici possono seguire.</p>","text":"Quando cogli un'occasione per sfuggire a una situazione pericolosa, tira su Destrezza. Con un successo scappi; scegli 1 (10+) o 2 (7-9): subisci ferite o fatica (sceglie il GM); finisci in un'altra brutta situazione; ti lasci dietro qualcosa di importante. Con un fallimento scappi ma segni fatica o ferite e lasci tracce che i nemici possono seguire.","back":["pb-ranger"]},{"id":"pb-ranger-veleni","title":"Veleni e Antidoti","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Veleni e Antidoti"],"html":"<p>Quando crei un veleno, segna consumo e descrivine l'effetto (addormentare, indebolire, confondere, uccidere); va iniettato o ingerito. Quando studi un veleno per farne l'antidoto, il GM ti dice gli ingredienti: trovali e segna 1-consumo. Gli effetti richiedono tempo (un veleno letale 1-2 giorni).</p>","text":"Quando crei un veleno, segna consumo e descrivine l'effetto (addormentare, indebolire, confondere, uccidere); va iniettato o ingerito. Quando studi un veleno per farne l'antidoto, il GM ti dice gli ingredienti: trovali e segna 1-consumo. Gli effetti richiedono tempo (un veleno letale 1-2 giorni).","back":["pb-ranger"]},{"id":"pb-ranger-raccoglitore","title":"Raccoglitore","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Raccoglitore"],"html":"<p>Quando viaggi attraverso una foresta, prima di qualsiasi mossa di viaggio puoi svuotare fino a 3-consumo, oppure fino a 2-fatica, oppure fino a 2-ferite.</p>","text":"Quando viaggi attraverso una foresta, prima di qualsiasi mossa di viaggio puoi svuotare fino a 3-consumo, oppure fino a 2-fatica, oppure fino a 2-ferite.","back":["viaggio-foresta","pb-ranger"]},{"id":"pb-ranger-minaccioso","title":"Aspetto Minaccioso","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Aspetto Minaccioso"],"html":"<p>Quando <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convinci un PNG</a> con una minaccia credibile, tira su <strong>Vigore</strong> invece di Carisma.</p>","text":"Quando convinci un PNG con una minaccia credibile, tira su Vigore invece di Carisma.","back":["pb-ranger"]},{"id":"pb-ranger-sporco","title":"Giocare Sporco","cat":"mosse","group":"Ranger","src":"B p.162","aliases":["Giocare Sporco"],"html":"<p>Prendi due abilità tra Tiro da Maestro, Confondere i Sensi, Improvvisare un'Arma, Disarmare, Colpo Crudele (fuori limite).</p>","text":"Prendi due abilità tra Tiro da Maestro, Confondere i Sensi, Improvvisare un'Arma, Disarmare, Colpo Crudele (fuori limite).","back":["pb-ranger"]},{"id":"pb-ronin","title":"Il Ronin","cat":"playbook","group":"Manuale Base","src":"B p.165-168","aliases":["Ronin"],"html":"<p><em>Un guerriero addestrato giunto da una terra lontana dopo aver perso il suo signore.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia +1, Destrezza 0, Fortuna -1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Incalzare, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Attaccare alle Spalle</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, procione</li><li>Domanda speciale: cos'è successo al tuo ultimo signore?</li></ul><p><strong>Natura</strong></p><ul><li><em>Sopravvissuto</em>: svuota la fatica quando fuggi o copri la fuga dei tuoi alleati da una situazione pericolosa.</li><li><em>Pellegrino</em>: svuota la fatica quando incontri un esperto in un'abilità che non possiedi.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Compagno (ti ha aiutato nella tua prima impresa nei Boschi), Sentinella (ti ricorda il tuo vecchio maestro).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ronin-disarmato\" data-id=\"pb-ronin-disarmato\">Mai Disarmato</a>, <a class=\"xl\" href=\"#pb-ronin-padrone\" data-id=\"pb-ronin-padrone\">Quello che il Padrone Desidera</a>, <a class=\"xl\" href=\"#pb-ronin-etichetta\" data-id=\"pb-ronin-etichetta\">Etichetta</a>, <a class=\"xl\" href=\"#pb-ronin-dovere\" data-id=\"pb-ronin-dovere\">Dovere e Lealtà</a>, <a class=\"xl\" href=\"#pb-ronin-regole\" data-id=\"pb-ronin-regole\">Regole di Guerra</a>, <a class=\"xl\" href=\"#pb-ronin-allerta\" data-id=\"pb-ronin-allerta\">Sempre Allerta</a>.</p>","text":"Un guerriero addestrato giunto da una terra lontana dopo aver perso il suo signore. - Caratteristiche: Carisma 0, Astuzia +1, Destrezza 0, Fortuna -1, Vigore +2 - Abilità iniziale: Fracassare, Incalzare, Assaltare un Gruppo, Colpo Crudele - Imprese: Attaccare alle Spalle - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, procione - Domanda speciale: cos'è successo al tuo ultimo signore? Natura - Sopravvissuto: svuota la fatica quando fuggi o copri la fuga dei tuoi alleati da una situazione pericolosa. - Pellegrino: svuota la fatica quando incontri un esperto in un'abilità che non possiedi. Motivazioni: Princìpi, Vendetta, Brivido, Voglia di Viaggiare. Legami: Compagno (ti ha aiutato nella tua prima impresa nei Boschi), Sentinella (ti ricorda il tuo vecchio maestro). Mosse (tre): Mai Disarmato, Quello che il Padrone Desidera, Etichetta, Dovere e Lealtà, Regole di Guerra, Sempre Allerta.","back":["playbook-indice","nature-indice"]},{"id":"pb-ronin-disarmato","title":"Mai Disarmato","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Mai Disarmato"],"html":"<p>Ottieni <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare un'Arma</a> (fuori limite). Con un'arma improvvisata infliggi +1 danno.</p>","text":"Ottieni Improvvisare un'Arma (fuori limite). Con un'arma improvvisata infliggi +1 danno.","back":["pb-ronin"]},{"id":"pb-ronin-padrone","title":"Quello che il Padrone Desidera","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Quello che il Padrone Desidera"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le intenzioni</a> di qualcuno di importante o potente, tira su <strong>Vigore</strong> invece di Carisma. Quando inganni qualcuno di importante fingendoti un subalterno, tira su <strong>Vigore</strong> invece di Astuzia.</p>","text":"Quando capisci le intenzioni di qualcuno di importante o potente, tira su Vigore invece di Carisma. Quando inganni qualcuno di importante fingendoti un subalterno, tira su Vigore invece di Astuzia.","back":["pb-ronin"]},{"id":"pb-ronin-etichetta","title":"Etichetta","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Etichetta"],"html":"<p>In un contesto sociale retto dall'etichetta, tira su <strong>Astuzia</strong>: <span class=\"res\">10+</span> tieni 3, <span class=\"res\">7-9</span> tieni 2 (le perdi andandotene). Spendile per: nascondere un errore tuo o di un alleato (svuota 1-fatica); far notare l'errore di un altro (1-morale); affascinare qualcuno (+1 continuo a parlargli finché hai prese); dimostrare il tuo valore (prestigio con la fazione di un potente). Con un fallimento commetti una grave scortesia: segna fatica.</p>","text":"In un contesto sociale retto dall'etichetta, tira su Astuzia: 10+ tieni 3, 7-9 tieni 2 (le perdi andandotene). Spendile per: nascondere un errore tuo o di un alleato (svuota 1-fatica); far notare l'errore di un altro (1-morale); affascinare qualcuno (+1 continuo a parlargli finché hai prese); dimostrare il tuo valore (prestigio con la fazione di un potente). Con un fallimento commetti una grave scortesia: segna fatica.","back":["pb-ronin"]},{"id":"pb-ronin-dovere","title":"Dovere e Lealtà","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Dovere e Lealtà"],"html":"<p>Quando ti dedichi alla causa di qualcuno che ritieni degno, giuragli fedeltà e dichiara una missione ben definita. Segna fatica per <strong>ritirare</strong> una mossa che ti aiuta a compierla. Non puoi dedicarti ad altro finché non la completi o rompi il giuramento. Rompere: riempi la fatica e segna 4-nomea con la fazione; rispettare: 4-prestigio.</p>","text":"Quando ti dedichi alla causa di qualcuno che ritieni degno, giuragli fedeltà e dichiara una missione ben definita. Segna fatica per ritirare una mossa che ti aiuta a compierla. Non puoi dedicarti ad altro finché non la completi o rompi il giuramento. Rompere: riempi la fatica e segna 4-nomea con la fazione; rispettare: 4-prestigio.","back":["pb-ronin"]},{"id":"pb-ronin-regole","title":"Regole di Guerra","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Regole di Guerra"],"html":"<p>Quando chiedi a un nemico disposto a ragionare di rispettare una regola di guerra, tira su <strong>Vigore</strong>. Con un successo si sente obbligato: scegli un'opzione; con <span class=\"res\">7-9</span> anche lui ne sceglie una per te (se la violi l'obbligo cessa):</p><ul><li>Clemenza con chi si arrende e con i prigionieri.</li><li>Niente tattiche subdole.</li><li>Faccia a faccia, senza aiuti né rinforzi.</li><li>Non coinvolgere innocenti o disarmati.</li><li>Combattere per la resa, non la ritirata.</li></ul><p>Con un fallimento non si sente obbligato e ti mostra le sue regole.</p>","text":"Quando chiedi a un nemico disposto a ragionare di rispettare una regola di guerra, tira su Vigore. Con un successo si sente obbligato: scegli un'opzione; con 7-9 anche lui ne sceglie una per te (se la violi l'obbligo cessa): - Clemenza con chi si arrende e con i prigionieri. - Niente tattiche subdole. - Faccia a faccia, senza aiuti né rinforzi. - Non coinvolgere innocenti o disarmati. - Combattere per la resa, non la ritirata. Con un fallimento non si sente obbligato e ti mostra le sue regole.","back":["pb-ronin"]},{"id":"pb-ronin-allerta","title":"Sempre Allerta","cat":"mosse","group":"Ronin","src":"B p.166","aliases":["Sempre Allerta"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-ronin"]},{"id":"pb-campione","title":"Il Campione","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.93-96","aliases":["Campione","Champion"],"html":"<p><em>Aspirante eroe e leggenda, difensore degli innocenti e portabandiera di cause perse.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza -1, Fortuna +1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Tiro da Maestro</li><li><strong>Imprese</strong>: Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, cane</li></ul><p><strong>Natura</strong> <em>(la scheda ufficiale MS riporta per errore le nature dell'Ambasciatore: questi nomi sono una traduzione non ufficiale)</em></p><ul><li><em>Paladino dei deboli (Advocate)</em>: svuota la fatica quando affronti un PNG potente per come tratta i deboli.</li><li><em>Esemplare (Exemplar)</em>: svuota la fatica quando ti assumi pubblicamente un compito difficile per conto dei Giusti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>.</p><p><strong>Legami</strong>: Protettore (è un vero eroe), Familiare (siete quasi fratelli).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-campione-chiamata\" data-id=\"pb-campione-chiamata\">Vocazione</a> + una tra <a class=\"xl\" href=\"#pb-campione-popolo\" data-id=\"pb-campione-popolo\">Amico del Popolo</a>, <a class=\"xl\" href=\"#pb-campione-abilita\" data-id=\"pb-campione-abilita\">Muso a Muso</a>, <a class=\"xl\" href=\"#pb-campione-causa\" data-id=\"pb-campione-causa\">Per una Giusta Causa</a>, <a class=\"xl\" href=\"#pb-campione-forza\" data-id=\"pb-campione-forza\">Forza Bruta</a>.</p>","text":"Aspirante eroe e leggenda, difensore degli innocenti e portabandiera di cause perse. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza -1, Fortuna +1, Vigore +2 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Tiro da Maestro - Imprese: Gioco di Prestigio - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, cane Natura (la scheda ufficiale MS riporta per errore le nature dell'Ambasciatore: questi nomi sono una traduzione non ufficiale) - Paladino dei deboli (Advocate): svuota la fatica quando affronti un PNG potente per come tratta i deboli. - Esemplare (Exemplar): svuota la fatica quando ti assumi pubblicamente un compito difficile per conto dei Giusti. Motivazioni: Giustizia, Princìpi, Lealtà, Ambizione. Legami: Protettore (è un vero eroe), Familiare (siete quasi fratelli). Mosse: inizi con Vocazione + una tra Amico del Popolo, Muso a Muso, Per una Giusta Causa, Forza Bruta.","back":["playbook-indice"]},{"id":"pb-campione-chiamata","title":"Vocazione","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Vocazione","I Giusti","il Nemico"],"html":"<p>Nomina due fazioni non-abitanti: una è la speranza dei Boschi (<strong>i Giusti</strong>), l'altra tiranni malvagi (<strong>il Nemico</strong>). +1 continuo per proteggere membri dei Giusti o danneggiare agenti del Nemico. A fine sessione puoi cambiarle svuotando tutto il prestigio con la fazione che non ti ispira più.</p><p>Scegli un ruolo:</p><ul><li><em>Autorità</em>: quando convinci un PNG a combattere per i Giusti o resistere al Nemico, tira su Vigore invece di Carisma.</li><li><em>Paladino</em>: +1 danno al Nemico; -1 danno subito proteggendo i Giusti.</li><li><em>Emissario</em>: prestigio extra con i Giusti, nomea extra con il Nemico.</li></ul>","text":"Nomina due fazioni non-abitanti: una è la speranza dei Boschi (i Giusti), l'altra tiranni malvagi (il Nemico). +1 continuo per proteggere membri dei Giusti o danneggiare agenti del Nemico. A fine sessione puoi cambiarle svuotando tutto il prestigio con la fazione che non ti ispira più. Scegli un ruolo: - Autorità: quando convinci un PNG a combattere per i Giusti o resistere al Nemico, tira su Vigore invece di Carisma. - Paladino: +1 danno al Nemico; -1 danno subito proteggendo i Giusti. - Emissario: prestigio extra con i Giusti, nomea extra con il Nemico.","back":["pb-campione"]},{"id":"pb-campione-popolo","title":"Amico del Popolo","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Amico del Popolo"],"html":"<p>Quando la banda viaggia sul sentiero a passo tranquillo, tirate con +1 invece di -1. Con un successo incontrate volti amici che offrono cibo: dimezzate il consumo. Con <span class=\"res\">7-9</span> chi incontrate è nei guai e si aspetta aiuto. Con un fallimento un nemico deciso a porre fine alla tua \"rettitudine\" vi coglie impreparati.</p>","text":"Quando la banda viaggia sul sentiero a passo tranquillo, tirate con +1 invece di -1. Con un successo incontrate volti amici che offrono cibo: dimezzate il consumo. Con 7-9 chi incontrate è nei guai e si aspetta aiuto. Con un fallimento un nemico deciso a porre fine alla tua \"rettitudine\" vi coglie impreparati.","back":["pb-campione"]},{"id":"pb-campione-abilita","title":"Muso a Muso","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Muso a Muso"],"html":"<p>Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> e ottieni <span class=\"res\">12+</span>, puoi incassare i suoi colpi per metterlo fuori gioco: subisci il suo danno pieno e riempi il suo tracciato di fatica o di ferite.</p>","text":"Quando lotti e ottieni 12+, puoi incassare i suoi colpi per metterlo fuori gioco: subisci il suo danno pieno e riempi il suo tracciato di fatica o di ferite.","back":["pb-campione"]},{"id":"pb-campione-causa","title":"Per una Giusta Causa","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Per una Giusta Causa"],"html":"<p>Quando minacci un'autorità in nome degli oppressi, segna nomea con la sua fazione e tira su <strong>Vigore</strong>. Con un successo la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente. Con <span class=\"res\">10+</span> tu e i tuoi alleati avete +1 continuo contro di loro se attaccano. Con un fallimento scopri che la tua causa non è così giusta.</p>","text":"Quando minacci un'autorità in nome degli oppressi, segna nomea con la sua fazione e tira su Vigore. Con un successo la tua sfida la scuote: deve fare subito una concessione o attaccarti apertamente. Con 10+ tu e i tuoi alleati avete +1 continuo contro di loro se attaccano. Con un fallimento scopri che la tua causa non è così giusta.","back":["pb-campione"]},{"id":"pb-campione-forza","title":"Forza Bruta","cat":"mosse","group":"Campione","src":"VF p.94","aliases":["Forza Bruta"],"html":"<p>Prendi Disarmare o Parare (fuori limite). Usandole puoi segnare fatica per tirare su <strong>Vigore</strong>.</p>","text":"Prendi Disarmare o Parare (fuori limite). Usandole puoi segnare fatica per tirare su Vigore.","back":["pb-campione"]},{"id":"pb-cronista","title":"Il Cronista","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.97-100","aliases":["Cronista","Chronicler"],"html":"<p><em>Un saggio custode di storia e testi proibiti, verità che i potenti vorrebbero dimenticate.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: Falsificare, Disattivare un Congegno, Borseggiare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lontra</li></ul><p><strong>Natura</strong></p><ul><li><em>Osservatore</em>: svuota la fatica quando entri in una situazione pericolosa per assistere a un evento segreto o incontrare qualcuno di importante.</li><li><em>Attivista</em>: svuota la fatica quando affronti pubblicamente i capi di una radura su cambiamenti che ritieni vitali.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Compagno (avete svelato un segreto di una fazione), Professionista (vede la verità del mondo).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cronista-libro\" data-id=\"pb-cronista-libro\">Il Valore di un Libro</a> + due tra <a class=\"xl\" href=\"#pb-cronista-occhio\" data-id=\"pb-cronista-occhio\">Occhio per le Storie</a>, <a class=\"xl\" href=\"#pb-cronista-archivi\" data-id=\"pb-cronista-archivi\">Spulciare i Registri</a>, <a class=\"xl\" href=\"#pb-cronista-sapiente\" data-id=\"pb-cronista-sapiente\">Sapiente</a>, <a class=\"xl\" href=\"#pb-cronista-consiglio\" data-id=\"pb-cronista-consiglio\">Un Buon Consiglio</a>, <a class=\"xl\" href=\"#pb-cronista-studioso\" data-id=\"pb-cronista-studioso\">Studioso</a>.</p>","text":"Un saggio custode di storia e testi proibiti, verità che i potenti vorrebbero dimenticate. - Caratteristiche: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro - Imprese: Falsificare, Disattivare un Congegno, Borseggiare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, lontra Natura - Osservatore: svuota la fatica quando entri in una situazione pericolosa per assistere a un evento segreto o incontrare qualcuno di importante. - Attivista: svuota la fatica quando affronti pubblicamente i capi di una radura su cambiamenti che ritieni vitali. Motivazioni: Giustizia, Scoperta, Ambizione, Zampe Pulite. Legami: Compagno (avete svelato un segreto di una fazione), Professionista (vede la verità del mondo). Mosse: inizi con Il Valore di un Libro + due tra Occhio per le Storie, Spulciare i Registri, Sapiente, Un Buon Consiglio, Studioso.","back":["playbook-indice"]},{"id":"pb-cronista-libro","title":"Il Valore di un Libro","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Il Valore di un Libro"],"html":"<p>Quando studi i tuoi tomi per trovare antiche tecniche contro un problema irrisolvibile (curare una malattia, porre fine a una siccità, deporre legalmente un capo), dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, informazioni, mentori o traduttori, strutture, limiti). Soddisfatte, ottieni la conoscenza cercata: sta a te usarla.</p>","text":"Quando studi i tuoi tomi per trovare antiche tecniche contro un problema irrisolvibile (curare una malattia, porre fine a una siccità, deporre legalmente un capo), dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, informazioni, mentori o traduttori, strutture, limiti). Soddisfatte, ottieni la conoscenza cercata: sta a te usarla.","back":["pb-cronista"]},{"id":"pb-cronista-occhio","title":"Occhio per le Storie","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Occhio per le Storie"],"html":"<p>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a>, segna fatica (anche con un fallimento) per individuare chi sa più di quanto dice: +1 continuo a convincerlo a confidarsi in privato.</p>","text":"Quando valuti una situazione tesa, segna fatica (anche con un fallimento) per individuare chi sa più di quanto dice: +1 continuo a convincerlo a confidarsi in privato.","back":["pb-cronista"]},{"id":"pb-cronista-archivi","title":"Spulciare i Registri","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Spulciare i Registri"],"html":"<p>Quando esamini documenti o appunti di un PNG importante, tira su <strong>Astuzia</strong>. Con un successo scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle; con <span class=\"res\">10+</span> la prossima volta che <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">cerchi di capirlo</a> prendi <span class=\"res\">12+</span> senza tirare. Con un fallimento scopri che qualcuno agisce contro di te dove non te lo aspetti.</p>","text":"Quando esamini documenti o appunti di un PNG importante, tira su Astuzia. Con un successo scopri prove dei suoi segreti e il GM ti dice chi pagherebbe per averle; con 10+ la prossima volta che cerchi di capirlo prendi 12+ senza tirare. Con un fallimento scopri che qualcuno agisce contro di te dove non te lo aspetti.","back":["pb-cronista"]},{"id":"pb-cronista-sapiente","title":"Sapiente","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Sapiente"],"html":"<p>Quando consulti il tuo sapere per comprendere un conflitto politico, tira su <strong>Astuzia</strong>. Con un successo il GM ti dice cosa ricordi che completa il quadro; con <span class=\"res\">10+</span> puoi fare una domanda in più. Con un fallimento qualcosa non torna con la storia: il GM ti dice cosa è cambiato radicalmente.</p>","text":"Quando consulti il tuo sapere per comprendere un conflitto politico, tira su Astuzia. Con un successo il GM ti dice cosa ricordi che completa il quadro; con 10+ puoi fare una domanda in più. Con un fallimento qualcosa non torna con la storia: il GM ti dice cosa è cambiato radicalmente.","back":["pb-cronista"]},{"id":"pb-cronista-consiglio","title":"Un Buon Consiglio","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Un Buon Consiglio"],"html":"<p>Quando offri a un PNG il miglior consiglio su una situazione spinosa, tira su <strong>Astuzia</strong>. Con un successo ne vede la saggezza: deve segnare fatica o includerlo nei suoi piani. Con <span class=\"res\">7-9</span> ti lasci sfuggire qualcosa dei tuoi piani o alleanze. Con un fallimento lo offendi violando un'usanza locale.</p>","text":"Quando offri a un PNG il miglior consiglio su una situazione spinosa, tira su Astuzia. Con un successo ne vede la saggezza: deve segnare fatica o includerlo nei suoi piani. Con 7-9 ti lasci sfuggire qualcosa dei tuoi piani o alleanze. Con un fallimento lo offendi violando un'usanza locale.","back":["pb-cronista"]},{"id":"pb-cronista-studioso","title":"Studioso","cat":"mosse","group":"Cronista","src":"VF p.98","aliases":["Studioso"],"html":"<p>Una casella extra di fatica. Quando acquisisci un nuovo tomo o rotolo sulla storia dei Boschi, svuota tutta la fatica.</p>","text":"Una casella extra di fatica. Quando acquisisci un nuovo tomo o rotolo sulla storia dei Boschi, svuota tutta la fatica.","back":["pb-cronista"]},{"id":"pb-emissario","title":"L'Ambasciatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.105-108","aliases":["Ambasciatore","Envoy"],"html":"<p><em>Un rappresentante professionista: parla per altri poteri mantenendo una plausibile estraneità.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia +1, Destrezza 0, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro Rapido</li><li><strong>Imprese</strong>: Nascondersi, Sgattaiolare, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, pipistrello</li></ul><p><strong>Natura</strong></p><ul><li><em>Agente</em>: svuota la fatica quando convinci qualcuno di influente a permetterti di rappresentare i suoi interessi.</li><li><em>Fidato</em>: svuota la fatica quando ti impegni pubblicamente a risolvere un conflitto pericoloso nell'interesse di qualcuno di vulnerabile.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Sentinella (somiglia a un potente politico), Professionista (avete negoziato una tregua).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-emissario-diplomatico\" data-id=\"pb-emissario-diplomatico\">Diplomatico</a> + due tra <a class=\"xl\" href=\"#pb-emissario-incontro\" data-id=\"pb-emissario-incontro\">Che Sorpresa Incontrarti Qui</a>, <a class=\"xl\" href=\"#pb-emissario-voltagabbana\" data-id=\"pb-emissario-voltagabbana\">Voltagabbana</a>, <a class=\"xl\" href=\"#pb-emissario-trame\" data-id=\"pb-emissario-trame\">Piani e Complotti</a>, <a class=\"xl\" href=\"#pb-emissario-fiducia\" data-id=\"pb-emissario-fiducia\">Fidati di Me</a>, <a class=\"xl\" href=\"#pb-emissario-anello\" data-id=\"pb-emissario-anello\">Il Bacio dell'Anello</a>.</p>","text":"Un rappresentante professionista: parla per altri poteri mantenendo una plausibile estraneità. - Caratteristiche: Carisma 0, Astuzia +1, Destrezza 0, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro Rapido - Imprese: Nascondersi, Sgattaiolare, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, pipistrello Natura - Agente: svuota la fatica quando convinci qualcuno di influente a permetterti di rappresentare i suoi interessi. - Fidato: svuota la fatica quando ti impegni pubblicamente a risolvere un conflitto pericoloso nell'interesse di qualcuno di vulnerabile. Motivazioni: Lealtà, Avidità, Ambizione, Zampe Pulite. Legami: Sentinella (somiglia a un potente politico), Professionista (avete negoziato una tregua). Mosse: inizi con Diplomatico + due tra Che Sorpresa Incontrarti Qui, Voltagabbana, Piani e Complotti, Fidati di Me, Il Bacio dell'Anello.","back":["playbook-indice"]},{"id":"pb-emissario-diplomatico","title":"Diplomatico","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Diplomatico"],"html":"<p>Hai un tracciato <strong>Diplomatico</strong> (parte da +1, tra 0 e +3): sale quando la tua Reputazione con una fazione sale e scende quando scende.</p><ul><li>Segna fatica per usare Diplomatico quando <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">chiedi un favore</a> o <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a>, con qualunque fazione.</li><li>Quando convinci o cerchi di capire un PNG importante agendo per conto di altri (non tuo né della banda), tira su Diplomatico invece di Carisma.</li></ul>","text":"Hai un tracciato Diplomatico (parte da +1, tra 0 e +3): sale quando la tua Reputazione con una fazione sale e scende quando scende. - Segna fatica per usare Diplomatico quando chiedi un favore o incontri qualcuno di importante, con qualunque fazione. - Quando convinci o cerchi di capire un PNG importante agendo per conto di altri (non tuo né della banda), tira su Diplomatico invece di Carisma.","back":["pb-emissario"]},{"id":"pb-emissario-incontro","title":"Che Sorpresa Incontrarti Qui","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Che Sorpresa Incontrarti Qui"],"html":"<p>Quando fai baldoria in un locale frequentato, tira su <strong>Fortuna</strong>. Con un successo incontri un tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete). Con <span class=\"res\">10+</span> si lascia sfuggire un segreto sui piani della fazione o si offre di presentarti ai capi. Con un fallimento ti trova prima chi ti cerca.</p>","text":"Quando fai baldoria in un locale frequentato, tira su Fortuna. Con un successo incontri un tirapiedi di una fazione potente (il GM dice cosa fa, tu dici come vi conoscete). Con 10+ si lascia sfuggire un segreto sui piani della fazione o si offre di presentarti ai capi. Con un fallimento ti trova prima chi ti cerca.","back":["pb-emissario"]},{"id":"pb-emissario-voltagabbana","title":"Voltagabbana","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Voltagabbana"],"html":"<p>Ottieni <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> e <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite). Quando attacchi alle spalle chi si fida di te, tira su <strong>Astuzia</strong>.</p>","text":"Ottieni Attaccare alle Spalle e Falsificare (fuori limite). Quando attacchi alle spalle chi si fida di te, tira su Astuzia.","back":["pb-emissario"]},{"id":"pb-emissario-trame","title":"Piani e Complotti","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Piani e Complotti"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-emissario"]},{"id":"pb-emissario-fiducia","title":"Fidati di Me","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Fidati di Me"],"html":"<p>Quando calmi un PNG furioso, tira su <strong>Astuzia</strong>. Con un successo placa la sua rabbia; scegli 1 (<span class=\"res\">7-9</span>) o 2 (<span class=\"res\">10+</span>): rivela una vulnerabilità inattesa; esita e crei un'opportunità; ti concede più fiducia. Con un fallimento puoi calmarlo solo dirottando la sua frustrazione.</p>","text":"Quando calmi un PNG furioso, tira su Astuzia. Con un successo placa la sua rabbia; scegli 1 (7-9) o 2 (10+): rivela una vulnerabilità inattesa; esita e crei un'opportunità; ti concede più fiducia. Con un fallimento puoi calmarlo solo dirottando la sua frustrazione.","back":["pb-emissario"]},{"id":"pb-emissario-anello","title":"Il Bacio dell'Anello","cat":"mosse","group":"Ambasciatore","src":"VF p.106","aliases":["Il Bacio dell'Anello"],"html":"<p>Uscendo da un incontro con qualcuno di ricco o potente, dichiara di avergli preso qualcosa e tira su <strong>Astuzia</strong>. Con un successo il GM ti dice cosa hai preso. Con <span class=\"res\">7-9</span> se ne accorgeranno dopo: segna nomea. Con un fallimento se ne accorgono subito: segna 2-nomea e scappa o trova una scusa.</p>","text":"Uscendo da un incontro con qualcuno di ricco o potente, dichiara di avergli preso qualcosa e tira su Astuzia. Con un successo il GM ti dice cosa hai preso. Con 7-9 se ne accorgeranno dopo: segna nomea. Con un fallimento se ne accorgono subito: segna 2-nomea e scappa o trova una scusa.","back":["pb-emissario"]},{"id":"pb-esule","title":"L'Esule","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.101-104","aliases":["Esule","Exile"],"html":"<p><em>Un tempo membro di spicco di una fazione potente, ora ne sei esiliato.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Sgattaiolare</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lucertola</li><li><strong>Passato</strong>: la fazione che ti ha esiliato parte da Reputazione -2; quella che ora vuole la tua lealtà parte da +1</li></ul><p><strong>Natura</strong></p><ul><li><em>Cospiratore</em>: svuota la fatica quando prometti risorse preziose a una figura pericolosa per ottenerne l'aiuto.</li><li><em>Vendicatore</em>: svuota la fatica quando attacchi apertamente chi ha fatto un torto a te o ai tuoi protetti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Protettore (vedi grandezza in lui), Familiare (ti ha accolto nei primi giorni d'esilio).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-esule-conosciuto\" data-id=\"pb-esule-conosciuto\">Conosciuto da Tutti</a> + due tra <a class=\"xl\" href=\"#pb-esule-sopra\" data-id=\"pb-esule-sopra\">Superiore</a>, <a class=\"xl\" href=\"#pb-esule-porto\" data-id=\"pb-esule-porto\">Ecco a Voi...</a>, <a class=\"xl\" href=\"#pb-esule-grande\" data-id=\"pb-esule-grande\">Il Migliore</a>, <a class=\"xl\" href=\"#pb-esule-re\" data-id=\"pb-esule-re\">Nato per Regnare</a>, <a class=\"xl\" href=\"#pb-esule-carta\" data-id=\"pb-esule-carta\">Documenti Falsi</a>.</p>","text":"Un tempo membro di spicco di una fazione potente, ora ne sei esiliato. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +1, Vigore +1 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele - Imprese: Sgattaiolare - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, lucertola - Passato: la fazione che ti ha esiliato parte da Reputazione -2; quella che ora vuole la tua lealtà parte da +1 Natura - Cospiratore: svuota la fatica quando prometti risorse preziose a una figura pericolosa per ottenerne l'aiuto. - Vendicatore: svuota la fatica quando attacchi apertamente chi ha fatto un torto a te o ai tuoi protetti. Motivazioni: Lealtà, Vendetta, C
