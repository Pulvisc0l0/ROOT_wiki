nnare; guarisci con un divertimento locale eccitante. - Distratto: -2 alle imprese da furfante; guarisci aiutando un abitante in un lavoro faticoso. Lasciando una radura per la strada aperta, guarisci una condizione e la banda ha +1 alla mossa di viaggio.","back":["pb-nomade"]},{"id":"pb-nomade-straniero","title":"Straniero in Terra Straniera","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Straniero in Terra Straniera"],"html":"<p>Quando giri da solo per una radura osservando gli abitanti, tira su <strong>Fortuna</strong>. Chiedi 1 (<span class=\"res\">7-9</span>) o 2 (<span class=\"res\">10+</span>): chi può cambiare le cose qui? qual è il punto debole della radura? di chi può fidarsi la banda? qual è la minaccia più grande per la fazione dominante? Con un fallimento finisci in una situazione imbarazzante, pericolosa o compromettente.</p>","text":"Quando giri da solo per una radura osservando gli abitanti, tira su Fortuna. Chiedi 1 (7-9) o 2 (10+): chi può cambiare le cose qui? qual è il punto debole della radura? di chi può fidarsi la banda? qual è la minaccia più grande per la fazione dominante? Con un fallimento finisci in una situazione imbarazzante, pericolosa o compromettente.","back":["pb-nomade"]},{"id":"pb-nomade-verita","title":"La Verità al Potere","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["La Verità al Potere"],"html":"<p>Quando condividi la tua prospettiva di straniero per <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> un'autorità, segna fatica per tirare su <strong>Fortuna</strong> invece della Reputazione.</p>","text":"Quando condividi la tua prospettiva di straniero per Influenzare un PNG un'autorità, segna fatica per tirare su Fortuna invece della Reputazione.","back":["pb-nomade"]},{"id":"pb-nomade-stella","title":"Nato Sotto una Stella Cometa","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Nato Sotto una Stella Cometa"],"html":"<p>Una casella extra di fatica. Quando viaggi sul sentiero a passo tranquillo o normale, dopo il tiro svuoti tutta la fatica.</p>","text":"Una casella extra di fatica. Quando viaggi sul sentiero a passo tranquillo o normale, dopo il tiro svuoti tutta la fatica.","back":["pb-nomade"]},{"id":"pb-nomade-visto","title":"Non è la Prima Volta","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Non è la Prima Volta"],"html":"<p>Quando offri conforto (storia, pasto, canzone) a un PNG paralizzato dall'emozione, tira su <strong>Fortuna</strong>. Con un successo torna in sé e cerca subito di rimediare; con <span class=\"res\">10+</span> ti è grato: segna anche 2-prestigio con la sua fazione. Con un fallimento ti accorgi tardi di aver frainteso: rivela una verità terribile.</p>","text":"Quando offri conforto (storia, pasto, canzone) a un PNG paralizzato dall'emozione, tira su Fortuna. Con un successo torna in sé e cerca subito di rimediare; con 10+ ti è grato: segna anche 2-prestigio con la sua fazione. Con un fallimento ti accorgi tardi di aver frainteso: rivela una verità terribile.","back":["pb-nomade"]},{"id":"pb-nomade-prendo","title":"Questa la Prendo Io","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Questa la Prendo Io"],"html":"<p>Ottieni <a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a> (fuori limite). Quando disarmi chi minaccia qualcuno più debole, tira su <strong>Vigore</strong>; se perde l'arma, segna un'altra fatica per prenderla tu.</p>","text":"Ottieni Disarmare (fuori limite). Quando disarmi chi minaccia qualcuno più debole, tira su Vigore; se perde l'arma, segna un'altra fatica per prenderla tu.","back":["pb-nomade"]},{"id":"pb-orfano","title":"L'Orfano","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.85-88","aliases":["Orfano","Orphan"],"html":"<p><em>Sei cresciuto da solo e impari le vie della foresta dai vagabondi che le conoscono meglio.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +2, Vigore 0</li><li><strong>Abilità iniziale</strong>: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Borseggiare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 8</li></ul><p><strong>Natura</strong></p><ul><li><em>Disobbediente</em>: svuota la fatica quando affronti da solo un problema serio senza consultare la banda.</li><li><em>Grintoso</em>: svuota la fatica quando abbatti un nemico pericoloso senza segnare consumo né usura.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>.</p><p><strong>Legami</strong>: Protettore (ti ricorda un familiare perduto), Familiare (ti tratta come famiglia).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-orfano-imparo\" data-id=\"pb-orfano-imparo\">Alle Prime Armi</a> + due tra <a class=\"xl\" href=\"#pb-orfano-trascurato\" data-id=\"pb-orfano-trascurato\">Facilmente Ignorato</a>, <a class=\"xl\" href=\"#pb-orfano-famiglia\" data-id=\"pb-orfano-famiglia\">Una Nuova Famiglia</a>, <a class=\"xl\" href=\"#pb-orfano-strada\" data-id=\"pb-orfano-strada\">Ragazzo di Strada</a>, <a class=\"xl\" href=\"#pb-orfano-sottovalutato\" data-id=\"pb-orfano-sottovalutato\">Sottovalutato</a>, <a class=\"xl\" href=\"#pb-orfano-parole\" data-id=\"pb-orfano-parole\">Parole Taglienti</a>.</p>","text":"Sei cresciuto da solo e impari le vie della foresta dai vagabondi che le conoscono meglio. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +2, Vigore 0 - Abilità iniziale: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro - Imprese: Acrobazie, Borseggiare, Gioco di Prestigio - Valore iniziale: 8 Natura - Disobbediente: svuota la fatica quando affronti da solo un problema serio senza consultare la banda. - Grintoso: svuota la fatica quando abbatti un nemico pericoloso senza segnare consumo né usura. Motivazioni: Ambizione, Scoperta, Brivido, Caos. Legami: Protettore (ti ricorda un familiare perduto), Familiare (ti tratta come famiglia). Mosse: inizi con Alle Prime Armi + due tra Facilmente Ignorato, Una Nuova Famiglia, Ragazzo di Strada, Sottovalutato, Parole Taglienti.","back":["playbook-indice"]},{"id":"pb-orfano-imparo","title":"Alle Prime Armi","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Alle Prime Armi"],"html":"<p>Hai un tracciato di <strong>Fiducia</strong> (6 caselle). Scegli un altro vagabondo come tuo <strong>idolo</strong>: quando agisci come pensi agirebbe lui, segna Fiducia per prendere <span class=\"res\">10+</span> su qualsiasi mossa. Quando soddisfi la natura del tuo idolo, svuota il tracciato e barra una casella. Puoi cambiare idolo in ogni momento (tracciato di nuovo a 6), ma mai tornare allo stesso.</p>","text":"Hai un tracciato di Fiducia (6 caselle). Scegli un altro vagabondo come tuo idolo: quando agisci come pensi agirebbe lui, segna Fiducia per prendere 10+ su qualsiasi mossa. Quando soddisfi la natura del tuo idolo, svuota il tracciato e barra una casella. Puoi cambiare idolo in ogni momento (tracciato di nuovo a 6), ma mai tornare allo stesso.","back":["pb-orfano"]},{"id":"pb-orfano-trascurato","title":"Facilmente Ignorato","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Facilmente Ignorato"],"html":"<p>Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti mentre qualcosa o qualcuno fa da diversivo, tira su <strong>Fortuna</strong>.</p>","text":"Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti mentre qualcosa o qualcuno fa da diversivo, tira su Fortuna.","back":["pb-orfano"]},{"id":"pb-orfano-famiglia","title":"Una Nuova Famiglia","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Una Nuova Famiglia"],"html":"<p>Prendi due legami in più. Segna fatica per comparire all'improvviso in una scena con uno dei tuoi legami, se nulla te lo avrebbe impedito.</p>","text":"Prendi due legami in più. Segna fatica per comparire all'improvviso in una scena con uno dei tuoi legami, se nulla te lo avrebbe impedito.","back":["pb-orfano"]},{"id":"pb-orfano-strada","title":"Ragazzo di Strada","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Ragazzo di Strada"],"html":"<p>Quando parli con monelli ed emarginati di una radura, tira su <strong>Fortuna</strong>. Con un successo scegli 1: un posto dove la banda può nascondersi; un bersaglio vulnerabile; un ingresso segreto a un luogo importante. Con <span class=\"res\">10+</span> fai anche due domande. Con un fallimento qualcuno ti nota e ti dirà cosa vuole per lasciarti in pace.</p>","text":"Quando parli con monelli ed emarginati di una radura, tira su Fortuna. Con un successo scegli 1: un posto dove la banda può nascondersi; un bersaglio vulnerabile; un ingresso segreto a un luogo importante. Con 10+ fai anche due domande. Con un fallimento qualcuno ti nota e ti dirà cosa vuole per lasciarti in pace.","back":["pb-orfano"]},{"id":"pb-orfano-sottovalutato","title":"Sottovalutato","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Sottovalutato"],"html":"<p>Finché non dimostri di essere una minaccia nessuno ti tratta come tale: la prima volta in sessione che segni nomea con una fazione, segnane una in meno. Quando la tua Reputazione con una fazione arriva a +2 o -2, perdi questa mossa e scegline un'altra.</p>","text":"Finché non dimostri di essere una minaccia nessuno ti tratta come tale: la prima volta in sessione che segni nomea con una fazione, segnane una in meno. Quando la tua Reputazione con una fazione arriva a +2 o -2, perdi questa mossa e scegline un'altra.","back":["pb-orfano"]},{"id":"pb-orfano-parole","title":"Parole Taglienti","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Parole Taglienti"],"html":"<p>Quando inganni un PNG provocandolo apertamente con insulti, tira su <strong>Fortuna</strong>. Quando provochi un altro vagabondo deridendolo, dì cosa vuoi che faccia e segna fino a 3-fatica: deve abboccare o segnare la stessa fatica.</p>","text":"Quando inganni un PNG provocandolo apertamente con insulti, tira su Fortuna. Quando provochi un altro vagabondo deridendolo, dì cosa vuoi che faccia e segna fino a 3-fatica: deve abboccare o segnare la stessa fatica.","back":["pb-orfano"]},{"id":"pb-flagello","title":"Il Flagello","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.89-92","aliases":["Flagello","Scourge"],"html":"<p><em>Un potente ti ha tolto tutto e lasciato per morto: ora cerchi giustizia, a ogni costo.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza -1, Fortuna +1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie</li><li><strong>Valore iniziale</strong>: 11</li></ul><p><strong>Natura</strong></p><ul><li><em>Soccorritore</em>: svuota la fatica quando sacrifichi un vantaggio per salvare la vita dei vulnerabili.</li><li><em>Dissidente</em>: svuota la fatica quando ti schieri pubblicamente con chi ha subito torti dai potenti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>.</p><p><strong>Legami</strong>: Protettore (ti ricorda qualcuno che hai perso), Compagno (avete abbattuto un complice della tua nemesi).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-flagello-lista\" data-id=\"pb-flagello-lista\">La Lista</a> + due tra <a class=\"xl\" href=\"#pb-flagello-pagare\" data-id=\"pb-flagello-pagare\">Implacabile</a>, <a class=\"xl\" href=\"#pb-flagello-ragazzo\" data-id=\"pb-flagello-ragazzo\">Fidati di Me, Ragazzo</a>, <a class=\"xl\" href=\"#pb-flagello-notte\" data-id=\"pb-flagello-notte\">Io Sono la Notte</a>, <a class=\"xl\" href=\"#pb-flagello-pieta\" data-id=\"pb-flagello-pieta\">Alla Tua Mercé</a>, <a class=\"xl\" href=\"#pb-flagello-morire\" data-id=\"pb-flagello-morire\">Oggi è un Buon Giorno per Morire</a>.</p>","text":"Un potente ti ha tolto tutto e lasciato per morto: ora cerchi giustizia, a ogni costo. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza -1, Fortuna +1, Vigore +2 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele - Imprese: Acrobazie - Valore iniziale: 11 Natura - Soccorritore: svuota la fatica quando sacrifichi un vantaggio per salvare la vita dei vulnerabili. - Dissidente: svuota la fatica quando ti schieri pubblicamente con chi ha subito torti dai potenti. Motivazioni: Infamia, Giustizia, Protezione, Vendetta. Legami: Protettore (ti ricorda qualcuno che hai perso), Compagno (avete abbattuto un complice della tua nemesi). Mosse: inizi con La Lista + due tra Implacabile, Fidati di Me, Ragazzo, Io Sono la Notte, Alla Tua Mercé, Oggi è un Buon Giorno per Morire.","back":["playbook-indice"]},{"id":"pb-flagello-lista","title":"La Lista","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["La Lista"],"html":"<p>All'inizio scrivi due nomi: la tua nemesi e il suo complice principale. +1 continuo a perseguire la vendetta contro chiunque sia nella lista. Quando ti vendichi di qualcuno, cancellalo e prendi un <strong>Marchio</strong>. Una volta per sessione puoi aggiungere un PNG prendendo un Marchio.</p><p>Marchi:</p><ul><li>La prossima volta che parli della tua vita felice prima della perdita, svuota 2-fatica.</li><li>La prossima volta che parli del tradimento della nemesi, svuota 2-fatica.</li><li>Rabbia costante: +1 a distruggere, -1 a chiedere favori.</li><li>Insofferenza: segni fatica quando convinci; +1 alle mosse con le armi con 3+ fatica segnata.</li><li>Solo la vendetta appaga: non svuoti più di 1-fatica riposando; svuoti 2-fatica aggiungendo un nome.</li><li>Vendetta chiama vendetta: un vendicatore PNG ti dà la caccia.</li><li>Ti perdi nella vendetta: il personaggio non è più un PG.</li></ul>","text":"All'inizio scrivi due nomi: la tua nemesi e il suo complice principale. +1 continuo a perseguire la vendetta contro chiunque sia nella lista. Quando ti vendichi di qualcuno, cancellalo e prendi un Marchio. Una volta per sessione puoi aggiungere un PNG prendendo un Marchio. Marchi: - La prossima volta che parli della tua vita felice prima della perdita, svuota 2-fatica. - La prossima volta che parli del tradimento della nemesi, svuota 2-fatica. - Rabbia costante: +1 a distruggere, -1 a chiedere favori. - Insofferenza: segni fatica quando convinci; +1 alle mosse con le armi con 3+ fatica segnata. - Solo la vendetta appaga: non svuoti più di 1-fatica riposando; svuoti 2-fatica aggiungendo un nome. - Vendetta chiama vendetta: un vendicatore PNG ti dà la caccia. - Ti perdi nella vendetta: il personaggio non è più un PG.","back":["pb-flagello"]},{"id":"pb-flagello-pagare","title":"Implacabile","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Implacabile"],"html":"<p>Una casella extra di fatica. Una volta per battaglia, dopo aver inflitto ferite, segna fatica per infliggere 2-ferite aggiuntive.</p>","text":"Una casella extra di fatica. Una volta per battaglia, dopo aver inflitto ferite, segna fatica per infliggere 2-ferite aggiuntive.","back":["pb-flagello"]},{"id":"pb-flagello-ragazzo","title":"Fidati di Me, Ragazzo","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Fidati di Me Ragazzo"],"html":"<p>Quando convinci un PNG offrendo la tua amara saggezza, tira sulla <strong>fatica attualmente segnata</strong> (max +4) invece del Carisma. Con un fallimento rifiuta violentemente la tua visione o la abbraccia con troppo fervore.</p>","text":"Quando convinci un PNG offrendo la tua amara saggezza, tira sulla fatica attualmente segnata (max +4) invece del Carisma. Con un fallimento rifiuta violentemente la tua visione o la abbraccia con troppo fervore.","back":["pb-flagello"]},{"id":"pb-flagello-notte","title":"Io Sono la Notte","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Io Sono la Notte"],"html":"<p>Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti indagando su un torto o perseguendo la vendetta, tira su <strong>Fortuna</strong>.</p>","text":"Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti indagando su un torto o perseguendo la vendetta, tira su Fortuna.","back":["pb-flagello"]},{"id":"pb-flagello-pieta","title":"Alla Tua Mercé","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Alla Tua Mercé"],"html":"<p>Quando risparmi un PNG che avresti potuto distruggere o umiliare, tira su <strong>Fortuna</strong>. Con un successo il gesto lenisce l'anima (svuota tutta la fatica) oppure ottieni gratitudine materiale (svuota 2+ consumo); con <span class=\"res\">10+</span> entrambe. Con un fallimento qualcuno approfitta del tuo gesto.</p>","text":"Quando risparmi un PNG che avresti potuto distruggere o umiliare, tira su Fortuna. Con un successo il gesto lenisce l'anima (svuota tutta la fatica) oppure ottieni gratitudine materiale (svuota 2+ consumo); con 10+ entrambe. Con un fallimento qualcuno approfitta del tuo gesto.","back":["pb-flagello"]},{"id":"pb-flagello-morire","title":"Oggi è un Buon Giorno per Morire","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Oggi è un Buon Giorno per Morire"],"html":"<p>+1 Fortuna (max +3).</p>","text":"+1 Fortuna (max +3).","back":["pb-flagello"]},{"id":"motivazioni-indice","title":"Elenco delle Motivazioni","cat":"indici","group":"","src":"B p.170-174; VF p.45-49; RS p.38-39","aliases":["elenco motivazioni"],"html":"<p>Regole: <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Motivazioni</a>.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#mot-antimilitarista\" data-id=\"mot-antimilitarista\">Antimilitarista</a>, <a class=\"xl\" href=\"#mot-espiazione\" data-id=\"mot-espiazione\">Espiazione</a>, <a class=\"xl\" href=\"#mot-sviluppo\" data-id=\"mot-sviluppo\">Sviluppo</a>, <a class=\"xl\" href=\"#mot-devozione\" data-id=\"mot-devozione\">Devozione</a>, <a class=\"xl\" href=\"#mot-discordia\" data-id=\"mot-discordia\">Discordia</a>, <a class=\"xl\" href=\"#mot-spirito-corpo\" data-id=\"mot-spirito-corpo\">Spirito di Corpo</a>, <a class=\"xl\" href=\"#mot-eroe-popolare\" data-id=\"mot-eroe-popolare\">Eroe Popolare</a>, <a class=\"xl\" href=\"#mot-gloria\" data-id=\"mot-gloria\">Gloria</a>, <a class=\"xl\" href=\"#mot-misteri\" data-id=\"mot-misteri\">Misteri</a>, <a class=\"xl\" href=\"#mot-partigiano\" data-id=\"mot-partigiano\">Partigiano</a>, <a class=\"xl\" href=\"#mot-viaggiatore\" data-id=\"mot-viaggiatore\">Viaggiatore</a>, <a class=\"xl\" href=\"#mot-ricercato\" data-id=\"mot-ricercato\">Ricercato</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#mot-diplomazia\" data-id=\"mot-diplomazia\">Diplomazia</a>, <a class=\"xl\" href=\"#mot-rabdomante\" data-id=\"mot-rabdomante\">Rabdomante</a>, <a class=\"xl\" href=\"#mot-folclorista\" data-id=\"mot-folclorista\">Folclorista</a>, <a class=\"xl\" href=\"#mot-guardiano\" data-id=\"mot-guardiano\">Guardiano</a>.</p>","text":"Regole: Motivazioni. Manuale base: Ambizione, Avidità, Brivido, Caos, Crimine, Giustizia, Infamia, Lealtà, Libertà, Princìpi, Protezione, Scoperta, Vendetta, Voglia di Viaggiare, Zampe Pulite. Viandanti e Forestieri: Antimilitarista, Espiazione, Sviluppo, Devozione, Discordia, Spirito di Corpo, Eroe Popolare, Gloria, Misteri, Partigiano, Viaggiatore, Ricercato. Rovine e Spedizioni: Diplomazia, Rabdomante, Folclorista, Guardiano.","back":["motivazione"]},{"id":"mot-ambizione","title":"Ambizione","cat":"motivazioni","group":"","src":"B p.171","aliases":["Ambizione"],"html":"<p>Avanzi quando <strong>aumenti la tua Reputazione</strong> con una qualsiasi fazione. Conta il numero della Reputazione, non le caselle di prestigio (anche da -3 a -2).</p>","text":"Avanzi quando aumenti la tua Reputazione con una qualsiasi fazione. Conta il numero della Reputazione, non le caselle di prestigio (anche da -3 a -2).","back":["pb-avventuriero","pb-ladro","pb-mastro","pb-campione","pb-cronista","pb-emissario","pb-buongustaio","pb-orfano","motivazioni-indice"]},{"id":"mot-avidita","title":"Avidità","cat":"motivazioni","group":"","src":"B p.171","aliases":["Avidità"],"html":"<p>Avanzi quando ti assicuri <strong>una grossa ricompensa o un tesoro</strong>: deve valere moltissimo, indicativamente 5-Valore o più.</p>","text":"Avanzi quando ti assicuri una grossa ricompensa o un tesoro: deve valere moltissimo, indicativamente 5-Valore o più.","back":["pb-ladro","pb-mastro","pb-emissario","pb-razziatore","pb-cercatore","pb-trafficante","pb-cacciatore","motivazioni-indice"]},{"id":"mot-brivido","title":"Brivido","cat":"motivazioni","group":"","src":"B p.171","aliases":["Brivido"],"html":"<p>Avanzi quando <strong>sfuggi a morte certa o alla prigionia</strong>: una fuga rocambolesca da un pericolo che sembrava insormontabile.</p>","text":"Avanzi quando sfuggi a morte certa o alla prigionia: una fuga rocambolesca da un pericolo che sembrava insormontabile.","back":["pb-canaglia","pb-ciarlatano","pb-ladro","pb-ronin","pb-cantastorie","pb-nomade","pb-orfano","motivazioni-indice"]},{"id":"mot-caos","title":"Caos","cat":"motivazioni","group":"","src":"B p.171","aliases":["Caos"],"html":"<p>Avanzi quando <strong>rovesci un'autorità o un ordine particolarmente tirannici e pericolosi</strong> (anche temporaneamente). L'ultima parola sul \"tirannico\" spetta al GM.</p>","text":"Avanzi quando rovesci un'autorità o un ordine particolarmente tirannici e pericolosi (anche temporaneamente). L'ultima parola sul \"tirannico\" spetta al GM.","back":["pb-canaglia","pb-ciarlatano","pb-esule","pb-eretico","pb-razziatore","pb-orfano","motivazioni-indice"]},{"id":"mot-crimine","title":"Crimine","cat":"motivazioni","group":"","src":"B p.171-172","aliases":["Crimine"],"html":"<p>Avanzi quando, <strong>contro ogni previsione, ottieni illegalmente qualcosa di valore o metti a segno un colpo</strong>. Deve essere una storia da raccontare (derubare il palazzo del governatore, non ingannare qualche guardia).</p>","text":"Avanzi quando, contro ogni previsione, ottieni illegalmente qualcosa di valore o metti a segno un colpo. Deve essere una storia da raccontare (derubare il palazzo del governatore, non ingannare qualche guardia).","back":["pb-canaglia","pb-predone","pb-pirata","pb-principe","pb-razziatore","pb-trafficante","motivazioni-indice"]},{"id":"mot-giustizia","title":"Giustizia","cat":"motivazioni","group":"","src":"B p.172","aliases":["Giustizia"],"html":"<p>Avanzi quando <strong>ottieni giustizia per chi ha subito un torto da qualcuno di ricco e potente</strong>. Il torto deve essere serio e il colpevole davvero potente.</p>","text":"Avanzi quando ottieni giustizia per chi ha subito un torto da qualcuno di ricco e potente. Il torto deve essere serio e il colpevole davvero potente.","back":["pb-avventuriero","pb-giudice","pb-campione","pb-cronista","pb-cercatore","pb-cacciatore","pb-flagello","motivazioni-indice"]},{"id":"mot-infamia","title":"Infamia","cat":"motivazioni","group":"","src":"B p.172","aliases":["Infamia"],"html":"<p>Avanzi quando <strong>la tua Reputazione diminuisce</strong> con una qualsiasi fazione (conta il numero, non le caselle).</p>","text":"Avanzi quando la tua Reputazione diminuisce con una qualsiasi fazione (conta il numero, non le caselle).","back":["pb-canaglia","pb-predone","pb-esule","pb-pirata","pb-cantastorie","pb-flagello","motivazioni-indice"]},{"id":"mot-lealta","title":"Lealtà","cat":"motivazioni","group":"","src":"B p.172","aliases":["Lealtà"],"html":"<p>Nomina colui a cui sei fedele (PNG o PG). Avanzi quando <strong>obbedisci ai suoi ordini, ma farlo ti costa molto</strong>. Senza rischi o costi non conta.</p>","text":"Nomina colui a cui sei fedele (PNG o PG). Avanzi quando obbedisci ai suoi ordini, ma farlo ti costa molto. Senza rischi o costi non conta.","back":["pb-giudice","pb-campione","pb-emissario","pb-esule","pb-razziatore","pb-trafficante","pb-buongustaio","motivazioni-indice"]},{"id":"mot-liberta","title":"Libertà","cat":"motivazioni","group":"","src":"B p.172","aliases":["Libertà"],"html":"<p>Avanzi quando <strong>liberi un gruppo di abitanti dall'oppressione</strong>, anche solo per ora; l'oppressione deve essere reale per chi la subisce.</p>","text":"Avanzi quando liberi un gruppo di abitanti dall'oppressione, anche solo per ora; l'oppressione deve essere reale per chi la subisce.","back":["pb-ladro","pb-ranger","pb-eretico","pb-pirata","pb-principe","pb-cacciatore","pb-nomade","motivazioni-indice"]},{"id":"mot-principi","title":"Princìpi","cat":"motivazioni","group":"","src":"B p.173","aliases":["Princìpi"],"html":"<p>Avanzi quando <strong>metti in pericolo te o i tuoi alleati per esprimere o incarnare i tuoi principi morali</strong>. Devono essere veri principi (es. \"la violenza non è mai giustificata\"), definiti almeno a grandi linee.</p>","text":"Avanzi quando metti in pericolo te o i tuoi alleati per esprimere o incarnare i tuoi principi morali. Devono essere veri principi (es. \"la violenza non è mai giustificata\"), definiti almeno a grandi linee.","back":["pb-avventuriero","pb-giudice","pb-ronin","pb-campione","pb-eretico","pb-nomade","motivazioni-indice"]},{"id":"mot-protezione","title":"Protezione","cat":"motivazioni","group":"","src":"B p.173-174","aliases":["Protezione"],"html":"<p>Nomina il tuo protetto (PNG o PG). Avanzi quando <strong>lo proteggi da un grave pericolo o quando il tempo passa ed è ancora al sicuro</strong>. Un PNG deve viaggiare con te o trovarsi nella sua radura quando passi.</p>","text":"Nomina il tuo protetto (PNG o PG). Avanzi quando lo proteggi da un grave pericolo o quando il tempo passa ed è ancora al sicuro. Un PNG deve viaggiare con te o trovarsi nella sua radura quando passi.","back":["pb-giudice","pb-mastro","pb-ranger","pb-eretico","pb-principe","pb-cacciatore","pb-flagello","motivazioni-indice"]},{"id":"mot-scoperta","title":"Scoperta","cat":"motivazioni","group":"","src":"B p.174","aliases":["Scoperta"],"html":"<p>Avanzi quando <strong>scopri qualcosa di meraviglioso o delle nuove rovine nella foresta</strong> (nuove per te). Deve essere nella foresta, non nelle radure.</p>","text":"Avanzi quando scopri qualcosa di meraviglioso o delle nuove rovine nella foresta (nuove per te). Deve essere nella foresta, non nelle radure.","back":["pb-predone","pb-ranger","pb-cronista","pb-cantastorie","pb-cercatore","pb-buongustaio","pb-orfano","motivazioni-indice","rovine-indice"]},{"id":"mot-vendetta","title":"Vendetta","cat":"motivazioni","group":"","src":"B p.174","aliases":["Vendetta"],"html":"<p>Nomina il tuo nemico (un PNG potente, mai un PG). Avanzi quando <strong>danneggi lui o i suoi interessi in modo significativo</strong>.</p>","text":"Nomina il tuo nemico (un PNG potente, mai un PG). Avanzi quando danneggi lui o i suoi interessi in modo significativo.","back":["pb-mastro","pb-ranger","pb-ronin","pb-esule","pb-pirata","pb-flagello","motivazioni-indice"]},{"id":"mot-voglia-viaggiare","title":"Voglia di Viaggiare","cat":"motivazioni","group":"","src":"B p.174","aliases":["Voglia di Viaggiare"],"html":"<p>Avanzi quando <strong>termini un viaggio in una radura</strong> (all'arrivo, non alla partenza).</p>","text":"Avanzi quando termini un viaggio in una radura (all'arrivo, non alla partenza).","back":["pb-ciarlatano","pb-predone","pb-ronin","pb-principe","pb-cercatore","pb-nomade","motivazioni-indice"]},{"id":"mot-zampe-pulite","title":"Zampe Pulite","cat":"motivazioni","group":"","src":"B p.174","aliases":["Zampe Pulite"],"html":"<p>Avanzi quando <strong>porti a termine un'impresa illegale e ne esci pulito</strong>: chi sa del crimine non ha motivo (né prove) per incolparti.</p>","text":"Avanzi quando porti a termine un'impresa illegale e ne esci pulito: chi sa del crimine non ha motivo (né prove) per incolparti.","back":["pb-avventuriero","pb-ciarlatano","pb-cronista","pb-emissario","pb-cantastorie","pb-trafficante","pb-buongustaio","motivazioni-indice"]},{"id":"mot-antimilitarista","title":"Antimilitarista","cat":"motivazioni","group":"","src":"VF p.45","aliases":["Antimilitarista"],"html":"<p>Avanzi quando <strong>saboti gli eserciti di una fazione non-abitante</strong> o la sua capacità di fare la guerra (bruciare scorte, distruggere armi d'assedio, falsificare ordini). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando saboti gli eserciti di una fazione non-abitante o la sua capacità di fare la guerra (bruciare scorte, distruggere armi d'assedio, falsificare ordini). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-espiazione","title":"Espiazione","cat":"motivazioni","group":"","src":"VF p.45","aliases":["Espiazione"],"html":"<p>Avanzi quando <strong>ottieni il perdono di qualcuno che tu o i tuoi alleati avete danneggiato</strong> in passato, rimediando sinceramente. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando ottieni il perdono di qualcuno che tu o i tuoi alleati avete danneggiato in passato, rimediando sinceramente. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-sviluppo","title":"Sviluppo","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Sviluppo"],"html":"<p>Avanzi quando <strong>contribuisci a uno sviluppo duraturo di un'intera radura</strong> (un mulino, mura rinforzate, una rovina bonificata). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando contribuisci a uno sviluppo duraturo di un'intera radura (un mulino, mura rinforzate, una rovina bonificata). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-devozione","title":"Devozione","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Devozione"],"html":"<p>Segui una religione (es. quella della Setta delle Lucertole): descrivine le credenze. Avanzi quando <strong>un non credente condivide una tua credenza o pratica</strong>. <em>(trad. non ufficiale)</em></p>","text":"Segui una religione (es. quella della Setta delle Lucertole): descrivine le credenze. Avanzi quando un non credente condivide una tua credenza o pratica. (trad. non ufficiale)","back":["motivazioni-indice","fazione-lucertole"]},{"id":"mot-discordia","title":"Discordia","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Discordia"],"html":"<p>Avanzi quando <strong>le tue azioni creano o inaspriscono un grave conflitto tra due fazioni</strong> (truppe inviate, strade bloccate). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando le tue azioni creano o inaspriscono un grave conflitto tra due fazioni (truppe inviate, strade bloccate). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-spirito-corpo","title":"Spirito di Corpo","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Spirito di Corpo"],"html":"<p>Avanzi quando <strong>vinci una battaglia contro veri soldati nemici insieme ad amici e alleati</strong>. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando vinci una battaglia contro veri soldati nemici insieme ad amici e alleati. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-eroe-popolare","title":"Eroe Popolare","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Eroe Popolare"],"html":"<p>Avanzi quando <strong>compi un atto significativo di servizio o eroismo per gli abitanti</strong>, che migliori davvero la loro situazione e risponda a un loro problema reale. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando compi un atto significativo di servizio o eroismo per gli abitanti, che migliori davvero la loro situazione e risponda a un loro problema reale. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-gloria","title":"Gloria","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Gloria"],"html":"<p>Avanzi quando <strong>sconfiggi un degno avversario in singolar tenzone</strong>, senza interferenze. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando sconfiggi un degno avversario in singolar tenzone, senza interferenze. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-misteri","title":"Misteri","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Misteri"],"html":"<p>Avanzi quando <strong>scopri la verità dietro fenomeni strani</strong> in una radura (smascherare un falso mostro, la causa di una \"maledizione\"). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando scopri la verità dietro fenomeni strani in una radura (smascherare un falso mostro, la causa di una \"maledizione\"). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-partigiano","title":"Partigiano","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Partigiano"],"html":"<p>Nomina una fazione. Avanzi quando <strong>completi una missione affidatati da un suo membro importante</strong>. <em>(trad. non ufficiale)</em></p>","text":"Nomina una fazione. Avanzi quando completi una missione affidatati da un suo membro importante. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-viaggiatore","title":"Viaggiatore","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Viaggiatore"],"html":"<p>Avanzi quando <strong>sostituisci un oggetto prezioso o significativo con uno che rappresenti la cultura locale</strong>. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando sostituisci un oggetto prezioso o significativo con uno che rappresenti la cultura locale. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-ricercato","title":"Ricercato","cat":"motivazioni","group":"","src":"VF p.49","aliases":["Ricercato"],"html":"<p>Hai una taglia sulla testa: indica il crimine. Avanzi quando <strong>sconfiggi o sfuggi a una minaccia seria che vuole riscuotere la taglia</strong>. <em>(trad. non ufficiale)</em></p>","text":"Hai una taglia sulla testa: indica il crimine. Avanzi quando sconfiggi o sfuggi a una minaccia seria che vuole riscuotere la taglia. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-diplomazia","title":"Diplomazia","cat":"motivazioni","group":"","src":"RS p.38","aliases":["Diplomazia"],"html":"<p>Avanzi quando <strong>aiuti a stringere un trattato o un accordo formale tra due o più gruppi in conflitto</strong> acceso. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando aiuti a stringere un trattato o un accordo formale tra due o più gruppi in conflitto acceso. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-rabdomante","title":"Rabdomante","cat":"motivazioni","group":"","src":"RS p.38","aliases":["Rabdomante"],"html":"<p>Avanzi quando <strong>aiuti una radura a scoprire e rivendicare una preziosa risorsa naturale</strong> nella foresta (sorgente calda, vena di minerale, raro frutteto). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando aiuti una radura a scoprire e rivendicare una preziosa risorsa naturale nella foresta (sorgente calda, vena di minerale, raro frutteto). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-folclorista","title":"Folclorista","cat":"motivazioni","group":"","src":"RS p.39","aliases":["Folclorista"],"html":"<p>Avanzi quando <strong>dimostri vera o falsa una leggenda locale</strong>, con prove definitive. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando dimostri vera o falsa una leggenda locale, con prove definitive. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-guardiano","title":"Guardiano delle Radure (Guardian)","cat":"motivazioni","group":"","src":"RS p.39","aliases":["Guardiano delle radure"],"html":"<p>Avanzi quando <strong>proteggi una radura da una grande bestia</strong> sconfiggendola o scacciandola per sempre (vedi <a class=\"xl\" href=\"#mostri-indice\" data-id=\"mostri-indice\">Mostri dei Boschi</a>). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando proteggi una radura da una grande bestia sconfiggendola o scacciandola per sempre (vedi Mostri dei Boschi). (trad. non ufficiale)","back":["motivazioni-indice","mostri-indice"]},{"id":"nature-indice","title":"Elenco delle Nature","cat":"indici","group":"","src":"B p.133-168; VF p.50-53; RS p.40-41","aliases":["elenco nature"],"html":"<p>Regole: <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a>. Ogni natura svuota <strong>tutto</strong> il tracciato della fatica.</p><p><strong>Nature dei playbook del manuale base</strong></p><ul><li><a class=\"xl\" href=\"#pb-avventuriero\" data-id=\"pb-avventuriero\">Avventuriero</a>: Estroverso, Pacifista</li><li><a class=\"xl\" href=\"#pb-canaglia\" data-id=\"pb-canaglia\">Canaglia</a>: Incendiario, Agguerrito</li><li><a class=\"xl\" href=\"#pb-ciarlatano\" data-id=\"pb-ciarlatano\">Ciarlatano</a>: Ingordo, Imbroglione</li><li><a class=\"xl\" href=\"#pb-giudice\" data-id=\"pb-giudice\">Giudice</a>: Difensore, Punitore</li><li><a class=\"xl\" href=\"#pb-ladro\" data-id=\"pb-ladro\">Ladro</a>: Cleptomane, Ribelle</li><li><a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Mastro</a>: Perfezionista, Estremista</li><li><a class=\"xl\" href=\"#pb-predone\" data-id=\"pb-predone\">Predone</a>: Diligente, Competitivo</li><li><a class=\"xl\" href=\"#pb-ranger\" data-id=\"pb-ranger\">Ranger</a>: Solitario, Cinico</li><li><a class=\"xl\" href=\"#pb-ronin\" data-id=\"pb-ronin\">Ronin</a>: Sopravvissuto, Pellegrino</li></ul><p><strong>Nature generiche di Viandanti e Forestieri</strong> (VF p.50-53, trad. non ufficiale)</p><ul><li><em>Spaccone</em>: quando accetti con sicurezza e in pubblico una sfida eccessivamente pericolosa.</li><li><em>Comandante</em>: quando imponi la tua autorità su un gruppo di non-vagabondi in una situazione tesa.</li><li><em>Codardo</em>: quando ti arrendi volontariamente (e davvero) a forze ostili.</li><li><em>Curioso</em>: quando affronti il pericolo per indagare una situazione o un luogo interessante.</li><li><em>Generoso</em>: quando fornisci quantità significative di provviste a chi ne ha bisogno.</li><li><em>Pettegolo</em>: quando riveli informazioni nuove e importanti a qualcuno che può usarle.</li><li><em>Improvvisatore</em>: quando cerchi di risolvere un problema tecnico senza strumenti o competenze adatte.</li><li><em>Ispiratore</em>: quando le tue azioni svuotano il tracciato del morale di un PNG o di un gruppo.</li><li><em>Martire</em>: quando affronti forze soverchianti per proteggere altri.</li><li><em>Ficcanaso</em>: quando entri in un luogo proibito per scoprire segreti compromettenti.</li><li><em>Populista</em>: quando inciti pubblicamente un gruppo di abitanti ad agire contro un'ingiustizia.</li><li><em>Vanitoso</em>: quando intervieni in modo plateale in una situazione che non ti riguardava per aiutare qualcuno.</li></ul><p><strong>Nature generiche di Rovine e Spedizioni</strong> (RS p.40-41, trad. non ufficiale)</p><ul><li><em>Consigliere</em>: quando aiuti un PNG ad arrivare a una posizione di influenza o comando.</li><li><em>Caritatevole</em>: quando doni un tesoro di valore ai capi della radura.</li><li><em>Colomba</em>: quando convinci un gruppo ostile a rinunciare alla lotta e sciogliersi.</li><li><em>Tuttofare</em>: quando accetti di aiutare una radura riparando uno strumento o una risorsa indispensabile.</li></ul>","text":"Regole: Natura. Ogni natura svuota tutto il tracciato della fatica. Nature dei playbook del manuale base - Avventuriero: Estroverso, Pacifista - Canaglia: Incendiario, Agguerrito - Ciarlatano: Ingordo, Imbroglione - Giudice: Difensore, Punitore - Ladro: Cleptomane, Ribelle - Mastro: Perfezionista, Estremista - Predone: Diligente, Competitivo - Ranger: Solitario, Cinico - Ronin: Sopravvissuto, Pellegrino Nature generiche di Viandanti e Forestieri (VF p.50-53, trad. non ufficiale) - Spaccone: quando accetti con sicurezza e in pubblico una sfida eccessivamente pericolosa. - Comandante: quando imponi la tua autorità su un gruppo di non-vagabondi in una situazione tesa. - Codardo: quando ti arrendi volontariamente (e davvero) a forze ostili. - Curioso: quando affronti il pericolo per indagare una situazione o un luogo interessante. - Generoso: quando fornisci quantità significative di provviste a chi ne ha bisogno. - Pettegolo: quando riveli informazioni nuove e importanti a qualcuno che può usarle. - Improvvisatore: quando cerchi di risolvere un problema tecnico senza strumenti o competenze adatte. - Ispiratore: quando le tue azioni svuotano il tracciato del morale di un PNG o di un gruppo. - Martire: quando affronti forze soverchianti per proteggere altri. - Ficcanaso: quando entri in un luogo proibito per scoprire segreti compromettenti. - Populista: quando inciti pubblicamente un gruppo di abitanti ad agire contro un'ingiustizia. - Vanitoso: quando intervieni in modo plateale in una situazione che non ti riguardava per aiutare qualcuno. Nature generiche di Rovine e Spedizioni (RS p.40-41, trad. non ufficiale) - Consigliere: quando aiuti un PNG ad arrivare a una posizione di influenza o comando. - Caritatevole: quando doni un tesoro di valore ai capi della radura. - Colomba: quando convinci un gruppo ostile a rinunciare alla lotta e sciogliersi. - Tuttofare: quando accetti di aiutare una radura riparando uno strumento o una risorsa indispensabile.","back":["natura"]},{"id":"legami-indice","title":"Elenco dei Legami","cat":"indici","group":"","src":"B p.51; VF p.54-56; RS p.42-44","aliases":["elenco legami"],"html":"<p>Regole: <a class=\"xl\" href=\"#legame\" data-id=\"legame\">Legami</a>.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#legame-protettore\" data-id=\"legame-protettore\">Protettore</a>, <a class=\"xl\" href=\"#legame-compagno\" data-id=\"legame-compagno\">Compagno</a>, <a class=\"xl\" href=\"#legame-sentinella\" data-id=\"legame-sentinella\">Sentinella</a>, <a class=\"xl\" href=\"#legame-amico\" data-id=\"legame-amico\">Amico</a>, <a class=\"xl\" href=\"#legame-professionista\" data-id=\"legame-professionista\">Professionista</a>, <a class=\"xl\" href=\"#legame-familiare\" data-id=\"legame-familiare\">Familiare</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#legame-fratello-armi\" data-id=\"legame-fratello-armi\">Fratello d'Armi</a>, <a class=\"xl\" href=\"#legame-confidente\" data-id=\"legame-confidente\">Confidente</a>, <a class=\"xl\" href=\"#legame-istigatore\" data-id=\"legame-istigatore\">Complice</a>, <a class=\"xl\" href=\"#legame-amante\" data-id=\"legame-amante\">Amante</a>, <a class=\"xl\" href=\"#legame-protetto\" data-id=\"legame-protetto\">Protetto</a>, <a class=\"xl\" href=\"#legame-rivale\" data-id=\"legame-rivale\">Rivale</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#legame-ex-galeotto\" data-id=\"legame-ex-galeotto\">Ex Galeotto</a>, <a class=\"xl\" href=\"#legame-lealista\" data-id=\"legame-lealista\">Lealista</a>, <a class=\"xl\" href=\"#legame-profugo\" data-id=\"legame-profugo\">Profugo</a>, <a class=\"xl\" href=\"#legame-veterano\" data-id=\"legame-veterano\">Veterano</a>.</p>","text":"Regole: Legami. Manuale base: Protettore, Compagno, Sentinella, Amico, Professionista, Familiare. Viandanti e Forestieri: Fratello d'Armi, Confidente, Complice, Amante, Protetto, Rivale. Rovine e Spedizioni: Ex Galeotto, Lealista, Profugo, Veterano.","back":["legame"]},{"id":"legame-protettore","title":"Legame: Protettore","cat":"legami","group":"","src":"B p.51","aliases":["Protettore"],"html":"<p>Quando è nel tuo raggio d'azione, segna fatica per <strong>subire un colpo indirizzato a lui</strong>. Se lo fai, hai <strong>+1 continuo alle mosse con le armi</strong> per il resto della scena.</p>","text":"Quando è nel tuo raggio d'azione, segna fatica per subire un colpo indirizzato a lui. Se lo fai, hai +1 continuo alle mosse con le armi per il resto della scena.","back":["legami-indice"]},{"id":"legame-compagno","title":"Legame: Compagno","cat":"legami","group":"","src":"B p.51","aliases":["Compagno"],"html":"<p>Quando compili il legame, segnate <strong>entrambi 2-prestigio</strong> con la fazione che avete aiutato e <strong>2-nomea</strong> con quella danneggiata. Se in gioco venite visti insieme, prestigio e nomea con quelle fazioni sono <strong>raddoppiati</strong> per entrambi.</p>","text":"Quando compili il legame, segnate entrambi 2-prestigio con la fazione che avete aiutato e 2-nomea con quella danneggiata. Se in gioco venite visti insieme, prestigio e nomea con quelle fazioni sono raddoppiati per entrambi.","back":["legami-indice"]},{"id":"legame-sentinella","title":"Legame: Sentinella","cat":"legami","group":"","src":"B p.51","aliases":["Sentinella"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le sue intenzioni</a> ottieni almeno 1 presa, anche con un fallimento. Quando lo <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">supplichi</a>, può svuotare 2-fatica invece di 1.</p>","text":"Quando capisci le sue intenzioni ottieni almeno 1 presa, anche con un fallimento. Quando lo supplichi, può svuotare 2-fatica invece di 1.","back":["supplicare","legami-indice"]},{"id":"legame-amico","title":"Legame: Amico","cat":"legami","group":"","src":"B p.51","aliases":["Amico"],"html":"<p>Quando lo <a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">aiuti</a>, puoi segnare 2-fatica per dare <strong>+2</strong> invece di 1-fatica per +1.</p>","text":"Quando lo aiuti, puoi segnare 2-fatica per dare +2 invece di 1-fatica per +1.","back":["aiutare","legami-indice"]},{"id":"legame-professionista","title":"Legame: Professionista","cat":"legami","group":"","src":"B p.51","aliases":["Professionista"],"html":"<p>Se dopo aver <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valutato una situazione tesa</a> condividi con lui le informazioni, entrambi avete +1 agendo sulle risposte. Quando lo aiuti in un'impresa da furfante, ottieni le opzioni come se avessi segnato 2-fatica, ma ne segni 1.</p>","text":"Se dopo aver valutato una situazione tesa condividi con lui le informazioni, entrambi avete +1 agendo sulle risposte. Quando lo aiuti in un'impresa da furfante, ottieni le opzioni come se avessi segnato 2-fatica, ma ne segni 1.","back":["valutare","aiutare","legami-indice"]},{"id":"legame-familiare","title":"Legame: Familiare","cat":"legami","group":"","src":"B p.51","aliases":["Familiare"],"html":"<p>Quando lo aiuti a soddisfare la sua <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a>, <strong>svuotate entrambi</strong> il tracciato della fatica.</p>","text":"Quando lo aiuti a soddisfare la sua Natura, svuotate entrambi il tracciato della fatica.","back":["legami-indice"]},{"id":"legame-fratello-armi","title":"Legame: Fratello d'Armi (Battle-Sibling)","cat":"legami","group":"","src":"VF p.54","aliases":["Fratello d'Armi","Battle-Sibling"],"html":"<p>Quando combattete fianco a fianco o schiena contro schiena, +1 continuo alle mosse con le armi finché restate a contatto. <em>(trad. non ufficiale)</em></p>","text":"Quando combattete fianco a fianco o schiena contro schiena, +1 continuo alle mosse con le armi finché restate a contatto. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-confidente","title":"Legame: Confidente","cat":"legami","group":"","src":"VF p.54","aliases":["Confidente"],"html":"<p>Quando viene da te in confidenza con un problema, segna fatica per suggerire una soluzione: se la segue al meglio, svuota tutta la fatica. <em>(trad. non ufficiale)</em></p>","text":"Quando viene da te in confidenza con un problema, segna fatica per suggerire una soluzione: se la segue al meglio, svuota tutta la fatica. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-istigatore","title":"Legame: Complice (Enabler)","cat":"legami","group":"","src":"VF p.55","aliases":["Complice","Enabler"],"html":"<p>Quando lo <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">supplichi</a> di unirsi a un'azione avventata e accetta, oltre a svuotare fatica ha +1 continuo a seguire il piano. <em>(trad. non ufficiale)</em></p>","text":"Quando lo supplichi di unirsi a un'azione avventata e accetta, oltre a svuotare fatica ha +1 continuo a seguire il piano. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-amante","title":"Legame: Amante (Lover)","cat":"legami","group":"","src":"VF p.55","aliases":["Amante","Lover"],"html":"<p>Una volta per sessione, in un momento di intimità tranquillo tra voi due, scegli: offrigli affetto (se lo accetta svuota 3-fatica); oppure fagli una promessa concreta (+1 continuo a mantenerla). <em>(trad. non ufficiale)</em></p>","text":"Una volta per sessione, in un momento di intimità tranquillo tra voi due, scegli: offrigli affetto (se lo accetta svuota 3-fatica); oppure fagli una promessa concreta (+1 continuo a mantenerla). (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-protetto","title":"Legame: Protetto (Protégé)","cat":"legami","group":"","src":"VF p.55-56","aliases":["Protetto","Protégé"],"html":"<p>Una volta per sessione, quando vi allenate insieme, scegli e tieni 1: impara un'impresa da furfante (spendila per tentarla come se l'avessi); un'abilità con le armi (idem); chiedigli come vede il mondo (spendila per +1 al prossimo tiro per dargli ragione o torto). <em>(trad. non ufficiale)</em></p>","text":"Una volta per sessione, quando vi allenate insieme, scegli e tieni 1: impara un'impresa da furfante (spendila per tentarla come se l'avessi); un'abilità con le armi (idem); chiedigli come vede il mondo (spendila per +1 al prossimo tiro per dargli ragione o torto). (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-rivale","title":"Legame: Rivale","cat":"legami","group":"","src":"VF p.56","aliases":["Rivale"],"html":"<p>Quando lo sfidi a correre un rischio del tutto inutile ed eccessivo per dimostrare il suo valore, ha +1 al prossimo tiro se accetta; se rifiuta, segna fatica. <em>(trad. non ufficiale)</em></p>","text":"Quando lo sfidi a correre un rischio del tutto inutile ed eccessivo per dimostrare il suo valore, ha +1 al prossimo tiro se accetta; se rifiuta, segna fatica. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-ex-galeotto","title":"Legame: Ex Galeotto (Ex-Convict)","cat":"legami","group":"","src":"RS p.42","aliases":["Ex Galeotto","Ex-Convict"],"html":"<p>Compilandolo segnate entrambi 2-nomea con una fazione. Quando valuti una situazione tesa puoi sempre chiedere gratis \"Cos'è più prezioso qui?\", anche con un fallimento; entrambi avete +1 agendo sulle risposte. <em>(trad. non ufficiale)</em></p>","text":"Compilandolo segnate entrambi 2-nomea con una fazione. Quando valuti una situazione tesa puoi sempre chiedere gratis \"Cos'è più prezioso qui?\", anche con un fallimento; entrambi avete +1 agendo sulle risposte. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-lealista","title":"Legame: Lealista (Loyalist)","cat":"legami","group":"","src":"RS p.42","aliases":["Lealista","Loyalist"],"html":"<p>Compilandolo segnate entrambi 2-prestigio con la fazione che avete servito. Quando le chiedi un favore, puoi segnare 2-fatica per prendere <span class=\"res\">10+</span>. <em>(trad. non ufficiale)</em></p>","text":"Compilandolo segnate entrambi 2-prestigio con la fazione che avete servito. Quando le chiedi un favore, puoi segnare 2-fatica per prendere 10+. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-profugo","title":"Legame: Profugo (Refugee)","cat":"legami","group":"","src":"RS p.43","aliases":["Profugo","Refugee"],"html":"<p>Venite da una radura che non esiste più e condividete una pratica culturale: quando segni consumo per praticarla in pubblico, un abitante (un sopravvissuto o un simpatizzante) si fa avanti offrendo conforto e aiuto. <em>(trad. non ufficiale)</em></p>","text":"Venite da una radura che non esiste più e condividete una pratica culturale: quando segni consumo per praticarla in pubblico, un abitante (un sopravvissuto o un simpatizzante) si fa avanti offrendo conforto e aiuto. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-veterano","title":"Legame: Veterano","cat":"legami","group":"","src":"RS p.43","aliases":["Veterano"],"html":"<p>Quando combattete fianco a fianco, entrambi potete usare <a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a> con qualsiasi arma finché restate a contatto; se scegli di infliggere morale o fatica parando, ne infliggi uno in più. <em>(trad. non ufficiale)</em></p>","text":"Quando combattete fianco a fianco, entrambi potete usare Parare con qualsiasi arma finché restate a contatto; se scegli di infliggere morale o fatica parando, ne infliggi uno in più. (trad. non ufficiale)","back":["legami-indice"]},{"id":"rovine-indice","title":"Esplorazione delle Rovine","cat":"indici","group":"","src":"RS p.97-120","aliases":["esplorazione","rovine","rovina","spedizione"],"html":"<p>Sistema di <em>Rovine e Spedizioni</em> per esplorare le rovine degli <strong>Antichi</strong> (vedi <a class=\"xl\" href=\"#antichi\" data-id=\"antichi\">Gli Antichi</a>).</p><p><strong>Trovare e lasciare una rovina</strong>: <a class=\"xl\" href=\"#rovine-mappa\" data-id=\"rovine-mappa\">Aggiungere Rovine alla Mappa</a>, <a class=\"xl\" href=\"#cercare-rovine\" data-id=\"cercare-rovine\">Cercare Rovine</a>, <a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a>.</p><p><strong>Nelle profondità</strong> (ogni \"livello\" è un grande spazio alla stessa profondità; ogni \"area\" una sezione del livello):</p><ul><li><a class=\"xl\" href=\"#avanzare-rovine\" data-id=\"avanzare-rovine\">Avanzare nelle Rovine</a> — passare a una nuova area dello stesso livello (costa consumo)</li><li><a class=\"xl\" href=\"#scendere-rovine\" data-id=\"scendere-rovine\">Scendere più in Profondità</a> — scendere al livello successivo</li><li><a class=\"xl\" href=\"#cercare-risorse\" data-id=\"cercare-risorse\">Cercare Risorse</a> — una volta per livello</li><li><a class=\"xl\" href=\"#accamparsi-rovine\" data-id=\"accamparsi-rovine\">Accamparsi nelle Rovine</a> — riposare</li><li><a class=\"xl\" href=\"#ritirata\" data-id=\"ritirata\">Ritirarsi in Superficie</a> — risalire in superficie</li></ul><p><strong>Per il GM</strong>: <a class=\"xl\" href=\"#creare-rovine\" data-id=\"creare-rovine\">Creare le Rovine</a>, <a class=\"xl\" href=\"#generare-rovine\" data-id=\"generare-rovine\">Generatore Casuale di Rovine</a>, <a class=\"xl\" href=\"#minacce-rovine\" data-id=\"minacce-rovine\">Minacce delle Rovine</a>, <a class=\"xl\" href=\"#reliquie\" data-id=\"reliquie\">Reliquie degli Antichi</a>, <a class=\"xl\" href=\"#mostri-indice\" data-id=\"mostri-indice\">Mostri dei Boschi</a>.</p><p>Imprese e mosse utili: <a class=\"xl\" href=\"#usare-congegno\" data-id=\"usare-congegno\">Usare un Congegno (Use Device)</a>, <a class=\"xl\" href=\"#disattivare\" data-id=\"disattivare\">Disattivare un Congegno</a>, <a class=\"xl\" href=\"#pb-cercatore-segni\" data-id=\"pb-cercatore-segni\">Leggere i Segni</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>.</p>","text":"Sistema di Rovine e Spedizioni per esplorare le rovine degli Antichi (vedi Gli Antichi). Trovare e lasciare una rovina: Aggiungere Rovine alla Mappa, Cercare Rovine, Tornare da una Rovina nella Foresta. Nelle profondità (ogni \"livello\" è un grande spazio alla stessa profondità; ogni \"area\" una sezione del livello): - Avanzare nelle Rovine — passare a una nuova area dello stesso livello (costa consumo) - Scendere più in Profondità — scendere al livello successivo - Cercare Risorse — una volta per livello - Accamparsi nelle Rovine — riposare - Ritirarsi in Superficie — risalire in superficie Per il GM: Creare le Rovine, Generatore Casuale di Rovine, Minacce delle Rovine, Reliquie degli Antichi, Mostri dei Boschi. Imprese e mosse utili: Usare un Congegno (Use Device), Disattivare un Congegno, Leggere i Segni, Scoperta.","back":[]},{"id":"antichi","title":"Gli Antichi","cat":"esplorazione","group":"","src":"RS p.98-100","aliases":["Antichi"],"html":"<p>Il popolo scomparso che un tempo dominava i Boschi e costruì un regno sotterraneo; le rovine sono le sue propaggini superiori. Avevano un tabù sull'autorappresentazione (niente ritratti, solo arte astratta e istruzioni scientifiche) e sparirono di fronte a una misteriosa \"oscurità\". Molte rovine sono stratificate: templi delle Lucertole, sale delle Aquile o rifugi di pipistrelli costruiti sopra strutture più antiche; più si scende, più tutto è opera degli Antichi. Alcune Aquile rivendicano di discendere da loro.</p>","text":"Il popolo scomparso che un tempo dominava i Boschi e costruì un regno sotterraneo; le rovine sono le sue propaggini superiori. Avevano un tabù sull'autorappresentazione (niente ritratti, solo arte astratta e istruzioni scientifiche) e sparirono di fronte a una misteriosa \"oscurità\". Molte rovine sono stratificate: templi delle Lucertole, sale delle Aquile o rifugi di pipistrelli costruiti sopra strutture più antiche; più si scende, più tutto è opera degli Antichi. Alcune Aquile rivendicano di discendere da loro.","back":["rovine-indice","reliquie"]},{"id":"rovine-mappa","title":"Aggiungere Rovine alla Mappa","cat":"esplorazione","group":"","src":"RS p.101","aliases":["rovine sulla mappa"],"html":"<p>Ogni Boschi ha almeno <strong>2 rovine note</strong>, più 1d6÷2 (arrotondato per eccesso) rovine aggiuntive, da posizionare dopo le radure e prima del controllo delle fazioni. Per ognuna scegli la radura con la tabella delle radure casuali e tira 1d6:</p><ol><li>Sotto (o sopra) la radura stessa</li><li>Nella foresta più vicina a nord (ovest)</li><li>Nella foresta più vicina a sud (est)</li><li>Nella foresta più vicina a ovest (sud)</li><li>Nella foresta più vicina a est (nord)</li><li>Lungo il sentiero che parte dalla radura verso il centro dei Boschi</li></ol>","text":"Ogni Boschi ha almeno 2 rovine note, più 1d6÷2 (arrotondato per eccesso) rovine aggiuntive, da posizionare dopo le radure e prima del controllo delle fazioni. Per ognuna scegli la radura con la tabella delle radure casuali e tira 1d6: 1. Sotto (o sopra) la radura stessa 2. Nella foresta più vicina a nord (ovest) 3. Nella foresta più vicina a sud (est) 4. Nella foresta più vicina a ovest (sud) 5. Nella foresta più vicina a est (nord) 6. Lungo il sentiero che parte dalla radura verso il centro dei Boschi","back":["rovine-indice","creare-boschi"]},{"id":"cercare-rovine","title":"Cercare Rovine","cat":"esplorazione","group":"","src":"RS p.102","aliases":["cercare rovine"],"html":"<div class=\"move\"><p><strong>Quando vi addentrate nella foresta per cercare rovine, uno tira per la banda:</strong></p><ul><li>+1 se avete una mappa dettagliata della zona</li><li>+1 se un vagabondo ha Fortuna +2 o più</li><li>-1 se un vagabondo ha più di 1-ferita segnata</li><li>-1 se non avete una guida locale</li></ul></div><p>Con un successo trovate il sito e arrivate sani e salvi all'ingresso. Con <span class=\"res\">10+</span> trovate anche un'area sicura vicina: accampandovi prima di entrare ognuno svuota 1-fatica. Con <span class=\"res\">7-9</span> una <a class=\"xl\" href=\"#minacce-rovine\" data-id=\"minacce-rovine\">minaccia della rovina</a> blocca il passaggio: dovete superarla per entrare. Con un fallimento è la rovina a trovare voi: una minaccia vi trascina dentro prima che siate pronti. <em>(trad. non ufficiale)</em></p>","text":"Quando vi addentrate nella foresta per cercare rovine, uno tira per la banda: - +1 se avete una mappa dettagliata della zona - +1 se un vagabondo ha Fortuna +2 o più - -1 se un vagabondo ha più di 1-ferita segnata - -1 se non avete una guida locale Con un successo trovate il sito e arrivate sani e salvi all'ingresso. Con 10+ trovate anche un'area sicura vicina: accampandovi prima di entrare ognuno svuota 1-fatica. Con 7-9 una minaccia della rovina blocca il passaggio: dovete superarla per entrare. Con un fallimento è la rovina a trovare voi: una minaccia vi trascina dentro prima che siate pronti. (trad. non ufficiale)","back":["viaggio-indice","rovine-indice"]},{"id":"tornare-rovina","title":"Tornare da una Rovina nella Foresta","cat":"esplorazione","group":"","src":"RS p.103","aliases":["tornare da una rovina"],"html":"<div class=\"move\"><p><strong>Quando tornate da una rovina nella foresta, la banda sceglie come procedere e uno tira:</strong></p><ul><li><strong>Con calma e in silenzio</strong>, ripercorrendo i passi: la banda segna 1-consumo per membro; +0.</li><li><strong>Rapidi ed efficienti</strong>: tutti segnano 1-fatica; +1.</li><li><strong>Fuggendo verso la salvezza</strong>: tutti segnano 2-fatica o 2-ferite (a scelta) e 2-usura; +2.</li></ul></div><p>Con un successo raggiungete una radura vicina con il bottino, evitando i pericoli. Con <span class=\"res\">7-9</span> il ritorno è segnato da un promemoria della Guerra (soldati, resti di una battaglia). Con un fallimento qualcosa vi raggiunge, o scoprite troppo tardi che qualcuno di cui non vi fidate vi aspetta. <em>(trad. non ufficiale)</em></p>","text":"Quando tornate da una rovina nella foresta, la banda sceglie come procedere e uno tira: - Con calma e in silenzio, ripercorrendo i passi: la banda segna 1-consumo per membro; +0. - Rapidi ed efficienti: tutti segnano 1-fatica; +1. - Fuggendo verso la salvezza: tutti segnano 2-fatica o 2-ferite (a scelta) e 2-usura; +2. Con un successo raggiungete una radura vicina con il bottino, evitando i pericoli. Con 7-9 il ritorno è segnato da un promemoria della Guerra (soldati, resti di una battaglia). Con un fallimento qualcosa vi raggiunge, o scoprite troppo tardi che qualcuno di cui non vi fidate vi aspetta. (trad. non ufficiale)","back":["viaggio-indice","rovine-indice","ritirata"]},{"id":"avanzare-rovine","title":"Avanzare nelle Rovine","cat":"esplorazione","group":"","src":"RS p.104","aliases":["avanzare nelle rovine","press forward"],"html":"<div class=\"move\"><p><strong>Quando avanzate in una nuova area delle rovine profonde, un membro della banda deve segnare 1-consumo;</strong> se non potete o non volete, una <a class=\"xl\" href=\"#minacce-rovine\" data-id=\"minacce-rovine\">minaccia della rovina</a> si abbatte su di voi.</p></div><p>Rappresenta cibo, acqua e torce consumati. Il GM decide cosa conta come nuova area (di solito una stanza o un gruppo di stanze vicine). Scendere di livello è <a class=\"xl\" href=\"#scendere-rovine\" data-id=\"scendere-rovine\">Scendere più in Profondità</a>. <em>(trad. non ufficiale)</em></p>","text":"Quando avanzate in una nuova area delle rovine profonde, un membro della banda deve segnare 1-consumo; se non potete o non volete, una minaccia della rovina si abbatte su di voi. Rappresenta cibo, acqua e torce consumati. Il GM decide cosa conta come nuova area (di solito una stanza o un gruppo di stanze vicine). Scendere di livello è Scendere più in Profondità. (trad. non ufficiale)","back":["rovine-indice"]},{"id":"scendere-rovine","title":"Scendere più in Profondità","cat":"esplorazione","group":"","src":"RS p.105","aliases":["scendere in profondità","delve deeper"],"html":"<div class=\"move\"><p><strong>Quando scendete verso un nuovo livello di una rovina attraverso un passaggio aperto, uno tira per la banda:</strong></p><ul><li>+1 se nessun membro ha ferite segnate</li><li>+1 se la banda segna in totale 2-consumo e 2-usura</li><li>-2 se state affrontando una minaccia o crisi attiva</li></ul></div><p>Con un successo raggiungete il livello successivo. Con <span class=\"res\">10+</span> la discesa è propizia: trovate risorse naturali o un posto sicuro per accamparvi (a scelta). Con un fallimento scendete, ma una seria minaccia vi intrappola sul nuovo livello finché non la affrontate o trovate un'altra via. Più si scende, più minacce e ricompense crescono. <em>(trad. non ufficiale)</em></p>","text":"Quando scendete verso un nuovo livello di una rovina attraverso un passaggio aperto, uno tira per la banda: - +1 se nessun membro ha ferite segnate - +1 se la banda segna in totale 2-consumo e 2-usura - -2 se state affrontando una minaccia o crisi attiva Con un successo raggiungete il livello successivo. Con 10+ la discesa è propizia: trovate risorse naturali o un posto sicuro per accamparvi (a scelta). Con un fallimento scendete, ma una seria minaccia vi intrappola sul nuovo livello finché non la affrontate o trovate un'altra via. Più si scende, più minacce e ricompense crescono. (trad. non ufficiale)","back":["rovine-indice","avanzare-rovine"]},{"id":"cercare-risorse","title":"Cercare Risorse","cat":"esplorazione","group":"","src":"RS p.106","aliases":["cercare risorse","scavenge"],"html":"<div class=\"move\"><p><strong>Quando la banda fruga in cerca di risorse nelle rovine profonde, uno tira tanti d6 quanto il livello attuale più le stanze sicure adiacenti.</strong> I singoli vagabondi spendono i dadi in base al valore:</p><ul><li><strong>1-2</strong>: recupera 1-consumo</li><li><strong>3-4</strong>: recupera 1-consumo e 1-usura</li><li><strong>5-6</strong>: svuota 2-consumo oppure trovi un oggetto da 3-Valore</li></ul></div><p>Una sola volta per livello: per frugare ancora dovete scendere. Conviene esplorare e <a class=\"xl\" href=\"#accamparsi-rovine\" data-id=\"accamparsi-rovine\">accamparsi</a> prima. <em>(trad. non ufficiale)</em></p>","text":"Quando la banda fruga in cerca di risorse nelle rovine profonde, uno tira tanti d6 quanto il livello attuale più le stanze sicure adiacenti. I singoli vagabondi spendono i dadi in base al valore: - 1-2: recupera 1-consumo - 3-4: recupera 1-consumo e 1-usura - 5-6: svuota 2-consumo oppure trovi un oggetto da 3-Valore Una sola volta per livello: per frugare ancora dovete scendere. Conviene esplorare e accamparsi prima. (trad. non ufficiale)","back":["rovine-indice","accamparsi-rovine"]},{"id":"accamparsi-rovine","title":"Accamparsi nelle Rovine","cat":"esplorazione","group":"","src":"RS p.107","aliases":["accamparsi nelle rovine","make camp"],"html":"<div class=\"move\"><p><strong>Quando la banda si accampa nelle rovine profonde, ognuno segna quanto consumo vuole e uno tira con +1 per ogni consumo segnato (max +4 con i bonus):</strong></p><ul><li>+1 se c'è una risorsa utile vicina (acqua, cibo) per tutti</li><li>+1 se c'è riparo o sicurezza (grotte, porte di pietra)</li><li>+1 se qualcuno rinuncia ai benefici per fare la guardia</li></ul></div><p>Con un successo riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica. Con <span class=\"res\">7-9</span> ognuno sceglie anche 1, con <span class=\"res\">10+</span> due: dormi davvero (1-fatica in più); riparazioni di fortuna (1-usura); mappi la zona (un dado in più a <a class=\"xl\" href=\"#cercare-risorse\" data-id=\"cercare-risorse\">Cercare Risorse</a> su questo livello). Con un fallimento le provviste vanno sprecate e una minaccia irrompe: dite i turni di guardia e il GM dice chi la nota per primo. <em>(trad. non ufficiale)</em></p>","text":"Quando la banda si accampa nelle rovine profonde, ognuno segna quanto consumo vuole e uno tira con +1 per ogni consumo segnato (max +4 con i bonus): - +1 se c'è una risorsa utile vicina (acqua, cibo) per tutti - +1 se c'è riparo o sicurezza (grotte, porte di pietra) - +1 se qualcuno rinuncia ai benefici per fare la guardia Con un successo riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica. Con 7-9 ognuno sceglie anche 1, con 10+ due: dormi davvero (1-fatica in più); riparazioni di fortuna (1-usura); mappi la zona (un dado in più a Cercare Risorse su questo livello). Con un fallimento le provviste vanno sprecate e una minaccia irrompe: dite i turni di guardia e il GM dice chi la nota per primo. (trad. non ufficiale)","back":["rovine-indice","cercare-risorse"]},{"id":"ritirata","title":"Ritirarsi in Superficie","cat":"esplorazione","group":"","src":"RS p.108","aliases":["ritirarsi in superficie","ritirata","risalire"],"html":"<div class=\"move\"><p><strong>Quando vi ritirate dalle rovine verso la superficie, uno tira per la banda:</strong></p><ul><li>+1 se potete tracciare un percorso attraverso stanze sicure</li><li>+1 se ognuno segna 1-fatica</li><li>-1 se vi ritirate davanti a una minaccia attiva</li><li>-2 se un membro è appesantito (oltre il proprio <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>)</li></ul></div><p>Con <span class=\"res\">10+</span> risalite e uscite dove siete entrati. Con <span class=\"res\">7-9</span> una minaccia blocca la via: affrontatela prima. Con un fallimento siete intrappolati tra un ostacolo davanti e una minaccia che avanza alle spalle. Poi potrebbe servire <a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a>. <em>(trad. non ufficiale)</em></p>","text":"Quando vi ritirate dalle rovine verso la superficie, uno tira per la banda: - +1 se potete tracciare un percorso attraverso stanze sicure - +1 se ognuno segna 1-fatica - -1 se vi ritirate davanti a una minaccia attiva - -2 se un membro è appesantito (oltre il proprio Ingombro) Con 10+ risalite e uscite dove siete entrati. Con 7-9 una minaccia blocca la via: affrontatela prima. Con un fallimento siete intrappolati tra un ostacolo davanti e una minaccia che avanza alle spalle. Poi potrebbe servire Tornare da una Rovina nella Foresta. (trad. non ufficiale)","back":["ingombro","rovine-indice"]},{"id":"creare-rovine","title":"Creare le Rovine","cat":"gm","group":"","src":"RS p.109-110","aliases":["creare le rovine"],"html":"<p>Prima che i vagabondi entrino, rispondi a:</p><ul><li><strong>Chi ha lasciato il suo segno qui e perché?</strong> (Antichi, altre civiltà; scopo originario: luogo sacro, trono, laboratorio...)</li><li><strong>Perché è una rovina?</strong> (terremoto, alluvione, vegetazione): mostralo nelle descrizioni.</li><li><strong>Chi ci vive ora?</strong> (mostri, abitanti, banditi).</li><li><strong>Cosa potrebbe succedere?</strong> Annota qualche escalation da tenere pronta.</li></ul><p>Durante l'esplorazione, chiediti: ci sono altre stanze su questo livello? altri livelli (di rado oltre 5-6)? cosa si può trovare? <strong>Disegna la mappa man mano</strong>. Puoi convertire dungeon di altri giochi sostituendo gli antagonisti con mostri o nemici dei Boschi. Vedi <a class=\"xl\" href=\"#generare-rovine\" data-id=\"generare-rovine\">Generatore Casuale di Rovine</a>.</p>","text":"Prima che i vagabondi entrino, rispondi a: - Chi ha lasciato il suo segno qui e perché? (Antichi, altre civiltà; scopo originario: luogo sacro, trono, laboratorio...) - Perché è una rovina? (terremoto, alluvione, vegetazione): mostralo nelle descrizioni. - Chi ci vive ora? (mostri, abitanti, banditi). - Cosa potrebbe succedere? Annota qualche escalation da tenere pronta. Durante l'esplorazione, chiediti: ci sono altre stanze su questo livello? altri livelli (di rado oltre 5-6)? cosa si può trovare? Disegna la mappa man mano. Puoi convertire dungeon di altri giochi sostituendo gli antagonisti con mostri o nemici dei Boschi. Vedi Generatore Casuale di Rovine.","back":["rovine-indice"]},{"id":"generare-rovine","title":"Generatore Casuale di Rovine","cat":"gm","group":"","src":"RS p.111-112","aliases":["generatore di rovine","tabelle rovine"],"html":"<p><strong>Rimodellata da altre fazioni?</strong> (2d6) 2-7 no; 8-9 una fazione; <span class=\"res\">10+</span> più fazioni.</p><p><strong>Scopo originario</strong> (d6/d6): luogo sacro, centro manifatturiero, avamposto militare / palazzo reale, mausoleo, monastero / centro commerciale, laboratorio, insediamento.</p><p><strong>Perché è in rovina</strong>: terremoto o vulcano, gas velenoso o infiammabile, vegetazione / alluvione, crollo strutturale, trappole distruttive / incendio, invasione di mostri, voragini.</p><p><strong>Chi ci vive ora</strong>: banditi e ladri, storici o scienziati, colonia di mostri / mercenari o cacciatori di tesori, ecosistema di 3+ specie di mostri, specie bizzarra / fuggitivi o profughi, un singolo mostro terrificante, una banda di vagabondi.</p><p><strong>Altre stanze?</strong> (2d6 + stanze esplorate sul livello) 3-4: tre uscite; 5-6: due; <span class=\"res\">7-9</span>: una; 10-12: una verso un vicolo cieco; 13+: vicolo cieco.</p><p><strong>Altri livelli?</strong> (1d6 + nuovo livello) 7 o meno: sì; 8+: è l'ultimo.</p><p><strong>Cosa c'è sul livello?</strong> (1d6 + nuovo livello) 3-6: 5-Valore in 1-2 oggetti; <span class=\"res\">7-9</span>: 10-Valore in 2-3 oggetti; 10-13: 10-Valore e una <a class=\"xl\" href=\"#reliquie\" data-id=\"reliquie\">reliquia</a>; 14: 15-Valore e due reliquie.</p>","text":"Rimodellata da altre fazioni? (2d6) 2-7 no; 8-9 una fazione; 10+ più fazioni. Scopo originario (d6/d6): luogo sacro, centro manifatturiero, avamposto militare / palazzo reale, mausoleo, monastero / centro commerciale, laboratorio, insediamento. Perché è in rovina: terremoto o vulcano, gas velenoso o infiammabile, vegetazione / alluvione, crollo strutturale, trappole distruttive / incendio, invasione di mostri, voragini. Chi ci vive ora: banditi e ladri, storici o scienziati, colonia di mostri / mercenari o cacciatori di tesori, ecosistema di 3+ specie di mostri, specie bizzarra / fuggitivi o profughi, un singolo mostro terrificante, una banda di vagabondi. Altre stanze? (2d6 + stanze esplorate sul livello) 3-4: tre uscite; 5-6: due; 7-9: una; 10-12: una verso un vicolo cieco; 13+: vicolo cieco. Altri livelli? (1d6 + nuovo livello) 7 o meno: sì; 8+: è l'ultimo. Cosa c'è sul livello? (1d6 + nuovo livello) 3-6: 5-Valore in 1-2 oggetti; 7-9: 10-Valore in 2-3 oggetti; 10-13: 10-Valore e una reliquia; 14: 15-Valore e due reliquie.","back":["rovine-indice","creare-rovine"]},{"id":"minacce-rovine","title":"Minacce delle Rovine","cat":"gm","group":"","src":"RS p.114","aliases":["minaccia della rovina","minacce delle rovine"],"html":"<p>Quando una mossa fa \"abbattere una minaccia della rovina\", usa la minaccia ovvia già preparata oppure:</p><p><strong>Livello 1</strong> (meno immediate): un mostro protettivo o docile nei paraggi; banditi o soldati avvistano la banda; un piccolo incendio o crollo mette in pericolo un vagabondo; un cambiamento della rovina taglia una via; segni di un mostro testardo o predatore ai livelli inferiori.</p><p><strong>Livelli 2-3</strong>: un mostro testardo o predatore vicino; un altro vagabondo attacca o deruba la banda; un'alluvione o un grande crollo minaccia più vagabondi; una reliquia rotta mette in pericolo qualcuno; una trappola o un enigma senza via d'aggiramento.</p><p><strong>Livello 4+</strong>: un predatore attacca senza preavviso; un mostro testardo o protettivo attacca gli intrusi; un crollo o un'alluvione catastrofici minacciano tutta la banda; una reliquia funzionante mette in pericolo più vagabondi; la rovina si trasforma e divide la banda.</p><p>Vedi <a class=\"xl\" href=\"#mostri-istinti\" data-id=\"mostri-istinti\">Istinti dei Mostri</a> per testardo, docile, predatore, protettivo.</p>","text":"Quando una mossa fa \"abbattere una minaccia della rovina\", usa la minaccia ovvia già preparata oppure: Livello 1 (meno immediate): un mostro protettivo o docile nei paraggi; banditi o soldati avvistano la banda; un piccolo incendio o crollo mette in pericolo un vagabondo; un cambiamento della rovina taglia una via; segni di un mostro testardo o predatore ai livelli inferiori. Livelli 2-3: un mostro testardo o predatore vicino; un altro vagabondo attacca o deruba la banda; un'alluvione o un grande crollo minaccia più vagabondi; una reliquia rotta mette in pericolo qualcuno; una trappola o un enigma senza via d'aggiramento. Livello 4+: un predatore attacca senza preavviso; un mostro testardo o protettivo attacca gli intrusi; un crollo o un'alluvione catastrofici minacciano tutta la banda; una reliquia funzionante mette in pericolo più vagabondi; la rovina si trasforma e divide la banda. Vedi Istinti dei Mostri per testardo, docile, predatore, protettivo.","back":["rovine-indice","cercare-rovine","avanzare-rovine"]},{"id":"reliquie","title":"Reliquie degli Antichi","cat":"esplorazione","group":"","src":"RS p.115-120","aliases":["reliquia","reliquie"],"html":"<p>Manufatti unici degli <a class=\"xl\" href=\"#antichi\" data-id=\"antichi\">Gli Antichi</a>, con 2-3 abilità straordinarie (a volte da attivare o caricare); hanno comunque usura e Ingombro. Sono ambitissime, soprattutto dai <a class=\"xl\" href=\"#fazione-custodi\" data-id=\"fazione-custodi\">Custodi di Ferro</a>. Esempi:</p><ul><li><strong>Il Carillon di Risonanza</strong> (usura 5, Ingombro 0): tubo di metallo bluastro. <em>Ascoltare</em> suoni tra circa 3 e 30 metri; <em>Parlare</em> amplificando la voce fino a 30 metri (+1 continuo per influenzare una folla); <em>Boato</em>: tappando un'estremità accumula cariche di suono che possono farlo esplodere o essere scaricate, infliggendo fatica pari alle cariche (l'eccesso in ferite).</li><li><strong>Il Prisma di Linfa Solare</strong> (usura 4, Ingombro 0): esposto al sole per un giorno si carica; scosso emette luce e calore come il sole, finché non si spegne con la giusta sequenza di tocchi. Se si frantuma (4-usura in un colpo), ogni carica infligge 2-ferite a chi è vicino e acceca chi guarda.</li><li><strong>La Lancia Richiamante</strong> (usura 6, Ingombro 1): con il suo guanto. <em>Lancio</em> a distanza lunga per 2-ferite (con <span class=\"res\">10+</span> può infliggere +2 invece del secondo colpo); <em>Richiamo</em> magnetico al guanto; in mischia 2-ferite a distanza ravvicinata.</li><li><strong>L'Armatura di Pietralegno</strong> (Ingombro 2): legno pietrificato vivo, indistruttibile da assemblata; si carica nutrendosi della vegetazione e la uccide.</li><li><strong>Il Calderone Cornucopia</strong>: lega indistruttibile (vedi RS p.119-120).</li></ul><p>Il GM può crearne di nuove liberamente.</p>","text":"Manufatti unici degli Gli Antichi, con 2-3 abilità straordinarie (a volte da attivare o caricare); hanno comunque usura e Ingombro. Sono ambitissime, soprattutto dai Custodi di Ferro. Esempi: - Il Carillon di Risonanza (usura 5, Ingombro 0): tubo di metallo bluastro. Ascoltare suoni tra circa 3 e 30 metri; Parlare amplificando la voce fino a 30 metri (+1 continuo per influenzare una folla); Boato: tappando un'estremità accumula cariche di suono che possono farlo esplodere o essere scaricate, infliggendo fatica pari alle cariche (l'eccesso in ferite). - Il Prisma di Linfa Solare (usura 4, Ingombro 0): esposto al sole per un giorno si carica; scosso emette luce e calore come il sole, finché non si spegne con la giusta sequenza di tocchi. Se si frantuma (
