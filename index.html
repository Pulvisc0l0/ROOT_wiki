lo o normale, dopo il tiro svuoti tutta la fatica.</p>","text":"Una casella extra di fatica. Quando viaggi sul sentiero a passo tranquillo o normale, dopo il tiro svuoti tutta la fatica.","back":["pb-nomade"]},{"id":"pb-nomade-visto","title":"Non è la Prima Volta","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Non è la Prima Volta"],"html":"<div class=\"move\"><p><strong>Quando offri conforto (una storia, un pasto, una canzone) a un PNG paralizzato dall'emozione, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: torna in sé e cerca subito di rimediare; ti è grato: segna anche 2-prestigio con la sua fazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: torna in sé e cerca subito di rimediare.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: ti accorgi tardi di aver frainteso: rivela una verità terribile.</li></ul></div>","text":"Quando offri conforto (una storia, un pasto, una canzone) a un PNG paralizzato dall'emozione, tira su Fortuna. - 10+ (successo pieno): torna in sé e cerca subito di rimediare; ti è grato: segna anche 2-prestigio con la sua fazione. - 7-9 (successo parziale): torna in sé e cerca subito di rimediare. - 6- (fallimento): ti accorgi tardi di aver frainteso: rivela una verità terribile.","back":["pb-nomade"]},{"id":"pb-nomade-prendo","title":"Questa la Prendo Io","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Questa la Prendo Io"],"html":"<p>Ottieni <a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando disarmi chi minaccia qualcuno più debole, tira su Vigore; se perde l'arma, segna un'altra fatica per prenderla tu.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il nemico deve segnare 3-fatica o perdere la presa sull'arma.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il nemico deve segnare 2-fatica o perdere la presa sull'arma.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Disarmare (fuori limite). Quando disarmi chi minaccia qualcuno più debole, tira su Vigore; se perde l'arma, segna un'altra fatica per prenderla tu. - 10+ (successo pieno): il nemico deve segnare 3-fatica o perdere la presa sull'arma. - 7-9 (successo parziale): il nemico deve segnare 2-fatica o perdere la presa sull'arma. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["pb-nomade"]},{"id":"pb-orfano","title":"L'Orfano","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.85-88","aliases":["Orfano","Orphan"],"html":"<p><em>Sei cresciuto da solo e impari le vie della foresta dai vagabondi che le conoscono meglio.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +2, Vigore 0</li><li><strong>Abilità iniziale</strong>: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Borseggiare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 8</li></ul><p><strong>Natura</strong></p><ul><li><em>Disobbediente</em>: svuota la fatica quando affronti da solo un problema serio senza consultare la banda.</li><li><em>Grintoso</em>: svuota la fatica quando abbatti un nemico pericoloso senza segnare consumo né usura.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>.</p><p><strong>Legami</strong>: Protettore (ti ricorda un familiare perduto), Familiare (ti tratta come famiglia).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-orfano-imparo\" data-id=\"pb-orfano-imparo\">Alle Prime Armi</a> + due tra <a class=\"xl\" href=\"#pb-orfano-trascurato\" data-id=\"pb-orfano-trascurato\">Facilmente Ignorato</a>, <a class=\"xl\" href=\"#pb-orfano-famiglia\" data-id=\"pb-orfano-famiglia\">Una Nuova Famiglia</a>, <a class=\"xl\" href=\"#pb-orfano-strada\" data-id=\"pb-orfano-strada\">Ragazzo di Strada</a>, <a class=\"xl\" href=\"#pb-orfano-sottovalutato\" data-id=\"pb-orfano-sottovalutato\">Sottovalutato</a>, <a class=\"xl\" href=\"#pb-orfano-parole\" data-id=\"pb-orfano-parole\">Parole Taglienti</a>.</p>","text":"Sei cresciuto da solo e impari le vie della foresta dai vagabondi che le conoscono meglio. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +2, Vigore 0 - Abilità iniziale: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro - Imprese: Acrobazie, Borseggiare, Gioco di Prestigio - Valore iniziale: 8 Natura - Disobbediente: svuota la fatica quando affronti da solo un problema serio senza consultare la banda. - Grintoso: svuota la fatica quando abbatti un nemico pericoloso senza segnare consumo né usura. Motivazioni: Ambizione, Scoperta, Brivido, Caos. Legami: Protettore (ti ricorda un familiare perduto), Familiare (ti tratta come famiglia). Mosse: inizi con Alle Prime Armi + due tra Facilmente Ignorato, Una Nuova Famiglia, Ragazzo di Strada, Sottovalutato, Parole Taglienti.","back":["playbook-indice"]},{"id":"pb-orfano-imparo","title":"Alle Prime Armi","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Alle Prime Armi"],"html":"<p>Hai un tracciato di <strong>Fiducia</strong> (6 caselle). Scegli un altro vagabondo come tuo <strong>idolo</strong>: quando agisci come pensi agirebbe lui, segna Fiducia per prendere <span class=\"res\">10+</span> su qualsiasi mossa. Quando soddisfi la natura del tuo idolo, svuota il tracciato e barra una casella. Puoi cambiare idolo in ogni momento (tracciato di nuovo a 6), ma mai tornare allo stesso.</p>","text":"Hai un tracciato di Fiducia (6 caselle). Scegli un altro vagabondo come tuo idolo: quando agisci come pensi agirebbe lui, segna Fiducia per prendere 10+ su qualsiasi mossa. Quando soddisfi la natura del tuo idolo, svuota il tracciato e barra una casella. Puoi cambiare idolo in ogni momento (tracciato di nuovo a 6), ma mai tornare allo stesso.","back":["pb-orfano"]},{"id":"pb-orfano-trascurato","title":"Facilmente Ignorato","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Facilmente Ignorato"],"html":"<p>Ottieni <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a> e <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando li tenti mentre qualcosa o qualcuno fa da diversivo, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti mentre qualcosa o qualcuno fa da diversivo, tira su Fortuna. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-orfano"]},{"id":"pb-orfano-famiglia","title":"Una Nuova Famiglia","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Una Nuova Famiglia"],"html":"<p>Prendi due legami in più. Segna fatica per comparire all'improvviso in una scena con uno dei tuoi legami, se nulla te lo avrebbe impedito.</p>","text":"Prendi due legami in più. Segna fatica per comparire all'improvviso in una scena con uno dei tuoi legami, se nulla te lo avrebbe impedito.","back":["pb-orfano"]},{"id":"pb-orfano-strada","title":"Ragazzo di Strada","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Ragazzo di Strada"],"html":"<div class=\"move\"><p><strong>Quando parli con monelli ed emarginati di una radura, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 1 cosa e fai anche due domande.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 cosa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: qualcuno ti nota e ti dirà cosa vuole per lasciarti in pace.</li></ul><p>Cose:</p><ul><li>un posto dove la banda può nascondersi;</li><li>un bersaglio vulnerabile;</li><li>un ingresso segreto a un luogo importante.</li></ul></div>","text":"Quando parli con monelli ed emarginati di una radura, tira su Fortuna. - 10+ (successo pieno): scegli 1 cosa e fai anche due domande. - 7-9 (successo parziale): scegli 1 cosa. - 6- (fallimento): qualcuno ti nota e ti dirà cosa vuole per lasciarti in pace. Cose: - un posto dove la banda può nascondersi; - un bersaglio vulnerabile; - un ingresso segreto a un luogo importante.","back":["pb-orfano"]},{"id":"pb-orfano-sottovalutato","title":"Sottovalutato","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Sottovalutato"],"html":"<p>Finché non dimostri di essere una minaccia nessuno ti tratta come tale: la prima volta in sessione che segni nomea con una fazione, segnane una in meno. Quando la tua Reputazione con una fazione arriva a +2 o -2, perdi questa mossa e scegline un'altra.</p>","text":"Finché non dimostri di essere una minaccia nessuno ti tratta come tale: la prima volta in sessione che segni nomea con una fazione, segnane una in meno. Quando la tua Reputazione con una fazione arriva a +2 o -2, perdi questa mossa e scegline un'altra.","back":["pb-orfano"]},{"id":"pb-orfano-parole","title":"Parole Taglienti","cat":"mosse","group":"Orfano","src":"RS p.86","aliases":["Parole Taglienti"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni un PNG</a> provocandolo apertamente con insulti, tira su Fortuna invece di Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: abbocca e fa ciò che vuoi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: abbocca, oppure il GM sceglie 1 reazione:<ul><li>esita (spesso danno al morale);</li><li>commette un passo falso: ti si presenta un'opportunità;</li><li>reagisce in modo esagerato: +1 al prossimo tiro contro di lui.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci casca; il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>Quando provochi un altro vagabondo deridendolo, dì cosa vuoi che faccia e segna fino a 3-fatica: deve abboccare o segnare la stessa fatica (non si tira).</p>","text":"Quando inganni un PNG provocandolo apertamente con insulti, tira su Fortuna invece di Astuzia. - 10+ (successo pieno): abbocca e fa ciò che vuoi. - 7-9 (successo parziale): abbocca, oppure il GM sceglie 1 reazione: - esita (spesso danno al morale); - commette un passo falso: ti si presenta un'opportunità; - reagisce in modo esagerato: +1 al prossimo tiro contro di lui. - 6- (fallimento): non ci casca; il GM ti dice cosa succede e la situazione si complica. Quando provochi un altro vagabondo deridendolo, dì cosa vuoi che faccia e segna fino a 3-fatica: deve abboccare o segnare la stessa fatica (non si tira).","back":["pb-orfano"]},{"id":"pb-flagello","title":"Il Flagello","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.89-92","aliases":["Flagello","Scourge"],"html":"<p><em>Un potente ti ha tolto tutto e lasciato per morto: ora cerchi giustizia, a ogni costo.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza -1, Fortuna +1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie</li><li><strong>Valore iniziale</strong>: 11</li></ul><p><strong>Natura</strong></p><ul><li><em>Soccorritore</em>: svuota la fatica quando sacrifichi un vantaggio per salvare la vita dei vulnerabili.</li><li><em>Dissidente</em>: svuota la fatica quando ti schieri pubblicamente con chi ha subito torti dai potenti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>.</p><p><strong>Legami</strong>: Protettore (ti ricorda qualcuno che hai perso), Compagno (avete abbattuto un complice della tua nemesi).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-flagello-lista\" data-id=\"pb-flagello-lista\">La Lista</a> + due tra <a class=\"xl\" href=\"#pb-flagello-pagare\" data-id=\"pb-flagello-pagare\">Implacabile</a>, <a class=\"xl\" href=\"#pb-flagello-ragazzo\" data-id=\"pb-flagello-ragazzo\">Fidati di Me, Ragazzo</a>, <a class=\"xl\" href=\"#pb-flagello-notte\" data-id=\"pb-flagello-notte\">Io Sono la Notte</a>, <a class=\"xl\" href=\"#pb-flagello-pieta\" data-id=\"pb-flagello-pieta\">Alla Tua Mercé</a>, <a class=\"xl\" href=\"#pb-flagello-morire\" data-id=\"pb-flagello-morire\">Oggi è un Buon Giorno per Morire</a>.</p>","text":"Un potente ti ha tolto tutto e lasciato per morto: ora cerchi giustizia, a ogni costo. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza -1, Fortuna +1, Vigore +2 - Abilità iniziale: Fracassare, Tiro Rapido, Assaltare un Gruppo, Colpo Crudele - Imprese: Acrobazie - Valore iniziale: 11 Natura - Soccorritore: svuota la fatica quando sacrifichi un vantaggio per salvare la vita dei vulnerabili. - Dissidente: svuota la fatica quando ti schieri pubblicamente con chi ha subito torti dai potenti. Motivazioni: Infamia, Giustizia, Protezione, Vendetta. Legami: Protettore (ti ricorda qualcuno che hai perso), Compagno (avete abbattuto un complice della tua nemesi). Mosse: inizi con La Lista + due tra Implacabile, Fidati di Me, Ragazzo, Io Sono la Notte, Alla Tua Mercé, Oggi è un Buon Giorno per Morire.","back":["playbook-indice"]},{"id":"pb-flagello-lista","title":"La Lista","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["La Lista"],"html":"<p>All'inizio scrivi due nomi: la tua nemesi e il suo complice principale. +1 continuo a perseguire la vendetta contro chiunque sia nella lista. Quando ti vendichi di qualcuno, cancellalo e prendi un <strong>Marchio</strong>. Una volta per sessione puoi aggiungere un PNG prendendo un Marchio.</p><p>Marchi:</p><ul><li>La prossima volta che parli della tua vita felice prima della perdita, svuota 2-fatica.</li><li>La prossima volta che parli del tradimento della nemesi, svuota 2-fatica.</li><li>Rabbia costante: +1 a distruggere, -1 a chiedere favori.</li><li>Insofferenza: segni fatica quando convinci; +1 alle mosse con le armi con 3+ fatica segnata.</li><li>Solo la vendetta appaga: non svuoti più di 1-fatica riposando; svuoti 2-fatica aggiungendo un nome.</li><li>Vendetta chiama vendetta: un vendicatore PNG ti dà la caccia.</li><li>Ti perdi nella vendetta: il personaggio non è più un PG.</li></ul>","text":"All'inizio scrivi due nomi: la tua nemesi e il suo complice principale. +1 continuo a perseguire la vendetta contro chiunque sia nella lista. Quando ti vendichi di qualcuno, cancellalo e prendi un Marchio. Una volta per sessione puoi aggiungere un PNG prendendo un Marchio. Marchi: - La prossima volta che parli della tua vita felice prima della perdita, svuota 2-fatica. - La prossima volta che parli del tradimento della nemesi, svuota 2-fatica. - Rabbia costante: +1 a distruggere, -1 a chiedere favori. - Insofferenza: segni fatica quando convinci; +1 alle mosse con le armi con 3+ fatica segnata. - Solo la vendetta appaga: non svuoti più di 1-fatica riposando; svuoti 2-fatica aggiungendo un nome. - Vendetta chiama vendetta: un vendicatore PNG ti dà la caccia. - Ti perdi nella vendetta: il personaggio non è più un PG.","back":["pb-flagello"]},{"id":"pb-flagello-pagare","title":"Implacabile","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Implacabile"],"html":"<p>Una casella extra di fatica. Una volta per battaglia, dopo aver inflitto ferite, segna fatica per infliggere 2-ferite aggiuntive.</p>","text":"Una casella extra di fatica. Una volta per battaglia, dopo aver inflitto ferite, segna fatica per infliggere 2-ferite aggiuntive.","back":["pb-flagello"]},{"id":"pb-flagello-ragazzo","title":"Fidati di Me, Ragazzo","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Fidati di Me Ragazzo"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convinci un PNG</a> offrendo la tua amara saggezza, tira sulla fatica attualmente segnata (max +4) invece che su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: non del tutto: il GM ti dice cosa devi fare subito per persuaderlo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: rifiuta violentemente la tua visione, oppure la abbraccia con troppo fervore.</li></ul></div>","text":"Quando convinci un PNG offrendo la tua amara saggezza, tira sulla fatica attualmente segnata (max +4) invece che su Carisma. - 10+ (successo pieno): lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. - 7-9 (successo parziale): non del tutto: il GM ti dice cosa devi fare subito per persuaderlo. - 6- (fallimento): rifiuta violentemente la tua visione, oppure la abbraccia con troppo fervore.","back":["pb-flagello"]},{"id":"pb-flagello-notte","title":"Io Sono la Notte","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Io Sono la Notte"],"html":"<p>Ottieni <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a> e <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando li tenti indagando su un torto o perseguendo la vendetta, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Nascondersi e Sgattaiolare (fuori limite). Quando li tenti indagando su un torto o perseguendo la vendetta, tira su Fortuna. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-flagello"]},{"id":"pb-flagello-pieta","title":"Alla Tua Mercé","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Alla Tua Mercé"],"html":"<div class=\"move\"><p><strong>Quando risparmi un PNG che avresti potuto distruggere o umiliare, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni entrambe le ricompense.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 ricompensa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: qualcuno approfitta del tuo gesto.</li></ul><p>Ricompense:</p><ul><li>il gesto lenisce l'anima: svuota tutta la fatica;</li><li>gratitudine materiale: svuota 2 o più consumo.</li></ul></div>","text":"Quando risparmi un PNG che avresti potuto distruggere o umiliare, tira su Fortuna. - 10+ (successo pieno): ottieni entrambe le ricompense. - 7-9 (successo parziale): scegli 1 ricompensa. - 6- (fallimento): qualcuno approfitta del tuo gesto. Ricompense: - il gesto lenisce l'anima: svuota tutta la fatica; - gratitudine materiale: svuota 2 o più consumo.","back":["pb-flagello"]},{"id":"pb-flagello-morire","title":"Oggi è un Buon Giorno per Morire","cat":"mosse","group":"Flagello","src":"RS p.90","aliases":["Oggi è un Buon Giorno per Morire"],"html":"<p>+1 Fortuna (max +3).</p>","text":"+1 Fortuna (max +3).","back":["pb-flagello"]},{"id":"motivazioni-indice","title":"Elenco delle Motivazioni","cat":"indici","group":"","src":"B p.170-174; VF p.45-49; RS p.38-39","aliases":["elenco motivazioni"],"html":"<p>Regole: <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">Motivazioni</a>.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#mot-antimilitarista\" data-id=\"mot-antimilitarista\">Antimilitarista</a>, <a class=\"xl\" href=\"#mot-espiazione\" data-id=\"mot-espiazione\">Espiazione</a>, <a class=\"xl\" href=\"#mot-sviluppo\" data-id=\"mot-sviluppo\">Sviluppo</a>, <a class=\"xl\" href=\"#mot-devozione\" data-id=\"mot-devozione\">Devozione</a>, <a class=\"xl\" href=\"#mot-discordia\" data-id=\"mot-discordia\">Discordia</a>, <a class=\"xl\" href=\"#mot-spirito-corpo\" data-id=\"mot-spirito-corpo\">Spirito di Corpo</a>, <a class=\"xl\" href=\"#mot-eroe-popolare\" data-id=\"mot-eroe-popolare\">Eroe Popolare</a>, <a class=\"xl\" href=\"#mot-gloria\" data-id=\"mot-gloria\">Gloria</a>, <a class=\"xl\" href=\"#mot-misteri\" data-id=\"mot-misteri\">Misteri</a>, <a class=\"xl\" href=\"#mot-partigiano\" data-id=\"mot-partigiano\">Partigiano</a>, <a class=\"xl\" href=\"#mot-viaggiatore\" data-id=\"mot-viaggiatore\">Viaggiatore</a>, <a class=\"xl\" href=\"#mot-ricercato\" data-id=\"mot-ricercato\">Ricercato</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#mot-diplomazia\" data-id=\"mot-diplomazia\">Diplomazia</a>, <a class=\"xl\" href=\"#mot-rabdomante\" data-id=\"mot-rabdomante\">Rabdomante</a>, <a class=\"xl\" href=\"#mot-folclorista\" data-id=\"mot-folclorista\">Folclorista</a>, <a class=\"xl\" href=\"#mot-guardiano\" data-id=\"mot-guardiano\">Guardiano</a>.</p>","text":"Regole: Motivazioni. Manuale base: Ambizione, Avidità, Brivido, Caos, Crimine, Giustizia, Infamia, Lealtà, Libertà, Princìpi, Protezione, Scoperta, Vendetta, Voglia di Viaggiare, Zampe Pulite. Viandanti e Forestieri: Antimilitarista, Espiazione, Sviluppo, Devozione, Discordia, Spirito di Corpo, Eroe Popolare, Gloria, Misteri, Partigiano, Viaggiatore, Ricercato. Rovine e Spedizioni: Diplomazia, Rabdomante, Folclorista, Guardiano.","back":["motivazione"]},{"id":"mot-ambizione","title":"Ambizione","cat":"motivazioni","group":"","src":"B p.171","aliases":["Ambizione"],"html":"<p>Avanzi quando <strong>aumenti la tua Reputazione</strong> con una qualsiasi fazione. Conta il numero della Reputazione, non le caselle di prestigio (anche da -3 a -2).</p>","text":"Avanzi quando aumenti la tua Reputazione con una qualsiasi fazione. Conta il numero della Reputazione, non le caselle di prestigio (anche da -3 a -2).","back":["pb-avventuriero","pb-ladro","pb-mastro","pb-campione","pb-cronista","pb-emissario","pb-buongustaio","pb-orfano","motivazioni-indice"]},{"id":"mot-avidita","title":"Avidità","cat":"motivazioni","group":"","src":"B p.171","aliases":["Avidità"],"html":"<p>Avanzi quando ti assicuri <strong>una grossa ricompensa o un tesoro</strong>: deve valere moltissimo, indicativamente 5-Valore o più.</p>","text":"Avanzi quando ti assicuri una grossa ricompensa o un tesoro: deve valere moltissimo, indicativamente 5-Valore o più.","back":["pb-ladro","pb-mastro","pb-emissario","pb-razziatore","pb-cercatore","pb-trafficante","pb-cacciatore","motivazioni-indice"]},{"id":"mot-brivido","title":"Brivido","cat":"motivazioni","group":"","src":"B p.171","aliases":["Brivido"],"html":"<p>Avanzi quando <strong>sfuggi a morte certa o alla prigionia</strong>: una fuga rocambolesca da un pericolo che sembrava insormontabile.</p>","text":"Avanzi quando sfuggi a morte certa o alla prigionia: una fuga rocambolesca da un pericolo che sembrava insormontabile.","back":["pb-canaglia","pb-ciarlatano","pb-ladro","pb-ronin","pb-cantastorie","pb-nomade","pb-orfano","motivazioni-indice"]},{"id":"mot-caos","title":"Caos","cat":"motivazioni","group":"","src":"B p.171","aliases":["Caos"],"html":"<p>Avanzi quando <strong>rovesci un'autorità o un ordine particolarmente tirannici e pericolosi</strong> (anche temporaneamente). L'ultima parola sul \"tirannico\" spetta al GM.</p>","text":"Avanzi quando rovesci un'autorità o un ordine particolarmente tirannici e pericolosi (anche temporaneamente). L'ultima parola sul \"tirannico\" spetta al GM.","back":["pb-canaglia","pb-ciarlatano","pb-esule","pb-eretico","pb-razziatore","pb-orfano","motivazioni-indice"]},{"id":"mot-crimine","title":"Crimine","cat":"motivazioni","group":"","src":"B p.171-172","aliases":["Crimine"],"html":"<p>Avanzi quando, <strong>contro ogni previsione, ottieni illegalmente qualcosa di valore o metti a segno un colpo</strong>. Deve essere una storia da raccontare (derubare il palazzo del governatore, non ingannare qualche guardia).</p>","text":"Avanzi quando, contro ogni previsione, ottieni illegalmente qualcosa di valore o metti a segno un colpo. Deve essere una storia da raccontare (derubare il palazzo del governatore, non ingannare qualche guardia).","back":["pb-canaglia","pb-predone","pb-pirata","pb-principe","pb-razziatore","pb-trafficante","motivazioni-indice"]},{"id":"mot-giustizia","title":"Giustizia","cat":"motivazioni","group":"","src":"B p.172","aliases":["Giustizia"],"html":"<p>Avanzi quando <strong>ottieni giustizia per chi ha subito un torto da qualcuno di ricco e potente</strong>. Il torto deve essere serio e il colpevole davvero potente.</p>","text":"Avanzi quando ottieni giustizia per chi ha subito un torto da qualcuno di ricco e potente. Il torto deve essere serio e il colpevole davvero potente.","back":["pb-avventuriero","pb-giudice","pb-campione","pb-cronista","pb-cercatore","pb-cacciatore","pb-flagello","motivazioni-indice"]},{"id":"mot-infamia","title":"Infamia","cat":"motivazioni","group":"","src":"B p.172","aliases":["Infamia"],"html":"<p>Avanzi quando <strong>la tua Reputazione diminuisce</strong> con una qualsiasi fazione (conta il numero, non le caselle).</p>","text":"Avanzi quando la tua Reputazione diminuisce con una qualsiasi fazione (conta il numero, non le caselle).","back":["pb-canaglia","pb-predone","pb-esule","pb-pirata","pb-cantastorie","pb-flagello","motivazioni-indice"]},{"id":"mot-lealta","title":"Lealtà","cat":"motivazioni","group":"","src":"B p.172","aliases":["Lealtà"],"html":"<p>Nomina colui a cui sei fedele (PNG o PG). Avanzi quando <strong>obbedisci ai suoi ordini, ma farlo ti costa molto</strong>. Senza rischi o costi non conta.</p>","text":"Nomina colui a cui sei fedele (PNG o PG). Avanzi quando obbedisci ai suoi ordini, ma farlo ti costa molto. Senza rischi o costi non conta.","back":["pb-giudice","pb-campione","pb-emissario","pb-esule","pb-razziatore","pb-trafficante","pb-buongustaio","motivazioni-indice"]},{"id":"mot-liberta","title":"Libertà","cat":"motivazioni","group":"","src":"B p.172","aliases":["Libertà"],"html":"<p>Avanzi quando <strong>liberi un gruppo di abitanti dall'oppressione</strong>, anche solo per ora; l'oppressione deve essere reale per chi la subisce.</p>","text":"Avanzi quando liberi un gruppo di abitanti dall'oppressione, anche solo per ora; l'oppressione deve essere reale per chi la subisce.","back":["pb-ladro","pb-ranger","pb-eretico","pb-pirata","pb-principe","pb-cacciatore","pb-nomade","motivazioni-indice"]},{"id":"mot-principi","title":"Princìpi","cat":"motivazioni","group":"","src":"B p.173","aliases":["Princìpi"],"html":"<p>Avanzi quando <strong>metti in pericolo te o i tuoi alleati per esprimere o incarnare i tuoi principi morali</strong>. Devono essere veri principi (es. \"la violenza non è mai giustificata\"), definiti almeno a grandi linee.</p>","text":"Avanzi quando metti in pericolo te o i tuoi alleati per esprimere o incarnare i tuoi principi morali. Devono essere veri principi (es. \"la violenza non è mai giustificata\"), definiti almeno a grandi linee.","back":["pb-avventuriero","pb-giudice","pb-ronin","pb-campione","pb-eretico","pb-nomade","motivazioni-indice"]},{"id":"mot-protezione","title":"Protezione","cat":"motivazioni","group":"","src":"B p.173-174","aliases":["Protezione"],"html":"<p>Nomina il tuo protetto (PNG o PG). Avanzi quando <strong>lo proteggi da un grave pericolo o quando il tempo passa ed è ancora al sicuro</strong>. Un PNG deve viaggiare con te o trovarsi nella sua radura quando passi.</p>","text":"Nomina il tuo protetto (PNG o PG). Avanzi quando lo proteggi da un grave pericolo o quando il tempo passa ed è ancora al sicuro. Un PNG deve viaggiare con te o trovarsi nella sua radura quando passi.","back":["pb-giudice","pb-mastro","pb-ranger","pb-eretico","pb-principe","pb-cacciatore","pb-flagello","motivazioni-indice"]},{"id":"mot-scoperta","title":"Scoperta","cat":"motivazioni","group":"","src":"B p.174","aliases":["Scoperta"],"html":"<p>Avanzi quando <strong>scopri qualcosa di meraviglioso o delle nuove rovine nella foresta</strong> (nuove per te). Deve essere nella foresta, non nelle radure.</p>","text":"Avanzi quando scopri qualcosa di meraviglioso o delle nuove rovine nella foresta (nuove per te). Deve essere nella foresta, non nelle radure.","back":["pb-predone","pb-ranger","pb-cronista","pb-cantastorie","pb-cercatore","pb-buongustaio","pb-orfano","motivazioni-indice","rovine-indice"]},{"id":"mot-vendetta","title":"Vendetta","cat":"motivazioni","group":"","src":"B p.174","aliases":["Vendetta"],"html":"<p>Nomina il tuo nemico (un PNG potente, mai un PG). Avanzi quando <strong>danneggi lui o i suoi interessi in modo significativo</strong>.</p>","text":"Nomina il tuo nemico (un PNG potente, mai un PG). Avanzi quando danneggi lui o i suoi interessi in modo significativo.","back":["pb-mastro","pb-ranger","pb-ronin","pb-esule","pb-pirata","pb-flagello","motivazioni-indice"]},{"id":"mot-voglia-viaggiare","title":"Voglia di Viaggiare","cat":"motivazioni","group":"","src":"B p.174","aliases":["Voglia di Viaggiare"],"html":"<p>Avanzi quando <strong>termini un viaggio in una radura</strong> (all'arrivo, non alla partenza).</p>","text":"Avanzi quando termini un viaggio in una radura (all'arrivo, non alla partenza).","back":["pb-ciarlatano","pb-predone","pb-ronin","pb-principe","pb-cercatore","pb-nomade","motivazioni-indice"]},{"id":"mot-zampe-pulite","title":"Zampe Pulite","cat":"motivazioni","group":"","src":"B p.174","aliases":["Zampe Pulite"],"html":"<p>Avanzi quando <strong>porti a termine un'impresa illegale e ne esci pulito</strong>: chi sa del crimine non ha motivo (né prove) per incolparti.</p>","text":"Avanzi quando porti a termine un'impresa illegale e ne esci pulito: chi sa del crimine non ha motivo (né prove) per incolparti.","back":["pb-avventuriero","pb-ciarlatano","pb-cronista","pb-emissario","pb-cantastorie","pb-trafficante","pb-buongustaio","motivazioni-indice"]},{"id":"mot-antimilitarista","title":"Antimilitarista","cat":"motivazioni","group":"","src":"VF p.45","aliases":["Antimilitarista"],"html":"<p>Avanzi quando <strong>saboti gli eserciti di una fazione non-abitante</strong> o la sua capacità di fare la guerra (bruciare scorte, distruggere armi d'assedio, falsificare ordini). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando saboti gli eserciti di una fazione non-abitante o la sua capacità di fare la guerra (bruciare scorte, distruggere armi d'assedio, falsificare ordini). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-espiazione","title":"Espiazione","cat":"motivazioni","group":"","src":"VF p.45","aliases":["Espiazione"],"html":"<p>Avanzi quando <strong>ottieni il perdono di qualcuno che tu o i tuoi alleati avete danneggiato</strong> in passato, rimediando sinceramente. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando ottieni il perdono di qualcuno che tu o i tuoi alleati avete danneggiato in passato, rimediando sinceramente. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-sviluppo","title":"Sviluppo","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Sviluppo"],"html":"<p>Avanzi quando <strong>contribuisci a uno sviluppo duraturo di un'intera radura</strong> (un mulino, mura rinforzate, una rovina bonificata). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando contribuisci a uno sviluppo duraturo di un'intera radura (un mulino, mura rinforzate, una rovina bonificata). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-devozione","title":"Devozione","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Devozione"],"html":"<p>Segui una religione (es. quella della Setta delle Lucertole): descrivine le credenze. Avanzi quando <strong>un non credente condivide una tua credenza o pratica</strong>. <em>(trad. non ufficiale)</em></p>","text":"Segui una religione (es. quella della Setta delle Lucertole): descrivine le credenze. Avanzi quando un non credente condivide una tua credenza o pratica. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-discordia","title":"Discordia","cat":"motivazioni","group":"","src":"VF p.46","aliases":["Discordia"],"html":"<p>Avanzi quando <strong>le tue azioni creano o inaspriscono un grave conflitto tra due fazioni</strong> (truppe inviate, strade bloccate). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando le tue azioni creano o inaspriscono un grave conflitto tra due fazioni (truppe inviate, strade bloccate). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-spirito-corpo","title":"Spirito di Corpo","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Spirito di Corpo"],"html":"<p>Avanzi quando <strong>vinci una battaglia contro veri soldati nemici insieme ad amici e alleati</strong>. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando vinci una battaglia contro veri soldati nemici insieme ad amici e alleati. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-eroe-popolare","title":"Eroe Popolare","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Eroe Popolare"],"html":"<p>Avanzi quando <strong>compi un atto significativo di servizio o eroismo per gli abitanti</strong>, che migliori davvero la loro situazione e risponda a un loro problema reale. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando compi un atto significativo di servizio o eroismo per gli abitanti, che migliori davvero la loro situazione e risponda a un loro problema reale. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-gloria","title":"Gloria","cat":"motivazioni","group":"","src":"VF p.47","aliases":["Gloria"],"html":"<p>Avanzi quando <strong>sconfiggi un degno avversario in singolar tenzone</strong>, senza interferenze. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando sconfiggi un degno avversario in singolar tenzone, senza interferenze. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-misteri","title":"Misteri","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Misteri"],"html":"<p>Avanzi quando <strong>scopri la verità dietro fenomeni strani</strong> in una radura (smascherare un falso mostro, la causa di una \"maledizione\"). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando scopri la verità dietro fenomeni strani in una radura (smascherare un falso mostro, la causa di una \"maledizione\"). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-partigiano","title":"Partigiano","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Partigiano"],"html":"<p>Nomina una fazione. Avanzi quando <strong>completi una missione affidatati da un suo membro importante</strong>. <em>(trad. non ufficiale)</em></p>","text":"Nomina una fazione. Avanzi quando completi una missione affidatati da un suo membro importante. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-viaggiatore","title":"Viaggiatore","cat":"motivazioni","group":"","src":"VF p.48","aliases":["Viaggiatore"],"html":"<p>Avanzi quando <strong>sostituisci un oggetto prezioso o significativo con uno che rappresenti la cultura locale</strong>. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando sostituisci un oggetto prezioso o significativo con uno che rappresenti la cultura locale. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-ricercato","title":"Ricercato","cat":"motivazioni","group":"","src":"VF p.49","aliases":["Ricercato"],"html":"<p>Hai una taglia sulla testa: indica il crimine. Avanzi quando <strong>sconfiggi o sfuggi a una minaccia seria che vuole riscuotere la taglia</strong>. <em>(trad. non ufficiale)</em></p>","text":"Hai una taglia sulla testa: indica il crimine. Avanzi quando sconfiggi o sfuggi a una minaccia seria che vuole riscuotere la taglia. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-diplomazia","title":"Diplomazia","cat":"motivazioni","group":"","src":"RS p.38","aliases":["Diplomazia"],"html":"<p>Avanzi quando <strong>aiuti a stringere un trattato o un accordo formale tra due o più gruppi in conflitto</strong> acceso. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando aiuti a stringere un trattato o un accordo formale tra due o più gruppi in conflitto acceso. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-rabdomante","title":"Rabdomante","cat":"motivazioni","group":"","src":"RS p.38","aliases":["Rabdomante"],"html":"<p>Avanzi quando <strong>aiuti una radura a scoprire e rivendicare una preziosa risorsa naturale</strong> nella foresta (sorgente calda, vena di minerale, raro frutteto). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando aiuti una radura a scoprire e rivendicare una preziosa risorsa naturale nella foresta (sorgente calda, vena di minerale, raro frutteto). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-folclorista","title":"Folclorista","cat":"motivazioni","group":"","src":"RS p.39","aliases":["Folclorista"],"html":"<p>Avanzi quando <strong>dimostri vera o falsa una leggenda locale</strong>, con prove definitive. <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando dimostri vera o falsa una leggenda locale, con prove definitive. (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"mot-guardiano","title":"Guardiano delle Radure (Guardian)","cat":"motivazioni","group":"","src":"RS p.39","aliases":["Guardiano delle radure"],"html":"<p>Avanzi quando <strong>proteggi una radura da una grande bestia</strong> sconfiggendola o scacciandola per sempre (vedi Mostri dei Boschi). <em>(trad. non ufficiale)</em></p>","text":"Avanzi quando proteggi una radura da una grande bestia sconfiggendola o scacciandola per sempre (vedi Mostri dei Boschi). (trad. non ufficiale)","back":["motivazioni-indice"]},{"id":"nature-indice","title":"Elenco delle Nature","cat":"indici","group":"","src":"B p.133-168; VF p.50-53; RS p.40-41","aliases":["elenco nature"],"html":"<p>Regole: <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a>. Ogni natura svuota <strong>tutto</strong> il tracciato della fatica.</p><p><strong>Nature dei playbook del manuale base</strong></p><ul><li><a class=\"xl\" href=\"#pb-avventuriero\" data-id=\"pb-avventuriero\">Avventuriero</a>: Estroverso, Pacifista</li><li><a class=\"xl\" href=\"#pb-canaglia\" data-id=\"pb-canaglia\">Canaglia</a>: Incendiario, Agguerrito</li><li><a class=\"xl\" href=\"#pb-ciarlatano\" data-id=\"pb-ciarlatano\">Ciarlatano</a>: Ingordo, Imbroglione</li><li><a class=\"xl\" href=\"#pb-giudice\" data-id=\"pb-giudice\">Giudice</a>: Difensore, Punitore</li><li><a class=\"xl\" href=\"#pb-ladro\" data-id=\"pb-ladro\">Ladro</a>: Cleptomane, Ribelle</li><li><a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Mastro</a>: Perfezionista, Estremista</li><li><a class=\"xl\" href=\"#pb-predone\" data-id=\"pb-predone\">Predone</a>: Diligente, Competitivo</li><li><a class=\"xl\" href=\"#pb-ranger\" data-id=\"pb-ranger\">Ranger</a>: Solitario, Cinico</li><li><a class=\"xl\" href=\"#pb-ronin\" data-id=\"pb-ronin\">Ronin</a>: Sopravvissuto, Pellegrino</li></ul><p><strong>Nature generiche di Viandanti e Forestieri</strong> (VF p.50-53, trad. non ufficiale)</p><ul><li><em>Spaccone</em>: quando accetti con sicurezza e in pubblico una sfida eccessivamente pericolosa.</li><li><em>Comandante</em>: quando imponi la tua autorità su un gruppo di non-vagabondi in una situazione tesa.</li><li><em>Codardo</em>: quando ti arrendi volontariamente (e davvero) a forze ostili.</li><li><em>Curioso</em>: quando affronti il pericolo per indagare una situazione o un luogo interessante.</li><li><em>Generoso</em>: quando fornisci quantità significative di provviste a chi ne ha bisogno.</li><li><em>Pettegolo</em>: quando riveli informazioni nuove e importanti a qualcuno che può usarle.</li><li><em>Improvvisatore</em>: quando cerchi di risolvere un problema tecnico senza strumenti o competenze adatte.</li><li><em>Ispiratore</em>: quando le tue azioni svuotano il tracciato del morale di un PNG o di un gruppo.</li><li><em>Martire</em>: quando affronti forze soverchianti per proteggere altri.</li><li><em>Ficcanaso</em>: quando entri in un luogo proibito per scoprire segreti compromettenti.</li><li><em>Populista</em>: quando inciti pubblicamente un gruppo di abitanti ad agire contro un'ingiustizia.</li><li><em>Vanitoso</em>: quando intervieni in modo plateale in una situazione che non ti riguardava per aiutare qualcuno.</li></ul><p><strong>Nature generiche di Rovine e Spedizioni</strong> (RS p.40-41, trad. non ufficiale)</p><ul><li><em>Consigliere</em>: quando aiuti un PNG ad arrivare a una posizione di influenza o comando.</li><li><em>Caritatevole</em>: quando doni un tesoro di valore ai capi della radura.</li><li><em>Colomba</em>: quando convinci un gruppo ostile a rinunciare alla lotta e sciogliersi.</li><li><em>Tuttofare</em>: quando accetti di aiutare una radura riparando uno strumento o una risorsa indispensabile.</li></ul>","text":"Regole: Natura. Ogni natura svuota tutto il tracciato della fatica. Nature dei playbook del manuale base - Avventuriero: Estroverso, Pacifista - Canaglia: Incendiario, Agguerrito - Ciarlatano: Ingordo, Imbroglione - Giudice: Difensore, Punitore - Ladro: Cleptomane, Ribelle - Mastro: Perfezionista, Estremista - Predone: Diligente, Competitivo - Ranger: Solitario, Cinico - Ronin: Sopravvissuto, Pellegrino Nature generiche di Viandanti e Forestieri (VF p.50-53, trad. non ufficiale) - Spaccone: quando accetti con sicurezza e in pubblico una sfida eccessivamente pericolosa. - Comandante: quando imponi la tua autorità su un gruppo di non-vagabondi in una situazione tesa. - Codardo: quando ti arrendi volontariamente (e davvero) a forze ostili. - Curioso: quando affronti il pericolo per indagare una situazione o un luogo interessante. - Generoso: quando fornisci quantità significative di provviste a chi ne ha bisogno. - Pettegolo: quando riveli informazioni nuove e importanti a qualcuno che può usarle. - Improvvisatore: quando cerchi di risolvere un problema tecnico senza strumenti o competenze adatte. - Ispiratore: quando le tue azioni svuotano il tracciato del morale di un PNG o di un gruppo. - Martire: quando affronti forze soverchianti per proteggere altri. - Ficcanaso: quando entri in un luogo proibito per scoprire segreti compromettenti. - Populista: quando inciti pubblicamente un gruppo di abitanti ad agire contro un'ingiustizia. - Vanitoso: quando intervieni in modo plateale in una situazione che non ti riguardava per aiutare qualcuno. Nature generiche di Rovine e Spedizioni (RS p.40-41, trad. non ufficiale) - Consigliere: quando aiuti un PNG ad arrivare a una posizione di influenza o comando. - Caritatevole: quando doni un tesoro di valore ai capi della radura. - Colomba: quando convinci un gruppo ostile a rinunciare alla lotta e sciogliersi. - Tuttofare: quando accetti di aiutare una radura riparando uno strumento o una risorsa indispensabile.","back":["natura"]},{"id":"legami-indice","title":"Elenco dei Legami","cat":"indici","group":"","src":"B p.51; VF p.54-56; RS p.42-44","aliases":["elenco legami"],"html":"<p>Regole: <a class=\"xl\" href=\"#legame\" data-id=\"legame\">Legami</a>.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#legame-protettore\" data-id=\"legame-protettore\">Protettore</a>, <a class=\"xl\" href=\"#legame-compagno\" data-id=\"legame-compagno\">Compagno</a>, <a class=\"xl\" href=\"#legame-sentinella\" data-id=\"legame-sentinella\">Sentinella</a>, <a class=\"xl\" href=\"#legame-amico\" data-id=\"legame-amico\">Amico</a>, <a class=\"xl\" href=\"#legame-professionista\" data-id=\"legame-professionista\">Professionista</a>, <a class=\"xl\" href=\"#legame-familiare\" data-id=\"legame-familiare\">Familiare</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#legame-fratello-armi\" data-id=\"legame-fratello-armi\">Fratello d'Armi</a>, <a class=\"xl\" href=\"#legame-confidente\" data-id=\"legame-confidente\">Confidente</a>, <a class=\"xl\" href=\"#legame-istigatore\" data-id=\"legame-istigatore\">Complice</a>, <a class=\"xl\" href=\"#legame-amante\" data-id=\"legame-amante\">Amante</a>, <a class=\"xl\" href=\"#legame-protetto\" data-id=\"legame-protetto\">Protetto</a>, <a class=\"xl\" href=\"#legame-rivale\" data-id=\"legame-rivale\">Rivale</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#legame-ex-galeotto\" data-id=\"legame-ex-galeotto\">Ex Galeotto</a>, <a class=\"xl\" href=\"#legame-lealista\" data-id=\"legame-lealista\">Lealista</a>, <a class=\"xl\" href=\"#legame-profugo\" data-id=\"legame-profugo\">Profugo</a>, <a class=\"xl\" href=\"#legame-veterano\" data-id=\"legame-veterano\">Veterano</a>.</p>","text":"Regole: Legami. Manuale base: Protettore, Compagno, Sentinella, Amico, Professionista, Familiare. Viandanti e Forestieri: Fratello d'Armi, Confidente, Complice, Amante, Protetto, Rivale. Rovine e Spedizioni: Ex Galeotto, Lealista, Profugo, Veterano.","back":["legame"]},{"id":"legame-protettore","title":"Legame: Protettore","cat":"legami","group":"","src":"B p.51","aliases":["Protettore"],"html":"<p>Quando è nel tuo raggio d'azione, segna fatica per <strong>subire un colpo indirizzato a lui</strong>. Se lo fai, hai <strong>+1 continuo alle mosse con le armi</strong> per il resto della scena.</p>","text":"Quando è nel tuo raggio d'azione, segna fatica per subire un colpo indirizzato a lui. Se lo fai, hai +1 continuo alle mosse con le armi per il resto della scena.","back":["legami-indice"]},{"id":"legame-compagno","title":"Legame: Compagno","cat":"legami","group":"","src":"B p.51","aliases":["Compagno"],"html":"<p>Quando compili il legame, segnate <strong>entrambi 2-prestigio</strong> con la fazione che avete aiutato e <strong>2-nomea</strong> con quella danneggiata. Se in gioco venite visti insieme, prestigio e nomea con quelle fazioni sono <strong>raddoppiati</strong> per entrambi.</p>","text":"Quando compili il legame, segnate entrambi 2-prestigio con la fazione che avete aiutato e 2-nomea con quella danneggiata. Se in gioco venite visti insieme, prestigio e nomea con quelle fazioni sono raddoppiati per entrambi.","back":["legami-indice"]},{"id":"legame-sentinella","title":"Legame: Sentinella","cat":"legami","group":"","src":"B p.51","aliases":["Sentinella"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le sue intenzioni</a> ottieni almeno 1 presa, anche con un fallimento. Quando lo <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">supplichi</a>, può svuotare 2-fatica invece di 1.</p>","text":"Quando capisci le sue intenzioni ottieni almeno 1 presa, anche con un fallimento. Quando lo supplichi, può svuotare 2-fatica invece di 1.","back":["supplicare","legami-indice"]},{"id":"legame-amico","title":"Legame: Amico","cat":"legami","group":"","src":"B p.51","aliases":["Amico"],"html":"<p>Quando lo <a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">aiuti</a>, puoi segnare 2-fatica per dare <strong>+2</strong> invece di 1-fatica per +1.</p>","text":"Quando lo aiuti, puoi segnare 2-fatica per dare +2 invece di 1-fatica per +1.","back":["aiutare","legami-indice"]},{"id":"legame-professionista","title":"Legame: Professionista","cat":"legami","group":"","src":"B p.51","aliases":["Professionista"],"html":"<p>Se dopo aver <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valutato una situazione tesa</a> condividi con lui le informazioni, entrambi avete +1 agendo sulle risposte. Quando lo aiuti in un'impresa da furfante, ottieni le opzioni come se avessi segnato 2-fatica, ma ne segni 1.</p>","text":"Se dopo aver valutato una situazione tesa condividi con lui le informazioni, entrambi avete +1 agendo sulle risposte. Quando lo aiuti in un'impresa da furfante, ottieni le opzioni come se avessi segnato 2-fatica, ma ne segni 1.","back":["valutare","aiutare","legami-indice"]},{"id":"legame-familiare","title":"Legame: Familiare","cat":"legami","group":"","src":"B p.51","aliases":["Familiare"],"html":"<p>Quando lo aiuti a soddisfare la sua <a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a>, <strong>svuotate entrambi</strong> il tracciato della fatica.</p>","text":"Quando lo aiuti a soddisfare la sua Natura, svuotate entrambi il tracciato della fatica.","back":["legami-indice"]},{"id":"legame-fratello-armi","title":"Legame: Fratello d'Armi (Battle-Sibling)","cat":"legami","group":"","src":"VF p.54","aliases":["Fratello d'Armi","Battle-Sibling"],"html":"<p>Quando combattete fianco a fianco o schiena contro schiena, +1 continuo alle mosse con le armi finché restate a contatto. <em>(trad. non ufficiale)</em></p>","text":"Quando combattete fianco a fianco o schiena contro schiena, +1 continuo alle mosse con le armi finché restate a contatto. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-confidente","title":"Legame: Confidente","cat":"legami","group":"","src":"VF p.54","aliases":["Confidente"],"html":"<p>Quando viene da te in confidenza con un problema, segna fatica per suggerire una soluzione: se la segue al meglio, svuota tutta la fatica. <em>(trad. non ufficiale)</em></p>","text":"Quando viene da te in confidenza con un problema, segna fatica per suggerire una soluzione: se la segue al meglio, svuota tutta la fatica. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-istigatore","title":"Legame: Complice (Enabler)","cat":"legami","group":"","src":"VF p.55","aliases":["Complice","Enabler"],"html":"<p>Quando lo <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">supplichi</a> di unirsi a un'azione avventata e accetta, oltre a svuotare fatica ha +1 continuo a seguire il piano. <em>(trad. non ufficiale)</em></p>","text":"Quando lo supplichi di unirsi a un'azione avventata e accetta, oltre a svuotare fatica ha +1 continuo a seguire il piano. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-amante","title":"Legame: Amante (Lover)","cat":"legami","group":"","src":"VF p.55","aliases":["Amante","Lover"],"html":"<p>Una volta per sessione, in un momento di intimità tranquillo tra voi due, scegli 1:</p><ul><li>gli offri affetto: se lo accetta, svuota 3-fatica;</li><li>gli fai una promessa concreta: +1 continuo a mantenerla.</li></ul><p><em>(trad. non ufficiale)</em></p>","text":"Una volta per sessione, in un momento di intimità tranquillo tra voi due, scegli 1: - gli offri affetto: se lo accetta, svuota 3-fatica; - gli fai una promessa concreta: +1 continuo a mantenerla. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-protetto","title":"Legame: Protetto (Protégé)","cat":"legami","group":"","src":"VF p.55-56","aliases":["Protetto","Protégé"],"html":"<p>Una volta per sessione, quando vi allenate insieme, scegli e tieni 1:</p><ul><li>impari un'impresa da furfante: spendila per tentarla come se l'avessi;</li><li>impari un'abilità con le armi: spendila per usarla come se l'avessi;</li><li>gli chiedi come vede il mondo: spendila per +1 al prossimo tiro per dargli ragione o torto.</li></ul><p><em>(trad. non ufficiale)</em></p>","text":"Una volta per sessione, quando vi allenate insieme, scegli e tieni 1: - impari un'impresa da furfante: spendila per tentarla come se l'avessi; - impari un'abilità con le armi: spendila per usarla come se l'avessi; - gli chiedi come vede il mondo: spendila per +1 al prossimo tiro per dargli ragione o torto. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-rivale","title":"Legame: Rivale","cat":"legami","group":"","src":"VF p.56","aliases":["Rivale"],"html":"<p>Quando lo sfidi a correre un rischio del tutto inutile ed eccessivo per dimostrare il suo valore, ha +1 al prossimo tiro se accetta; se rifiuta, segna fatica. <em>(trad. non ufficiale)</em></p>","text":"Quando lo sfidi a correre un rischio del tutto inutile ed eccessivo per dimostrare il suo valore, ha +1 al prossimo tiro se accetta; se rifiuta, segna fatica. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-ex-galeotto","title":"Legame: Ex Galeotto (Ex-Convict)","cat":"legami","group":"","src":"RS p.42","aliases":["Ex Galeotto","Ex-Convict"],"html":"<p>Compilandolo segnate entrambi 2-nomea con una fazione. Quando valuti una situazione tesa puoi sempre chiedere gratis \"Cos'è più prezioso qui?\", anche con un fallimento; entrambi avete +1 agendo sulle risposte. <em>(trad. non ufficiale)</em></p>","text":"Compilandolo segnate entrambi 2-nomea con una fazione. Quando valuti una situazione tesa puoi sempre chiedere gratis \"Cos'è più prezioso qui?\", anche con un fallimento; entrambi avete +1 agendo sulle risposte. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-lealista","title":"Legame: Lealista (Loyalist)","cat":"legami","group":"","src":"RS p.42","aliases":["Lealista","Loyalist"],"html":"<p>Compilandolo segnate entrambi 2-prestigio con la fazione che avete servito. Quando le chiedi un favore, puoi segnare 2-fatica per prendere <span class=\"res\">10+</span>. <em>(trad. non ufficiale)</em></p>","text":"Compilandolo segnate entrambi 2-prestigio con la fazione che avete servito. Quando le chiedi un favore, puoi segnare 2-fatica per prendere 10+. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-profugo","title":"Legame: Profugo (Refugee)","cat":"legami","group":"","src":"RS p.43","aliases":["Profugo","Refugee"],"html":"<p>Venite da una radura che non esiste più e condividete una pratica culturale: quando segni consumo per praticarla in pubblico, un abitante (un sopravvissuto o un simpatizzante) si fa avanti offrendo conforto e aiuto. <em>(trad. non ufficiale)</em></p>","text":"Venite da una radura che non esiste più e condividete una pratica culturale: quando segni consumo per praticarla in pubblico, un abitante (un sopravvissuto o un simpatizzante) si fa avanti offrendo conforto e aiuto. (trad. non ufficiale)","back":["legami-indice"]},{"id":"legame-veterano","title":"Legame: Veterano","cat":"legami","group":"","src":"RS p.43","aliases":["Veterano"],"html":"<p>Quando combattete fianco a fianco, entrambi potete usare <a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a> con qualsiasi arma finché restate a contatto; se scegli di infliggere morale o fatica parando, ne infliggi uno in più. <em>(trad. non ufficiale)</em></p>","text":"Quando combattete fianco a fianco, entrambi potete usare Parare con qualsiasi arma finché restate a contatto; se scegli di infliggere morale o fatica parando, ne infliggi uno in più. (trad. non ufficiale)","back":["legami-indice"]},{"id":"rovine-indice","title":"Esplorazione delle Rovine","cat":"indici","group":"","src":"RS p.97-120","aliases":["esplorazione","rovine","rovina","spedizione"],"html":"<p>Sistema di <em>Rovine e Spedizioni</em> per esplorare le rovine degli <strong>Antichi</strong> (vedi Gli Antichi).</p><p><strong>Trovare e lasciare una rovina</strong>: Aggiungere Rovine alla Mappa, <a class=\"xl\" href=\"#cercare-rovine\" data-id=\"cercare-rovine\">Cercare Rovine</a>, <a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a>.</p><p><strong>Nelle profondità</strong> (ogni \"livello\" è un grande spazio alla stessa profondità; ogni \"area\" una sezione del livello):</p><ul><li><a class=\"xl\" href=\"#avanzare-rovine\" data-id=\"avanzare-rovine\">Avanzare nelle Rovine</a> — passare a una nuova area dello stesso livello (costa consumo)</li><li><a class=\"xl\" href=\"#scendere-rovine\" data-id=\"scendere-rovine\">Scendere più in Profondità</a> — scendere al livello successivo</li><li><a class=\"xl\" href=\"#cercare-risorse\" data-id=\"cercare-risorse\">Cercare Risorse</a> — una volta per livello</li><li><a class=\"xl\" href=\"#accamparsi-rovine\" data-id=\"accamparsi-rovine\">Accamparsi nelle Rovine</a> — riposare</li><li><a class=\"xl\" href=\"#ritirata\" data-id=\"ritirata\">Ritirarsi in Superficie</a> — risalire in superficie</li></ul><p><strong>Per il GM</strong>: Creare le Rovine, Generatore Casuale di Rovine, Minacce delle Rovine, Reliquie degli Antichi, Mostri dei Boschi.</p><p>Imprese e mosse utili: <a class=\"xl\" href=\"#usare-congegno\" data-id=\"usare-congegno\">Usare un Congegno (Use Device)</a>, <a class=\"xl\" href=\"#disattivare\" data-id=\"disattivare\">Disattivare un Congegno</a>, <a class=\"xl\" href=\"#pb-cercatore-segni\" data-id=\"pb-cercatore-segni\">Leggere i Segni</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>.</p>","text":"Sistema di Rovine e Spedizioni per esplorare le rovine degli Antichi (vedi Gli Antichi). Trovare e lasciare una rovina: Aggiungere Rovine alla Mappa, Cercare Rovine, Tornare da una Rovina nella Foresta. Nelle profondità (ogni \"livello\" è un grande spazio alla stessa profondità; ogni \"area\" una sezione del livello): - Avanzare nelle Rovine — passare a una nuova area dello stesso livello (costa consumo) - Scendere più in Profondità — scendere al livello successivo - Cercare Risorse — una volta per livello - Accamparsi nelle Rovine — riposare - Ritirarsi in Superficie — risalire in superficie Per il GM: Creare le Rovine, Generatore Casuale di Rovine, Minacce delle Rovine, Reliquie degli Antichi, Mostri dei Boschi. Imprese e mosse utili: Usare un Congegno (Use Device), Disattivare un Congegno, Leggere i Segni, Scoperta.","back":[]},{"id":"cercare-rovine","title":"Cercare Rovine","cat":"esplorazione","group":"","src":"RS p.102","aliases":["cercare rovine"],"html":"<div class=\"move\"><p><strong>Quando vi addentrate nella foresta per cercare rovine, uno tira per la banda, con:</strong></p><ul><li>+1 se avete una mappa dettagliata della zona;</li><li>+1 se un vagabondo ha Fortuna +2 o più;</li><li>-1 se un vagabondo ha più di 1-ferita segnata;</li><li>-1 se non avete una guida locale.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: trovate il sito, arrivate sani e salvi all'ingresso e trovate anche un'area sicura vicina: accampandovi prima di entrare ognuno svuota 1-fatica.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: trovate il sito, ma una minaccia della rovina blocca il passaggio: dovete superarla per entrare.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: è la rovina a trovare voi: una minaccia vi trascina dentro prima che siate pronti.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando vi addentrate nella foresta per cercare rovine, uno tira per la banda, con: - +1 se avete una mappa dettagliata della zona; - +1 se un vagabondo ha Fortuna +2 o più; - -1 se un vagabondo ha più di 1-ferita segnata; - -1 se non avete una guida locale. Risultati: - 10+ (successo pieno): trovate il sito, arrivate sani e salvi all'ingresso e trovate anche un'area sicura vicina: accampandovi prima di entrare ognuno svuota 1-fatica. - 7-9 (successo parziale): trovate il sito, ma una minaccia della rovina blocca il passaggio: dovete superarla per entrare. - 6- (fallimento): è la rovina a trovare voi: una minaccia vi trascina dentro prima che siate pronti. (trad. non ufficiale)","back":["viaggio-indice","rovine-indice"]},{"id":"tornare-rovina","title":"Tornare da una Rovina nella Foresta","cat":"esplorazione","group":"","src":"RS p.103","aliases":["tornare da una rovina"],"html":"<div class=\"move\"><p><strong>Quando tornate da una rovina nella foresta, la banda sceglie come procedere e uno tira.</strong> Scegliete 1 modo:</p><ul><li><strong>con calma e in silenzio</strong>, ripercorrendo i passi: la banda segna 1-consumo per membro; tiro a +0;</li><li><strong>rapidi ed efficienti</strong>: tutti segnano 1-fatica; tiro a +1;</li><li><strong>fuggendo verso la salvezza</strong>: tutti segnano 2-fatica o 2-ferite (a scelta) e 2-usura; tiro a +2.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungete una radura vicina con il bottino, evitando i pericoli.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: arrivate con il bottino, ma il ritorno è segnato da un promemoria della Guerra (soldati, resti di una battaglia).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: qualcosa vi raggiunge, o scoprite troppo tardi che qualcuno di cui non vi fidate vi aspetta.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando tornate da una rovina nella foresta, la banda sceglie come procedere e uno tira. Scegliete 1 modo: - con calma e in silenzio, ripercorrendo i passi: la banda segna 1-consumo per membro; tiro a +0; - rapidi ed efficienti: tutti segnano 1-fatica; tiro a +1; - fuggendo verso la salvezza: tutti segnano 2-fatica o 2-ferite (a scelta) e 2-usura; tiro a +2. Risultati: - 10+ (successo pieno): raggiungete una radura vicina con il bottino, evitando i pericoli. - 7-9 (successo parziale): arrivate con il bottino, ma il ritorno è segnato da un promemoria della Guerra (soldati, resti di una battaglia). - 6- (fallimento): qualcosa vi raggiunge, o scoprite troppo tardi che qualcuno di cui non vi fidate vi aspetta. (trad. non ufficiale)","back":["viaggio-indice","rovine-indice","ritirata"]},{"id":"avanzare-rovine","title":"Avanzare nelle Rovine","cat":"esplorazione","group":"","src":"RS p.104","aliases":["avanzare nelle rovine","press forward"],"html":"<div class=\"move\"><p><strong>Quando avanzate in una nuova area delle rovine profonde, un membro della banda deve segnare 1-consumo;</strong> se non potete o non volete, una minaccia della rovina si abbatte su di voi.</p></div><p>Rappresenta cibo, acqua e torce consumati. Il GM decide cosa conta come nuova area (di solito una stanza o un gruppo di stanze vicine). Scendere di livello è <a class=\"xl\" href=\"#scendere-rovine\" data-id=\"scendere-rovine\">Scendere più in Profondità</a>. <em>(trad. non ufficiale)</em></p>","text":"Quando avanzate in una nuova area delle rovine profonde, un membro della banda deve segnare 1-consumo; se non potete o non volete, una minaccia della rovina si abbatte su di voi. Rappresenta cibo, acqua e torce consumati. Il GM decide cosa conta come nuova area (di solito una stanza o un gruppo di stanze vicine). Scendere di livello è Scendere più in Profondità. (trad. non ufficiale)","back":["rovine-indice"]},{"id":"scendere-rovine","title":"Scendere più in Profondità","cat":"esplorazione","group":"","src":"RS p.105","aliases":["scendere in profondità","delve deeper"],"html":"<div class=\"move\"><p><strong>Quando scendete verso un nuovo livello di una rovina attraverso un passaggio aperto, uno tira per la banda, con:</strong></p><ul><li>+1 se nessun membro ha ferite segnate;</li><li>+1 se la banda segna in totale 2-consumo e 2-usura;</li><li>-2 se state affrontando una minaccia o una crisi attiva.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungete il livello successivo e la discesa è propizia. Scegliete 1:<ul><li>trovate risorse naturali;</li><li>trovate un posto sicuro per accamparvi.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungete il livello successivo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: scendete, ma una seria minaccia vi intrappola sul nuovo livello finché non la affrontate o trovate un'altra via.</li></ul></div><p>Più si scende, più minacce e ricompense crescono. <em>(trad. non ufficiale)</em></p>","text":"Quando scendete verso un nuovo livello di una rovina attraverso un passaggio aperto, uno tira per la banda, con: - +1 se nessun membro ha ferite segnate; - +1 se la banda segna in totale 2-consumo e 2-usura; - -2 se state affrontando una minaccia o una crisi attiva. Risultati: - 10+ (successo pieno): raggiungete il livello successivo e la discesa è propizia. Scegliete 1: - trovate risorse naturali; - trovate un posto sicuro per accamparvi. - 7-9 (successo parziale): raggiungete il livello successivo. - 6- (fallimento): scendete, ma una seria minaccia vi intrappola sul nuovo livello finché non la affrontate o trovate un'altra via. Più si scende, più minacce e ricompense crescono. (trad. non ufficiale)","back":["rovine-indice","avanzare-rovine"]},{"id":"cercare-risorse","title":"Cercare Risorse","cat":"esplorazione","group":"","src":"RS p.106","aliases":["cercare risorse","scavenge"],"html":"<div class=\"move\"><p><strong>Quando la banda fruga in cerca di risorse nelle rovine profonde, uno tira tanti d6 quanto il livello attuale più le stanze sicure adiacenti.</strong> Non si somma: ogni vagabondo spende i dadi in base al valore del singolo dado:</p><ul><li><strong>1-2</strong>: recupera 1-consumo;</li><li><strong>3-4</strong>: recupera 1-consumo e 1-usura;</li><li><strong>5-6</strong>: svuota 2-consumo oppure trovi un oggetto da 3-Valore.</li></ul></div><p>Una sola volta per livello: per frugare ancora dovete scendere. Conviene esplorare e <a class=\"xl\" href=\"#accamparsi-rovine\" data-id=\"accamparsi-rovine\">accamparsi</a> prima. <em>(trad. non ufficiale)</em></p>","text":"Quando la banda fruga in cerca di risorse nelle rovine profonde, uno tira tanti d6 quanto il livello attuale più le stanze sicure adiacenti. Non si somma: ogni vagabondo spende i dadi in base al valore del singolo dado: - 1-2: recupera 1-consumo; - 3-4: recupera 1-consumo e 1-usura; - 5-6: svuota 2-consumo oppure trovi un oggetto da 3-Valore. Una sola volta per livello: per frugare ancora dovete scendere. Conviene esplorare e accamparsi prima. (trad. non ufficiale)","back":["rovine-indice","accamparsi-rovine"]},{"id":"accamparsi-rovine","title":"Accamparsi nelle Rovine","cat":"esplorazione","group":"","src":"RS p.107","aliases":["accamparsi nelle rovine","make camp"],"html":"<div class=\"move\"><p><strong>Quando la banda si accampa nelle rovine profonde, ognuno segna quanto consumo vuole e uno tira con +1 per ogni consumo segnato, più (max +4 in tutto):</strong></p><ul><li>+1 se c'è una risorsa utile vicina (acqua, cibo) per tutti;</li><li>+1 se c'è riparo o sicurezza (grotte, porte di pietra);</li><li>+1 se qualcuno rinuncia ai benefici per fare la guardia.</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica e sceglie 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica e sceglie 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: le provviste vanno sprecate e una minaccia irrompe: dite i turni di guardia e il GM dice chi la nota per primo.</li></ul><p>Opzioni:</p><ul><li>dormi davvero: svuota 1-fatica in più;</li><li>riparazioni di fortuna: svuota 1-usura;</li><li>mappi la zona: un dado in più a <a class=\"xl\" href=\"#cercare-risorse\" data-id=\"cercare-risorse\">Cercare Risorse</a> su questo livello.</li></ul></div><p><em>(trad. non ufficiale)</em></p>","text":"Quando la banda si accampa nelle rovine profonde, ognuno segna quanto consumo vuole e uno tira con +1 per ogni consumo segnato, più (max +4 in tutto): - +1 se c'è una risorsa utile vicina (acqua, cibo) per tutti; - +1 se c'è riparo o sicurezza (grotte, porte di pietra); - +1 se qualcuno rinuncia ai benefici per fare la guardia. Risultati: - 10+ (successo pieno): riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica e sceglie 2 opzioni. - 7-9 (successo parziale): riposate: ognuno (tranne chi fa la guardia) svuota 1-fatica e sceglie 1 opzione. - 6- (fallimento): le provviste vanno sprecate e una minaccia irrompe: dite i turni di guardia e il GM dice chi la nota per primo. Opzioni: - dormi davvero: svuota 1-fatica in più; - riparazioni di fortuna: svuota 1-usura; - mappi la zona: un dado in più a Cercare Risorse su questo livello. (trad. non ufficiale)","back":["rovine-indice","cercare-risorse"]},{"id":"ritirata","title":"Ritirarsi in Superficie","cat":"esplorazione","group":"","src":"RS p.108","aliases":["ritirarsi in superficie","ritirata","risalire"],"html":"<div class=\"move\"><p><strong>Quando vi ritirate dalle rovine verso la superficie, uno tira per la banda, con:</strong></p><ul><li>+1 se potete tracciare un percorso attraverso stanze sicure;</li><li>+1 se ognuno segna 1-fatica;</li><li>-1 se vi ritirate davanti a una minaccia attiva;</li><li>-2 se un membro è appesantito (oltre il proprio <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>).</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: risalite e uscite dove siete entrati.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: una minaccia blocca la via: affrontatela prima di uscire.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: siete intrappolati tra un ostacolo davanti e una minaccia che avanza alle spalle.</li></ul></div><p>Una volta fuori potrebbe servire <a class=\"xl\" href=\"#tornare-rovina\" data-id=\"tornare-rovina\">Tornare da una Rovina nella Foresta</a>. <em>(trad. non ufficiale)</em></p>","text":"Quando vi ritirate dalle rovine verso la superficie, uno tira per la banda, con: - +1 se potete tracciare un percorso attraverso stanze sicure; - +1 se ognuno segna 1-fatica; - -1 se vi ritirate davanti a una minaccia attiva; - -2 se un membro è appesantito (oltre il proprio Ingombro). Risultati: - 10+ (successo pieno): risalite e uscite dove siete entrati. - 7-9 (successo parziale): una minaccia blocca la via: affrontatela prima di uscire. - 6- (fallimento): siete intrappolati tra un ostacolo davanti e una minaccia che avanza alle spalle. Una volta fuori potrebbe servire Tornare da una Rovina nella Foresta. (trad. non ufficiale)","back":["ingombro","rovine-indice"]},{"id":"fazioni-indice","title":"Le Fazioni","cat":"indici","group":"","src":"B p.21-24, 226; VF p.9-22; RS p.6-14","aliases":["fazioni","fazione"],"html":"<p>Le fazioni con cui i vagabondi hanno una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a>:</p><ul><li><a class=\"xl\" href=\"#fazione-marchesato\" data-id=\"fazione-marchesato\">Il Marchesato</a></li><li><a class=\"xl\" href=\"#fazione-aquile\" data-id=\"fazione-aquile\">La Dinastia delle Aquile</a></li><li><a class=\"xl\" href=\"#fazione-alleanza\" data-id=\"fazione-alleanza\">L'Alleanza dei Boschi</a></li><li><a class=\"xl\" href=\"#fazione-lucertole\" data-id=\"fazione-lucertole\">La Setta delle Lucertole</a></li><li><a class=\"xl\" href=\"#fazione-abitanti\" data-id=\"fazione-abitanti\">Gli Abitanti</a></li></ul><p>Ogni fazione ha una <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mossa di reputazione</a> specifica.</p>","text":"Le fazioni con cui i vagabondi hanno una Reputazione: - Il Marchesato - La Dinastia delle Aquile - L'Alleanza dei Boschi - La Setta delle Lucertole - Gli Abitanti Ogni fazione ha una mossa di reputazione specifica.","back":[]},{"id":"fazione-marchesato","title":"Il Marchesato","cat":"fazioni","group":"","src":"B p.21","aliases":["Marchesato","Marchesa de Gattis","gatti"],"html":"<p>Fazione dei Boschi. I vagabondi hanno una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con questa fazione e possono usare le <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p><p>Mossa di reputazione specifica: <a class=\"xl\" href=\"#nuovo-progetto\" data-id=\"nuovo-progetto\">Pianificare un Nuovo Progetto (Marchesato)</a>.</p>","text":"Fazione dei Boschi. I vagabondi hanno una Reputazione con questa fazione e possono usare le mosse di reputazione. Mossa di reputazione specifica: Pianificare un Nuovo Progetto (Marchesato).","back":["fazioni-indice"]},{"id":"fazione-aquile","title":"La Dinastia delle Aquile","cat":"fazioni","group":"","src":"B p.21","aliases":["Dinastia delle Aquile","Aquile","Eyrie"],"html":"<p>Fazione dei Boschi. I vagabondi hanno una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con questa fazione e possono usare le <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p><p>Mossa di reputazione specifica: <a class=\"xl\" href=\"#burocrazia\" data-id=\"burocrazia\">Manovrare la Burocrazia (Aquile)</a>.</p>","text":"Fazione dei Boschi. I vagabondi hanno una Reputazione con questa fazione e possono usare le mosse di reputazione. Mossa di reputazione specifica: Manovrare la Burocrazia (Aquile).","back":["fazioni-indice"]},{"id":"fazione-alleanza","title":"L'Alleanza dei Boschi","cat":"fazioni","group":"","src":"B p.20-22","aliases":["Alleanza dei Boschi","Alleanza"],"html":"<p>Fazione dei Boschi. I vagabondi hanno una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con questa fazione e possono usare le <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p><p>Mossa di reputazione specifica: <a class=\"xl\" href=\"#rivolta-mossa\" data-id=\"rivolta-mossa\">Incitare alla Rivolta (Alleanza)</a>.</p>","text":"Fazione dei Boschi. I vagabondi hanno una Reputazione con questa fazione e possono usare le mosse di reputazione. Mossa di reputazione specifica: Incitare alla Rivolta (Alleanza).","back":["fazioni-indice"]},{"id":"fazione-abitanti","title":"Gli Abitanti","cat":"fazioni","group":"","src":"B p.22","aliases":["Abitanti","abitante","denizens"],"html":"<p>Gli abitanti comuni delle radure. I vagabondi hanno sempre una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con loro e possono usare le <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p><p>Mossa di reputazione specifica: <a class=\"xl\" href=\"#impressionare-pubblico\" data-id=\"impressionare-pubblico\">Impressionare il Pubblico</a>.</p>","text":"Gli abitanti comuni delle radure. I vagabondi hanno sempre una Reputazione con loro e possono usare le mosse di reputazione. Mossa di reputazione specifica: Impressionare il Pubblico.","back":["fazioni-indice"]},{"id":"fazione-lucertole","title":"La Setta delle Lucertole","cat":"fazioni","group":"","src":"VF p.12-15","aliases":["Setta delle Lucertole","Lizard Cult","cultisti"],"html":"<p>Fazione dei Boschi. I vagabondi hanno una <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione</a> con questa fazione e possono usare le <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p><p>Mossa di reputazione specifica: <a class=\"xl\" href=\"#predicare\" data-id=\"predicare\">Predicare ai Fedeli (Lucertole)</a>.</p>","text":"Fazione dei Boschi. I vagabondi hanno una Reputazione con questa fazione e possono usare le mosse di reputazione. Mossa di reputazione specifica: Predicare ai Fedeli (Lucertole).","back":["fazioni-indice"]},{"id":"pescare","title":"Pescare (regola della casa)","cat":"opzionali","group":"","src":"HR","aliases":["Pescare","pesca","Pescato"],"html":"<p>Regola della casa del vostro gruppo, costruita sul consumo (1 Pescato = svuota 1-consumo oppure circa 1-Valore in cibo o merce).</p><p><strong>Durata → Pescato potenziale</strong> (come la raccolta di <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">consumo</a>):</p><ul><li>poche ore: 1;</li><li>1-2 giorni: 2;</li><li>un paio di giorni: 3;</li><li>una settimana: 4.</li></ul><div class=\"move\"><p><strong>Quando dedichi tempo a pescare in una radura o lungo un corso d'acqua, dichiara durata e metodo, poi tira 2d6 + la caratteristica del metodo:</strong></p><ul><li>canna, lenza ed esche: <strong>Destrezza</strong>;</li><li>nasse, trappole o reti: <strong>Astuzia</strong>;</li><li>arpione o
