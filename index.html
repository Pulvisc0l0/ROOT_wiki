<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki delle Regole di Root</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* GIORNO: pergamena beige chiaro, inchiostro seppia, verde bosco, ambra. */
  --paper:#f6f0e3; --panel:#ece3cf; --ink:#2b2419; --muted:#6b5f4c; --line:#d8cbb0;
  --forest:#2f5d3a; --link:#2f5d3a; --brand:#2f5d3a; --ok:#2f6b3d; --amber:#985a0b; --rust:#9b3524; --card:#fcf9f2;
  --shadow:rgba(60,40,10,.16);
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --serif:"IM Fell English",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
/* NOTTE: palette della modalità notte di Wikipedia (fondo #101418, testo #eaecf0, link azzurri #88a3e8). */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101418; --panel:#1a1d21; --ink:#eaecf0; --muted:#a2a9b1; --line:#3a3f45;
    --forest:#88a3e8; --link:#88a3e8; --brand:#eaecf0; --ok:#5ec48f; --amber:#e3ad4f; --rust:#fd7865; --card:#181b1f;
    --shadow:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101418; --panel:#1a1d21; --ink:#eaecf0; --muted:#a2a9b1; --line:#3a3f45;
  --forest:#88a3e8; --link:#88a3e8; --brand:#eaecf0; --ok:#5ec48f; --amber:#e3ad4f; --rust:#fd7865; --card:#181b1f;
  --shadow:rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{transition:background-color .2s,color .2s;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;display:flex;flex-direction:column}
a{color:var(--forest)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.45rem;color:var(--brand);text-decoration:none;white-space:nowrap;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
#menuBtn{display:none}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
button,.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover{border-color:var(--forest)}
.dice{display:flex;gap:6px;align-items:center}
.dice select{font:inherit;font-size:.9rem;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
#rollOut{min-width:118px;font-variant-numeric:tabular-nums;font-size:.92rem}
#rollOut b{font-size:1.1rem}
.r-hit{color:var(--ok)} .r-mid{color:var(--amber)} .r-miss{color:var(--rust)}
.wrap{flex:1;display:flex;min-height:0}
nav{width:300px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:10px 0 40px;background:var(--panel)}
nav details{border-bottom:1px solid var(--line)}
nav summary{cursor:pointer;padding:8px 16px;font-family:var(--serif);font-size:1.08rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
nav summary::-webkit-details-marker{display:none}
nav summary .n{font-family:var(--body);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
nav ul{list-style:none;margin:0;padding:0 0 8px}
nav li a{display:block;padding:3px 16px 3px 26px;text-decoration:none;color:var(--ink);font-size:.93rem}
nav li a:hover{background:var(--card)}
nav li a.on{background:var(--card);color:var(--forest);font-weight:700;box-shadow:inset 3px 0 0 var(--forest)}
nav .grp{padding:6px 16px 2px 20px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber)}
main{flex:1;overflow-y:auto;padding:24px 28px 80px}
article{max-width:46rem}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;background:var(--card);font-size:.78rem;color:var(--muted);text-decoration:none}
.chip.src{border-color:var(--amber);color:var(--amber)}
h1{font-family:var(--display);font-weight:400;font-size:2.15rem;line-height:1.1;margin:.1em 0 .35em;text-wrap:balance;color:var(--ink)}
h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:1.6em 0 .4em;text-wrap:balance}
.star{float:right;margin-left:10px}
.star[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
article p{margin:.55em 0}
article ul,article ol{margin:.4em 0 .7em;padding-left:1.35em}
article li{margin:.18em 0}
.move{border-left:4px solid var(--forest);background:var(--card);padding:10px 16px;margin:12px 0;border-radius:0 6px 6px 0}
.move p:first-child{margin-top:0}
.res{font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.93rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{font-family:var(--serif);font-weight:400;font-size:1rem;background:var(--panel)}
a.xl,a.wl{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--forest) 45%,transparent)}
a.wl{border-bottom-style:dotted}
a.xl:hover,a.wl:hover{background:color-mix(in srgb,var(--forest) 12%,transparent)}
.back{margin-top:2.2em;padding-top:12px;border-top:1px solid var(--line);font-size:.92rem;color:var(--muted)}
.back a{margin-right:4px}
.back .list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#pop{position:fixed;z-index:20;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 13px;box-shadow:0 8px 26px var(--shadow);font-size:.9rem;pointer-events:none;display:none}
#pop b{font-family:var(--serif);font-weight:400;font-size:1.08rem;display:block;margin-bottom:2px}
#pop .c{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber)}
.home h1{font-size:2.5rem}
.lede{font-size:1.08rem;color:var(--muted);max-width:40rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:18px 0 26px}
.tile{display:flex;flex-direction:column;gap:3px;padding:13px 15px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-decoration:none;color:var(--ink)}
.tile:hover{border-color:var(--forest)}
.tile b{font-family:var(--serif);font-weight:400;font-size:1.2rem;color:var(--forest)}
.tile span{font-size:.86rem;color:var(--muted)}
.legend{font-size:.9rem;color:var(--muted)}
.results .r{padding:10px 0;border-bottom:1px solid var(--line)}
.results .r a{font-family:var(--serif);font-size:1.15rem}
.results .r div{font-size:.88rem;color:var(--muted)}
mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;padding:0 1px}
.note{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);padding:8px 12px;border-radius:6px}
#scrim,#sheet{display:none}
.btn.pri{background:var(--forest);border-color:var(--forest);color:var(--paper);text-decoration:none;font-weight:700}
@media (max-width:860px){
  body{font-size:16.5px}
  header{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;padding:8px 12px calc(8px);position:sticky;top:0;z-index:25;
    padding-top:max(8px,env(safe-area-inset-top))}
  #menuBtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;font-size:1.1rem}
  #menuBtn .tl{font-size:.92rem}
  .brand{font-size:1.3rem;justify-self:start;align-self:center}
  .brand small{font-size:.62rem}
  #themeBtn{min-height:42px;min-width:42px;justify-content:center;grid-column:3;grid-row:1}
  #themeBtn .tl{display:none}
  .search{grid-column:1 / -1;min-width:0}
  .search input{padding:11px 12px 11px 36px;font-size:16px}
  /* barra dadi fissa in basso, a portata di pollice */
  .dice{position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--panel);border-top:1px solid var(--line);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -4px 16px var(--shadow)}
  .dice label{font-size:.85rem}
  .dice select{min-height:42px;font-size:16px}
  #rollBtn{min-height:42px;padding:0 18px;font-weight:700}
  #rollOut{flex:1;min-width:0;font-size:.88rem;line-height:1.25}
  nav{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:40;transform:translateX(-102%);transition:transform .22s;box-shadow:4px 0 24px var(--shadow);
    padding-top:max(10px,env(safe-area-inset-top));padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  nav.open{transform:none}
  nav summary{padding:12px 16px}
  nav li a{padding:9px 16px 9px 28px;font-size:1rem}
  #scrim{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.4)}
  #scrim[hidden]{display:none}
  main{padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
  h1{font-size:1.85rem;clear:both}
  .star{float:none;display:inline-flex;margin:0 0 8px}
  .home h1{font-size:2rem}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{padding:11px 12px}
  .tile b{font-size:1.08rem}
  .move{padding:10px 12px;margin:12px -4px}
  article ul,article ol{padding-left:1.15em}
  table{font-size:.86rem}
  th,td{padding:6px 8px}
  .crumbs{gap:6px}
  a.xl,a.wl{padding:1px 0}
  /* scheda di anteprima al tocco */
  #sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--card);border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;padding:8px 18px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px var(--shadow);
    max-height:62vh;overflow-y:auto;transition:transform .2s}
  #sheet[hidden]{display:block;transform:translateY(105%);visibility:hidden}
  #sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
  #sheet .c{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);display:block}
  #sheet b{font-family:var(--serif);font-weight:400;font-size:1.4rem;display:block;margin:2px 0 6px}
  #shX{font-size:.95rem;color:var(--ink)}
  #sheet .acts{display:flex;gap:10px;margin-top:14px}
  #sheet .acts>*{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center}
  #pop{display:none!important}
}
@media (max-width:380px){.tiles{grid-template-columns:1fr}.dice label{display:none}}
#themeBtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#themeBtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
:root[data-theme="dark"] .move{box-shadow:inset 0 0 0 1px var(--line)}
@media (prefers-reduced-motion:reduce){nav,body,#sheet{transition:none}}
</style>
</head>
<body>
<header>
  <button id="menuBtn" aria-label="Apri l'indice" aria-expanded="false">☰ <span class="tl">Indice</span></button>
  <a class="brand" href="#" id="home">Root · Il GdR<small>Wiki delle regole</small></a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Cerca una regola, una mossa, un mostro… (premi /)" autocomplete="off" aria-label="Cerca">
  </div>
  <div class="dice">
    <label for="mod" class="legend">Tira 2d6</label>
    <select id="mod" aria-label="Modificatore">
      <option value="-2">-2</option><option value="-1">-1</option><option value="0" selected>+0</option><option value="1">+1</option><option value="2">+2</option><option value="3">+3</option><option value="4">+4</option>
    </select>
    <button id="rollBtn">Tira</button>
    <span id="rollOut" aria-live="polite"></span>
  </div>
  <button id="themeBtn" type="button" aria-label="Cambia tema"></button>
</header>
<div class="wrap">
  <nav id="nav" aria-label="Indice delle voci"></nav>
  <main id="main"><article id="art"></article></main>
</div>
<div id="pop" role="tooltip"></div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-modal="false" aria-label="Anteprima" hidden>
  <div class="grab"></div>
  <span class="c" id="shC"></span><b id="shT"></b>
  <div id="shX"></div>
  <div class="acts"><button type="button" id="shClose">Chiudi</button><a class="btn pri" id="shGo" href="#">Apri la voce →</a></div>
</div>
<script>
(function(){
  const root=document.documentElement, btn=document.getElementById('themeBtn');
  const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  let t=null; try{t=localStorage.getItem('rootwiki-theme')}catch(_){}
  if(t!=='light'&&t!=='dark') t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  function apply(){root.dataset.theme=t; const night=t==='dark';
    btn.innerHTML=(night?SUN+'<span class="tl">Giorno</span>':MOON+'<span class="tl">Notte</span>'); btn.setAttribute('aria-label',night?'Passa al tema giorno':'Passa al tema notte'); btn.title=btn.getAttribute('aria-label');}
  apply();
  btn.addEventListener('click',()=>{t=t==='dark'?'light':'dark'; try{localStorage.setItem('rootwiki-theme',t)}catch(_){} apply();});
})();
const DATA=[{"id":"conversazione","title":"La Conversazione","cat":"regole","group":"","src":"B p.26-34","aliases":["conversazione","narrazione","finzione"],"html":"<p>Root: Il GdR è una <strong>conversazione</strong> tra giocatori e GM: ognuno descrive cosa fa il proprio personaggio, il GM descrive il mondo e i PNG. Le regole entrano in gioco solo quando un personaggio fa qualcosa che <strong>innesca una mossa</strong>, cioè quando nessuno sa cosa succederà.</p><ul><li>Tutto ciò che è stabilito nella partita è la <strong>narrazione</strong> condivisa: ciò che ha senso nella narrazione è possibile (un uccello vola, una volpe no).</li><li>Se non c'è una mossa che risolva l'incertezza, la situazione non è incerta: decide il GM in base ad agenda, principi e mosse.</li><li>Il GM <strong>non tira mai i dadi</strong> per risolvere le azioni: tirano sempre i giocatori.</li><li>Se GM e giocatori hanno idee diverse sulla narrazione (stai mentendo o dicendo la verità?), fermatevi e chiaritelo.</li></ul><p>Vedi anche: <a class=\"xl\" href=\"#mosse\" data-id=\"mosse\">Le Mosse</a>, <a class=\"xl\" href=\"#tiro\" data-id=\"tiro\">Tirare i Dadi e Risultati</a>, <a class=\"xl\" href=\"#agenda-gm\" data-id=\"agenda-gm\">Agenda del GM</a>.</p>","text":"Root: Il GdR è una conversazione tra giocatori e GM: ognuno descrive cosa fa il proprio personaggio, il GM descrive il mondo e i PNG. Le regole entrano in gioco solo quando un personaggio fa qualcosa che innesca una mossa, cioè quando nessuno sa cosa succederà. - Tutto ciò che è stabilito nella partita è la narrazione condivisa: ciò che ha senso nella narrazione è possibile (un uccello vola, una volpe no). - Se non c'è una mossa che risolva l'incertezza, la situazione non è incerta: decide il GM in base ad agenda, principi e mosse. - Il GM non tira mai i dadi per risolvere le azioni: tirano sempre i giocatori. - Se GM e giocatori hanno idee diverse sulla narrazione (stai mentendo o dicendo la verità?), fermatevi e chiaritelo. Vedi anche: Le Mosse, Tirare i Dadi e Risultati, Agenda del GM.","back":[]},{"id":"mosse","title":"Le Mosse","cat":"regole","group":"","src":"B p.29, 64-67","aliases":["mossa","mosse","innesco","innescare"],"html":"<p>Una <strong>mossa</strong> è un blocco di regole con un <strong>innesco</strong> (\"Quando fai X...\") e un <strong>risultato</strong>. Principio chiave: <strong>per farlo, devi farlo</strong>. Se il tuo personaggio fa ciò che descrive l'innesco, la mossa scatta e se ne applica il risultato, senza eccezioni; se non lo fa, la mossa non scatta.</p><p>Tipi di mosse:</p><ul><li><a class=\"xl\" href=\"#mosse-base-indice\" data-id=\"mosse-base-indice\">Mosse base</a>: usabili da tutti in quasi ogni scena.</li><li><a class=\"xl\" href=\"#mosse-armi-indice\" data-id=\"mosse-armi-indice\">Mosse con le armi</a>: solo nel combattimento fisico (3 base + abilità con le armi).</li><li><a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">Mosse di reputazione</a>: legate alla Reputazione con le fazioni.</li><li><a class=\"xl\" href=\"#viaggio-indice\" data-id=\"viaggio-indice\">Mosse di viaggio</a>: quando la banda si sposta tra le radure.</li><li><a class=\"xl\" href=\"#fine-sessione\" data-id=\"fine-sessione\">Mosse di fine sessione</a>.</li><li>Mosse dei playbook, mosse del GM e mosse personalizzate.</li></ul><p>Il GM decide se una mossa è stata innescata. Le mosse non limitano ciò che puoi fare: servono solo a risolvere l'incertezza.</p>","text":"Una mossa è un blocco di regole con un innesco (\"Quando fai X...\") e un risultato. Principio chiave: per farlo, devi farlo. Se il tuo personaggio fa ciò che descrive l'innesco, la mossa scatta e se ne applica il risultato, senza eccezioni; se non lo fa, la mossa non scatta. Tipi di mosse: - Mosse base: usabili da tutti in quasi ogni scena. - Mosse con le armi: solo nel combattimento fisico (3 base + abilità con le armi). - Mosse di reputazione: legate alla Reputazione con le fazioni. - Mosse di viaggio: quando la banda si sposta tra le radure. - Mosse di fine sessione. - Mosse dei playbook, mosse del GM e mosse personalizzate. Il GM decide se una mossa è stata innescata. Le mosse non limitano ciò che puoi fare: servono solo a risolvere l'incertezza.","back":["conversazione"]},{"id":"tiro","title":"Tirare i Dadi e Risultati","cat":"regole","group":"","src":"B p.31-32","aliases":["2d6","tirare su","tiro","successo pieno","successo parziale","fallimento"],"html":"<p>Quando una mossa lo richiede, tira <strong>2d6</strong> e somma la caratteristica indicata (\"tira su Carisma\").</p><ul><li><strong><span class=\"res\">10+</span> — successo pieno</strong>: ottieni quasi tutto ciò che volevi, a volte con benefici extra.</li><li><strong><span class=\"res\">7-9</span> — successo parziale</strong>: ottieni l'obiettivo principale, ma con un prezzo o una complicazione.</li><li><strong><span class=\"res\">6 o meno</span> — fallimento</strong>: il GM dice cosa succede e fa una delle sue <a class=\"xl\" href=\"#mosse-gm\" data-id=\"mosse-gm\">mosse</a>. Un fallimento non è solo una sconfitta: è un'occasione per complicare la storia.</li><li><strong><span class=\"res\">12+</span> — trionfo</strong>: solo per le mosse in cui hai una <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">maestria</a> (o mosse che lo prevedono).</li></ul><p>Il bonus massimo da Reputazione combinata è +4; molte mosse dicono \"prendi <span class=\"res\">10+</span> invece di tirare\" o \"trasforma un fallimento in <span class=\"res\">7-9</span>\".</p>","text":"Quando una mossa lo richiede, tira 2d6 e somma la caratteristica indicata (\"tira su Carisma\"). - 10+ — successo pieno: ottieni quasi tutto ciò che volevi, a volte con benefici extra. - 7-9 — successo parziale: ottieni l'obiettivo principale, ma con un prezzo o una complicazione. - 6 o meno — fallimento: il GM dice cosa succede e fa una delle sue mosse. Un fallimento non è solo una sconfitta: è un'occasione per complicare la storia. - 12+ — trionfo: solo per le mosse in cui hai una maestria (o mosse che lo prevedono). Il bonus massimo da Reputazione combinata è +4; molte mosse dicono \"prendi 10+ invece di tirare\" o \"trasforma un fallimento in 7-9\".","back":["conversazione"]},{"id":"astuzia","title":"Astuzia","cat":"regole","group":"","src":"B p.48","aliases":["Astuzia"],"html":"<p>Caratteristica che rappresenta furbizia, spirito d'osservazione e intelligenza. Si usa per <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>, <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a> una situazione tesa e per <a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">improvvisare un'arma</a> e <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">incalzare un gruppo</a>. Vedi <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>.</p>","text":"Caratteristica che rappresenta furbizia, spirito d'osservazione e intelligenza. Si usa per Ingannare un PNG, Valutare una Situazione Tesa una situazione tesa e per improvvisare un'arma e incalzare un gruppo. Vedi Caratteristiche.","back":["caratteristiche","ingannare","valutare","improvvisare-arma","incalzare-gruppo","tiro-preciso"]},{"id":"carisma","title":"Carisma","cat":"regole","group":"","src":"B p.48","aliases":["Carisma"],"html":"<p>Caratteristica che rappresenta l'abilità nel dialogo e nell'interazione sociale. Si usa per <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a> e <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>. Vedi <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>.</p>","text":"Caratteristica che rappresenta l'abilità nel dialogo e nell'interazione sociale. Si usa per Capire le Intenzioni e Convincere un PNG. Vedi Caratteristiche.","back":["caratteristiche","capire-intenzioni","convincere","svolazzo-terrificante"]},{"id":"destrezza","title":"Destrezza","cat":"regole","group":"","src":"B p.48","aliases":["Destrezza"],"html":"<p>Caratteristica di manualità e coordinazione. Si usa per <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'Impresa da Furfante</a>, <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a> e molte abilità con le armi di precisione. Vedi <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>.</p>","text":"Caratteristica di manualità e coordinazione. Si usa per Tentare un'Impresa da Furfante, Prendere la Mira e molte abilità con le armi di precisione. Vedi Caratteristiche.","back":["caratteristiche","tentare-impresa","prendere-mira","confondere-sensi","disarmare","parare","tiro-maestro","affondo","zampe-martello","cambiare-mano","spazzata","stoccata-sorpresa"]},{"id":"fortuna","title":"Fortuna","cat":"regole","group":"","src":"B p.48","aliases":["Fortuna"],"html":"<p>Caratteristica di forza di volontà, spirito di sopravvivenza e buona sorte. Si usa per <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a> e <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a>. Vedi <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>.</p>","text":"Caratteristica di forza di volontà, spirito di sopravvivenza e buona sorte. Si usa per Affidarsi al Fato e Tiro Rapido. Vedi Caratteristiche.","back":["caratteristiche","affidarsi-fato","tiro-rapido","furia-battaglia","tiro-bruciapelo","colpo-pomo"]},{"id":"vigore","title":"Vigore","cat":"regole","group":"","src":"B p.48","aliases":["Vigore"],"html":"<p>Caratteristica di pura forza fisica. Si usa per <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a>, <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>, <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a> e abilità come <a class=\"xl\" href=\"#fracassare\" data-id=\"fracassare\">Fracassare</a> e <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>. Modifica l'<a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a> (+1 Vigore = 5 Ingombro, -1 = 3). Vedi <a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>.</p>","text":"Caratteristica di pura forza fisica. Si usa per Distruggere Qualcosa, Attaccare in Mischia, Lottare con un Nemico e abilità come Fracassare e Assaltare un Gruppo. Modifica l'Ingombro (+1 Vigore = 5 Ingombro, -1 = 3). Vedi Caratteristiche.","back":["caratteristiche","distruggere","attaccare-mischia","lottare","assaltare-gruppo","colpo-crudele","fracassare","carica","scagliare","tiro-lungo"]},{"id":"caratteristiche","title":"Caratteristiche","cat":"regole","group":"","src":"B p.48","aliases":["caratteristica","statistiche"],"html":"<p>Ogni vagabondo ha cinque caratteristiche: <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>, <a class=\"xl\" href=\"#carisma\" data-id=\"carisma\">Carisma</a>, <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>, <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a> e <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</p><ul><li>Il playbook dà valori iniziali; alla creazione aggiungi +1 a una caratteristica (max +2).</li><li>+1 è il valore medio di un vagabondo (già sopra l'abitante medio). Sotto 0 rischi davvero; sopra +1 di solito controlli la situazione.</li><li>Con l'<a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a> arrivi al massimo a +2; solo alcune mosse dei playbook (es. Erudito, Bruto, Arciladro) portano a <strong>+3</strong>.</li></ul>","text":"Ogni vagabondo ha cinque caratteristiche: Astuzia, Carisma, Destrezza, Fortuna e Vigore. - Il playbook dà valori iniziali; alla creazione aggiungi +1 a una caratteristica (max +2). - +1 è il valore medio di un vagabondo (già sopra l'abitante medio). Sotto 0 rischi davvero; sopra +1 di solito controlli la situazione. - Con l'Avanzamento arrivi al massimo a +2; solo alcune mosse dei playbook (es. Erudito, Bruto, Arciladro) portano a +3.","back":["astuzia","carisma","destrezza","fortuna","vigore","creazione","avanzamento"]},{"id":"prese","title":"Prese, +1 al Prossimo Tiro, +1 Continuo","cat":"regole","group":"","src":"B p.67","aliases":["presa","prese","+1 al prossimo tiro","+1 continuo","continuo"],"html":"<p>Termini tecnici dei risultati:</p><ul><li><strong>Prese</strong>: risorsa che tieni finché non la spendi come indica la mossa (es. domande di <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a>). Di solito durano finché la scena non cambia in modo significativo.</li><li><strong>+1 al prossimo tiro</strong>: aggiungi +1 al tuo prossimo tiro (eventualmente solo contro un certo bersaglio).</li><li><strong>+1 continuo</strong>: +1 a tutti i tiri che soddisfano la condizione, finché la mossa o il cambio di scena (deciso dal GM) non lo termina.</li></ul>","text":"Termini tecnici dei risultati: - Prese: risorsa che tieni finché non la spendi come indica la mossa (es. domande di Capire le Intenzioni). Di solito durano finché la scena non cambia in modo significativo. - +1 al prossimo tiro: aggiungi +1 al tuo prossimo tiro (eventualmente solo contro un certo bersaglio). - +1 continuo: +1 a tutti i tiri che soddisfano la condizione, finché la mossa o il cambio di scena (deciso dal GM) non lo termina.","back":["capire-intenzioni"]},{"id":"flashback","title":"Flashback","cat":"regole","group":"","src":"B p.83","aliases":["flashback"],"html":"<p>Puoi usare una mossa in un <strong>flashback</strong> per mostrare una preparazione fatta in passato (es. <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> dei documenti prima di servirtene). Deve avere senso nella narrazione (tempo e conoscenze sufficienti) e costa risorse decise dal GM, di solito <strong>1-2 fatica o consumo</strong>. La mossa si risolve nel presente.</p>","text":"Puoi usare una mossa in un flashback per mostrare una preparazione fatta in passato (es. Falsificare dei documenti prima di servirtene). Deve avere senso nella narrazione (tempo e conoscenze sufficienti) e costa risorse decise dal GM, di solito 1-2 fatica o consumo. La mossa si risolve nel presente.","back":["tentare-impresa","falsificare","mente-criminale"]},{"id":"specie","title":"Specie","cat":"regole","group":"","src":"B p.43-44","aliases":["specie"],"html":"<p>Puoi scegliere qualsiasi animale non più grande di un vero lupo e non esclusivamente acquatico. Le specie più comuni sono uccelli, volpi, topi e conigli.</p><ul><li>Le specie non danno poteri speciali: le loro capacità naturali (volare, scavare, fiutare) rientrano nelle mosse esistenti quando c'è incertezza.</li><li>La specie ha ripercussioni sociali: un uccello viene associato alla Dinastia delle Aquile, un gatto al Marchesato; conigli, volpi e topi sono visti come comuni abitanti; lucertole, lupi e altri animali estranei suscitano sospetto.</li><li><em>Viandanti e Forestieri</em> introduce mosse di specie opzionali (vedi <a class=\"xl\" href=\"#mosse-specie\" data-id=\"mosse-specie\">Mosse di Specie (opzionali)</a>).</li></ul>","text":"Puoi scegliere qualsiasi animale non più grande di un vero lupo e non esclusivamente acquatico. Le specie più comuni sono uccelli, volpi, topi e conigli. - Le specie non danno poteri speciali: le loro capacità naturali (volare, scavare, fiutare) rientrano nelle mosse esistenti quando c'è incertezza. - La specie ha ripercussioni sociali: un uccello viene associato alla Dinastia delle Aquile, un gatto al Marchesato; conigli, volpi e topi sono visti come comuni abitanti; lucertole, lupi e altri animali estranei suscitano sospetto. - Viandanti e Forestieri introduce mosse di specie opzionali (vedi Mosse di Specie (opzionali)).","back":["creazione"]},{"id":"mosse-specie","title":"Mosse di Specie (opzionali)","cat":"opzionali","group":"","src":"VF p.58-68; RS p.45-49","aliases":["mosse di specie","abilità di specie"],"html":"<p>Regola opzionale dei supplementi: ogni specie ha 3 abilità attivabili segnando fatica e una <strong>mossa d'istinto</strong> che una volta per sessione svuota fatica. In alternativa le mosse di specie si possono prendere come mosse del playbook.</p><p>Esempi (VF):</p><ul><li><strong>Corvide</strong>: fiutare provviste nascoste; arraffare un oggetto luccicante; volare via nella notte. Istinto: usare un attrezzo in modo sorprendente.</li><li><strong>Piccolo uccello</strong>: volare ovunque nella radura in pochi istanti; trovare il nascondiglio perfetto; <span class=\"res\">12+</span> su acrobazie se porti ≤2 Ingombro. Istinto: seminare attenzioni indesiderate.</li><li><strong>Talpa</strong>: scavare ed emergere altrove; percepire vibrazioni di abitanti vicini; +1 a viaggiare nella foresta. Istinto: maneggiare un oggetto mai toccato e piacevole al tatto.</li></ul><p><em>Rovine e Spedizioni</em> aggiunge mosse come Lingua Schioccante (gatto, topo, piccolo uccello), Raggomitolarsi (riccio, tartaruga), Progettare (castoro, corvide). Consulta i supplementi per l'elenco completo.</p>","text":"Regola opzionale dei supplementi: ogni specie ha 3 abilità attivabili segnando fatica e una mossa d'istinto che una volta per sessione svuota fatica. In alternativa le mosse di specie si possono prendere come mosse del playbook. Esempi (VF): - Corvide: fiutare provviste nascoste; arraffare un oggetto luccicante; volare via nella notte. Istinto: usare un attrezzo in modo sorprendente. - Piccolo uccello: volare ovunque nella radura in pochi istanti; trovare il nascondiglio perfetto; 12+ su acrobazie se porti ≤2 Ingombro. Istinto: seminare attenzioni indesiderate. - Talpa: scavare ed emergere altrove; percepire vibrazioni di abitanti vicini; +1 a viaggiare nella foresta. Istinto: maneggiare un oggetto mai toccato e piacevole al tatto. Rovine e Spedizioni aggiunge mosse come Lingua Schioccante (gatto, topo, piccolo uccello), Raggomitolarsi (riccio, tartaruga), Progettare (castoro, corvide). Consulta i supplementi per l'elenco completo.","back":["specie"]},{"id":"natura","title":"Natura","cat":"regole","group":"","src":"B p.49","aliases":["natura","nature"],"html":"<p>La <strong>natura</strong> è il tratto più profondo della personalità del vagabondo e indica <strong>come svuota l'intero tracciato della <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a></strong>: quando agisci secondo la tua natura, svuoti tutta la fatica. Ogni playbook offre due nature; scegline una che ti interessi seguire. Puoi cambiarla con la <a class=\"xl\" href=\"#fine-sessione\" data-id=\"fine-sessione\">mossa di fine sessione</a>.</p><p>Elenco completo: <a class=\"xl\" href=\"#nature-indice\" data-id=\"nature-indice\">Elenco delle Nature</a>.</p>","text":"La natura è il tratto più profondo della personalità del vagabondo e indica come svuota l'intero tracciato della Fatica: quando agisci secondo la tua natura, svuoti tutta la fatica. Ogni playbook offre due nature; scegline una che ti interessi seguire. Puoi cambiarla con la mossa di fine sessione. Elenco completo: Elenco delle Nature.","back":["creazione","fatica","nature-indice","legame-familiare"]},{"id":"motivazione","title":"Motivazioni","cat":"regole","group":"","src":"B p.49-50, 170-174","aliases":["motivazione","motivazioni"],"html":"<p>Le <strong>motivazioni</strong> sono i desideri costanti del vagabondo. Ne hai <strong>due</strong>; quando soddisfi la condizione di una motivazione <strong>avanzi</strong> (vedi <a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a>). Puoi avanzare con ciascuna motivazione <strong>una sola volta per sessione</strong> (quindi max 2 avanzamenti a sessione). Di solito è il giocatore ad annunciarlo; il GM ha l'ultima parola.</p><p>Elenco completo: <a class=\"xl\" href=\"#motivazioni-indice\" data-id=\"motivazioni-indice\">Elenco delle Motivazioni</a>.</p>","text":"Le motivazioni sono i desideri costanti del vagabondo. Ne hai due; quando soddisfi la condizione di una motivazione avanzi (vedi Avanzamento). Puoi avanzare con ciascuna motivazione una sola volta per sessione (quindi max 2 avanzamenti a sessione). Di solito è il giocatore ad annunciarlo; il GM ha l'ultima parola. Elenco completo: Elenco delle Motivazioni.","back":["creazione","fine-sessione","avanzamento","tempo-passa","motivazioni-indice"]},{"id":"legame","title":"Legami","cat":"regole","group":"","src":"B p.50-52","aliases":["legame","legami"],"html":"<p>I <strong>legami</strong> definiscono le relazioni con gli altri PG della banda. Ogni playbook ha due legami: ciascuno ha una categoria, una frase con uno spazio da riempire col nome di un PG (mai un PNG) e un effetto meccanico, valido solo per te salvo diversa indicazione.</p><p>Si compilano per ultimi, a giro, dopo le presentazioni. Non puoi scrivere lo stesso PG in entrambi i legami. Con l'avanzamento puoi prendere fino a 6 legami.</p><p>Effetti: <a class=\"xl\" href=\"#legami-indice\" data-id=\"legami-indice\">Elenco dei Legami</a>.</p>","text":"I legami definiscono le relazioni con gli altri PG della banda. Ogni playbook ha due legami: ciascuno ha una categoria, una frase con uno spazio da riempire col nome di un PG (mai un PNG) e un effetto meccanico, valido solo per te salvo diversa indicazione. Si compilano per ultimi, a giro, dopo le presentazioni. Non puoi scrivere lo stesso PG in entrambi i legami. Con l'avanzamento puoi prendere fino a 6 legami. Effetti: Elenco dei Legami.","back":["creazione","avanzamento","legami-indice"]},{"id":"creazione","title":"Creare un Vagabondo","cat":"regole","group":"","src":"B p.41-62","aliases":["creazione del personaggio","creare un vagabondo"],"html":"<p>Passi della creazione:</p><ol><li>Scegli un <a class=\"xl\" href=\"#playbook-indice\" data-id=\"playbook-indice\">playbook</a> (ognuno diverso dagli altri giocatori).</li><li>Nome, <a class=\"xl\" href=\"#specie\" data-id=\"specie\">Specie</a>, dettagli e atteggiamento.</li><li>Domande sul passato: luogo che chiami casa, perché sei un vagabondo, chi ti sei lasciato alle spalle; la fazione servita più spesso (<strong>2-prestigio</strong>) e quella da cui hai guadagnato inimicizia (<strong>1-nomea</strong>).</li><li><a class=\"xl\" href=\"#caratteristiche\" data-id=\"caratteristiche\">Caratteristiche</a>: +1 a scelta (max +2).</li><li><a class=\"xl\" href=\"#natura\" data-id=\"natura\">Natura</a> (1) e <a class=\"xl\" href=\"#motivazione\" data-id=\"motivazione\">motivazioni</a> (2).</li><li>Tre mosse del playbook (salvo indicazioni diverse).</li><li>Tracciati dei danni: 4 caselle di <a class=\"xl\" href=\"#consumo\" data-id=\"consumo\">Consumo</a>, <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a> e <a class=\"xl\" href=\"#ferite\" data-id=\"ferite\">Ferite</a>.</li><li><a class=\"xl\" href=\"#imprese-indice\" data-id=\"imprese-indice\">Imprese da furfante</a> e un'<a class=\"xl\" href=\"#abilita-armi\" data-id=\"abilita-armi\">abilità con le armi</a> iniziale tra quelle in grassetto.</li><li><a class=\"xl\" href=\"#equipaggiamento\" data-id=\"equipaggiamento\">Equipaggiamento</a> con il Valore iniziale, rispettando l'<a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>.</li><li><a class=\"xl\" href=\"#legame\" data-id=\"legame\">Legami</a> a giro.</li><li><a class=\"xl\" href=\"#imprese-banda\" data-id=\"imprese-banda\">Imprese della banda</a>.</li></ol>","text":"Passi della creazione: 1. Scegli un playbook (ognuno diverso dagli altri giocatori). 2. Nome, Specie, dettagli e atteggiamento. 3. Domande sul passato: luogo che chiami casa, perché sei un vagabondo, chi ti sei lasciato alle spalle; la fazione servita più spesso (2-prestigio) e quella da cui hai guadagnato inimicizia (1-nomea). 4. Caratteristiche: +1 a scelta (max +2). 5. Natura (1) e motivazioni (2). 6. Tre mosse del playbook (salvo indicazioni diverse). 7. Tracciati dei danni: 4 caselle di Consumo, Fatica e Ferite. 8. Imprese da furfante e un'abilità con le armi iniziale tra quelle in grassetto. 9. Equipaggiamento con il Valore iniziale, rispettando l'Ingombro. 10. Legami a giro. 11. Imprese della banda.","back":[]},{"id":"imprese-banda","title":"Le Audaci Imprese della Banda","cat":"regole","group":"","src":"B p.61-62","aliases":["imprese della banda"],"html":"<p>Ultimo passo della creazione: tirate <strong>1d6</strong> per l'impresa che la banda ha già compiuto insieme.</p><ol><li><strong>Nuovo sentiero</strong>: disegnatelo; tutti segnano prestigio e nomea con le fazioni collegate; +1 quando lo usate.</li><li><strong>Distrutto un sentiero</strong>: segnatelo (non isolate una radura); prestigio e nomea con le fazioni collegate; +1 quando attraversate la foresta lì.</li><li><strong>Cambiato il potere di una radura</strong>: 3-prestigio con la nuova fazione dominante, 3-nomea con quella spodestata.</li><li><strong>Difesa una radura</strong>: 3-prestigio con chi difendeva, 3-nomea con l'attaccante; freccia tratteggiata sulla mappa (ostilità aperte).</li><li><strong>Esplorate preziose rovine</strong>: aggiungetele alla mappa; se condivise con una fazione, prestigio; se venduti i reperti, 3-Valore a testa; se tenuti, il GM dice cosa avete.</li><li><strong>Furto memorabile</strong>: 2-prestigio con la fazione aiutata, 2-nomea con quella danneggiata, 2-Valore a testa.</li></ol><p>Fazioni casuali: 1d6 (1 Abitanti, 2-6 vostre fazioni, ritira se mancano). Radure casuali: 2d6 sulla tabella o 1d6 sulla mappa.</p>","text":"Ultimo passo della creazione: tirate 1d6 per l'impresa che la banda ha già compiuto insieme. 1. Nuovo sentiero: disegnatelo; tutti segnano prestigio e nomea con le fazioni collegate; +1 quando lo usate. 2. Distrutto un sentiero: segnatelo (non isolate una radura); prestigio e nomea con le fazioni collegate; +1 quando attraversate la foresta lì. 3. Cambiato il potere di una radura: 3-prestigio con la nuova fazione dominante, 3-nomea con quella spodestata. 4. Difesa una radura: 3-prestigio con chi difendeva, 3-nomea con l'attaccante; freccia tratteggiata sulla mappa (ostilità aperte). 5. Esplorate preziose rovine: aggiungetele alla mappa; se condivise con una fazione, prestigio; se venduti i reperti, 3-Valore a testa; se tenuti, il GM dice cosa avete. 6. Furto memorabile: 2-prestigio con la fazione aiutata, 2-nomea con quella danneggiata, 2-Valore a testa. Fazioni casuali: 1d6 (1 Abitanti, 2-6 vostre fazioni, ritira se mancano). Radure casuali: 2d6 sulla tabella o 1d6 sulla mappa.","back":["creazione"]},{"id":"banda","title":"I Vagabondi e la Banda","cat":"regole","group":"","src":"B p.39","aliases":["banda","vagabondo","vagabondi"],"html":"<p>I PG sono <strong>vagabondi</strong>: indipendenti, senza casa né fazione, capaci di attraversare la foresta. La partita racconta una <strong>banda</strong>, cosa rara e speciale. Se un PG smette di essere un vagabondo o lascia la banda, esce dalla storia come protagonista (diventa un PNG): meglio decidere insieme. I conflitti tra PG non sono il cuore del gioco (vedi <a class=\"xl\" href=\"#conflitto-pg\" data-id=\"conflitto-pg\">Conflitti tra PG</a>).</p>","text":"I PG sono vagabondi: indipendenti, senza casa né fazione, capaci di attraversare la foresta. La partita racconta una banda, cosa rara e speciale. Se un PG smette di essere un vagabondo o lascia la banda, esce dalla storia come protagonista (diventa un PNG): meglio decidere insieme. I conflitti tra PG non sono il cuore del gioco (vedi Conflitti tra PG).","back":["fazioni-indice"]},{"id":"reputazione","title":"Reputazione, Prestigio e Nomea","cat":"reputazione","group":"","src":"B p.52-54, 110-111","aliases":["Reputazione","prestigio","nomea","segnare prestigio","segnare nomea"],"html":"<p>Ogni PG ha una <strong>Reputazione</strong> da -3 a +3 con ciascuna fazione (Abitanti inclusi). Si parte da 0, modificata dal passato e da alcuni legami.</p><ul><li><strong>Segnare prestigio</strong>: casella a destra dello 0. Per salire servono <strong>5 caselle</strong> (fino a +1, e per salire da -2/-1), <strong>10</strong> per +2, <strong>15</strong> per +3. Quando sali, svuota il prestigio (solo le caselle necessarie).</li><li><strong>Segnare nomea</strong>: casella a sinistra. Per scendere servono <strong>3 caselle</strong> da +3 fino a -1, <strong>6</strong> per -2, <strong>9</strong> per -3. Quando scendi, svuota la nomea.</li><li>I tracciati di prestigio e nomea sono indipendenti; con la Reputazione cambia la soglia.</li></ul><div class=\"tw\"><table><thead><tr><th>Valore</th><th>Livello</th></tr></thead><tbody><tr><td>+3</td><td>Leggenda: ti considerano un eroe</td></tr><tr><td>+2</td><td>Stimato</td></tr><tr><td>+1</td><td>Rispettato</td></tr><tr><td>0</td><td>Sconosciuto o ambiguo</td></tr><tr><td>-1</td><td>Disdegnato</td></tr><tr><td>-2</td><td>Insultato: un vero problema</td></tr><tr><td>-3</td><td>Temuto o odiato: nemico da attaccare a vista</td></tr></tbody></table></div><p>Nelle <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a> tiri sulla Reputazione; se agiscono più vagabondi si sommano (min -3, max +4). Il GM dice sempre su quale fazione tirare, anche se rivela una lealtà segreta.</p>","text":"Ogni PG ha una Reputazione da -3 a +3 con ciascuna fazione (Abitanti inclusi). Si parte da 0, modificata dal passato e da alcuni legami. - Segnare prestigio: casella a destra dello 0. Per salire servono 5 caselle (fino a +1, e per salire da -2/-1), 10 per +2, 15 per +3. Quando sali, svuota il prestigio (solo le caselle necessarie). - Segnare nomea: casella a sinistra. Per scendere servono 3 caselle da +3 fino a -1, 6 per -2, 9 per -3. Quando scendi, svuota la nomea. - I tracciati di prestigio e nomea sono indipendenti; con la Reputazione cambia la soglia. Valore Livello ------ +3 Leggenda: ti considerano un eroe +2 Stimato +1 Rispettato 0 Sconosciuto o ambiguo -1 Disdegnato -2 Insultato: un vero problema -3 Temuto o odiato: nemico da attaccare a vista Nelle mosse di reputazione tiri sulla Reputazione; se agiscono più vagabondi si sommano (min -3, max +4). Il GM dice sempre su quale fazione tirare, anche se rivela una lealtà segreta.","back":["reputazione-indice","fazioni-indice"]},{"id":"mosse-base-indice","title":"Mosse Base","cat":"indici","group":"","src":"B p.68-89","aliases":["mosse base"],"html":"<p>Le mosse disponibili a tutti i vagabondi:</p><ul><li><a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a> (Fortuna)</li><li><a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a> (Carisma)</li><li><a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a> (Carisma)</li><li><a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a> (Vigore)</li><li><a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> (Astuzia)</li><li><a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'Impresa da Furfante</a> (Destrezza)</li><li><a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a> (Astuzia)</li><li><a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">Aiutare o Intralciare</a> (fatica, nessun tiro)</li><li><a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a> (nessun tiro)</li></ul><p>Le <a class=\"xl\" href=\"#maestrie\" data-id=\"maestrie\">Maestrie</a> permettono risultati di trionfo (<span class=\"res\">12+</span>) su queste mosse.</p>","text":"Le mosse disponibili a tutti i vagabondi: - Affidarsi al Fato (Fortuna) - Capire le Intenzioni (Carisma) - Convincere un PNG (Carisma) - Distruggere Qualcosa (Vigore) - Ingannare un PNG (Astuzia) - Tentare un'Impresa da Furfante (Destrezza) - Valutare una Situazione Tesa (Astuzia) - Aiutare o Intralciare (fatica, nessun tiro) - Supplicare un PG (nessun tiro) Le Maestrie permettono risultati di trionfo (12+) su queste mosse.","back":["mosse"]},{"id":"affidarsi-fato","title":"Affidarsi al Fato","cat":"base","group":"","src":"B p.68-70","aliases":["affidarsi al fato","ti affidi al fato","affidarti al fato"],"html":"<div class=\"move\"><p><strong>Quando ti affidi al fato per superare una situazione difficile, tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong> Con un successo te la cavi o vai avanti, ma il GM ti dirà il prezzo da pagare. Con <span class=\"res\">10+</span>, la fortuna aiuta gli audaci: il tuo \"stile\" ti procura anche una preziosa occasione.</p></div><ul><li>È la mossa \"di ripiego\" per i rischi enormi e incerti, quando nessun'altra mossa si adatta o le tue possibilità sono bassissime.</li><li><strong>Anche con <span class=\"res\">10+</span> paghi un prezzo</strong> (usura, consumo, fatica, ferite o complicazioni narrative); il <span class=\"res\">10+</span> aggiunge solo un'<strong>opportunità</strong>, che il GM descrive.</li><li>Si usa quando tenti un'<a class=\"xl\" href=\"#imprese-indice\" data-id=\"imprese-indice\">impresa da furfante</a> che non possiedi.</li><li>Il GM può imporre un costo base indipendente dal tiro (saltare da 10 metri fa male: quanto?).</li></ul><p>Maestria: <a class=\"xl\" href=\"#maestria-base\" data-id=\"maestria-base\"><span class=\"res\">12+</span></a> → nessun costo e un colpo di fortuna inatteso.</p>","text":"Quando ti affidi al fato per superare una situazione difficile, tira su Fortuna. Con un successo te la cavi o vai avanti, ma il GM ti dirà il prezzo da pagare. Con 10+, la fortuna aiuta gli audaci: il tuo \"stile\" ti procura anche una preziosa occasione. - È la mossa \"di ripiego\" per i rischi enormi e incerti, quando nessun'altra mossa si adatta o le tue possibilità sono bassissime. - Anche con 10+ paghi un prezzo (usura, consumo, fatica, ferite o complicazioni narrative); il 10+ aggiunge solo un'opportunità, che il GM descrive. - Si usa quando tenti un'impresa da furfante che non possiedi. - Il GM può imporre un costo base indipendente dal tiro (saltare da 10 metri fa male: quanto?). Maestria: 12+ → nessun costo e un colpo di fortuna inatteso.","back":["fortuna","mosse-base-indice","convincere","tentare-impresa","imprese-indice","tiro-maestro","maestria-base","pb-canaglia-mascherato","pb-ciarlatano-sorriso"]},{"id":"capire-intenzioni","title":"Capire le Intenzioni","cat":"base","group":"","src":"B p.70-72","aliases":["capire le intenzioni","capisci le intenzioni"],"html":"<div class=\"move\"><p><strong>Quando cerchi di capire le intenzioni di qualcuno, tira su <a class=\"xl\" href=\"#carisma\" data-id=\"carisma\">Carisma</a>.</strong> Con <span class=\"res\">10+</span> ottieni 3 <a class=\"xl\" href=\"#prese\" data-id=\"prese\">Prese, +1 al Prossimo Tiro, +1 Continuo</a>; con <span class=\"res\">7-9</span> ottieni 1 presa. Mentre interagite, spendi una presa per fare una domanda al giocatore (o al GM):</p><ul><li>Il tuo personaggio sta dicendo la verità?</li><li>Cosa prova davvero il tuo personaggio?</li><li>Quali sono le intenzioni del tuo personaggio?</li><li>Cosa vorrebbe che facessi il tuo personaggio?</li><li>Come posso convincere il tuo personaggio a ___?</li></ul></div><p>Note: richiede interazione (o un punto d'osservazione privilegiato). Le domande si fanno come giocatore e le risposte sono oneste. \"Sta dicendo la verità?\" riguarda ciò che il personaggio crede. \"Come posso convincerti a ___?\" si può fare più volte: se fai ciò che ti viene detto, l'altro deve accettare, senza altre mosse; la risposta può essere \"non puoi\".</p><p>Maestria (<span class=\"res\">12+</span>): annoti il nome del bersaglio e da allora sai sempre se ti mente.</p>","text":"Quando cerchi di capire le intenzioni di qualcuno, tira su Carisma. Con 10+ ottieni 3 Prese, +1 al Prossimo Tiro, +1 Continuo; con 7-9 ottieni 1 presa. Mentre interagite, spendi una presa per fare una domanda al giocatore (o al GM): - Il tuo personaggio sta dicendo la verità? - Cosa prova davvero il tuo personaggio? - Quali sono le intenzioni del tuo personaggio? - Cosa vorrebbe che facessi il tuo personaggio? - Come posso convincere il tuo personaggio a ___? Note: richiede interazione (o un punto d'osservazione privilegiato). Le domande si fanno come giocatore e le risposte sono oneste. \"Sta dicendo la verità?\" riguarda ciò che il personaggio crede. \"Come posso convincerti a ___?\" si può fare più volte: se fai ciò che ti viene detto, l'altro deve accettare, senza altre mosse; la risposta può essere \"non puoi\". Maestria (12+): annoti il nome del bersaglio e da allora sai sempre se ti mente.","back":["carisma","prese","mosse-base-indice","ingannare","maestria-base","pb-ciarlatano-provocatore","pb-ladro-fiuto","pb-ronin-padrone","pb-cronista-archivi","pb-trafficante-ricerca","legame-sentinella"]},{"id":"convincere","title":"Convincere un PNG","cat":"base","group":"","src":"B p.72-74","aliases":["convincere un PNG","convinci","convincere"],"html":"<div class=\"move\"><p><strong>Quando convinci un PNG con promesse o minacce, tira su <a class=\"xl\" href=\"#carisma\" data-id=\"carisma\">Carisma</a>.</strong> Con <span class=\"res\">10+</span> lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. Con <span class=\"res\">7-9</span> non lo convinci del tutto: il GM ti dirà cosa devi fare subito per persuaderlo.</p></div><ul><li>Solo sui PNG, uno alla volta (per un gruppo serve <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a> o una mossa speciale). Per gli altri PG vedi <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a>.</li><li>Serve <strong>sempre</strong> una promessa (carota) o una minaccia (bastone), ed è una mossa <strong>onesta</strong>: se menti stai <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">ingannando</a>.</li><li>Fa compiere un'azione concreta, non cambia le convinzioni (per quello vedi <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a>).</li><li>Con <span class=\"res\">7-9</span> devi dare una conferma concreta: pagare, mantenere parte della promessa, dimostrare la minaccia.</li></ul><p>Maestria (<span class=\"res\">12+</span>): puoi segnare fatica per trattarla come un <span class=\"res\">12+</span> su <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a>, ignorando i requisiti di Reputazione.</p>","text":"Quando convinci un PNG con promesse o minacce, tira su Carisma. Con 10+ lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. Con 7-9 non lo convinci del tutto: il GM ti dirà cosa devi fare subito per persuaderlo. - Solo sui PNG, uno alla volta (per un gruppo serve Affidarsi al Fato o una mossa speciale). Per gli altri PG vedi Supplicare un PG. - Serve sempre una promessa (carota) o una minaccia (bastone), ed è una mossa onesta: se menti stai ingannando. - Fa compiere un'azione concreta, non cambia le convinzioni (per quello vedi Influenzare un PNG). - Con 7-9 devi dare una conferma concreta: pagare, mantenere parte della promessa, dimostrare la minaccia. Maestria (12+): puoi segnare fatica per trattarla come un 12+ su Influenzare un PNG, ignorando i requisiti di Reputazione.","back":["carisma","mosse-base-indice","mente-criminale","mosse-armi-indice","maestria-base","comprare-vendere","pb-ranger-minaccioso","pb-cantastorie-lingua"]},{"id":"distruggere","title":"Distruggere Qualcosa","cat":"base","group":"","src":"B p.74-76","aliases":["distruggere qualcosa","distruggi"],"html":"<div class=\"move\"><p><strong>Quando distruggi qualcosa, tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>.</strong> Con un successo danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato. Con <span class=\"res\">7-9</span> sei impreciso e pericoloso: causi un danno collaterale, attiri l'attenzione o ti cacci in una brutta situazione (sceglie il GM).</p></div><ul><li>Solo su oggetti, mai su esseri viventi; si usa la forza bruta (con abilità e conoscenza è un'<a class=\"xl\" href=\"#disattivare\" data-id=\"disattivare\">impresa da furfante</a>).</li><li>Scatta solo se serve un grande sforzo o se le conseguenze sono significative.</li><li>Il danno collaterale può colpire alleati, astanti o anche il tuo strumento (usura) o te (consumo).</li></ul><p>Maestria (<span class=\"res\">12+</span>): infliggi 2-ferite ai nemici vicini, oppure distruggi qualcosa di molto più grande, oppure recuperi materiali (svuota 2-consumo).</p>","text":"Quando distruggi qualcosa, tira su Vigore. Con un successo danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato. Con 7-9 sei impreciso e pericoloso: causi un danno collaterale, attiri l'attenzione o ti cacci in una brutta situazione (sceglie il GM). - Solo su oggetti, mai su esseri viventi; si usa la forza bruta (con abilità e conoscenza è un'impresa da furfante). - Scatta solo se serve un grande sforzo o se le conseguenze sono significative. - Il danno collaterale può colpire alleati, astanti o anche il tuo strumento (usura) o te (consumo). Maestria (12+): infliggi 2-ferite ai nemici vicini, oppure distruggi qualcosa di molto più grande, oppure recuperi materiali (svuota 2-consumo).","back":["vigore","mosse-base-indice","disattivare","scassinare","maestria-base","tag-potente","pb-canaglia-esplosiva"]},{"id":"ingannare","title":"Ingannare un PNG","cat":"base","group":"","src":"B p.76-79","aliases":["ingannare un PNG","inganni","ingannare"],"html":"<div class=\"move\"><p><strong>Quando inganni un PNG per ottenere quello che vuoi, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong> Con un successo abbocca e fa ciò che vuoi. Con <span class=\"res\">7-9</span>, il GM può invece scegliere 1 opzione:</p><ul><li><strong>Esita</strong>: vacilla la sua fiducia o il suo morale (spesso danno al <a class=\"xl\" href=\"#morale\" data-id=\"morale\">Morale</a>).</li><li><strong>Commette un passo falso</strong>: ti si presenta un'opportunità cruciale.</li><li><strong>Reagisce in modo esagerato</strong>: +1 al prossimo tiro contro di lui.</li></ul></div><ul><li>Solo sui PNG (ai PG puoi mentire, ma possono <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capire le tue intenzioni</a>). Funziona anche su un gruppo con statistiche di gruppo.</li><li>L'inganno deve essere credibile e mirare a un'azione immediata.</li></ul><p>Maestria (<span class=\"res\">12+</span>): ci crede totalmente; puoi riproporre lo stesso inganno prendendo <span class=\"res\">10+</span> senza tirare.</p>","text":"Quando inganni un PNG per ottenere quello che vuoi, tira su Astuzia. Con un successo abbocca e fa ciò che vuoi. Con 7-9, il GM può invece scegliere 1 opzione: - Esita: vacilla la sua fiducia o il suo morale (spesso danno al Morale). - Commette un passo falso: ti si presenta un'opportunità cruciale. - Reagisce in modo esagerato: +1 al prossimo tiro contro di lui. - Solo sui PNG (ai PG puoi mentire, ma possono capire le tue intenzioni). Funziona anche su un gruppo con statistiche di gruppo. - L'inganno deve essere credibile e mirare a un'azione immediata. Maestria (12+): ci crede totalmente; puoi riproporre lo stesso inganno prendendo 10+ senza tirare.","back":["astuzia","mosse-base-indice","convincere","insabbiare","morale","png-gruppi","maestria-base","comprare-vendere","tag-ingannevole","pb-ciarlatano-istigatore"]},{"id":"tentare-impresa","title":"Tentare un'Impresa da Furfante","cat":"base","group":"","src":"B p.79-84","aliases":["tentare un'impresa da furfante","tenti un'impresa da furfante","impresa da furfante"],"html":"<div class=\"move\"><p><strong>Quando tenti un'impresa da furfante in cui sei abile, dichiara il tuo obiettivo e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con un successo raggiungi l'obiettivo. Con <span class=\"res\">7-9</span>, segna <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a> o subisci uno dei <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischi</a> legati all'impresa (scelto dal GM). <strong>Quando tenti un'impresa in cui NON sei abile, ti <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">affidi al fato</a>.</strong></p></div><ul><li>Dichiarare l'obiettivo aiuta a scegliere l'impresa giusta (entrare nella torre = <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>; non farsi vedere = <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a>).</li><li>Con <span class=\"res\">7-9</span> scegli prima tra fatica e rischio, poi il GM rivela il rischio.</li><li>Si possono usare in <a class=\"xl\" href=\"#flashback\" data-id=\"flashback\">Flashback</a>.</li></ul><p>Elenco: <a class=\"xl\" href=\"#imprese-indice\" data-id=\"imprese-indice\">Imprese da Furfante</a>. Maestria (<span class=\"res\">12+</span>): compi subito una seconda impresa adatta come con <span class=\"res\">10+</span>, oppure svuota 2-fatica.</p>","text":"Quando tenti un'impresa da furfante in cui sei abile, dichiara il tuo obiettivo e tira su Destrezza. Con un successo raggiungi l'obiettivo. Con 7-9, segna Fatica o subisci uno dei rischi legati all'impresa (scelto dal GM). Quando tenti un'impresa in cui NON sei abile, ti affidi al fato. - Dichiarare l'obiettivo aiuta a scegliere l'impresa giusta (entrare nella torre = Sgattaiolare; non farsi vedere = Nascondersi). - Con 7-9 scegli prima tra fatica e rischio, poi il GM rivela il rischio. - Si possono usare in Flashback. Elenco: Imprese da Furfante. Maestria (12+): compi subito una seconda impresa adatta come con 10+, oppure svuota 2-fatica.","back":["destrezza","mosse-base-indice","imprese-indice","rischi-imprese","maestria-base","pb-ladro-scasso"]},{"id":"valutare","title":"Valutare una Situazione Tesa","cat":"base","group":"","src":"B p.84-86","aliases":["valutare una situazione tesa","valuti una situazione tesa","valutare"],"html":"<div class=\"move\"><p><strong>Quando valuti una situazione tesa, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong> Con <span class=\"res\">7-9</span> fai 1 domanda; con <span class=\"res\">10+</span> fai 3 domande. Aggiungi <strong>+1 al tiro se agisci in base alle risposte</strong>.</p><ul><li>Qual è il miglior modo che ho per uscire/entrare/attraversare?</li><li>Chi o cosa è la minaccia più grande?</li><li>Chi o cosa è vulnerabile a me?</li><li>Su cosa dovrei tenere gli occhi aperti?</li><li>Chi ha il controllo della situazione?</li></ul></div><ul><li>La situazione deve essere davvero tesa. Le domande si fanno subito e il GM risponde sempre il vero.</li><li>\"Vulnerabile\" vale anche per inganni o reputazione. Il +1 è personale (salvo il legame <a class=\"xl\" href=\"#legame-professionista\" data-id=\"legame-professionista\">Professionista</a>).</li></ul><p>Maestria (<span class=\"res\">12+</span>): chiedi anche \"Come potrei ___?\" e, seguendo la risposta, prendi <span class=\"res\">12+</span> sulla prima mossa.</p>","text":"Quando valuti una situazione tesa, tira su Astuzia. Con 7-9 fai 1 domanda; con 10+ fai 3 domande. Aggiungi +1 al tiro se agisci in base alle risposte. - Qual è il miglior modo che ho per uscire/entrare/attraversare? - Chi o cosa è la minaccia più grande? - Chi o cosa è vulnerabile a me? - Su cosa dovrei tenere gli occhi aperti? - Chi ha il controllo della situazione? - La situazione deve essere davvero tesa. Le domande si fanno subito e il GM risponde sempre il vero. - \"Vulnerabile\" vale anche per inganni o reputazione. Il +1 è personale (salvo il legame Professionista). Maestria (12+): chiedi anche \"Come potrei ___?\" e, seguendo la risposta, prendi 12+ sulla prima mossa.","back":["astuzia","mosse-base-indice","mosse-armi-indice","maestria-base","pb-ladro-fiuto","pb-cronista-occhio","pb-cantastorie-dita","pb-razziatore-occhio","legame-professionista"]},{"id":"aiutare","title":"Aiutare o Intralciare","cat":"base","group":"","src":"B p.86-88","aliases":["aiutare o intralciare","aiuti","intralci","aiutare","intralciare"],"html":"<div class=\"move\"><p><strong>Quando aiuti o intralci un altro vagabondo, segna <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a> per dare +1 o -2 al suo tiro (dopo che ha tirato).</strong> Segna un'altra fatica per scegliere un'opzione:</p><ul><li>Nascondi il tuo aiuto o intralcio.</li><li>Crei un'occasione o un ostacolo.</li></ul></div><ul><li>Non si tira: si decide <strong>dopo</strong> aver visto il risultato. Devi fare qualcosa di concreto che influenzi davvero l'azione (\"per farlo devi farlo\").</li><li>Max 2-fatica per vagabondo; più vagabondi possono sommare i bonus.</li><li>Se non nascondi l'aiuto, sei legato alle conseguenze della mossa.</li></ul><p>Legami che la potenziano: <a class=\"xl\" href=\"#legame-amico\" data-id=\"legame-amico\">Amico</a> (+2 per 2-fatica), <a class=\"xl\" href=\"#legame-professionista\" data-id=\"legame-professionista\">Professionista</a>.</p>","text":"Quando aiuti o intralci un altro vagabondo, segna Fatica per dare +1 o -2 al suo tiro (dopo che ha tirato). Segna un'altra fatica per scegliere un'opzione: - Nascondi il tuo aiuto o intralcio. - Crei un'occasione o un ostacolo. - Non si tira: si decide dopo aver visto il risultato. Devi fare qualcosa di concreto che influenzi davvero l'azione (\"per farlo devi farlo\"). - Max 2-fatica per vagabondo; più vagabondi possono sommare i bonus. - Se non nascondi l'aiuto, sei legato alle conseguenze della mossa. Legami che la potenziano: Amico (+2 per 2-fatica), Professionista.","back":["mosse-base-indice","conflitto-pg","legame-amico"]},{"id":"supplicare","title":"Supplicare un PG","cat":"base","group":"","src":"B p.88-89","aliases":["supplicare un PG","supplichi","supplicare"],"html":"<div class=\"move\"><p><strong>Quando supplichi un PG di seguire le tue indicazioni, il PG svuota una casella di <a class=\"xl\" href=\"#fatica\" data-id=\"fatica\">Fatica</a> se acconsente.</strong> Puoi usare questa mossa <strong>una sola volta per sessione</strong>.</p></div><p>È l'unico modo meccanico per \"corrompere\" un altro PG. Se rifiuta, non puoi riprovarci fino alla sessione successiva. Il legame <a class=\"xl\" href=\"#legame-sentinella\" data-id=\"legame-sentinella\">Sentinella</a> fa svuotare 2-fatica.</p>","text":"Quando supplichi un PG di seguire le tue indicazioni, il PG svuota una casella di Fatica se acconsente. Puoi usare questa mossa una sola volta per sessione. È l'unico modo meccanico per \"corrompere\" un altro PG. Se rifiuta, non puoi riprovarci fino alla sessione successiva. Il legame Sentinella fa svuotare 2-fatica.","back":["mosse-base-indice","convincere","viaggio-indice","conflitto-pg","pb-pirata-rum","legame-sentinella","legame-istigatore"]},{"id":"imprese-indice","title":"Imprese da Furfante","cat":"indici","group":"","src":"B p.79-83; VF p.42-44","aliases":["elenco imprese"],"html":"<p>Le <strong>imprese da furfante</strong> sono abilità criminali. Se l'impresa è segnata sul tuo playbook la <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">tenti</a> con Destrezza; altrimenti <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">ti affidi al fato</a>. Massimo 6 imprese con l'avanzamento (quelle ottenute da mosse non contano).</p><p><strong>Manuale base</strong></p><div class=\"tw\"><table><thead><tr><th>Impresa</th><th>Descrizione</th><th>Rischi</th></tr></thead><tbody><tr><td><a class=\"xl\" href=\"#acrobazie\" data-id=\"acrobazie\">Acrobazie</a></td><td>Arrampicarsi, scavalcare, saltare</td><td>Rompere qualcosa, venire scoperto, finire nei guai</td></tr><tr><td><a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a></td><td>Colpire a sorpresa</td><td>Attenzioni indesiderate, lasciare prove, finire nei guai</td></tr><tr><td><a class=\"xl\" href=\"#borseggiare\" data-id=\"borseggiare\">Borseggiare</a></td><td>Rubare da una tasca</td><td>Lasciare prove, risultato non sperato, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#disattivare\" data-id=\"disattivare\">Disattivare un Congegno</a></td><td>Disinnescare trappole e meccanismi</td><td>Rompere qualcosa, attenzioni indesiderate, consumare risorse</td></tr><tr><td><a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a></td><td>Copiare, contraffare</td><td>Lasciare prove, risultato non sperato, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#gioco-prestigio\" data-id=\"gioco-prestigio\">Gioco di Prestigio</a></td><td>Nascondere, scambiare, sottrarre</td><td>Attenzioni indesiderate, lasciare prove, risultato non sperato</td></tr><tr><td><a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a></td><td>Sparire alla vista</td><td>Consumare risorse, lasciare prove, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#scassinare\" data-id=\"scassinare\">Scassinare</a></td><td>Aprire serrature</td><td>Rompere qualcosa, venire scoperto, finire nei guai</td></tr><tr><td><a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a></td><td>Entrare/uscire senza farsi notare</td><td>Rompere qualcosa, attenzioni indesiderate, finire nei guai</td></tr></tbody></table></div><p><strong>Viandanti e Forestieri</strong></p><div class=\"tw\"><table><thead><tr><th>Impresa</th><th>Descrizione</th><th>Rischi</th></tr></thead><tbody><tr><td><a class=\"xl\" href=\"#insabbiare\" data-id=\"insabbiare\">Insabbiare (Cover Up)</a></td><td>Eliminare prove, mascherare una scena</td><td>Venire scoperto, consumare risorse, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#mente-criminale\" data-id=\"mente-criminale\">Mente Criminale (Mastermind)</a></td><td>Dare ordini a PNG, dirigere operazioni</td><td>Attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#piazzare-trappola\" data-id=\"piazzare-trappola\">Piazzare Trappole (Set Trap)</a></td><td>Imboscate e trappole semplici</td><td>Venire scoperto, consumare risorse, lasciare prove</td></tr><tr><td><a class=\"xl\" href=\"#seguire-tracce\" data-id=\"seguire-tracce\">Seguire le Tracce (Tracking)</a></td><td>Inseguire, riconoscere tracce</td><td>Venire scoperto, cacciarsi nel pericolo, metterci troppo</td></tr><tr><td><a class=\"xl\" href=\"#usare-congegno\" data-id=\"usare-congegno\">Usare un Congegno (Use Device)</a></td><td>Azionare macchinari e reliquie, acrobazie con veicoli</td><td>Rompere qualcosa, cacciarsi nel pericolo, risultato debole</td></tr></tbody></table></div><p>Vedi <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">Rischi delle Imprese da Furfante</a>.</p>","text":"Le imprese da furfante sono abilità criminali. Se l'impresa è segnata sul tuo playbook la tenti con Destrezza; altrimenti ti affidi al fato. Massimo 6 imprese con l'avanzamento (quelle ottenute da mosse non contano). Manuale base Impresa Descrizione Rischi --------- Acrobazie Arrampicarsi, scavalcare, saltare Rompere qualcosa, venire scoperto, finire nei guai Attaccare alle Spalle Colpire a sorpresa Attenzioni indesiderate, lasciare prove, finire nei guai Borseggiare Rubare da una tasca Lasciare prove, risultato non sperato, metterci troppo Disattivare un Congegno Disinnescare trappole e meccanismi Rompere qualcosa, attenzioni indesiderate, consumare risorse Falsificare Copiare, contraffare Lasciare prove, risultato non sperato, metterci troppo Gioco di Prestigio Nascondere, scambiare, sottrarre Attenzioni indesiderate, lasciare prove, risultato non sperato Nascondersi Sparire alla vista Consumare risorse, lasciare prove, metterci troppo Scassinare Aprire serrature Rompere qualcosa, venire scoperto, finire nei guai Sgattaiolare Entrare/uscire senza farsi notare Rompere qualcosa, attenzioni indesiderate, finire nei guai Viandanti e Forestieri Impresa Descrizione Rischi --------- Insabbiare (Cover Up) Eliminare prove, mascherare una scena Venire scoperto, consumare risorse, metterci troppo Mente Criminale (Mastermind) Dare ordini a PNG, dirigere operazioni Attenzioni indesiderate, cacciarsi nel pericolo, metterci troppo Piazzare Trappole (Set Trap) Imboscate e trappole semplici Venire scoperto, consumare risorse, lasciare prove Seguire le Tracce (Tracking) Inseguire, riconoscere tracce Venire scoperto, cacciarsi nel pericolo, metterci troppo Usare un Congegno (Use Device) Azionare macchinari e reliquie, acrobazie con veicoli Rompere qualcosa, cacciarsi nel pericolo, risultato debole Vedi Rischi delle Imprese da Furfante.","back":["creazione","affidarsi-fato","tentare-impresa","avanzamento"]},{"id":"rischi-imprese","title":"Rischi delle Imprese da Furfante","cat":"imprese","group":"","src":"B p.82-83","aliases":["rischi","rischio"],"html":"<p>Con <span class=\"res\">7-9</span> su <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'Impresa da Furfante</a>, se non segni fatica il GM sceglie un rischio adatto:</p><ul><li><strong>Attirare attenzioni indesiderate</strong>: chi era indifferente diventa ostile, o vieni notato ma non scoperto; il rischio nella zona aumenta.</li><li><strong>Consumare risorse</strong>: il GM ti dice se segnare consumo, usura o fatica.</li><li><strong>Finire nei guai</strong>: riesci, ma finisci dritto in una brutta situazione.</li><li><strong>Lasciare delle prove</strong>: tracce che portano a te o ai tuoi alleati.</li><li><strong>Metterci troppo</strong>: la situazione cambia in modo significativo.</li><li><strong>Non ottenere il risultato sperato</strong>: devi fare una scelta difficile.</li><li><strong>Rompere qualcosa</strong>: tuo o nell'ambiente; forse segni usura.</li><li><strong>Venire scoperto</strong>: qualcuno ti nota, con conseguenze.</li><li><em>(VF)</em> <strong>Cacciarsi nel pericolo</strong> e <strong>risultato debole</strong>.</li></ul>","text":"Con 7-9 su Tentare un'Impresa da Furfante, se non segni fatica il GM sceglie un rischio adatto: - Attirare attenzioni indesiderate: chi era indifferente diventa ostile, o vieni notato ma non scoperto; il rischio nella zona aumenta. - Consumare risorse: il GM ti dice se segnare consumo, usura o fatica. - Finire nei guai: riesci, ma finisci dritto in una brutta situazione. - Lasciare delle prove: tracce che portano a te o ai tuoi alleati. - Metterci troppo: la situazione cambia in modo significativo. - Non ottenere il risultato sperato: devi fare una scelta difficile. - Rompere qualcosa: tuo o nell'ambiente; forse segni usura. - Venire scoperto: qualcuno ti nota, con conseguenze. - (VF) Cacciarsi nel pericolo e risultato debole.","back":["tentare-impresa","imprese-indice"]},{"id":"acrobazie","title":"Acrobazie","cat":"imprese","group":"","src":"B p.80","aliases":["Acrobazie"],"html":"<p>Movimenti complessi e notevoli: arrampicarsi, saltare un burrone, lanciarsi su una liana, una fuga spettacolare. Correre su una strada dritta non è acrobazia. Rischi: rompere qualcosa, venire scoperto, finire nei guai.</p>","text":"Movimenti complessi e notevoli: arrampicarsi, saltare un burrone, lanciarsi su una liana, una fuga spettacolare. Correre su una strada dritta non è acrobazia. Rischi: rompere qualcosa, venire scoperto, finire nei guai.","back":["imprese-indice"]},{"id":"attaccare-spalle","title":"Attaccare alle Spalle","cat":"imprese","group":"","src":"B p.80-81","aliases":["Attaccare alle Spalle"],"html":"<p>Colpire a sorpresa e mettere fuori gioco un avversario (temporaneamente o per sempre). Devi essere nascosto o il nemico distratto, e l'attacco deve essere plausibile (un pugnale non basta contro un'armatura completa). Rischi: attenzioni indesiderate, lasciare prove, finire nei guai.</p>","text":"Colpire a sorpresa e mettere fuori gioco un avversario (temporaneamente o per sempre). Devi essere nascosto o il nemico distratto, e l'attacco deve essere plausibile (un pugnale non basta contro un'armatura completa). Rischi: attenzioni indesiderate, lasciare prove, finire nei guai.","back":["imprese-indice","piazzare-trappola","pb-canaglia-diversivo","pb-emissario-voltagabbana"]},{"id":"borseggiare","title":"Borseggiare","cat":"imprese","group":"","src":"B p.81","aliases":["Borseggiare"],"html":"<p>Rubare qualcosa di soppiatto da un altro personaggio (borse, tasche). Se non coinvolge una persona è <a class=\"xl\" href=\"#gioco-prestigio\" data-id=\"gioco-prestigio\">Gioco di Prestigio</a>. Rischi: lasciare prove, risultato non sperato, metterci troppo.</p>","text":"Rubare qualcosa di soppiatto da un altro personaggio (borse, tasche). Se non coinvolge una persona è Gioco di Prestigio. Rischi: lasciare prove, risultato non sperato, metterci troppo.","back":["imprese-indice"]},{"id":"disattivare","title":"Disattivare un Congegno","cat":"imprese","group":"","src":"B p.81","aliases":["Disattivare un Congegno"],"html":"<p>Disinnescare trappole, manomettere macchinari o armi d'assedio con conoscenza e destrezza (con la forza è <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a>). Rischi: rompere qualcosa, attenzioni indesiderate, consumare risorse.</p>","text":"Disinnescare trappole, manomettere macchinari o armi d'assedio con conoscenza e destrezza (con la forza è Distruggere Qualcosa). Rischi: rompere qualcosa, attenzioni indesiderate, consumare risorse.","back":["distruggere","imprese-indice","rovine-indice"]},{"id":"falsificare","title":"Falsificare","cat":"imprese","group":"","src":"B p.82","aliases":["Falsificare"],"html":"<p>Scrivere documenti falsi, imitare sigilli e calligrafie. Di norma hai già gli strumenti (niente consumo di base, salvo materiali rari). Ottimo in <a class=\"xl\" href=\"#flashback\" data-id=\"flashback\">Flashback</a>. Rischi: lasciare prove, risultato non sperato, metterci troppo.</p>","text":"Scrivere documenti falsi, imitare sigilli e calligrafie. Di norma hai già gli strumenti (niente consumo di base, salvo materiali rari). Ottimo in Flashback. Rischi: lasciare prove, risultato non sperato, metterci troppo.","back":["flashback","imprese-indice","pb-predone-ambasciatore","pb-emissario-voltagabbana","pb-esule-carta"]},{"id":"gioco-prestigio","title":"Gioco di Prestigio","cat":"imprese","group":"","src":"B p.82","aliases":["Gioco di Prestigio"],"html":"<p>Far sparire o sottrarre con destrezza oggetti che non sono addosso a qualcuno (una chiave, un documento sul tavolo). Rischi: attenzioni indesiderate, lasciare prove, risultato non sperato.</p>","text":"Far sparire o sottrarre con destrezza oggetti che non sono addosso a qualcuno (una chiave, un documento sul tavolo). Rischi: attenzioni indesiderate, lasciare prove, risultato non sperato.","back":["imprese-indice","borseggiare"]},{"id":"nascondersi","title":"Nascondersi","cat":"imprese","group":"","src":"B p.82","aliases":["Nascondersi"],"html":"<p>Restare immobili e passare inosservati finché il pericolo non passa. È reattiva; per spostarsi di nascosto vedi <a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>. Rischi: consumare risorse, lasciare prove, metterci troppo.</p>","text":"Restare immobili e passare inosservati finché il pericolo non passa. È reattiva; per spostarsi di nascosto vedi Sgattaiolare. Rischi: consumare risorse, lasciare prove, metterci troppo.","back":["tentare-impresa","imprese-indice","sgattaiolare","seguire-tracce","pb-ranger-passo"]},{"id":"scassinare","title":"Scassinare","cat":"imprese","group":"","src":"B p.82","aliases":["Scassinare"],"html":"<p>Aprire una serratura con destrezza e precisione (alternativa: <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere Qualcosa</a> la porta). Rischi: rompere qualcosa, venire scoperto, finire nei guai.</p>","text":"Aprire una serratura con destrezza e precisione (alternativa: Distruggere Qualcosa la porta). Rischi: rompere qualcosa, venire scoperto, finire nei guai.","back":["imprese-indice","pb-principe-prigione"]},{"id":"sgattaiolare","title":"Sgattaiolare","cat":"imprese","group":"","src":"B p.82","aliases":["Sgattaiolare"],"html":"<p>Spostarsi di soppiatto da un luogo all'altro senza farsi notare. Per restare nascosto in un punto vedi <a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">Nascondersi</a>. Rischi: rompere qualcosa, attenzioni indesiderate, finire nei guai.</p>","text":"Spostarsi di soppiatto da un luogo all'altro senza farsi notare. Per restare nascosto in un punto vedi Nascondersi. Rischi: rompere qualcosa, attenzioni indesiderate, finire nei guai.","back":["tentare-impresa","imprese-indice","nascondersi","seguire-tracce","pb-ranger-passo"]},{"id":"insabbiare","title":"Insabbiare (Cover Up)","cat":"imprese","group":"","src":"VF p.42","aliases":["Insabbiare","Cover Up"],"html":"<p>Eliminare prove di attività furfantesche o far sembrare una scena qualcos'altro (guardie svenute nei cespugli, un omicidio camuffato da incidente). Diversamente da <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>, richiede tempo e preparazione. Rischi: venire scoperto, consumare risorse, metterci troppo. <em>(traduzione non ufficiale)</em></p>","text":"Eliminare prove di attività furfantesche o far sembrare una scena qualcos'altro (guardie svenute nei cespugli, un omicidio camuffato da incidente). Diversamente da Ingannare un PNG, richiede tempo e preparazione. Rischi: venire scoperto, consumare risorse, metterci troppo. (traduzione non ufficiale)","back":["imprese-indice"]},{"id":"mente-criminale","title":"Mente Criminale (Mastermind)","cat":"imprese","group":"","src":"VF p.42","aliases":["Mente Criminale","Mastermind"],"html":"<p>Dare ordini e prendere decisioni tattiche, posizionare alleati e PNG esattamente dove servono (anche in <a class=\"xl\" href=\"#flashback\" data-id=\"flashback\">Flashback</a>). Funziona solo con chi già ti ascolta:
