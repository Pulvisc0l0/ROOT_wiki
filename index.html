 a distanza ravvicinata, segna fatica e tira su Vigore. Con un successo sfondi le difese: infliggi 3-usura. Con 7-9 danneggi la tua arma o ti esponi: segna usura oppure finisci in una brutta posizione. Non puoi usarla con la fatica piena. Se infliggi più usura delle caselle disponibili, l'armatura è distrutta. Armi grosse e pesanti. Maestria (12+): infliggi 6-usura; l'eccesso diventa ferite o fatica.","back":["vigore","mosse-armi-indice","maestria-armi"]},{"id":"improvvisare-arma","title":"Improvvisare un'Arma","cat":"armi","group":"","src":"B p.103-104","aliases":["improvvisare un'arma","improvvisi un'arma","arma improvvisata","Improvise","Improvvisare"],"html":"<div class=\"move\"><p><strong>Quando improvvisi un'arma con i materiali che ti circondano, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong> Con un successo la costruisci: il GM ne indica la distanza e almeno un'etichetta positiva. Con <span class=\"res\">7-9</span> ha anche un'etichetta negativa.</p></div><p>Etichette tipiche: <a class=\"xl\" href=\"#tag-affilata\" data-id=\"tag-affilata\">Affilata</a>, <a class=\"xl\" href=\"#tag-flessibile\" data-id=\"tag-flessibile\">Flessibile</a>, <a class=\"xl\" href=\"#tag-rapida\" data-id=\"tag-rapida\">Rapida</a>, <a class=\"xl\" href=\"#tag-smussata\" data-id=\"tag-smussata\">Smussata</a>, <a class=\"xl\" href=\"#tag-veloce\" data-id=\"tag-veloce\">Veloce</a>; negative: <a class=\"xl\" href=\"#tag-fragile\" data-id=\"tag-fragile\">Fragile</a>, <a class=\"xl\" href=\"#tag-lenta\" data-id=\"tag-lenta\">Lenta</a>, <a class=\"xl\" href=\"#tag-poco-maneggevole\" data-id=\"tag-poco-maneggevole\">Poco maneggevole</a>. Un'arma improvvisata <strong>non ha caselle di usura</strong>: se devi segnare usura, si rompe. Non richiede etichetta. Maestria (<span class=\"res\">12+</span>): scegli tu distanza e due etichette positive.</p>","text":"Quando improvvisi un'arma con i materiali che ti circondano, tira su Astuzia. Con un successo la costruisci: il GM ne indica la distanza e almeno un'etichetta positiva. Con 7-9 ha anche un'etichetta negativa. Etichette tipiche: Affilata, Flessibile, Rapida, Smussata, Veloce; negative: Fragile, Lenta, Poco maneggevole. Un'arma improvvisata non ha caselle di usura: se devi segnare usura, si rompe. Non richiede etichetta. Maestria (12+): scegli tu distanza e due etichette positive.","back":["astuzia","mosse-armi-indice","abilita-armi","maestria-armi","pb-ronin-disarmato"]},{"id":"incalzare-gruppo","title":"Incalzare un Gruppo","cat":"armi","group":"","src":"B p.104-105","aliases":["incalzare un gruppo","incalzare","Harry a Group","Harry"],"html":"<div class=\"move\"><p><strong>Quando incalzi un gruppo di nemici a distanza lunga, segna usura e tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>.</strong> Con <span class=\"res\">10+</span> entrambe le opzioni, con <span class=\"res\">7-9</span> una:</p><ul><li>Infliggi 2 danni al morale.</li><li>Li ostacoli o immobilizzi.</li></ul></div><p>È il fuoco di copertura: solo contro gruppi (per un singolo, <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a>). Archi corti e potenti. Maestria (<span class=\"res\">12+</span>): anche 2-ferite o 2-morale aggiuntivi.</p>","text":"Quando incalzi un gruppo di nemici a distanza lunga, segna usura e tira su Astuzia. Con 10+ entrambe le opzioni, con 7-9 una: - Infliggi 2 danni al morale. - Li ostacoli o immobilizzi. È il fuoco di copertura: solo contro gruppi (per un singolo, Prendere la Mira). Archi corti e potenti. Maestria (12+): anche 2-ferite o 2-morale aggiuntivi.","back":["astuzia","morale","mosse-armi-indice","png-gruppi","maestria-armi"]},{"id":"parare","title":"Parare","cat":"armi","group":"","src":"B p.106-107","aliases":["parare","pari","Parry"],"html":"<div class=\"move\"><p><strong>Quando pari gli attacchi di un nemico a distanza ravvicinata, segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con un successo il nemico si concentra su di te. Con <span class=\"res\">10+</span> tutte e 3 le opzioni, con <span class=\"res\">7-9</span> una:</p><ul><li>Infliggi fatica o danni al morale (decide il GM).</li><li>Lo disarmi: perde l'arma, che resta a portata di mano.</li><li>Non subisci alcun danno.</li></ul></div><p>Non infligge ferite: serve a tenere occupato un nemico. Se non scegli \"nessun danno\", subisci il suo danno base. Armi leggere con protezioni per le mani. Maestria (<span class=\"res\">12+</span>): riposta immediata (2-ferite non assorbibili, 2-morale o 2-fatica).</p>","text":"Quando pari gli attacchi di un nemico a distanza ravvicinata, segna fatica e tira su Destrezza. Con un successo il nemico si concentra su di te. Con 10+ tutte e 3 le opzioni, con 7-9 una: - Infliggi fatica o danni al morale (decide il GM). - Lo disarmi: perde l'arma, che resta a portata di mano. - Non subisci alcun danno. Non infligge ferite: serve a tenere occupato un nemico. Se non scegli \"nessun danno\", subisci il suo danno base. Armi leggere con protezioni per le mani. Maestria (12+): riposta immediata (2-ferite non assorbibili, 2-morale o 2-fatica).","back":["mosse-armi-indice","maestria-armi","legame-veterano"]},{"id":"tiro-maestro","title":"Tiro da Maestro","cat":"armi","group":"","src":"B p.107-108","aliases":["tiro da maestro","Trick Shot"],"html":"<div class=\"move\"><p><strong>Quando, a qualsiasi distanza, effettui un tiro studiato per sfruttare l'ambiente, segna usura e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>.</strong> Con <span class=\"res\">7-9</span> scegli 2, con <span class=\"res\">10+</span> tre:</p><ul><li>Colpisci il bersaglio scelto entro il raggio, anche se nascosto o al riparo.</li><li>Colpisci un secondo bersaglio a tua scelta.</li><li>Tagli, rompi o rovesci qualcosa a tua scelta.</li><li>Distrai un avversario e ottieni un'occasione.</li></ul></div><p>Solo alle distanze indicate dall'arma. Senza l'abilità questi colpi richiedono <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a>. Maestria (<span class=\"res\">12+</span>): tutte e quattro e un terzo bersaglio.</p>","text":"Quando, a qualsiasi distanza, effettui un tiro studiato per sfruttare l'ambiente, segna usura e tira su Destrezza. Con 7-9 scegli 2, con 10+ tre: - Colpisci il bersaglio scelto entro il raggio, anche se nascosto o al riparo. - Colpisci un secondo bersaglio a tua scelta. - Tagli, rompi o rovesci qualcosa a tua scelta. - Distrai un avversario e ottieni un'occasione. Solo alle distanze indicate dall'arma. Senza l'abilità questi colpi richiedono Affidarsi al Fato. Maestria (12+): tutte e quattro e un terzo bersaglio.","back":["mosse-armi-indice","maestria-armi"]},{"id":"tiro-rapido","title":"Tiro Rapido","cat":"armi","group":"","src":"B p.108-109","aliases":["tiro rapido","Quick Shot"],"html":"<div class=\"move\"><p><strong>Quando scagli un tiro rapido su un nemico a distanza ravvicinata, tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>.</strong> Con un successo infliggi ferite. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due:</p><ul><li>Non segni usura.</li><li>Non segni fatica.</li><li>Ti sposti e cambi posizione (e se vuoi distanza).</li><li>Il nemico non può muoversi perché lo tieni a bada.</li></ul></div><p>Senza le prime due opzioni paghi usura e/o fatica. L'arma deve avere la distanza ravvicinata. Maestria (<span class=\"res\">12+</span>): tutte e quattro e infliggi 2-ferite.</p>","text":"Quando scagli un tiro rapido su un nemico a distanza ravvicinata, tira su Fortuna. Con un successo infliggi ferite. Con 7-9 scegli 1, con 10+ due: - Non segni usura. - Non segni fatica. - Ti sposti e cambi posizione (e se vuoi distanza). - Il nemico non può muoversi perché lo tieni a bada. Senza le prime due opzioni paghi usura e/o fatica. L'arma deve avere la distanza ravvicinata. Maestria (12+): tutte e quattro e infliggi 2-ferite.","back":["fortuna","mosse-armi-indice","maestria-armi","tag-corda-ingrassata","tag-flettenti-corti"]},{"id":"furia-battaglia","title":"Furia di Battaglia (Battle Fury)","cat":"armi","group":"","src":"VF p.24","aliases":["furia di battaglia","Battle Fury"],"html":"<p>Quando ti lanci in un attacco furioso con arma, denti e artigli a contatto, segna usura sull'arma e tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>. Con un successo <strong>riempi il tracciato della fatica</strong>: per ogni casella segnata infliggi 2-ferite al bersaglio. Con <span class=\"res\">7-9</span> anche il bersaglio ti infligge il suo danno. Vanno bene anche armi a distanza ravvicinata. <em>(trad. non ufficiale)</em></p>","text":"Quando ti lanci in un attacco furioso con arma, denti e artigli a contatto, segna usura sull'arma e tira su Fortuna. Con un successo riempi il tracciato della fatica: per ogni casella segnata infliggi 2-ferite al bersaglio. Con 7-9 anche il bersaglio ti infligge il suo danno. Vanno bene anche armi a distanza ravvicinata. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"carica","title":"Carica (Charge)","cat":"armi","group":"","src":"VF p.24","aliases":["carica","Charge"],"html":"<p>Quando carichi un avversario a distanza lunga, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>. Con un successo deve segnare 2-fatica o lasciarsi spingere: tu dici dove finisce e a che distanza vi trovate. Con <span class=\"res\">10+</span> gli infliggi anche danno al morale. <em>(trad. non ufficiale)</em></p>","text":"Quando carichi un avversario a distanza lunga, segna fatica e tira su Vigore. Con un successo deve segnare 2-fatica o lasciarsi spingere: tu dici dove finisce e a che distanza vi trovate. Con 10+ gli infliggi anche danno al morale. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"scagliare","title":"Scagliare (Hurl)","cat":"armi","group":"","src":"VF p.25","aliases":["scagliare","Hurl"],"html":"<p><strong>Senza etichetta.</strong> Quando scagli a distanza lunga un'arma o un oggetto pericoloso non fatto per essere lanciato, segna fatica e tira su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>. Con un successo colpisci: segna usura sull'oggetto e infliggi 1-ferita e 1-fatica. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due: segna un'altra usura per +1-ferita; l'oggetto rimbalza in un punto raggiungibile; il bersaglio viene atterrato. <em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando scagli a distanza lunga un'arma o un oggetto pericoloso non fatto per essere lanciato, segna fatica e tira su Vigore. Con un successo colpisci: segna usura sull'oggetto e infliggi 1-ferita e 1-fatica. Con 7-9 scegli 1, con 10+ due: segna un'altra usura per +1-ferita; l'oggetto rimbalza in un punto raggiungibile; il bersaglio viene atterrato. (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"affondo","title":"Affondo (Lunge)","cat":"armi","group":"","src":"VF p.25","aliases":["affondo","Lunge"],"html":"<p>Quando sferri un affondo a distanza ravvicinata, scegli da 1 a 3 ferite e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>. Con un successo infliggi quel danno <strong>ignorando l'armatura</strong>, ma se il bersaglio sopravvive (o ci sono altri nemici) può infliggerti la stessa quantità approfittando della tua esposizione; con <span class=\"res\">7-9</span> una ferita in più. <em>(trad. non ufficiale)</em></p>","text":"Quando sferri un affondo a distanza ravvicinata, scegli da 1 a 3 ferite e tira su Destrezza. Con un successo infliggi quel danno ignorando l'armatura, ma se il bersaglio sopravvive (o ci sono altri nemici) può infliggerti la stessa quantità approfittando della tua esposizione; con 7-9 una ferita in più. (trad. non ufficiale)","back":["mosse-armi-indice","armatura"]},{"id":"combattere-coppia","title":"Combattere in Coppia (Paired Fighting)","cat":"armi","group":"","src":"VF p.26","aliases":["combattere in coppia","Paired Fighting"],"html":"<p>Quando tu e un altro vagabondo combattete schiena contro schiena a distanza ravvicinata, segnate entrambi fatica e uno tira (max +3): +1 se avete un legame; +1 se siete in inferiorità numerica; +1 ogni 2 fatica extra segnate insieme. Con un successo infliggete 1-ferita a ogni nemico entro distanza ravvicinata (o 3-ferite a un gruppo) e subite 1-ferita a testa. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due: subite un danno leggero (-1); +2-ferite a un bersaglio; 2-morale; vi aprite una via per ritirarvi o avanzare. <strong>Entrambi</strong> devono avere abilità e arma con etichetta. <em>(trad. non ufficiale)</em></p>","text":"Quando tu e un altro vagabondo combattete schiena contro schiena a distanza ravvicinata, segnate entrambi fatica e uno tira (max +3): +1 se avete un legame; +1 se siete in inferiorità numerica; +1 ogni 2 fatica extra segnate insieme. Con un successo infliggete 1-ferita a ogni nemico entro distanza ravvicinata (o 3-ferite a un gruppo) e subite 1-ferita a testa. Con 7-9 scegli 1, con 10+ due: subite un danno leggero (-1); +2-ferite a un bersaglio; 2-morale; vi aprite una via per ritirarvi o avanzare. Entrambi devono avere abilità e arma con etichetta. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"zampe-martello","title":"Zampe di Martello (Hammerpaws)","cat":"armi","group":"","src":"VF p.27","aliases":["zampe di martello","Hammerpaws"],"html":"<p><strong>Senza etichetta.</strong> Quando combatti disarmato contro un avversario armato a distanza ravvicinata o a contatto, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>. Con un successo ti infligge il suo danno; scegli 2 (<span class=\"res\">7-9</span>) o 3 (<span class=\"res\">10+</span>): gli infliggi 2-fatica; cambi distanza di uno step; devii i colpi (danno leggero -1); infliggi usura al suo equipaggiamento; gli prendi un oggetto (deve segnare fatica per impedirlo). <em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando combatti disarmato contro un avversario armato a distanza ravvicinata o a contatto, tira su Destrezza. Con un successo ti infligge il suo danno; scegli 2 (7-9) o 3 (10+): gli infliggi 2-fatica; cambi distanza di uno step; devii i colpi (danno leggero -1); infliggi usura al suo equipaggiamento; gli prendi un oggetto (deve segnare fatica per impedirlo). (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"tiro-preciso","title":"Tiro di Precisione (Pinpoint Shot)","cat":"armi","group":"","src":"VF p.28","aliases":["tiro di precisione","Pinpoint Shot"],"html":"<p>Quando ti prendi il tempo per un tiro di precisione a distanza lunga, tira su <a class=\"xl\" href=\"#astuzia\" data-id=\"astuzia\">Astuzia</a>. Con un successo colpisci esattamente dove vuoi: punto debole di un PNG = 3-ferite non assorbibili; punto debole di un oggetto = 2-usura; elemento dell'ambiente = lo colpisci, tagli o rompi. Con <span class=\"res\">7-9</span> devi prima spostarti in una posizione migliore: segna fatica. <em>(trad. non ufficiale)</em></p>","text":"Quando ti prendi il tempo per un tiro di precisione a distanza lunga, tira su Astuzia. Con un successo colpisci esattamente dove vuoi: punto debole di un PNG = 3-ferite non assorbibili; punto debole di un oggetto = 2-usura; elemento dell'ambiente = lo colpisci, tagli o rompi. Con 7-9 devi prima spostarti in una posizione migliore: segna fatica. (trad. non ufficiale)","back":["mosse-armi-indice","armatura"]},{"id":"tiro-lungo","title":"Tiro Lungo (Long Shot)","cat":"armi","group":"","src":"VF p.29","aliases":["tiro lungo","Long Shot"],"html":"<p>Quando tendi l'arco oltre la distanza lunga, segna usura e fatica per effettuare qualsiasi mossa con le armi a distanza lunga tirando su <a class=\"xl\" href=\"#vigore\" data-id=\"vigore\">Vigore</a>, pagando anche gli altri costi della mossa. L'arma deve avere distanza lunga, questa etichetta e quella della mossa usata. <em>(trad. non ufficiale)</em></p>","text":"Quando tendi l'arco oltre la distanza lunga, segna usura e fatica per effettuare qualsiasi mossa con le armi a distanza lunga tirando su Vigore, pagando anche gli altri costi della mossa. L'arma deve avere distanza lunga, questa etichetta e quella della mossa usata. (trad. non ufficiale)","back":["mosse-armi-indice","distanze"]},{"id":"tiro-bruciapelo","title":"Tiro a Bruciapelo (Point-Blank Shot)","cat":"armi","group":"","src":"VF p.29","aliases":["tiro a bruciapelo","Point-Blank Shot"],"html":"<p>Quando tiri a bruciapelo (a contatto), segna fino a 2-usura e fino a 2-fatica e tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>. Con un successo infliggi tante ferite quanta usura e fatica hai segnato. Con <span class=\"res\">10+</span> puoi anche arretrare a distanza ravvicinata prima che reagisca. L'arma non deve avere la distanza a contatto. <em>(trad. non ufficiale)</em></p>","text":"Quando tiri a bruciapelo (a contatto), segna fino a 2-usura e fino a 2-fatica e tira su Fortuna. Con un successo infliggi tante ferite quanta usura e fatica hai segnato. Con 10+ puoi anche arretrare a distanza ravvicinata prima che reagisca. L'arma non deve avere la distanza a contatto. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"cambiare-mano","title":"Cambiare Mano (Switch Hands)","cat":"armi","group":"","src":"VF p.30","aliases":["cambiare mano","Switch Hands"],"html":"<p>Quando cambi la mano dominante nel mezzo di uno scontro prolungato, tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>. Con <span class=\"res\">7-9</span> scegli 1, con <span class=\"res\">10+</span> due: la nuova mano è fresca (svuota 2-fatica); l'avversario è spiazzato (segna morale); ottieni un'opportunità (segna fatica per infliggere 2-ferite). Una volta per scontro. <em>(trad. non ufficiale)</em></p>","text":"Quando cambi la mano dominante nel mezzo di uno scontro prolungato, tira su Destrezza. Con 7-9 scegli 1, con 10+ due: la nuova mano è fresca (svuota 2-fatica); l'avversario è spiazzato (segna morale); ottieni un'opportunità (segna fatica per infliggere 2-ferite). Una volta per scontro. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"spazzata","title":"Spazzata d'Arco (Sweep)","cat":"armi","group":"","src":"RS p.30","aliases":["spazzata","Sweep"],"html":"<p>Quando fai roteare l'arco contro uno o più nemici a distanza ravvicinata (anche senza quella distanza), segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>. Con <span class=\"res\">7-9</span> si disperdono e arretrano di una distanza, creando un'opportunità. Con <span class=\"res\">10+</span> anche: inciampano (più tempo); si scontrano tra loro (1-ferita); si spaventano (1-morale). <em>(trad. non ufficiale)</em></p>","text":"Quando fai roteare l'arco contro uno o più nemici a distanza ravvicinata (anche senza quella distanza), segna fatica e tira su Destrezza. Con 7-9 si disperdono e arretrano di una distanza, creando un'opportunità. Con 10+ anche: inciampano (più tempo); si scontrano tra loro (1-ferita); si spaventano (1-morale). (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"colpo-pomo","title":"Colpo di Pomo (Pommel Strike)","cat":"armi","group":"","src":"RS p.30","aliases":["colpo di pomo","Pommel Strike"],"html":"<p>Quando colpisci un nemico a contatto con il pomo della tua arma (anche senza quella distanza), tira su <a class=\"xl\" href=\"#fortuna\" data-id=\"fortuna\">Fortuna</a>. Con un successo segna 2-fatica. Con <span class=\"res\">10+</span> scegli anche 1: conquisti una posizione vantaggiosa; 1-morale; il suo prossimo colpo fa -1 danno. <em>(trad. non ufficiale)</em></p>","text":"Quando colpisci un nemico a contatto con il pomo della tua arma (anche senza quella distanza), tira su Fortuna. Con un successo segna 2-fatica. Con 10+ scegli anche 1: conquisti una posizione vantaggiosa; 1-morale; il suo prossimo colpo fa -1 danno. (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"svolazzo-terrificante","title":"Svolazzo Terrificante (Frightful Flourish)","cat":"armi","group":"","src":"RS p.31","aliases":["svolazzo terrificante","Frightful Flourish"],"html":"<p><strong>Senza etichetta.</strong> Quando fai roteare l'arma in modo spettacolare e terrificante ingaggiando un nuovo nemico, tira su <a class=\"xl\" href=\"#carisma\" data-id=\"carisma\">Carisma</a>. Con un successo subisce 2-morale, ma segni fatica per lo sforzo; con <span class=\"res\">10+</span> non segni fatica. <em>(trad. non ufficiale)</em></p>","text":"Senza etichetta. Quando fai roteare l'arma in modo spettacolare e terrificante ingaggiando un nuovo nemico, tira su Carisma. Con un successo subisce 2-morale, ma segni fatica per lo sforzo; con 10+ non segni fatica. (trad. non ufficiale)","back":["mosse-armi-indice","abilita-armi"]},{"id":"stoccata-sorpresa","title":"Stoccata a Sorpresa (Surprise Jab)","cat":"armi","group":"","src":"RS p.31","aliases":["stoccata a sorpresa","Surprise Jab"],"html":"<p>Quando colpisci con un'arma nascosta a contatto, segna fatica e tira su <a class=\"xl\" href=\"#destrezza\" data-id=\"destrezza\">Destrezza</a>. Con un successo infliggi il danno dell'arma. Scegli 3 (<span class=\"res\">10+</span>) o 1 (<span class=\"res\">7-9</span>): danno grave +1 (anche più volte); deve segnare 2-fatica o lasciar cadere ciò che tiene; gli sottrai qualcosa di vulnerabile (oggetto, posizione). <em>(trad. non ufficiale)</em></p>","text":"Quando colpisci con un'arma nascosta a contatto, segna fatica e tira su Destrezza. Con un successo infliggi il danno dell'arma. Scegli 3 (10+) o 1 (7-9): danno grave +1 (anche più volte); deve segnare 2-fatica o lasciar cadere ciò che tiene; gli sottrai qualcosa di vulnerabile (oggetto, posizione). (trad. non ufficiale)","back":["mosse-armi-indice"]},{"id":"armatura","title":"Armatura e Scudi","cat":"armi","group":"","src":"B p.93, 125","aliases":["armatura","armature","scudo","assorbire"],"html":"<p>Chi indossa armatura o scudo può <strong>segnare usura per ridurre il danno di 1 per ogni usura segnata</strong> (prima di segnare ferite). Alcune mosse impediscono l'assorbimento (<a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a>, <a class=\"xl\" href=\"#affondo\" data-id=\"affondo\">Affondo (Lunge)</a>, <a class=\"xl\" href=\"#tiro-preciso\" data-id=\"tiro-preciso\">Tiro di Precisione (Pinpoint Shot)</a>, etichetta <a class=\"xl\" href=\"#tag-possente\" data-id=\"tag-possente\">Possente</a>). I PNG hanno un unico tracciato di usura. Vedi <a class=\"xl\" href=\"#equipaggiamento-pregenerato\" data-id=\"equipaggiamento-pregenerato\">Equipaggiamento Pregenerato</a>.</p>","text":"Chi indossa armatura o scudo può segnare usura per ridurre il danno di 1 per ogni usura segnata (prima di segnare ferite). Alcune mosse impediscono l'assorbimento (Colpo Crudele, Affondo (Lunge), Tiro di Precisione (Pinpoint Shot), etichetta Possente). I PNG hanno un unico tracciato di usura. Vedi Equipaggiamento Pregenerato.","back":["danno","usura","mosse-armi-indice"]},{"id":"scene-combattimento","title":"Gestire le Scene di Combattimento","cat":"gm","group":"","src":"B p.217-223","aliases":["scene di combattimento","riflettore"],"html":"<p>Consigli per il GM:</p><ul><li><strong>Nessuna iniziativa</strong>: il GM sposta il <strong>riflettore</strong> come un regista, restando su un PG finché è interessante e dando spazio a chi è rimasto in disparte.</li><li><strong>Crea tensione</strong>: non limitarti ai danni; un fallimento può far suonare l'allarme o rivelare un ostaggio.</li><li><strong>I PNG hanno motivazioni e morale</strong>: arrendersi o fuggire sono opzioni legittime.</li><li><strong>I PNG agiscono dopo essere stati colpiti</strong>: dopo una mossa del PG il PNG reagisce, di solito con una mossa aperta (\"ti carica, cosa fai?\"); le mosse chiuse (danno immediato) dopo un fallimento o un'opportunità d'oro.</li><li><strong>Segui la narrazione</strong>: un nemico disarmato o stordito agisce di conseguenza.</li><li>Usa una narrazione cinematografica, cappa e spada; disegna mappe.</li></ul>","text":"Consigli per il GM: - Nessuna iniziativa: il GM sposta il riflettore come un regista, restando su un PG finché è interessante e dando spazio a chi è rimasto in disparte. - Crea tensione: non limitarti ai danni; un fallimento può far suonare l'allarme o rivelare un ostaggio. - I PNG hanno motivazioni e morale: arrendersi o fuggire sono opzioni legittime. - I PNG agiscono dopo essere stati colpiti: dopo una mossa del PG il PNG reagisce, di solito con una mossa aperta (\"ti carica, cosa fai?\"); le mosse chiuse (danno immediato) dopo un fallimento o un'opportunità d'oro. - Segui la narrazione: un nemico disarmato o stordito agisce di conseguenza. - Usa una narrazione cinematografica, cappa e spada; disegna mappe.","back":["mosse-armi-indice"]},{"id":"png","title":"PNG: Creazione e Tracciati","cat":"gm","group":"","src":"B p.212-214","aliases":["PNG","personaggi non giocanti","tracciati dei PNG"],"html":"<p>Un PNG significativo ha <strong>nome, descrizione (con specie), occupazione e motivazione</strong> (e magari un timore). Se può combattere, dagli tracciati di ferite, fatica, morale (1-5 caselle) e usura (anche 0), più un danno inflitto.</p><div class=\"tw\"><table><thead><tr><th>Caselle</th><th>Ferite</th><th>Fatica</th><th>Usura</th><th>Morale</th></tr></thead><tbody><tr><td>1</td><td>Abitante medio</td><td>Abitante medio</td><td>Abitante medio</td><td>Abitante medio</td></tr><tr><td>2</td><td>Guerriero addestrato</td><td>Bracciante</td><td>Soldato equipaggiato</td><td>Astuto mercante</td></tr><tr><td>3</td><td>Bruto</td><td>Acrobata, PNG vagabondo</td><td>Soldato ben equipaggiato</td><td>Comandante, sergente</td></tr><tr><td>4</td><td>Soldato veterano</td><td>Zampe possenti del posto</td><td>Cavaliere in armatura</td><td>Devoto credente</td></tr><tr><td>5</td><td>Nemico terrificante, orso</td><td>Vagabondo abilissimo</td><td>Ricco cavaliere</td><td>Fanatico ideologo</td></tr></tbody></table></div><p>Danni inflitti: lama comune 1-ferita; lama grande o ascia 2-ferite; arma rapida (frusta) 1-ferita +1-fatica; arma pesante 1-ferita +1-usura; guerriero abile +1 fatica; guerriero possente +1 ferita; contro l'equipaggiamento: tutto in usura +1.</p>","text":"Un PNG significativo ha nome, descrizione (con specie), occupazione e motivazione (e magari un timore). Se può combattere, dagli tracciati di ferite, fatica, morale (1-5 caselle) e usura (anche 0), più un danno inflitto. Caselle Ferite Fatica Usura Morale --------------- 1 Abitante medio Abitante medio Abitante medio Abitante medio 2 Guerriero addestrato Bracciante Soldato equipaggiato Astuto mercante 3 Bruto Acrobata, PNG vagabondo Soldato ben equipaggiato Comandante, sergente 4 Soldato veterano Zampe possenti del posto Cavaliere in armatura Devoto credente 5 Nemico terrificante, orso Vagabondo abilissimo Ricco cavaliere Fanatico ideologo Danni inflitti: lama comune 1-ferita; lama grande o ascia 2-ferite; arma rapida (frusta) 1-ferita +1-fatica; arma pesante 1-ferita +1-usura; guerriero abile +1 fatica; guerriero possente +1 ferita; contro l'equipaggiamento: tutto in usura +1.","back":[]},{"id":"png-linee-guida","title":"PNG Pronti","cat":"gm","group":"","src":"B p.216","aliases":["PNG pronti","orso"],"html":"<ul><li><strong>Abitante medio</strong> (a zampe nude): 1 ferita, 1 fatica, 0 usura, 1 morale — infligge 1-fatica.</li><li><strong>Guardia della radura</strong> (spada scheggiata): 1/1/1/1 — 1-fatica.</li><li><strong>Guardia o soldato addestrato</strong>: 2 ferite, 1 fatica, 2 usura, 2 morale — 1-ferita.</li><li><strong>Bruto o colosso</strong> (ascia gigante): 3/2/3/2 — 2-ferite e 1-usura.</li><li><strong>Comandante</strong> (arma cerimoniale): 1/2/1/3 — 1-ferita.</li><li><strong>Tenente</strong> (stocco e pugnale): 2/2/3/3 — 1-ferita e 1-fatica.</li><li><strong>Orso</strong>: 5 ferite, 5 fatica, 2 usura, 4 morale — 3-ferite. <em>Scappa.</em></li></ul><p>Altre creature: <a class=\"xl\" href=\"#mostri-indice\" data-id=\"mostri-indice\">Mostri dei Boschi</a>.</p>","text":"- Abitante medio (a zampe nude): 1 ferita, 1 fatica, 0 usura, 1 morale — infligge 1-fatica. - Guardia della radura (spada scheggiata): 1/1/1/1 — 1-fatica. - Guardia o soldato addestrato: 2 ferite, 1 fatica, 2 usura, 2 morale — 1-ferita. - Bruto o colosso (ascia gigante): 3/2/3/2 — 2-ferite e 1-usura. - Comandante (arma cerimoniale): 1/2/1/3 — 1-ferita. - Tenente (stocco e pugnale): 2/2/3/3 — 1-ferita e 1-fatica. - Orso: 5 ferite, 5 fatica, 2 usura, 4 morale — 3-ferite. Scappa. Altre creature: Mostri dei Boschi.","back":["mostri-indice"]},{"id":"png-gruppi","title":"Gruppi di PNG","cat":"gm","group":"","src":"B p.215-216","aliases":["gruppo","gruppi","gruppo di PNG","folla","piccolo gruppo","gruppo medio","gruppo grande"],"html":"<p>Un gruppo si gestisce come un'unica entità partendo dal membro tipico:</p><ul><li><strong>Piccolo (5-10)</strong>: +2 caselle per tracciato, danno ×2.</li><li><strong>Medio (11-20)</strong>: +4 caselle, danno ×3.</li><li><strong>Grande (21+)</strong>: +6 caselle, danno ×4.</li></ul><p>Esempio: abitanti comuni (1 casella, 1-ferita) → piccolo 3 caselle/2-ferite, medio 5/3, grande 7/4. Soldati (3 caselle, 2-ferite) → 5/4, 7/6, 9/8. I gruppi sono <strong>molto pericolosi</strong>: ricorda ai giocatori quando conviene arrendersi. Mosse utili: <a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare un Gruppo</a>, <a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare un Gruppo</a>, <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>.</p>","text":"Un gruppo si gestisce come un'unica entità partendo dal membro tipico: - Piccolo (5-10): +2 caselle per tracciato, danno ×2. - Medio (11-20): +4 caselle, danno ×3. - Grande (21+): +6 caselle, danno ×4. Esempio: abitanti comuni (1 casella, 1-ferita) → piccolo 3 caselle/2-ferite, medio 5/3, grande 7/4. Soldati (3 caselle, 2-ferite) → 5/4, 7/6, 9/8. I gruppi sono molto pericolosi: ricorda ai giocatori quando conviene arrendersi. Mosse utili: Assaltare un Gruppo, Incalzare un Gruppo, Ingannare un PNG.","back":["mosse-armi-indice","attaccare-mischia","assaltare-gruppo","pb-razziatore-pelle","mostro-formiche","mostro-calabrone","mostro-ape"]},{"id":"conflitto-pg","title":"Conflitti tra PG","cat":"gm","group":"","src":"B p.221","aliases":["conflitto tra PG"],"html":"<p>Il gioco non è pensato per scontri tra PG. Se accadono: usate <a class=\"xl\" href=\"#aiutare\" data-id=\"aiutare\">aiutare o intralciare</a>, <a class=\"xl\" href=\"#supplicare\" data-id=\"supplicare\">Supplicare un PG</a>, ricordate i legami e spostate il riflettore alternando, senza favorire nessuno.</p>","text":"Il gioco non è pensato per scontri tra PG. Se accadono: usate aiutare o intralciare, Supplicare un PG, ricordate i legami e spostate il riflettore alternando, senza favorire nessuno.","back":["banda"]},{"id":"maestrie","title":"Maestrie","cat":"avanzamento","group":"","src":"VF p.69-76","aliases":["maestria","maestrie","trionfo","triumph"],"html":"<p>Opzione di <a class=\"xl\" href=\"#avanzamento\" data-id=\"avanzamento\">Avanzamento</a> di <em>Viandanti e Forestieri</em>: <strong>padroneggia una mossa base o fino a due abilità con le armi che già possiedi</strong> (max 2 mosse base e 4 abilità). Una mossa padroneggiata ha un quarto livello di risultato, il <strong>trionfo (<span class=\"res\">12+</span>)</strong>. Non esistono maestrie per le mosse base con le armi.</p><p>Vedi <a class=\"xl\" href=\"#maestria-base\" data-id=\"maestria-base\">Maestrie delle Mosse Base</a> e <a class=\"xl\" href=\"#maestria-armi\" data-id=\"maestria-armi\">Maestrie delle Abilità con le Armi</a>.</p>","text":"Opzione di Avanzamento di Viandanti e Forestieri: padroneggia una mossa base o fino a due abilità con le armi che già possiedi (max 2 mosse base e 4 abilità). Una mossa padroneggiata ha un quarto livello di risultato, il trionfo (12+). Non esistono maestrie per le mosse base con le armi. Vedi Maestrie delle Mosse Base e Maestrie delle Abilità con le Armi.","back":["tiro","mosse-base-indice","avanzamento","mosse-armi-indice"]},{"id":"maestria-base","title":"Maestrie delle Mosse Base","cat":"avanzamento","group":"","src":"VF p.70-72","aliases":["maestrie delle mosse base"],"html":"<p>Con <span class=\"res\">12+</span>, oltre agli effetti del <span class=\"res\">10+</span> (salvo diversa indicazione):</p><ul><li><strong><a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">Tentare un'impresa</a></strong>: compi subito una seconda impresa adatta (anche se non la possiedi) come con <span class=\"res\">10+</span>, oppure svuota 2-fatica.</li><li><strong><a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le intenzioni</a></strong>: annota il suo nome: da ora sai sempre se ti mente; se è già annotato, +1 continuo agendo sulle risposte.</li><li><strong><a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere</a></strong>: puoi segnare fatica per trattarla come un <span class=\"res\">12+</span> su <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a>, ignorando la Reputazione.</li><li><strong><a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare</a></strong>: chiedi anche \"Come potrei ___?\"; seguendo la risposta prendi <span class=\"res\">12+</span> sulla prima mossa.</li><li><strong><a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare</a></strong>: ci crede totalmente; puoi ripetere lo stesso inganno con <span class=\"res\">10+</span> senza tirare.</li><li><strong><a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al fato</a></strong>: riesci senza costi e ottieni un'immediata fortuna.</li><li><strong><a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">Distruggere</a></strong>: scegli 1: 2-ferite ai nemici vicini; distruggi qualcosa di molto più grande; svuota 2-consumo.</li></ul>","text":"Con 12+, oltre agli effetti del 10+ (salvo diversa indicazione): - Tentare un'impresa: compi subito una seconda impresa adatta (anche se non la possiedi) come con 10+, oppure svuota 2-fatica. - Capire le intenzioni: annota il suo nome: da ora sai sempre se ti mente; se è già annotato, +1 continuo agendo sulle risposte. - Convincere: puoi segnare fatica per trattarla come un 12+ su Influenzare un PNG, ignorando la Reputazione. - Valutare: chiedi anche \"Come potrei ___?\"; seguendo la risposta prendi 12+ sulla prima mossa. - Ingannare: ci crede totalmente; puoi ripetere lo stesso inganno con 10+ senza tirare. - Affidarsi al fato: riesci senza costi e ottieni un'immediata fortuna. - Distruggere: scegli 1: 2-ferite ai nemici vicini; distruggi qualcosa di molto più grande; svuota 2-consumo.","back":["affidarsi-fato","maestrie"]},{"id":"maestria-armi","title":"Maestrie delle Abilità con le Armi","cat":"avanzamento","group":"","src":"VF p.73-76","aliases":["maestrie delle abilità con le armi"],"html":"<p>Con <span class=\"res\">12+</span>:</p><ul><li><strong><a class=\"xl\" href=\"#fracassare\" data-id=\"fracassare\">Fracassare</a></strong>: 6-usura; l'eccesso diventa ferite o fatica.</li><li><strong><a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i sensi</a></strong>: confondi un intero gruppo, o metti fuori gioco un nemico come vuoi.</li><li><strong><a class=\"xl\" href=\"#disarmare\" data-id=\"disarmare\">Disarmare</a></strong>: segna 3-fatica <em>e</em> perde l'arma.</li><li><strong><a class=\"xl\" href=\"#incalzare-gruppo\" data-id=\"incalzare-gruppo\">Incalzare</a></strong>: +2-ferite o +2-morale.</li><li><strong><a class=\"xl\" href=\"#improvvisare-arma\" data-id=\"improvvisare-arma\">Improvvisare</a></strong>: scegli distanza e due etichette positive.</li><li><strong><a class=\"xl\" href=\"#parare\" data-id=\"parare\">Parare</a></strong>: riposta: 2-ferite non assorbibili, 2-morale o 2-fatica.</li><li><strong><a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro rapido</a></strong>: tutte e quattro le opzioni e 2-ferite.</li><li><strong><a class=\"xl\" href=\"#assaltare-gruppo\" data-id=\"assaltare-gruppo\">Assaltare</a></strong>: tutte e quattro, una con effetto doppio.</li><li><strong><a class=\"xl\" href=\"#tiro-maestro\" data-id=\"tiro-maestro\">Tiro da maestro</a></strong>: tutte e quattro e un terzo bersaglio.</li><li><strong><a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo crudele</a></strong>: lo menomi (non si muove, non impugna armi o non comunica) finché non è curato.</li></ul>","text":"Con 12+: - Fracassare: 6-usura; l'eccesso diventa ferite o fatica. - Confondere i sensi: confondi un intero gruppo, o metti fuori gioco un nemico come vuoi. - Disarmare: segna 3-fatica e perde l'arma. - Incalzare: +2-ferite o +2-morale. - Improvvisare: scegli distanza e due etichette positive. - Parare: riposta: 2-ferite non assorbibili, 2-morale o 2-fatica. - Tiro rapido: tutte e quattro le opzioni e 2-ferite. - Assaltare: tutte e quattro, una con effetto doppio. - Tiro da maestro: tutte e quattro e un terzo bersaglio. - Colpo crudele: lo menomi (non si muove, non impugna armi o non comunica) finché non è curato.","back":["maestrie"]},{"id":"equipaggiamento","title":"Equipaggiamento","cat":"equipaggiamento","group":"","src":"B p.58-60, 181-185","aliases":["equipaggiamento","equipaggiamenti","oggetto"],"html":"<p>L'<strong>equipaggiamento</strong> sono gli oggetti importanti, grandi, specifici e non sostituibili (arma, armatura, scudo). In termini di regole è qualcosa con <strong><a class=\"xl\" href=\"#etichette\" data-id=\"etichette\">Etichette dell'Equipaggiamento</a></strong> e un tracciato di <strong><a class=\"xl\" href=\"#usura\" data-id=\"usura\">Usura</a></strong>. Gli oggetti minori rientrano nel <a class=\"xl\" href=\"#consumo\" data-id=\"consumo\">Consumo</a>. Ogni arma ha almeno una <a class=\"xl\" href=\"#distanze\" data-id=\"distanze\">distanza</a>.</p><p>Vedi <a class=\"xl\" href=\"#ingombro\" data-id=\"ingombro\">Ingombro</a>, <a class=\"xl\" href=\"#valore\" data-id=\"valore\">Valore</a>, <a class=\"xl\" href=\"#comprare-vendere\" data-id=\"comprare-vendere\">Comprare, Vendere e Costruire</a>, <a class=\"xl\" href=\"#equipaggiamento-pregenerato\" data-id=\"equipaggiamento-pregenerato\">Equipaggiamento Pregenerato</a>.</p>","text":"L'equipaggiamento sono gli oggetti importanti, grandi, specifici e non sostituibili (arma, armatura, scudo). In termini di regole è qualcosa con Etichette dell'Equipaggiamento e un tracciato di Usura. Gli oggetti minori rientrano nel Consumo. Ogni arma ha almeno una distanza. Vedi Ingombro, Valore, Comprare, Vendere e Costruire, Equipaggiamento Pregenerato.","back":["creazione","usura"]},{"id":"ingombro","title":"Ingombro","cat":"equipaggiamento","group":"","src":"B p.59-60, 183","aliases":["Ingombro","appesantito"],"html":"<p>Di base puoi portare <strong>4-Ingombro</strong> (5 con Vigore +1, 3 con Vigore -1). Oggetti piccoli e leggeri: 0; grandi e pesanti: 1; voluminosi (spadone) possono costare 2. È ciò che gli altri vedono addosso a te. Oltre il limite sei <strong>appesantito</strong> (il GM agisce di conseguenza); mai oltre il doppio. Nelle rovine conta per <a class=\"xl\" href=\"#ritirata\" data-id=\"ritirata\">ritirarsi in superficie</a>.</p>","text":"Di base puoi portare 4-Ingombro (5 con Vigore +1, 3 con Vigore -1). Oggetti piccoli e leggeri: 0; grandi e pesanti: 1; voluminosi (spadone) possono costare 2. È ciò che gli altri vedono addosso a te. Oltre il limite sei appesantito (il GM agisce di conseguenza); mai oltre il doppio. Nelle rovine conta per ritirarsi in superficie.","back":["vigore","creazione","equipaggiamento","ritirata"]},{"id":"valore","title":"Valore","cat":"equipaggiamento","group":"","src":"B p.60, 183-184","aliases":["Valore"],"html":"<p>Il <strong>Valore</strong> rappresenta astrattamente il denaro (ogni fazione ha la sua moneta; diffuso il baratto). <strong>1 casella di consumo ≈ 1-Valore.</strong></p><div class=\"tw\"><table><thead><tr><th>Valore</th><th>Esempi</th></tr></thead><tbody><tr><td>1</td><td>Cibo per un giorno, impacco d'erbe, sacchetto di monete, notte in locanda</td></tr><tr><td>2</td><td>Semplice pugnale, attrezzi da contadino, mantello da viaggio</td></tr><tr><td>3-4</td><td>Semplice spada o arco, armatura di pelle, scudo, carriola, settimana in locanda</td></tr><tr><td>5-6</td><td>Buona spada o bell'arco, cotta di maglia, carretto, due settimane in locanda</td></tr><tr><td>7-10</td><td>Arma eccellente, armatura di piastre di qualità, forziere d'oro, piccola barca</td></tr></tbody></table></div><p><strong>Valore di un equipaggiamento</strong> = caselle di usura + distanze extra + etichette speciali + etichette delle mosse con le armi − etichette negative.</p>","text":"Il Valore rappresenta astrattamente il denaro (ogni fazione ha la sua moneta; diffuso il baratto). 1 casella di consumo ≈ 1-Valore. Valore Esempi ------ 1 Cibo per un giorno, impacco d'erbe, sacchetto di monete, notte in locanda 2 Semplice pugnale, attrezzi da contadino, mantello da viaggio 3-4 Semplice spada o arco, armatura di pelle, scudo, carriola, settimana in locanda 5-6 Buona spada o bell'arco, cotta di maglia, carretto, due settimane in locanda 7-10 Arma eccellente, armatura di piastre di qualità, forziere d'oro, piccola barca Valore di un equipaggiamento = caselle di usura + distanze extra + etichette speciali + etichette delle mosse con le armi − etichette negative.","back":["distanze","equipaggiamento"]},{"id":"comprare-vendere","title":"Comprare, Vendere e Costruire","cat":"equipaggiamento","group":"","src":"B p.184-185","aliases":["comprare","vendere","costruire equipaggiamento"],"html":"<ul><li>Gli oggetti comuni si comprano nelle radure con un mercato pagando il Valore, senza mosse se il GM è d'accordo; vendere un oggetto semplice svuota consumo o dà monete.</li><li>Prezzi variabili di ±1-2 Valore; oltre, il PNG ti adora o ti sta truffando. Puoi usare <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a>, <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a>, <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a>.</li><li>Oggetti particolari o in grandi quantità sollevano sospetti.</li><li>Solo il <a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Mastro</a> costruisce (con <a class=\"xl\" href=\"#pb-mastro-cassetta\" data-id=\"pb-mastro-cassetta\">Cassetta degli Attrezzi</a>); costo minimo = Valore dell'oggetto. Migliorare un oggetto richiede un maestro artigiano.</li><li>Le etichette devono essere coerenti con l'oggetto.</li></ul>","text":"- Gli oggetti comuni si comprano nelle radure con un mercato pagando il Valore, senza mosse se il GM è d'accordo; vendere un oggetto semplice svuota consumo o dà monete. - Prezzi variabili di ±1-2 Valore; oltre, il PNG ti adora o ti sta truffando. Puoi usare Convincere un PNG, Ingannare un PNG, Chiedere un Favore. - Oggetti particolari o in grandi quantità sollevano sospetti. - Solo il Mastro costruisce (con Cassetta degli Attrezzi); costo minimo = Valore dell'oggetto. Migliorare un oggetto richiede un maestro artigiano. - Le etichette devono essere coerenti con l'oggetto.","back":["equipaggiamento"]},{"id":"etichette","title":"Etichette dell'Equipaggiamento","cat":"equipaggiamento","group":"","src":"B p.186-189","aliases":["etichette","etichetta"],"html":"<p>Ogni etichetta positiva +1-Valore, ogni negativa −1. Puoi inventarne di nuove: più sono potenti, più dovrebbero avere un costo d'uso (fatica, usura, consumo).</p><p><strong>Positive</strong>: <a class=\"xl\" href=\"#tag-prova-freccia\" data-id=\"tag-prova-freccia\">A prova di freccia</a>, <a class=\"xl\" href=\"#tag-acciaio-conigli\" data-id=\"tag-acciaio-conigli\">Acciaio dei Conigli</a>, <a class=\"xl\" href=\"#tag-acciaio-gatti\" data-id=\"tag-acciaio-gatti\">Acciaio dei Gatti</a>, <a class=\"xl\" href=\"#tag-acciaio-topi\" data-id=\"tag-acciaio-topi\">Acciaio dei Topi</a>, <a class=\"xl\" href=\"#tag-acciaio-volpi\" data-id=\"tag-acciaio-volpi\">Acciaio delle Volpi</a>, <a class=\"xl\" href=\"#tag-affilata\" data-id=\"tag-affilata\">Affilata</a>, <a class=\"xl\" href=\"#tag-allungo\" data-id=\"tag-allungo\">Allungo</a>, <a class=\"xl\" href=\"#tag-alto-libraggio\" data-id=\"tag-alto-libraggio\">Alto Libraggio</a>, <a class=\"xl\" href=\"#tag-amichevole\" data-id=\"tag-amichevole\">Amichevole</a>, <a class=\"xl\" href=\"#tag-buona-fattura\" data-id=\"tag-buona-fattura\">Buona Fattura</a>, <a class=\"xl\" href=\"#tag-cerimoniale\" data-id=\"tag-cerimoniale\">Cerimoniale</a>, <a class=\"xl\" href=\"#tag-comodo\" data-id=\"tag-comodo\">Comodo</a>, <a class=\"xl\" href=\"#tag-corda-ingrassata\" data-id=\"tag-corda-ingrassata\">Corda Ingrassata</a>, <a class=\"xl\" href=\"#tag-da-lancio\" data-id=\"tag-da-lancio\">Da Lancio</a>, <a class=\"xl\" href=\"#tag-dardo-ferro\" data-id=\"tag-dardo-ferro\">Dardo di Ferro</a>, <a class=\"xl\" href=\"#tag-durevole\" data-id=\"tag-durevole\">Durevole</a>, <a class=\"xl\" href=\"#tag-firma\" data-id=\"tag-firma\">Firma</a>, <a class=\"xl\" href=\"#tag-flessibile\" data-id=\"tag-flessibile\">Flessibile</a>, <a class=\"xl\" href=\"#tag-flettenti-corti\" data-id=\"tag-flettenti-corti\">Flettenti Corti</a>, <a class=\"xl\" href=\"#tag-forgiato-aquile\" data-id=\"tag-forgiato-aquile\">Forgiato dalle Aquile</a>, <a class=\"xl\" href=\"#tag-grande\" data-id=\"tag-grande\">Grande</a>, <a class=\"xl\" href=\"#tag-grilletto\" data-id=\"tag-grilletto\">Grilletto Facile</a>, <a class=\"xl\" href=\"#tag-ingannevole\" data-id=\"tag-ingannevole\">Ingannevole</a>, <a class=\"xl\" href=\"#tag-kit-guaritore\" data-id=\"tag-kit-guaritore\">Kit del Guaritore</a>, <a class=\"xl\" href=\"#tag-kit-ladro\" data-id=\"tag-kit-ladro\">Kit del Ladro</a>, <a class=\"xl\" href=\"#tag-lussuoso\" data-id=\"tag-lussuoso\">Lussuoso</a>, <a class=\"xl\" href=\"#tag-modesto\" data-id=\"tag-modesto\">Modesto</a>, <a class=\"xl\" href=\"#tag-possente\" data-id=\"tag-possente\">Possente</a>, <a class=\"xl\" href=\"#tag-potente\" data-id=\"tag-potente\">Potente</a>, <a class=\"xl\" href=\"#tag-rapida\" data-id=\"tag-rapida\">Rapida</a>, <a class=\"xl\" href=\"#tag-smussata\" data-id=\"tag-smussata\">Smussata</a>, <a class=\"xl\" href=\"#tag-spesso\" data-id=\"tag-spesso\">Spesso</a>, <a class=\"xl\" href=\"#tag-tonificante\" data-id=\"tag-tonificante\">Tonificante</a>, <a class=\"xl\" href=\"#tag-veloce\" data-id=\"tag-veloce\">Veloce</a>, <a class=\"xl\" href=\"#tag-versatile\" data-id=\"tag-versatile\">Versatile</a>.</p><p><strong>Negative</strong>: <a class=\"xl\" href=\"#tag-brutto\" data-id=\"tag-brutto\">Brutto</a>, <a class=\"xl\" href=\"#tag-fragile\" data-id=\"tag-fragile\">Fragile</a>, <a class=\"xl\" href=\"#tag-ingombrante\" data-id=\"tag-ingombrante\">Ingombrante</a>, <a class=\"xl\" href=\"#tag-lenta\" data-id=\"tag-lenta\">Lenta</a>, <a class=\"xl\" href=\"#tag-empio\" data-id=\"tag-empio\">Empio</a>, <a class=\"xl\" href=\"#tag-odiato\" data-id=\"tag-odiato\">Odiato</a>, <a class=\"xl\" href=\"#tag-pesante\" data-id=\"tag-pesante\">Pesante</a>, <a class=\"xl\" href=\"#tag-scadente\" data-id=\"tag-scadente\">Scadente</a>, <a class=\"xl\" href=\"#tag-scomoda\" data-id=\"tag-scomoda\">Scomoda</a>, <a class=\"xl\" href=\"#tag-poco-maneggevole\" data-id=\"tag-poco-maneggevole\">Poco Maneggevole</a>.</p><p>I supplementi aggiungono decine di altre etichette (VF p.81-84, RS p.53-57).</p>","text":"Ogni etichetta positiva +1-Valore, ogni negativa −1. Puoi inventarne di nuove: più sono potenti, più dovrebbero avere un costo d'uso (fatica, usura, consumo). Positive: A prova di freccia, Acciaio dei Conigli, Acciaio dei Gatti, Acciaio dei Topi, Acciaio delle Volpi, Affilata, Allungo, Alto Libraggio, Amichevole, Buona Fattura, Cerimoniale, Comodo, Corda Ingrassata, Da Lancio, Dardo di Ferro, Durevole, Firma, Flessibile, Flettenti Corti, Forgiato dalle Aquile, Grande, Grilletto Facile, Ingannevole, Kit del Guaritore, Kit del Ladro, Lussuoso, Modesto, Possente, Potente, Rapida, Smussata, Spesso, Tonificante, Veloce, Versatile. Negative: Brutto, Fragile, Ingombrante, Lenta, Empio, Odiato, Pesante, Scadente, Scomoda, Poco Maneggevole. I supplementi aggiungono decine di altre etichette (VF p.81-84, RS p.53-57).","back":["equipaggiamento"]},{"id":"tag-prova-freccia","title":"A Prova di Freccia","cat":"etichette","group":"","src":"B p.186","aliases":["A Prova di Freccia"],"html":"<p>+ Ignora il primo colpo di frecce che ti infligge ferite in una scena. (Armatura)</p>","text":"+ Ignora il primo colpo di frecce che ti infligge ferite in una scena. (Armatura)","back":["etichette"]},{"id":"tag-acciaio-conigli","title":"Acciaio dei Conigli","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Conigli"],"html":"<p>+ Segna usura per <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su Destrezza invece di Vigore. (Armi)</p>","text":"+ Segna usura per attaccare in mischia tirando su Destrezza invece di Vigore. (Armi)","back":["etichette"]},{"id":"tag-acciaio-gatti","title":"Acciaio dei Gatti","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Gatti"],"html":"<p>+ Segna usura quando attacchi in mischia per cambiare distanza di uno step, anche con un fallimento. (Armature, armi)</p>","text":"+ Segna usura quando attacchi in mischia per cambiare distanza di uno step, anche con un fallimento. (Armature, armi)","back":["etichette"]},{"id":"tag-acciaio-topi","title":"Acciaio dei Topi","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio dei Topi"],"html":"<p>+ Segna usura per attaccare in mischia tirando su Astuzia invece di Vigore. (Armi)</p>","text":"+ Segna usura per attaccare in mischia tirando su Astuzia invece di Vigore. (Armi)","back":["etichette"]},{"id":"tag-acciaio-volpi","title":"Acciaio delle Volpi","cat":"etichette","group":"","src":"B p.186","aliases":["Acciaio delle Volpi"],"html":"<p>+ Una volta per sessione ignora la prima casella di usura che dovresti segnare su questo oggetto. (Armi, alcune armature)</p>","text":"+ Una volta per sessione ignora la prima casella di usura che dovresti segnare su questo oggetto. (Armi, alcune armature)","back":["etichette"]},{"id":"tag-affilata","title":"Affilata","cat":"etichette","group":"","src":"B p.186","aliases":["Affilata"],"html":"<p>+ Quando infliggi danni con quest'arma, segna usura per infliggere 1 danno aggiuntivo. (Armi taglienti)</p>","text":"+ Quando infliggi danni con quest'arma, segna usura per infliggere 1 danno aggiuntivo. (Armi taglienti)","back":["improvvisare-arma","etichette"]},{"id":"tag-allungo","title":"Allungo","cat":"etichette","group":"","src":"B p.186","aliases":["Allungo"],"html":"<p>+ Quando attacchi in mischia, segna usura per infliggere danno invece di scambiarlo. Inutilizzabile se anche l'arma nemica ha Allungo. (Armi lunghe, ad asta)</p>","text":"+ Quando attacchi in mischia, segna usura per infliggere danno invece di scambiarlo. Inutilizzabile se anche l'arma nemica ha Allungo. (Armi lunghe, ad asta)","back":["etichette"]},{"id":"tag-alto-libraggio","title":"Alto Libraggio","cat":"etichette","group":"","src":"B p.186","aliases":["Alto Libraggio"],"html":"<p>+ Quando <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">prendi la mira</a> con quest'arco, segna fatica per infliggere 1-ferita aggiuntiva. (Archi)</p>","text":"+ Quando prendi la mira con quest'arco, segna fatica per infliggere 1-ferita aggiuntiva. (Archi)","back":["etichette"]},{"id":"tag-amichevole","title":"Amichevole","cat":"etichette","group":"","src":"B p.187","aliases":["Amichevole"],"html":"<p>+ Quando <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a>, segna fatica per tirare con Reputazione +1. (Armature, armi innocue)</p>","text":"+ Quando incontri qualcuno di importante, segna fatica per tirare con Reputazione +1. (Armature, armi innocue)","back":["etichette"]},{"id":"tag-buona-fattura","title":"Buona Fattura","cat":"etichette","group":"","src":"B p.187","aliases":["Buona Fattura"],"html":"<p>+ Quando ripari questa armatura dopo una battaglia, svuota 1-usura segnata nello scontro. (Cotta di maglia)</p>","text":"+ Quando ripari questa armatura dopo una battaglia, svuota 1-usura segnata nello scontro. (Cotta di maglia)","back":["etichette"]},{"id":"tag-cerimoniale","title":"Cerimoniale","cat":"etichette","group":"","src":"B p.187","aliases":["Cerimoniale"],"html":"<p>+ Scegli una fazione alleata: mostrandolo hai +1 Reputazione con essa e -1 con le altre. (Qualsiasi)</p>","text":"+ Scegli una fazione alleata: mostrandolo hai +1 Reputazione con essa e -1 con le altre. (Qualsiasi)","back":["etichette"]},{"id":"tag-comodo","title":"Comodo","cat":"etichette","group":"","src":"B p.187","aliases":["Comodo"],"html":"<p>+ Conta 1 Ingombro in meno. (Armature)</p>","text":"+ Conta 1 Ingombro in meno. (Armature)","back":["etichette"]},{"id":"tag-corda-ingrassata","title":"Corda Ingrassata","cat":"etichette","group":"","src":"B p.187","aliases":["Corda Ingrassata"],"html":"<p>+ Segna usura per usare <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a> anche se non hai l'abilità. (Archi)</p>","text":"+ Segna usura per usare Tiro Rapido anche se non hai l'abilità. (Archi)","back":["etichette"]},{"id":"tag-da-lancio","title":"Da Lancio","cat":"etichette","group":"","src":"B p.187","aliases":["Da Lancio"],"html":"<p>+ Segna fatica per prendere la mira su un nemico vulnerabile a distanza lunga. (Pugnali, granate)</p>","text":"+ Segna fatica per prendere la mira su un nemico vulnerabile a distanza lunga. (Pugnali, granate)","back":["etichette"]},{"id":"tag-dardo-ferro","title":"Dardo di Ferro","cat":"etichette","group":"","src":"B p.187","aliases":["Dardo di Ferro"],"html":"<p>+ Quando il suo danno viene assorbito dall'armatura, infligge 1-usura aggiuntiva. (Archi, balestre)</p>","text":"+ Quando il suo danno viene assorbito dall'armatura, infligge 1-usura aggiuntiva. (Archi, balestre)","back":["etichette"]},{"id":"tag-durevole","title":"Durevole","cat":"etichette","group":"","src":"B p.187","aliases":["Durevole"],"html":"<p>+ Se l'oggetto verrebbe distrutto, rimuovi invece definitivamente 1 casella di usura; senza usura è distrutto.</p>","text":"+ Se l'oggetto verrebbe distrutto, rimuovi invece definitivamente 1 casella di usura; senza usura è distrutto.","back":["etichette"]},{"id":"tag-firma","title":"Firma","cat":"etichette","group":"","src":"B p.187","aliases":["Firma"],"html":"<p>+ Quando guadagni prestigio o nomea mostrando quest'oggetto, segnane 1 in più. (Oggetti mostrabili)</p>","text":"+ Quando guadagni prestigio o nomea mostrando quest'oggetto, segnane 1 in più. (Oggetti mostrabili)","back":["etichette"]},{"id":"tag-flessibile","title":"Flessibile","cat":"etichette","group":"","src":"B p.187","aliases":["Flessibile"],"html":"<p>+ Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a>, segna fatica per ignorare la prima scelta dell'avversario. (Armature)</p>","text":"+ Quando lotti, segna fatica per ignorare la prima scelta dell'avversario. (Armature)","back":["improvvisare-arma","etichette"]},{"id":"tag-flettenti-corti","title":"Flettenti Corti","cat":"etichette","group":"","src":"B p.187","aliases":["Flettenti Corti"],"html":"<p>+ Segna usura per scagliare un <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a> a distanza lunga. (Archi piccoli)</p>","text":"+ Segna usura per scagliare un Tiro Rapido a distanza lunga. (Archi piccoli)","back":["etichette"]},{"id":"tag-forgiato-aquile","title":"Forgiato dalle Aquile","cat":"etichette","group":"","src":"B p.187","aliases":["Forgiato dalle Aquile"],"html":"<p>+ Segna usura quando attacchi in mischia per scambiare i danni una volta in più. (Armature)</p>","text":"+ Segna usura quando attacchi in mischia per scambiare i danni una volta in più. (Armature)","back":["etichette"]},{"id":"tag-grande","title":"Grande","cat":"etichette","group":"","src":"B p.187","aliases":["Grande"],"html":"<p>+ Quando infliggi danno con quest'arma, segna fatica per infliggere 1 danno aggiuntivo. (Armi)</p>","text":"+ Quando infliggi danno con quest'arma, segna fatica per infliggere 1 danno aggiuntivo. (Armi)","back":["etichette"]},{"id":"tag-grilletto","title":"Grilletto Facile","cat":"etichette","group":"","src":"B p.187","aliases":["Grilletto Facile"],"html":"<p>+ Segna usura per prendere la mira a distanza ravvicinata invece che lunga. (Balestre)</p>","text":"+ Segna usura per prendere la mira a distanza ravvicinata invece che lunga. (Balestre)","back":["etichette"]},{"id":"tag-ingannevole","title":"Ingannevole","cat":"etichette","group":"","src":"B p.187","aliases":["Ingannevole"],"html":"<p>+ Quando lo usi per <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> distraendo a distanza, con <span class=\"res\">7-9</span> segna usura per eliminare un'opzione prima che il PNG scelga. (Bolas, archi)</p>","text":"+ Quando lo usi per Ingannare un PNG distraendo a distanza, con 7-9 segna usura per eliminare un'opzione prima che il PNG scelga. (Bolas, archi)","back":["etichette"]},{"id":"tag-kit-guaritore","title":"Kit del Guaritore","cat":"etichette","group":"","src":"B p.187","aliases":["Kit del Guaritore"],"html":"<p>+ Segna usura per svuotare fatica; segna 2-usura per svuotare 1-ferita.</p>","text":"+ Segna usura per svuotare fatica; segna 2-usura per svuotare 1-ferita.","back":["etichette"]},{"id":"tag-kit-ladro","title":"Kit del Ladro","cat":"etichette","group":"","src":"B p.187","aliases":["Kit del Ladro"],"html":"<p>+ Su un <span class=\"res\">7-9</span> di un'impresa da furfante adatta, segna usura sull'oggetto invece della fatica per evitare il rischio. (Strumenti)</p>","text":"+ Su un 7-9 di un'impresa da furfante adatta, segna usura sull'oggetto invece della fatica per evitare il rischio. (Strumenti)","back":["etichette"]},{"id":"tag-lussuoso","title":"Lussuoso","cat":"etichette","group":"","src":"B p.187","aliases":["Lussuoso"],"html":"<p>+ Una volta creato, vale +3 Valore.</p>","text":"+ Una volta creato, vale +3 Valore.","back":["etichette"]},{"id":"tag-modesto","title":"Modesto","cat":"etichette","group":"","src":"B p.188","aliases":["Modesto"],"html":"<p>+ Finché non danneggi un nemico, non ti riterrà più minaccioso di un qualsiasi vagabondo armato. (Abiti, bastoni)</p>","text":"+ Finché non danneggi un nemico, non ti riterrà più minaccioso di un qualsiasi vagabondo armato. (Abiti, bastoni)","back":["etichette"]},{"id":"tag-possente","title":"Possente","cat":"etichette","group":"","src":"B p.188","aliases":["Possente"],"html":"<p>+ Segna fatica per ignorare l'armatura del nemico quando infliggi danni. (Martelli, mazze)</p>","text":"+ Segna fatica per ignorare l'armatura del nemico quando infliggi danni. (Martelli, mazze)","back":["armatura","etichette"]},{"id":"tag-potente","title":"Potente","cat":"etichette","group":"","src":"B p.188","aliases":["Potente"],"html":"<p>+ Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi</a> con quest'oggetto, segna 2-usura per trasformare un fallimento in <span class=\"res\">7-9</span> e un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Esplosivi, armi pesanti)</p>","text":"+ Quando distruggi con quest'oggetto, segna 2-usura per trasformare un fallimento in 7-9 e un 7-9 in 10+. (Esplosivi, armi pesanti)","back":["etichette"]},{"id":"tag-rapida","title":"Rapida","cat":"etichette","group":"","src":"B p.188","aliases":["Rapida"],"html":"<p>+ Segna fatica per attaccare in mischia tirando su Destrezza invece di Vigore. (Armi piccole o veloci)</p>","text":"+ Segna fatica per attaccare in mischia tirando su Destrezza invece di Vigore. (Armi piccole o veloci)","back":["improvvisare-arma","etichette"]},{"id":"tag-smussata","title":"Smussata","cat":"etichette","group":"","src":"B p.188","aliases":["Smussata"],"html":"<p>+ Infligge fatica e non ferite. (Martelli, bastoni)</p>","text":"+ Infligge fatica e non ferite. (Martelli, bastoni)","back":["improvvisare-arma","etichette"]},{"id":"tag-spesso","title":"Spesso","cat":"etichette","group":"","src":"B p.188","aliases":["Spesso"],"html":"<p>+ Quando segni usura su questo scudo per parare un colpo, segni sempre solo 1-usura. (Scudi)</p>","text":"+ Quando segni usura su questo scudo per parare un colpo, segni sempre solo 1-usura. (Scudi)","back":["etichette"]},{"id":"tag-tonificante","title":"Tonificante","cat":"etichette","group":"","src":"B p.188","aliases":["Tonificante"],"html":"<p>+ Quando vi rilassate mangiando o bevendo da quest'oggetto in gruppo, segna 3-usura (+1 per ogni partecipante oltre il terzo): tutti svuotano la fatica. (Pasti, fiaschette)</p>","text":"+ Quando vi rilassate mangiando o bevendo da quest'oggetto in gruppo, segna 3-usura (+1 per ogni partecipante oltre il terzo): tutti svuotano la fatica. (Pasti, fiaschette)","back":["etichette"]},{"id":"tag-veloce","title":"Veloce","cat":"etichette","group":"","src":"B p.188","aliases":["Veloce"],"html":"<p>+ Segna usura quando attacchi in mischia per subire 1 danno in meno, anche con un fallimento. (Armi piccole o sottili)</p>","text":"+ Segna usura quando attacchi in mischia per subire 1 danno in meno, anche con un fallimento. (Armi piccole o sottili)","back":["improvvisare-arma","etichette"]},{"id":"tag-versatile","title":"Versatile","cat":"etichette","group":"","src":"B p.188","aliases":["Versatile"],"html":"<p>+ Quando entri o esci dal raggio dell'arma, segna usura per un rapido colpo a chiunque sia nel raggio. (Armi veloci)</p>","text":"+ Quando entri o esci dal raggio dell'arma, segna usura per un rapido colpo a chiunque sia nel raggio. (Armi veloci)","back":["etichette"]},{"id":"tag-brutto","title":"Brutto","cat":"etichette","group":"","src":"B p.188","aliases":["Brutto"],"html":"<p>− -1 a <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a> quando lo mostri; segna fatica per nasconderlo.</p>","text":"− -1 a Incontrare Qualcuno di Importante quando lo mostri; segna fatica per nasconderlo.","back":["etichette"]},{"id":"tag-fragile","title":"Fragile","cat":"etichette","group":"","src":"B p.188","aliases":["Fragile"],"html":"<p>− Quando fai una mossa con le armi, segna usura su quest'arma; segna fatica per ignorarlo. (Armi leggere)</p>","text":"− Quando fai una mossa con le armi, segna usura su quest'arma; segna fatica per ignorarlo. (Armi leggere)","back":["improvvisare-arma","etichette"]},{"id":"tag-ingombrante","title":"Ingombrante","cat":"etichette","group":"","src":"B p.188","aliases":["Ingombrante"],"html":"<p>− Non si può nascondere; segna fatica ogni volta che tenti (o ti affidi al fato per) sgattaiolare, nasconderti, attaccare alle spalle o acrobazie. (Armi grandi)</p>","text":"− Non si può nascondere; segna fatica ogni volta che tenti (o ti affidi al fato per) sgattaiolare, nasconderti, attaccare alle spalle o acrobazie. (Armi grandi)","back":["etichette"]},{"id":"tag-lenta","title":"Lenta","cat":"etichette","group":"","src":"B p.188","aliases":["Lenta"],"html":"<p>− Attaccando in mischia scegli un'opzione in meno; segna usura per ignorarlo. (Armi pesanti)</p>","text":"− Attaccando in mischia scegli un'opzione in meno; segna usura per ignorarlo. (Armi pesanti)","back":["improvvisare-arma","etichette"]},{"id":"tag-empio","title":"Empio","cat":"etichette","group":"","src":"B p.188","aliases":["Empio"],"html":"<p>− Chi la vede ti ritiene una minaccia; per ogni danno inflitto segna 1-nomea con la fazione che osserva. (Armi brutali)</p>","text":"− Chi la vede ti ritiene una minaccia; per ogni danno inflitto segna 1-nomea con la fazione che osserva. (Armi brutali)","back":["etichette"]},{"id":"tag-odiato","title":"Odiato","cat":"etichette","group":"","src":"B p.189","aliases":["Odiato"],"html":"<p>− Mostrandolo hai -2 Reputazione con la fazione che lo detesta; i nemici di quella fazione svuotano il morale.</p>","text":"− Mostrandolo hai -2 Reputazione con la fazione che lo detesta; i nemici di quella fazione svuotano il morale.","back":["etichette"]},{"id":"tag-pesante","title":"Pesante","cat":"etichette","group":"","src":"B p.189","aliases":["Pesante"],"html":"<p>− Conta 1 Ingombro in più. (Oggetti grandi)</p>","text":"− Conta 1 Ingombro in più. (Oggetti grandi)","back":["etichette"]},{"id":"tag-scadente","title":"Scadente","cat":"etichette","group":"","src":"B p.189","aliases":["Scadente"],"html":"<p>− Ripararlo costa il doppio del Valore per casella.</p>","text":"− Ripararlo costa il doppio del Valore per casella.","back":["etichette"]},{"id":"tag-scomoda","title":"Scomoda","cat":"etichette","group":"","src":"B p.189","aliases":["Scomoda"],"html":"<p>− Segna 1-fatica quando indossi l'armatura, svuota 1-fatica quando la togli. (Armature pesanti)</p>","text":"− Segna 1-fatica quando indossi l'armatura, svuota 1-fatica quando la togli. (Armature pesanti)","back":["etichette"]},{"id":"tag-poco-maneggevole","title":"Poco Maneggevole","cat":"etichette","group":"","src":"B p.189","aliases":["Poco Maneggevole"],"html":"<p>− -1 a tutte le mosse con le armi con quest'arma; segna fatica per ignorarlo.</p>","text":"− -1 a tutte le mosse con le armi con quest'arma; segna fatica per ignorarlo.","back":["improvvisare-arma","etichette"]},{"id":"equipaggiamento-pregenerato","title":"Equipaggiamento Pregenerato","cat":"equipaggiamento","group":"","src":"B p.191-192","aliases":["equipaggiamento pregenerato","pugnale","spadone","arco lungo","balestra","cotta di maglia"],"html":"<p>Modelli comuni (il Valore si ricalcola aggiungendo o togliendo usura, distanze ed etichette; Ingombro tra parentesi; usura: vedi manuale):</p><ul><li><strong>Pugnale</strong> — V5 (0) — a contatto, ravvicinata — Parare, Colpo Crudele — Rapida.</li><li><strong>Spada Corta dei Topi</strong> — V6 (1) — ravvicinata — Parare, Disarmare — Acciaio dei Topi.</li><li><strong>Spada Lunga delle Volpi</strong> — V5 (1) — ravvicinata — Disarmare, Colpo Crudele — Acciaio delle Volpi.</li><li><strong>Ascia dei Conigli</strong> — V4 (1) — ravvicinata — Disarmare — Acciaio dei Conigli.</li><li><strong>Martello da Fabbro</strong> — V5 (1) — a contatto, ravvicinata — Fracassare — Possente.</li><li><strong>Bastone</strong> — V4 (1) — ravvicinata — Parare — Smussata.</li><li><strong>Bastone da Combattimento</strong> — V6 (1) — ravvicinata — Parare — Allungo, Smussata.</li><li><strong>Arco Corto</strong> — V6 (1) — Tiro Rapido — Flettenti Corti.</li><li><strong>Arco Lungo</strong> — V5 (1) — lunga — Incalzare un Gruppo.</li><li><strong>Arco di Precisione</strong> — V6 (1) — Incalzare, Tiro da Maestro.</li><li><strong>Balestra</strong> — V6 (1) — lunga — Tiro da Maestro — Corda Ingrassata, Grilletto Facile, Dardo di Ferro.</li><li><strong>Fionda e Pietre</strong> — V3 (0) — ravvicinata — Incalzare un Gruppo.</li><li><strong>Spadone</strong> — V6 (2) — ravvicinata — Fracassare, Assaltare, Disarmare — Affilata, Grande, Ingombrante.</li><li><strong>Armatura di Cuoio</strong> — V3 (1) — Flessibile.</li><li><strong>Cotta di Maglia</strong> — V3 (2) — Buona Fattura, Pesante.</li><li><strong>Armatura di Piastre</strong> — V3 (2) — A Prova di Freccia, Scomoda, Pesante.</li><li><strong>Tunica</strong> — V2 (1).</li></ul>","text":"Modelli comuni (il Valore si ricalcola aggiungendo o togliendo usura, distanze ed etichette; Ingombro tra parentesi; usura: vedi manuale): - Pugnale — V5 (0) — a contatto, ravvicinata — Parare, Colpo Crudele — Rapida. - Spada Corta dei Topi — V6 (1) — ravvicinata — Parare, Disarmare — Acciaio dei Topi. - Spada Lunga delle Volpi — V5 (1) — ravvicinata — Disarmare, Colpo Crudele — Acciaio delle Volpi. - Ascia dei Conigli — V4 (1) — ravvicinata — Disarmare — Acciaio dei Conigli. - Martello da Fabbro — V5 (1) — a contatto, ravvicinata — Fracassare — Possente. - Bastone — V4 (1) — ravvicinata — Parare — Smussata. - Bastone da Combattimento — V6 (1) — ravvicinata — Parare — Allungo, Smussata. - Arco Corto — V6 (1) — Tiro Rapido — Flettenti Corti. - Arco Lungo — V5 (1) — lunga — Incalzare un Gruppo. - Arco di Precisione — V6 (1) — Incalzare, Tiro da Maestro. - Balestra — V6 (1) — lunga — Tiro da Maestro — Corda Ingrassata, Grilletto Facile, Dardo di Ferro. - Fionda e Pietre — V3 (0) — ravvicinata — Incalzare un Gruppo. - Spadone — V6 (2) — ravvicinata — Fracassare, Assaltare, Disarmare — Affilata, Grande, Ingombrante. - Armatura di Cuoio — V3 (1) — Flessibile. - Cotta di Maglia — V3 (2) — Buona Fattura, Pesante. - Armatura di Piastre — V3 (2) — A Prova di Freccia, Scomoda, Pesante. - Tunica — V2 (1).","back":["armatura","equipaggiamento"]},{"id":"playbook-indice","title":"I Playbook","cat":"indici","group":"","src":"B p.131-168; VF p.91-132; RS p.65-96","aliases":["playbook","playbooks","scheda del personaggio"],"html":"<p>Ogni giocatore usa un playbook diverso. I playbook dei supplementi sono consigliati a giocatori esperti.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#pb-avventuriero\" data-id=\"pb-avventuriero\">L'Avventuriero</a>, <a class=\"xl\" href=\"#pb-canaglia\" data-id=\"pb-canaglia\">La Canaglia</a>, <a class=\"xl\" href=\"#pb-ciarlatano\" data-id=\"pb-ciarlatano\">Il Ciarlatano</a>, <a class=\"xl\" href=\"#pb-giudice\" data-id=\"pb-giudice\">Il Giudice</a>, <a class=\"xl\" href=\"#pb-ladro\" data-id=\"pb-ladro\">Il Ladro</a>, <a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Il Mastro</a>, <a class=\"xl\" href=\"#pb-predone\" data-id=\"pb-predone\">Il Predone</a>, <a class=\"xl\" href=\"#pb-ranger\" data-id=\"pb-ranger\">Il Ranger</a>, <a class=\"xl\" href=\"#pb-ronin\" data-id=\"pb-ronin\">Il Ronin</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#pb-campione\" data-id=\"pb-campione\">Il Campione</a>, <a class=\"xl\" href=\"#pb-cronista\" data-id=\"pb-cronista\">Il Cronista</a>, <a class=\"xl\" href=\"#pb-emissario\" data-id=\"pb-emissario\">L'Ambasciatore</a>, <a class=\"xl\" href=\"#pb-esule\" data-id=\"pb-esule\">L'Esule</a>, <a class=\"xl\" href=\"#pb-eretico\" data-id=\"pb-eretico\">L'Eretico</a>, <a class=\"xl\" href=\"#pb-pirata\" data-id=\"pb-pirata\">Il Pirata</a>, <a class=\"xl\" href=\"#pb-principe\" data-id=\"pb-principe\">L'Erede</a>, <a class=\"xl\" href=\"#pb-cantastorie\" data-id=\"pb-cantastorie\">Il Cantastorie</a>, <a class=\"xl\" href=\"#pb-razziatore\" data-id=\"pb-razziatore\">Il Razziatore</a>, <a class=\"xl\" href=\"#pb-cercatore\" data-id=\"pb-cercatore\">Il Cercatore</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#pb-trafficante\" data-id=\"pb-trafficante\">Il Trafficante</a>, <a class=\"xl\" href=\"#pb-buongustaio\" data-id=\"pb-buongustaio\">Lo Chef</a>, <a class=\"xl\" href=\"#pb-cacciatore\" data-id=\"pb-cacciatore\">Il Cacciatore</a>, <a class=\"xl\" href=\"#pb-nomade\" data-id=\"pb-nomade\">Il Nomade</a>, <a class=\"xl\" href=\"#pb-orfano\" data-id=\"pb-orfano\">L'Orfano</a>, <a class=\"xl\" href=\"#pb-flagello\" data-id=\"pb-flagello\">Il Flagello</a>.</p><p>I nomi dei playbook e delle loro mosse seguono le schede ufficiali MS Edizioni dei due supplementi.</p>","text":"Ogni giocatore usa un playbook diverso. I playbook dei supplementi sono consigliati a giocatori esperti. Manuale base: L'Avventuriero, La Canaglia, Il Ciarlatano, Il Giudice, Il Ladro, Il Mastro, Il Predone, Il Ranger, Il Ronin. Viandanti e Forestieri: Il Campione, Il Cronista, L'Ambasciatore, L'Esule, L'Eretico, Il Pirata, L'Erede, Il Cantastorie, Il Razziatore, Il Cercatore. Rovine e Spedizioni: Il Trafficante, Lo Chef, Il Cacciatore, Il Nomade, L'Orfano, Il Flagello. I nomi dei playbook e delle loro mosse seguono le schede ufficiali MS Edizioni dei due supplementi.","back":["creazione"]},{"id":"pb-avventuriero","title":"L'Avventuriero","cat":"playbook","group":"Manuale Base","src":"B p.133-136","aliases":["Avventuriero"],"html":"<p><em>Un vagabondo pacifico e diplomatico: stringe alleanze aiutando gli altri e rovescia i poteri forti con le parole.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza 0, Fortuna 0, Vigore -1 (+1 a scelta, max +2)</li><li><strong>Abilità con le armi iniziale</strong> (una): Disarmare, Incalzare, Improvvisare, Parare</li><li><strong>Imprese</strong>: Falsificare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, gufo</li></ul><p><strong>Natura</strong> (una)</p><ul><li><em>Estroverso</em>: svuota la fatica quando condividi con qualcuno un momento intenso di vera amicizia o divertimento.</li><li><em>Pacifista</em>: svuota la fatica quando risolvi un conflitto senza violenza.</li></ul><p><strong>Motivazioni</strong> (due): <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>.</p><p><strong>Legami</strong>: Compagno (avete difeso invano una radura insieme), Amico (viaggiate insieme da quando sei diventato vagabondo).</p><p><strong>Mosse</strong> (scegline tre): <a class=\"xl\" href=\"#pb-avventuriero-reputazione\" data-id=\"pb-avventuriero-reputazione\">Reputazione Impeccabile</a>, <a class=\"xl\" href=\"#pb-avventuriero-sottomettere\" data-id=\"pb-avventuriero-sottomettere\">Sottomettere</a>, <a class=\"xl\" href=\"#pb-avventuriero-polso\" data-id=\"pb-avventuriero-polso\">Il Polso della Situazione</a>, <a class=\"xl\" href=\"#pb-avventuriero-oratore\" data-id=\"pb-avventuriero-oratore\">Oratore</a>, <a class=\"xl\" href=\"#pb-avventuriero-erudito\" data-id=\"pb-avventuriero-erudito\">Erudito</a>, <a class=\"xl\" href=\"#pb-avventuriero-amici\" data-id=\"pb-avventuriero-amici\">Subito Amici</a>.</p>","text":"Un vagabondo pacifico e diplomatico: stringe alleanze aiutando gli altri e rovescia i poteri forti con le parole. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza 0, Fortuna 0, Vigore -1 (+1 a scelta, max +2) - Abilità con le armi iniziale (una): Disarmare, Incalzare, Improvvisare, Parare - Imprese: Falsificare, Gioco di Prestigio - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, gufo Natura (una) - Estroverso: svuota la fatica quando condividi con qualcuno un momento intenso di vera amicizia o divertimento. - Pacifista: svuota la fatica quando risolvi un conflitto senza violenza. Motivazioni (due): Ambizione, Zampe Pulite, Princìpi, Giustizia. Legami: Compagno (avete difeso invano una radura insieme), Amico (viaggiate insieme da quando sei diventato vagabondo). Mosse (scegline tre): Reputazione Impeccabile, Sottomettere, Il Polso della Situazione, Oratore, Erudito, Subito Amici.","back":["playbook-indice","nature-indice"]},{"id":"pb-avventuriero-reputazione","title":"Reputazione Impeccabile","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Reputazione Impeccabile"],"html":"<p>Quando segni prestigio con una fazione, segnane una casella in più. Quando dovresti segnare nomea, puoi invece <strong>svuotare</strong> altrettante caselle di prestigio (consigliato: la nomea danneggia di più).</p>","text":"Quando segni prestigio con una fazione, segnane una casella in più. Quando dovresti segnare nomea, puoi invece svuotare altrettante caselle di prestigio (consigliato: la nomea danneggia di più).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-sottomettere","title":"Sottomettere","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Sottomettere"],"html":"<p>Quando vuoi sottomettere rapidamente un avversario senza ucciderlo, puoi <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su <strong>Astuzia</strong> invece di Vigore, ma non puoi infliggere un danno grave. Serve un'arma adatta (che infligge fatica è non letale).</p>","text":"Quando vuoi sottomettere rapidamente un avversario senza ucciderlo, puoi attaccare in mischia tirando su Astuzia invece di Vigore, ma non puoi infliggere un danno grave. Serve un'arma adatta (che infligge fatica è non letale).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-polso","title":"Il Polso della Situazione","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Il Polso della Situazione"],"html":"<p>Quando raccogli informazioni su ciò che succede in una radura, tira su <strong>Astuzia</strong>. Con <span class=\"res\">10+</span> fai 3 domande, con <span class=\"res\">7-9</span> due:</p><ul><li>Chi comanda in questa radura?</li><li>Chi sono i ribelli locali?</li><li>Cosa temono gli abitanti?</li><li>Cosa vorrebbero gli abitanti?</li><li>Quali opportunità ci sono per un vagabondo intraprendente?</li></ul><p>Con un fallimento attiri l'attenzione di qualcuno di pericoloso. Richiede tempo per girare e fare domande.</p>","text":"Quando raccogli informazioni su ciò che succede in una radura, tira su Astuzia. Con 10+ fai 3 domande, con 7-9 due: - Chi comanda in questa radura? - Chi sono i ribelli locali? - Cosa temono gli abitanti? - Cosa vorrebbero gli abitanti? - Quali opportunità ci sono per un vagabondo intraprendente? Con un fallimento attiri l'attenzione di qualcuno di pericoloso. Richiede tempo per girare e fare domande.","back":["pb-avventuriero"]},{"id":"pb-avventuriero-oratore","title":"Oratore","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Oratore"],"html":"<p>Quando tieni un discorso a un gruppo di abitanti potenzialmente interessati, spiega quale azione li incoraggi a fare e tira su <strong>Carisma</strong>. Con un successo lo fanno, ma a modo loro; scegli 2 (<span class=\"res\">10+</span>) o 1 (<span class=\"res\">7-9</span>): non esagerano; non si disperdono al primo segno di resistenza; non ti chiedono di guidarli. Con un fallimento distorcono il messaggio in modo imprevedibile.</p>","text":"Quando tieni un discorso a un gruppo di abitanti potenzialmente interessati, spiega quale azione li incoraggi a fare e tira su Carisma. Con un successo lo fanno, ma a modo loro; scegli 2 (10+) o 1 (7-9): non esagerano; non si disperdono al primo segno di resistenza; non ti chiedono di guidarli. Con un fallimento distorcono il messaggio in modo imprevedibile.","back":["pb-avventuriero"]},{"id":"pb-avventuriero-erudito","title":"Erudito","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Erudito"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-amici","title":"Subito Amici","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Subito Amici"],"html":"<p>Quando cerchi di fare amicizia con un PNG appena conosciuto adattandoti alla sua personalità, segna fatica e tira su <strong>Astuzia</strong>. Con un successo ha una buona opinione di te: risponde con sincerità a una domanda non compromettente o ti fa un piccolo favore. Con <span class=\"res\">10+</span> gli piaci davvero: ti confida un prezioso segreto o ti fa un favore enorme. Con un fallimento hai frainteso e la sua disapprovazione ha conseguenze.</p>","text":"Quando cerchi di fare amicizia con un PNG appena conosciuto adattandoti alla sua personalità, segna fatica e tira su Astuzia. Con un successo ha una buona opinione di te: risponde con sincerità a una domanda non compromettente o ti fa un piccolo favore. Con 10+ gli piaci davvero: ti confida un prezioso segreto o ti fa un favore enorme. Con un fallimento hai frainteso e la sua disap
