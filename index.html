e","group":"","src":"B p.187","aliases":["Dardo di Ferro"],"html":"<p>+ Quando il suo danno viene assorbito dall'armatura, infligge 1-usura aggiuntiva. (Archi, balestre)</p>","text":"+ Quando il suo danno viene assorbito dall'armatura, infligge 1-usura aggiuntiva. (Archi, balestre)","back":["etichette"]},{"id":"tag-durevole","title":"Durevole","cat":"etichette","group":"","src":"B p.187","aliases":["Durevole"],"html":"<p>+ Se l'oggetto verrebbe distrutto, rimuovi invece definitivamente 1 casella di usura; senza usura è distrutto.</p>","text":"+ Se l'oggetto verrebbe distrutto, rimuovi invece definitivamente 1 casella di usura; senza usura è distrutto.","back":["etichette"]},{"id":"tag-firma","title":"Firma","cat":"etichette","group":"","src":"B p.187","aliases":["Firma"],"html":"<p>+ Quando guadagni prestigio o nomea mostrando quest'oggetto, segnane 1 in più. (Oggetti mostrabili)</p>","text":"+ Quando guadagni prestigio o nomea mostrando quest'oggetto, segnane 1 in più. (Oggetti mostrabili)","back":["etichette"]},{"id":"tag-flessibile","title":"Flessibile","cat":"etichette","group":"","src":"B p.187","aliases":["Flessibile"],"html":"<p>+ Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a>, segna fatica per ignorare la prima scelta dell'avversario. (Armature)</p>","text":"+ Quando lotti, segna fatica per ignorare la prima scelta dell'avversario. (Armature)","back":["improvvisare-arma","etichette"]},{"id":"tag-flettenti-corti","title":"Flettenti Corti","cat":"etichette","group":"","src":"B p.187","aliases":["Flettenti Corti"],"html":"<p>+ Segna usura per scagliare un <a class=\"xl\" href=\"#tiro-rapido\" data-id=\"tiro-rapido\">Tiro Rapido</a> a distanza lunga. (Archi piccoli)</p>","text":"+ Segna usura per scagliare un Tiro Rapido a distanza lunga. (Archi piccoli)","back":["etichette"]},{"id":"tag-forgiato-aquile","title":"Forgiato dalle Aquile","cat":"etichette","group":"","src":"B p.187","aliases":["Forgiato dalle Aquile"],"html":"<p>+ Segna usura quando attacchi in mischia per scambiare i danni una volta in più. (Armature)</p>","text":"+ Segna usura quando attacchi in mischia per scambiare i danni una volta in più. (Armature)","back":["etichette"]},{"id":"tag-grande","title":"Grande","cat":"etichette","group":"","src":"B p.187","aliases":["Grande"],"html":"<p>+ Quando infliggi danno con quest'arma, segna fatica per infliggere 1 danno aggiuntivo. (Armi)</p>","text":"+ Quando infliggi danno con quest'arma, segna fatica per infliggere 1 danno aggiuntivo. (Armi)","back":["etichette"]},{"id":"tag-grilletto","title":"Grilletto Facile","cat":"etichette","group":"","src":"B p.187","aliases":["Grilletto Facile"],"html":"<p>+ Segna usura per prendere la mira a distanza ravvicinata invece che lunga. (Balestre)</p>","text":"+ Segna usura per prendere la mira a distanza ravvicinata invece che lunga. (Balestre)","back":["etichette"]},{"id":"tag-ingannevole","title":"Ingannevole","cat":"etichette","group":"","src":"B p.187","aliases":["Ingannevole"],"html":"<p>+ Quando lo usi per <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> distraendo a distanza, con <span class=\"res\">7-9</span> segna usura per eliminare un'opzione prima che il PNG scelga. (Bolas, archi)</p>","text":"+ Quando lo usi per Ingannare un PNG distraendo a distanza, con 7-9 segna usura per eliminare un'opzione prima che il PNG scelga. (Bolas, archi)","back":["etichette"]},{"id":"tag-kit-guaritore","title":"Kit del Guaritore","cat":"etichette","group":"","src":"B p.187","aliases":["Kit del Guaritore"],"html":"<p>+ Segna usura per svuotare fatica; segna 2-usura per svuotare 1-ferita.</p>","text":"+ Segna usura per svuotare fatica; segna 2-usura per svuotare 1-ferita.","back":["etichette"]},{"id":"tag-kit-ladro","title":"Kit del Ladro","cat":"etichette","group":"","src":"B p.187","aliases":["Kit del Ladro"],"html":"<p>+ Su un <span class=\"res\">7-9</span> di un'impresa da furfante adatta, segna usura sull'oggetto invece della fatica per evitare il rischio. (Strumenti)</p>","text":"+ Su un 7-9 di un'impresa da furfante adatta, segna usura sull'oggetto invece della fatica per evitare il rischio. (Strumenti)","back":["etichette"]},{"id":"tag-lussuoso","title":"Lussuoso","cat":"etichette","group":"","src":"B p.187","aliases":["Lussuoso"],"html":"<p>+ Una volta creato, vale +3 Valore.</p>","text":"+ Una volta creato, vale +3 Valore.","back":["etichette"]},{"id":"tag-modesto","title":"Modesto","cat":"etichette","group":"","src":"B p.188","aliases":["Modesto"],"html":"<p>+ Finché non danneggi un nemico, non ti riterrà più minaccioso di un qualsiasi vagabondo armato. (Abiti, bastoni)</p>","text":"+ Finché non danneggi un nemico, non ti riterrà più minaccioso di un qualsiasi vagabondo armato. (Abiti, bastoni)","back":["etichette"]},{"id":"tag-possente","title":"Possente","cat":"etichette","group":"","src":"B p.188","aliases":["Possente"],"html":"<p>+ Segna fatica per ignorare l'armatura del nemico quando infliggi danni. (Martelli, mazze)</p>","text":"+ Segna fatica per ignorare l'armatura del nemico quando infliggi danni. (Martelli, mazze)","back":["armatura","etichette"]},{"id":"tag-potente","title":"Potente","cat":"etichette","group":"","src":"B p.188","aliases":["Potente"],"html":"<p>+ Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi</a> con quest'oggetto, segna 2-usura per trasformare un fallimento in <span class=\"res\">7-9</span> e un <span class=\"res\">7-9</span> in <span class=\"res\">10+</span>. (Esplosivi, armi pesanti)</p>","text":"+ Quando distruggi con quest'oggetto, segna 2-usura per trasformare un fallimento in 7-9 e un 7-9 in 10+. (Esplosivi, armi pesanti)","back":["etichette"]},{"id":"tag-rapida","title":"Rapida","cat":"etichette","group":"","src":"B p.188","aliases":["Rapida"],"html":"<p>+ Segna fatica per <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su Destrezza invece di Vigore. (Armi piccole o veloci)</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 3 opzioni di <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a>.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"+ Segna fatica per attaccare in mischia tirando su Destrezza invece di Vigore. (Armi piccole o veloci) - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni di Attaccare in Mischia. - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["improvvisare-arma","etichette"]},{"id":"tag-smussata","title":"Smussata","cat":"etichette","group":"","src":"B p.188","aliases":["Smussata"],"html":"<p>+ Infligge fatica e non ferite. (Martelli, bastoni)</p>","text":"+ Infligge fatica e non ferite. (Martelli, bastoni)","back":["improvvisare-arma","etichette"]},{"id":"tag-spesso","title":"Spesso","cat":"etichette","group":"","src":"B p.188","aliases":["Spesso"],"html":"<p>+ Quando segni usura su questo scudo per parare un colpo, segni sempre solo 1-usura. (Scudi)</p>","text":"+ Quando segni usura su questo scudo per parare un colpo, segni sempre solo 1-usura. (Scudi)","back":["etichette"]},{"id":"tag-tonificante","title":"Tonificante","cat":"etichette","group":"","src":"B p.188","aliases":["Tonificante"],"html":"<p>+ Quando vi rilassate mangiando o bevendo da quest'oggetto in gruppo, segna 3-usura (+1 per ogni partecipante oltre il terzo): tutti svuotano la fatica. (Pasti, fiaschette)</p>","text":"+ Quando vi rilassate mangiando o bevendo da quest'oggetto in gruppo, segna 3-usura (+1 per ogni partecipante oltre il terzo): tutti svuotano la fatica. (Pasti, fiaschette)","back":["etichette","tag-stagionato"]},{"id":"tag-veloce","title":"Veloce","cat":"etichette","group":"","src":"B p.188","aliases":["Veloce"],"html":"<p>+ Segna usura quando attacchi in mischia per subire 1 danno in meno, anche con un fallimento. (Armi piccole o sottili)</p>","text":"+ Segna usura quando attacchi in mischia per subire 1 danno in meno, anche con un fallimento. (Armi piccole o sottili)","back":["improvvisare-arma","etichette"]},{"id":"tag-versatile","title":"Versatile","cat":"etichette","group":"","src":"B p.188","aliases":["Versatile"],"html":"<p>+ Quando entri o esci dal raggio dell'arma, segna usura per un rapido colpo a chiunque sia nel raggio. (Armi veloci)</p>","text":"+ Quando entri o esci dal raggio dell'arma, segna usura per un rapido colpo a chiunque sia nel raggio. (Armi veloci)","back":["etichette"]},{"id":"tag-brutto","title":"Brutto","cat":"etichette","group":"","src":"B p.188","aliases":["Brutto"],"html":"<p>− -1 a <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">Incontrare Qualcuno di Importante</a> quando lo mostri; segna fatica per nasconderlo.</p>","text":"− -1 a Incontrare Qualcuno di Importante quando lo mostri; segna fatica per nasconderlo.","back":["etichette"]},{"id":"tag-fragile","title":"Fragile","cat":"etichette","group":"","src":"B p.188","aliases":["Fragile"],"html":"<p>− Quando fai una mossa con le armi, segna usura su quest'arma; segna fatica per ignorarlo. (Armi leggere)</p>","text":"− Quando fai una mossa con le armi, segna usura su quest'arma; segna fatica per ignorarlo. (Armi leggere)","back":["improvvisare-arma","etichette"]},{"id":"tag-ingombrante","title":"Ingombrante","cat":"etichette","group":"","src":"B p.188","aliases":["Ingombrante"],"html":"<p>− Non si può nascondere; segna fatica ogni volta che tenti (o ti affidi al fato per) sgattaiolare, nasconderti, attaccare alle spalle o acrobazie. (Armi grandi)</p>","text":"− Non si può nascondere; segna fatica ogni volta che tenti (o ti affidi al fato per) sgattaiolare, nasconderti, attaccare alle spalle o acrobazie. (Armi grandi)","back":["etichette"]},{"id":"tag-lenta","title":"Lenta","cat":"etichette","group":"","src":"B p.188","aliases":["Lenta"],"html":"<p>− Attaccando in mischia scegli un'opzione in meno; segna usura per ignorarlo. (Armi pesanti)</p>","text":"− Attaccando in mischia scegli un'opzione in meno; segna usura per ignorarlo. (Armi pesanti)","back":["improvvisare-arma","etichette"]},{"id":"tag-empio","title":"Empio","cat":"etichette","group":"","src":"B p.188","aliases":["Empio"],"html":"<p>− Chi la vede ti ritiene una minaccia; per ogni danno inflitto segna 1-nomea con la fazione che osserva. (Armi brutali)</p>","text":"− Chi la vede ti ritiene una minaccia; per ogni danno inflitto segna 1-nomea con la fazione che osserva. (Armi brutali)","back":["etichette"]},{"id":"tag-odiato","title":"Odiato","cat":"etichette","group":"","src":"B p.189","aliases":["Odiato"],"html":"<p>− Mostrandolo hai -2 Reputazione con la fazione che lo detesta; i nemici di quella fazione svuotano il morale.</p>","text":"− Mostrandolo hai -2 Reputazione con la fazione che lo detesta; i nemici di quella fazione svuotano il morale.","back":["etichette"]},{"id":"tag-pesante","title":"Pesante","cat":"etichette","group":"","src":"B p.189","aliases":["Pesante"],"html":"<p>− Conta 1 Ingombro in più. (Oggetti grandi)</p>","text":"− Conta 1 Ingombro in più. (Oggetti grandi)","back":["etichette"]},{"id":"tag-scadente","title":"Scadente","cat":"etichette","group":"","src":"B p.189","aliases":["Scadente"],"html":"<p>− Ripararlo costa il doppio del Valore per casella.</p>","text":"− Ripararlo costa il doppio del Valore per casella.","back":["etichette"]},{"id":"tag-scomoda","title":"Scomoda","cat":"etichette","group":"","src":"B p.189","aliases":["Scomoda"],"html":"<p>− Segna 1-fatica quando indossi l'armatura, svuota 1-fatica quando la togli. (Armature pesanti)</p>","text":"− Segna 1-fatica quando indossi l'armatura, svuota 1-fatica quando la togli. (Armature pesanti)","back":["etichette"]},{"id":"tag-poco-maneggevole","title":"Poco Maneggevole","cat":"etichette","group":"","src":"B p.189","aliases":["Poco Maneggevole"],"html":"<p>− -1 a tutte le mosse con le armi con quest'arma; segna fatica per ignorarlo.</p>","text":"− -1 a tutte le mosse con le armi con quest'arma; segna fatica per ignorarlo.","back":["improvvisare-arma","etichette"]},{"id":"equipaggiamento-pregenerato","title":"Equipaggiamento Pregenerato","cat":"equipaggiamento","group":"","src":"B p.191-192","aliases":["equipaggiamento pregenerato","pugnale","spadone","arco lungo","balestra","cotta di maglia"],"html":"<p>Modelli comuni (il Valore si ricalcola aggiungendo o togliendo usura, distanze ed etichette; Ingombro tra parentesi; usura: vedi manuale):</p><ul><li><strong>Pugnale</strong> — V5 (0) — a contatto, ravvicinata — Parare, Colpo Crudele — Rapida.</li><li><strong>Spada Corta dei Topi</strong> — V6 (1) — ravvicinata — Parare, Disarmare — Acciaio dei Topi.</li><li><strong>Spada Lunga delle Volpi</strong> — V5 (1) — ravvicinata — Disarmare, Colpo Crudele — Acciaio delle Volpi.</li><li><strong>Ascia dei Conigli</strong> — V4 (1) — ravvicinata — Disarmare — Acciaio dei Conigli.</li><li><strong>Martello da Fabbro</strong> — V5 (1) — a contatto, ravvicinata — Fracassare — Possente.</li><li><strong>Bastone</strong> — V4 (1) — ravvicinata — Parare — Smussata.</li><li><strong>Bastone da Combattimento</strong> — V6 (1) — ravvicinata — Parare — Allungo, Smussata.</li><li><strong>Arco Corto</strong> — V6 (1) — Tiro Rapido — Flettenti Corti.</li><li><strong>Arco Lungo</strong> — V5 (1) — lunga — Incalzare un Gruppo.</li><li><strong>Arco di Precisione</strong> — V6 (1) — Incalzare, Tiro da Maestro.</li><li><strong>Balestra</strong> — V6 (1) — lunga — Tiro da Maestro — Corda Ingrassata, Grilletto Facile, Dardo di Ferro.</li><li><strong>Fionda e Pietre</strong> — V3 (0) — ravvicinata — Incalzare un Gruppo.</li><li><strong>Spadone</strong> — V6 (2) — ravvicinata — Fracassare, Assaltare, Disarmare — Affilata, Grande, Ingombrante.</li><li><strong>Armatura di Cuoio</strong> — V3 (1) — Flessibile.</li><li><strong>Cotta di Maglia</strong> — V3 (2) — Buona Fattura, Pesante.</li><li><strong>Armatura di Piastre</strong> — V3 (2) — A Prova di Freccia, Scomoda, Pesante.</li><li><strong>Tunica</strong> — V2 (1).</li></ul>","text":"Modelli comuni (il Valore si ricalcola aggiungendo o togliendo usura, distanze ed etichette; Ingombro tra parentesi; usura: vedi manuale): - Pugnale — V5 (0) — a contatto, ravvicinata — Parare, Colpo Crudele — Rapida. - Spada Corta dei Topi — V6 (1) — ravvicinata — Parare, Disarmare — Acciaio dei Topi. - Spada Lunga delle Volpi — V5 (1) — ravvicinata — Disarmare, Colpo Crudele — Acciaio delle Volpi. - Ascia dei Conigli — V4 (1) — ravvicinata — Disarmare — Acciaio dei Conigli. - Martello da Fabbro — V5 (1) — a contatto, ravvicinata — Fracassare — Possente. - Bastone — V4 (1) — ravvicinata — Parare — Smussata. - Bastone da Combattimento — V6 (1) — ravvicinata — Parare — Allungo, Smussata. - Arco Corto — V6 (1) — Tiro Rapido — Flettenti Corti. - Arco Lungo — V5 (1) — lunga — Incalzare un Gruppo. - Arco di Precisione — V6 (1) — Incalzare, Tiro da Maestro. - Balestra — V6 (1) — lunga — Tiro da Maestro — Corda Ingrassata, Grilletto Facile, Dardo di Ferro. - Fionda e Pietre — V3 (0) — ravvicinata — Incalzare un Gruppo. - Spadone — V6 (2) — ravvicinata — Fracassare, Assaltare, Disarmare — Affilata, Grande, Ingombrante. - Armatura di Cuoio — V3 (1) — Flessibile. - Cotta di Maglia — V3 (2) — Buona Fattura, Pesante. - Armatura di Piastre — V3 (2) — A Prova di Freccia, Scomoda, Pesante. - Tunica — V2 (1).","back":["armatura","equipaggiamento"]},{"id":"playbook-indice","title":"I Playbook","cat":"indici","group":"","src":"B p.131-168; VF p.91-132; RS p.65-96","aliases":["playbook","playbooks","scheda del personaggio"],"html":"<p>Ogni giocatore usa un playbook diverso. I playbook dei supplementi sono consigliati a giocatori esperti.</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#pb-avventuriero\" data-id=\"pb-avventuriero\">L'Avventuriero</a>, <a class=\"xl\" href=\"#pb-canaglia\" data-id=\"pb-canaglia\">La Canaglia</a>, <a class=\"xl\" href=\"#pb-ciarlatano\" data-id=\"pb-ciarlatano\">Il Ciarlatano</a>, <a class=\"xl\" href=\"#pb-giudice\" data-id=\"pb-giudice\">Il Giudice</a>, <a class=\"xl\" href=\"#pb-ladro\" data-id=\"pb-ladro\">Il Ladro</a>, <a class=\"xl\" href=\"#pb-mastro\" data-id=\"pb-mastro\">Il Mastro</a>, <a class=\"xl\" href=\"#pb-predone\" data-id=\"pb-predone\">Il Predone</a>, <a class=\"xl\" href=\"#pb-ranger\" data-id=\"pb-ranger\">Il Ranger</a>, <a class=\"xl\" href=\"#pb-ronin\" data-id=\"pb-ronin\">Il Ronin</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#pb-campione\" data-id=\"pb-campione\">Il Campione</a>, <a class=\"xl\" href=\"#pb-cronista\" data-id=\"pb-cronista\">Il Cronista</a>, <a class=\"xl\" href=\"#pb-emissario\" data-id=\"pb-emissario\">L'Ambasciatore</a>, <a class=\"xl\" href=\"#pb-esule\" data-id=\"pb-esule\">L'Esule</a>, <a class=\"xl\" href=\"#pb-eretico\" data-id=\"pb-eretico\">L'Eretico</a>, <a class=\"xl\" href=\"#pb-pirata\" data-id=\"pb-pirata\">Il Pirata</a>, <a class=\"xl\" href=\"#pb-principe\" data-id=\"pb-principe\">L'Erede</a>, <a class=\"xl\" href=\"#pb-cantastorie\" data-id=\"pb-cantastorie\">Il Cantastorie</a>, <a class=\"xl\" href=\"#pb-razziatore\" data-id=\"pb-razziatore\">Il Razziatore</a>, <a class=\"xl\" href=\"#pb-cercatore\" data-id=\"pb-cercatore\">Il Cercatore</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#pb-trafficante\" data-id=\"pb-trafficante\">Il Trafficante</a>, <a class=\"xl\" href=\"#pb-buongustaio\" data-id=\"pb-buongustaio\">Lo Chef</a>, <a class=\"xl\" href=\"#pb-cacciatore\" data-id=\"pb-cacciatore\">Il Cacciatore</a>, <a class=\"xl\" href=\"#pb-nomade\" data-id=\"pb-nomade\">Il Nomade</a>, <a class=\"xl\" href=\"#pb-orfano\" data-id=\"pb-orfano\">L'Orfano</a>, <a class=\"xl\" href=\"#pb-flagello\" data-id=\"pb-flagello\">Il Flagello</a>.</p><p>I nomi dei playbook e delle loro mosse seguono le schede ufficiali MS Edizioni dei due supplementi.</p>","text":"Ogni giocatore usa un playbook diverso. I playbook dei supplementi sono consigliati a giocatori esperti. Manuale base: L'Avventuriero, La Canaglia, Il Ciarlatano, Il Giudice, Il Ladro, Il Mastro, Il Predone, Il Ranger, Il Ronin. Viandanti e Forestieri: Il Campione, Il Cronista, L'Ambasciatore, L'Esule, L'Eretico, Il Pirata, L'Erede, Il Cantastorie, Il Razziatore, Il Cercatore. Rovine e Spedizioni: Il Trafficante, Lo Chef, Il Cacciatore, Il Nomade, L'Orfano, Il Flagello. I nomi dei playbook e delle loro mosse seguono le schede ufficiali MS Edizioni dei due supplementi.","back":["creazione"]},{"id":"pb-avventuriero","title":"L'Avventuriero","cat":"playbook","group":"Manuale Base","src":"B p.133-136","aliases":["Avventuriero"],"html":"<p><em>Un vagabondo pacifico e diplomatico: stringe alleanze aiutando gli altri e rovescia i poteri forti con le parole.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza 0, Fortuna 0, Vigore -1 (+1 a scelta, max +2)</li><li><strong>Abilità con le armi iniziale</strong> (una): Disarmare, Incalzare, Improvvisare, Parare</li><li><strong>Imprese</strong>: Falsificare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, gufo</li></ul><p><strong>Natura</strong> (una)</p><ul><li><em>Estroverso</em>: svuota la fatica quando condividi con qualcuno un momento intenso di vera amicizia o divertimento.</li><li><em>Pacifista</em>: svuota la fatica quando risolvi un conflitto senza violenza.</li></ul><p><strong>Motivazioni</strong> (due): <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>.</p><p><strong>Legami</strong>: Compagno (avete difeso invano una radura insieme), Amico (viaggiate insieme da quando sei diventato vagabondo).</p><p><strong>Mosse</strong> (scegline tre): <a class=\"xl\" href=\"#pb-avventuriero-reputazione\" data-id=\"pb-avventuriero-reputazione\">Reputazione Impeccabile</a>, <a class=\"xl\" href=\"#pb-avventuriero-sottomettere\" data-id=\"pb-avventuriero-sottomettere\">Sottomettere</a>, <a class=\"xl\" href=\"#pb-avventuriero-polso\" data-id=\"pb-avventuriero-polso\">Il Polso della Situazione</a>, <a class=\"xl\" href=\"#pb-avventuriero-oratore\" data-id=\"pb-avventuriero-oratore\">Oratore</a>, <a class=\"xl\" href=\"#pb-avventuriero-erudito\" data-id=\"pb-avventuriero-erudito\">Erudito</a>, <a class=\"xl\" href=\"#pb-avventuriero-amici\" data-id=\"pb-avventuriero-amici\">Subito Amici</a>.</p>","text":"Un vagabondo pacifico e diplomatico: stringe alleanze aiutando gli altri e rovescia i poteri forti con le parole. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza 0, Fortuna 0, Vigore -1 (+1 a scelta, max +2) - Abilità con le armi iniziale (una): Disarmare, Incalzare, Improvvisare, Parare - Imprese: Falsificare, Gioco di Prestigio - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, gufo Natura (una) - Estroverso: svuota la fatica quando condividi con qualcuno un momento intenso di vera amicizia o divertimento. - Pacifista: svuota la fatica quando risolvi un conflitto senza violenza. Motivazioni (due): Ambizione, Zampe Pulite, Princìpi, Giustizia. Legami: Compagno (avete difeso invano una radura insieme), Amico (viaggiate insieme da quando sei diventato vagabondo). Mosse (scegline tre): Reputazione Impeccabile, Sottomettere, Il Polso della Situazione, Oratore, Erudito, Subito Amici.","back":["playbook-indice","nature-indice"]},{"id":"pb-avventuriero-reputazione","title":"Reputazione Impeccabile","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Reputazione Impeccabile"],"html":"<p>Quando segni prestigio con una fazione, segnane una casella in più. Quando dovresti segnare nomea, puoi invece <strong>svuotare</strong> altrettante caselle di prestigio (consigliato: la nomea danneggia di più).</p>","text":"Quando segni prestigio con una fazione, segnane una casella in più. Quando dovresti segnare nomea, puoi invece svuotare altrettante caselle di prestigio (consigliato: la nomea danneggia di più).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-sottomettere","title":"Sottomettere","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Sottomettere"],"html":"<div class=\"move\"><p><strong>Quando vuoi sottomettere rapidamente un avversario senza ucciderlo, puoi <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">attaccare in mischia</a> tirando su Astuzia invece di Vigore, ma non puoi scegliere di infliggere un danno grave.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: vi scambiate i danni e scegli 3 opzioni di attaccare in mischia (tranne il danno grave).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: vi scambiate i danni e scegli 1 opzione (tranne il danno grave).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>Serve un'arma adatta (un'arma che infligge fatica è non letale).</p>","text":"Quando vuoi sottomettere rapidamente un avversario senza ucciderlo, puoi attaccare in mischia tirando su Astuzia invece di Vigore, ma non puoi scegliere di infliggere un danno grave. - 10+ (successo pieno): vi scambiate i danni e scegli 3 opzioni di attaccare in mischia (tranne il danno grave). - 7-9 (successo parziale): vi scambiate i danni e scegli 1 opzione (tranne il danno grave). - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Serve un'arma adatta (un'arma che infligge fatica è non letale).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-polso","title":"Il Polso della Situazione","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Il Polso della Situazione"],"html":"<div class=\"move\"><p><strong>Quando raccogli informazioni su ciò che succede in una radura, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: fai 3 domande.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: fai 2 domande.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: attiri l'attenzione di qualcuno di pericoloso.</li></ul><p>Domande:</p><ul><li>Chi comanda in questa radura?</li><li>Chi sono i ribelli locali?</li><li>Cosa temono gli abitanti?</li><li>Cosa vorrebbero gli abitanti?</li><li>Quali opportunità ci sono per un vagabondo intraprendente?</li></ul></div><p>Richiede tempo per girare e fare domande.</p>","text":"Quando raccogli informazioni su ciò che succede in una radura, tira su Astuzia. - 10+ (successo pieno): fai 3 domande. - 7-9 (successo parziale): fai 2 domande. - 6- (fallimento): attiri l'attenzione di qualcuno di pericoloso. Domande: - Chi comanda in questa radura? - Chi sono i ribelli locali? - Cosa temono gli abitanti? - Cosa vorrebbero gli abitanti? - Quali opportunità ci sono per un vagabondo intraprendente? Richiede tempo per girare e fare domande.","back":["pb-avventuriero"]},{"id":"pb-avventuriero-oratore","title":"Oratore","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Oratore"],"html":"<div class=\"move\"><p><strong>Quando tieni un discorso a un gruppo di abitanti potenzialmente interessati, spiega quale azione li incoraggi a fare e tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo fanno, ma a modo loro; scegli 2 opzioni.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo fanno, ma a modo loro; scegli 1 opzione.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: distorcono il messaggio in modo imprevedibile.</li></ul><p>Opzioni:</p><ul><li>non esagerano;</li><li>non si disperdono al primo segno di resistenza;</li><li>non ti chiedono di guidarli.</li></ul></div>","text":"Quando tieni un discorso a un gruppo di abitanti potenzialmente interessati, spiega quale azione li incoraggi a fare e tira su Carisma. - 10+ (successo pieno): lo fanno, ma a modo loro; scegli 2 opzioni. - 7-9 (successo parziale): lo fanno, ma a modo loro; scegli 1 opzione. - 6- (fallimento): distorcono il messaggio in modo imprevedibile. Opzioni: - non esagerano; - non si disperdono al primo segno di resistenza; - non ti chiedono di guidarli.","back":["pb-avventuriero"]},{"id":"pb-avventuriero-erudito","title":"Erudito","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Erudito"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-avventuriero"]},{"id":"pb-avventuriero-amici","title":"Subito Amici","cat":"mosse","group":"Avventuriero","src":"B p.134","aliases":["Subito Amici"],"html":"<div class=\"move\"><p><strong>Quando cerchi di fare amicizia con un PNG appena conosciuto adattandoti alla sua personalità, segna fatica e tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: gli piaci davvero. Scegli 1:<ul><li>ti confida un prezioso segreto;</li><li>ti fa un favore enorme.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ha una buona opinione di te. Scegli 1:<ul><li>risponde con sincerità a una domanda non compromettente;</li><li>ti fa un piccolo favore.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: hai frainteso, e la sua disapprovazione ha conseguenze.</li></ul></div>","text":"Quando cerchi di fare amicizia con un PNG appena conosciuto adattandoti alla sua personalità, segna fatica e tira su Astuzia. - 10+ (successo pieno): gli piaci davvero. Scegli 1: - ti confida un prezioso segreto; - ti fa un favore enorme. - 7-9 (successo parziale): ha una buona opinione di te. Scegli 1: - risponde con sincerità a una domanda non compromettente; - ti fa un piccolo favore. - 6- (fallimento): hai frainteso, e la sua disapprovazione ha conseguenze.","back":["pb-avventuriero"]},{"id":"pb-canaglia","title":"La Canaglia","cat":"playbook","group":"Manuale Base","src":"B p.137-140","aliases":["Canaglia"],"html":"<p><em>Un vagabondo fortunato e pericoloso, piromane e piantagrane teatrale.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +2, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Tiro Rapido, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Sgattaiolare, Nascondersi</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, gatto</li></ul><p><strong>Natura</strong></p><ul><li><em>Incendiario</em>: svuota la fatica quando usi metodi inutilmente distruttivi per risolvere un problema.</li><li><em>Agguerrito</em>: svuota la fatica quando cerchi di combattere un nemico più forte di te.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>.</p><p><strong>Legami</strong>: Amico (un'impresa folle e impossibile insieme), Compagno (avete distrutto le risorse di una fazione per conto di un'altra).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-canaglia-esplosiva\" data-id=\"pb-canaglia-esplosiva\">Personalità Esplosiva</a>, <a class=\"xl\" href=\"#pb-canaglia-creare\" data-id=\"pb-canaglia-creare\">Creare per Distruggere</a>, <a class=\"xl\" href=\"#pb-canaglia-diversivo\" data-id=\"pb-canaglia-diversivo\">È un Diversivo!</a>, <a class=\"xl\" href=\"#pb-canaglia-temerario\" data-id=\"pb-canaglia-temerario\">Temerario</a>, <a class=\"xl\" href=\"#pb-canaglia-mascherato\" data-id=\"pb-canaglia-mascherato\">Vagabondo Mascherato</a>, <a class=\"xl\" href=\"#pb-canaglia-fortunato\" data-id=\"pb-canaglia-fortunato\">Meglio Fortunato che Bravo</a>.</p>","text":"Un vagabondo fortunato e pericoloso, piromane e piantagrane teatrale. - Caratteristiche: Carisma +1, Astuzia -1, Destrezza 0, Fortuna +2, Vigore 0 - Abilità iniziale: Confondere i Sensi, Improvvisare, Tiro Rapido, Colpo Crudele - Imprese: Acrobazie, Sgattaiolare, Nascondersi - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, gatto Natura - Incendiario: svuota la fatica quando usi metodi inutilmente distruttivi per risolvere un problema. - Agguerrito: svuota la fatica quando cerchi di combattere un nemico più forte di te. Motivazioni: Caos, Brivido, Crimine, Infamia. Legami: Amico (un'impresa folle e impossibile insieme), Compagno (avete distrutto le risorse di una fazione per conto di un'altra). Mosse (tre): Personalità Esplosiva, Creare per Distruggere, È un Diversivo!, Temerario, Vagabondo Mascherato, Meglio Fortunato che Bravo.","back":["playbook-indice","nature-indice"]},{"id":"pb-canaglia-esplosiva","title":"Personalità Esplosiva","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Personalità Esplosiva"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#distruggere\" data-id=\"distruggere\">distruggi qualcosa</a> con strumenti molto pericolosi (esplosivi, incendi incontrollati), tira su Fortuna invece di Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo danneggi, ma il GM sceglie 1:<ul><li>causi un danno collaterale;</li><li>attiri l'attenzione;</li><li>ti cacci in una brutta situazione.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando distruggi qualcosa con strumenti molto pericolosi (esplosivi, incendi incontrollati), tira su Fortuna invece di Vigore. - 10+ (successo pieno): danneggi seriamente l'oggetto, che non può essere usato finché non viene riparato. - 7-9 (successo parziale): lo danneggi, ma il GM sceglie 1: - causi un danno collaterale; - attiri l'attenzione; - ti cacci in una brutta situazione. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-canaglia"]},{"id":"pb-canaglia-creare","title":"Creare per Distruggere","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Creare per Distruggere"],"html":"<div class=\"move\"><p><strong>Quando usi i materiali disponibili per assemblare un congegno pericoloso, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: crei qualcosa che funziona una volta sola; il GM sceglie 1 complicazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: crei qualcosa che funziona una volta sola; il GM sceglie 2 complicazioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Complicazioni (il congegno è...):</p><ul><li>più pericoloso di quanto pensassi;</li><li>più grande e scomodo di quanto pensassi;</li><li>più fragile di quanto pensassi.</li></ul></div><p>Puoi segnare consumo per i materiali mancanti.</p>","text":"Quando usi i materiali disponibili per assemblare un congegno pericoloso, tira su Destrezza. - 10+ (successo pieno): crei qualcosa che funziona una volta sola; il GM sceglie 1 complicazione. - 7-9 (successo parziale): crei qualcosa che funziona una volta sola; il GM sceglie 2 complicazioni. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Complicazioni (il congegno è...): - più pericoloso di quanto pensassi; - più grande e scomodo di quanto pensassi; - più fragile di quanto pensassi. Puoi segnare consumo per i materiali mancanti.","back":["pb-canaglia"]},{"id":"pb-canaglia-diversivo","title":"È un Diversivo!","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["È un Diversivo"],"html":"<p>Ottieni l'impresa <a class=\"xl\" href=\"#attaccare-spalle\" data-id=\"attaccare-spalle\">Attaccare alle Spalle</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando la tenti contro qualcuno distratto da una minaccia ambientale (incendio, inondazione), tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni l'impresa Attaccare alle Spalle (fuori limite). Quando la tenti contro qualcuno distratto da una minaccia ambientale (incendio, inondazione), tira su Fortuna. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-canaglia"]},{"id":"pb-canaglia-temerario","title":"Temerario","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Temerario"],"html":"<p>Quando ti lanci nel pericolo senza pensarci né pianificare, sei \"protetto dalla fortuna\": come un'armatura con 1 casella di usura, che svanisce passato il pericolo e torna disponibile la volta successiva.</p>","text":"Quando ti lanci nel pericolo senza pensarci né pianificare, sei \"protetto dalla fortuna\": come un'armatura con 1 casella di usura, che svanisce passato il pericolo e torna disponibile la volta successiva.","back":["pb-canaglia"]},{"id":"pb-canaglia-mascherato","title":"Vagabondo Mascherato","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Vagabondo Mascherato"],"html":"<p>Hai una maschera o un costume (equipaggiamento, 2 usura), biglietto da visita più che travestimento. Mentre la indossi la <strong>nomea è raddoppiata</strong> e il prestigio dimezzato, e hai <strong>+1</strong> ad <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">Affidarsi al Fato</a> e alle mosse della Canaglia. Se te la rubano segna fatica; se viene distrutta segna 4-fatica (potrai farne un'altra).</p>","text":"Hai una maschera o un costume (equipaggiamento, 2 usura), biglietto da visita più che travestimento. Mentre la indossi la nomea è raddoppiata e il prestigio dimezzato, e hai +1 ad Affidarsi al Fato e alle mosse della Canaglia. Se te la rubano segna fatica; se viene distrutta segna 4-fatica (potrai farne un'altra).","back":["pb-canaglia"]},{"id":"pb-canaglia-fortunato","title":"Meglio Fortunato che Bravo","cat":"mosse","group":"Canaglia","src":"B p.138","aliases":["Meglio Fortunato che Bravo"],"html":"<p>Quando usi una mossa con le armi (base o speciale), segna fatica per tirare su <strong>Fortuna</strong> invece della caratteristica indicata.</p>","text":"Quando usi una mossa con le armi (base o speciale), segna fatica per tirare su Fortuna invece della caratteristica indicata.","back":["pb-canaglia"]},{"id":"pb-ciarlatano","title":"Il Ciarlatano","cat":"playbook","group":"Manuale Base","src":"B p.141-144","aliases":["Ciarlatano"],"html":"<p><em>Un truffatore affascinante che la scampa sempre e mette i nemici l'uno contro l'altro.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza -1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Incalzare, Improvvisare, Tiro Rapido, Colpo Crudele</li><li><strong>Imprese</strong>: Scassinare, Gioco di Prestigio</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, opossum</li></ul><p><strong>Natura</strong></p><ul><li><em>Ingordo</em>: svuota la fatica quando ti abbandoni a vizi (bere, cibo, gioco d'azzardo).</li><li><em>Imbroglione</em>: svuota la fatica quando cerchi di truffare qualcuno di potente o pericoloso.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Familiare (ti ha salvato dopo un grande furto finito male), Sentinella (ha capito che lo imbrogliavi e ti ha truffato a sua volta).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ciarlatano-istigatore\" data-id=\"pb-ciarlatano-istigatore\">Istigatore</a>, <a class=\"xl\" href=\"#pb-ciarlatano-leccazampe\" data-id=\"pb-ciarlatano-leccazampe\">Leccazampe</a>, <a class=\"xl\" href=\"#pb-ciarlatano-sorriso\" data-id=\"pb-ciarlatano-sorriso\">Sorriso Disperato</a>, <a class=\"xl\" href=\"#pb-ciarlatano-provocatore\" data-id=\"pb-ciarlatano-provocatore\">Provocatore</a>, <a class=\"xl\" href=\"#pb-ciarlatano-gioco\" data-id=\"pb-ciarlatano-gioco\">Facciamo un Gioco</a>, <a class=\"xl\" href=\"#pb-ciarlatano-sabbia\" data-id=\"pb-ciarlatano-sabbia\">Sabbia nelle Tasche</a>.</p>","text":"Un truffatore affascinante che la scampa sempre e mette i nemici l'uno contro l'altro. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza -1, Fortuna 0, Vigore 0 - Abilità iniziale: Incalzare, Improvvisare, Tiro Rapido, Colpo Crudele - Imprese: Scassinare, Gioco di Prestigio - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, opossum Natura - Ingordo: svuota la fatica quando ti abbandoni a vizi (bere, cibo, gioco d'azzardo). - Imbroglione: svuota la fatica quando cerchi di truffare qualcuno di potente o pericoloso. Motivazioni: Caos, Brivido, Zampe Pulite, Voglia di Viaggiare. Legami: Familiare (ti ha salvato dopo un grande furto finito male), Sentinella (ha capito che lo imbrogliavi e ti ha truffato a sua volta). Mosse (tre): Istigatore, Leccazampe, Sorriso Disperato, Provocatore, Facciamo un Gioco, Sabbia nelle Tasche.","back":["playbook-indice","nature-indice"]},{"id":"pb-ciarlatano-istigatore","title":"Istigatore","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Istigatore"],"html":"<p>Quando <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">inganni un PNG</a> per metterlo contro un altro PNG, scarta un'opzione dall'elenco del <span class=\"res\">7-9</span>: il PNG non può sceglierla.</p>","text":"Quando inganni un PNG per metterlo contro un altro PNG, scarta un'opzione dall'elenco del 7-9: il PNG non può sceglierla.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-leccazampe","title":"Leccazampe","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Leccazampe"],"html":"<div class=\"move\"><p><strong>Quando fai il ruffiano con un PNG ignaro, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: si insospettisce e ti tiene d'occhio.</li></ul><p>Spendi una presa per deviare sospetti o ostilità su qualcun altro o qualcos'altro.</p></div>","text":"Quando fai il ruffiano con un PNG ignaro, tira su Carisma. - 10+ (successo pieno): tieni 3 prese. - 7-9 (successo parziale): tieni 2 prese. - 6- (fallimento): si insospettisce e ti tiene d'occhio. Spendi una presa per deviare sospetti o ostilità su qualcun altro o qualcos'altro.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-sorriso","title":"Sorriso Disperato","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Sorriso Disperato"],"html":"<div class=\"move\"><p><strong>Quando ti <a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">affidi al fato</a> implorando o umiliandoti, tira su Carisma invece di Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: te la cavi pagando il prezzo che dice il GM, e ottieni anche una preziosa occasione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: te la cavi, ma il GM ti dice il prezzo da pagare.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non te la cavi; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando ti affidi al fato implorando o umiliandoti, tira su Carisma invece di Fortuna. - 10+ (successo pieno): te la cavi pagando il prezzo che dice il GM, e ottieni anche una preziosa occasione. - 7-9 (successo parziale): te la cavi, ma il GM ti dice il prezzo da pagare. - 6- (fallimento): non te la cavi; il GM ti dice cosa succede e la situazione si complica.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-provocatore","title":"Provocatore","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Provocatore"],"html":"<div class=\"move\"><p><strong>Quando giochi sulle insicurezze o paure di un nemico per distrarlo in combattimento, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ti crei un'occasione. Scegli 1:<ul><li>usi una mossa con le armi con +1;</li><li>colpisci rapidamente infliggendo danno.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ti crei l'occasione come sopra, ma lo innervosisci: non ti ascolterà più finché la situazione non cambia.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: si arrabbia e ti coglie alla sprovvista.</li></ul></div><p>Spesso preceduta da <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a>.</p>","text":"Quando giochi sulle insicurezze o paure di un nemico per distrarlo in combattimento, tira su Destrezza. - 10+ (successo pieno): ti crei un'occasione. Scegli 1: - usi una mossa con le armi con +1; - colpisci rapidamente infliggendo danno. - 7-9 (successo parziale): ti crei l'occasione come sopra, ma lo innervosisci: non ti ascolterà più finché la situazione non cambia. - 6- (fallimento): si arrabbia e ti coglie alla sprovvista. Spesso preceduta da Capire le Intenzioni.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-gioco","title":"Facciamo un Gioco","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Facciamo un Gioco"],"html":"<div class=\"move\"><p><strong>Quando sfidi qualcuno a un gioco di abilità e ingegno per farlo parlare, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: si lascia sfuggire qualcosa di utile.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: parla, ma devi perdere per farlo parlare: segna consumo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: è più bravo di te. Scegli 1:<ul><li>segni consumo e limiti le perdite;</li><li>segni 3-consumo per farlo parlare.</li></ul></li></ul></div>","text":"Quando sfidi qualcuno a un gioco di abilità e ingegno per farlo parlare, tira su Carisma. - 10+ (successo pieno): si lascia sfuggire qualcosa di utile. - 7-9 (successo parziale): parla, ma devi perdere per farlo parlare: segna consumo. - 6- (fallimento): è più bravo di te. Scegli 1: - segni consumo e limiti le perdite; - segni 3-consumo per farlo parlare.","back":["pb-ciarlatano"]},{"id":"pb-ciarlatano-sabbia","title":"Sabbia nelle Tasche","cat":"mosse","group":"Ciarlatano","src":"B p.142","aliases":["Sabbia nelle Tasche"],"html":"<p>Ottieni <a class=\"xl\" href=\"#confondere-sensi\" data-id=\"confondere-sensi\">Confondere i Sensi</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando lanci qualcosa per confondere un avversario a distanza ravvicinata o a contatto, tira su Astuzia invece di Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: perde l'equilibrio, è accecato o confuso e ottieni un'opportunità; gli serve tempo per riprendersi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma hai solo qualche secondo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Confondere i Sensi (fuori limite). Quando lanci qualcosa per confondere un avversario a distanza ravvicinata o a contatto, tira su Astuzia invece di Destrezza. - 10+ (successo pieno): perde l'equilibrio, è accecato o confuso e ottieni un'opportunità; gli serve tempo per riprendersi. - 7-9 (successo parziale): come sopra, ma hai solo qualche secondo. - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["pb-ciarlatano"]},{"id":"pb-giudice","title":"Il Giudice","cat":"playbook","group":"Manuale Base","src":"B p.145-148","aliases":["Giudice"],"html":"<p><em>Un guerriero ostinato e potente, a metà tra mercenario e protettore, che si schiera troppo facilmente.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia 0, Destrezza 0, Fortuna -1, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Disarmare, Parare, Assaltare un Gruppo</li><li><strong>Imprese</strong>: una a scelta</li><li><strong>Valore iniziale</strong>: 10</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, tasso</li></ul><p><strong>Natura</strong></p><ul><li><em>Difensore</em>: svuota la fatica quando ti esponi al pericolo per difendere qualcuno da un'ingiustizia o una minaccia.</li><li><em>Punitore</em>: svuota la fatica quando prometti faccia a faccia a un nemico potente che lo punirai.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Protettore (l'hai salvato da un colpo mortale), Compagno (avete aiutato una fazione a prendere una radura).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-giudice-bruto\" data-id=\"pb-giudice-bruto\">Bruto</a>, <a class=\"xl\" href=\"#pb-giudice-bastone\" data-id=\"pb-giudice-bastone\">La Politica del Bastone</a>, <a class=\"xl\" href=\"#pb-giudice-rompi\" data-id=\"pb-giudice-rompi\">Rompi e Spacca</a>, <a class=\"xl\" href=\"#pb-giudice-resistente\" data-id=\"pb-giudice-resistente\">Resistente</a>, <a class=\"xl\" href=\"#pb-giudice-tiro\" data-id=\"pb-giudice-tiro\">Tiro Potente</a>, <a class=\"xl\" href=\"#pb-giudice-guardiano\" data-id=\"pb-giudice-guardiano\">Guardiano</a>.</p>","text":"Un guerriero ostinato e potente, a metà tra mercenario e protettore, che si schiera troppo facilmente. - Caratteristiche: Carisma +1, Astuzia 0, Destrezza 0, Fortuna -1, Vigore +2 - Abilità iniziale: Fracassare, Disarmare, Parare, Assaltare un Gruppo - Imprese: una a scelta - Valore iniziale: 10 - Specie: volpe, topo, coniglio, uccello, tasso Natura - Difensore: svuota la fatica quando ti esponi al pericolo per difendere qualcuno da un'ingiustizia o una minaccia. - Punitore: svuota la fatica quando prometti faccia a faccia a un nemico potente che lo punirai. Motivazioni: Giustizia, Princìpi, Lealtà, Protezione. Legami: Protettore (l'hai salvato da un colpo mortale), Compagno (avete aiutato una fazione a prendere una radura). Mosse (tre): Bruto, La Politica del Bastone, Rompi e Spacca, Resistente, Tiro Potente, Guardiano.","back":["playbook-indice","nature-indice"]},{"id":"pb-giudice-bruto","title":"Bruto","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Bruto"],"html":"<p>+1 Vigore (max +3).</p>","text":"+1 Vigore (max +3).","back":["pb-giudice"]},{"id":"pb-giudice-bastone","title":"La Politica del Bastone","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["La Politica del Bastone"],"html":"<div class=\"move\"><p><strong>Quando usi le parole per porre fine a una disputa o a uno scontro violento, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena); tu hai anche +1 continuo per trattare pacificamente con loro.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: i PNG si rivoltano contro di te e i PG hanno +1 continuo contro di te per la scena.</li></ul></div>","text":"Quando usi le parole per porre fine a una disputa o a uno scontro violento, tira su Carisma. - 10+ (successo pieno): ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena); tu hai anche +1 continuo per trattare pacificamente con loro. - 7-9 (successo parziale): ogni parte sceglie se segnare 2-fatica per continuare o fermarsi (per questa scena). - 6- (fallimento): i PNG si rivoltano contro di te e i PG hanno +1 continuo contro di te per la scena.","back":["pb-giudice"]},{"id":"pb-giudice-rompi","title":"Rompi e Spacca","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Rompi e Spacca"],"html":"<div class=\"move\"><p><strong>Quando ti apri la strada a forza verso qualcosa o qualcuno, tira su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo raggiungi; scegli 1 conseguenza.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo raggiungi; scegli 2 conseguenze.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: arrivi, ma sei vulnerabile.</li></ul><p>Conseguenze:</p><ul><li>ti fai male: 1-ferita;</li><li>rompi qualcosa di significativo nell'ambiente;</li><li>danneggi o perdi un pezzo di equipaggiamento (sceglie il GM, almeno 1 usura).</li></ul></div>","text":"Quando ti apri la strada a forza verso qualcosa o qualcuno, tira su Vigore. - 10+ (successo pieno): lo raggiungi; scegli 1 conseguenza. - 7-9 (successo parziale): lo raggiungi; scegli 2 conseguenze. - 6- (fallimento): arrivi, ma sei vulnerabile. Conseguenze: - ti fai male: 1-ferita; - rompi qualcosa di significativo nell'ambiente; - danneggi o perdi un pezzo di equipaggiamento (sceglie il GM, almeno 1 usura).","back":["pb-giudice"]},{"id":"pb-giudice-resistente","title":"Resistente","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Resistente"],"html":"<p>Una casella extra di ferite. Quando il tempo passa o raggiungi una nuova radura, svuoti automaticamente 2-ferite.</p>","text":"Una casella extra di ferite. Quando il tempo passa o raggiungi una nuova radura, svuoti automaticamente 2-ferite.","back":["pb-giudice"]},{"id":"pb-giudice-tiro","title":"Tiro Potente","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Tiro Potente"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">prendi la mira</a> con un arco, segna usura sull'arco per tirare su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: infliggi ferite e scegli 1 opzione di prendere la mira (secondo colpo o posizione nascosta).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: infliggi ferite.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: manchi il bersaglio; il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Con un successo (7+) puoi anche:</p><ul><li>segnare fatica per infliggere +1-ferita;</li><li>segnare un'altra fatica perché il nemico non possa assorbire il danno con l'armatura.</li></ul></div>","text":"Quando prendi la mira con un arco, segna usura sull'arco per tirare su Vigore. - 10+ (successo pieno): infliggi ferite e scegli 1 opzione di prendere la mira (secondo colpo o posizione nascosta). - 7-9 (successo parziale): infliggi ferite. - 6- (fallimento): manchi il bersaglio; il GM ti dice cosa succede e la situazione si complica. Con un successo (7+) puoi anche: - segnare fatica per infliggere +1-ferita; - segnare un'altra fatica perché il nemico non possa assorbire il danno con l'armatura.","back":["pb-giudice"]},{"id":"pb-giudice-guardiano","title":"Guardiano","cat":"mosse","group":"Giudice","src":"B p.146","aliases":["Guardiano"],"html":"<div class=\"move\"><p><strong>Quando difendi qualcuno o qualcosa da un PNG o da un pericolo ambientale, tira su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo proteggi e scegli 1 opzione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: lo proteggi e scegli 1 opzione, ma c'è un prezzo: ti esponi o la situazione peggiora.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: subisci in pieno il colpo e fai il gioco della minaccia.</li></ul><p>Opzioni:</p><ul><li>la minaccia si concentra su di te;</li><li>la metti in posizione vulnerabile: +1 al prossimo tiro per contrattaccare;</li><li>la respingi: tu e il protetto avete spazio per agire o fuggire.</li></ul></div>","text":"Quando difendi qualcuno o qualcosa da un PNG o da un pericolo ambientale, tira su Vigore. - 10+ (successo pieno): lo proteggi e scegli 1 opzione. - 7-9 (successo parziale): lo proteggi e scegli 1 opzione, ma c'è un prezzo: ti esponi o la situazione peggiora. - 6- (fallimento): subisci in pieno il colpo e fai il gioco della minaccia. Opzioni: - la minaccia si concentra su di te; - la metti in posizione vulnerabile: +1 al prossimo tiro per contrattaccare; - la respingi: tu e il protetto avete spazio per agire o fuggire.","back":["pb-giudice"]},{"id":"pb-ladro","title":"Il Ladro","cat":"playbook","group":"Manuale Base","src":"B p.149-152","aliases":["Ladro"],"html":"<p><em>Un criminale astuto capace di sgraffignare il tesoro più sorvegliato.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza +2, Fortuna +1, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: 4 a scelta</li><li><strong>Valore iniziale</strong>: 6</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, procione</li></ul><p><strong>Natura</strong></p><ul><li><em>Cleptomane</em>: svuota la fatica quando cerchi di rubare qualcosa di valore o importante per tenerlo per te.</li><li><em>Ribelle</em>: svuota la fatica quando insulti pesantemente, sfidi o fai arrabbiare qualcuno di importante.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>.</p><p><strong>Legami</strong>: Professionista (hai rubato qualcosa per lui), Amico (ti ha liberato di prigione: sei in debito).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-ladro-scasso\" data-id=\"pb-ladro-scasso\">Furto con Scasso</a>, <a class=\"xl\" href=\"#pb-ladro-oscurita\" data-id=\"pb-ladro-oscurita\">Svanire nell'Oscurità</a>, <a class=\"xl\" href=\"#pb-ladro-sfiancare\" data-id=\"pb-ladro-sfiancare\">Sfiancare il Nemico</a>, <a class=\"xl\" href=\"#pb-ladro-zampine\" data-id=\"pb-ladro-zampine\">Zampine</a>, <a class=\"xl\" href=\"#pb-ladro-arciladro\" data-id=\"pb-ladro-arciladro\">Arciladro</a>, <a class=\"xl\" href=\"#pb-ladro-fiuto\" data-id=\"pb-ladro-fiuto\">Fiuto per l'Oro</a>.</p>","text":"Un criminale astuto capace di sgraffignare il tesoro più sorvegliato. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza +2, Fortuna +1, Vigore -1 - Abilità iniziale: Confondere i Sensi, Improvvisare, Parare, Tiro da Maestro - Imprese: 4 a scelta - Valore iniziale: 6 - Specie: volpe, topo, coniglio, uccello, procione Natura - Cleptomane: svuota la fatica quando cerchi di rubare qualcosa di valore o importante per tenerlo per te. - Ribelle: svuota la fatica quando insulti pesantemente, sfidi o fai arrabbiare qualcuno di importante. Motivazioni: Libertà, Avidità, Ambizione, Brivido. Legami: Professionista (hai rubato qualcosa per lui), Amico (ti ha liberato di prigione: sei in debito). Mosse (tre): Furto con Scasso, Svanire nell'Oscurità, Sfiancare il Nemico, Zampine, Arciladro, Fiuto per l'Oro.","back":["playbook-indice","nature-indice"]},{"id":"pb-ladro-scasso","title":"Furto con Scasso","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Furto con Scasso"],"html":"<p>Quando <a class=\"xl\" href=\"#tentare-impresa\" data-id=\"tentare-impresa\">tenti un'impresa</a> per entrare o uscire da un luogo in cui sei già stato, puoi segnare fatica per ottenere <span class=\"res\">10+</span> senza tirare. Pensala come un sopralluogo.</p>","text":"Quando tenti un'impresa per entrare o uscire da un luogo in cui sei già stato, puoi segnare fatica per ottenere 10+ senza tirare. Pensala come un sopralluogo.","back":["pb-ladro"]},{"id":"pb-ladro-oscurita","title":"Svanire nell'Oscurità","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Svanire nell'Oscurità"],"html":"<p>Quando sparisci nel buio mentre nessuno ti guarda, segna fatica e tieni 1 presa: finché resti silenzioso e lento rimani nascosto (se esci allo scoperto per errore perdi la presa). Spendila per sbucare all'improvviso: se attacchi subito dopo hai un bonus al tiro (max +4).</p>","text":"Quando sparisci nel buio mentre nessuno ti guarda, segna fatica e tieni 1 presa: finché resti silenzioso e lento rimani nascosto (se esci allo scoperto per errore perdi la presa). Spendila per sbucare all'improvviso: se attacchi subito dopo hai un bonus al tiro (max +4).","back":["pb-ladro"]},{"id":"pb-ladro-sfiancare","title":"Sfiancare il Nemico","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Sfiancare il Nemico"],"html":"<div class=\"move\"><p><strong>Quando schivi ed eludi un nemico per stancarlo, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: puoi segnare fatica per fargli segnare 3-fatica.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: puoi segnare fatica per fargli segnare 2-fatica.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: vieni colpito e sei alla sua mercé.</li></ul></div>","text":"Quando schivi ed eludi un nemico per stancarlo, tira su Destrezza. - 10+ (successo pieno): puoi segnare fatica per fargli segnare 3-fatica. - 7-9 (successo parziale): puoi segnare fatica per fargli segnare 2-fatica. - 6- (fallimento): vieni colpito e sei alla sua mercé.","back":["pb-ladro"]},{"id":"pb-ladro-zampine","title":"Zampine","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Zampine"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">lotti</a> con un nemico molto più grosso di te, tira su Destrezza invece di Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli tu la prima opzione di <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a>, poi scegliete contemporaneamente.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tu e l'avversario scegliete contemporaneamente fin dal primo scambio.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: vieni sopraffatto.</li></ul></div>","text":"Quando lotti con un nemico molto più grosso di te, tira su Destrezza invece di Vigore. - 10+ (successo pieno): scegli tu la prima opzione di Lottare con un Nemico, poi scegliete contemporaneamente. - 7-9 (successo parziale): tu e l'avversario scegliete contemporaneamente fin dal primo scambio. - 6- (fallimento): vieni sopraffatto.","back":["pb-ladro"]},{"id":"pb-ladro-arciladro","title":"Arciladro","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Arciladro"],"html":"<p>+1 Destrezza (max +3).</p>","text":"+1 Destrezza (max +3).","back":["pb-ladro"]},{"id":"pb-ladro-fiuto","title":"Fiuto per l'Oro","cat":"mosse","group":"Ladro","src":"B p.150","aliases":["Fiuto per l'Oro"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le intenzioni</a> puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa che porta con sé?\". Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa qui?\".</p>","text":"Quando capisci le intenzioni puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa che porta con sé?\". Quando valuti una situazione tesa puoi chiedere (anche con un fallimento) \"Qual è la cosa più preziosa qui?\".","back":["pb-ladro"]},{"id":"pb-mastro","title":"Il Mastro","cat":"playbook","group":"Manuale Base","src":"B p.153-156","aliases":["Mastro"],"html":"<p><em>Un esperto di congegni e artigianato, con idee che lo rendono diverso.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Fracassare, Incalzare, Improvvisare, Tiro da Maestro</li><li><strong>Imprese</strong>: Falsificare, Disattivare un Congegno, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, castoro</li></ul><p><strong>Natura</strong></p><ul><li><em>Perfezionista</em>: svuota la fatica quando sostituisci uno strumento o una risorsa di qualcuno con qualcosa di eccezionale.</li><li><em>Estremista</em>: svuota la fatica quando sostieni idee pericolose davanti al pubblico sbagliato.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-vendetta\" data-id=\"mot-vendetta\">Vendetta</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>.</p><p><strong>Legami</strong>: Professionista (vi leggete nel pensiero), Familiare (siete fuggiti insieme da una radura).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-mastro-cassetta\" data-id=\"pb-mastro-cassetta\">Cassetta degli Attrezzi</a> e <a class=\"xl\" href=\"#pb-mastro-riparare\" data-id=\"pb-mastro-riparare\">Riparare</a> + una tra <a class=\"xl\" href=\"#pb-mastro-tasche\" data-id=\"pb-mastro-tasche\">Tasche Capienti</a>, <a class=\"xl\" href=\"#pb-mastro-inventore\" data-id=\"pb-mastro-inventore\">Inventore</a>, <a class=\"xl\" href=\"#pb-mastro-mente\" data-id=\"pb-mastro-mente\">Mente Svelta</a>, <a class=\"xl\" href=\"#pb-mastro-smantellare\" data-id=\"pb-mastro-smantellare\">Smantellare</a>.</p>","text":"Un esperto di congegni e artigianato, con idee che lo rendono diverso. - Caratteristiche: Carisma -1, Astuzia +2, Destrezza +1, Fortuna 0, Vigore 0 - Abilità iniziale: Fracassare, Incalzare, Improvvisare, Tiro da Maestro - Imprese: Falsificare, Disattivare un Congegno, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, castoro Natura - Perfezionista: svuota la fatica quando sostituisci uno strumento o una risorsa di qualcuno con qualcosa di eccezionale. - Estremista: svuota la fatica quando sostieni idee pericolose davanti al pubblico sbagliato. Motivazioni: Avidità, Ambizione, Vendetta, Protezione. Legami: Professionista (vi leggete nel pensiero), Familiare (siete fuggiti insieme da una radura). Mosse: inizi con Cassetta degli Attrezzi e Riparare + una tra Tasche Capienti, Inventore, Mente Svelta, Smantellare.","back":["comprare-vendere","playbook-indice","nature-indice"]},{"id":"pb-mastro-cassetta","title":"Cassetta degli Attrezzi","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Cassetta degli Attrezzi"],"html":"<p>Hai un kit per progetti a lungo termine. Scegli due strumenti: legni assortiti, viti e ingranaggi, strani utensili, manuali, medicine, kit da alchimista, kit da cucito, pentole, piccoli esplosivi. Scegli un difetto: pesante (2-Ingombro), voluminoso e appariscente, rubato, fragile.</p><p>Quando la apri per <strong>creare qualcosa o capire come risolvere un problema</strong>, dichiara l'obiettivo: il GM ti dà <strong>da 1 a 4 condizioni</strong> (tempo, materiali, aiuto, strumenti, limiti del progetto). Soddisfatte le condizioni, raggiungi l'obiettivo.</p>","text":"Hai un kit per progetti a lungo termine. Scegli due strumenti: legni assortiti, viti e ingranaggi, strani utensili, manuali, medicine, kit da alchimista, kit da cucito, pentole, piccoli esplosivi. Scegli un difetto: pesante (2-Ingombro), voluminoso e appariscente, rubato, fragile. Quando la apri per creare qualcosa o capire come risolvere un problema, dichiara l'obiettivo: il GM ti dà da 1 a 4 condizioni (tempo, materiali, aiuto, strumenti, limiti del progetto). Soddisfatte le condizioni, raggiungi l'obiettivo.","back":["comprare-vendere","pb-mastro"]},{"id":"pb-mastro-riparare","title":"Riparare","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Riparare"],"html":"<p>Per riparare un tuo equipaggiamento <strong>distrutto</strong> con la cassetta, il GM impone una condizione: soddisfala per svuotare tutta la sua usura. Per uno <strong>danneggiato</strong>, ogni consumo o Valore speso svuota 1 usura.</p>","text":"Per riparare un tuo equipaggiamento distrutto con la cassetta, il GM impone una condizione: soddisfala per svuotare tutta la sua usura. Per uno danneggiato, ogni consumo o Valore speso svuota 1 usura.","back":["pb-mastro"]},{"id":"pb-mastro-tasche","title":"Tasche Capienti","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Tasche Capienti"],"html":"<p>Due caselle di consumo extra (fuori dal limite di 6).</p>","text":"Due caselle di consumo extra (fuori dal limite di 6).","back":["pb-mastro"]},{"id":"pb-mastro-inventore","title":"Inventore","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Inventore"],"html":"<div class=\"move\"><p><strong>Quando improvvisi un dispositivo sul momento, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: funziona una volta prima di rompersi. Scegli 1:<ul><li>funziona benissimo;</li><li>ha un uso extra.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: funziona una volta prima di rompersi.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: funziona, ma con un effetto collaterale che il GM rivela all'uso.</li></ul></div><p>Non crea vere armi.</p>","text":"Quando improvvisi un dispositivo sul momento, tira su Astuzia. - 10+ (successo pieno): funziona una volta prima di rompersi. Scegli 1: - funziona benissimo; - ha un uso extra. - 7-9 (successo parziale): funziona una volta prima di rompersi. - 6- (fallimento): funziona, ma con un effetto collaterale che il GM rivela all'uso. Non crea vere armi.","back":["pb-mastro"]},{"id":"pb-mastro-mente","title":"Mente Svelta","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Mente Svelta"],"html":"<p>Quando tenti un'impresa che coinvolge meccanismi o serrature, segna consumo per tirare su <strong>Astuzia</strong> invece di Destrezza.</p>","text":"Quando tenti un'impresa che coinvolge meccanismi o serrature, segna consumo per tirare su Astuzia invece di Destrezza.","back":["pb-mastro"]},{"id":"pb-mastro-smantellare","title":"Smantellare","cat":"mosse","group":"Mastro","src":"B p.154","aliases":["Smantellare"],"html":"<p>Quando smonti equipaggiamento o macchinari rotti, svuota 2-consumo (richiede tempo).</p>","text":"Quando smonti equipaggiamento o macchinari rotti, svuota 2-consumo (richiede tempo).","back":["pb-mastro"]},{"id":"pb-predone","title":"Il Predone","cat":"playbook","group":"Manuale Base","src":"B p.157-160","aliases":["Predone"],"html":"<p><em>Un contrabbandiere svelto e intraprendente, che scopre sentieri e luoghi nascosti.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia -1, Destrezza +2, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Sgattaiolare</li><li><strong>Valore iniziale</strong>: 9</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, scoiattolo</li></ul><p><strong>Natura</strong></p><ul><li><em>Diligente</em>: svuota la fatica quando svolgi un compito pericoloso o difficile per conto di qualcun altro.</li><li><em>Competitivo</em>: svuota la fatica quando corri rischi inutili per metterti in mostra.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Professionista (avete tentato di tracciare un nuovo sentiero), Amico (avete esplorato una rovina insieme).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-predone-maratoneta\" data-id=\"pb-predone-maratoneta\">Maratoneta</a>, <a class=\"xl\" href=\"#pb-predone-zampe\" data-id=\"pb-predone-zampe\">Zampe Veloci</a>, <a class=\"xl\" href=\"#pb-predone-ambasciatore\" data-id=\"pb-predone-ambasciatore\">Ambasciator Non Porta Pena</a>, <a class=\"xl\" href=\"#pb-predone-parkour\" data-id=\"pb-predone-parkour\">Parkour</a>, <a class=\"xl\" href=\"#pb-predone-viaggiatore\" data-id=\"pb-predone-viaggiatore\">Viaggiatore Straordinario</a>, <a class=\"xl\" href=\"#pb-predone-sentiero\" data-id=\"pb-predone-sentiero\">Il Sentiero del Contrabbandiere</a>.</p>","text":"Un contrabbandiere svelto e intraprendente, che scopre sentieri e luoghi nascosti. - Caratteristiche: Carisma 0, Astuzia -1, Destrezza +2, Fortuna +1, Vigore 0 - Abilità iniziale: Disarmare, Incalzare, Tiro Rapido, Tiro da Maestro - Imprese: Acrobazie, Sgattaiolare - Valore iniziale: 9 - Specie: volpe, topo, coniglio, uccello, scoiattolo Natura - Diligente: svuota la fatica quando svolgi un compito pericoloso o difficile per conto di qualcun altro. - Competitivo: svuota la fatica quando corri rischi inutili per metterti in mostra. Motivazioni: Crimine, Scoperta, Infamia, Voglia di Viaggiare. Legami: Professionista (avete tentato di tracciare un nuovo sentiero), Amico (avete esplorato una rovina insieme). Mosse (tre): Maratoneta, Zampe Veloci, Ambasciator Non Porta Pena, Parkour, Viaggiatore Straordinario, Il Sentiero del Contrabbandiere.","back":["playbook-indice","nature-indice"]},{"id":"pb-predone-maratoneta","title":"Maratoneta","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Maratoneta"],"html":"<p>Una casella extra di fatica. Quando la fatica è piena e devi segnarne ancora, puoi segnare l'equivalente in ferite (non assorbibili dall'armatura) per non svenire.</p>","text":"Una casella extra di fatica. Quando la fatica è piena e devi segnarne ancora, puoi segnare l'equivalente in ferite (non assorbibili dall'armatura) per non svenire.","back":["pb-predone"]},{"id":"pb-predone-zampe","title":"Zampe Veloci","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Zampe Veloci"],"html":"<p>+1 Destrezza (max +3).</p>","text":"+1 Destrezza (max +3).","back":["pb-predone"]},{"id":"pb-predone-ambasciatore","title":"Ambasciator Non Porta Pena","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Ambasciator Non Porta Pena"],"html":"<p>Ottieni <a class=\"xl\" href=\"#falsificare\" data-id=\"falsificare\">Falsificare</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando fingi di essere un innocente messaggero per <a class=\"xl\" href=\"#ingannare\" data-id=\"ingannare\">Ingannare un PNG</a> qualcuno, tira su Fortuna invece di Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: abbocca e fa ciò che vuoi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: abbocca, oppure il GM sceglie 1 reazione:<ul><li>esita (spesso danno al morale);</li><li>commette un passo falso: ti si presenta un'opportunità;</li><li>reagisce in modo esagerato: +1 al prossimo tiro contro di lui.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci casca; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Falsificare (fuori limite). Quando fingi di essere un innocente messaggero per Ingannare un PNG qualcuno, tira su Fortuna invece di Astuzia. - 10+ (successo pieno): abbocca e fa ciò che vuoi. - 7-9 (successo parziale): abbocca, oppure il GM sceglie 1 reazione: - esita (spesso danno al morale); - commette un passo falso: ti si presenta un'opportunità; - reagisce in modo esagerato: +1 al prossimo tiro contro di lui. - 6- (fallimento): non ci casca; il GM ti dice cosa succede e la situazione si complica.","back":["pb-predone"]},{"id":"pb-predone-parkour","title":"Parkour","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Parkour"],"html":"<div class=\"move\"><p><strong>Quando ti fai strada nel caos o in un combattimento, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese (valide per la scena).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: inciampi e resti bloccato.</li></ul><p>Spendi una presa per:</p><ul><li>raggiungere senza ostacoli qualcosa di visibile e raggiungibile;</li><li>fuggire da qualcosa di vicino;</li><li>allontanarti da un nemico nell'istante in cui ti attacca.</li></ul></div>","text":"Quando ti fai strada nel caos o in un combattimento, tira su Destrezza. - 10+ (successo pieno): tieni 3 prese (valide per la scena). - 7-9 (successo parziale): tieni 2 prese. - 6- (fallimento): inciampi e resti bloccato. Spendi una presa per: - raggiungere senza ostacoli qualcosa di visibile e raggiungibile; - fuggire da qualcosa di vicino; - allontanarti da un nemico nell'istante in cui ti attacca.","back":["pb-predone"]},{"id":"pb-predone-viaggiatore","title":"Viaggiatore Straordinario","cat":"mosse","group":"Predone","src":"B p.158","aliases":["Viaggiatore Straordinario"],"html":"<p>Quando viaggi, scegli 1 vantaggio in base al percorso:</p><ul><li>sul <a class=\"xl\" href=\"#viaggio-sentiero\" data-id=\"viaggio-sentiero\">sentiero</a>:<ul><li>+1 al tiro;</li><li>oppure svuota 2-fatica.</li></ul></li><li>attraverso la <a class=\"xl\" href=\"#viaggio-foresta\" data-id=\"viaggio-foresta\">foresta</a>:<ul><li>+1 al tiro;</li><li>oppure svuota 2-consumo.</li></ul></li></ul><p>Prima di arrivare puoi fare al GM due domande sulla radura, in base all'ultima volta che ci sei stato.</p>","text":"Quando viaggi, scegli 1 vantaggio in base al percorso: - sul sentiero: - +1 al tiro; - oppure svuota 2-fatica. - attraverso la f
