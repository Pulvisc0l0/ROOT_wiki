ng>Natura</strong></p><ul><li><em>Discendente</em>: svuota la fatica quando affronti il pericolo per attaccare i nemici o difendere gli alleati dei tuoi genitori.</li><li><em>Pioniere</em>: svuota la fatica quando intraprendi con altri una nuova linea d'azione folle e rischiosa.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Professionista (lavorava con un tuo genitore), Familiare (è stato allievo di un tuo genitore).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-principe-arma\" data-id=\"pb-principe-arma\">Arma di Famiglia</a> e <a class=\"xl\" href=\"#pb-principe-eredita\" data-id=\"pb-principe-eredita\">Retaggio</a> + una tra <a class=\"xl\" href=\"#pb-principe-noi\" data-id=\"pb-principe-noi\">Uno di Noi</a>, <a class=\"xl\" href=\"#pb-principe-storie\" data-id=\"pb-principe-storie\">Frottole</a>, <a class=\"xl\" href=\"#pb-principe-prigione\" data-id=\"pb-principe-prigione\">Fuori di Prigione</a>, <a class=\"xl\" href=\"#pb-principe-favorito\" data-id=\"pb-principe-favorito\">Prediletto</a>.</p>","text":"Un vagabondo di seconda generazione, erede delle abilità dei genitori vagabondi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Disarmare, Incalzare, Parare - Imprese: Nascondersi, Sgattaiolare + due a scelta - Valore iniziale: 7 - Passato: perché i tuoi genitori ti hanno cresciuto come vagabondo e cosa è capitato loro Natura - Discendente: svuota la fatica quando affronti il pericolo per attaccare i nemici o difendere gli alleati dei tuoi genitori. - Pioniere: svuota la fatica quando intraprendi con altri una nuova linea d'azione folle e rischiosa. Motivazioni: Protezione, Libertà, Crimine, Voglia di Viaggiare. Legami: Professionista (lavorava con un tuo genitore), Familiare (è stato allievo di un tuo genitore). Mosse: inizi con Arma di Famiglia e Retaggio + una tra Uno di Noi, Frottole, Fuori di Prigione, Prediletto.","back":["playbook-indice"]},{"id":"pb-principe-arma","title":"Arma di Famiglia","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Arma di Famiglia"],"html":"<p>Un cimelio di famiglia con 4 caselle di usura, per te inestimabile (se distrutto, il GM ti dice cosa fare per restaurarlo). Scegli tipo (pugnale, ascia, martello, spada, lancia, balestra, arco), una distanza e due caratteristiche:</p><ul><li><em>Affidabile</em>: +2 usura e una distanza extra.</li><li><em>Temuta</em>: chi la riconosce subisce danno al morale all'inizio dello scontro.</li><li><em>Mortale</em>: +1 danno.</li><li><em>Doppia-Testa</em>: un'estremità infligge ferite, l'altra fatica (dichiara all'inizio).</li><li><em>Versatile</em>: due etichette di abilità con le armi.</li><li><em>Unica</em>: una volta per sessione segna fatica per ignorare il danno di un attacco.</li><li><em>Travolgente</em>: dopo aver ferito un nemico pericoloso, segna usura: ogni alleato che ti ha visto svuota fatica.</li></ul>","text":"Un cimelio di famiglia con 4 caselle di usura, per te inestimabile (se distrutto, il GM ti dice cosa fare per restaurarlo). Scegli tipo (pugnale, ascia, martello, spada, lancia, balestra, arco), una distanza e due caratteristiche: - Affidabile: +2 usura e una distanza extra. - Temuta: chi la riconosce subisce danno al morale all'inizio dello scontro. - Mortale: +1 danno. - Doppia-Testa: un'estremità infligge ferite, l'altra fatica (dichiara all'inizio). - Versatile: due etichette di abilità con le armi. - Unica: una volta per sessione segna fatica per ignorare il danno di un attacco. - Travolgente: dopo aver ferito un nemico pericoloso, segna usura: ogni alleato che ti ha visto svuota fatica.","back":["pb-principe"]},{"id":"pb-principe-eredita","title":"Retaggio","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Retaggio"],"html":"<p>Quando <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a> per la prima volta, puoi segnare il tracciato di retaggio per prendere <span class=\"res\">10+</span> senza tirare.</p><div class=\"move\"><p><strong>Quando il tracciato di retaggio è pieno, dillo al GM, svuotalo e tira con +1 per ogni sì:</strong></p><ul><li>sei in una radura?</li><li>qualcuno ti sta cercando?</li><li>hai Reputazione +2 o -2 con almeno una fazione?</li></ul><p>Risultati:</p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ti trova, senza preavviso, qualcuno che ha conti in sospeso con i tuoi genitori.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ti trova qualcuno che ha conti in sospeso con i tuoi genitori.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: un comune abitante ti avverte che qualcuno potrebbe cercarti; segna il tracciato di retaggio.</li></ul></div>","text":"Quando incontri qualcuno di importante per la prima volta, puoi segnare il tracciato di retaggio per prendere 10+ senza tirare. Quando il tracciato di retaggio è pieno, dillo al GM, svuotalo e tira con +1 per ogni sì: - sei in una radura? - qualcuno ti sta cercando? - hai Reputazione +2 o -2 con almeno una fazione? Risultati: - 10+ (successo pieno): ti trova, senza preavviso, qualcuno che ha conti in sospeso con i tuoi genitori. - 7-9 (successo parziale): ti trova qualcuno che ha conti in sospeso con i tuoi genitori. - 6- (fallimento): un comune abitante ti avverte che qualcuno potrebbe cercarti; segna il tracciato di retaggio.","back":["pb-principe"]},{"id":"pb-principe-noi","title":"Uno di Noi","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Uno di Noi"],"html":"<div class=\"move\"><p><strong>Quando cerchi di <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capire</a> o <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">Convincere un PNG</a> vagabondi, banditi, rivoluzionari o emarginati, tira su Fortuna invece di Carisma.</strong></p></div><p>Capire le intenzioni:</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni 3 prese (domande di <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">Capire le Intenzioni</a>).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ottieni 1 presa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: nessuna presa; il GM ti dice cosa succede e la situazione si complica.</li></ul></div><p>Convincere:</p><div class=\"move\"><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: non del tutto: il GM ti dice cosa devi fare subito per persuaderlo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non lo convinci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando cerchi di capire o Convincere un PNG vagabondi, banditi, rivoluzionari o emarginati, tira su Fortuna invece di Carisma. Capire le intenzioni: - 10+ (successo pieno): ottieni 3 prese (domande di Capire le Intenzioni). - 7-9 (successo parziale): ottieni 1 presa. - 6- (fallimento): nessuna presa; il GM ti dice cosa succede e la situazione si complica. Convincere: - 10+ (successo pieno): lo convinci, a patto che tu gli dia una valida ragione o una mazzetta adeguata. - 7-9 (successo parziale): non del tutto: il GM ti dice cosa devi fare subito per persuaderlo. - 6- (fallimento): non lo convinci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-principe"]},{"id":"pb-principe-storie","title":"Frottole","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Frottole"],"html":"<div class=\"move\"><p><strong>Quando impressioni una folla con una storia incredibile, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia, e qualche sprovveduto ti offre anche un lavoro redditizio.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: attiri qualcuno disperato che non puoi aiutare.</li></ul></div>","text":"Quando impressioni una folla con una storia incredibile, tira su Fortuna. - 10+ (successo pieno): tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia, e qualche sprovveduto ti offre anche un lavoro redditizio. - 7-9 (successo parziale): tutta la banda ha +1 continuo a convincere o ingannare in linea con la storia. - 6- (fallimento): attiri qualcuno disperato che non puoi aiutare.","back":["pb-principe"]},{"id":"pb-principe-prigione","title":"Fuori di Prigione","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Fuori di Prigione"],"html":"<p>Ottieni <a class=\"xl\" href=\"#scassinare\" data-id=\"scassinare\">Scassinare</a> (fuori limite). Quando tenti di evadere, segna fatica per trasformare un fallimento in <span class=\"res\">7-9</span>.</p>","text":"Ottieni Scassinare (fuori limite). Quando tenti di evadere, segna fatica per trasformare un fallimento in 7-9.","back":["pb-principe"]},{"id":"pb-principe-favorito","title":"Prediletto","cat":"mosse","group":"Erede","src":"VF p.118","aliases":["Prediletto"],"html":"<p>+1 Fortuna (max +3).</p>","text":"+1 Fortuna (max +3).","back":["pb-principe"]},{"id":"pb-cantastorie","title":"Il Cantastorie","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.121-124","aliases":["Cantastorie","Raconteur"],"html":"<p><em>Un narratore che guadagna monete e fiducia insegnando agli abitanti cosa credere dei fatti dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +2, Astuzia +1, Destrezza +1, Fortuna -1, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Improvvisare, Colpo Crudele</li><li><strong>Imprese</strong>: Falsificare, Borseggiare, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, donnola</li></ul><p><strong>Natura</strong></p><ul><li><em>Leggenda</em>: svuota la fatica quando ti esibisci davanti a un pubblico numeroso e attento.</li><li><em>Compagno</em>: svuota la fatica quando lodi un amico davanti a una persona o un gruppo potente.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-infamia\" data-id=\"mot-infamia\">Infamia</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Amico (vi hanno cacciato da una radura), Familiare (insieme in mille imprese, che hai reso famose).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cantastorie-strumenti\" data-id=\"pb-cantastorie-strumenti\">Attrezzi del Mestiere</a> + due tra <a class=\"xl\" href=\"#pb-cantastorie-fan\" data-id=\"pb-cantastorie-fan\">Fan Adoranti</a>, <a class=\"xl\" href=\"#pb-cantastorie-occhi\" data-id=\"pb-cantastorie-occhi\">Tutti gli Sguardi su di Me</a>, <a class=\"xl\" href=\"#pb-cantastorie-dita\" data-id=\"pb-cantastorie-dita\">Occhio sul Pubblico</a>, <a class=\"xl\" href=\"#pb-cantastorie-lingua\" data-id=\"pb-cantastorie-lingua\">Parlantina</a>, <a class=\"xl\" href=\"#pb-cantastorie-miele\" data-id=\"pb-cantastorie-miele\">Dolce come Miele</a>.</p>","text":"Un narratore che guadagna monete e fiducia insegnando agli abitanti cosa credere dei fatti dei Boschi. - Caratteristiche: Carisma +2, Astuzia +1, Destrezza +1, Fortuna -1, Vigore -1 - Abilità iniziale: Confondere i Sensi, Disarmare, Improvvisare, Colpo Crudele - Imprese: Falsificare, Borseggiare, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, donnola Natura - Leggenda: svuota la fatica quando ti esibisci davanti a un pubblico numeroso e attento. - Compagno: svuota la fatica quando lodi un amico davanti a una persona o un gruppo potente. Motivazioni: Scoperta, Brivido, Infamia, Zampe Pulite. Legami: Amico (vi hanno cacciato da una radura), Familiare (insieme in mille imprese, che hai reso famose). Mosse: inizi con Attrezzi del Mestiere + due tra Fan Adoranti, Tutti gli Sguardi su di Me, Occhio sul Pubblico, Parlantina, Dolce come Miele.","back":["playbook-indice"]},{"id":"pb-cantastorie-strumenti","title":"Attrezzi del Mestiere","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Attrezzi del Mestiere"],"html":"<p>Un simbolo del tuo talento (3 usura, inestimabile): strumento musicale, libro di poesie, costume o oggetto di scena. Scegli tre caratteristiche:</p><ul><li><em>Solido</em>: +2 usura; dopo un'esibizione pubblica svuota 1 usura.</li><li><em>Ammaliante</em>: segna usura invece di fatica per dare +2 quando aiuti distraendo.</li><li><em>Versatile</em>: due etichette.</li><li><em>Rivelatore</em>: esibendoti, segna usura per chiedere a uno spettatore cosa lo motiva davvero; +1 agendo sulla risposta.</li><li><em>Piacevole</em>: esibendoti per la banda sul sentiero, segna usura: ognuno svuota fino a 2-fatica extra.</li></ul><div class=\"move\"><p><strong>La prima volta che ti esibisci sinceramente in pubblico in una radura, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: nomina una fazione che lusinghi: un suo membro importante ti offre lavoro, e segni prestigio con quella fazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: nomina una fazione che lusinghi: un suo membro importante ti offre lavoro.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: attiri l'attenzione peggiore.</li></ul></div>","text":"Un simbolo del tuo talento (3 usura, inestimabile): strumento musicale, libro di poesie, costume o oggetto di scena. Scegli tre caratteristiche: - Solido: +2 usura; dopo un'esibizione pubblica svuota 1 usura. - Ammaliante: segna usura invece di fatica per dare +2 quando aiuti distraendo. - Versatile: due etichette. - Rivelatore: esibendoti, segna usura per chiedere a uno spettatore cosa lo motiva davvero; +1 agendo sulla risposta. - Piacevole: esibendoti per la banda sul sentiero, segna usura: ognuno svuota fino a 2-fatica extra. La prima volta che ti esibisci sinceramente in pubblico in una radura, tira su Carisma. - 10+ (successo pieno): nomina una fazione che lusinghi: un suo membro importante ti offre lavoro, e segni prestigio con quella fazione. - 7-9 (successo parziale): nomina una fazione che lusinghi: un suo membro importante ti offre lavoro. - 6- (fallimento): attiri l'attenzione peggiore.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-fan","title":"Fan Adoranti","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Fan Adoranti"],"html":"<div class=\"move\"><p><strong>Quando entri per la prima volta in una radura, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: un fan ti riconosce, fa tutto ciò che è scritto sotto ed è disposto a fare molto di più, anche a mettersi in pericolo per aiutarvi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: un fan ti riconosce e fa ciò che farebbe un buon ospite, senza correre rischi:<ul><li>vi racconta i pettegolezzi;</li><li>vi offre un posto dove stare;</li><li>fa da guida alla banda.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: un fan ben intenzionato peggiora subito, e di molto, la situazione.</li></ul></div>","text":"Quando entri per la prima volta in una radura, tira su Carisma. - 10+ (successo pieno): un fan ti riconosce, fa tutto ciò che è scritto sotto ed è disposto a fare molto di più, anche a mettersi in pericolo per aiutarvi. - 7-9 (successo parziale): un fan ti riconosce e fa ciò che farebbe un buon ospite, senza correre rischi: - vi racconta i pettegolezzi; - vi offre un posto dove stare; - fa da guida alla banda. - 6- (fallimento): un fan ben intenzionato peggiora subito, e di molto, la situazione.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-occhi","title":"Tutti gli Sguardi su di Me","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Tutti gli Sguardi su di Me"],"html":"<div class=\"move\"><p><strong>Quando crei un diversivo con un'esibizione stravagante, segna fatica e tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: nessuno distoglie lo sguardo: gli alleati hanno +1 continuo finché reciti; in più tieni 1 presa da spendere per dare +3 a uno di quei tiri.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: nessuno distoglie lo sguardo: gli alleati hanno +1 continuo finché reciti.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il pubblico si offende e ti fa sapere la sua opinione.</li></ul><p>Il +1 vale per:</p><ul><li><a class=\"xl\" href=\"#sgattaiolare\" data-id=\"sgattaiolare\">Sgattaiolare</a>;</li><li><a class=\"xl\" href=\"#nascondersi\" data-id=\"nascondersi\">nascondersi</a>;</li><li><a class=\"xl\" href=\"#borseggiare\" data-id=\"borseggiare\">Borseggiare</a>;</li><li><a class=\"xl\" href=\"#affidarsi-fato\" data-id=\"affidarsi-fato\">affidarsi al fato</a>.</li></ul></div>","text":"Quando crei un diversivo con un'esibizione stravagante, segna fatica e tira su Carisma. - 10+ (successo pieno): nessuno distoglie lo sguardo: gli alleati hanno +1 continuo finché reciti; in più tieni 1 presa da spendere per dare +3 a uno di quei tiri. - 7-9 (successo parziale): nessuno distoglie lo sguardo: gli alleati hanno +1 continuo finché reciti. - 6- (fallimento): il pubblico si offende e ti fa sapere la sua opinione. Il +1 vale per: - Sgattaiolare; - nascondersi; - Borseggiare; - affidarsi al fato.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-dita","title":"Occhio sul Pubblico","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Occhio sul Pubblico"],"html":"<p>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> mentre ti esibisci, puoi sempre fare una domanda, anche con un fallimento.</p>","text":"Quando valuti una situazione tesa mentre ti esibisci, puoi sempre fare una domanda, anche con un fallimento.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-lingua","title":"Parlantina","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Parlantina"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#convincere\" data-id=\"convincere\">convinci un PNG</a> con un aneddoto colorito, tira su Carisma come al solito.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo convinci (con una valida ragione o una mazzetta) e puoi segnare fatica per fargli rivelare qualcosa di importante sulla situazione.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il GM ti dice cosa devi fare subito per persuaderlo; puoi comunque segnare fatica per fargli rivelare qualcosa di importante.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non lo convinci e non rivela nulla; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando convinci un PNG con un aneddoto colorito, tira su Carisma come al solito. - 10+ (successo pieno): lo convinci (con una valida ragione o una mazzetta) e puoi segnare fatica per fargli rivelare qualcosa di importante sulla situazione. - 7-9 (successo parziale): il GM ti dice cosa devi fare subito per persuaderlo; puoi comunque segnare fatica per fargli rivelare qualcosa di importante. - 6- (fallimento): non lo convinci e non rivela nulla; il GM ti dice cosa succede e la situazione si complica.","back":["pb-cantastorie"]},{"id":"pb-cantastorie-miele","title":"Dolce come Miele","cat":"mosse","group":"Cantastorie","src":"VF p.122","aliases":["Dolce come Miele"],"html":"<p>+1 Carisma (max +3).</p>","text":"+1 Carisma (max +3).","back":["pb-cantastorie"]},{"id":"pb-razziatore","title":"Il Razziatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.125-128","aliases":["Razziatore","Raider"],"html":"<p><em>Un bandito che ruba con la forza, pericoloso ma forse capace di usare l'ascia a fin di bene (se pagato).</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia -1, Destrezza +1, Fortuna 0, Vigore +2</li><li><strong>Abilità iniziale</strong>: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Acrobazie, Attaccare alle Spalle</li><li><strong>Valore iniziale</strong>: 9</li></ul><p><strong>Natura</strong></p><ul><li><em>Bandito</em>: svuota la fatica quando usi la minaccia della forza per strappare oggetti di valore a un'opposizione temibile.</li><li><em>Eroe</em>: svuota la fatica quando attacchi apertamente un PNG pericoloso, oppressivo o malvagio.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-caos\" data-id=\"mot-caos\">Caos</a>, <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>.</p><p><strong>Legami</strong>: Protettore (l'hai protetto dalla tua stessa banda), Sentinella (ti ha battuto quando hai esagerato).</p><p><strong>Mosse</strong> (tre): <a class=\"xl\" href=\"#pb-razziatore-occhio\" data-id=\"pb-razziatore-occhio\">In Battaglia</a>, <a class=\"xl\" href=\"#pb-razziatore-pelle\" data-id=\"pb-razziatore-pelle\">Pelle di Ferro</a>, <a class=\"xl\" href=\"#pb-razziatore-saccheggio\" data-id=\"pb-razziatore-saccheggio\">Saccheggiare e Depredare</a>, <a class=\"xl\" href=\"#pb-razziatore-misericordia\" data-id=\"pb-razziatore-misericordia\">Misericordia</a>, <a class=\"xl\" href=\"#pb-razziatore-piano\" data-id=\"pb-razziatore-piano\">Piano d'Attacco</a>, <a class=\"xl\" href=\"#pb-razziatore-aspetto\" data-id=\"pb-razziatore-aspetto\">Volto Minaccioso</a>.</p>","text":"Un bandito che ruba con la forza, pericoloso ma forse capace di usare l'ascia a fin di bene (se pagato). - Caratteristiche: Carisma 0, Astuzia -1, Destrezza +1, Fortuna 0, Vigore +2 - Abilità iniziale: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele - Imprese: Acrobazie, Attaccare alle Spalle - Valore iniziale: 9 Natura - Bandito: svuota la fatica quando usi la minaccia della forza per strappare oggetti di valore a un'opposizione temibile. - Eroe: svuota la fatica quando attacchi apertamente un PNG pericoloso, oppressivo o malvagio. Motivazioni: Lealtà, Caos, Crimine, Avidità. Legami: Protettore (l'hai protetto dalla tua stessa banda), Sentinella (ti ha battuto quando hai esagerato). Mosse (tre): In Battaglia, Pelle di Ferro, Saccheggiare e Depredare, Misericordia, Piano d'Attacco, Volto Minaccioso.","back":["playbook-indice"]},{"id":"pb-razziatore-occhio","title":"In Battaglia","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["In Battaglia"],"html":"<div class=\"move\"><p><strong>Quando <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">valuti una situazione tesa</a> proprio mentre scoppia la violenza, tira su Vigore invece di Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: fai 3 domande di <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a> (+1 se agisci in base alle risposte).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: fai 1 domanda.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: nessuna domanda; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Quando valuti una situazione tesa proprio mentre scoppia la violenza, tira su Vigore invece di Astuzia. - 10+ (successo pieno): fai 3 domande di Valutare una Situazione Tesa (+1 se agisci in base alle risposte). - 7-9 (successo parziale): fai 1 domanda. - 6- (fallimento): nessuna domanda; il GM ti dice cosa succede e la situazione si complica.","back":["pb-razziatore"]},{"id":"pb-razziatore-pelle","title":"Pelle di Ferro","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Pelle di Ferro"],"html":"<p>Quando un gruppo ti infligge danno, subisci 2 danni in meno per attacco (minimo 1); quando infliggi danno a un gruppo, +1 danno.</p>","text":"Quando un gruppo ti infligge danno, subisci 2 danni in meno per attacco (minimo 1); quando infliggi danno a un gruppo, +1 danno.","back":["pb-razziatore"]},{"id":"pb-razziatore-saccheggio","title":"Saccheggiare e Depredare","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Saccheggiare e Depredare"],"html":"<div class=\"move\"><p><strong>Quando saccheggi un'area ricca, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: qualcosa di insolito attira il tuo sguardo ed è tuo; ottieni tutte e tre le qualità.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: qualcosa di insolito attira il tuo sguardo ed è tuo; scegli 1 qualità.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: lo prendi, ma è cercato da abitanti pronti a uccidere.</li></ul><p>Qualità (l'oggetto...):</p><ul><li>vale molto: +2-Valore;</li><li>ha un valore speciale per una fazione: +4 prestigio se glielo cedi;</li><li>è resistentissimo: +1 usura.</li></ul></div>","text":"Quando saccheggi un'area ricca, tira su Destrezza. - 10+ (successo pieno): qualcosa di insolito attira il tuo sguardo ed è tuo; ottieni tutte e tre le qualità. - 7-9 (successo parziale): qualcosa di insolito attira il tuo sguardo ed è tuo; scegli 1 qualità. - 6- (fallimento): lo prendi, ma è cercato da abitanti pronti a uccidere. Qualità (l'oggetto...): - vale molto: +2-Valore; - ha un valore speciale per una fazione: +4 prestigio se glielo cedi; - è resistentissimo: +1 usura.","back":["pb-razziatore"]},{"id":"pb-razziatore-misericordia","title":"Misericordia","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Misericordia"],"html":"<p>Quando cerchi di fare amicizia con un PNG che hai salvato dall'ira di un altro, aiutalo ancora (segna fatica) o offrigli da bere (segna consumo): ti rivelerà un segreto prezioso o ti farà un grande favore.</p>","text":"Quando cerchi di fare amicizia con un PNG che hai salvato dall'ira di un altro, aiutalo ancora (segna fatica) o offrigli da bere (segna consumo): ti rivelerà un segreto prezioso o ti farà un grande favore.","back":["pb-razziatore"]},{"id":"pb-razziatore-piano","title":"Piano d'Attacco","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Piano d'Attacco"],"html":"<div class=\"move\"><p><strong>Quando elabori un piano d'attacco con qualcuno, tira su Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: tieni 1 presa, ma il piano incontra subito un'opposizione disastrosa.</li></ul><p>Durante il piano, a qualsiasi distanza, spendi una presa per:</p><ul><li>dare +1 al tiro di qualcuno (dopo il tiro);</li><li>ridurre di 1 il danno di un attacco;</li><li>evitare a qualcuno di segnare consumo o usura.</li></ul></div>","text":"Quando elabori un piano d'attacco con qualcuno, tira su Vigore. - 10+ (successo pieno): tieni 3 prese. - 7-9 (successo parziale): tieni 2 prese. - 6- (fallimento): tieni 1 presa, ma il piano incontra subito un'opposizione disastrosa. Durante il piano, a qualsiasi distanza, spendi una presa per: - dare +1 al tiro di qualcuno (dopo il tiro); - ridurre di 1 il danno di un attacco; - evitare a qualcuno di segnare consumo o usura.","back":["pb-razziatore"]},{"id":"pb-razziatore-aspetto","title":"Volto Minaccioso","cat":"mosse","group":"Razziatore","src":"VF p.126","aliases":["Volto Minaccioso"],"html":"<p>Puoi usare <a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> e <a class=\"xl\" href=\"#attirare-attenzione\" data-id=\"attirare-attenzione\">Attirare l'Attenzione</a> con Reputazione 0 o inferiore (trattando il negativo come positivo: -1 diventa +1, 0 resta 0).</p>","text":"Puoi usare Fare una Minaccia Diretta e Attirare l'Attenzione con Reputazione 0 o inferiore (trattando il negativo come positivo: -1 diventa +1, 0 resta 0).","back":["pb-razziatore"]},{"id":"pb-cercatore","title":"Il Cercatore","cat":"playbook","group":"Viandanti e Forestieri","src":"VF p.129-132","aliases":["Cercatore","Seeker"],"html":"<p><em>Un esploratore nato, attratto dalle rovine e dai segreti antichi dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Disarmare, Parare, Tiro da Maestro</li><li><strong>Imprese</strong>: Acrobazie, Disattivare un Congegno, Scassinare</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, talpa</li></ul><p><strong>Natura</strong></p><ul><li><em>Esploratore</em>: svuota la fatica quando entri in una rovina o in un'area pericolosa della foresta.</li><li><em>Storico</em>: svuota la fatica quando impedisci a qualcuno di nascondere o offuscare la verità.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Compagno (avete visto insieme le meraviglie dei Boschi), Professionista (famoso per una sua scoperta).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cercatore-voci\" data-id=\"pb-cercatore-voci\">Gira Voce Che...</a> + due tra <a class=\"xl\" href=\"#pb-cercatore-perso\" data-id=\"pb-cercatore-perso\">Sempre all'Erta</a>, <a class=\"xl\" href=\"#pb-cercatore-tesori\" data-id=\"pb-cercatore-tesori\">Cacciatore di Tesori</a>, <a class=\"xl\" href=\"#pb-cercatore-contratto\" data-id=\"pb-cercatore-contratto\">Mecenate</a>, <a class=\"xl\" href=\"#pb-cercatore-segni\" data-id=\"pb-cercatore-segni\">Attento ai Segni</a>, <a class=\"xl\" href=\"#pb-cercatore-terreno\" data-id=\"pb-cercatore-terreno\">Terreno Instabile</a>.</p>","text":"Un esploratore nato, attratto dalle rovine e dai segreti antichi dei Boschi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +1, Fortuna +1, Vigore 0 - Abilità iniziale: Confondere i Sensi, Disarmare, Parare, Tiro da Maestro - Imprese: Acrobazie, Disattivare un Congegno, Scassinare - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, talpa Natura - Esploratore: svuota la fatica quando entri in una rovina o in un'area pericolosa della foresta. - Storico: svuota la fatica quando impedisci a qualcuno di nascondere o offuscare la verità. Motivazioni: Giustizia, Scoperta, Avidità, Voglia di Viaggiare. Legami: Compagno (avete visto insieme le meraviglie dei Boschi), Professionista (famoso per una sua scoperta). Mosse: inizi con Gira Voce Che... + due tra Sempre all'Erta, Cacciatore di Tesori, Mecenate, Attento ai Segni, Terreno Instabile.","back":["playbook-indice"]},{"id":"pb-cercatore-voci","title":"Gira Voce Che...","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Gira Voce Che"],"html":"<div class=\"move\"><p><strong>Quando passi del tempo a parlare con la gente di una radura, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: senti di una meraviglia o di una rovina inesplorata vicina, e qualcuno si offre di portartici per 1-Valore.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: come sopra, ma i pericoli alzano il prezzo di 1-Valore.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il luogo è minacciato: presto sarà saccheggiato, distrutto o reclamato.</li></ul></div>","text":"Quando passi del tempo a parlare con la gente di una radura, tira su Destrezza. - 10+ (successo pieno): senti di una meraviglia o di una rovina inesplorata vicina, e qualcuno si offre di portartici per 1-Valore. - 7-9 (successo parziale): come sopra, ma i pericoli alzano il prezzo di 1-Valore. - 6- (fallimento): il luogo è minacciato: presto sarà saccheggiato, distrutto o reclamato.","back":["pb-cercatore"]},{"id":"pb-cercatore-perso","title":"Sempre all'Erta","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Sempre all'Erta"],"html":"<p>Due caselle extra di ferite e di consumo usabili quando affronti pericoli in una rovina, e +1 continuo ad affidarti al fato e alle imprese da furfante mentre esplori luoghi antichi.</p>","text":"Due caselle extra di ferite e di consumo usabili quando affronti pericoli in una rovina, e +1 continuo ad affidarti al fato e alle imprese da furfante mentre esplori luoghi antichi.","back":["pb-cercatore"]},{"id":"pb-cercatore-tesori","title":"Cacciatore di Tesori","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Cacciatore di Tesori"],"html":"<div class=\"move\"><p><strong>Quando vendi al mercato i tesori trovati in una rovina, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: trovi compratori e ottieni entrambi i vantaggi.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: trovi compratori; scegli 1 vantaggio.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: vendi a prezzo equo, ma offendi qualcuno di potente.</li></ul><p>Vantaggi:</p><ul><li>ottieni il doppio del valore;</li><li>segni 2-prestigio con la fazione dominante.</li></ul></div>","text":"Quando vendi al mercato i tesori trovati in una rovina, tira su Astuzia. - 10+ (successo pieno): trovi compratori e ottieni entrambi i vantaggi. - 7-9 (successo parziale): trovi compratori; scegli 1 vantaggio. - 6- (fallimento): vendi a prezzo equo, ma offendi qualcuno di potente. Vantaggi: - ottieni il doppio del valore; - segni 2-prestigio con la fazione dominante.","back":["pb-cercatore"]},{"id":"pb-cercatore-contratto","title":"Mecenate","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Mecenate"],"html":"<div class=\"move\"><p><strong>Quando cerchi di convincere un PNG potente a finanziare una spedizione, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ti dà 8-Valore in risorse e consumo; in cambio chiede qualcosa di generico (ricchezze, informazioni, un trofeo).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ti dà 8-Valore in risorse e consumo; in cambio chiede qualcosa di specifico (un tesoro preciso, un sapere segreto).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: organizza una spedizione rivale con ciò che gli hai detto.</li></ul></div>","text":"Quando cerchi di convincere un PNG potente a finanziare una spedizione, tira su Astuzia. - 10+ (successo pieno): ti dà 8-Valore in risorse e consumo; in cambio chiede qualcosa di generico (ricchezze, informazioni, un trofeo). - 7-9 (successo parziale): ti dà 8-Valore in risorse e consumo; in cambio chiede qualcosa di specifico (un tesoro preciso, un sapere segreto). - 6- (fallimento): organizza una spedizione rivale con ciò che gli hai detto.","back":["pb-cercatore"]},{"id":"pb-cercatore-segni","title":"Attento ai Segni","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Attento ai Segni"],"html":"<div class=\"move\"><p><strong>Quando ti sintonizzi per la prima volta con una rovina studiandone segni e struttura, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: tieni 3 prese.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: tieni 2 prese.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: puoi segnare fatica per tenere 1 presa.</li></ul><p>Nella rovina spendi una presa per:</p><ul><li>individuare la via più rapida verso il tesoro o il sapere più vicino;</li><li>disinnescare una trappola o superare un pericolo naturale senza costi;</li><li>subire tu il danno destinato a un personaggio vicino;</li><li>raggiungere istantaneamente un personaggio nella rovina;</li><li>metterti al riparo, ignorando il danno di un attacco o di una catastrofe.</li></ul></div>","text":"Quando ti sintonizzi per la prima volta con una rovina studiandone segni e struttura, tira su Astuzia. - 10+ (successo pieno): tieni 3 prese. - 7-9 (successo parziale): tieni 2 prese. - 6- (fallimento): puoi segnare fatica per tenere 1 presa. Nella rovina spendi una presa per: - individuare la via più rapida verso il tesoro o il sapere più vicino; - disinnescare una trappola o superare un pericolo naturale senza costi; - subire tu il danno destinato a un personaggio vicino; - raggiungere istantaneamente un personaggio nella rovina; - metterti al riparo, ignorando il danno di un attacco o di una catastrofe.","back":["pb-cercatore","rovine-indice"]},{"id":"pb-cercatore-terreno","title":"Terreno Instabile","cat":"mosse","group":"Cercatore","src":"VF p.130","aliases":["Terreno Instabile"],"html":"<p>Quando sfrutti un ambiente caotico (rocce scivolose, mercato affollato) per avere vantaggio in combattimento, puoi <a class=\"xl\" href=\"#lottare\" data-id=\"lottare\">Lottare con un Nemico</a> con <strong>Destrezza</strong> invece di Vigore.</p>","text":"Quando sfrutti un ambiente caotico (rocce scivolose, mercato affollato) per avere vantaggio in combattimento, puoi Lottare con un Nemico con Destrezza invece di Vigore.","back":["pb-cercatore"]},{"id":"pb-trafficante","title":"Il Trafficante","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.67-72","aliases":["Trafficante","Dealer"],"html":"<p><em>Commerci oggetti importanti (reliquie, manufatti) e hai un impero da costruire.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia +2, Destrezza -1, Fortuna 0, Vigore 0</li><li><strong>Abilità iniziale</strong>: Incalzare, Improvvisare, Tiro Rapido, Assaltare un Gruppo</li><li><strong>Imprese</strong>: Falsificare</li><li><strong>Valore iniziale</strong>: 11</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, corvo</li></ul><p><strong>Natura</strong></p><ul><li><em>Boss</em>: svuota la fatica quando dai un esempio pubblico punendo chi minaccia i tuoi affari.</li><li><em>Intermediario</em>: svuota la fatica quando convinci qualcuno di influente a entrare in un'alleanza vantaggiosa per entrambi.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-crimine\" data-id=\"mot-crimine\">Crimine</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>.</p><p><strong>Legami</strong>: Amico (ti ha tirato fuori da un affare finito male), Compagno (avete consegnato un tesoro a una fazione nonostante un sabotaggio).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-trafficante-rete\" data-id=\"pb-trafficante-rete\">Rete Segreta</a> e <a class=\"xl\" href=\"#pb-trafficante-investimenti\" data-id=\"pb-trafficante-investimenti\">Investimenti!</a> + una tra <a class=\"xl\" href=\"#pb-trafficante-ricerca\" data-id=\"pb-trafficante-ricerca\">Ricerca di Mercato</a>, <a class=\"xl\" href=\"#pb-trafficante-bilance\" data-id=\"pb-trafficante-bilance\">Bilancia Truccata</a>, <a class=\"xl\" href=\"#pb-trafficante-valore\" data-id=\"pb-trafficante-valore\">La Parte Migliore del Valore</a>, <a class=\"xl\" href=\"#pb-trafficante-gracchiare\" data-id=\"pb-trafficante-gracchiare\">Fare il Galletto</a>.</p>","text":"Commerci oggetti importanti (reliquie, manufatti) e hai un impero da costruire. - Caratteristiche: Carisma +1, Astuzia +2, Destrezza -1, Fortuna 0, Vigore 0 - Abilità iniziale: Incalzare, Improvvisare, Tiro Rapido, Assaltare un Gruppo - Imprese: Falsificare - Valore iniziale: 11 - Specie: volpe, topo, coniglio, uccello, corvo Natura - Boss: svuota la fatica quando dai un esempio pubblico punendo chi minaccia i tuoi affari. - Intermediario: svuota la fatica quando convinci qualcuno di influente a entrare in un'alleanza vantaggiosa per entrambi. Motivazioni: Crimine, Avidità, Lealtà, Zampe Pulite. Legami: Amico (ti ha tirato fuori da un affare finito male), Compagno (avete consegnato un tesoro a una fazione nonostante un sabotaggio). Mosse: inizi con Rete Segreta e Investimenti! + una tra Ricerca di Mercato, Bilancia Truccata, La Parte Migliore del Valore, Fare il Galletto.","back":["playbook-indice"]},{"id":"pb-trafficante-rete","title":"Rete Segreta","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Rete Segreta"],"html":"<div class=\"move\"><p><strong>All'inizio del gioco o quando il tempo passa, nomina una fazione attiva e tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: come per <span class=\"res\">7-9</span>, ma il tesoro è così prezioso che anche un'altra fazione pagherebbe per tenerlo lontano (è possibile un'asta).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la tua rete ti segnala un tesoro desiderato da un membro di alto rango della fazione, che pagherà equamente (circa 6-Valore per membro della banda) e garantirà la vostra sicurezza alla consegna. Il GM sceglie fino a 2 complicazioni:<ul><li>il luogo è difficile da raggiungere;</li><li>è custodito da un'altra fazione o da un vagabondo;</li><li>il luogo è particolarmente pericoloso.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: un emissario ti chiede di recuperare un oggetto che avevi venduto a un'altra fazione. Scegli:<ul><li>accetti;</li><li>rifiuti: segni 3-nomea e ti fai un nemico.</li></ul></li></ul></div>","text":"All'inizio del gioco o quando il tempo passa, nomina una fazione attiva e tira su Astuzia. - 10+ (successo pieno): come per 7-9, ma il tesoro è così prezioso che anche un'altra fazione pagherebbe per tenerlo lontano (è possibile un'asta). - 7-9 (successo parziale): la tua rete ti segnala un tesoro desiderato da un membro di alto rango della fazione, che pagherà equamente (circa 6-Valore per membro della banda) e garantirà la vostra sicurezza alla consegna. Il GM sceglie fino a 2 complicazioni: - il luogo è difficile da raggiungere; - è custodito da un'altra fazione o da un vagabondo; - il luogo è particolarmente pericoloso. - 6- (fallimento): un emissario ti chiede di recuperare un oggetto che avevi venduto a un'altra fazione. Scegli: - accetti; - rifiuti: segni 3-nomea e ti fai un nemico.","back":["pb-trafficante"]},{"id":"pb-trafficante-investimenti","title":"Investimenti!","cat":"mosse","group":"Trafficante","src":"RS p.68-70","aliases":["Investimenti"],"html":"<p>Inizi con 10-Valore destinati agli Investimenti. Investendo almeno 5-Valore in una radura scegli un Investimento (uno per livello alla volta; poi aspetta che il tempo passi). Alcuni sono potenziamenti.</p><p><strong>5-Valore</strong></p><ul><li><em>Picchiatori locali</em>: segna 2-consumo per avere un piccolo gruppo per una scena.</li><li><em>Appoggio</em>: +1 continuo alle mosse di reputazione con la fazione di un notabile locale.</li><li><em>Occhi e orecchie</em>: +1 a Rete Segreta qui e nelle radure adiacenti.</li><li><em>Svendita</em>: un oggetto da 8-Valore a 5.</li><li><em>Prestito rischioso</em>: quando il tempo passa tira su Fortuna.<ul><li><strong><span class=\"res\">10+</span></strong>: ti rimborsano 10-Valore.</li><li><strong><span class=\"res\">7-9</span></strong>: il prestito attira le attenzioni di un capo fazione.</li><li><strong><span class=\"res\">6-</span></strong>: il debitore fugge.</li></ul></li></ul><p><strong>10-Valore</strong></p><ul><li><em>Esattori robusti</em>: un gruppo medio.</li><li><em>Amici altolocati</em>: segna fatica: un burocrate fa sparire prove o attenzioni.</li><li><em>Conoscere il territorio</em>: consulti uno storico su un tesoro: domande e +1 continuo.</li><li><em>Negozio</em>: +1 a imprese, capire, convincere, valutare e ingannare nel tuo locale.</li><li><em>Casa di prestiti</em>: riscuoti prestiti a ogni visita.</li></ul><p><strong>15-Valore</strong></p><ul><li><em>Apprendista</em>: crei un secondo PG.</li><li><em>Uno di noi</em>: un cambiamento importante nella radura; la tua Reputazione con i suoi abitanti conta +3.</li><li><em>Festa per i corvi</em>: la banda svuota la nomea con la fazione dominante e porta la Reputazione a 0, oppure segna 10-prestigio.</li><li><em>Salone espositivo</em>: ogni tesoro esposto dà 5-prestigio con ogni fazione e svuota la fatica.</li></ul>","text":"Inizi con 10-Valore destinati agli Investimenti. Investendo almeno 5-Valore in una radura scegli un Investimento (uno per livello alla volta; poi aspetta che il tempo passi). Alcuni sono potenziamenti. 5-Valore - Picchiatori locali: segna 2-consumo per avere un piccolo gruppo per una scena. - Appoggio: +1 continuo alle mosse di reputazione con la fazione di un notabile locale. - Occhi e orecchie: +1 a Rete Segreta qui e nelle radure adiacenti. - Svendita: un oggetto da 8-Valore a 5. - Prestito rischioso: quando il tempo passa tira su Fortuna. - 10+: ti rimborsano 10-Valore. - 7-9: il prestito attira le attenzioni di un capo fazione. - 6-: il debitore fugge. 10-Valore - Esattori robusti: un gruppo medio. - Amici altolocati: segna fatica: un burocrate fa sparire prove o attenzioni. - Conoscere il territorio: consulti uno storico su un tesoro: domande e +1 continuo. - Negozio: +1 a imprese, capire, convincere, valutare e ingannare nel tuo locale. - Casa di prestiti: riscuoti prestiti a ogni visita. 15-Valore - Apprendista: crei un secondo PG. - Uno di noi: un cambiamento importante nella radura; la tua Reputazione con i suoi abitanti conta +3. - Festa per i corvi: la banda svuota la nomea con la fazione dominante e porta la Reputazione a 0, oppure segna 10-prestigio. - Salone espositivo: ogni tesoro esposto dà 5-prestigio con ogni fazione e svuota la fatica.","back":["pb-trafficante"]},{"id":"pb-trafficante-ricerca","title":"Ricerca di Mercato","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Ricerca di Mercato"],"html":"<p>Quando <a class=\"xl\" href=\"#capire-intenzioni\" data-id=\"capire-intenzioni\">capisci le intenzioni</a> di qualcuno puoi sempre chiedere (anche con un fallimento) \"Di cosa ha disperatamente bisogno?\", con +1 agendo sulla risposta.</p>","text":"Quando capisci le intenzioni di qualcuno puoi sempre chiedere (anche con un fallimento) \"Di cosa ha disperatamente bisogno?\", con +1 agendo sulla risposta.","back":["pb-trafficante"]},{"id":"pb-trafficante-bilance","title":"Bilancia Truccata","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Bilancia Truccata"],"html":"<p>Ottieni <a class=\"xl\" href=\"#borseggiare\" data-id=\"borseggiare\">Borseggiare</a> e <a class=\"xl\" href=\"#gioco-prestigio\" data-id=\"gioco-prestigio\">Gioco di Prestigio</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando tenti un'impresa per frodare qualcuno di un bene, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: raggiungi l'obiettivo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: raggiungi l'obiettivo, ma scegli 1:<ul><li>segni fatica;</li><li>subisci un <a class=\"xl\" href=\"#rischi-imprese\" data-id=\"rischi-imprese\">rischio</a> scelto dal GM.</li></ul></li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non ci riesci; il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Borseggiare e Gioco di Prestigio (fuori limite). Quando tenti un'impresa per frodare qualcuno di un bene, tira su Astuzia. - 10+ (successo pieno): raggiungi l'obiettivo. - 7-9 (successo parziale): raggiungi l'obiettivo, ma scegli 1: - segni fatica; - subisci un rischio scelto dal GM. - 6- (fallimento): non ci riesci; il GM ti dice cosa succede e la situazione si complica.","back":["pb-trafficante"]},{"id":"pb-trafficante-valore","title":"La Parte Migliore del Valore","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["La Parte Migliore del Valore"],"html":"<div class=\"move\"><p><strong>Quando fingi teatralmente la tua morte durante uno scontro mettendoti fuori portata (cadere da un dirupo, gettarti nel fiume), tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ci cascano e vivi per combattere un altro giorno.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: ci cascano, ma perdi anche qualcosa di prezioso.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: subisci 2-ferite e i nemici ti sono ancora addosso.</li></ul></div>","text":"Quando fingi teatralmente la tua morte durante uno scontro mettendoti fuori portata (cadere da un dirupo, gettarti nel fiume), tira su Astuzia. - 10+ (successo pieno): ci cascano e vivi per combattere un altro giorno. - 7-9 (successo parziale): ci cascano, ma perdi anche qualcosa di prezioso. - 6- (fallimento): subisci 2-ferite e i nemici ti sono ancora addosso.","back":["pb-trafficante"]},{"id":"pb-trafficante-gracchiare","title":"Fare il Galletto","cat":"mosse","group":"Trafficante","src":"RS p.68","aliases":["Fare il Galletto"],"html":"<p>+1 Astuzia (max +3).</p>","text":"+1 Astuzia (max +3).","back":["pb-trafficante"]},{"id":"pb-buongustaio","title":"Lo Chef","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.73-76","aliases":["Chef","Gourmand"],"html":"<p><em>Un maestro nel trasformare ingredienti in arte; i migliori si trovano nei Boschi selvaggi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma +1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore -1</li><li><strong>Abilità iniziale</strong>: Confondere i Sensi, Improvvisare, Tiro Rapido, Tiro da Maestro</li><li><strong>Imprese</strong>: due a scelta</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, puzzola</li></ul><p><strong>Natura</strong></p><ul><li><em>Perfezionista</em>: svuota la fatica quando rifiuti con sdegno qualcosa perché pretendi (irragionevolmente) di meglio.</li><li><em>Fornitore</em>: svuota la fatica quando dai conforto o sostentamento a chi ne è privo, a tue spese.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-ambizione\" data-id=\"mot-ambizione\">Ambizione</a>, <a class=\"xl\" href=\"#mot-zampe-pulite\" data-id=\"mot-zampe-pulite\">Zampe Pulite</a>, <a class=\"xl\" href=\"#mot-scoperta\" data-id=\"mot-scoperta\">Scoperta</a>, <a class=\"xl\" href=\"#mot-lealta\" data-id=\"mot-lealta\">Lealtà</a>.</p><p><strong>Legami</strong>: Familiare (ti prendevi cura di lui), Amico (ti portava ingredienti in cambio di un pasto).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-buongustaio-erbe\" data-id=\"pb-buongustaio-erbe\">Erbe e Spezie</a>, <a class=\"xl\" href=\"#pb-buongustaio-ricetta\" data-id=\"pb-buongustaio-ricetta\">La Ricetta per il Successo</a> e <a class=\"xl\" href=\"#pb-buongustaio-servizio\" data-id=\"pb-buongustaio-servizio\">Servizio Eccellente</a> (+ altre con l'avanzamento: <a class=\"xl\" href=\"#pb-buongustaio-filetto\" data-id=\"pb-buongustaio-filetto\">Il Filetto Perfetto</a>, <a class=\"xl\" href=\"#pb-buongustaio-campo\" data-id=\"pb-buongustaio-campo\">Fuoco da Campo</a>, <a class=\"xl\" href=\"#pb-buongustaio-maestro\" data-id=\"pb-buongustaio-maestro\">Chef Rinomato</a>).</p>","text":"Un maestro nel trasformare ingredienti in arte; i migliori si trovano nei Boschi selvaggi. - Caratteristiche: Carisma +1, Astuzia +1, Destrezza +1, Fortuna 0, Vigore -1 - Abilità iniziale: Confondere i Sensi, Improvvisare, Tiro Rapido, Tiro da Maestro - Imprese: due a scelta - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, puzzola Natura - Perfezionista: svuota la fatica quando rifiuti con sdegno qualcosa perché pretendi (irragionevolmente) di meglio. - Fornitore: svuota la fatica quando dai conforto o sostentamento a chi ne è privo, a tue spese. Motivazioni: Ambizione, Zampe Pulite, Scoperta, Lealtà. Legami: Familiare (ti prendevi cura di lui), Amico (ti portava ingredienti in cambio di un pasto). Mosse: inizi con Erbe e Spezie, La Ricetta per il Successo e Servizio Eccellente (+ altre con l'avanzamento: Il Filetto Perfetto, Fuoco da Campo, Chef Rinomato).","back":["playbook-indice"]},{"id":"pb-buongustaio-erbe","title":"Erbe e Spezie","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Erbe e Spezie"],"html":"<div class=\"move\"><p><strong>Quando cerchi ingredienti in un ambiente adatto, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il GM ti indica un ingrediente che vale almeno 3-Valore e come raccoglierlo in sicurezza.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: il GM ti indica un ingrediente utile (almeno 1-Valore) e come raccoglierlo in sicurezza.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: non trovi nulla di accettabile: segna 2-fatica.</li></ul></div>","text":"Quando cerchi ingredienti in un ambiente adatto, tira su Astuzia. - 10+ (successo pieno): il GM ti indica un ingrediente che vale almeno 3-Valore e come raccoglierlo in sicurezza. - 7-9 (successo parziale): il GM ti indica un ingrediente utile (almeno 1-Valore) e come raccoglierlo in sicurezza. - 6- (fallimento): non trovi nulla di accettabile: segna 2-fatica.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-ricetta","title":"La Ricetta per il Successo","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["La Ricetta per il Successo"],"html":"<div class=\"move\"><p><strong>Quando cucini un pasto impressionante, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: il pasto è eccezionale: scegli benefici pari al Valore degli ingredienti più 2, e 1 costo.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli benefici pari al Valore degli ingredienti e 1 costo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: è un disastro. Scegli:<ul><li>segni 3-fatica e finisci il pasto;</li><li>non puoi più svuotare fatica finché non ne cucini uno riuscito.</li></ul></li></ul><p>Benefici:</p><ul><li>svuota 2-fatica (una sola volta);</li><li>svuota 1-ferita (anche due volte);</li><li>chiarezza: il GM ti illumina sui problemi;</li><li>cuore leggero: i PNG svuotano il morale, i PG hanno +1 continuo a un obiettivo della sessione.</li></ul><p>Costi:</p><ul><li>molto tempo;</li><li>2-consumo;</li><li>2-fatica;</li><li>1-ferita.</li></ul></div>","text":"Quando cucini un pasto impressionante, tira su Destrezza. - 10+ (successo pieno): il pasto è eccezionale: scegli benefici pari al Valore degli ingredienti più 2, e 1 costo. - 7-9 (successo parziale): scegli benefici pari al Valore degli ingredienti e 1 costo. - 6- (fallimento): è un disastro. Scegli: - segni 3-fatica e finisci il pasto; - non puoi più svuotare fatica finché non ne cucini uno riuscito. Benefici: - svuota 2-fatica (una sola volta); - svuota 1-ferita (anche due volte); - chiarezza: il GM ti illumina sui problemi; - cuore leggero: i PNG svuotano il morale, i PG hanno +1 continuo a un obiettivo della sessione. Costi: - molto tempo; - 2-consumo; - 2-fatica; - 1-ferita.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-servizio","title":"Servizio Eccellente","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Servizio Eccellente"],"html":"<div class=\"move\"><p><strong>Quando servi un pasto impressionante a un PNG importante, tira su Carisma.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: scegli 2 opzioni (+1 se il pasto era eccezionale).</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 opzione (+1 se il pasto era eccezionale).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul><p>Opzioni (ognuna si può scegliere due volte):</p><ul><li>risponde sinceramente a una domanda;</li><li>diffonde la tua fama: segna 3-prestigio;</li><li>smentisce i tuoi misfatti: cancella 3-nomea;</li><li>ti fa un dono da 2-Valore;</li><li>ti aiuta come con <span class=\"res\">10+</span> su <a class=\"xl\" href=\"#chiedere-favore\" data-id=\"chiedere-favore\">Chiedere un Favore</a>.</li></ul></div>","text":"Quando servi un pasto impressionante a un PNG importante, tira su Carisma. - 10+ (successo pieno): scegli 2 opzioni (+1 se il pasto era eccezionale). - 7-9 (successo parziale): scegli 1 opzione (+1 se il pasto era eccezionale). - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica. Opzioni (ognuna si può scegliere due volte): - risponde sinceramente a una domanda; - diffonde la tua fama: segna 3-prestigio; - smentisce i tuoi misfatti: cancella 3-nomea; - ti fa un dono da 2-Valore; - ti aiuta come con 10+ su Chiedere un Favore.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-filetto","title":"Il Filetto Perfetto","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Il Filetto Perfetto"],"html":"<p>Ottieni <a class=\"xl\" href=\"#colpo-crudele\" data-id=\"colpo-crudele\">Colpo Crudele</a> (fuori limite).</p><div class=\"move\"><p><strong>Quando lo usi con un utensile da cucina, tira su Destrezza invece di Vigore.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: danno grave (+1) non assorbibile dall'armatura, e colpisci senza essere colpito.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: danno grave non assorbibile, ma anche lui ti colpisce (o ti afferra).</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice cosa succede e la situazione si complica.</li></ul></div>","text":"Ottieni Colpo Crudele (fuori limite). Quando lo usi con un utensile da cucina, tira su Destrezza invece di Vigore. - 10+ (successo pieno): danno grave (+1) non assorbibile dall'armatura, e colpisci senza essere colpito. - 7-9 (successo parziale): danno grave non assorbibile, ma anche lui ti colpisce (o ti afferra). - 6- (fallimento): il GM ti dice cosa succede e la situazione si complica.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-campo","title":"Fuoco da Campo","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Fuoco da Campo"],"html":"<p>Quando cucini per vagabondi che dormono all'aperto, segna 1-fatica o 1-consumo: ognuno svuota 2-fatica extra.</p>","text":"Quando cucini per vagabondi che dormono all'aperto, segna 1-fatica o 1-consumo: ognuno svuota 2-fatica extra.","back":["pb-buongustaio"]},{"id":"pb-buongustaio-maestro","title":"Chef Rinomato","cat":"mosse","group":"Chef","src":"RS p.74","aliases":["Chef Rinomato"],"html":"<p>Quando convinci un PNG promettendogli un pasto impressionante, aggiungi anche la tua Reputazione con la sua fazione al Carisma (max +4).</p>","text":"Quando convinci un PNG promettendogli un pasto impressionante, aggiungi anche la tua Reputazione con la sua fazione al Carisma (max +4).","back":["pb-buongustaio"]},{"id":"pb-cacciatore","title":"Il Cacciatore","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.77-80","aliases":["Cacciatore","cacciatore di mostri","Hunter"],"html":"<p><em>Un nemico rapido e intelligente dei grandi mostri dei Boschi.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma -1, Astuzia +1, Destrezza +2, Fortuna -1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele</li><li><strong>Imprese</strong>: Attaccare alle Spalle, Disattivare un Congegno, Nascondersi</li><li><strong>Valore iniziale</strong>: 8</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, cardellino</li></ul><p><strong>Natura</strong></p><ul><li><em>Scettico</em>: svuota la fatica quando metti in dubbio apertamente e pericolosamente le intenzioni di un potente.</li><li><em>Romantico</em>: svuota la fatica quando ti rendi vulnerabile con qualcuno di cui speri di fidarti.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-giustizia\" data-id=\"mot-giustizia\">Giustizia</a>, <a class=\"xl\" href=\"#mot-protezione\" data-id=\"mot-protezione\">Protezione</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-avidita\" data-id=\"mot-avidita\">Avidità</a>.</p><p><strong>Legami</strong>: Sentinella (ha danneggiato degli abitanti), Professionista (avete affrontato insieme un mostro).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-cacciatore-trappole\" data-id=\"pb-cacciatore-trappole\">Lacci e Trappole</a> + due tra <a class=\"xl\" href=\"#pb-cacciatore-pista\" data-id=\"pb-cacciatore-pista\">Seguire Tracce</a>, <a class=\"xl\" href=\"#pb-cacciatore-bestie\" data-id=\"pb-cacciatore-bestie\">Ammazzabestie</a>, <a class=\"xl\" href=\"#pb-cacciatore-sprechi\" data-id=\"pb-cacciatore-sprechi\">Nessuno Spreco</a>, <a class=\"xl\" href=\"#pb-cacciatore-pozioni\" data-id=\"pb-cacciatore-pozioni\">Impiastri, Unguenti e Infusi</a>, <a class=\"xl\" href=\"#pb-cacciatore-sguardo\" data-id=\"pb-cacciatore-sguardo\">La Fama del Cacciatore</a>.</p>","text":"Un nemico rapido e intelligente dei grandi mostri dei Boschi. - Caratteristiche: Carisma -1, Astuzia +1, Destrezza +2, Fortuna -1, Vigore +1 - Abilità iniziale: Fracassare, Confondere i Sensi, Assaltare un Gruppo, Colpo Crudele - Imprese: Attaccare alle Spalle, Disattivare un Congegno, Nascondersi - Valore iniziale: 8 - Specie: volpe, topo, coniglio, uccello, cardellino Natura - Scettico: svuota la fatica quando metti in dubbio apertamente e pericolosamente le intenzioni di un potente. - Romantico: svuota la fatica quando ti rendi vulnerabile con qualcuno di cui speri di fidarti. Motivazioni: Giustizia, Protezione, Libertà, Avidità. Legami: Sentinella (ha danneggiato degli abitanti), Professionista (avete affrontato insieme un mostro). Mosse: inizi con Lacci e Trappole + due tra Seguire Tracce, Ammazzabestie, Nessuno Spreco, Impiastri, Unguenti e Infusi, La Fama del Cacciatore.","back":["playbook-indice"]},{"id":"pb-cacciatore-trappole","title":"Lacci e Trappole","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Lacci e Trappole"],"html":"<div class=\"move\"><p><strong>Quando prepari trappole in un'area, tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: segna consumo (min 1) per creare un oggetto <em>Trappole</em> con usura pari al doppio del consumo, +4.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: segna consumo (min 1) per creare un oggetto <em>Trappole</em> con usura pari al doppio del consumo.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: scopri un problema serio da risolvere prima.</li></ul></div><p>Usare le <em>Trappole</em>:</p><ul><li>segna usura sulle Trappole per far scattare una trappola a qualsiasi distanza contro un nemico nell'area: tiri <a class=\"xl\" href=\"#attaccare-mischia\" data-id=\"attaccare-mischia\">Attaccare in Mischia</a> o <a class=\"xl\" href=\"#prendere-mira\" data-id=\"prendere-mira\">Prendere la Mira</a> (o segna un'altra usura per usare un'abilità con le armi), sempre con +0;</li><li>se la mossa ti dice di subire danno, segna invece usura sulle Trappole;</li><li>se una trappola infligge danno, puoi segnare usura per +1 danno.</li></ul>","text":"Quando prepari trappole in un'area, tira su Destrezza. - 10+ (successo pieno): segna consumo (min 1) per creare un oggetto Trappole con usura pari al doppio del consumo, +4. - 7-9 (successo parziale): segna consumo (min 1) per creare un oggetto Trappole con usura pari al doppio del consumo. - 6- (fallimento): scopri un problema serio da risolvere prima. Usare le Trappole: - segna usura sulle Trappole per far scattare una trappola a qualsiasi distanza contro un nemico nell'area: tiri Attaccare in Mischia o Prendere la Mira (o segna un'altra usura per usare un'abilità con le armi), sempre con +0; - se la mossa ti dice di subire danno, segna invece usura sulle Trappole; - se una trappola infligge danno, puoi segnare usura per +1 danno.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-pista","title":"Seguire Tracce","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Seguire Tracce"],"html":"<div class=\"move\"><p><strong>Quando segui qualcuno o qualcosa, tira su Astuzia.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: sai dove sta andando.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: la pista è labile: se non la segui subito, non troverai la meta.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: il GM ti dice quale nuovo pericolo ti coglie.</li></ul></div>","text":"Quando segui qualcuno o qualcosa, tira su Astuzia. - 10+ (successo pieno): sai dove sta andando. - 7-9 (successo parziale): la pista è labile: se non la segui subito, non troverai la meta. - 6- (fallimento): il GM ti dice quale nuovo pericolo ti coglie.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-bestie","title":"Ammazzabestie","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Ammazzabestie"],"html":"<div class=\"move\"><p><strong>Segna fatica e 2-nomea con la fazione del bersaglio per fare una <a class=\"xl\" href=\"#minaccia-diretta\" data-id=\"minaccia-diretta\">Fare una Minaccia Diretta</a> tirando su Vigore invece che sulla Reputazione.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: lo intimorisci. Il GM ti dice cosa fa tra:<ul><li>si arrende;</li><li>si ritira;</li><li>ti attacca, ma in modo scomposto.</li></ul></li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: prima devi dare una prova concreta e sconvolgente delle tue cattive intenzioni.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: era preparato ad affrontare i tipi come te.</li></ul></div>","text":"Segna fatica e 2-nomea con la fazione del bersaglio per fare una Fare una Minaccia Diretta tirando su Vigore invece che sulla Reputazione. - 10+ (successo pieno): lo intimorisci. Il GM ti dice cosa fa tra: - si arrende; - si ritira; - ti attacca, ma in modo scomposto. - 7-9 (successo parziale): prima devi dare una prova concreta e sconvolgente delle tue cattive intenzioni. - 6- (fallimento): era preparato ad affrontare i tipi come te.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-sprechi","title":"Nessuno Spreco","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Nessuno Spreco"],"html":"<div class=\"move\"><p><strong>Quando frughi tra i resti di una battaglia recente, segna 2-nomea con la fazione dei presenti legati ai resti e tira su Destrezza.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: ottieni entrambe le cose.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: scegli 1 cosa.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: trovi poco (1-2 Valore) e ciò che hai visto ti perseguita: segna 2-fatica.</li></ul><p>Cose:</p><ul><li>oggetti di valore (3-6 Valore);</li><li>un oggetto subito utile.</li></ul></div>","text":"Quando frughi tra i resti di una battaglia recente, segna 2-nomea con la fazione dei presenti legati ai resti e tira su Destrezza. - 10+ (successo pieno): ottieni entrambe le cose. - 7-9 (successo parziale): scegli 1 cosa. - 6- (fallimento): trovi poco (1-2 Valore) e ciò che hai visto ti perseguita: segna 2-fatica. Cose: - oggetti di valore (3-6 Valore); - un oggetto subito utile.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-pozioni","title":"Impiastri, Unguenti e Infusi","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["Impiastri Unguenti e Infusi"],"html":"<p>Con tempo a disposizione, spendi consumo, uno alla volta, per preparare intrugli a effetto singolo. Per ogni consumo scegli 1 intruglio:</p><ul><li><em>Guarigione</em>: segna fatica, svuota 1-ferita;</li><li><em>Consapevolezza</em>: segna fatica, fai una domanda di <a class=\"xl\" href=\"#valutare\" data-id=\"valutare\">Valutare una Situazione Tesa</a>;</li><li><em>Energia</em>: svuota tutta la fatica, ma a fine scena segna 2-ferite;</li><li><em>Rapidità</em>: segna fatica, cambi distanza velocemente;</li><li><em>Frenesia</em>: segna fatica, +1-ferita al prossimo danno che infliggi nella scena.</li></ul>","text":"Con tempo a disposizione, spendi consumo, uno alla volta, per preparare intrugli a effetto singolo. Per ogni consumo scegli 1 intruglio: - Guarigione: segna fatica, svuota 1-ferita; - Consapevolezza: segna fatica, fai una domanda di Valutare una Situazione Tesa; - Energia: svuota tutta la fatica, ma a fine scena segna 2-ferite; - Rapidità: segna fatica, cambi distanza velocemente; - Frenesia: segna fatica, +1-ferita al prossimo danno che infliggi nella scena.","back":["pb-cacciatore"]},{"id":"pb-cacciatore-sguardo","title":"La Fama del Cacciatore","cat":"mosse","group":"Cacciatore","src":"RS p.78","aliases":["La Fama del Cacciatore"],"html":"<p>Quando <a class=\"xl\" href=\"#incontrare-importante\" data-id=\"incontrare-importante\">incontri qualcuno di importante</a> presentandoti come cacciatore, puoi segnare nomea con la sua fazione per tirare con +1 invece della Reputazione.</p>","text":"Quando incontri qualcuno di importante presentandoti come cacciatore, puoi segnare nomea con la sua fazione per tirare con +1 invece della Reputazione.","back":["pb-cacciatore"]},{"id":"pb-nomade","title":"Il Nomade","cat":"playbook","group":"Rovine e Spedizioni","src":"RS p.81-84","aliases":["Nomade","Nomad"],"html":"<p><em>Non sei dei Boschi: hai viaggiato a lungo e vuoi vedere tutto di questa terra in guerra.</em></p><ul><li><strong>Caratteristiche</strong>: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +1, Vigore +1</li><li><strong>Abilità iniziale</strong>: Fracassare, Parare, Assaltare un Gruppo, Tiro da Maestro</li><li><strong>Imprese</strong>: tre a scelta</li><li><strong>Valore iniziale</strong>: 7</li><li><strong>Specie</strong>: volpe, topo, coniglio, uccello, lemure</li></ul><p><strong>Natura</strong></p><ul><li><em>Stolto</em>: svuota la fatica quando metti in imbarazzo un'autorità dicendo pubblicamente una verità che nessuno osa dirle.</li><li><em>Saggio</em>: svuota la fatica quando convinci un abitante ad abbandonare un'usanza o un ruolo che non gli serve più.</li></ul><p><strong>Motivazioni</strong>: <a class=\"xl\" href=\"#mot-principi\" data-id=\"mot-principi\">Princìpi</a>, <a class=\"xl\" href=\"#mot-liberta\" data-id=\"mot-liberta\">Libertà</a>, <a class=\"xl\" href=\"#mot-brivido\" data-id=\"mot-brivido\">Brivido</a>, <a class=\"xl\" href=\"#mot-voglia-viaggiare\" data-id=\"mot-voglia-viaggiare\">Voglia di Viaggiare</a>.</p><p><strong>Legami</strong>: Sentinella (l'hai visto fare qualcosa di coraggioso e sciocco), Protettore (è ancora inesperto).</p><p><strong>Mosse</strong>: inizi con <a class=\"xl\" href=\"#pb-nomade-piedi\" data-id=\"pb-nomade-piedi\">Smania di Partire</a> e <a class=\"xl\" href=\"#pb-nomade-straniero\" data-id=\"pb-nomade-straniero\">Straniero in Terra Straniera</a> + una tra <a class=\"xl\" href=\"#pb-nomade-verita\" data-id=\"pb-nomade-verita\">La Verità al Potere</a>, <a class=\"xl\" href=\"#pb-nomade-stella\" data-id=\"pb-nomade-stella\">Nato Sotto una Stella Cometa</a>, <a class=\"xl\" href=\"#pb-nomade-visto\" data-id=\"pb-nomade-visto\">Non è la Prima Volta</a>, <a class=\"xl\" href=\"#pb-nomade-prendo\" data-id=\"pb-nomade-prendo\">Questa la Prendo Io</a>.</p>","text":"Non sei dei Boschi: hai viaggiato a lungo e vuoi vedere tutto di questa terra in guerra. - Caratteristiche: Carisma 0, Astuzia 0, Destrezza 0, Fortuna +1, Vigore +1 - Abilità iniziale: Fracassare, Parare, Assaltare un Gruppo, Tiro da Maestro - Imprese: tre a scelta - Valore iniziale: 7 - Specie: volpe, topo, coniglio, uccello, lemure Natura - Stolto: svuota la fatica quando metti in imbarazzo un'autorità dicendo pubblicamente una verità che nessuno osa dirle. - Saggio: svuota la fatica quando convinci un abitante ad abbandonare un'usanza o un ruolo che non gli serve più. Motivazioni: Princìpi, Libertà, Brivido, Voglia di Viaggiare. Legami: Sentinella (l'hai visto fare qualcosa di coraggioso e sciocco), Protettore (è ancora inesperto). Mosse: inizi con Smania di Partire e Straniero in Terra Straniera + una tra La Verità al Potere, Nato Sotto una Stella Cometa, Non è la Prima Volta, Questa la Prendo Io.","back":["playbook-indice"]},{"id":"pb-nomade-piedi","title":"Smania di Partire","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Smania di Partire"],"html":"<p>Quando metti a frutto le esperienze di viaggio per risolvere un problema, segna una condizione per prendere <span class=\"res\">10+</span> senza tirare su qualsiasi mossa:</p><ul><li><em>Annoiato</em>: barra una casella di fatica (non svuotabile); impara un'abilità o tradizione locale per guarire.</li><li><em>Irritabile</em>: -2 a convincere; guarisci provando un'usanza locale rilassante.</li><li><em>Apatico</em>: -2 a ingannare; guarisci con un divertimento locale eccitante.</li><li><em>Distratto</em>: -2 alle imprese da furfante; guarisci aiutando un abitante in un lavoro faticoso.</li></ul><p>Lasciando una radura per la strada aperta, guarisci una condizione e la banda ha +1 alla mossa di viaggio.</p>","text":"Quando metti a frutto le esperienze di viaggio per risolvere un problema, segna una condizione per prendere 10+ senza tirare su qualsiasi mossa: - Annoiato: barra una casella di fatica (non svuotabile); impara un'abilità o tradizione locale per guarire. - Irritabile: -2 a convincere; guarisci provando un'usanza locale rilassante. - Apatico: -2 a ingannare; guarisci con un divertimento locale eccitante. - Distratto: -2 alle imprese da furfante; guarisci aiutando un abitante in un lavoro faticoso. Lasciando una radura per la strada aperta, guarisci una condizione e la banda ha +1 alla mossa di viaggio.","back":["pb-nomade"]},{"id":"pb-nomade-straniero","title":"Straniero in Terra Straniera","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Straniero in Terra Straniera"],"html":"<div class=\"move\"><p><strong>Quando giri da solo per una radura osservando gli abitanti, tira su Fortuna.</strong></p><ul class=\"out\"><li class=\"o-hit\"><strong class=\"olab\"><span class=\"res\">10+</span> (successo pieno)</strong>: fai 2 domande.</li><li class=\"o-mid\"><strong class=\"olab\"><span class=\"res\">7-9</span> (successo parziale)</strong>: fai 1 domanda.</li><li class=\"o-miss\"><strong class=\"olab\"><span class=\"res\">6-</span> (fallimento)</strong>: finisci in una situazione imbarazzante, pericolosa o compromettente.</li></ul><p>Domande:</p><ul><li>Chi può cambiare le cose qui?</li><li>Qual è il punto debole della radura?</li><li>Di chi può fidarsi la banda?</li><li>Qual è la minaccia più grande per la fazione dominante?</li></ul></div>","text":"Quando giri da solo per una radura osservando gli abitanti, tira su Fortuna. - 10+ (successo pieno): fai 2 domande. - 7-9 (successo parziale): fai 1 domanda. - 6- (fallimento): finisci in una situazione imbarazzante, pericolosa o compromettente. Domande: - Chi può cambiare le cose qui? - Qual è il punto debole della radura? - Di chi può fidarsi la banda? - Qual è la minaccia più grande per la fazione dominante?","back":["pb-nomade"]},{"id":"pb-nomade-verita","title":"La Verità al Potere","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["La Verità al Potere"],"html":"<p>Quando condividi la tua prospettiva di straniero per <a class=\"xl\" href=\"#influenzare\" data-id=\"influenzare\">Influenzare un PNG</a> un'autorità, segna fatica per tirare su <strong>Fortuna</strong> invece della Reputazione.</p>","text":"Quando condividi la tua prospettiva di straniero per Influenzare un PNG un'autorità, segna fatica per tirare su Fortuna invece della Reputazione.","back":["pb-nomade"]},{"id":"pb-nomade-stella","title":"Nato Sotto una Stella Cometa","cat":"mosse","group":"Nomade","src":"RS p.82","aliases":["Nato Sotto una Stella Cometa"],"html":"<p>Una casella extra di fatica. Quando viaggi sul sentiero a passo tranquil
