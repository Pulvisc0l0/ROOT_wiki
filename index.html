4-usura in un colpo), ogni carica infligge 2-ferite a chi è vicino e acceca chi guarda. - La Lancia Richiamante (usura 6, Ingombro 1): con il suo guanto. Lancio a distanza lunga per 2-ferite (con 10+ può infliggere +2 invece del secondo colpo); Richiamo magnetico al guanto; in mischia 2-ferite a distanza ravvicinata. - L'Armatura di Pietralegno (Ingombro 2): legno pietrificato vivo, indistruttibile da assemblata; si carica nutrendosi della vegetazione e la uccide. - Il Calderone Cornucopia: lega indistruttibile (vedi RS p.119-120). Il GM può crearne di nuove liberamente.","back":["usare-congegno","custodire-reliquia","rovine-indice","generare-rovine","fazione-custodi"]},{"id":"mostri-indice","title":"Mostri dei Boschi","cat":"indici","group":"","src":"RS p.121-146","aliases":["mostri","mostro","bestiario"],"html":"<p>I mostri vivono nelle foreste profonde, nelle rovine e nelle acque più scure: di solito artropodi, serpenti, pesci e altre specie che non sono abitanti, spesso molto più grandi di un vagabondo. Ogni scheda ha tracciati dei danni, danno inflitto, un <a class=\"xl\" href=\"#mostri-istinti\" data-id=\"mostri-istinti\">istinto</a>, <a class=\"xl\" href=\"#mostri-tratti\" data-id=\"mostri-tratti\">tratti</a> e mosse del GM.</p><p><strong>Bestiario</strong>: <a class=\"xl\" href=\"#mostro-trota\" data-id=\"mostro-trota\">Trota Gigante</a>, <a class=\"xl\" href=\"#mostro-formiche\" data-id=\"mostro-formiche\">Formiche di Fuoco Giganti</a>, <a class=\"xl\" href=\"#mostro-ragno\" data-id=\"mostro-ragno\">Ragno Gigante</a>, <a class=\"xl\" href=\"#mostro-serpente\" data-id=\"mostro-serpente\">Serpente Gigante</a>, <a class=\"xl\" href=\"#mostro-scorpione\" data-id=\"mostro-scorpione\">Scorpione Gigante</a>, <a class=\"xl\" href=\"#mostro-calabrone\" data-id=\"mostro-calabrone\">Calabroni Giganti</a>, <a class=\"xl\" href=\"#mostro-ape\" data-id=\"mostro-ape\">Api Mellifere Giganti</a>, <a class=\"xl\" href=\"#mostro-scarabeo\" data-id=\"mostro-scarabeo\">Scarabeo Ercole Gigante</a>, <a class=\"xl\" href=\"#mostro-alligatore\" data-id=\"mostro-alligatore\">Alligatore Gigante</a>, <a class=\"xl\" href=\"#mostro-pianta\" data-id=\"mostro-pianta\">Pianta Carnivora Gigante</a>. Anche l'<a class=\"xl\" href=\"#png-linee-guida\" data-id=\"png-linee-guida\">orso</a> del manuale base.</p><p>Per crearne di nuovi: <a class=\"xl\" href=\"#creare-mostri\" data-id=\"creare-mostri\">Creare Mostri</a>. Motivazione legata: <a class=\"xl\" href=\"#mot-guardiano\" data-id=\"mot-guardiano\">Guardiano</a>; playbook: <a class=\"xl\" href=\"#pb-cacciatore\" data-id=\"pb-cacciatore\">Cacciatore</a>.</p>","text":"I mostri vivono nelle foreste profonde, nelle rovine e nelle acque più scure: di solito artropodi, serpenti, pesci e altre specie che non sono abitanti, spesso molto più grandi di un vagabondo. Ogni scheda ha tracciati dei danni, danno inflitto, un istinto, tratti e mosse del GM. Bestiario: Trota Gigante, Formiche di Fuoco Giganti, Ragno Gigante, Serpente Gigante, Scorpione Gigante, Calabroni Giganti, Api Mellifere Giganti, Scarabeo Ercole Gigante, Alligatore Gigante, Pianta Carnivora Gigante. Anche l'orso del manuale base. Per crearne di nuovi: Creare Mostri. Motivazione legata: Guardiano; playbook: Cacciatore.","back":["png-linee-guida","mot-guardiano","rovine-indice"]},{"id":"mostro-trota","title":"Trota Gigante","cat":"mostri","group":"","src":"RS p.124-125","aliases":["Trota Gigante"],"html":"<p><em>Nei laghi più profondi, una minaccia scintillante risale per inghiottire barche e pescatori.</em></p><ul><li><strong>Tracciati</strong>: fatica 10, ferite 12, usura 4, morale 6</li><li><strong>Danno inflitto</strong>: 3-ferite</li><li><strong>Istinto</strong>: <a class=\"xl\" href=\"#mostri-istinti\" data-id=\"mostri-istinti\">Testardo</a></li><li><strong>Tratti</strong>: Acquatico, Terrificante, Aggressivo, Intrappolante (denti vomerini), Sfuggente (scaglie viscide)</li><li><strong>Mosse</strong>: rovesciare una barca facendo cadere tutti in acqua; colpire rapidamente fuori dalle onde a contatto; immergersi evitando i danni; dimenarsi per liberarsi.</li></ul><p>Consiglio: è una minaccia da preparare e prefigurare (ombre scure, pinne, tonfi lontani). Bande poco combattive dovranno trovare vie alternative.</p>","text":"Nei laghi più profondi, una minaccia scintillante risale per inghiottire barche e pescatori. - Tracciati: fatica 10, ferite 12, usura 4, morale 6 - Danno inflitto: 3-ferite - Istinto: Testardo - Tratti: Acquatico, Terrificante, Aggressivo, Intrappolante (denti vomerini), Sfuggente (scaglie viscide) - Mosse: rovesciare una barca facendo cadere tutti in acqua; colpire rapidamente fuori dalle onde a contatto; immergersi evitando i danni; dimenarsi per liberarsi. Consiglio: è una minaccia da preparare e prefigurare (ombre scure, pinne, tonfi lontani). Bande poco combattive dovranno trovare vie alternative.","back":["mostri-indice"]},{"id":"mostro-formiche","title":"Formiche di Fuoco Giganti","cat":"mostri","group":"","src":"RS p.126-127","aliases":["Formiche di Fuoco Giganti","formiche"],"html":"<p><em>Deboli da sole, travolgenti in massa: legioni al servizio della regina.</em></p><ul><li><strong>Individuo</strong>: fatica 1, ferite 2, usura 1, nessun morale — infligge 1-ferita</li><li><strong>Gruppi</strong>: usa le regole dei <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">gruppi</a> (+2/+4/+6 caselle, danno ×2/×3/×4); oltre un piccolo gruppo diventano uno <strong>Sciame</strong></li><li><strong>Regina</strong>: fatica 4, ferite 2, usura 3, morale 3</li><li><strong>Istinto</strong>: Protettivo</li><li><strong>Tratti</strong>: Sciame (supporto 6), Corazzato (guscio chitinoso), Velenoso (pungiglione), Affilato (mandibole), Mente Alveare</li><li><strong>Mosse</strong>: seppellire qualcuno sotto una marea di corpi; serrare le mandibole su un arto o un'arma; correre su terreni accidentati o verticali; richiamare altre formiche.</li></ul><p>Nel nido combattono fino alla morte; fuori si ritirano alla prima resistenza. Se sopraffanno la banda, possono trascinare un vagabondo creduto morto nel formicaio.</p>","text":"Deboli da sole, travolgenti in massa: legioni al servizio della regina. - Individuo: fatica 1, ferite 2, usura 1, nessun morale — infligge 1-ferita - Gruppi: usa le regole dei gruppi (+2/+4/+6 caselle, danno ×2/×3/×4); oltre un piccolo gruppo diventano uno Sciame - Regina: fatica 4, ferite 2, usura 3, morale 3 - Istinto: Protettivo - Tratti: Sciame (supporto 6), Corazzato (guscio chitinoso), Velenoso (pungiglione), Affilato (mandibole), Mente Alveare - Mosse: seppellire qualcuno sotto una marea di corpi; serrare le mandibole su un arto o un'arma; correre su terreni accidentati o verticali; richiamare altre formiche. Nel nido combattono fino alla morte; fuori si ritirano alla prima resistenza. Se sopraffanno la banda, possono trascinare un vagabondo creduto morto nel formicaio.","back":["mostri-indice"]},{"id":"mostro-ragno","title":"Ragno Gigante","cat":"mostri","group":"","src":"RS p.128-129","aliases":["Ragno Gigante"],"html":"<p><em>Astuto e letale: aspetta nelle chiome o nei tunnel prede che non lo vedranno arrivare.</em></p><ul><li><strong>Tracciati</strong>: fatica 8, ferite 5, usura 3, morale 5</li><li><strong>Danno inflitto</strong>: 2-ferite</li><li><strong>Istinto</strong>: Predatore</li><li><strong>Tratti</strong>: Aggressivo (specie terrestre), Furtivo (specie arboricola), Intrappolante (ragnatele), Terrificante, Velenoso (morso)</li><li><strong>Mosse</strong>: avvolgere un bersaglio nella seta; sputare veleno fino a distanza lunga; rifugiarsi in un nascondiglio insolito; spostarsi su una parete o un soffitto.</li></ul><p>Colpisce duro e in fretta; se non sottomette subito la preda, fugge. Veleno e seta interessano Corvidi, erboristi e la Compagnia del Fiume.</p>","text":"Astuto e letale: aspetta nelle chiome o nei tunnel prede che non lo vedranno arrivare. - Tracciati: fatica 8, ferite 5, usura 3, morale 5 - Danno inflitto: 2-ferite - Istinto: Predatore - Tratti: Aggressivo (specie terrestre), Furtivo (specie arboricola), Intrappolante (ragnatele), Terrificante, Velenoso (morso) - Mosse: avvolgere un bersaglio nella seta; sputare veleno fino a distanza lunga; rifugiarsi in un nascondiglio insolito; spostarsi su una parete o un soffitto. Colpisce duro e in fretta; se non sottomette subito la preda, fugge. Veleno e seta interessano Corvidi, erboristi e la Compagnia del Fiume.","back":["mostri-indice"]},{"id":"mostro-serpente","title":"Serpente Gigante","cat":"mostri","group":"","src":"RS p.130-131","aliases":["Serpente Gigante"],"html":"<p><em>Il mostro più comune dei Boschi, e tra i più letali.</em></p><ul><li><strong>Tracciati</strong>: fatica 5, ferite 5, usura 4, morale 4</li><li><strong>Danno inflitto</strong>: 2-ferite</li><li><strong>Istinto</strong>: Predatore</li><li><strong>Tratti</strong>: Intrappolante (spire), Sfuggente, Furtivo, Velenoso (morso)</li><li><strong>Mosse</strong>: avvolgere un bersaglio immobilizzandolo; rinunciare alla posizione per un colpo rapido e potente; scivolare in un punto irraggiungibile; colpire e cambiare distanza prima che qualcuno reagisca.</li></ul><p>Varianti: uno piccolo ha 2-3 caselle in meno per tracciato e niente veleno; uno leggendario raddoppia i tracciati e diventa Terrificante; aggiungi Corazzato o Affilato a piacere.</p>","text":"Il mostro più comune dei Boschi, e tra i più letali. - Tracciati: fatica 5, ferite 5, usura 4, morale 4 - Danno inflitto: 2-ferite - Istinto: Predatore - Tratti: Intrappolante (spire), Sfuggente, Furtivo, Velenoso (morso) - Mosse: avvolgere un bersaglio immobilizzandolo; rinunciare alla posizione per un colpo rapido e potente; scivolare in un punto irraggiungibile; colpire e cambiare distanza prima che qualcuno reagisca. Varianti: uno piccolo ha 2-3 caselle in meno per tracciato e niente veleno; uno leggendario raddoppia i tracciati e diventa Terrificante; aggiungi Corazzato o Affilato a piacere.","back":["mostri-indice"]},{"id":"mostro-scorpione","title":"Scorpione Gigante","cat":"mostri","group":"","src":"RS p.132-133","aliases":["Scorpione Gigante"],"html":"<p><em>Chele, coda a falce e veleno: una tripla minaccia, comune nelle rovine.</em></p><ul><li><strong>Tracciati</strong>: fatica 5, ferite 3, usura 6, morale 6</li><li><strong>Danno inflitto</strong>: 2-ferite</li><li><strong>Istinto</strong>: Protettivo</li><li><strong>Tratti</strong>: Corazzato (guscio), Affilato (chele), Titanico, Velenoso (pungiglione)</li><li><strong>Mosse</strong>: spazzare più bersagli con la coda; scalare una superficie verticale; lanciare sabbia per accecare; caricare un bersaglio atterrandolo.</li></ul><p>Preferisce tenere le prede a distanza; da vicino è più vulnerabile tra le placche. Porta via le prede per mangiarle al sicuro: c'è tempo per salvarle.</p>","text":"Chele, coda a falce e veleno: una tripla minaccia, comune nelle rovine. - Tracciati: fatica 5, ferite 3, usura 6, morale 6 - Danno inflitto: 2-ferite - Istinto: Protettivo - Tratti: Corazzato (guscio), Affilato (chele), Titanico, Velenoso (pungiglione) - Mosse: spazzare più bersagli con la coda; scalare una superficie verticale; lanciare sabbia per accecare; caricare un bersaglio atterrandolo. Preferisce tenere le prede a distanza; da vicino è più vulnerabile tra le placche. Porta via le prede per mangiarle al sicuro: c'è tempo per salvarle.","back":["mostri-indice"]},{"id":"mostro-calabrone","title":"Calabroni Giganti","cat":"mostri","group":"","src":"RS p.134-135","aliases":["Calabroni Giganti","calabrone"],"html":"<p><em>Aggressivi e carnivori: richiamano lo sciame con feromoni d'attacco.</em></p><ul><li><strong>Individuo</strong>: fatica 2, ferite 2, usura 2, morale 2 — infligge 2-ferite</li><li><strong>Gruppi</strong>: regole dei <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">gruppi</a>; oltre un piccolo gruppo diventano uno <strong>Sciame</strong></li><li><strong>Regina</strong>: fatica 3, ferite 3, usura 3, morale 3</li><li><strong>Istinto</strong>: Testardo</li><li><strong>Tratti</strong>: Sciame (supporto 8), Corazzato, Velenoso (pungiglione), Volante</li><li><strong>Mosse</strong>: schizzare in aria evitando di essere intrappolati; recidere un ramo, un legame o un pezzo d'equipaggiamento; sopraffare un attaccante con chitina e pungiglioni; richiamare altri calabroni.</li></ul>","text":"Aggressivi e carnivori: richiamano lo sciame con feromoni d'attacco. - Individuo: fatica 2, ferite 2, usura 2, morale 2 — infligge 2-ferite - Gruppi: regole dei gruppi; oltre un piccolo gruppo diventano uno Sciame - Regina: fatica 3, ferite 3, usura 3, morale 3 - Istinto: Testardo - Tratti: Sciame (supporto 8), Corazzato, Velenoso (pungiglione), Volante - Mosse: schizzare in aria evitando di essere intrappolati; recidere un ramo, un legame o un pezzo d'equipaggiamento; sopraffare un attaccante con chitina e pungiglioni; richiamare altri calabroni.","back":["mostri-indice"]},{"id":"mostro-ape","title":"Api Mellifere Giganti","cat":"mostri","group":"","src":"RS p.136-137","aliases":["Api Mellifere Giganti","ape"],"html":"<p><em>Per lo più pacifiche... ma il loro miele è irresistibile.</em></p><ul><li><strong>Individuo</strong>: fatica 1, ferite 2, usura 1, nessun morale — infligge 1-ferita</li><li><strong>Gruppi</strong>: regole dei <a class=\"xl\" href=\"#png-gruppi\" data-id=\"png-gruppi\">gruppi</a>; oltre un piccolo gruppo diventano uno <strong>Sciame</strong></li><li><strong>Regina</strong>: fatica 3, ferite 2, usura 2, morale 2</li><li><strong>Istinto</strong>: Docile</li><li><strong>Tratti</strong>: Sciame (supporto 8), Velenoso (pungiglione), Volante, Mente Alveare</li><li><strong>Mosse</strong>: alzarsi pigramente in volo evitando gli attacchi; scuotersi rilasciando una nube di polline; seppellire un attaccante sotto uno sciame; richiamare altre api.</li></ul><p>Il pungiglione è l'ultima risorsa, fatale anche per loro. Spesso sono le difese di un alveare da svaligiare.</p>","text":"Per lo più pacifiche... ma il loro miele è irresistibile. - Individuo: fatica 1, ferite 2, usura 1, nessun morale — infligge 1-ferita - Gruppi: regole dei gruppi; oltre un piccolo gruppo diventano uno Sciame - Regina: fatica 3, ferite 2, usura 2, morale 2 - Istinto: Docile - Tratti: Sciame (supporto 8), Velenoso (pungiglione), Volante, Mente Alveare - Mosse: alzarsi pigramente in volo evitando gli attacchi; scuotersi rilasciando una nube di polline; seppellire un attaccante sotto uno sciame; richiamare altre api. Il pungiglione è l'ultima risorsa, fatale anche per loro. Spesso sono le difese di un alveare da svaligiare.","back":["mostri-indice"]},{"id":"mostro-scarabeo","title":"Scarabeo Ercole Gigante","cat":"mostri","group":"","src":"RS p.138-139","aliases":["Scarabeo Ercole Gigante","scarabeo"],"html":"<p><em>Corna enormi e carapace possente, ma per lo più tranquillo (tranne in stagione degli amori).</em></p><ul><li><strong>Tracciati</strong>: fatica 4, ferite 6, usura 6, morale 4</li><li><strong>Danno inflitto</strong>: 1-ferita e 1-fatica</li><li><strong>Istinto</strong>: Docile</li><li><strong>Tratti</strong>: Corazzato, Volante, Catapulta (corna possenti)</li><li><strong>Mosse</strong>: alzarsi in volo con ali incerte; schiantarsi contro un attaccante o una barricata; sollevare e scagliare un attaccante con le corna; correre su terreni irregolari o verticali.</li></ul><p>Marchesato e Aquile lo vorrebbero come bestia da soma: un incarico perfetto per vagabondi.</p>","text":"Corna enormi e carapace possente, ma per lo più tranquillo (tranne in stagione degli amori). - Tracciati: fatica 4, ferite 6, usura 6, morale 4 - Danno inflitto: 1-ferita e 1-fatica - Istinto: Docile - Tratti: Corazzato, Volante, Catapulta (corna possenti) - Mosse: alzarsi in volo con ali incerte; schiantarsi contro un attaccante o una barricata; sollevare e scagliare un attaccante con le corna; correre su terreni irregolari o verticali. Marchesato e Aquile lo vorrebbero come bestia da soma: un incarico perfetto per vagabondi.","back":["mostri-indice"]},{"id":"mostro-alligatore","title":"Alligatore Gigante","cat":"mostri","group":"","src":"RS p.140-141","aliases":["Alligatore Gigante","alligatore"],"html":"<p><em>Fame fatta carne: il predatore da imboscata per eccellenza, anche sulla terraferma.</em></p><ul><li><strong>Tracciati</strong>: fatica 10, ferite 8, usura 8, morale 6</li><li><strong>Danno inflitto</strong>: 3-ferite</li><li><strong>Istinto</strong>: Predatore</li><li><strong>Tratti</strong>: Acquatico, Intrappolante (fauci), Affilato (denti), Terrificante, Aggressivo</li><li><strong>Mosse</strong>: scattare con le fauci sfondando ostacoli; immergersi evitando ogni attacco; travolgere gli attaccanti sulla terraferma; dimenarsi sbranando attaccanti e spezzando legacci.</li></ul><p>Alcuni cultisti lo dicono cugino del Grande Drago. Anche i vagabondi più abili rischiano la morte.</p>","text":"Fame fatta carne: il predatore da imboscata per eccellenza, anche sulla terraferma. - Tracciati: fatica 10, ferite 8, usura 8, morale 6 - Danno inflitto: 3-ferite - Istinto: Predatore - Tratti: Acquatico, Intrappolante (fauci), Affilato (denti), Terrificante, Aggressivo - Mosse: scattare con le fauci sfondando ostacoli; immergersi evitando ogni attacco; travolgere gli attaccanti sulla terraferma; dimenarsi sbranando attaccanti e spezzando legacci. Alcuni cultisti lo dicono cugino del Grande Drago. Anche i vagabondi più abili rischiano la morte.","back":["mostri-indice"]},{"id":"mostro-pianta","title":"Pianta Carnivora Gigante","cat":"mostri","group":"","src":"RS p.142-143","aliases":["Pianta Carnivora Gigante","pianta carnivora"],"html":"<p><em>Immobile e invitante: ha attirato più di un vagabondo verso la sua fine.</em></p><ul><li><strong>Tracciati</strong>: fatica 5, ferite 4, usura 3, morale 5</li><li><strong>Danno inflitto</strong>: 1-ferita</li><li><strong>Istinto</strong>: Predatore</li><li><strong>Tratti</strong>: Radicato, Acido, Intrappolante (radici)</li><li><strong>Mosse</strong>: tagliare equipaggiamento con foglie affilate come rasoi; afferrare una creatura con i viticci e trascinarla; far inciampare con le radici; inghiottire una creatura intera nel suo calice.</li></ul><p>Un boschetto di piante lavora insieme per impedire la fuga. Ogni sua parte vale molto per il compratore giusto.</p>","text":"Immobile e invitante: ha attirato più di un vagabondo verso la sua fine. - Tracciati: fatica 5, ferite 4, usura 3, morale 5 - Danno inflitto: 1-ferita - Istinto: Predatore - Tratti: Radicato, Acido, Intrappolante (radici) - Mosse: tagliare equipaggiamento con foglie affilate come rasoi; afferrare una creatura con i viticci e trascinarla; far inciampare con le radici; inghiottire una creatura intera nel suo calice. Un boschetto di piante lavora insieme per impedire la fuga. Ogni sua parte vale molto per il compratore giusto.","back":["mostri-indice"]},{"id":"mostri-istinti","title":"Istinti dei Mostri","cat":"mostri","group":"","src":"RS p.144","aliases":["istinto","istinti","Testardo","Docile","Predatore","Protettivo"],"html":"<p>Ogni mostro ha un istinto che ne guida il comportamento:</p><ul><li><strong>Testardo</strong>: ignora le creature non minacciose, ma attacca con furia quando è arrabbiato o ferito, inseguendo la preda finché non riesce o viene respinto.</li><li><strong>Docile</strong>: ignora tutto ciò che è della sua taglia o più piccolo e fugge se seriamente minacciato; combatte solo se costretto.</li><li><strong>Predatore</strong>: cerca costantemente cibo e attacca tutto ciò che pensa di poter mangiare; se seriamente minacciato fugge.</li><li><strong>Protettivo</strong>: difende la propria tana fino alla morte; fuori casa si ritira se affrontato.</li></ul>","text":"Ogni mostro ha un istinto che ne guida il comportamento: - Testardo: ignora le creature non minacciose, ma attacca con furia quando è arrabbiato o ferito, inseguendo la preda finché non riesce o viene respinto. - Docile: ignora tutto ciò che è della sua taglia o più piccolo e fugge se seriamente minacciato; combatte solo se costretto. - Predatore: cerca costantemente cibo e attacca tutto ciò che pensa di poter mangiare; se seriamente minacciato fugge. - Protettivo: difende la propria tana fino alla morte; fuori casa si ritira se affrontato.","back":["minacce-rovine","mostri-indice","mostro-trota","creare-mostri"]},{"id":"mostri-tratti","title":"Tratti dei Mostri","cat":"mostri","group":"","src":"RS p.144-146","aliases":["tratti dei mostri","tratto","Sciame","Corazzato","Velenoso","Terrificante","Intrappolante","Mente Alveare"],"html":"<p>I mostri hanno di solito 3-5 tratti (come le etichette dell'equipaggiamento). Traduzioni non ufficiali:</p><ul><li><strong>Acido</strong>: infligge 1-usura per ogni ferita; se il bersaglio non può (o non vuole) segnare usura, subisce 1-ferita in più.</li><li><strong>Acquatico</strong>: sott'acqua non può essere bersagliato con mosse con le armi senza equipaggiamento speciale (lance, mine).</li><li><strong>Affilato</strong>: se il danno viene assorbito come usura, il bersaglio segna 1 usura in più.</li><li><strong>Aggressivo</strong>: contro bersagli che sembrano minacciosi, segna fatica infliggendo danno per +1 danno.</li><li><strong>Catapulta</strong>: chi subisce danno deve segnare fatica o essere scagliato a distanza lunga.</li><li><strong>Corazzato</strong>: ignora la prima ferita di ogni attacco riuscito (non riduce i danni al tracciato dello sciame).</li><li><strong>Fuggiasco</strong> (Afraid): quando si avvicina una fonte di paura, segna automaticamente morale.</li><li><strong>Affascinato</strong>: deve avvicinarsi all'oggetto della sua fascinazione, se possibile.</li><li><strong>Furtivo</strong>: una volta per sessione appare senza preavviso, afferra un personaggio e sparisce portandolo nella tana.</li><li><strong>Intrappolante</strong>: dopo aver ferito un bersaglio vulnerabile, segna fatica per intrappolarlo: non può cambiare distanza né usare armi a distanza finché non si libera.</li><li><strong>Mente Alveare</strong>: non subisce danni al morale; se la regina muore, la colonia si disperde nel giro di settimane.</li><li><strong>Radicato</strong>: non può muoversi.</li><li><strong>Sfuggente</strong>: per afferrarlo o trattenerlo servono almeno un piccolo gruppo e attrezzature (reti, corde, rampini).</li><li><strong>Sciame (supporto X)</strong>: oltre un piccolo gruppo (10) ottiene un tracciato sciame di 10 caselle, metà già segnate, e X d6 di supporto. Le ferite inflitte <strong>svuotano</strong> caselle dello sciame; se si svuota, lo sciame si disperde. Quando qualcosa richiama altri mostri, il GM tira un d6 dal supporto e segna metà del risultato (per eccesso), poi scarta il dado; se il tracciato si riempie, chi lo affronta viene sopraffatto (ucciso, catturato o messo in fuga). Finito il supporto non arrivano altri mostri.</li><li><strong>Spazzata</strong> (Swipe): quando ferisce un bersaglio vicino a un altro nemico, segna fatica per infliggere 2 danni anche a quello.</li><li><strong>Terrificante</strong>: per attaccarlo in mischia i vagabondi devono segnare fatica; i PNG non lo affrontano mai volontariamente, salvo in grandi gruppi.</li><li><strong>Titanico</strong>: non può essere trattenuto senza attrezzature progettate apposta.</li><li><strong>Velenoso</strong>: la prima volta in uno scontro che ferisce un bersaglio con la parte velenosa, segna fatica per infliggere anche 2-fatica.</li><li><strong>Volante</strong>: vola e si libra, attraversa qualsiasi terreno e cambia distanza rapidamente.</li></ul>","text":"I mostri hanno di solito 3-5 tratti (come le etichette dell'equipaggiamento). Traduzioni non ufficiali: - Acido: infligge 1-usura per ogni ferita; se il bersaglio non può (o non vuole) segnare usura, subisce 1-ferita in più. - Acquatico: sott'acqua non può essere bersagliato con mosse con le armi senza equipaggiamento speciale (lance, mine). - Affilato: se il danno viene assorbito come usura, il bersaglio segna 1 usura in più. - Aggressivo: contro bersagli che sembrano minacciosi, segna fatica infliggendo danno per +1 danno. - Catapulta: chi subisce danno deve segnare fatica o essere scagliato a distanza lunga. - Corazzato: ignora la prima ferita di ogni attacco riuscito (non riduce i danni al tracciato dello sciame). - Fuggiasco (Afraid): quando si avvicina una fonte di paura, segna automaticamente morale. - Affascinato: deve avvicinarsi all'oggetto della sua fascinazione, se possibile. - Furtivo: una volta per sessione appare senza preavviso, afferra un personaggio e sparisce portandolo nella tana. - Intrappolante: dopo aver ferito un bersaglio vulnerabile, segna fatica per intrappolarlo: non può cambiare distanza né usare armi a distanza finché non si libera. - Mente Alveare: non subisce danni al morale; se la regina muore, la colonia si disperde nel giro di settimane. - Radicato: non può muoversi. - Sfuggente: per afferrarlo o trattenerlo servono almeno un piccolo gruppo e attrezzature (reti, corde, rampini). - Sciame (supporto X): oltre un piccolo gruppo (10) ottiene un tracciato sciame di 10 caselle, metà già segnate, e X d6 di supporto. Le ferite inflitte svuotano caselle dello sciame; se si svuota, lo sciame si disperde. Quando qualcosa richiama altri mostri, il GM tira un d6 dal supporto e segna metà del risultato (per eccesso), poi scarta il dado; se il tracciato si riempie, chi lo affronta viene sopraffatto (ucciso, catturato o messo in fuga). Finito il supporto non arrivano altri mostri. - Spazzata (Swipe): quando ferisce un bersaglio vicino a un altro nemico, segna fatica per infliggere 2 danni anche a quello. - Terrificante: per attaccarlo in mischia i vagabondi devono segnare fatica; i PNG non lo affrontano mai volontariamente, salvo in grandi gruppi. - Titanico: non può essere trattenuto senza attrezzature progettate apposta. - Velenoso: la prima volta in uno scontro che ferisce un bersaglio con la parte velenosa, segna fatica per infliggere anche 2-fatica. - Volante: vola e si libra, attraversa qualsiasi terreno e cambia distanza rapidamente.","back":["mostri-indice","creare-mostri"]},{"id":"creare-mostri","title":"Creare Mostri","cat":"gm","group":"","src":"RS p.144-146","aliases":["creare mostri"],"html":"<ol><li><strong>Scegli una creatura</strong>: artropodi, serpenti, pesci e specie che non sono abitanti (le lucertole, per esempio, sono abitanti).</li><li><strong>Tracciati dei danni</strong> secondo la narrazione: un vagabondo ha circa 4 caselle per tipo, quindi 8 ferite = due volte più resistente. L'usura rappresenta scaglie e pelle. Gli sciami di solito non hanno morale ma Mente Alveare. Decidi il danno (di solito 1-2 ferite, di più per i mostri letali, fatica per attacchi contundenti).</li><li><strong>Un <a class=\"xl\" href=\"#mostri-istinti\" data-id=\"mostri-istinti\">istinto</a></strong>.</li><li><strong>3-5 <a class=\"xl\" href=\"#mostri-tratti\" data-id=\"mostri-tratti\">tratti</a></strong> (anche inventati).</li><li><strong>Alcune mosse del GM</strong> da usare quando i PG falliscono.</li></ol><p><em>Esempio</em>: granchio gigante — ferite 5, fatica 6, usura 3, morale 4; Protettivo; Sciame (supporto 4), Corazzato (guscio), Affilato (chela); mossa: \"serrare la chela su un arto o un'arma esposti\".</p>","text":"1. Scegli una creatura: artropodi, serpenti, pesci e specie che non sono abitanti (le lucertole, per esempio, sono abitanti). 2. Tracciati dei danni secondo la narrazione: un vagabondo ha circa 4 caselle per tipo, quindi 8 ferite = due volte più resistente. L'usura rappresenta scaglie e pelle. Gli sciami di solito non hanno morale ma Mente Alveare. Decidi il danno (di solito 1-2 ferite, di più per i mostri letali, fatica per attacchi contundenti). 3. Un istinto. 4. 3-5 tratti (anche inventati). 5. Alcune mosse del GM da usare quando i PG falliscono. Esempio: granchio gigante — ferite 5, fatica 6, usura 3, morale 4; Protettivo; Sciame (supporto 4), Corazzato (guscio), Affilato (chela); mossa: \"serrare la chela su un arto o un'arma esposti\".","back":["mostri-indice"]},{"id":"fazioni-indice","title":"Le Fazioni","cat":"indici","group":"","src":"B p.21-24, 226; VF p.9-22; RS p.6-14","aliases":["fazioni","fazione"],"html":"<p>Nei Boschi c'è sempre la fazione degli <strong>Abitanti</strong>, più 2-3 fazioni in guerra (puoi combinare quelle dei supplementi, riscrivendo la storia o facendo cadere una fazione per lasciare spazio a un'altra).</p><p><strong>Manuale base</strong>: <a class=\"xl\" href=\"#fazione-marchesato\" data-id=\"fazione-marchesato\">Il Marchesato</a>, <a class=\"xl\" href=\"#fazione-aquile\" data-id=\"fazione-aquile\">La Dinastia delle Aquile</a>, <a class=\"xl\" href=\"#fazione-alleanza\" data-id=\"fazione-alleanza\">L'Alleanza dei Boschi</a>, <a class=\"xl\" href=\"#fazione-abitanti\" data-id=\"fazione-abitanti\">Gli Abitanti</a>, e i <a class=\"xl\" href=\"#banda\" data-id=\"banda\">vagabondi</a>.</p><p><strong>Viandanti e Forestieri</strong>: <a class=\"xl\" href=\"#fazione-fiume\" data-id=\"fazione-fiume\">La Compagnia del Fiume</a>, <a class=\"xl\" href=\"#fazione-lucertole\" data-id=\"fazione-lucertole\">La Setta delle Lucertole</a>, <a class=\"xl\" href=\"#fazione-granducato\" data-id=\"fazione-granducato\">Il Granducato Sotterraneo</a>, <a class=\"xl\" href=\"#fazione-corvidi\" data-id=\"fazione-corvidi\">La Congiura dei Corvidi</a>.</p><p><strong>Rovine e Spedizioni</strong>: <a class=\"xl\" href=\"#fazione-cento\" data-id=\"fazione-cento\">L'Orda</a>, <a class=\"xl\" href=\"#fazione-custodi\" data-id=\"fazione-custodi\">I Custodi di Ferro</a>.</p><p>Regole: <a class=\"xl\" href=\"#controllo-radure\" data-id=\"controllo-radure\">Controllo delle Radure</a>, <a class=\"xl\" href=\"#tiro-fazione\" data-id=\"tiro-fazione\">Tiro Fazione</a>, <a class=\"xl\" href=\"#reputazione\" data-id=\"reputazione\">Reputazione, Prestigio e Nomea</a>, <a class=\"xl\" href=\"#reputazione-indice\" data-id=\"reputazione-indice\">mosse di reputazione</a>.</p>","text":"Nei Boschi c'è sempre la fazione degli Abitanti, più 2-3 fazioni in guerra (puoi combinare quelle dei supplementi, riscrivendo la storia o facendo cadere una fazione per lasciare spazio a un'altra). Manuale base: Il Marchesato, La Dinastia delle Aquile, L'Alleanza dei Boschi, Gli Abitanti, e i vagabondi. Viandanti e Forestieri: La Compagnia del Fiume, La Setta delle Lucertole, Il Granducato Sotterraneo, La Congiura dei Corvidi. Rovine e Spedizioni: L'Orda, I Custodi di Ferro. Regole: Controllo delle Radure, Tiro Fazione, Reputazione, Prestigio e Nomea, mosse di reputazione.","back":[]},{"id":"fazione-marchesato","title":"Il Marchesato","cat":"fazioni","group":"","src":"B p.21","aliases":["Marchesato","Marchesa de Gattis","gatti"],"html":"<p>Invasori dalla lontana <strong>Felinia</strong> guidati dalla <strong>Marchesa de Gattis</strong>. Evoluti, potenti, pragmatici e profittatori: costruiscono officine, segherie e centri di reclutamento, reclutano tra il popolo e impongono la loro cultura adattandosi a loro volta. Vogliono fare dei Boschi uno stato vassallo di Felinia, ma col tempo puntano anche a ordine, industria e prosperità.</p><ul><li><strong>Setup</strong>: fortezza in un angolo dei Boschi; controllo delle radure per distanza dalla fortezza (vedi <a class=\"xl\" href=\"#controllo-radure\" data-id=\"controllo-radure\">Controllo delle Radure</a>). Il controllo è di fatto, anche dietro un governo civile.</li><li><strong>Bonus al tiro fazione</strong>: 5+ tra radure, officine, segherie o centri di reclutamento. Beneficio speciale: <em>Industrializzare</em>; <em>Sciogliere cellule</em>.</li><li>Mossa di reputazione: <a class=\"xl\" href=\"#nuovo-progetto\" data-id=\"nuovo-progetto\">Pianificare un Nuovo Progetto (Marchesato)</a>.</li></ul>","text":"Invasori dalla lontana Felinia guidati dalla Marchesa de Gattis. Evoluti, potenti, pragmatici e profittatori: costruiscono officine, segherie e centri di reclutamento, reclutano tra il popolo e impongono la loro cultura adattandosi a loro volta. Vogliono fare dei Boschi uno stato vassallo di Felinia, ma col tempo puntano anche a ordine, industria e prosperità. - Setup: fortezza in un angolo dei Boschi; controllo delle radure per distanza dalla fortezza (vedi Controllo delle Radure). Il controllo è di fatto, anche dietro un governo civile. - Bonus al tiro fazione: 5+ tra radure, officine, segherie o centri di reclutamento. Beneficio speciale: Industrializzare; Sciogliere cellule. - Mossa di reputazione: Pianificare un Nuovo Progetto (Marchesato).","back":["fazioni-indice"]},{"id":"fazione-aquile","title":"La Dinastia delle Aquile","cat":"fazioni","group":"","src":"B p.21","aliases":["Dinastia delle Aquile","Aquile","Eyrie"],"html":"<p>Antiche reggenti dei Boschi, guidate da un monarca con una corte di visir. Inflessibili, tradizionaliste, arroganti e ambiziose: una guerra civile tra vecchi e nuovi reali le ha indebolite aprendo la strada al Marchesato. Ora vogliono riconquistare ciò che ritengono loro di diritto e ristabilire l'antico ordine.</p><ul><li><strong>Setup</strong>: Posatoio iniziale nell'angolo opposto al Marchesato; max 4 Posatoi e 6 radure. Il loro controllo è legale più che effettivo: assorbono i governi locali nella loro burocrazia.</li><li><strong>Bonus al tiro fazione</strong>: 2+ Posatoi o 4+ radure. Beneficio maggiore: <em>Costruire un Posatoio</em>.</li><li>Mossa di reputazione: <a class=\"xl\" href=\"#burocrazia\" data-id=\"burocrazia\">Manovrare la Burocrazia (Aquile)</a>. Chi è un uccello viene associato a loro.</li></ul>","text":"Antiche reggenti dei Boschi, guidate da un monarca con una corte di visir. Inflessibili, tradizionaliste, arroganti e ambiziose: una guerra civile tra vecchi e nuovi reali le ha indebolite aprendo la strada al Marchesato. Ora vogliono riconquistare ciò che ritengono loro di diritto e ristabilire l'antico ordine. - Setup: Posatoio iniziale nell'angolo opposto al Marchesato; max 4 Posatoi e 6 radure. Il loro controllo è legale più che effettivo: assorbono i governi locali nella loro burocrazia. - Bonus al tiro fazione: 2+ Posatoi o 4+ radure. Beneficio maggiore: Costruire un Posatoio. - Mossa di reputazione: Manovrare la Burocrazia (Aquile). Chi è un uccello viene associato a loro.","back":["fazioni-indice"]},{"id":"fazione-alleanza","title":"L'Alleanza dei Boschi","cat":"fazioni","group":"","src":"B p.20-22","aliases":["Alleanza dei Boschi","Alleanza"],"html":"<p>I ribelli impulsivi delle radure: avventati e disorganizzati ma volenterosi, la forza nascente dei Boschi. Vogliono rovesciare le potenze dominanti; i capi discutono su cosa costruire dopo e su quanto sacrificare gli abitanti per il \"bene superiore\". Ancora piccola, opera con cellule segrete.</p><ul><li><strong>Setup</strong>: tiro di supporto per ogni radura e poi di rivolta (vedi <a class=\"xl\" href=\"#controllo-radure\" data-id=\"controllo-radure\">Controllo delle Radure</a>); una rivolta riuscita crea una base.</li><li><strong>Bonus al tiro fazione</strong>: 3+ supporto o almeno una base. Benefici: <em>Formare cellule</em>, <em>Rivolta</em> (maggiore).</li><li>Mossa di reputazione: <a class=\"xl\" href=\"#rivolta-mossa\" data-id=\"rivolta-mossa\">Incitare alla Rivolta (Alleanza)</a>. I membri segreti fanno tirare sulla Reputazione con l'Alleanza.</li></ul>","text":"I ribelli impulsivi delle radure: avventati e disorganizzati ma volenterosi, la forza nascente dei Boschi. Vogliono rovesciare le potenze dominanti; i capi discutono su cosa costruire dopo e su quanto sacrificare gli abitanti per il \"bene superiore\". Ancora piccola, opera con cellule segrete. - Setup: tiro di supporto per ogni radura e poi di rivolta (vedi Controllo delle Radure); una rivolta riuscita crea una base. - Bonus al tiro fazione: 3+ supporto o almeno una base. Benefici: Formare cellule, Rivolta (maggiore). - Mossa di reputazione: Incitare alla Rivolta (Alleanza). I membri segreti fanno tirare sulla Reputazione con l'Alleanza.","back":["fazioni-indice"]},{"id":"fazione-abitanti","title":"Gli Abitanti","cat":"fazioni","group":"","src":"B p.22","aliases":["Abitanti","abitante","denizens"],"html":"<p>Gli abitanti comuni dei Boschi (soprattutto volpi, topi e conigli): conservatori, timidi, oppressi. Non sono una vera fazione, solo \"cittadini\" che vogliono una vita tranquilla e sicura, si informano tramite commercio e viandanti e, quando combattono, si alleano con un'altra fazione. È sempre presente in ogni campagna e i PG hanno una Reputazione con loro. Una radura può tornare <strong>non controllata</strong> (vedi <a class=\"xl\" href=\"#controllo-radure\" data-id=\"controllo-radure\">Controllo delle Radure</a>).</p>","text":"Gli abitanti comuni dei Boschi (soprattutto volpi, topi e conigli): conservatori, timidi, oppressi. Non sono una vera fazione, solo \"cittadini\" che vogliono una vita tranquilla e sicura, si informano tramite commercio e viandanti e, quando combattono, si alleano con un'altra fazione. È sempre presente in ogni campagna e i PG hanno una Reputazione con loro. Una radura può tornare non controllata (vedi Controllo delle Radure).","back":["fazioni-indice"]},{"id":"fazione-fiume","title":"La Compagnia del Fiume","cat":"fazioni","group":"","src":"VF p.9-11","aliases":["Compagnia del Fiume","Riverfolk"],"html":"<p>Una cooperativa di mercanti e mercenari che viaggia su chiatte lungo fiumi e strade, vendendo letteralmente di tutto a chi può pagare. \"Compra basso, vendi alto\" è l'unica regola: ogni capitano è socio e versa una quota. Spingono l'uso della <strong>Scrittura del Fiume</strong> (cambiali della Compagnia) come valuta. Nella Guerra vendono armi a chi si prepara e materiali a chi ricostruisce, controllano le catene di approvvigionamento creando scarsità artificiali. Le <strong>stazioni commerciali</strong> rendono le radure prospere ma dipendenti; i mercenari difendono le loro sedi.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#commercio-sancito\" data-id=\"commercio-sancito\">Commercio Sancito (Compagnia del Fiume)</a>.</p>","text":"Una cooperativa di mercanti e mercenari che viaggia su chiatte lungo fiumi e strade, vendendo letteralmente di tutto a chi può pagare. \"Compra basso, vendi alto\" è l'unica regola: ogni capitano è socio e versa una quota. Spingono l'uso della Scrittura del Fiume (cambiali della Compagnia) come valuta. Nella Guerra vendono armi a chi si prepara e materiali a chi ricostruisce, controllano le catene di approvvigionamento creando scarsità artificiali. Le stazioni commerciali rendono le radure prospere ma dipendenti; i mercenari difendono le loro sedi. Mossa di reputazione: Commercio Sancito (Compagnia del Fiume).","back":["fazioni-indice"]},{"id":"fazione-lucertole","title":"La Setta delle Lucertole","cat":"fazioni","group":"","src":"VF p.12-15","aliases":["Setta delle Lucertole","Lizard Cult","cultisti"],"html":"<p>Un culto religioso giunto dal deserto che adora il <strong>Grande Drago</strong> (o Wyrm). Accoglie emarginati, oppressi e poveri, cura i malati e offre rifugio nei suoi <strong>giardini</strong> (santuari, case e rifugi). I fedeli base (<em>cercatori</em>) vivono feste e carità; per diventare <em>accoliti</em> serve un sacrificio volontario, onorato con giorni di festa. Converte con gentilezza, ma se una radura resiste non disdegna la forza.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#predicare\" data-id=\"predicare\">Predicare ai Fedeli (Lucertole)</a>. Motivazione legata: <a class=\"xl\" href=\"#mot-devozione\" data-id=\"mot-devozione\">Devozione</a>.</p>","text":"Un culto religioso giunto dal deserto che adora il Grande Drago (o Wyrm). Accoglie emarginati, oppressi e poveri, cura i malati e offre rifugio nei suoi giardini (santuari, case e rifugi). I fedeli base (cercatori) vivono feste e carità; per diventare accoliti serve un sacrificio volontario, onorato con giorni di festa. Converte con gentilezza, ma se una radura resiste non disdegna la forza. Mossa di reputazione: Predicare ai Fedeli (Lucertole). Motivazione legata: Devozione.","back":["fazioni-indice"]},{"id":"fazione-granducato","title":"Il Granducato Sotterraneo","cat":"fazioni","group":"","src":"VF p.16-18","aliases":["Granducato Sotterraneo","Granducato","Grand Duchy","talpe"],"html":"<p>Una nazione sotterranea feudale e imperialista, con un proprio Parlamento e una politica interna complessa che spinge e frena l'espansione. È militarmente pari a Marchesato e Aquile e costruisce <strong>tunnel</strong> per colpire senza preavviso. Obiettivi: piegare i Boschi al suo dominio ed eliminare caos e disordine. Governa in modo autoritario e sfruttatore, ma garantisce una stabilità superiore alla media (aiuti rapidi contro carestie e alluvioni). Capitale: il <strong>Burrow</strong>; pochi non-talpe.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#permessi\" data-id=\"permessi\">Richiedere Permessi (Granducato)</a>.</p>","text":"Una nazione sotterranea feudale e imperialista, con un proprio Parlamento e una politica interna complessa che spinge e frena l'espansione. È militarmente pari a Marchesato e Aquile e costruisce tunnel per colpire senza preavviso. Obiettivi: piegare i Boschi al suo dominio ed eliminare caos e disordine. Governa in modo autoritario e sfruttatore, ma garantisce una stabilità superiore alla media (aiuti rapidi contro carestie e alluvioni). Capitale: il Burrow; pochi non-talpe. Mossa di reputazione: Richiedere Permessi (Granducato).","back":["fazioni-indice"]},{"id":"fazione-corvidi","title":"La Congiura dei Corvidi","cat":"fazioni","group":"","src":"VF p.19-22","aliases":["Congiura dei Corvidi","Corvidi","Corvid Conspiracy"],"html":"<p>Un'organizzazione criminale anarchica che opera in <strong>cellule</strong> segrete e si insinua ovunque: offre aiuti senza chiedere nulla, sapendo che un debito è una moneta potente; corrompe capi e soldati. Obiettivi: creare una cellula sovversiva ovunque possibile e minare ogni sistema di potere codificato (anche l'Alleanza). Usa ricatti, corruzione, intimidazione e manipolazione; non può affrontare in campo aperto le grandi potenze e non ci prova.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#reti-criminali\" data-id=\"reti-criminali\">Sfruttare le Reti Criminali (Corvidi)</a>.</p>","text":"Un'organizzazione criminale anarchica che opera in cellule segrete e si insinua ovunque: offre aiuti senza chiedere nulla, sapendo che un debito è una moneta potente; corrompe capi e soldati. Obiettivi: creare una cellula sovversiva ovunque possibile e minare ogni sistema di potere codificato (anche l'Alleanza). Usa ricatti, corruzione, intimidazione e manipolazione; non può affrontare in campo aperto le grandi potenze e non ci prova. Mossa di reputazione: Sfruttare le Reti Criminali (Corvidi).","back":["fazioni-indice"]},{"id":"fazione-cento","title":"L'Orda","cat":"fazioni","group":"","src":"RS p.6-10","aliases":["Orda","l'Orda","Signore dell'Orda","Hundreds"],"html":"<p>Una folla di veri credenti, truffatori e opportunisti al seguito di un demagogo, il misterioso <strong>Signore dell'Orda</strong> (nome del gioco da tavolo; in inglese <em>Lord of the Hundreds</em>), un ratto carismatico che promette \"giustizia\" e \"liberazione\" dalle sofferenze della Guerra. Quasi nessuna struttura interna, nessun obiettivo oltre il saccheggio e l'incendio, potere per il potere. Il simbolo è un <strong>ratto rosso</strong> dipinto nei campi profughi e sulle insegne dei briganti. Alcuni seguaci si perdono in spedizioni folli nelle rovine per portare reliquie al loro Signore.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#aizzare-folla\" data-id=\"aizzare-folla\">Aizzare la Folla (Orda)</a>.</p>","text":"Una folla di veri credenti, truffatori e opportunisti al seguito di un demagogo, il misterioso Signore dell'Orda (nome del gioco da tavolo; in inglese Lord of the Hundreds), un ratto carismatico che promette \"giustizia\" e \"liberazione\" dalle sofferenze della Guerra. Quasi nessuna struttura interna, nessun obiettivo oltre il saccheggio e l'incendio, potere per il potere. Il simbolo è un ratto rosso dipinto nei campi profughi e sulle insegne dei briganti. Alcuni seguaci si perdono in spedizioni folli nelle rovine per portare reliquie al loro Signore. Mossa di reputazione: Aizzare la Folla (Orda).","back":["fazioni-indice"]},{"id":"fazione-custodi","title":"I Custodi di Ferro","cat":"fazioni","group":"","src":"RS p.11-14","aliases":["Custodi di Ferro","Keepers in Iron"],"html":"<p>Un nobile ordine di cavalieri templari in armature magnifiche, dediti a scoprire e custodire le <a class=\"xl\" href=\"#reliquie\" data-id=\"reliquie\">Reliquie degli Antichi</a> degli Antichi (statuette fragili, tavolette misteriose, gioielli fantastici). Cavalieri solitari partono verso le rovine e spesso non tornano; i veterani sopravvissuti a molte spedizioni sono avversari formidabili. Raccontano dell'<strong>Espulsione</strong>: un antico decreto con cui i potenti dei Boschi li bandirono, tradendoli quando divennero troppo potenti. Operano da <strong>stazioni di posta</strong> che si spostano vicino alle rovine.</p><p>Mossa di reputazione: <a class=\"xl\" href=\"#custodire-reliquia\" data-id=\"custodire-reliquia\">Custodire una Reliquia (Custodi di Ferro)</a>.</p>","text":"Un nobile ordine di cavalieri templari in armature magnifiche, dediti a scoprire e custodire le Reliquie degli Antichi degli Antichi (statuette fragili, tavolette misteriose, gioielli fantastici). Cavalieri solitari partono verso le rovine e spesso non tornano; i veterani sopravvissuti a molte spedizioni sono avversari formidabili. Raccontano dell'Espulsione: un antico decreto con cui i potenti dei Boschi li bandirono, tradendoli quando divennero troppo potenti. Operano da stazioni di posta che si spostano vicino alle rovine. Mossa di reputazione: Custodire una Reliquia (Custodi di Ferro).","back":["reliquie","fazioni-indice"]},{"id":"creare-boschi","title":"Creare la Mappa dei Boschi","cat":"gm","group":"","src":"B p.226-229","aliases":["mappa dei Boschi","creare i Boschi","radure","radura"],"html":"<p>Scegli le fazioni (sempre gli Abitanti + 2-3). I Boschi hanno <strong>12 radure</strong>; puoi usare la mappa del gioco da tavolo o crearne una:</p><ol><li>Disegna una radura vicino a un angolo e tira <strong>comunità dominante</strong> (1d6: 1-2 conigli, 3-4 topi, 5-6 volpi; max 4 per specie; gli uccelli non sono mai dominanti), <strong>numero di sentieri</strong> (2d6: 2 → 1; 3-4 → 2; 5-9 → 3; 10-11 → 4; 12 → 5) e <strong>nome</strong> (2d6 sulla tabella).</li><li>Alla fine di ogni sentiero disegna una nuova radura (il sentiero di provenienza conta nel totale) e ripeti, collegando dove possibile.</li><li>Fermati a 12; i sentieri incompiuti possono restare (strade mai finite).</li></ol><p>Nomi (2d6): Boscopezza, Sottofoglia, Cavaferrosa, Fiume Appiglio, Cornospino, Vallesole, Trespolo, Borgo Mulino, Forte Quercia, Lo Snodo, Altatana, Diga di Zampanera, Casapiana, Troncocavo, Vallefuoco, Rifugio Cielaperto, Fossafredda, Riparo Ventoso.</p><p>Poi <a class=\"xl\" href=\"#controllo-radure\" data-id=\"controllo-radure\">Controllo delle Radure</a> e <a class=\"xl\" href=\"#dare-vita-radure\" data-id=\"dare-vita-radure\">Dare Vita alle Radure</a>. Con <em>Rovine e Spedizioni</em> aggiungi le <a class=\"xl\" href=\"#rovine-mappa\" data-id=\"rovine-mappa\">rovine</a> prima del controllo.</p>","text":"Scegli le fazioni (sempre gli Abitanti + 2-3). I Boschi hanno 12 radure; puoi usare la mappa del gioco da tavolo o crearne una: 1. Disegna una radura vicino a un angolo e tira comunità dominante (1d6: 1-2 conigli, 3-4 topi, 5-6 volpi; max 4 per specie; gli uccelli non sono mai dominanti), numero di sentieri (2d6: 2 → 1; 3-4 → 2; 5-9 → 3; 10-11 → 4; 12 → 5) e nome (2d6 sulla tabella). 2. Alla fine di ogni sentiero disegna una nuova radura (il sentiero di provenienza conta nel totale) e ripeti, collegando dove possibile. 3. Fermati a 12; i sentieri incompiuti possono restare (strade mai finite). Nomi (2d6): Boscopezza, Sottofoglia, Cavaferrosa, Fiume Appiglio, Cornospino, Vallesole, Trespolo, Borgo Mulino, Forte Quercia, Lo Snodo, Altatana, Diga di Zampanera, Casapiana, Troncocavo, Vallefuoco, Rifugio Cielaperto, Fossafredda, Riparo Ventoso. Poi Controllo delle Radure e Dare Vita alle Radure. Con Rovine e Spedizioni aggiungi le rovine prima del controllo.","back":[]},{"id":"controllo-radure","title":"Controllo delle Radure","cat":"gm","group":"","src":"B p.230-236","aliases":["controllo delle radure","Posatoio","fortezza","base","supporto","rivolta"],"html":"<p>Procedi nell'ordine (anche se manca qualche fazione), annotando le radure <strong>contese</strong> (passate da una fazione non-abitante a un'altra).</p><p><strong>1. Marchesato</strong>: fortezza in un angolo (1d6: NO, NE, SO, SE; ritira 5-6). Per ogni radura tira 2d6 in base ai sentieri dalla fortezza: 1 sentiero 5+; 2 sentieri 7+; 3 sentieri <span class=\"res\">10+</span>; 4 sentieri 12; 5+ mai.</p><p><strong>2. Dinastia delle Aquile</strong>: Posatoio nell'angolo opposto. Per ogni radura (tranne la fortezza) tira 2d6 dalla distanza da un qualsiasi Posatoio: 1 sentiero: 6-8 controllo, 9+ controllo e Posatoio; 2-3 sentieri: 9-10 controllo, 11+ controllo e Posatoio; 4+ mai. Max 4 Posatoi e 6 radure; possono strappare radure al Marchesato.</p><p><strong>3. Alleanza dei Boschi</strong>: supporto per ogni radura (2d6): non controllata 9+; controllata 11+; contesa 8+. Poi per ogni radura con supporto tira la rivolta finché non ne scoppia una: 10-11 rivolta (il controllo cade, base dell'Alleanza); 12 rivolta e supporto in tutte le radure collegate.</p><p><strong>4. Abitanti</strong>: per ogni radura controllata senza fortezza, Posatoio o base, tira 2d6: 11-12 diventa non controllata.</p>","text":"Procedi nell'ordine (anche se manca qualche fazione), annotando le radure contese (passate da una fazione non-abitante a un'altra). 1. Marchesato: fortezza in un angolo (1d6: NO, NE, SO, SE; ritira 5-6). Per ogni radura tira 2d6 in base ai sentieri dalla fortezza: 1 sentiero 5+; 2 sentieri 7+; 3 sentieri 10+; 4 sentieri 12; 5+ mai. 2. Dinastia delle Aquile: Posatoio nell'angolo opposto. Per ogni radura (tranne la fortezza) tira 2d6 dalla distanza da un qualsiasi Posatoio: 1 sentiero: 6-8 controllo, 9+ controllo e Posatoio; 2-3 sentieri: 9-10 controllo, 11+ controllo e Posatoio; 4+ mai. Max 4 Posatoi e 6 radure; possono strappare radure al Marchesato. 3. Alleanza dei Boschi: supporto per ogni radura (2d6): non controllata 9+; controllata 11+; contesa 8+. Poi per ogni radura con supporto tira la rivolta finché non ne scoppia una: 10-11 rivolta (il controllo cade, base dell'Alleanza); 12 rivolta e supporto in tutte le radure collegate. 4. Abitanti: per ogni radura controllata senza fortezza, Posatoio o base, tira 2d6: 11-12 diventa non controllata.","back":["fazioni-indice","fazione-marchesato","fazione-alleanza","fazione-abitanti","creare-boschi"]},{"id":"dare-vita-radure","title":"Dare Vita alle Radure","cat":"gm","group":"","src":"B p.237-238","aliases":["dare vita alle radure","situazione iniziale"],"html":"<p>Per ogni radura genera due elementi per categoria (2d6 sulle tabelle):</p><ul><li><strong>Personalità</strong>: sindaco, fabbro, capitano della guardia, capo dei ribelli, gabelliere, dottore, mercante, nobile, astronomo, bandito, mercenario, sceriffo, monaco, sicario, menestrello, giudice...</li><li><strong>Luoghi</strong>: mulino, fucina, pozzo, municipio, torre di guardia, archivio, granaio, infermeria, birrificio, mercato, monastero, taverna, locanda, caserma, ponte, diga, banca, prigione, cimitero, tribunale, acquedotto...</li><li><strong>Problemi</strong>: orso, disastro naturale, banditi, occupazione nemica, carestia, epidemia, tirannia, corruzione, ribellione, sovratassazione, sabotaggio, pregiudizio, brutalità, mafia, xenofobia, colpo di stato, scorte avvelenate, contrabbandieri, censura, strano mistero...</li></ul><p><strong>Generatore di situazioni iniziali</strong>: dove sono stati mandati (foresta tra due radure, radura più remota, più interconnessa, roccaforte di una fazione), cosa devono fare (consegnare, distruggere, rubare, riparare, neutralizzare, indagare, eliminare, spiare una minaccia, negoziare, assaltare, proteggere o sciogliere un gruppo), chi li ha ingaggiati e un paio di complicazioni.</p>","text":"Per ogni radura genera due elementi per categoria (2d6 sulle tabelle): - Personalità: sindaco, fabbro, capitano della guardia, capo dei ribelli, gabelliere, dottore, mercante, nobile, astronomo, bandito, mercenario, sceriffo, monaco, sicario, menestrello, giudice... - Luoghi: mulino, fucina, pozzo, municipio, torre di guardia, archivio, granaio, infermeria, birrificio, mercato, monastero, taverna, locanda, caserma, ponte, diga, banca, prigione, cimitero, tribunale, acquedotto... - Problemi: orso, disastro naturale, banditi, occupazione nemica, carestia, epidemia, tirannia, corruzione, ribellione, sovratassazione, sabotaggio, pregiudizio, brutalità, mafia, xenofobia, colpo di stato, scorte avvelenate, contrabbandieri, censura, strano mistero... Generatore di situazioni iniziali: dove sono stati mandati (foresta tra due radure, radura più remota, più interconnessa, roccaforte di una fazione), cosa devono fare (consegnare, distruggere, rubare, riparare, neutralizzare, indagare, eliminare, spiare una minaccia, negoziare, assaltare, proteggere o sciogliere un gruppo), chi li ha ingaggiati e un paio di complicazioni.","back":["creare-boschi"]},{"id":"tiro-fazione","title":"Tiro Fazione","cat":"gm","group":"","src":"B p.240-242","aliases":["tiro fazione","benefici minori","benefici maggiori"],"html":"<p>Quando <a class=\"xl\" href=\"#tempo-passa\" data-id=\"tempo-passa\">il tempo passa</a>, tira 2d6 per ogni fazione non-abitante, iniziando da quella con più radure:</p><ul><li>+1 se ha operato senza essere ostacolata dai PG dall'ultimo tiro</li><li>-1 se ha subito di recente un colpo dai PG</li><li>-1 se controlla la maggior parte delle radure</li><li>+1 se: <strong>Marchesato</strong> 5+ tra radure ed edifici; <strong>Aquile</strong> 2+ Posatoi o 4+ radure; <strong>Alleanza</strong> 3+ supporto o una base</li></ul><p>Con un successo ottiene una vittoria: un <strong>beneficio minore</strong>. Con <span class=\"res\">10+</span> un altro minore oppure un maggiore. Con un fallimento subisce una sconfitta: perde una radura (torna agli abitanti), una struttura o una risorsa preziosa.</p><p><strong>Benefici minori</strong>: <em>Attaccare</em> (prende una radura adiacente, o ne distrugge fortificazioni/strutture); <em>Fortificare</em> (la prossima conquista nemica toglie solo le fortificazioni); <em>Acquisire</em> una risorsa (+2 al prossimo tiro se la controlla); <em>Formare cellule</em> (Alleanza: supporto in 2 radure); <em>Sciogliere cellule</em> (Marchesato/Aquile: rimuove il supporto nelle loro radure); <em>Industrializzare</em> (Marchesato: un edificio in due radure).</p><p><strong>Benefici maggiori</strong>: <em>Rivolta</em> (Alleanza: base in una radura con supporto, rimuove le strutture altrui); <em>Costruire un Posatoio</em> (Aquile); <em>Catturare</em> una figura importante nemica (-1 ai suoi tiri fazione finché è prigioniera).</p><p><em>Viandanti e Forestieri</em> sostituisce questo sistema con la più complessa <strong>Fase delle Fazioni</strong> (VF p.177-216), con regole per tutte le fazioni; <em>Rovine e Spedizioni</em> aggiunge l'Orda e i Custodi di Ferro.</p>","text":"Quando il tempo passa, tira 2d6 per ogni fazione non-abitante, iniziando da quella con più radure: - +1 se ha operato senza essere ostacolata dai PG dall'ultimo tiro - -1 se ha subito di recente un colpo dai PG - -1 se controlla la maggior parte delle radure - +1 se: Marchesato 5+ tra radure ed edifici; Aquile 2+ Posatoi o 4+ radure; Alleanza 3+ supporto o una base Con un successo ottiene una vittoria: un beneficio minore. Con 10+ un altro minore oppure un maggiore. Con un fallimento subisce una sconfitta: perde una radura (torna agli abitanti), una struttura o una risorsa preziosa. Benefici minori: Attaccare (prende una radura adiacente, o ne distrugge fortificazioni/strutture); Fortificare (la prossima conquista nemica toglie solo le fortificazioni); Acquisire una risorsa (+2 al prossimo tiro se la controlla); Formare cellule (Alleanza: supporto in 2 radure); Sciogliere cellule (Marchesato/Aquile: rimuove il supporto nelle loro radure); Industrializzare (Marchesato: un edificio in due radure). Benefici maggiori: Rivolta (Alleanza: base in una radura con supporto, rimuove le strutture altrui); Costruire un Posatoio (Aquile); Catturare una figura importante nemica (-1 ai suoi tiri fazione finché è prigioniera). Viandanti e Forestieri sostituisce questo sistema con la più complessa Fase delle Fazioni (VF p.177-216), con regole per tutte le fazioni; Rovine e Spedizioni aggiunge l'Orda e i Custodi di Ferro.","back":["tempo-passa","fazioni-indice"]},{"id":"agenda-gm","title":"Agenda del GM","cat":"gm","group":"","src":"B p.196-198","aliases":["agenda","agenda del GM"],"html":"<p>Gli obiettivi di alto livello del GM:</p><ul><li><strong>Rendi i Boschi vasti, animati, reali</strong>: dodici radure ricche di storie; i Boschi si muovono anche se i vagabondi stanno fermi; abitanti con desideri e paure credibili.</li><li><strong>Rendi avventurose e importanti le vite dei vagabondi</strong>: sfide da grandi avventurieri e azioni che cambiano i Boschi.</li><li><strong>Gioca per scoprire cosa succede</strong>: non pianificare la trama.</li></ul><p><strong>Dì sempre</strong>: quello che i principi richiedono; quello che le regole richiedono; quello che l'onestà richiede (mai ingannare i giocatori); quello che la tua preparazione richiede (non cambiare i tracciati dei PNG a metà scena).</p><p>Vedi <a class=\"xl\" href=\"#principi-gm\" data-id=\"principi-gm\">Principi del GM</a> e <a class=\"xl\" href=\"#mosse-gm\" data-id=\"mosse-gm\">Mosse del GM</a>.</p>","text":"Gli obiettivi di alto livello del GM: - Rendi i Boschi vasti, animati, reali: dodici radure ricche di storie; i Boschi si muovono anche se i vagabondi stanno fermi; abitanti con desideri e paure credibili. - Rendi avventurose e importanti le vite dei vagabondi: sfide da grandi avventurieri e azioni che cambiano i Boschi. - Gioca per scoprire cosa succede: non pianificare la trama. Dì sempre: quello che i principi richiedono; quello che le regole richiedono; quello che l'onestà richiede (mai ingannare i giocatori); quello che la tua preparazione richiede (non cambiare i tracciati dei PNG a metà scena). Vedi Principi del GM e Mosse del GM.","back":["conversazione"]},{"id":"principi-gm","title":"Principi del GM","cat":"gm","group":"","src":"B p.199-201","aliases":["principi","principi del GM"],"html":"<ul><li>Descrivi il mondo come un dipinto vivente.</li><li>Rivolgiti ai personaggi, non ai giocatori.</li><li>Fai il tifo per i vagabondi.</li><li>Fai le tue mosse, ma nascondile nella narrazione.</li><li>A volte, delega le decisioni (usa mosse, morale e dadi).</li><li>Rendi la presenza delle fazioni ingombrante.</li><li>Fai sì che gli abitanti abbiano motivazioni e timori.</li><li>Segui il flusso degli eventi più importanti (le azioni hanno conseguenze).</li><li>Fai risaltare il loro ruolo e la loro reputazione.</li><li>Porta il pericolo in luoghi apparentemente sicuri.</li></ul>","text":"- Descrivi il mondo come un dipinto vivente. - Rivolgiti ai personaggi, non ai giocatori. - Fai il tifo per i vagabondi. - Fai le tue mosse, ma nascondile nella narrazione. - A volte, delega le decisioni (usa mosse, morale e dadi). - Rendi la presenza delle fazioni ingombrante. - Fai sì che gli abitanti abbiano motivazioni e timori. - Segui il flusso degli eventi più importanti (le azioni hanno conseguenze). - Fai risaltare il loro ruolo e la loro reputazione. - Porta il pericolo in luoghi apparentemente sicuri.","back":["agenda-gm"]},{"id":"mosse-gm","title":"Mosse del GM","cat":"gm","group":"","src":"B p.202-212","aliases":["mosse del GM","mossa del GM","opportunità d'oro","mosse aperte","mosse chiuse"],"html":"<p>Il GM fa una mossa quando i giocatori falliscono un tiro, quando gli offrono un'<strong>opportunità d'oro</strong> o quando tutti guardano lui per sapere cosa succede.</p><ul><li>Infliggi ferite, fatica, usura, consumo o morale (come stabilito).</li><li>Rivela una verità scomoda.</li><li>Mostra i segni di una minaccia imminente.</li><li>Cattura qualcuno.</li><li>Metti qualcuno all'angolo.</li><li>Ostacola i loro piani e le loro trame.</li><li>Offri loro qualcosa per ottenere ciò che vogliono.</li><li>Rivela cosa pensa di loro una fazione.</li><li>Ritorci contro di loro le loro mosse.</li><li>Attiva uno svantaggio del loro passato, reputazione o equipaggiamento.</li><li><strong>Dopo ogni mossa: \"Cosa fai?\"</strong></li></ul><p>Le mosse <strong>aperte</strong> preparano conseguenze future e lasciano reagire; le <strong>chiuse</strong> hanno effetto immediato (dopo un fallimento o un'opportunità d'oro). Varia intensità e immediatezza.</p>","text":"Il GM fa una mossa quando i giocatori falliscono un tiro, quando gli offrono un'opportunità d'oro o quando tutti guardano lui per sapere cosa succede. - Infliggi ferite, fatica, usura, consumo o morale (come stabilito). - Rivela una verità scomoda. - Mostra i segni di una minaccia imminente. - Cattura qualcuno. - Metti qualcuno all'angolo. - Ostacola i loro piani e le loro trame. - Offri loro qualcosa per ottenere ciò che vogliono. - Rivela cosa pensa di loro una fazione. - Ritorci contro di loro le loro mosse. - Attiva uno svantaggio del loro passato, reputazione o equipaggiamento. - Dopo ogni mossa: \"Cosa fai?\" Le mosse aperte preparano conseguenze future e lasciano reagire; le chiuse hanno effetto immediato (dopo un fallimento o un'opportunità d'oro). Varia intensità e immediatezza.","back":["tiro","agenda-gm"]},{"id":"pescare","title":"Pescare (regola della casa)","cat":"opzionali","group":"","src":"HR","aliases":["Pescare","pesca","Pescato"],"html":"<p>Regola della casa del vostro gruppo, costruita sul consumo (1 Pescato = svuota 1-consumo oppure circa 1-Valore in cibo o merce).</p><p><strong>Durata → Pescato potenziale</strong>: poche ore 1; 1-2 giorni 2; un paio di giorni 3; una settimana 4 (come la raccolta di <a class=\"xl\" href=\"#svuotare-tracciati\" data-id=\"svuotare-tracciati\">consumo</a>).</p><div class=\"move\"><p><strong>Quando dedichi tempo a pescare in una radura o lungo un corso d'acqua, dichiara durata e metodo, poi tira 2d6 +:</strong></p><ul><li>Canna, lenza ed esche → <strong>Destrezza</strong></li><li>Nasse, trappole o reti → <strong>Astuzia</strong></li><li>Arpione o a mani nude → <strong>Vigore</strong></li></ul></div><p>Modificatori facoltativi: +1 kit da pesca adatto; +1 se un abitante ti indica il punto giusto; -1 acque povere (siccità, gelo); -1 zona pattugliata o contesa.</p><ul><li><strong><span class=\"res\">10+</span></strong>: tutto il Pescato potenziale e 1 Bonus.</li><li><strong><span class=\"res\">7-9</span></strong>: tutto il potenziale ma 1 Guaio, oppure potenziale -1 (min 0) e 1 Bonus.</li><li><strong><span class=\"res\">6-</span></strong>: potenziale -2 (min 0); il GM introduce un Guaio forte (o 2); segna anche 1-fatica (o 1-usura sull'attrezzo).</li></ul><p><strong>Bonus</strong> (d6): 1 taglia grossa (+1 Pescato); 2 pescato pregiato (vale 2-Valore); 3 indizio nel fango verso un luogo interessante; 4 un abitante ti deve un favore; 5 silenzio e calma (svuota 1-fatica extra); 6 scorta utile (+1 a Pescare la prossima volta in questa radura).</p><p><strong>Guai</strong> (d6): 1 pattuglia o bracconieri (pressione o nomea); 2 attrezzo danneggiato (1-usura); 3 bestia o corrente (1-fatica o pericolo); 4 il pescato attira un PNG affamato che ne pretende una parte; 5 acqua cattiva (1-fatica, o -1 finché non riposi); 6 ti sei esposto: qualcuno ora sa dove siete.</p>","text":"Regola della casa del vostro gruppo, costruita sul consumo (1 Pescato = svuota 1-consumo oppure circa 1-Valore in cibo o merce). Durata → Pescato potenziale: poche ore 1; 1-2 giorni 2; un paio di giorni 3; una settimana 4 (come la raccolta di consumo). Quando dedichi tempo a pescare in una radura o lungo un corso d'acqua, dichiara durata e metodo, poi tira 2d6 +: - Canna, lenza ed esche → Destrezza - Nasse, trappole o reti → Astuzia - Arpione o a mani nude → Vigore Modificatori facoltativi: +1 kit da pesca adatto; +1 se un abitante ti indica il punto giusto; -1 acque povere (siccità, gelo); -1 zona pattugliata o contesa. - 10+: tutto il Pescato potenziale e 1 Bonus. - 7-9: tutto il potenziale ma 1 Guaio, oppure potenziale -1 (min 0) e 1 Bonus. - 6-: potenziale -2 (min 0); il GM introduce un Guaio forte (o 2); segna anche 1-fatica (o 1-usura sull'attrezzo). Bonus (d6): 1 taglia grossa (+1 Pescato); 2 pescato pregiato (vale 2-Valore); 3 indizio nel fango verso un luogo interessante; 4 un abitante ti deve un favore; 5 silenzio e calma (svuota 1-fatica extra); 6 scorta utile (+1 a Pescare la prossima volta in questa radura). Guai (d6): 1 pattuglia o bracconieri (pressione o nomea); 2 attrezzo danneggiato (1-usura); 3 bestia o corrente (1-fatica o pericolo); 4 il pescato attira un PNG affamato che ne pretende una parte; 5 acqua cattiva (1-fatica, o -1 finché non riposi); 6 ti sei esposto: qualcuno ora sa dove siete.","back":[]}];

const STOP=new Set(['oggetto','tiro','gruppo','gruppi','rovina','rovine','radura','radure','abitante','vagabondo','vagabondi','fazione','fazioni','continuo','presa','prese','mossa','mosse','legame','legami','natura','nature','danno','esplorazione','spedizione','istinto','tratto','base','carica','Grande','Spesso','Firma','Comodo','Potente','Veloce','Brutto','Lenta','Orda','Custodi','Aquile','Alleanza','Corvidi','Granducato','ape','scarabeo','calabrone','alligatore','gatti','talpe','cultisti','Protetto','Docile','Predatore','Protettivo','Testardo','Sciame','orso','combattimento','equipaggiamento','oggetto','motivazione','motivazioni','Guardiano','viaggio','pesca','reliquia','reliquie','Pescato','mostro','mostri','avanzi','avanzare']);
const terms=[];
DATA.forEach(e=>{
  const names=[e.title.replace(/\s*\(.*\)$/,'')].concat(e.aliases||[]);
  names.forEach(n=>{n=n.trim();if(n.length<4||STOP.has(n))return;terms.push({n,id:e.id,cs:/^[A-ZÀ-Ý]/.test(n)})});
});
terms.sort((a,b)=>b.n.length-a.n.length);
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const csRe=new RegExp('(?<![\\p{L}\\p{N}])('+terms.filter(t=>t.cs).map(t=>esc(t.n)).join('|')+')(?![\\p{L}\\p{N}])','gu');
const ciRe=new RegExp('(?<![\\p{L}\\p{N}])('+terms.filter(t=>!t.cs).map(t=>esc(t.n)).join('|')+')(?![\\p{L}\\p{N}])','giu');
const csMap={},ciMap={};terms.forEach(t=>{if(t.cs){if(!(t.n in csMap))csMap[t.n]=t.id}else{const k=t.n.toLowerCase();if(!(k in ciMap))ciMap[k]=t.id}});
function autolink(root,selfId){
  const used=new Set([selfId]);
  root.querySelectorAll('a.xl').forEach(a=>used.add(a.dataset.id));
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,h1,h2,th,button,.crumbs')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const text=node.nodeValue;const hits=[];
    for(const [re,map,low] of [[csRe,csMap,false],[ciRe,ciMap,true]]){re.lastIndex=0;let m;while((m=re.exec(text))){const id=map[low?m[1].toLowerCase():m[1]];if(id)hits.push({s:m.index,e:m.index+m[1].length,id})}}
    if(!hits.length)return;
    hits.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
    const frag=document.createDocumentFragment();let pos=0,changed=false;
    for(const h of hits){
      if(h.s<pos||used.has(h.id))continue;
      used.add(h.id);changed=true;
      frag.append(text.slice(pos,h.s));
      const a=document.createElement('a');a.className='wl';a.href='#'+h.id;a.dataset.id=h.id;a.textContent=text.slice(h.s,h.e);frag.append(a);pos=h.e;
    }
    if(!changed)return;frag.append(text.slice(pos));node.replaceWith(frag);
  });
}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function showSearch(q){
  const nq=norm(q.trim());if(!nq)return route();
  const words=nq.split(/\s+/);
  const res=DATA.map(e=>{const t=norm(e.title),al=norm((e.aliases||[]).join(' ')),tx=norm(e.text);let sc=0;
    for(const w of words){if(t.includes(w))sc+=10;else if(al.includes(w))sc+=7;else if(tx.includes(w))sc+=1;else return null}
    if(t.startsWith(nq))sc+=8;return {e,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,60);
  art.className='';
  art.innerHTML=`<div class="crumbs"><a class="chip" href="#">Home</a><span class="chip">Ricerca</span></div><h1>“${q.replace(/</g,'&lt;')}”</h1>
  <div class="results">${res.length?res.map(({e})=>{const i=norm(e.text).indexOf(words[0]);const st=Math.max(0,i-60);let sn=e.text.slice(st,st+180);return `<div class="r"><a href="#${e.id}" data-id="${e.id}">${e.title}</a> <span class="chip">${(secOf(e)||{}).t||''}</span><div>${st>0?'…':''}${sn.replace(/</g,'&lt;')}…</div></div>`}).join(''):'<p>Nessuna voce trovata. Prova con un altro termine (es. "fatica", "Ladro", "ragno").</p>'}</div>`;
  mainEl.scrollTop=0;
}

// ---- anteprima al passaggio
const pop=document.getElementById('pop');
document.addEventListener('mouseover',ev=>{if(matchMedia('(hover:none)').matches)return;const a=ev.target.closest('a[data-id]');if(!a||a.closest('nav')){return}const e=BY[a.dataset.id];if(!e)return;
  pop.innerHTML=`<span class="c">${(secOf(e)||{}).t||''}</span><b>${e.title}</b>${e.text.slice(0,240).replace(/</g,'&lt;')}${e.text.length>240?'…':''}`;pop.style.display='block';
  const r=a.getBoundingClientRect();const w=Math.min(340,innerWidth-24);let x=Math.min(r.left,innerWidth-w-12);let y=r.bottom+8;pop.style.left=Math.max(12,x)+'px';pop.style.top=y+'px';
  const ph=pop.offsetHeight;if(y+ph>innerHeight-8)pop.style.top=Math.max(8,r.top-ph-8)+'px';});
document.addEventListener('mouseout',ev=>{if(ev.target.closest('a[data-id]'))pop.style.display='none'});
document.addEventListener('click',()=>{pop.style.display='none'});

// ---- ricerca e tasti
const q=document.getElementById('q');let qt;
q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>showSearch(q.value),120)});
q.addEventListener('keydown',ev=>{if(ev.key==='Enter'){const f=art.querySelector('.results .r a');if(f){location.hash=f.dataset.id}}if(ev.key==='Escape'){q.value='';route()}});
document.addEventListener('keydown',ev=>{if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus()}});
const menuBtn=document.getElementById('menuBtn'),scrim=document.getElementById('scrim');
function setNav(o){nav.classList.toggle('open',o);scrim.hidden=!o;menuBtn.setAttribute('aria-expanded',o)}
menuBtn.onclick=()=>setNav(!nav.classList.contains('open'));
scrim.onclick=()=>{setNav(false);closeSheet()};
// ---- anteprima al tocco (telefono)
const small=matchMedia('(max-width:860px)'),sheet=document.getElementById('sheet');
function closeSheet(){sheet.hidden=true;if(!nav.classList.contains('open'))scrim.hidden=true}
document.getElementById('shClose').onclick=closeSheet;
document.getElementById('shGo').addEventListener('click',closeSheet);
document.addEventListener('click',ev=>{
  if(!small.matches)return;
  const a=ev.target.closest('a[data-id]');
  if(!a||a.closest('nav')||a.closest('#sheet')||a.closest('.results')||a.closest('.tiles')||a.classList.contains('chip')||a.classList.contains('go'))return;
  const e=BY[a.dataset.id];if(!e)return;
  ev.preventDefault();ev.stopPropagation();
  document.getElementById('shC').textContent=(secOf(e)||{}).t||'';
  document.getElementById('shT').textContent=e.title;
  document.getElementById('shX').textContent=e.text.slice(0,420)+(e.text.length>420?'…':'');
  document.getElementById('shGo').href='#'+e.id;
  sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;
},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeSheet();setNav(false)}});

// ---- dadi
document.getElementById('rollBtn').onclick=()=>{const m=+document.getElementById('mod').value;const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);const t=a+b+m;
  const cls=t>=10?'r-hit':t>=7?'r-mid':'r-miss';const lab=t>=12?'trionfo?':t>=10?'successo pieno':t>=7?'parziale':'fallimento';
  document.getElementById('rollOut').innerHTML=`${a}+${b}${m?(m>0?'+':'')+m:''} = <b class="${cls}">${t}</b> <span class="${cls}">${lab}</span>`};

if(matchMedia('(max-width:860px)').matches)q.placeholder='Cerca regole, mosse, mostri…';
buildNav();route();
</script>
</body>
</html>
